        put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], fc, own);
      });
      if (st.debug && t.safe && t.state === 'closed') put(tx + TILE_W - 1, ty, '*', C.cyan, own);
      if (st.kbGrid && i === st.hover && !st.busy && Math.floor(now / 280) % 2) {
        for (const [cx, cy] of [[tx, ty], [tx + TILE_W - 1, ty], [tx, ty + TILE_H - 1], [tx + TILE_W - 1, ty + TILE_H - 1]]) put(cx, cy, '#', C.cyan, own, true);
      }
    });
    for (let cell = 0; cell < lv.cols * lv.rows; cell++) {
      if (used.has(cell)) continue;
      const { tx, ty } = tileOrigin({ col: cell % lv.cols, row: Math.floor(cell / lv.cols) });
      put(tx + 3, ty + 2, '.', C.dim, 'dot');
    }
    // AFTERIMAGE: cyan corners where the last layer's real node was.
    if (has('afterimage') && lv.after && lv.after.col < lv.cols && lv.after.row < lv.rows) {
      const { tx, ty } = tileOrigin(lv.after);
      const t = lv.tiles.find(o => o.col === lv.after.col && o.row === lv.after.row);
      if (t && t.state === 'closed' && !t.hidden) {
        put(tx, ty, '+', C.cyan, 'fx', true);
        put(tx + TILE_W - 1, ty + TILE_H - 1, '+', C.cyan, 'fx', true);
      } else if (!t) put(tx + 3, ty + 2, 'o', C.cyan, 'fx');
    }
  }

  // Big boxed primary button. 3 rows, or 4 with a subtitle.
  function drawBox(ctx, y, ln) {
    const { now, put, addHit } = ctx;
    const label = ln.text, sub = ln.sub || '';
    const w = Math.max(ln.minW || 20, Math.max(label.length, sub.length) + 8);
    const x = Math.floor((L.wc - w) / 2);
    const h = sub ? 4 : 3;
    const pulse = (Math.sin(now / 420) + 1) / 2;
    const fcol = ln.disabled ? C.dim : C.cyan;
    const lcol = ln.disabled ? C.dim : pulse > 0.85 ? C.bright : C.cyan;   // a slow, gentle pulse
    if (!ln.disabled && ctx.hl) ctx.hl(x, y, w, h, ln.id);
    let edge = '+' + '='.repeat(w - 2) + '+';
    // Occasional glitch on the frame.
    if (!ln.disabled && ((now / 1000 + y * 0.37) % 3.2) < 0.07) {
      const i = 1 + Math.floor(Math.random() * (w - 2));
      edge = edge.slice(0, i) + noiseCh() + edge.slice(i + 1);
    }
    put(x, y, edge, fcol, 'ui', true);
    for (let r = 1; r < h - 1; r++) { put(x, y + r, '|', fcol, 'ui', true); put(x + w - 1, y + r, '|', fcol, 'ui', true); }
    put(x + Math.floor((w - label.length) / 2), y + 1, label, lcol, 'ui', true);
    if (sub) put(x + Math.floor((w - sub.length) / 2), y + 2, sub, C.mid, 'ui');
    put(x, y + h - 1, '+' + '='.repeat(w - 2) + '+', fcol, 'ui', true);
    if (!ln.disabled) addHit(x, y, w, h, { kind: 'btn', id: ln.id, onTap: ln.onTap });
    return h;
  }

  // Map: final node at the top, start at the bottom. Edges are dotted lines.
  const mapPos = n => {
    const mid = Math.floor(L.wc / 2);
    return { x: n.lane === 1 || n.step === 0 || n.step === MAP_STEPS - 1 ? mid : mid + (n.lane - 1) * 11, y: BOARD_Y + (MAP_STEPS - 1 - n.step) * 3 };
  };

  function buildMap(ctx) {
    const { now, put, addHit, putC } = ctx;
    const run = st.run, map = run.map;
    const avail = new Set(availableNodes());
    const nodes = Object.values(map);

    for (const n of nodes) {
      for (const id of n.next) {
        const m = map[id], a = mapPos(n), b = mapPos(m);
        const vi = run.visited.indexOf(n.id);
        const onPath = vi >= 0 && run.visited[vi + 1] === m.id;
        const live = run.at === n.id && avail.has(m.id);
        const col = onPath ? C.cyan : live ? C.mid : C.dim;
        const steps = 6;
        for (let k = 1; k < steps; k++) {
          const f = k / steps;
          put(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, '·', col, 'map');
        }
      }
    }
    for (const n of nodes) {
      const p = mapPos(n);
      const visited = run.visited.includes(n.id), available = avail.has(n.id);
      const sel = st.mapSel === n.id, hov = st.hoverNode === n.id;
      let col = visited ? C.cyan : C.dim;
      if (available) col = sel ? C.cyan : (Math.floor(now / 500) % 2 ? C.bright : C.text);
      put(p.x - 1, p.y, `[${nodeLetter(n)}]`, col, 'map');
      if (hov) ctx.bg(p.x - 1, p.y, 3, C.cyan, 0.25);
      if (sel) { put(p.x - 3, p.y, '>', C.cyan, 'map'); put(p.x + 3, p.y, '<', C.cyan, 'map'); }
      else if (run.at === n.id) put(p.x - 3, p.y, '@', C.bright, 'map');
      if (available) addHit(p.x - 1, p.y, 3, 1, { kind: 'node', id: n.id });
    }

    // Info panel under the map
    const y0 = BOARD_Y + (MAP_STEPS - 1) * 3 + 1;
    const id = st.mapSel || (avail.has(st.hoverNode) ? st.hoverNode : null);
    if (!id) {
      putC(y0 + 1, 'choose a target.', C.text, 'map');
      putC(y0 + 3, 'P S C M = corps   ! = final', C.dim, 'map');
      putC(y0 + 4, '$ = market  ? = cache  + = repair', C.dim, 'map');
      return;
    }
    const info = nodeInfo(map[id]);
    info.lines.forEach((ln, k) => putC(y0 + k, ln.text, ln.col, 'map'));
    if (st.mapSel) drawBox(ctx, y0 + info.lines.length, { text: info.action, id: 'enter', onTap: () => enterNode(map[st.mapSel]), minW: 18 });
  }

  function nodeInfo(n) {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    if (n.type === 'corp' || n.type === 'final' || n.type === 'start') {
      const d = corpDef(n.corp);
      T(n.tier ? `${d.name} // TIER ${n.tier}` : d.name, n.type === 'final' ? C.red : C.cyan);
      T(d.intel, C.text);
      const rules = corpRules(d, n.tier);
      if (rules) T(rules, C.mid);
      if (d.bossDesc) T(d.bossDesc, C.redDim);
      return { lines, action: 'B R E A C H' };
    }
    if (n.type === 'shop') { T('BLACK MARKET', C.gold); T('items and mods for credits.'); }
    if (n.type === 'cache') { T('DATA CACHE', C.gold); T('loot, then pick a mod.'); }
    if (n.type === 'repair') { T('SAFEHOUSE', C.cyan); T(`heal ${CONFIG.repairAmount}, then pick a mod.`); }
    return { lines, action: 'E N T E R' };
  }

  // Centered text screens: title, panels, help, codex, settings, game over.
  // Line types:
  //   text {text,col}           button {text,id,onTap,disabled,sel,faded}
  //   box {box,text,sub,id}     row of small buttons {row:[...]}
  //   badge {badge}             list row {list,id,onTap,sel,name,right,badge,col,tint}
  //   gap {gap:n} (empty rows)
  // Any line can have `reveal` (index) and `rarity` to pop in one at a time.
  // area: where to center the lines (default: the board area).
  function buildTextBoard(ctx, lines, area = null) {
    const { now, put, putC, addHit, bg, cells, collectHits } = ctx;
    const hl = ctx.hl || (() => {});
    const heightOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.tileInfo ? TILE_H : 1;
    const total = lines.reduce((s, ln) => s + heightOf(ln), 0);
    const top = area ? area.top : BOARD_Y, areaH = area ? area.h : L.gh;
    let y = top + Math.max(0, Math.floor((areaH - total) / 2));
    // Buttons keep their colors; hover/cursor shows as a background (see hl).
    const btnCol = b => b.disabled ? C.dim : b.sel ? C.cyan : b.faded ? C.mid : C.bright;

    for (const ln of lines) {
      const h = heightOf(ln);
      // Escalating reveal: hidden until its turn, then pops with fx scaled by rarity.
      if (ln.reveal != null) {
        const at = st.panelT0 + ln.reveal * CONFIG.revealGap;
        if (now < at) { y += h; continue; }
        const rid = ln.revealId || ('r' + ln.reveal);
        if (collectHits && !st.revealed.has(rid)) { st.revealed.add(rid); popFx(ln, y); }
      }
      const startIdx = cells.length;

      if (ln.box) drawBox(ctx, y, ln);
      else if (ln.tileInfo) {
        // A tile drawn like on the board, with text lines beside it.
        const x = Math.floor((L.wc - 34) / 2);
        const rows = ['+- - -+', ...ln.tileInfo.map(l => ':' + l + ':'), '+- - -+'];
        rows.forEach((r, k) => {
          put(x, y + k, r[0], C.mid, 'board');
          put(x + 1, y + k, r.slice(1, TILE_W - 1), k === 0 || k === rows.length - 1 ? C.mid : C.bright, 'board');
          put(x + TILE_W - 1, y + k, r[TILE_W - 1], C.mid, 'board');
        });
        ln.lines.slice(0, TILE_H).forEach((t, k) => put(x + TILE_W + 2, y + k, t.text, t.col, 'board', k === 0));
      }
      else if (ln.badge && !ln.list) {
        const m = MODS[ln.badge];
        const w = 1 + m.short.length + 2 + m.name.length;
        const x = Math.floor((L.wc - w) / 2);
        drawBadge(put, now, x, y, ln.badge, 0, { own: 'board', noCharges: true });
        put(x + 1 + m.short.length + 2, y, m.name, modColor(m), 'board', true);
      } else if (ln.list) {
        const LW = 32, x = Math.floor((L.wc - LW) / 2);
        const hov = st.hoverBtn === ln.id;
        if (ln.tint) bg(x, y, LW, ln.tint, ln.sel ? 0.3 : 0.1);
        if (hov) bg(x, y, LW, C.cyan, 0.2);
        put(x, y, ln.sel ? '>' : ' ', C.cyan, 'ui', true);
        let cx = x + 2;
        if (ln.badge) { drawBadge(put, now, cx, y, ln.badge, 1, { own: 'board', noCharges: true }); cx += 5; }
        put(cx, y, ln.name, ln.faded ? C.mid : (ln.col || C.bright), 'ui', !!ln.sel);
        if (ln.right) put(x + LW - ln.right.length, y, ln.right, ln.faded ? C.dim : (ln.rightCol || C.mid), 'ui');
        if (!ln.disabled) addHit(x, y, LW, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.row) {
        const gap = ln.gap != null ? ln.gap : 2;
        const w = ln.row.reduce((s, b) => s + b.text.length, 0) + (ln.row.length - 1) * gap;
        let x = Math.floor((L.wc - w) / 2);
        ln.row.forEach((b, bi) => {
          if (!b.id) { put(x, y, b.text, b.col || C.dim, 'board'); x += b.text.length + gap; return; }   // plain text
          if (b.sel) bg(x, y, b.text.length, C.cyan, 0.22);
          // The > marker only where there's room for it: the first item, or wide gaps.
          if (!b.disabled) hl(x, y, b.text.length, 1, b.id, bi === 0 || gap >= 3);
          put(x, y, b.text, btnCol(b), 'ui', !!b.sel);
          if (!b.disabled) addHit(x, y, b.text.length, 1, { kind: 'btn', id: b.id, onTap: b.onTap });
          x += b.text.length + gap;
        });
      } else if (ln.id) {
        const x = Math.floor((L.wc - ln.text.length) / 2);
        if (!ln.disabled) hl(x, y, ln.text.length, 1, ln.id);
        put(x, y, ln.text, btnCol(ln), 'ui');
        if (!ln.disabled) addHit(x, y, ln.text.length, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.text) {
        const x = Math.floor((L.wc - ln.text.length) / 2);
        if (ln.colorAt) {
          // Per-character colors (used by the title art).
          for (let i = 0; i < ln.text.length; i++) if (ln.text[i] !== ' ') put(x + i, y, ln.text[i], ln.colorAt(i), 'board', !!ln.bold);
        } else put(x, y, ln.text, ln.col, 'board', !!ln.bold);
      }

      // Glitch-in right after a reveal.
      if (ln.reveal != null) {
        const age = now - (st.panelT0 + ln.reveal * CONFIG.revealGap);
        if (age < 180) for (let i = startIdx; i < cells.length; i++) if (Math.random() < 0.55) cells[i].ch = noiseCh();
      }
      y += h;
    }
  }

  // Pop effect for an offer appearing: sound + burst scaled by rarity.
  function popFx(ln, y) {
    const lvl = ln.rarity ? RARITY[ln.rarity].lvl : 0;
    Sound.pop(lvl);
    if (ln.seenKey) markSeen(ln.seenKey);
    if (lvl < 2) return;
    const col = rarityCol(ln.rarity);
    const n = [0, 0, 8, 16, 22][lvl];
    const fake = [];
    for (let i = 0; i < n; i++) fake.push({ ch: noiseCh(), x: pxX(rand(L.wc * 0.2, L.wc * 0.8)), y: pxY(y), col });
    explode(fake, pxX(L.wc / 2), pxY(y + 0.5), { power: lvl >= 3 ? 0.55 : 0.35, grav: 0.4, life: [0.3, 0.7] });
    if (lvl >= 3) { flash(col, 0.12, 0.3); shake(lvl >= 4 ? 4 : 2, 0.25); }
  }

  // ---------------- Screens built from lines ----------------
  const LOGO = [
    ' ___  ___  _____  _   ',
    '| _ )| __||_   _|/_\\  ',
    '| _ \\| _|   | | / _ \\ ',
    '|___/|___|  |_|/_/ \\_\\',
  ];

  // Title cover art: a face, half human (left) and half circuitry (right).
  // Each row: [left half, divider, right half].
  const COVER = [
    ['            _.-~', '~', '~~~~-._'],
    ["         .-'   .", '|', " [#]  '-."],
    ["       .'    .' ", '|', "  |  +--o'."],
    ['      /     /   ', '|', '  +--+    \\'],
    ['     |   .-""-. ', '|', ' [@@]=+    |'],
    ['     |  ( (o)  )', '|', '  ||  |    |'],
    ["     |   '-..-' ", '|', ' o++o |    |'],
    ['     |     )    ', '|', '  ||  +=   |'],
    ['     |    (_    ', '|', ' ++==++    |'],
    ['      \\    __   ', '|', ' [====]   /'],
    ["       \\  '--'  ", '|', '   ||    /'],
    ["        '.      ", '|', "  o--  .'"],
    ["          '-._  ", '|', "   _.-'"],
    ["              '-", '~', "-'"],
  ];
  const COVER_W = 16 + 1 + 14;

  // Cover art lines with a little life: the eye blinks, the circuit eye scans,
  // a scanline drifts down, and now and then a row glitches sideways.
  function coverLines(now) {
    const t = now / 1000;
    const blink = (t % 4.3) < 0.14;
    const scanEye = ['@@', '@ ', ' @', '@@'][Math.floor(t * 3) % 4];
    const scanRow = Math.floor(now / 140) % (COVER.length + 6);
    const glitchRow = (t % 3.1) < 0.12 ? Math.floor(t * 7) % COVER.length : -1;
    return COVER.map(([l, mid, r], row) => {
      let left = l.padEnd(16), right = r.padEnd(14);
      if (blink) left = left.replace('(o)', '(-)');
      right = right.replace('@@', scanEye);
      let text = left + mid + right;
      if (row === glitchRow) text = (' ' + text.slice(0, -1)).replace(/[^ ]/g, ch => Math.random() < 0.25 ? noiseCh() : ch);
      const lit = row === scanRow;
      return {
        text, bold: lit,
        colorAt: i => lit ? C.bright : i < 16 ? C.text : i === 16 ? C.dim : C.cyan,
      };
    });
  }

  function titleLines(now) {
    const lines = [];
    const T = (text, col = C.text, extra = {}) => lines.push(Object.assign({ text, col }, extra));
    lines.push(...coverLines(now));
    T('');
    // Logo with an occasional glitch.
    LOGO.forEach((l, i) => {
      let s = l;
      if (((now / 1000 + i * 0.9) % 4.5) < 0.09) s = s.replace(/[^ ]/g, ch => Math.random() < 0.3 ? noiseCh() : ch);
      T(s, C.cyan, { bold: true });
    });
    T('R   U   N   N   E   R', C.bright, { bold: true });
    T('network intrusion // prototype', C.dim);
    T('');
    lines.push({ box: true, text: 'J A C K   I N', sub: '- start a run -', id: 'start', onTap: jackIn, minW: 26 });
    T('');
    lines.push({ row: [
      { text: '[ HOW TO PLAY ]', id: 'help', onTap: () => swapTo(openHelp) },
      { text: '[ CODEX ]', id: 'codex', onTap: () => swapTo(openCodex) },
    ] });
    lines.push({ row: [
      { text: '[ SETTINGS ]', id: 'settings', onTap: () => swapTo(openSettings) },
      { text: '[ MULTIPLAYER ]', id: 'mp', onTap: () => swapTo(openMultiplayer) },
    ] });
    T('');
    { const prof = profile(); lines.push({ text: `[ ${logoMark(prof.logo)} ${prof.name} ]`, id: 'profile', onTap: () => swapTo(openProfile) }); }
    T(`best ${pad2(save.best)}   runs ${save.runs}   wins ${save.wins}`, C.mid);
    // Seed: tap to roll a new one.
    lines.push({ gap: 1, row: [
      { text: 'seed' },
      { text: `[${st.seed.slice(0, 10)}]`, id: 'seed', onTap: rerollSeed },
      ...(st.practice ? [{ text: 'practice', col: C.redDim }] : []),
    ] });
    return lines;
  }

  function overLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const r = st.result;
    if (r.win) {
      // An unlocked padlock.
      for (const l of ['     .---.     ', '    /  _  \\    ', '    | | | |    ', '    | |        ', ' +===========+ ', ' |  R O O T  | ', ' +===========+ ']) {
        lines.push({ text: l, col: C.gold, bold: true });
      }
      T('');
      lines.push({ text: 'ROOT ACCESS GRANTED', col: C.cyan, bold: true });
      { const prof = profile(); T(`runner ${logoMark(prof.logo)} ${prof.name}`, C.mid); }
      T('OMNI//CORE is yours.', C.text);
      T('');
      T(`layers ${pad2(r.depth)}  corps ${r.corps}  cr ${r.earned}`, C.bright);
      if (r.newBest) T('** new best **', C.cyan);
      else T(`best ${pad2(save.best)}   seed ${r.seed}`, C.mid);
      if (r.practice) T('practice run: not scored', C.redDim);
      T('');
      lines.push({ box: true, text: 'N E W   R U N', id: 'new', onTap: newRun, minW: 24 });
      lines.push({ text: '[ RETRY SEED ]', id: 'retry', onTap: retry });
      lines.push({ text: '[ BACK ]', id: 'title', onTap: () => swapTo(showTitle) });
      return lines;
    }
    T('CONNECTION TERMINATED', C.red);
    { const prof = profile(); T(`runner ${logoMark(prof.logo)} ${prof.name}`, C.mid); }
    T('');
    T(`layers ${pad2(r.depth)}   corps ${r.corps}`, C.bright);
    T(`credits earned ${r.earned}`, C.gold);
    if (r.newBest) T('** new best **', C.cyan);
    else T(`best ${pad2(save.best)}`, C.mid);
    if (r.practice) T('practice run: not scored', C.redDim);
    T('');
    T(`seed ${r.seed}`, C.mid);
    T('');
    lines.push({ box: true, text: 'N E W   R U N', id: 'new', onTap: newRun, minW: 24 });
    T('');
    lines.push({ text: '[ RETRY SEED ]', id: 'retry', onTap: retry });
    lines.push({ text: '[ BACK ]', id: 'title', onTap: () => swapTo(showTitle) });
    T('');
    T('retry = practice, not scored', C.dim);
    return lines;
  }

  function panelLines() {
    const now = performance.now();
    if (st.mode === 'title') return titleLines(now);
    if (st.mode === 'over' && st.result) return overLines();
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    if (st.mode === 'panel' && st.panelFn) st.panelFn(T, B, ln => lines.push(ln), lines);
    return lines;
  }

  // ---------------- Render loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateParts(dt);
    updateTimer(dt);
    stepPaletteFade(now);
    if (st.mp) { mpWatchdog(now); mpClockTick(now); }
    if (st.wipe && st.wipe.endsAt && now > st.wipe.endsAt) st.wipe = null;
    render(now);
    requestAnimationFrame(frame);
  }

  function render(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.bg;
    g.fillRect(0, 0, W, H);
    const sk = (now - shakeFx.t0) / 1000;
    if (sk < shakeFx.dur) {
      const a = shakeFx.amp * (1 - sk / shakeFx.dur);
      g.translate(rand(-a, a), rand(-a, a));
    }
    hits = [];
    const cells = buildScene(now, true);
    for (const b of bgs) {
      g.globalAlpha = b.alpha;
      g.fillStyle = b.col;
      g.fillRect(L.ox + b.cx * L.cw, L.oy + b.cy * L.chh, b.w * L.cw, L.chh);
    }
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const bold of [false, true]) {
      g.font = `${bold ? DRAW_FONT.bold : DRAW_FONT.weight} ${L.fs * DRAW_FONT.scale}px ${DRAW_FONT.family}`;
      for (const c of cells) {
        if (!!c.bold !== bold) continue;
        g.fillStyle = c.col;
        g.fillText(c.ch, pxX(c.cx), pxY(c.cy));
      }
    }
    g.font = `${DRAW_FONT.weight} ${L.fs * DRAW_FONT.scale}px ${DRAW_FONT.family}`;
    for (const p of parts) {
      if (p.t < 0) continue;
      g.globalAlpha = Math.max(0, p.alpha);
      g.fillStyle = p.col;
      if (p.rot) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillText(p.ch, 0, 0); g.restore(); }
      else g.fillText(p.ch, p.x, p.y);
    }
    g.globalAlpha = 1;
    const fk = (now - flashFx.t0) / 1000;
    if (fk < flashFx.dur) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalAlpha = flashFx.a * (1 - fk / flashFx.dur);
      g.fillStyle = flashFx.col;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }
  }

  // ---------------- Helpers ----------------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function setMsg(msg, col = C.text) { st.msg = msg; st.msgCol = col; st.msgT = performance.now(); }
  const candidates = () => st.lv ? st.lv.tiles.filter(t => t.state === 'closed' && !t.loaded && !t.ruledOut) : [];

  function availableNodes() {
    const run = st.run;
    if (!run) return [];
    // Dev "free travel": every node except the one you're on.
    if (st.freeTravel) return Object.keys(run.map).filter(id => id !== run.at && id !== '0:1');
    return run.at ? run.map[run.at].next : ['0:1'];
  }

  function showBoard(mode) {
    st.mode = mode;
    st.selItem = -1; st.selMod = -1;
    st.kbFocus = null; st.keyHandler = null; st.scroll = null;
    st.hideBoard = false; st.hideAll = false;
    computeLayout();
    wipeIn();
  }

  // Wipe the board out, then open the next screen (which wipes in).
  async function swapTo(openFn, level = 0) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(level);
    st.transitioning = false;
    openFn();
  }

  // ---------------- Run flow ----------------
  function showTitle() {
    st.run = null; st.corp = null; st.lv = null; st.timer = null;
    st.panelFn = null;
    scenePalette(null);
    showBoard('title');
    st.busy = false;
    setMsg('> link ready_');
  }

  function rerollSeed() {
    st.seed = newSeed();
    st.practice = false;
    Sound.ui();
    setMsg('> new seed rolled.');
  }

  async function startRun(seed, practice) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(0);
    st.seed = seed; st.practice = practice;
    st.run = {
      seed, practice,
      map: genMap(seed),
      finalTell: pickR(['corner', 'mark', 'mirror'], rngFor(seed, 'final')),
      at: '0:1', visited: ['0:1'],
      integrity: CONFIG.startIntegrity, maxInt: CONFIG.startIntegrity, shield: 0,
      credits: 0, earned: 0, items: CONFIG.startItems.slice(), mods: [],
      beltSlots: CONFIG.beltSlots, charges: {}, reroutes: 0,
      depth: 0, corps: 0,
    };
    for (const k of CONFIG.startItems) markSeen(k);
    st.result = null;
    st.transitioning = false;
    // Straight into the public net; the map comes after.
    startCorp(st.run.map['0:1']);
  }

  function toMap() {
    st.corp = null; st.lv = null; st.timer = null;
    scenePalette(null);
    st.mapSel = null; st.hoverNode = null;
    showBoard('map');
    st.busy = false;
    setMsg('> choose your next target.');
  }

  function selectNode(id) {
    if (st.transitioning || !availableNodes().includes(id)) return;
    if (st.mapSel === id) return enterNode(st.run.map[id]);
    st.mapSel = id;
    Sound.ui();
  }

  async function enterNode(node, warp = false) {
    if (st.transitioning || !node || (!warp && !availableNodes().includes(node.id))) return;
    st.transitioning = true;
    const run = st.run;
    await wipeOut(0);
    run.at = node.id;
    run.visited.push(node.id);
    st.transitioning = false;
    if (node.type === 'shop') return openShop(node);
    if (node.type === 'cache') return openCache(node);
    if (node.type === 'repair') return openRepair(node);
    startCorp(node);
  }

  async function startCorp(node, startIdx = 0) {
    const def = corpDef(node.corp);
    const t = node.tier;
    const counts = node.type === 'start' ? [1] : [t + 1, t + 2, t + 3, t + 4];
    let tell = node.type === 'final' ? st.run.finalTell : def.tell;
    if (tell === 'mirror' && t >= 2) tell = 'vmirror';   // deeper Mirrorlines mirror top-bottom
    let mark = null;
    if (tell === 'mark') {
      const level = clamp(t, 1, 3);
      mark = { level, glyph: level === 1 ? pickR(MOTIFS, rngFor(st.run.seed, 'sigil', node.id)) : null };
    }
    st.corp = {
      def, node, tier: t, idx: Math.min(startIdx, counts.length - 1), counts,
      hasBoss: node.type !== 'start',
      tell, mark,
      timer: corpTimer(def, t), pay: corpPay(def, t),
      prevSafe: null,
    };
    // Corps use their own colors; the public net uses the player's.
    scenePalette(node.type === 'start' ? null : def.key);
    // A short boot-up screen first (skipped for dev boss jumps).
    if (st.corp.hasBoss) markSeen('corp_' + def.key);   // codex: corp found
    if (st.corp.hasBoss && startIdx === 0) await corpIntro();
    enterLayer();
  }

  // Corp intro: art, name, quote, a few boot lines. Tap or any key skips.
  async function corpIntro() {
    const c = st.corp, def = c.def;
    const art = CORP_ART[def.key] || [];
    const artW = Math.max(0, ...art.map(l => l.length));
    const rules = corpRules(def, c.tier);
    const boot = [
      [`> connecting to ${def.name.toLowerCase().replace(/[^a-z/]+/g, '.')}`, C.mid],
      ['> handshake ............... ok', C.mid],
      [`> mapping ${c.counts.length - 1} layers + boss .... ok`, C.mid],
      ['> ICE detected ............ yes', C.red],
    ];
    st.intro = { skip: false };
    openPanel(def.name, (T, B, X) => {
      for (const l of art) T(l.padEnd(artW), C.cyan);
      T('');
      X({ text: def.name, col: C.bright, bold: true });
      T(c.tier ? `TIER ${c.tier}` : '', C.mid);
      T(def.intel, C.text);
      T(rules, C.mid);
      T('');
      boot.forEach(([text, col], i) => X({ text: text.padEnd(31), col, reveal: i, revealId: 'boot' + i }));
      T('');
      T(Math.floor(performance.now() / 500) % 2 ? 'tap to skip' : '', C.dim);
    }, `> breaching ${def.name.toLowerCase()}...`);
    st.busy = true;
    const t0 = performance.now();
    const hold = CONFIG.introHold + (st.wipe ? st.wipe.dur : 0);
    while (performance.now() - t0 < hold && !st.intro.skip) await wait(40);
    st.intro = null;
    await wipeOut(0);
  }

  async function enterLayer() {
    const c = st.corp, run = st.run;
    const n = c.counts[c.idx];
    const boss = c.hasBoss && c.idx === c.counts.length - 1;
    let tell = c.tell;
    if (boss && c.def.bossTell) tell = c.def.bossTell;
    const lv = genLayer({ seed: run.seed, nodeId: c.node.id, idx: c.idx, n, tell, prevSafe: c.prevSafe, loot: !boss && c.hasBoss, mark: c.mark });
    lv.after = c.prevSafe;       // last layer's real node, for AFTERIMAGE
    c.prevSafe = lv.safeCell;
    lv.payCut = 0; lv.ocCount = 0;
    lv.boss = boss;
    lv.misses = 0;
    lv.split = false;
    lv.dmg = boss && c.def.bossDmg ? c.def.bossDmg : 1;
    if (boss && c.def.bossFlash) lv.maskAt = performance.now() + 450 + CONFIG.maskDelayMs;
    st.lv = lv;
    st.hover = -1;
    run.depth++;
    // Codex: every glyph that shows up on a board counts as found.
    for (const t of lv.tiles) {
      const gi = MOTIFS.indexOf(t.glyph);
      if (gi >= 0) markSeen('g' + gi);
      if (t.loaded) markSeen('gloot');
      if (t.marked) markSeen('gsig');
    }
    if (n === 1) markSeen('gjack');
    if (lv.maskAt) markSeen('gmask');
    st.timer = makeTimer();
    showBoard('play');
    st.busy = true;
    if (boss) { Sound.boss(); shake(5, 0.5); setMsg(`> BOSS LAYER. ${n} nodes.`, C.red); }
    else { Sound.layer(run.depth); setMsg(n === 1 ? '> one node. it is real. jack in.' : `> ${n} nodes. one is real.`); }
    await wait(480);
    // Layer-start mods, each locks at most one ICE node.
    const iceWhere = f => lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed' && f(t));
    const starts = [
      ['sniffer', () => true],
      ['corners', t => (t.col === 0 || t.col === lv.cols - 1) && (t.row === 0 || t.row === lv.rows - 1)],
      ['sigscan', t => t.marked],
    ];
    for (const [key, f] of starts) {
      if (!has(key) || n < 2) continue;
      const opts = iceWhere(f);
      if (!opts.length) continue;
      lockTile(pickR(opts, rngFor(run.seed, key, c.node.id, c.idx)), C.mid, key);
      setMsg(`> ${MODS[key].name.toLowerCase()}: 1 ICE locked.`, C.mid);
      await wait(250);
    }
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // Clock for this layer: the corp's own, or one added by OVERCLOCK.
  function makeTimer() {
    const c = st.corp, lv = st.lv;
    let max = c.timer || (has('overclock') && c.hasBoss ? CONFIG.overclockClock : 0);
    if (!max) return null;
    if (lv && lv.boss && c.def.bossShrink) max = Math.max(3, max - 3 * lv.misses);
    if (has('coolant')) max += 3;
    return { max, left: max, lastSec: max, ocNext: CONFIG.overclockStart };
  }

  // Lock a trap tile without damage (sniffer, purge).
  // source: what locked it (purge, burner, sniffer, corners, sigscan, echo, overclock).
  function lockTile(t, col, source = 'purge') {
    const i = st.lv.tiles.indexOf(t);
    const { x, y } = tileCenter(t);
    explode(snapshot(c => c.own === 't' + i), x, y, { col, power: 0.6 });
    t.state = 'locked';
    t.lockedBy = source;
    Sound.shield();
  }

  function updateTimer(dt) {
    const tm = st.timer;
    if (!tm || st.mode !== 'play' || st.busy || st.transitioning || st.dev || st.pause) return;
    tm.left -= dt;
    const sec = Math.ceil(tm.left);
    if (sec < tm.lastSec) { tm.lastSec = sec; if (sec <= 3 && sec > 0) Sound.clock(); }
    // OVERCLOCK: near the end, purge ICE one by one; each purge cuts the payout.
    const lv = st.lv;
    if (has('overclock') && tm.left <= tm.ocNext && tm.left > 0.5 && lv.ocCount < 3) {
      tm.ocNext -= 2;
      const opts = lv.tiles.filter(t => !t.safe && t.state === 'closed');
      if (opts.length > 0 && candidates().length > 1) {
        lockTile(opts[Math.floor(Math.random() * opts.length)], C.mid, 'overclock');
        lv.ocCount++;
        lv.payCut = Math.min(0.9, lv.payCut + CONFIG.overclockCut);
        setMsg(`> overclock: purged 1. pay -${Math.round(lv.payCut * 100)}%`, C.mid);
      }
    }
    if (tm.left <= 0) {
      tm.left = 0;
      const opts = candidates().length ? candidates() : st.lv.tiles.filter(t => t.state === 'closed');
      const t = opts[Math.floor(Math.random() * opts.length)];
      setMsg('> clock ran out.', C.red);
      if (t) pick(st.lv.tiles.indexOf(t));
    }
  }

  function resetTimer() {
    if (!st.timer) return;
    st.timer = makeTimer();
  }

  async function pick(i) {
    if (st.mp) return mpTap(i);
    if (st.mode !== 'play' || st.busy) return;
    const t = st.lv.tiles[i];
    if (!t || t.state !== 'closed') return;
    st.busy = true;
    st.selItem = -1; st.selMod = -1;
    st.lv.fast = st.lv.readyAt != null && performance.now() - st.lv.readyAt < CONFIG.fastpayMs;
    t.probing = true;
    Sound.probe();
    setMsg('> probing...', C.mid);
    await wait(300);
    t.probing = false;
    if (t.safe) await onSafe(t);
    else await onTrap(t, i);
  }

  function payFor(lv) {
    const c = st.corp;
    let base = 4 + 2 * lv.n;
    if (lv.boss) base *= 3;
    let mult = c.pay || 1;
    if (lv.misses === 0 && lv.n > 1) mult *= 1 + 0.5 * (lv.n - 1);
    if (has('skimmer')) mult *= 1.5;
    if (has('fastpay') && lv.fast) mult *= 1.5;
    mult *= 1 - (lv.payCut || 0);
    return lv.n === 1 ? 0 : Math.round(base * mult);
  }

  async function onSafe(t) {
    const run = st.run, lv = st.lv, c = st.corp;
    t.state = 'safe';
    const perfect = lv.misses === 0 && lv.n > 1;
    const pay = payFor(lv);
    run.credits += pay; run.earned += pay;
    let healed = false;
    if (perfect && run.integrity < run.maxInt) { run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.perfectHeal); healed = true; }
    Sound.safe();
    flash(C.cyan, 0.12, 0.3);
    let msg = perfect ? '> perfect.' : '> access granted.';
    if (pay) msg += ` +${pay}cr`;
    if (healed) msg += ' +1 int';
    setMsg(msg, C.cyan);
    await wait(380);
    // Success wipe: the real node stays lit while the fill rises. Bigger for perfect / boss.
    const i = lv.tiles.indexOf(t);
    const lit = buildScene(performance.now(), false, true).filter(cl => cl.own === 't' + i);
    await wipeOut(perfect || lv.boss ? 2 : 1, lit);
    c.idx++;
    if (c.idx < c.counts.length) return enterLayer();
    // Corp finished
    if (c.node.type === 'start') return openStartReward(c.node);
    run.corps++;
    corpStat(c.def.key).breached++; persist();   // codex record
    if (c.node.type === 'final') return endRun(true);
    openReward(c.node);
  }

  async function onTrap(t, i) {
    const run = st.run, lv = st.lv;
    lv.misses++;
    t.state = 'locked';
    t.lockedBy = 'hit';
    t.hitAt = performance.now();
    let msg;
    if (st.god) {
      Sound.shield();
      msg = '> ICE. god mode: no damage.';
    } else if (t.loaded && has('forgery')) {
      Sound.shield();
      msg = '> $ node. forgery: no damage.';
    } else if (has('bulwark') && !st.corp.bulwarkUsed) {
      st.corp.bulwarkUsed = true;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. bulwark blocked it.';
    } else if (run.shield > 0) {
      run.shield--;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. firewall absorbed it.';
    } else {
      run.integrity -= lv.dmg;
      Sound.trap();
      shake(9);
      flash(C.red, 0.18, 0.35);
      msg = run.integrity > 0 ? `> ICE. integrity -${lv.dmg}.` : '> ICE. integrity gone.';
    }
    if (t.loaded) msg += ' ' + grantLoot(rngFor(run.seed, 'loot', st.corp.node.id, st.corp.idx), st.corp.tier);
    if (has('tracer')) {
      const s = lv.tiles[lv.safe];
      t.dist = Math.abs(s.col - t.col) + Math.abs(s.row - t.row);
    }
    setMsg(msg, t.loaded ? C.gold : C.red);
    await wait(450);
    if (run.integrity <= 0) return die();
    // ECHO: the mirror-image node locks too, if it's ICE.
    if (has('echo')) {
      const mc = lv.cols - 1 - t.col;
      const m = lv.tiles.find(o => o.col === mc && o.row === t.row && o !== t && o.state === 'closed' && !o.safe);
      if (m) { lockTile(m, C.mid, 'echo'); await wait(200); }
    }
    resetTimer();
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // Credits or an item. Returns a short text for the message line.
  function grantLoot(r, tier) {
    const run = st.run;
    Sound.loot();
    if (r() < 0.4 && run.items.length < run.beltSlots) {
      const key = pickR(Object.keys(ITEMS), r);
      run.items.push(key);
      markSeen(key);
      return `got ${ITEMS[key].name}.`;
    }
    const cr = Math.round(12 + tier * 8 + r() * 12);
    run.credits += cr; run.earned += cr;
    return `+${cr}cr`;
  }

  async function die() {
    if (st.corp && st.corp.hasBoss) { corpStat(st.corp.def.key).lost++; persist(); }   // codex record
    st.busy = true;
    st.timer = null;
    const safeTile = st.lv.tiles[st.lv.safe];
    if (safeTile.state === 'closed') safeTile.state = 'reveal';
    setMsg('> traced. real node revealed.', C.red);
    Sound.death();
    await wait(1100);
    await endRun(false);
  }

  async function endRun(win) {
    const run = st.run;
    st.busy = true;
    st.timer = null;
    if (!win) {
      // Losing: the whole screen glitches out.
      const cells = snapshot(() => true);
      st.hideAll = true;
      st.wipe = null;
      glitchOut(cells); flash(C.red, 0.2, 0.4);
      await wait(1400);
    }
    // Winning: the final boss's success wipe carries straight into the results screen.

    const newBest = !run.practice && run.depth > save.best;
    if (!run.practice) {
      save.runs++;
      if (win) save.wins++;
      if (newBest) save.best = run.depth;
    }
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();

    st.result = { win, depth: run.depth, corps: run.corps, earned: run.earned, newBest, practice: run.practice, seed: run.seed };
    st.corp = null; st.lv = null;
    scenePalette(null);
    showBoard('over');
    st.busy = false;
    setMsg(win ? '> root access_' : '> link severed_', win ? C.cyan : C.red);
    if (win) { Sound.victory(); flash(C.cyan, 0.25, 0.8); shake(6, 0.5); fireworkShow(); }
  }

  const jackIn = () => startRun(st.seed, st.practice);
  const retry = () => startRun(st.result ? st.result.seed : st.seed, true);
  const newRun = () => startRun(newSeed(), false);

  // ---------------- Panels ----------------
  function openPanel(title, fn, msg) {
    st.panelTitle = title;
    st.panelFn = fn;
    st.revealed = new Set();
    showBoard('panel');
    st.panelT0 = performance.now() + (st.wipe ? st.wipe.dur : 0) + CONFIG.revealDelay;
    st.busy = false;
    if (msg) setMsg(msg);
  }

  async function leavePanel() {
    if (st.transitioning) return;
    await swapTo(toMap);
  }

  function addMod(key) {
    const run = st.run;
    if (run.mods.includes(key)) return;
    run.mods.push(key);
    markSeen(key);
    const m = MODS[key];
    if (key === 'buffer') { run.maxInt++; run.integrity++; }
    if (key === 'stash') run.beltSlots++;
    if (m.charges) run.charges[key] = m.charges;
  }

  // Up to k mods from a pool that the player doesn't have yet.
  function pickMods(r, pool, k, exclude = []) {
    return shuffle(pool.filter(key => !st.run.mods.includes(key) && !exclude.includes(key)), r).slice(0, k);
  }

  const priceOf = o => o.kind === 'repair' ? o.price : Math.round(o.price * (has('haggle') ? 0.75 : 1));
  const SEP = '+ - - - - - - - - - - - - - - - +';

  function openShop(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'shop', node.id);
    const itemKeys = shuffle(Object.keys(ITEMS), r).slice(0, 3);
    let offers = itemKeys.map(k => ({ kind: 'item', key: k, price: ITEMS[k].price, sold: false }));
    for (const k of pickMods(r, modsOfKind('gen', 'minor'), 2)) offers.push({ kind: 'mod', key: k, price: MODS[k].price, sold: false });
    offers = shuffle(offers, r);   // random order: any slot could be the good one
    offers.push({ kind: 'repair', key: 'repair', price: 20, sold: false });

    const buy = o => {
      const price = priceOf(o);
      if (o.sold || run.credits < price) return Sound.deny();
      if (o.kind === 'item') { if (run.items.length >= run.beltSlots) return Sound.deny(); run.items.push(o.key); o.sold = true; markSeen(o.key); }
      if (o.kind === 'mod') { addMod(o.key); o.sold = true; }
      if (o.kind === 'repair') { if (run.integrity >= run.maxInt) return Sound.deny(); run.integrity++; }
      run.credits -= price;
      Sound.buy();
      setMsg(`> bought ${o.kind === 'repair' ? 'repair' : (o.kind === 'item' ? ITEMS[o.key] : MODS[o.key]).name.toLowerCase()}.`, C.gold);
    };

    let sel = 0;
    const defOf = o => o.kind === 'item' ? ITEMS[o.key] : o.kind === 'mod' ? MODS[o.key] : { name: 'REPAIR', desc: 'restore 1 integrity.' };
    const whyNot = o => {
      if (o.sold) return 'sold out.';
      if (o.kind === 'item' && run.items.length >= run.beltSlots) return 'item belt is full.';
      if (o.kind === 'repair' && run.integrity >= run.maxInt) return 'integrity is full.';
      if (run.credits < priceOf(o)) return 'not enough credits.';
      return null;
    };

    openPanel('BLACK MARKET', (T, B, X) => {
      const now = performance.now();
      T('BLACK MARKET', C.gold);
      T(`credits ${run.credits}${has('haggle') ? '  (haggle -25%)' : ''}`, C.gold);
      T('');
      offers.forEach((o, k) => {
        const def = defOf(o);
        const isMod = o.kind === 'mod';
        const price = o.sold ? 'SOLD' : `${priceOf(o)}cr`;
        const tag = isMod ? 'mod' : o.kind === 'item' ? 'item' : 'svc';
        X({
          list: true, id: 'offer' + k, onTap: () => { sel = k; Sound.tick(); },
          sel: k === sel, faded: !!whyNot(o),
          badge: isMod ? o.key : null, name: def.name,
          col: isMod ? modColor(def) : C.bright,
          right: `${tag} ${price.padStart(5)}`, rightCol: C.gold,
          tint: isMod ? modColor(def) : o.kind === 'item' ? C.mid : C.cyan,
          reveal: k, revealId: 'offer' + k,
          rarity: isMod ? def.rarity : null, seenKey: o.kind === 'repair' ? null : o.key,
        });
      });
      T('');
      // Details box for the selected offer (once it has popped in).
      const o = offers[sel], def = defOf(o), why = whyNot(o);
      const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
      // Fixed height (7 rows) so the layout never jumps while offers pop in.
      T(SEP, C.dim);
      if (!shown) { T('...', C.dim); for (let i = 0; i < 6; i++) T(''); }
      else {
        if (o.kind === 'mod') { X({ badge: o.key }); T(`${RARITY[def.rarity].label} mod`, modColor(def)); }
        else { T(def.name, C.bright); T(o.kind === 'item' ? 'item // single use' : 'service', C.mid); }
        T(o.kind === 'mod' ? def.tip : def.desc, C.text);
        if (why) { T(''); T(why, C.redDim); T(''); T(''); }
        else X({ box: true, text: 'B U Y', sub: `${priceOf(o)}cr`, id: 'buy', onTap: () => buy(o), minW: 18 });
      }
      T(SEP, C.dim);
      B('[ LEAVE ]', 'leave', leavePanel);
    }, '> the market is open.');
  }

  // A reward screen: header lines, then a list of mods to pick one from (or skip).
  function openChoice({ title, col, head = [], options, skipLabel, onSkip, msg }) {
    let sel = 0;
    const take = key => {
      if (st.transitioning) return;
      if (key) { addMod(key); Sound.buy(); setMsg(`> installed ${MODS[key].name.toLowerCase()}.`, C.cyan); }
      else if (onSkip) onSkip();
      leavePanel();
    };
    openPanel(title, (T, B, X) => {
      const now = performance.now();
      T(title, col);
      for (const h of head) T(h[0], h[1]);
      T('');
      if (options.length) T(options.length > 1 ? 'choose one mod:' : 'mod found:', C.mid);
      options.forEach((k, i) => {
        const m = MODS[k];
        X({
          list: true, id: 'opt' + i, onTap: () => { sel = i; Sound.tick(); },
          sel: i === sel, badge: k, name: m.name, col: modColor(m),
          right: RARITY[m.rarity].label, rightCol: modColor(m), tint: modColor(m),
          reveal: i, revealId: 'opt' + i, rarity: m.rarity, seenKey: k,
        });
      });
      if (options.length) {
        T('');
        const k = options[sel], m = MODS[k];
        const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
        T(SEP, C.dim);
        if (shown) {
          X({ badge: k });
          T(m.tip, C.text);
          X({ box: true, text: 'T A K E', id: 'take', onTap: () => take(k), minW: 18 });
        } else { T('...', C.dim); T(''); T(''); T(''); T(''); }
        T(SEP, C.dim);
      }
      T('');
      B(options.length && skipLabel ? skipLabel : '[ CONTINUE ]', 'skip', () => take(null));
    }, msg);
  }

  // PUBLIC NET done: a small starting perk.
  function openStartReward(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'choice', node.id);
    openChoice({
      title: 'LINK ESTABLISHED', col: C.cyan,
      head: [['you are in. pick a starter perk.', C.text]],
      options: pickMods(r, modsOfKind('minor'), 3),
      skipLabel: '[ SKIP  +15cr ]',
      onSkip: () => { run.credits += 15; run.earned += 15; },
      msg: '> link established.',
    });
  }

  function openCache(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'cache', node.id);
    const got = [grantLoot(r, 2)];
    if (has('cachekey')) got.push(grantLoot(r, 2));
    openChoice({
      title: 'DATA CACHE', col: C.gold,
      head: got.map(g => [g, C.bright]),
      options: pickMods(r, modsOfKind('gen', 'minor'), 2),
      skipLabel: '[ SKIP ]',
      msg: '> cache cracked.',
    });
  }

  function openRepair(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'rest', node.id);
    const before = run.integrity;
    run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.repairAmount);
    Sound.buy();
    openChoice({
      title: 'SAFEHOUSE', col: C.cyan,
      head: [[`integrity +${run.integrity - before}`, C.bright]],
      options: pickMods(r, modsOfKind('minor'), 2),
      skipLabel: '[ SKIP ]',
      msg: '> patched up.',
    });
  }

  // Corp boss beaten: one corp-specific mod plus one general mod.
  function openReward(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'reward', node.id);
    const def = corpDef(node.corp);
    const corpPick = pickMods(r, def.mods || [], 1);
    const options = shuffle(corpPick.concat(pickMods(r, modsOfKind('gen'), 1, corpPick)), r);
    Sound.win();
    openChoice({
      title: 'CORP BREACHED', col: C.cyan,
      head: [[def.name, C.text]],
      options,
      skipLabel: '[ SKIP  +20cr ]',
      onSkip: () => { run.credits += 20; run.earned += 20; Sound.loot(); },
      msg: '> corp breached.',
    });
  }

  // ---------------- How to play ----------------
  const HELP_PAGES = [
    { title: 'THE BASICS', tab: 'BASIC', lines: [
      ['each layer hides ONE real node.'], ['every other node is ICE.'], [''],
      ['hit ICE: lose integrity.'], ['integrity at 0: you are traced.'], [''],
      ['first-try pick = PERFECT:', 'cyan'], ['+1 integrity, bigger payout.'], [''],
      ['ODDS = your chance if you guess.', 'mid'], ['beat the odds: read the tell.', 'mid'], [''],
      ['$ nodes: always ICE, drop loot.', 'gold'],
    ] },
    { title: 'THE NET', tab: 'NET', lines: [
      ['climb the map from the bottom.'], ['pick a route. reach the top.'], [''],
      ['P S C M  corps: 3 layers + boss ', 'cyan'], ['!        OMNI//CORE, the final  ', 'red'],
      ['$ market   ? cache   + safehouse', 'gold'], ['every stop gives you a mod.'], [''],
      ['each corp hides the real node'], ['its own way: its TELL.'], ['the map quote is a hint.', 'mid'],
      ['bosses twist it. deeper corps'], ['hide it harder.'], [''],
      ['beat a corp to log its tell', 'cyan'], ['in the CODEX.', 'cyan'],
    ] },
    { title: 'THE TRAY', tab: 'TRAY', lines: [
      ['the bottom of the screen.'], [''],
      ['MODS last the whole run.', 'cyan'], ['some are tap-to-use.'], [''],
      ['ITEMS are single use.', 'bright'], ['you start with one PURGE.'], [''],
      ['tap a mod or item: info.'], ['tap it again: use it.'], [''],
      ['desktop: hover for info,', 'mid'], ['number keys use items.', 'mid'],
    ] },
    { title: 'MOD RARITY', tab: 'TIERS', rarity: true },
  ];

  function openHelp() {
    let page = 0;
    const show = i => { page = (i + HELP_PAGES.length) % HELP_PAGES.length; st.boardStart = performance.now(); Sound.tick(); };
    const go = d => show(page + d);
    const CONTENT_ROWS = 18;   // every tab uses the same height, so the tabs never jump
    openPanel('HOW TO PLAY', (T, B, X, lines) => {
      const p = HELP_PAGES[page];
      T('HOW TO PLAY', C.cyan);
      X({ gap: 1, row: HELP_PAGES.map((hp, i) => ({ text: `[${hp.tab}]`, id: 'htab' + i, sel: i === page, onTap: () => show(i) })) });
      T(SEP, C.dim);
      const start = lines.length;
      T(p.title, C.bright);
      T('');
      if (p.lines) for (const [text, col] of p.lines) T(text, col ? C[col] : C.text);
      if (p.corps) {
        for (const d of [CORPS.perimeter, CORPS.sigil, CORPS.chronos, CORPS.mirror, FINAL]) {
          T(`${d.letter}  ${d.name}`.padEnd(34), d.key === 'omni' ? C.red : C.cyan);
          T(d.intel.padEnd(34), C.text);
          const rules = corpRules(d, 1);
          if (rules) T(rules.padEnd(34), C.mid);
          if (d !== FINAL) T('');
        }
      }
      if (p.rarity) {
        T('mods come in five tiers:');
        T('');
        const ex = { common: 'small perks.', rare: 'solid upgrades.', epic: 'build-defining.', exotic: 'rare and strange.', boss: 'only from corp bosses.' };
        for (const r of Object.keys(RARITY)) { T(`${RARITY[r].label.padEnd(7)} ${ex[r]}`.padEnd(30), C[r]); }
        T('');
        T('rarer mods pop in louder.', C.mid);
      }
      while (lines.length - start < CONTENT_ROWS) T('');
      T(SEP, C.dim);
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> manual loaded.');
    // Keys: left/right or 1-5 = tabs, esc = back.
    st.keyHandler = k => {
      const focusTab = () => { st.kbFocus = st.hoverBtn = 'htab' + page; };   // cursor follows the active tab
      if (k === 'arrowleft') { go(-1); focusTab(); return true; }
      if (k === 'arrowright') { go(1); focusTab(); return true; }
      if (/^[1-9]$/.test(k) && Number(k) <= HELP_PAGES.length) { show(Number(k) - 1); focusTab(); return true; }
      if (k === 'escape') { swapTo(showTitle); return true; }
      return false;
    };
  }

  // ---------------- Codex ----------------
  const RARITY_ORDER = Object.keys(RARITY);
  const codexMods = () => Object.keys(MODS).sort((a, b) => RARITY_ORDER.indexOf(MODS[a].rarity) - RARITY_ORDER.indexOf(MODS[b].rarity) || MODS[a].name.localeCompare(MODS[b].name));
  const CODEX_ROWS = 10;   // height of the list window, including "more" rows

  function wrapText(str, w) {
    const lines = [];
    let cur = '';
    for (const word of str.split(' ')) {
      if (cur && (cur + ' ' + word).length > w) { lines.push(cur); cur = word; }
      else cur = cur ? cur + ' ' + word : word;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Which entries fit in the list window when it starts at `top`.
  // A "more" row takes a slot at the top/bottom when there are entries that way.
  function listWindow(top, n, rows = CODEX_ROWS) {
    const hasUp = top > 0;
    let shown = rows - (hasUp ? 1 : 0);
    const hasDown = top + shown < n;
    if (hasDown) shown -= 1;
    return { hasUp, hasDown, shown: Math.min(shown, n - top) };
  }
  const maxTop = (n, rows = CODEX_ROWS) => n <= rows ? 0 : n - (rows - 1);

  function openCodex() {
    const TABS = [['mods', 'MODS', 'tabm'], ['items', 'ITEMS', 'tabi'], ['glyphs', 'GLYPHS', 'tabg'], ['corps', 'CORPS', 'tabc']];
    let tab = 'mods', sel = 0, top = 0, shownPal = null;
    const entries = () => tab === 'mods' ? codexMods() : tab === 'items' ? Object.keys(ITEMS)
      : tab === 'glyphs' ? GLYPHS.map(gl => gl.key) : CODEX_CORPS.map(k => 'corp_' + k);
    // Corps: a short list and a taller details box.
    const rowsFor = () => tab === 'corps' ? 5 : CODEX_ROWS;
    const setTab = name => { tab = name; sel = 0; top = 0; Sound.tick(); };
    const scrollBy = d => { const n = entries().length; const t = clamp(top + d, 0, maxTop(n, rowsFor())); if (t !== top) { top = t; Sound.tick(); } };
    // Keep the selected entry inside the list window.
    const follow = () => {
      const n = entries().length, rows = rowsFor();
      for (let i = 0; i < 4; i++) {
        const w = listWindow(top, n, rows);
        if (sel < top) top = sel;
        else if (sel >= top + w.shown) top = sel - w.shown + 1;
        else break;
        top = clamp(top, 0, maxTop(n, rows));
      }
    };

    openPanel('CODEX', (T, B, X) => {
      const list = entries(), n = list.length, rows = rowsFor();
      sel = clamp(sel, 0, n - 1);
      top = clamp(top, 0, maxTop(n, rows));
      const found = list.filter(k => save.seen[k]).length;
      T(`CODEX  ${tab} ${found}/${n} found`, C.cyan);
      X({ gap: 1, row: TABS.map(([name, label, id]) => ({ text: `[${label}]`, id, sel: tab === name, onTap: () => setTab(name) })) });

      // Details of the selected entry (5 rows; 10 for corps).
      T(SEP, C.dim);
      const k = list[sel], seen = !!save.seen[k];
      // A found corp is shown in its own palette (if corp colors are on).
      const palKey = tab === 'corps' && seen ? k.slice(5) : null;
      if (palKey !== shownPal) { shownPal = palKey; scenePalette(palKey); }
      if (tab === 'corps') {
        const key = k.slice(5), d = corpDef(key), rec = corpStat(key);
        const pad = (arr, nRows) => { while (arr.length < nRows) arr.push(''); return arr.slice(0, nRows); };
        if (!seen) {
          T('???', C.dim); T('not found yet.', C.mid); T('enter it on the map to log it.', C.dim);
          for (let i = 0; i < 7; i++) T('');
        } else {
          X({ text: `${d.letter}  ${d.name}`, col: key === 'omni' ? C.red : C.cyan, bold: true });
          T(d.intel, C.text);
          T(corpRules(d, 1), C.mid);
          T(d.bossDesc || '', C.redDim);
          T('');
          // The tell only appears once you've beaten this corp.
          const tell = rec.breached ? pad(wrapText('tell: ' + CORP_TELL[key], 34), 3)
            : ['tell: ???', 'beat this corp to log its tell.', ''];
          tell.forEach((t, i) => T(t, rec.breached ? C.cyan : i === 0 ? C.mid : C.dim));
          T(d.mods ? `mods: ${d.mods.map(m => MODS[m].name).join(', ')}` : 'mods: none', C.mid);
          T(`breached ${rec.breached}   lost ${rec.lost}`, C.text);
        }
      } else if (tab === 'glyphs') {
        const gl = GLYPH_BY_KEY[k];
        X({ tileInfo: seen ? gl.glyphOf() : MASK_GLYPH, lines: seen
          ? [{ text: gl.name, col: C.cyan }, ...gl.lore.map(t => ({ text: t, col: C.text }))]
          : [{ text: '???', col: C.dim }, { text: 'not found yet.', col: C.mid }, { text: 'it shows up on a board.', col: C.dim }] });
      } else if (!seen) {
        T('???', C.dim); T('not found yet.', C.mid);
        T(tab === 'mods' ? 'find it in a run to unlock it.' : 'pick one up to unlock it.', C.dim);
        T(''); T('');
      } else if (tab === 'mods') {
        const m = MODS[k];
        const kind = m.kind === 'corp' ? 'corp mod' : m.kind === 'minor' ? 'minor mod' : 'mod';
        X({ badge: k });
        T(`${RARITY[m.rarity].label} // ${kind}${m.active ? ' // tap-to-use' : ''}`, modColor(m));
        const d = wrapText(m.desc, 34);
        T(d[0] || '', C.text); T(d[1] || '', C.text);
        T(modWhere(m), C.mid);
      } else {
        const it = ITEMS[k];
        T(it.name, C.bright); T('item // single use', C.mid);
        const d = wrapText(it.desc, 34);
        T(d[0] || '', C.text); T(d[1] || '', C.text);
        T(`from: ${ITEM_WHERE}`, C.mid);
      }
      T(SEP, C.dim);

      // The list window, with "more" rows when there are entries above/below.
      const w = listWindow(top, n, rows);
      let used = 0;
      if (w.hasUp) { X({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', id: 'moreup', onTap: () => scrollBy(-1) }); used++; }
      for (let idx = top; idx < top + w.shown; idx++) {
        const key = list[idx], seenK = !!save.seen[key];
        const base = { list: true, id: 'cx' + idx, onTap: () => { sel = idx; Sound.tick(); }, sel: idx === sel };
        if (tab === 'glyphs') {
          X(Object.assign(base, { name: seenK ? GLYPH_BY_KEY[key].name : '???', col: seenK ? C.bright : C.dim, right: `#${pad2(idx + 1)}`, rightCol: C.mid }));
        } else if (tab === 'corps') {
          const ck = key.slice(5), d = corpDef(ck), rec = corpStat(ck);
          X(Object.assign(base, {
            name: seenK ? `${d.letter}  ${d.name}` : '???', col: seenK ? C.bright : C.dim,
            right: rec.breached ? 'BREACHED' : seenK ? 'SEEN' : '', rightCol: rec.breached ? C.cyan : C.mid,
          }));
        } else {
          const isMod = tab === 'mods';
          const def = isMod ? MODS[key] : ITEMS[key];
          X(Object.assign(base, {
            badge: isMod && seenK ? key : null,
            name: seenK ? def.name : '???', col: seenK ? (isMod ? modColor(def) : C.bright) : C.dim,
            right: isMod ? (seenK ? RARITY[def.rarity].label : '') : 'item', rightCol: seenK && isMod ? modColor(def) : C.mid,
            tint: seenK && isMod ? modColor(def) : null,
          }));
        }
        used++;
      }
      if (w.hasDown) { X({ text: '[ v v v  more  v v v ]', id: 'moredn', onTap: () => scrollBy(1) }); used++; }
      for (; used < rows; used++) T('');
      T(`${pad2(top + 1)}-${pad2(top + w.shown)} of ${n}`, C.dim);
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> codex open.');

    // Keys: left/right = tabs, up/down = move through the list, esc = back.
    st.keyHandler = k => {
      if (k === 'arrowleft' || k === 'arrowright') {
        const i = TABS.findIndex(t => t[0] === tab);
        const next = TABS[(i + (k === 'arrowright' ? 1 : TABS.length - 1)) % TABS.length];
        setTab(next[0]);
        st.kbFocus = st.hoverBtn = next[2];   // cursor follows the active tab
        return true;
      }
      if (k === 'arrowup' || k === 'arrowdown') {
        sel = clamp(sel + (k === 'arrowdown' ? 1 : -1), 0, entries().length - 1);
        follow();
        Sound.tick();
        return true;
      }
      if (k === 'escape') { swapTo(showTitle); return true; }
      return false;
    };
    st.scroll = scrollBy;   // mouse wheel and swipe
  }

  // ---------------- Settings ----------------
  function openSettings() {
    st.resetArmed = false;
    openPanel('SETTINGS', (T, B, X) => {
      T('SETTINGS', C.cyan);
      T('');
      B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
      B(`[ corp colors: ${save.corpColors ? 'ON ' : 'OFF'} ]`, 'ccol', toggleCorpColors);
      B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'fx', toggleEffects);
      B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'tap', toggleTapMode);
      T('');
      audioLines(X, 's_');
      T('');
      T(`next run seed: ${st.seed}${st.practice ? ' (practice)' : ''}`, C.text);
      X({ row: [
        { text: '[ NEW SEED ]', id: 'rseed', onTap: rerollSeed },
        { text: '[ ENTER SEED ]', id: 'eseed', onTap: enterSeed },
      ] });
      T('');
      B(st.resetArmed ? '[ TAP AGAIN TO ERASE ]' : '[ reset save data ]', 'reset', resetSave);
      if (st.resetArmed) T('erases best, runs, codex.', C.red);
      T('');
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> settings.');
    st.keyHandler = k => { if (k === 'escape') { swapTo(showTitle); return true; } return false; };
  }

  function enterSeed() {
    let s = null;
    try { s = window.prompt('enter a seed (letters and numbers):', st.seed); } catch (e) { s = null; }
    const clean = cleanSeed(s);
    if (!clean) return Sound.deny();
    st.seed = clean;
    st.practice = true;     // a chosen seed is a practice run
    Sound.ui();
    setMsg(`> seed set: ${clean}`);
  }

  function resetSave() {
    if (!st.resetArmed) { st.resetArmed = true; Sound.deny(); return; }
    const keep = { palette: save.palette, muted: save.muted, effects: save.effects, tapMode: save.tapMode };
    for (const k of Object.keys(save)) delete save[k];
    Object.assign(save, freshSave(), keep);
    persist();
    st.resetArmed = false;
    Sound.buy();
    setMsg('> save data erased.', C.red);
  }

  // ---------------- Active mods ----------------
  function modCharges(key) {
    const m = MODS[key], run = st.run;
    if (!m || !m.active || !run) return null;
    if (m.charges) return run.charges[key] || 0;
    if (key === 'burner') return st.mode === 'play' && st.corp && st.corp.hasBoss ? (st.corp.burnerUsed ? 0 : 1) : null;
    return null;
  }

  function nodesAhead() {
    const run = st.run, cur = run.map[run.at];
    return Object.values(run.map).filter(n => n.step > cur.step && n.step < MAP_STEPS - 1);
  }

  function modUsable(key) {
    const m = MODS[key], run = st.run;
    if (!m || !m.active || !run || st.transitioning || st.dev || st.wipe) return false;
    if (m.active === 'layer') {
      if (st.mode !== 'play' || st.busy || !st.lv || !st.corp || !st.corp.hasBoss) return false;
      if (key === 'burner') return !st.corp.burnerUsed && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    }
    if (m.active === 'map') return st.mode === 'map' && (run.charges[key] || 0) > 0 && nodesAhead().length > 0;
    return false;
  }

  function activateMod(key) {
    const run = st.run;
    if (!modUsable(key)) { Sound.deny(); return; }
    st.selMod = -1;
    if (key === 'burner') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      lockTile(pickR(opts, rngFor(run.seed, 'burner', st.corp.node.id, st.corp.idx)), C.cyan, 'burner');
      st.corp.burnerUsed = true;
      setMsg('> burner: 1 ICE locked.', C.cyan);
    }
    if (key === 'reroute') {
      run.charges.reroute--;
      rerouteMap();
      st.mapSel = null;
      st.boardStart = performance.now();
      Sound.whoosh();
      setMsg('> rerouted. the net shifts.', C.cyan);
    }
    if (key === 'wormhole') {
      run.charges.wormhole--;
      const ahead = nodesAhead();
      const target = pickR(ahead, rngFor(run.seed, 'wormhole', run.at));
      setMsg('> wormhole open...', C.cyan);
      enterNode(target, true);
    }
  }

  // Re-roll the type and corp of every node ahead (links stay the same).
  function rerouteMap() {
    const run = st.run;
    const r = rngFor(run.seed, 'reroute', run.reroutes++);
    const corps = Object.keys(CORPS);
    for (const n of nodesAhead()) {
      const roll = r();
      n.type = roll < 0.6 ? 'corp' : roll < 0.75 ? 'cache' : roll < 0.88 ? 'repair' : 'shop';
      if (n.type === 'corp') { n.corp = pickR(corps, r); n.tier = n.step <= 2 ? 1 : 2; }
      else { delete n.corp; delete n.tier; }
    }
  }

  // ---------------- Items ----------------
  function canUse(key) {
    const run = st.run;
    if (!run || st.wipe) return false;
    if (key === 'patch') return run.integrity < run.maxInt;
    if (key === 'wall') return true;
    const inLayer = st.mode === 'play' && !st.busy && st.lv;
    if (key === 'purge') return !!inLayer && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    if (key === 'split') return !!inLayer && !st.lv.split && candidates().length > 1;
    return false;
  }

  function useItem(slot) {
    const run = st.run;
    if (!run || st.transitioning) return;
    const key = run.items[slot];
    if (!key) return;
    if (!canUse(key)) { Sound.deny(); return; }
    run.items.splice(slot, 1);
    st.hoverItem = -1; st.selItem = -1;
    if (key === 'patch') { run.integrity++; Sound.buy(); setMsg('> patched. +1 int', C.cyan); }
    if (key === 'wall') { run.shield++; Sound.shield(); setMsg('> firewall up.', C.cyan); }
    if (key === 'purge') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      const r = rngFor(run.seed, 'purge', st.corp.node.id, st.corp.idx, lv.tiles.filter(t => t.state === 'locked').length);
      lockTile(pickR(opts, r), C.cyan, 'purge');
      setMsg('> purged one ICE node.', C.cyan);
    }
    if (key === 'split') {
      const lv = st.lv, s = lv.tiles[lv.safe];
      const vertical = rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx)() < 0.5;
      for (const t of lv.tiles) {
        const sameHalf = vertical ? (t.col < lv.cols / 2) === (s.col < lv.cols / 2) : (t.row < lv.rows / 2) === (s.row < lv.rows / 2);
        if (!sameHalf) t.ruledOut = true;
      }
      lv.split = true;
      Sound.shield();
      setMsg(`> split: it is in the ${vertical ? (s.col < lv.cols / 2 ? 'left' : 'right') : (s.row < lv.rows / 2 ? 'top' : 'bottom')} half.`, C.cyan);
    }
  }

  function toggleMute() {
    save.muted = !save.muted;
    persist();
    Sound.levels();
    Sound.ui();
  }

  function cyclePalette() {
    const keys = playerPalettes();
    save.palette = keys[(keys.indexOf(save.palette) + 1) % keys.length];
    refreshPalette();
    persist();
    Sound.ui();
  }

  // The palette for what's on screen: inside a corp, that corp's own (if corp colors
  // are on); everywhere else, the player's palette from settings.
  function scenePalette(corpKey) {
    const ck = corpKey && save.corpColors ? 'c_' + corpKey : null;
    applyPalette(ck && PALETTES[ck] ? ck : save.palette);
  }
  const refreshPalette = () => scenePalette(st.corp && st.corp.hasBoss ? st.corp.def.key : null);
  const toggleCorpColors = () => { save.corpColors = !save.corpColors; persist(); refreshPalette(); Sound.ui(); };

  // ---------------- Pause menu ----------------
  // [MENU] in the header or Esc during a run. Stops clocks. Abandon goes to the title.
  function togglePause() {
    if (st.dev) return;
    if (!st.pause && (!st.run || st.busy || st.transitioning || st.wipe)) { Sound.deny(); return; }
    st.pause = !st.pause;
    st.abandonArmed = false;
    st.kbFocus = null;
    st.boardStart = performance.now();
    Sound.ui();
  }

  const toggleEffects = () => { save.effects = save.effects === 'full' ? 'reduced' : 'full'; persist(); Sound.ui(); };
  const toggleTapMode = () => { save.tapMode = save.tapMode === 'two' ? 'one' : 'two'; persist(); Sound.ui(); };

  // Audio controls (settings + pause menu): on/off and an 8-step volume bar each.
  const toggleMusic = () => { save.musicOn = !save.musicOn; persist(); Sound.levels(); Sound.ui(); };
  const nudgeVol = (k, d) => { save[k] = clamp(Math.round((save[k] + d) * 8) / 8, 0, 1); persist(); Sound.levels(); Sound.ui(); };
  const volBar = v => '#'.repeat(Math.round(v * 8)) + '-'.repeat(8 - Math.round(v * 8));
  function audioLines(X, prefix) {
    X({ text: `[ music: ${save.musicOn ? 'ON ' : 'OFF'} ]`, id: prefix + 'mus', onTap: toggleMusic });
    X({ gap: 1, row: [
      { text: 'vol' }, { text: '[-]', id: prefix + 'mvd', onTap: () => nudgeVol('musicVol', -1 / 8) },
      { text: volBar(save.musicVol), col: save.musicOn ? C.cyan : C.dim },
      { text: '[+]', id: prefix + 'mvu', onTap: () => nudgeVol('musicVol', 1 / 8) },
    ] });
    X({ text: `[ effects sound: ${save.muted ? 'OFF' : 'ON '} ]`, id: prefix + 'sfx', onTap: toggleMute });
    X({ gap: 1, row: [
      { text: 'vol' }, { text: '[-]', id: prefix + 'svd', onTap: () => nudgeVol('sfxVol', -1 / 8) },
      { text: volBar(save.sfxVol), col: save.muted ? C.dim : C.cyan },
      { text: '[+]', id: prefix + 'svu', onTap: () => nudgeVol('sfxVol', 1 / 8) },
    ] });
  }

  function pauseLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap) => lines.push({ text, id, onTap });
    const run = st.run;
    T('PAUSED', C.cyan);
    T(`layer ${pad2(run.depth)}   corps ${run.corps}   cr ${run.credits}`, C.text);
    T(`seed ${run.seed}${run.practice ? '  (practice)' : ''}`, C.mid);
    T('');
    lines.push({ box: true, text: 'R E S U M E', id: 'resume', onTap: togglePause, minW: 22 });
    T('');
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'ppal', cyclePalette);
    B(`[ corp colors: ${save.corpColors ? 'ON ' : 'OFF'} ]`, 'pccol', toggleCorpColors);
    B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'pfx', toggleEffects);
    B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'ptap', toggleTapMode);
    audioLines(ln => lines.push(ln), 'p_');
    T('');

    T(st.abandonArmed ? 'the run ends here.' : 'abandoned runs are not scored.', st.abandonArmed ? C.red : C.dim);
    return lines;
  }

  function abandonRun() {
    if (!st.abandonArmed) { st.abandonArmed = true; Sound.deny(); return; }
    const run = st.run;
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win: false, abandoned: true, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();
    st.pause = false; st.abandonArmed = false; st.timer = null;
    swapTo(showTitle);
  }

  // ---------------- Keyboard cursor ----------------
  // Buttons and list rows: move through them in reading order.
  function moveFocus(d) {
    const list = st.focusables;
    if (!list.length) return;
    let i = list.findIndex(f => f.id === st.kbFocus);
    i = i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length;
    st.kbFocus = list[i].id;
    st.hoverBtn = st.kbFocus;
    Sound.tick();
  }

  // Grid: jump to the nearest open tile in the arrow's direction.
  function moveTileCursor(k) {
    const lv = st.lv;
    if (st.busy) return;
    const open = lv.tiles.map((t, i) => [t, i]).filter(([t]) => t.state === 'closed');
    if (!open.length) return;
    st.kbGrid = true;
    const cur = lv.tiles[st.hover];
    if (!cur || cur.state !== 'closed') {
      // Start at the tile nearest the middle of the grid.
      const mx = (lv.cols - 1) / 2, my = (lv.rows - 1) / 2;
      open.sort((a, b) => Math.hypot(a[0].col - mx, a[0].row - my) - Math.hypot(b[0].col - mx, b[0].row - my));
      st.hover = open[0][1];
      Sound.tick();
      return;
    }
    const [dx, dy] = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[k];
    let best = -1, bestScore = Infinity;
    for (const [t, i] of open) {
      if (t === cur) continue;
      const vx = t.col - cur.col, vy = t.row - cur.row;
      const along = vx * dx + vy * dy;
      if (along <= 0) continue;
      const score = along + Math.abs(vx * dy - vy * dx) * 2;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) { st.hover = best; Sound.tick(); }
    if (st.mp && lv.tiles[st.hover]) { const { tx, ty } = tileOrigin(lv.tiles[st.hover]); mpSendCursor(tx + 3, ty + 2); }
  }

  // Map: step through the nodes you can pick next.
  function moveMapCursor(k) {
    const run = st.run;
    const avail = availableNodes().slice().sort((a, b) => run.map[a].lane - run.map[b].lane);
    if (!avail.length) return;
    const d = k === 'arrowleft' || k === 'arrowup' ? -1 : 1;
    const i = avail.indexOf(st.mapSel);
    st.mapSel = avail[i < 0 ? 0 : (i + d + avail.length) % avail.length];
    Sound.ui();
  }

  // ---------------- Dev menu ----------------
  // Open with ` (backtick), or the [DEV] button when the URL has ?dev=1.
  // Using cheats on a run marks it as practice, so it doesn't count.
  function toggleDev() {
    if (st.transitioning || st.wipe) return;
    st.dev = !st.dev;
    st.devAccess = true;
    st.boardStart = performance.now();
    Sound.ui();
  }

  function cheat(fn) {
    return () => {
      if (st.run) st.run.practice = true;
      fn();
      Sound.buy();
    };
  }

  // Jump straight to a corp's boss layer.
  function jumpToBoss(node) {
    const run = st.run;
    st.dev = false;
    if (st.mode === 'play' && st.corp && st.corp.hasBoss && !st.lv.boss) {
      st.corp.idx = st.corp.counts.length - 1;
      enterLayer();
      return;
    }
    if (!node) return;
    run.practice = true;
    if (run.at !== node.id) { run.at = node.id; run.visited.push(node.id); }
    startCorp(node, 99);
  }

  function devLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    const run = st.run;
    const idle = !st.busy && !st.transitioning;
    T('DEV MENU', C.cyan);
    T(run ? (run.practice ? 'run is practice (not scored)' : 'cheats mark the run as practice') : 'start a run for cheats', C.dim);
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
    B(`[ show real node: ${st.debug ? 'ON ' : 'OFF'} ]`, 'dbg', () => { st.debug = !st.debug; if (run) run.practice = true; Sound.ui(); });
    B(`[ god: ${st.god ? 'ON ' : 'OFF'} ]`, 'god', () => { st.god = !st.god; if (run) run.practice = true; Sound.ui(); });
    B(`[ free travel: ${st.freeTravel ? 'ON ' : 'OFF'} ]`, 'free', () => { st.freeTravel = !st.freeTravel; if (run) run.practice = true; st.mapSel = null; Sound.ui(); });
    T('');
    T('mods (by rarity)', C.mid);
    const toggleMod = k => cheat(() => {
      if (!run.mods.includes(k)) return addMod(k);
      run.mods = run.mods.filter(m => m !== k);
      if (k === 'buffer') { run.maxInt--; run.integrity = Math.min(run.integrity, run.maxInt); }
      if (k === 'stash') { run.beltSlots--; run.items = run.items.slice(0, run.beltSlots); }
    });
    const keys = codexMods();
    for (let i = 0; i < keys.length; i += 4) {

      { text: '[heal]', id: 'hp', onTap: cheat(() => { run.integrity = run.maxInt; }), disabled: !run },
      { text: '[fill belt]', id: 'belt', onTap: cheat(() => { const ks = Object.keys(ITEMS); let i = 0; while (run.items.length < run.beltSlots) run.items.push(ks[i++ % ks.length]); }), disabled: !run },
    ] });
    lines.push({ row: [
      { text: '[unlock codex]', id: 'seenall', onTap: () => {

        for (const c of CODEX_CORPS) if (!corpStat(c).breached) corpStat(c).breached = 1;
        persist(); Sound.buy();
      } },
    ] });
    T('');
    const inCorp = st.mode === 'play' && st.corp && st.corp.hasBoss && st.lv && !st.lv.boss;
    const sel = st.mode === 'map' && st.mapSel && run.map[st.mapSel];
    const selCorp = sel && (sel.type === 'corp' || sel.type === 'final') ? sel : null;
    const bossLabel = inCorp ? '[ jump to this boss ]' : selCorp ? `[ jump to ${corpDef(selCorp.corp).letter} boss ]` : '[ jump to boss ]';
    B(bossLabel, 'boss', cheat(() => jumpToBoss(selCorp)), !idle || !(inCorp || selCorp));
    if (!inCorp && !selCorp) T('(select a corp on the map first)', C.dim);
    T('');
    B('[ close ]', 'close', toggleDev);
    return lines;
  }

  // ---------------- Input ----------------
  function hitAt(x, y) {
    for (let k = hits.length - 1; k >= 0; k--) {
      const h = hits[k];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
    }
    return null;
  }

  cv.addEventListener('pointerdown', e => {
    Sound.init();
    if (st.intro) { st.intro.skip = true; return; }   // tap skips a corp intro
    const h = hitAt(e.clientX, e.clientY);
    st.drag = st.scroll ? { y: e.clientY } : null;
    // Ignore taps during a wipe, except the header buttons.
    if (st.wipe && !(h && (h.id === 'snd' || h.id === 'dev'))) return;
    // While paused, only buttons respond.
    if (st.pause && h && h.kind !== 'btn') return;
    if (!h) {
      if (st.mode === 'map' && !st.dev && !st.pause) st.mapSel = null;
      st.selItem = -1; st.selMod = -1;
      return;
    }
    const oneTap = save.tapMode === 'one';
    if (h.kind === 'tile') pick(h.i);
    else if (h.kind === 'node') selectNode(h.id);
    else if (h.kind === 'item') {
      // Two-tap mode: first tap shows info, second tap uses.
      st.selMod = -1;
      if (oneTap || st.selItem === h.i) useItem(h.i);
      else { st.selItem = h.i; Sound.tick(); }
    } else if (h.kind === 'mod') {
      st.selItem = -1;
      const key = st.run.mods[h.i];
      const active = MODS[key].active;
      if (active && (oneTap || st.selMod === h.i)) activateMod(key);
      else if (st.selMod === h.i) st.selMod = -1;
      else { st.selMod = h.i; Sound.tick(); }
    }
    else if (h.kind === 'btn' && !st.transitioning) h.onTap();
  });

  cv.addEventListener('pointermove', e => {
    if (st.mp) mpSendCursor((e.clientX - L.ox - L.cw / 2) / L.cw, (e.clientY - L.oy - L.chh / 2) / L.chh);
    // Swipe to scroll lists (one entry per row of finger travel).
    if (st.drag && e.buttons && st.scroll) {
      const dy = e.clientY - st.drag.y;
      if (Math.abs(dy) > L.chh) { st.scroll(dy < 0 ? 1 : -1); st.drag.y = e.clientY; }
    }
    const h = hitAt(e.clientX, e.clientY);
    const tile = h && h.kind === 'tile' ? h.i : -1;
    if (tile !== st.hover && tile >= 0 && !st.busy) Sound.tick();
    st.hover = tile;
    st.kbGrid = false;
    st.kbFocus = null;   // the mouse takes over the cursor
    st.hoverBtn = h && h.kind === 'btn' ? h.id : null;
    st.hoverNode = h && h.kind === 'node' ? h.id : null;
    st.hoverItem = h && h.kind === 'item' ? h.i : -1;
    st.hoverMod = h && h.kind === 'mod' ? h.i : -1;
    cv.style.cursor = h ? 'pointer' : 'default';
  });
  cv.addEventListener('pointerup', () => { st.drag = null; });
  cv.addEventListener('wheel', e => {
    if (!st.scroll || st.wipe) return;
    e.preventDefault();
    st.scroll(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Sound.init();
    const k = e.key.toLowerCase();
    const arrow = k.startsWith('arrow');
    if (arrow || k === ' ' || k === 'enter') e.preventDefault();
    if (st.intro && e.key !== '`') { st.intro.skip = true; return; }   // any key skips a corp intro
    if (e.key === '`') return toggleDev();
    if (k === 'm' && !st.dev) return toggleMute();
    if (k === 'n' && !st.dev) return toggleMusic();
    if (k === 'escape') {
      if (st.dev) return toggleDev();
      if (st.pause) return togglePause();
      if (st.keyHandler && st.keyHandler(k)) return;
      if (st.run && (st.mode === 'map' || st.mode === 'play' || st.mode === 'panel')) return togglePause();
      return;
    }
    if (st.transitioning || st.wipe) return;
    const overlay = st.dev || st.pause;
    if (!overlay) {
      if (st.keyHandler && st.keyHandler(k)) return;
      if (/^[1-9]$/.test(e.key) && st.run && (st.mode === 'play' || st.mode === 'map')) return useItem(Number(e.key) - 1);
      if (st.mode === 'play' && st.lv) {
        if (arrow) return moveTileCursor(k);
        if ((k === 'enter' || k === ' ') && st.hover >= 0) return pick(st.hover);
        return;
      }
      if (st.mode === 'map') {
        if (arrow) return moveMapCursor(k);
        if ((k === 'enter' || k === ' ') && st.mapSel) return enterNode(st.run.map[st.mapSel]);
        return;
      }
      if (st.mode === 'over' && k === 'r') return retry();
    }
    // Everything else (title, panels, menus): a cursor over the buttons.
    if (arrow) return moveFocus(k === 'arrowup' || k === 'arrowleft' ? -1 : 1);
    if (k === 'enter' || k === ' ') {
      const f = st.kbFocus && st.focusables.find(x => x.id === st.kbFocus);
      if (f) return f.onTap();
      // Nothing focused yet: the screen's main action.
      if (!overlay && st.mode === 'title') return jackIn();
      if (!overlay && st.mode === 'over') return newRun();
    }
  });

  // ---------------- Online multiplayer ----------------
  // 2-6 players take turns on one seeded run ("Jenga" rules, elimination):
  //   - turn order is shuffled at the start of each game
  //   - one pick per turn
  //   - hit ICE: you lose 1 integrity, and the next player still in picks on the same layer
  //   - find the real node: the layer is cleared (first try: +1 integrity), and the next,
  //     bigger layer starts with the next player
  //   - at 0 integrity you're knocked out and spectate; the last one standing wins
  // Anyone who joins once the game is full spectates. After a game the host picks who
  // plays the next one. Firebase only relays data: every game rebuilds the layers from
  // the round's seed and replays the same moves, so all screens stay in sync.
  const FIREBASE_CONFIG = {

  // Room data (rooms/{code}/...):
  //   meta      { host, max, round, status: lobby|playing, picks: {id: true} }
  //   members   {id: { name, logo, joined, online }}
  //   rounds    {n: { seed, order: [ids] }}
  //   moves     {n: {pushId: { by, tile, layer } | { kind: 'drop', by, layer }}}
  //   cursors   {id: { x, y, r }}      emotes {pushId: { by, e }}
  const Net = window.__fakeNet || (() => {
    let db = null;
    function init() {
      if (db) return true;
      try {
        if (!window.firebase) return false;
        const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database(app);
        return true;
      } catch (e) { return false; }
    }
    const get = async path => (await db.ref(path).get()).val();
    const set = (path, val) => db.ref(path).set(val);
    const update = (path, obj) => db.ref(path).update(obj);
    const push = (path, val) => db.ref(path).push(val);

    function watch(path, ev, fn) {

  // ---- player profile: a generated handle (no typing, so nothing to moderate) + a logo
  const NAME_A = ['NEON', 'GHOST', 'ZERO', 'CHROME', 'STATIC', 'RAZOR', 'NULL', 'VOLT', 'HEX', 'DUSK', 'ACID', 'IRON'];
  const NAME_B = ['RAT', 'FOX', 'WIRE', 'BYTE', 'JACK', 'MOTH', 'KEY', 'SAINT', 'HOUND', 'LOOP', 'DRONE', 'SPIKE'];
  const LOGOS = ['<#>', '{@}', '[*]', '(o)', '/$/', '>>>', '%%%', '=|=', '<&>', '{^}'];
  const randomName = () => pickR(NAME_A, Math.random) + '_' + pickR(NAME_B, Math.random);
  function profile() {
    if (!save.profile) { save.profile = { name: randomName(), logo: Math.floor(Math.random() * LOGOS.length) }; persist(); }

  const logoMark = i => LOGOS[((i % LOGOS.length) + LOGOS.length) % LOGOS.length];
