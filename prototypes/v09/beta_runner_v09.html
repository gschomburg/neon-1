        for (const d of linkDots(pos(n), pos(m))) if (inView(d.row)) put(d.x, y + d.row - top, d.ch || '·', path ? C.cyan : C.dim, 'board');
      }
    }
    for (const n of Object.values(map)) {
      const p = pos(n);
      if (!inView(p.row)) continue;
      const visited = r.visited.includes(n.id), dead = !r.win && n.id === r.at;
      const col = dead ? C.red : visited ? C.cyan : n.type === 'final' ? C.redDim : C.dim;
      put(p.x - 1, y + p.row - top, `[${nodeLetter(n)}]`, col, 'board', dead || visited);
      if (dead) put(p.x - 3, y + p.row - top, 'X', C.red, 'board', true);
      if (r.win && n.id === r.at) put(p.x - 3, y + p.row - top, '@', C.bright, 'board', true);
    }
    // more above / below: arrows in both margins (clear of the nodes)
    const blink = Math.floor(performance.now() / 600) % 2 ? C.mid : C.dim;
    const first = ln.k == null || ln.k === 0, last = ln.k == null || ln.k === h - 1;
    if (top > 0 && first) { put(0, y, '^', blink, 'board'); put(L.wc - 1, y, '^', blink, 'board'); }
    if (top + h < mapRows(map) && last) { put(0, y + h - 1, 'v', blink, 'board'); put(L.wc - 1, y + h - 1, 'v', blink, 'board'); }
  }

  function buildMap(ctx) {
    const { now, put, addHit, putC } = ctx;
    const run = st.run, map = run.map;
    const avail = new Set(availableNodes());
    const nodes = Object.values(map);
    const mv = st.mapView || { row: sectorViewRow(run.sector), sector: run.sector };
    stepMapView(now);
    // Screen y for a map row, and whether it's inside the map area.
    const yOf = row => BOARD_Y + row - mv.row;
    const shown = row => row - mv.row >= -0.01 && row - mv.row <= SECTOR_ROWS - 0.99;
    const pos = n => ({ x: mapX(n), row: mapRowOf(n) });
    const settled = mv.row === mv.target;

    for (const n of nodes) {
      for (const id of n.next) {
        const m = map[id];
        const vi = run.visited.indexOf(n.id), mi = run.visited.indexOf(m.id);
        const onPath = (vi >= 0 && run.visited[vi + 1] === m.id) || (mi >= 0 && run.visited[mi + 1] === n.id);
        const live = run.at === n.id && avail.has(m.id);
        const col = onPath ? C.cyan : live ? C.mid : C.dim;
        for (const d of linkDots(pos(n), pos(m))) if (shown(d.row)) put(d.x, yOf(d.row), d.ch || '·', col, 'map');
      }
    }
    for (const n of nodes) {
      const p = pos(n);
      if (!shown(p.row)) continue;
      const y = yOf(p.row);
      const visited = run.visited.includes(n.id), available = avail.has(n.id);
      const sel = st.mapSel === n.id, hov = st.hoverNode === n.id;
      let col = visited ? C.cyan : C.dim;
      if (available) col = sel ? C.cyan : (Math.floor(now / 500) % 2 ? C.bright : C.text);
      // corps in their own colors (not once you've been there)
      const cc = !visited ? corpIconCols(n) : null;
      if (cc) { ctx.bg(p.x - 1, y, 3, cc.bg, available ? 1 : 0.55); put(p.x - 1, y, '[', col, 'map'); put(p.x, y, nodeLetter(n), available ? cc.fg : col, 'map', available); put(p.x + 1, y, ']', col, 'map'); }
      else put(p.x - 1, y, `[${nodeLetter(n)}]`, col, 'map');
      if (hov) ctx.bg(p.x - 1, y, 3, C.cyan, 0.25);
      if (n.mod && CORP_MODS[n.mod] && !visited) put(p.x + 2, y, CORP_MODS[n.mod].tag, C.gold, 'map', true);   // corp modifier
      if (sel) { put(p.x - 3, y, '>', C.cyan, 'map'); put(p.x + 3, y, '<', C.cyan, 'map'); }
      else if (run.at === n.id) put(p.x - 3, y, '@', C.bright, 'map');
      if (available && settled) addHit(p.x - 1, y, 3, 1, { kind: 'node', id: n.id });
    }
    // Which sector you're looking at, and arrows when there's more map below.
    if (run.sector > 0) {
      const v = mv.sector, blink = Math.floor(now / 600) % 2 ? C.mid : C.dim;
      put(0, BOARD_Y, `SECTOR ${v + 1}`, v === run.sector ? C.mid : C.cyan, 'map');
      if (v > 0) { put(0, BOARD_Y + SECTOR_ROWS - 1, 'v', blink, 'map'); put(L.wc - 1, BOARD_Y + SECTOR_ROWS - 1, 'v', blink, 'map'); }
      if (v < run.sector) { put(L.wc - 1, BOARD_Y, '^', blink, 'map'); }
    }

    // Info panel under the map
    const y0 = BOARD_Y + SECTOR_ROWS;
    const id = st.mapSel || (avail.has(st.hoverNode) ? st.hoverNode : null);
    if (!id) {
      if (mv.sector !== run.sector) {
        putC(y0 + 1, `sector ${mv.sector + 1}: cleared.`, C.text, 'map');
        putC(y0 + 3, 'scroll up to get back.', C.dim, 'map');
        return;
      }
      putC(y0 + 1, 'choose a target.', C.text, 'map');
      putC(y0 + 3, 'letters = corps   ! = final', C.dim, 'map');
      putC(y0 + 4, '$ = market  ? = cache  + = repair', C.dim, 'map');
      if (run.sector > 0) putC(y0 + 5, 'scroll for older sectors.', C.dim, 'map');
      return;
    }
    const info = nodeInfo(map[id]);
    info.lines.forEach((ln, k) => putC(y0 + k, ln.text, ln.col, 'map'));
    if (st.mapSel) drawBox(ctx, y0 + info.lines.length, { text: info.action, id: 'enter', onTap: () => enterNode(map[st.mapSel]), minW: 18 });
  }

  function nodeInfo(n) {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    if (n.type === 'corp' || n.type === 'final' || n.type === 'start') {
      const d = corpDef(n.corp);
      if (n.type === 'final' && n.corp !== 'omni') T('SECTOR BOSS', C.red);
      T(n.tier ? `${d.name} // TIER ${n.tier}${d.level ? ' LV' + d.level : ''}` : d.name, n.type === 'final' ? C.red : C.cyan);
      T(d.intel, C.text);
      const rules = corpRules(d, n.tier);
      if (rules) T(rules, C.mid);
      if (d.bossDesc) T(d.bossDesc, C.redDim);
      if (n.mod && CORP_MODS[n.mod]) T(`+ ${CORP_MODS[n.mod].name}: ${CORP_MODS[n.mod].desc}`, C.gold);
      return { lines, action: 'B R E A C H' };
    }
    if (n.type === 'shop') { T('BLACK MARKET', C.gold); T('items and mods for credits.'); }
    if (n.type === 'cache') { T('DATA CACHE', C.gold); T('loot, then pick a mod.'); }
    if (n.type === 'repair') { T('SAFEHOUSE', C.cyan); T(`heal ${CONFIG.repairAmount}, then pick a mod.`); }
    return { lines, action: 'E N T E R' };
  }

  // Centered text screens: title, panels, help, codex, settings, game over.
  // Line types:
  //   text {text,col}           button {text,id,onTap,disabled,sel,faded}
  //   box {box,text,sub,id}     row of small buttons {row:[...]}
  //   badge {badge}             list row {list,id,onTap,sel,name,right,badge,col,tint}
  //   gap {gap:n} (empty rows)
  // Any line can have `reveal` (index) and `rarity` to pop in one at a time.
  // area: where to center the lines (default: the board area).
  // ---- Text fields. The canvas can't take typing, so a real (invisible) input sits
  // exactly over the field. Tapping it is a real tap on an input, so phones open
  // their keyboard as usual. What you type is drawn by the game.
  //   { field: 'seed', width, value: () => str, clean: str => str, onCommit: str => {} }
  const Field = (() => {
    let el = null, spec = null, cancel = false;
    const editing = id => !!(el && spec && spec.field === id && document.activeElement === el);
    function make() {
      if (el || !document.createElement) return;
      el = document.createElement('input');
      el.type = 'text';
      for (const [k, v] of Object.entries({ autocomplete: 'off', autocorrect: 'off', autocapitalize: 'characters', spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'text field' })) el.setAttribute(k, v);
      // font-size 16px stops iOS zooming in on focus
      el.style.cssText = 'position:fixed;display:none;opacity:0;border:0;padding:0;margin:0;outline:none;font-size:16px;background:transparent;color:transparent;caret-color:transparent;cursor:text;z-index:2;';
      document.body.appendChild(el);
      el.addEventListener('focus', () => { if (!spec) return; el.value = spec.value(); cancel = false; Sound.init(); Sound.tick(); });
      el.addEventListener('input', () => { if (spec) el.value = spec.clean(el.value); });
      el.addEventListener('keydown', e => {
        e.stopPropagation();   // typing doesn't reach the game's keys
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel = true; el.blur(); }
      });
      el.addEventListener('blur', () => { if (spec && !cancel) spec.onCommit(el.value); cancel = false; });
    }
    // Called every frame: keep the input over the field shown this frame (or hide it).
    function sync() {
      make();
      if (!el) return;
      const r = st.fieldRect;
      if (r && !st.wipe && !st.dev && !st.pause) {
        spec = r.spec;
        Object.assign(el.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      } else {
        if (document.activeElement === el) { cancel = true; el.blur(); }
        el.style.display = 'none';
      }
    }
    const focus = () => { if (el && el.style.display !== 'none') el.focus(); };
    const text = () => el ? el.value : '';
    const blur = () => { if (el && document.activeElement === el) el.blur(); };   // commits
    return { sync, focus, blur, editing, text };
  })();

  function drawField(ctx, x, y, b) {
    const { now, put, bg, addHit, collectHits } = ctx;
    const editing = Field.editing(b.field), id = 'f_' + b.field;
    let val = editing ? Field.text() : b.value();
    const room = editing ? b.width - 1 : b.width;   // leave a spot for the cursor
    if (val.length > room) val = val.slice(-room);
    put(x, y, '[', editing ? C.cyan : C.mid, 'ui');
    put(x + b.width + 3, y, ']', editing ? C.cyan : C.mid, 'ui');
    put(x + 2, y, val, editing ? C.cyan : C.bright, 'ui', true);
    if (editing) {
      bg(x, y, b.width + 4, C.cyan, 0.18);
      if (Math.floor(now / 500) % 2 === 0) put(x + 2 + val.length, y, '_', C.cyan, 'ui', true);
    } else {
      put(x + 2 + val.length, y, '.'.repeat(Math.max(0, b.width - val.length)), C.dim, 'ui');   // empty spots
      ctx.hl(x, y, b.width + 4, 1, id);
    }
    if (collectHits) {
      st.fieldRect = { spec: b, x: L.ox + x * L.cw, y: L.oy + y * L.chh, w: (b.width + 4) * L.cw, h: L.chh };
      addHit(x, y, b.width + 4, 1, { kind: 'btn', id, onTap: Field.focus });   // keyboard: enter to edit
    }
  }

  function buildTextBoard(ctx, lines, area = null) {
    const { now, put, putC, addHit, bg, cells, collectHits } = ctx;
    const hl = ctx.hl || (() => {});
    const heightOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.tileInfo ? TILE_H : ln.mapView ? ln.h : 1;
    const total = lines.reduce((s, ln) => s + heightOf(ln), 0);
    const top = area ? area.top : BOARD_Y, areaH = area ? area.h : L.gh;
    let y = top + Math.max(0, Math.floor((areaH - total) / 2));
    // Buttons keep their colors; hover/cursor shows as a background (see hl).
    const btnCol = b => b.disabled ? C.dim : b.sel ? C.cyan : b.faded ? C.mid : C.bright;

    for (const ln of lines) {
      const h = heightOf(ln);
      // Escalating reveal: hidden until its turn, then pops with fx scaled by rarity.
      if (ln.reveal != null) {
        const at = st.panelT0 + ln.reveal * CONFIG.revealGap;
        if (now < at) { y += h; continue; }
        const rid = ln.revealId || ('r' + ln.reveal);
        if (collectHits && !st.revealed.has(rid)) { st.revealed.add(rid); popFx(ln, y); }
      }
      const startIdx = cells.length;

      if (ln.box) drawBox(ctx, y, ln);
      else if (ln.tileInfo) {
        // A tile drawn like on the board, with text lines beside it.
        for (let k = 0; k < TILE_H; k++) drawTileRow(put, y + k, ln, k);
      }
      else if (ln.tileRow != null) drawTileRow(put, y, ln.tile, ln.tileRow);   // one row of a tile (for scrolling)
      else if (ln.mapView) drawMapView(ctx, y, ln);
      else if (ln.trayDemo) {
        // One row of a sample tray, drawn like the real one.
        const x0 = Math.floor((L.wc - HELP_W) / 2);
        if (ln.trayDemo === 'rule') put(x0, y, rule(HELP_W), C.dim, 'board');
        if (ln.trayDemo === 'mods') {
          let x = x0;
          ['tracer', 'skimmer', 'burner', 'stash'].forEach((key, i) => { x += drawBadge(put, now, x, y, key, i, { own: 'board', noCharges: true, dim: key === 'burner' }) + 2; });
        }
        if (ln.trayDemo === 'modinfo') {
          put(x0, y, '\\_', C.mid, 'board');
          put(x0 + 2, y, 'TRC', modColor(MODS.tracer), 'board', true);
          put(x0 + 6, y, MODS.tracer.tip, C.text, 'board');
        }
        if (ln.trayDemo === 'items') {
          put(x0, y, '[PURGE]', C.bright, 'board'); put(x0 + 8, y, '[PATCH]', C.bright, 'board');
          put(x0 + 16, y, ':  .  :', C.dim, 'board'); put(x0 + 24, y, ':  .  :', C.dim, 'board');
        }
        if (ln.trayDemo === 'iteminfo') {
          put(x0, y, '\\_', C.mid, 'board');
          put(x0 + 2, y, 'PURGE', C.bright, 'board', true);
          put(x0 + 8, y, ITEMS.purge.tip, C.text, 'board');
          put(x0 + 9 + ITEMS.purge.tip.length, y, '>tap', C.cyan, 'board');
        }
      }
      else if (ln.badge && !ln.list) {
        const m = tierView(MODS[ln.badge], ln.badgeTier || 0);
        const bw = 1 + m.short.length + (m.lvlTag && m.tier > 0 ? 1 : 0);
        const x = Math.floor((L.wc - (bw + 2 + m.name.length)) / 2);
        drawBadge(put, now, x, y, ln.badge, 0, { own: 'board', tier: m.tier });
        put(x + bw + 2, y, m.name, modColor(m), 'board', true);
      } else if (ln.list) {
        const LW = 32, x = Math.floor((L.wc - LW) / 2);
        const hov = st.hoverBtn === ln.id;
        if (ln.tint) bg(x, y, LW, ln.tint, ln.sel ? 0.3 : 0.1);
        if (hov) bg(x, y, LW, C.cyan, 0.2);
        // The selection cursor sits outside the row, clear of its background color.
        if (ln.sel) put(x - 2, y, '>', C.cyan, 'ui', true);
        let cx = x + 1;
        if (ln.badge) cx += drawBadge(put, now, cx, y, ln.badge, 1, { own: 'board', tier: ln.badgeTier }) + 1;
        put(cx, y, ln.name, ln.faded ? C.mid : (ln.col || C.bright), 'ui', !!ln.sel);
        if (ln.right) put(x + LW - ln.right.length, y, ln.right, ln.faded ? C.dim : (ln.rightCol || C.mid), 'ui');
        if (!ln.disabled) addHit(x, y, LW, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.row) {
        const gap = ln.gap != null ? ln.gap : 2;
        const itemW = b => b.field ? b.width + 4 : b.badge ? (b.plain ? 4 + (b.tier && MODS[b.badge].lvlTag ? 1 : 0) : 6) : b.text.length;
        const w = ln.row.reduce((s, b) => s + itemW(b), 0) + (ln.row.length - 1) * gap;
        let x = Math.floor((L.wc - w) / 2);
        ln.row.forEach((b, bi) => {
          if (b.field) { drawField(ctx, x, y, b); x += itemW(b) + gap; return; }
          if (b.badge && b.plain) { x += drawBadge(put, now, x, y, b.badge, bi, { own: 'board', tier: b.tier }) + gap; return; }
          if (b.badge) {
            // A mod as it looks in the tray. On = tinted in its rarity color with bright brackets.
            const mc = modColor(MODS[b.badge]);
            if (b.on) bg(x, y, 6, mc, 0.3);
            if (!b.disabled) hl(x, y, 6, 1, b.id, bi === 0 || gap >= 3);
            put(x, y, '[', b.on ? C.bright : C.dim, 'ui'); put(x + 5, y, ']', b.on ? C.bright : C.dim, 'ui');
            drawBadge(put, now, x + 1, y, b.badge, bi, { own: 'ui', noCharges: true });
            if (!b.disabled) addHit(x, y, 6, 1, { kind: 'btn', id: b.id, onTap: b.onTap });
            x += 6 + gap; return;
          }
          if (!b.id) { put(x, y, b.text, b.col || C.dim, 'board'); x += b.text.length + gap; return; }   // plain text
          if (b.sel) bg(x, y, b.text.length, C.cyan, 0.22);
          // The > marker only where there's room for it: the first item, or wide gaps.
          if (!b.disabled) hl(x, y, b.text.length, 1, b.id, bi === 0 || gap >= 3);
          put(x, y, b.text, btnCol(b), 'ui', !!b.sel);
          if (!b.disabled) addHit(x, y, b.text.length, 1, { kind: 'btn', id: b.id, onTap: b.onTap });
          x += b.text.length + gap;
        });
      } else if (ln.id && ln.invert) {
        // Inverted bar (the "more" rows): text color as the background, background color as the text.
        const x = Math.floor((L.wc - ln.text.length) / 2), hov = st.hoverBtn === ln.id;
        bg(x, y, ln.text.length, hov ? C.cyan : C.text, 1);
        put(x, y, ln.text, C.bg, 'ui', true);
        if (hov && st.kbFocus === ln.id && x >= 2) put(x - 2, y, '>', C.cyan, 'ui', true);
        addHit(x, y, ln.text.length, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.id) {
        const x = Math.floor((L.wc - ln.text.length) / 2);
        if (ln.style) bg(x, y, ln.text.length, ln.style.bg, 1);   // a player's color style
        if (!ln.disabled) hl(x, y, ln.text.length, 1, ln.id);
        put(x, y, ln.text, ln.style ? ln.style.fg : btnCol(ln), 'ui', !!ln.style);
        if (!ln.disabled) addHit(x, y, ln.text.length, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.text) {
        const x = Math.floor((L.wc - ln.text.length) / 2);
        if (ln.colorAt) {
          // Per-character colors (used by the title art).
          for (let i = 0; i < ln.text.length; i++) if (ln.text[i] !== ' ') put(x + i, y, ln.text[i], ln.colorAt(i), 'board', !!ln.bold);
        } else put(x, y, ln.text, ln.col, 'board', !!ln.bold);
        if (ln.bgCol) bg(x, y, ln.text.length, ln.bgCol, ln.bgA != null ? ln.bgA : 1);
      }

      // Glitch-in right after a reveal.
      if (ln.reveal != null) {
        const age = now - (st.panelT0 + ln.reveal * CONFIG.revealGap);
        if (age < 180) for (let i = startIdx; i < cells.length; i++) if (Math.random() < 0.55) cells[i].ch = noiseCh();
        const gl = st.glow && st.glow[ln.revealId || ('r' + ln.reveal)];
        if (gl) {
          const ga = now - gl.t0;
          if (ga < 1200) for (let r = 0; r < h; r++) bg(0, y + r, L.wc, gl.col, 0.28 * (1 - ga / 1200) * (0.75 + 0.25 * Math.sin(ga / 60)));
        }
      }
      y += h;
    }
  }

  // Row k (0-4) of an info tile: the tile's frame/glyph row, and text line k beside it.
  function drawTileRow(put, y, ln, k) {
    const x = Math.floor((L.wc - 34) / 2);
    const r = k === 0 || k === TILE_H - 1 ? '+- - -+' : ':' + ln.tileInfo[k - 1] + ':';
    const fc = ln.frameCol || C.mid, gc = ln.glyphCol || C.bright;
    put(x, y, r[0], fc, 'board');
    put(x + 1, y, r.slice(1, TILE_W - 1), k === 0 || k === TILE_H - 1 ? fc : gc, 'board');
    put(x + TILE_W - 1, y, r[TILE_W - 1], fc, 'board');
    const t = ln.lines[k];
    if (t) put(x + TILE_W + 2, y, t.text, t.col, 'board', k === 0);
  }

  // Pop effect for an offer appearing: sound + burst scaled by rarity.
  function popFx(ln, y) {
    const lvl = ln.rarity ? RARITY[ln.rarity].lvl : 0;
    // its place among the rare pops on this screen (a row of boss mods climbs)
    const bigStep = lvl >= 3 ? (st.bigPops = (st.bigPops || 0) + 1) - 1 : 0;
    Sound.pop(lvl, bigStep);
    if (ln.seenKey) markSeen(ln.seenKey);
    if (lvl < 2) return;
    const col = rarityCol(ln.rarity);
    const n = [0, 0, 8, 22, 34][lvl];
    const fake = [];
    const cols = lvl === 3 ? [C.exotic, C.epic, C.rare, C.bright] : [col];   // exotic: rainbow
    for (let i = 0; i < n; i++) fake.push({ ch: lvl >= 3 && i % 3 === 0 ? '*' : noiseCh(), x: pxX(rand(L.wc * 0.15, L.wc * 0.85)), y: pxY(y), col: cols[i % cols.length] });
    explode(fake, pxX(L.wc / 2), pxY(y + 0.5), { power: lvl >= 4 ? 0.75 : lvl >= 3 ? 0.6 : 0.35, grav: 0.4, life: lvl >= 3 ? [0.5, 1.1] : [0.3, 0.7] });
    if (lvl >= 3) {
      flash(col, lvl >= 4 ? 0.2 : 0.14, 0.35); shake(lvl >= 4 ? 5 : 3, 0.3);
      st.glow = st.glow || {};
      st.glow[ln.revealId || ('r' + ln.reveal)] = { t0: performance.now(), col };   // the row glows a moment
      // its rarity floats up off the row
      const tag = lvl >= 4 ? '** BOSS **' : '!! EXOTIC !!';
      [...tag].forEach((ch, i) => parts.push({
        mode: 'float', ch, x: pxX(L.wc / 2 + i - tag.length / 2 + 0.5), y: pxY(y - 0.6),
        col: lvl === 3 ? cols[i % cols.length] : col, t: 0, life: 1.4, alpha: 1, rot: 0, scr: 0,
      }));
    }
  }

  // ---------------- Screens built from lines ----------------
  const LOGO = [
    ' ___  ___  _____  _   ',
    '| _ )| __||_   _|/_\\  ',
    '| _ \\| _|   | | / _ \\ ',
    '|___/|___|  |_|/_/ \\_\\',
  ];

  // Title cover art: a face, half human (left) and half circuitry (right).
  // Each row: [left half, divider, right half].
  const COVER = [
    ['            _.-~', '~', '~~~~-._'],
    ["         .-'   .", '|', " [#]  '-."],
    ["       .'    .' ", '|', "  |  +--o'."],
    ['      /     /   ', '|', '  +--+    \\'],
    ['     |   .-""-. ', '|', ' [@@]=+    |'],
    ['     |  ( (o)  )', '|', '  ||  |    |'],
    ["     |   '-..-' ", '|', ' o++o |    |'],
    ['     |     )    ', '|', '  ||  +=   |'],
    ['     |    (_    ', '|', ' ++==++    |'],
    ['      \\    __   ', '|', ' [====]   /'],
    ["       \\  '--'  ", '|', '   ||    /'],
    ["        '.      ", '|', "  o--  .'"],
    ["          '-._  ", '|', "   _.-'"],
    ["              '-", '~', "-'"],
  ];
  const COVER_W = 16 + 1 + 14;

  // Cover art lines with a little life: the eye blinks, the circuit eye scans,
  // a scanline drifts down, and now and then a row glitches sideways.
  function coverLines(now) {
    const t = now / 1000;
    const blink = (t % 4.3) < 0.14;
    const scanEye = ['@@', '@ ', ' @', '@@'][Math.floor(t * 3) % 4];
    const scanRow = Math.floor(now / 140) % (COVER.length + 6);
    const glitchRow = (t % 3.1) < 0.12 ? Math.floor(t * 7) % COVER.length : -1;
    return COVER.map(([l, mid, r], row) => {
      let left = l.padEnd(16), right = r.padEnd(14);
      if (blink) left = left.replace('(o)', '(-)');
      right = right.replace('@@', scanEye);
      let text = left + mid + right;
      if (row === glitchRow) text = (' ' + text.slice(0, -1)).replace(/[^ ]/g, ch => Math.random() < 0.25 ? noiseCh() : ch);
      const lit = row === scanRow;
      return {
        text, bold: lit,
        colorAt: i => lit ? C.bright : i < 16 ? C.text : i === 16 ? C.dim : C.cyan,
      };
    });
  }

  function titleLines(now) {
    const lines = [];
    const T = (text, col = C.text, extra = {}) => lines.push(Object.assign({ text, col }, extra));
    lines.push(...coverLines(now));
    T('');
    // Logo with an occasional glitch.
    LOGO.forEach((l, i) => {
      let s = l;
      if (((now / 1000 + i * 0.9) % 4.5) < 0.09) s = s.replace(/[^ ]/g, ch => Math.random() < 0.3 ? noiseCh() : ch);
      T(s, C.cyan, { bold: true });
    });
    T('R   U   N   N   E   R', C.bright, { bold: true });
    T('network intrusion // prototype', C.dim);
    T('');
    const saved = st.savedRun;
    if (saved) lines.push({ box: true, text: 'C O N T I N U E', sub: `- sector ${(saved.run.sector || 0) + 1}  layer ${pad2(saved.run.depth)} -`, id: 'start', onTap: resumeRun, minW: 26 });
    else lines.push({ box: true, text: 'J A C K   I N', sub: '- start a run -', id: 'start', onTap: jackIn, minW: 26 });
    T('');
    lines.push({ row: [
      { text: '[ HOW TO PLAY ]', id: 'help', onTap: () => swapTo(openHelp) },
      { text: '[ CODEX ]', id: 'codex', onTap: () => swapTo(openCodex) },
    ] });
    lines.push({ row: [
      { text: '[ SETTINGS ]', id: 'settings', onTap: () => swapTo(openSettings) },
      // multiplayer is hidden unless dev is on (?dev=1, or the backtick key)
      ...(st.devAccess || st.dev ? [{ text: '[ MULTIPLAYER ]', id: 'mp', onTap: () => swapTo(openMultiplayer) }] : []),
    ] });
    lines.push({ row: [
      ...(saved ? [{ text: st.newArmed ? '[ DROP SAVE? ]' : '[ NEW RUN ]', id: 'newrun', onTap: newOverSave }] : []),
      { text: '[ THE BOARD ]', id: 'board', onTap: () => swapTo(openBoard) },
    ] });
    T('');
    { const prof = profile(); lines.push({ text: `[ ${logoMark(prof.logo)} ${prof.name} ]`, id: 'profile', style: styleOf(prof.style), onTap: () => swapTo(openProfile) }); }
    T(`best ${pad2(save.best)}  runs ${save.runs}  wins ${save.wins}  rep ${save.rep || 0}`, C.mid);
    // Seed: tap to roll a new one.
    lines.push({ gap: 1, row: [
      { text: 'seed' },
      { text: `[${st.seed.slice(0, 10)}]`, id: 'seed', onTap: rerollSeed },
      ...(st.practice ? [{ text: 'practice', col: C.redDim }] : []),
    ] });
    return lines;
  }

  // After the collapse, the screen is empty. CONNECTION TERMINATED types in at the
  // middle and sits a second; then the results come in one line at a time below it,
  // pushing the block up until it's the full, centered results screen.
  const REVEAL = { type: 35, hold: 1000, gap: 170, mapGap: 45 };   // ms; map rows come in faster
  function buildOverReveal(ctx, now) {
    const all = overLines().flatMap(ln => ln.mapView ? Array.from({ length: ln.h }, (_, k) => Object.assign({}, ln, { h: 1, k, viewH: ln.h })) : [ln]);
    buildReveal(ctx, now, st.overReveal, all);
  }
  // Show `all` building up: line 0 types in at the middle and holds, then the rest come
  // in one at a time below it, the block gliding up to stay centered. Lines with an
  // offer `reveal` index wait for their pop (st.panelT0 is set from the first one).
  function buildReveal(ctx, now, rv, all) {
    const title = all[0].text;
    const typed = clamp(Math.floor((now - rv.t0) / REVEAL.type), 0, title.length);
    // when each line shows up (blank lines come with the next one)
    let k = 1, t = rv.t0 + title.length * REVEAL.type + REVEAL.hold, firstPop = null;
    for (let i = 1; i < all.length; i++) {
      if (all[i].reveal != null) {
        if (firstPop == null) firstPop = rv.firstPop || (rv.firstPop = t);
        t = Math.max(t, firstPop + all[i].reveal * CONFIG.revealGap);
      }
      if (now < t) break;
      k = i + 1;
      if (all[i].mapView) t += REVEAL.mapGap;
      else if (all[i].text || all[i].box || all[i].row || all[i].list) t += REVEAL.gap;
    }
    if (rv.firstPop && st.panelT0 === Infinity) st.panelT0 = rv.firstPop;
    if (now < rv.t0) k = 0;
    const vis = all.slice(0, k);
    if (vis.length && typed < title.length) {
      const cursor = Math.floor(now / 250) % 2 ? '_' : ' ';
      vis[0] = Object.assign({}, vis[0], { text: (title.slice(0, typed) + cursor).padEnd(title.length) });
    }
    const hOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.tileInfo ? TILE_H : ln.mapView ? ln.h : 1;
    const H = vis.reduce((a, ln) => a + hOf(ln), 0);
    // glide toward the centered spot (so new lines push the block up smoothly);
    // 'board' centers like a normal panel, so the finished screen lines up exactly
    const target = rv.center === 'board' ? BOARD_Y + Math.max(0, Math.floor((L.gh - H) / 2)) : (L.hc - Math.max(1, H)) / 2;
    if (rv.y == null) rv.y = target;
    else rv.y += (target - rv.y) * Math.min(1, (now - rv.lt) / 1000 * 9);
    rv.lt = now;
    if (vis.length) buildTextBoard(ctx, vis, { top: rv.y, h: H });
    if (ctx.collectHits) {
      if (typed > rv.typed) { rv.typed = typed; Sound.tick(); }
      if (k > rv.shown) {
        rv.shown = k;
        const ln = all[k - 1];
        if (k > 1 && ln.mapView) Sound.tick();
        else if (k > 1 && ln.reveal != null) { /* its offer pop plays */ }
        else if (k > 1 && (ln.text || ln.box || ln.row || ln.list)) rv.sound === 'climb' ? Sound.climb(rv.climbs = (rv.climbs || 0) + 1) : Sound.ui();
      }
      // all in and settled: hand back to the normal screen (header, HUD, tray return)
      if (k === all.length && now > t + 350 && Math.abs(rv.y - target) < 0.05 && rv.center === 'board' && !rv.done) {
        rv.done = true; Sound.ui();
        if (rv.msg) setMsg(rv.msg.text, rv.msg.col);   // the header's line types in as it comes back
      }
    }
  }

  function overLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const r = st.result;
    const statLine = txt => lines.push({ text: txt, colorAt: i => /\d/.test(txt[i]) ? C.bright : C.mid });
    if (r.sector) {
      // Sector clear: an unlocked padlock, then cash out or push on.
      for (const l of ['     .---.     ', '    /  _  \\    ', '    | | | |    ', '    | |        ', ' +===========+ ', ' |  R O O T  | ', ' +===========+ ']) {
        lines.push({ text: l, col: C.gold, bold: true });
      }
      T('');
      lines.push({ text: `SECTOR ${r.n} CLEARED`, col: C.cyan, bold: true });
      T(r.skipped ? 'OMNI//CORE skipped. no boss reward.' : 'OMNI//CORE is yours.', r.skipped ? C.redDim : C.text);
      T('');
      statLine(`layers ${pad2(r.depth)}   corps ${r.corps}   cr ${r.earned}`);
      T('');
      if (r.practice) T('practice run: no REP', C.redDim);
      else lines.push({ text: `cash out now: +${r.rep} REP`, col: C.gold, bold: true });
      T(legacyLv('dms') ? `dying keeps ${[0, 25, 50][legacyLv('dms')]}% of your REP.` : 'die later and you bank nothing.', C.dim);
      T('');
      lines.push({ box: true, text: 'P U S H   O N', sub: r.skipped ? `- into sector ${r.n + 1} -` : '- boss loot, then onward -', id: 'push', onTap: pushOn, minW: 26 });
      lines.push({ text: '[ CASH OUT ]', id: 'cash', onTap: cashOut });
      return lines;
    }
    if (r.win) {
      lines.push({ text: 'JACKED OUT CLEAN', col: C.cyan, bold: true });
      { const prof = profile(), sty = styleOf(prof.style);
        lines.push({ text: ` ${logoMark(prof.logo)} ${prof.name} `, col: sty.fg, bgCol: sty.bg, bold: true }); }
      T(`${r.sectors} sector${r.sectors === 1 ? '' : 's'} cleared`, C.text);
      T('');
    } else {
    T('CONNECTION TERMINATED', C.red);
    { const prof = profile(), sty = styleOf(prof.style);   // your persona, in your colors
      lines.push({ text: ` ${logoMark(prof.logo)} ${prof.name} `, col: sty.fg, bgCol: sty.bg, bold: true }); }
    if (r.diedAt) T(`traced in ${r.diedAt}`, C.redDim);
    T('');
    }
    statLine(`layers ${pad2(r.depth)}   corps ${r.corps}   cr ${r.earned}`);
    if (!r.practice) {
      if (r.rep) lines.push({ text: `+${r.rep} REP banked   ${save.rep} REP`, col: C.gold, bold: !!r.win });
      else T(`REP lost: ${r.repWorth} (cash out to bank it)`, C.dim);
    }
    if (r.newBest) T('** new best **', C.cyan);
    else T(`best ${pad2(save.best)}   seed ${r.seed}`, C.mid);
    if (r.practice) T('practice run: not scored', C.redDim);
    // corps breached, by letter
    { const marks = r.breached.map(k => `[${corpDef(k).letter}]`).join(' ');
      const txt = `breached ${marks || 'none'}`;
      lines.push({ text: txt, colorAt: i => i < 9 ? C.mid : marks ? C.cyan : C.dim }); }
    T('');
    // mods, drawn like the tray
    if (r.mods.length) {
      for (let i = 0; i < r.mods.length; i += 5) lines.push({ gap: 2, row: r.mods.slice(i, i + 5).map(k => ({ badge: k, plain: true, tier: r.modTier[k] || 0 })) });
    } else T('no mods: a naked run', C.dim);
    lines.push(r.items.length ? { gap: 1, row: r.items.map(x => ({ text: itemLabel(x), col: itemCol(itemView(x.key, x.tier)) })) } : { text: 'no items', col: C.dim });
    T('');
    // the map, with the path you took (scrolls when it's taller than the space left)
    const rest = 1 + 3 + 1 + 1;   // gap, NEW RUN box, retry, back
    const used = lines.reduce((a, ln) => a + (ln.box ? 3 : 1), 0);
    const view = clamp(L.hc - 2 - used - rest, 5, mapRows(r.map));
    const om = st.overMap || (st.overMap = { top: null });
    const atRow = mapRowOf(r.map[r.at], r.map);
    if (om.top == null) om.top = atRow - Math.floor(view / 2);
    om.top = clamp(om.top, 0, mapRows(r.map) - view);
    om.view = view;
    lines.push({ mapView: true, h: view, top: om.top, r });
    T('');
    lines.push({ box: true, text: 'N E W   R U N', id: 'new', onTap: newRun, minW: 24 });
    lines.push({ text: '[ RETRY SEED ]', id: 'retry', onTap: retry });
    lines.push({ text: '[ BACK ]', id: 'title', onTap: () => swapTo(showTitle) });
    return lines;
  }

  // "No room": pick one of yours to replace with the new one (or keep what you have).
  // st.swap = { kind: 'mod' | 'item', key, tier, onDone }
  function openSwap(kind, key, tier, onDone) { st.swap = { kind, key, tier, onDone }; Sound.deny(); }
  function swapLines() {
    const sw = st.swap, run = st.run, lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const done = () => { const f = sw.onDone; st.swap = null; if (f) f(); };
    T(sw.kind === 'mod' ? 'MOD SLOTS FULL' : 'ITEM BELT FULL', C.red);
    T('');
    if (sw.kind === 'mod') {
      const v = modView(sw.key, sw.tier);
      T('to take', C.mid);
      lines.push({ badge: sw.key, badgeTier: sw.tier });
      T(`replace one of your ${MOD_SLOTS} mods:`, C.mid);
      T('');
      run.mods.forEach((k, i) => {
        const o = modView(k);
        lines.push({ list: true, id: 'sw' + i, badge: k, badgeTier: o.tier, name: o.name, col: modColor(o), right: tierLabel(o), rightCol: modColor(o), tint: modColor(o),
          onTap: () => { removeMod(k); addMod(sw.key, sw.tier); Sound.buy(); setMsg(`> swapped ${o.name.toLowerCase()} for ${v.name.toLowerCase()}.`, C.cyan); done(); } });
      });
    } else {
      const v = itemView(sw.key, sw.tier);
      T('to take', C.mid);
      lines.push({ text: `[${v.name}]`, col: itemCol(v), bold: true });
      T('replace one of your items:', C.mid);
      T('');
      run.items.forEach((s, i) => {
        const o = itemView(s.key, s.tier);
        lines.push({ list: true, id: 'sw' + i, name: itemLabel(s), col: itemCol(o), right: s.n > 1 ? `all ${s.n}` : 'item', rightCol: C.mid,
          onTap: () => { run.items.splice(i, 1); addItem(sw.key, sw.tier); Sound.buy(); setMsg(`> swapped for ${v.name.toLowerCase()}.`, C.cyan); done(); } });
      });
    }
    T('');
    T('the one you replace is gone.', C.dim);
    T('');
    lines.push({ text: '[ KEEP WHAT I HAVE ]', id: 'swkeep', onTap: () => { st.swap = null; Sound.ui(); } });
    return lines;
  }

  function panelLines() {
    const now = performance.now();
    if (st.mode === 'panel' && st.swap) return swapLines();
    if (st.mode === 'title') return titleLines(now);
    if (st.mode === 'over' && st.result) return overLines();
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    if (st.mode === 'panel' && st.panelFn) st.panelFn(T, B, ln => lines.push(ln), lines);
    return lines;
  }

  // ---------------- Render loop ----------------
  let last = performance.now(), lastRunSave = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateParts(dt);
    updateTimer(dt);
    layerTick(now);
    stepPaletteFade(now);
    if (st.mp) { mpWatchdog(now); mpClockTick(now); }
    mpTabTitle(now);
    if (st.wipe && st.wipe.endsAt && now > st.wipe.endsAt) st.wipe = null;
    if (st.run && now - lastRunSave > 2000) { lastRunSave = now; saveRun(); }   // resume after a reload
    st.fieldRect = null;
    render(now);
    Field.sync();
    Music.focus(st.mode === 'play' && st.lv && st.lv.focus != null && !st.pause && !st.bossIntro && !st.wipe ? st.lv.focus : null);
    { const ta = dragCorp() ? 'none' : ''; if (cv.style.touchAction !== ta) cv.style.touchAction = ta; }   // drags don't scroll the page
    requestAnimationFrame(frame);
  }

  function render(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.bg;
    g.fillRect(0, 0, W, H);
    const sk = (now - shakeFx.t0) / 1000;
    if (sk < shakeFx.dur) {
      const a = shakeFx.amp * (1 - sk / shakeFx.dur);
      g.translate(rand(-a, a), rand(-a, a));
    }
    st.flipNow = flipNow();
    if (st.flipNow) { g.translate(W, H); g.rotate(Math.PI); }   // UPSIDE
    hits = [];
    const cells = buildScene(now, true);
    for (const b of bgs) {
      g.globalAlpha = b.alpha;
      g.fillStyle = b.col;
      g.fillRect(L.ox + b.cx * L.cw, L.oy + b.cy * L.chh, b.w * L.cw, L.chh);
    }
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const bold of [false, true]) {
      g.font = `${bold ? DRAW_FONT.bold : DRAW_FONT.weight} ${L.fs * DRAW_FONT.scale}px ${DRAW_FONT.family}`;
      for (const c of cells) {
        if (!!c.bold !== bold) continue;
        g.fillStyle = c.col;
        if (c.r180) { g.save(); g.translate(pxX(c.cx), pxY(c.cy)); g.rotate(Math.PI); g.fillText(c.ch, 0, 0); g.restore(); }
        else g.fillText(c.ch, pxX(c.cx), pxY(c.cy));
      }
    }
    g.font = `${DRAW_FONT.weight} ${L.fs * DRAW_FONT.scale}px ${DRAW_FONT.family}`;
    for (const p of parts) {
      if (p.t < 0) continue;
      g.globalAlpha = Math.max(0, p.alpha);
      g.fillStyle = p.col;
      if (p.rot) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillText(p.ch, 0, 0); g.restore(); }
      else g.fillText(p.ch, p.x, p.y);
    }
    g.globalAlpha = 1;
    const fk = (now - flashFx.t0) / 1000;
    if (fk < flashFx.dur) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalAlpha = flashFx.a * (1 - fk / flashFx.dur);
      g.fillStyle = flashFx.col;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }
  }

  // ---------------- Helpers ----------------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function setMsg(msg, col = C.text) { st.msg = msg; st.msgCol = col; st.msgT = performance.now(); }
  const candidates = () => st.lv ? st.lv.tiles.filter(t => t.state === 'closed' && !t.loaded && !t.ruledOut) : [];

  function availableNodes() {
    const run = st.run;
    if (!run) return [];
    // Dev "free travel": every node except the one you're on.
    if (st.freeTravel) return Object.keys(run.map).filter(id => id !== run.at && id !== '0:1');
    // Links out of where you are, minus stops you've been to (sideways links go both ways).
    return run.at ? run.map[run.at].next.filter(id => !run.visited.includes(id)) : ['0:1'];
  }

  function showBoard(mode) {
    st.mode = mode;
    st.selItem = -1; st.selMod = -1;
    st.kbFocus = null; st.keyHandler = null; st.scroll = null;
    st.hideBoard = false; st.hideAll = false;
    computeLayout();
    wipeIn();
  }

  // Wipe the board out, then open the next screen (which wipes in).
  async function swapTo(openFn, level = 0) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(level);
    st.transitioning = false;
    openFn();
  }

  // ---------------- Run flow ----------------
  function showTitle() {
    st.run = null; st.corp = null; st.lv = null; st.timer = null; st.dying = false;
    st.savedRun = savedRun(); st.newArmed = false;
    st.panelFn = null;
    scenePalette(null);
    showBoard('title');
    st.busy = false;
    setMsg('> link ready_');
  }

  function rerollSeed() {
    st.seed = newSeed();
    st.practice = false;
    Sound.ui();
    setMsg('> new seed rolled.');
  }

  async function startRun(seed, practice) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(0);
    st.seed = seed; st.practice = practice;
    st.run = {
      seed, practice,
      map: genMap(seed),
      finalTell: pickR(['corner', 'mark', 'mirror'], rngFor(seed, 'final')),
      at: '0:1', visited: ['0:1'],
      integrity: CONFIG.startIntegrity + legacyLv('hard'), maxInt: CONFIG.startIntegrity + legacyLv('hard'), shield: 0,
      credits: 25 * legacyLv('cash'), earned: 0, items: CONFIG.startItems.map(key => ({ key, tier: 0, n: 1 })), mods: [], modTier: {},
      beltSlots: CONFIG.beltSlots + legacyLv('belt'), reroutes: 0,
      depth: 0, corps: 0, sector: 0, sectorsCleared: 0, resumes: 0, pending: null,
    };
    if (legacyLv('kit')) st.run.items.push({ key: 'patch', tier: 0, n: 1 });
    for (const x of st.run.items) markSeen(x.key);
    clearRun();
    st.result = null;
    st.transitioning = false;
    // Straight into the public net; the map comes after.
    startCorp(st.run.map['0:1']);
  }

  function toMap(fromSector) {
    st.corp = null; st.lv = null; st.timer = null;
    scenePalette(null);
    st.mapSel = null; st.hoverNode = null;
    st.run.pending = null;
    showBoard('map');
    // The map shows one sector at a time; scrolling moves a whole sector, line by line.
    const target = sectorViewRow(st.run.sector);
    st.mapView = { sector: st.run.sector, row: fromSector != null ? sectorViewRow(fromSector) : target, target, t: 0 };
    st.scroll = d => scrollMapSector(d > 0 ? -1 : 1);   // wheel / swipe down = older sectors
    st.busy = false;
    setMsg(st.run.sector ? `> sector ${st.run.sector + 1}. choose your next target.` : '> choose your next target.');
    saveRun();
  }

  // Map rows count down from the top of the whole map; a sector view starts at its OMNI.
  const sectorViewRow = v => (mapTop(st.run.map) - SECTOR_STEPS * (v + 1)) * 3;
  function scrollMapSector(d) {
    const mv = st.mapView, run = st.run;
    if (!mv || st.mode !== 'map') return;
    if (mv.row !== mv.target) return;   // let the last scroll finish
    const v = clamp(mv.sector + d, 0, run.sector);
    if (v === mv.sector) { Sound.deny(); return; }
    mv.sector = v; mv.target = sectorViewRow(v);
    if (v !== run.sector) st.mapSel = null;
  }
  // Called every frame: move the view one map row at a time toward its target.
  function stepMapView(now) {
    const mv = st.mapView;
    if (!mv || mv.row === mv.target) return;
    if (now - mv.t < 22) return;
    mv.t = now;
    mv.row += Math.sign(mv.target - mv.row);
    if (mv.row % 3 === 0) Sound.tick();
  }

  function selectNode(id) {
    if (st.transitioning || !availableNodes().includes(id)) return;
    if (st.mapSel === id) return enterNode(st.run.map[id]);
    st.mapSel = id;
    Sound.ui();
  }

  async function enterNode(node, warp = false) {
    if (st.transitioning || !node || (!warp && !availableNodes().includes(node.id))) return;
    st.transitioning = true;
    const run = st.run;
    await wipeOut(0);
    run.at = node.id;
    run.visited.push(node.id);
    st.transitioning = false;
    if (node.type === 'shop') return openShop(node);
    if (node.type === 'cache') return openCache(node);
    if (node.type === 'repair') return openRepair(node);
    startCorp(node);
  }

  async function startCorp(node, startIdx = 0, restore = null) {
    let def = corpDef(node.corp);
    if (node.type === 'final' && node.corp === 'omni') {   // OMNI copies one corp you beat in this sector
      const pool = ((st.run.beat || {})[node.sector || 0] || []).filter(k => CORPS[k]);
      if (pool.length) def = omniCopy(pickR(pool, rngFor(st.run.seed, 'omnicopy', node.sector || 0)), pool);
    }
    const t = node.tier;
    const counts = node.type === 'start' ? [1] : Array.from({ length: CONFIG.corpLayers }, (_, i) => clamp(t + 1 + i + (def.nodes || 0), 2, CONFIG.maxNodes));
    const sector = node.sector || 0;
    // OMNI borrows a tell, a new one each sector
    let tell = node.type === 'final' && node.corp === 'omni' && !def.copied ? ((node.sector || 0) === 0 ? st.run.finalTell : pickR(['corner', 'mark', 'mirror'], rngFor(st.run.seed, 'final', node.sector))) : def.tell;
    if (tell === 'mirror' && t >= 2) tell = 'vmirror';   // deeper Mirrorlines mirror top-bottom
    if (tell === 'corner' && t >= 2 && node.type !== 'final') tell = 'edge';   // deeper Perimeters: anywhere on the edge (OMNI keeps corners)
    let mark = null;
    if (tell === 'mark') {
      const level = clamp(t, 1, 3);
      mark = { level, glyph: level === 1 ? pickR(MOTIFS, rngFor(st.run.seed, 'sigil', node.id)) : null };
    }
    st.corp = {
      def, node, tier: t, idx: Math.min(startIdx, counts.length - 1), counts,
      hasBoss: node.type !== 'start',
      tell, mark, mod: (node.type === 'corp' || node.type === 'final') && CORP_MODS[node.mod] ? node.mod : null,
      stageBoss: node.type === 'final' && node.corp !== 'omni',
      timer: def.timer ? Math.max(6, corpTimer(def, t) - sector) : 0, pay: corpPay(def, t),
      sector, tellStr: Math.max(0.55, CONFIG.tellStrength - CONFIG.sectorHeat * sector),
      prevSafe: null,
    };
    if (restore) {   // a resumed save: what this corp had used up so far
      for (const k of ['prevSafe', 'bulwarkUsed', 'burnerUsed', 'wallAll', 'ice', 'perfects', 'scored', 'carry', 'pins', 'friendUsed', 'tapUsed', 'rad', 'ride', 'tickets', 'stolen', 'rival']) if (restore[k] != null) st.corp[k] = restore[k];
    }
    if (st.corp.hasBoss) {
      // MUTATE: this corp, it counts as a random other mod.
      if (st.run.mods.includes('mutate')) {
        const pool = modsOfKind('gen', 'minor').filter(k => !st.run.mods.includes(k) && !['buffer', 'stash', 'burner'].includes(k));
        st.run.mutateAs = pickR(pool, rngFor(st.run.seed, 'mutate', node.id));
      }
      // HOROSCOPE: one lucky layer per corp
      st.corp.luckyIdx = Math.floor(rngFor(st.run.seed, 'lucky', node.id)() * counts.length);
      st.corp.jackIdx = Math.floor(rngFor(st.run.seed, 'jack', node.id)() * counts.length);
      st.corp.petIdx = Math.floor(rngFor(st.run.seed, 'pet', node.id)() * counts.length);
      if (!restore && def.onEnter) def.onEnter(st.corp);
    }
    // Corps use their own colors; the public net uses the player's.
    scenePalette(node.type === 'start' ? null : def.key);
    // A short boot-up screen first (skipped for dev boss jumps).
    if (st.corp.hasBoss) markSeen('corp_' + def.key);   // codex: corp found
    if (st.corp.hasBoss && startIdx === 0) await corpIntro();
    enterLayer();
  }

  // Boss entrance (~2.5s, tap / any key skips): the calm (empty screen, music muffled),
  // the warning (red text types in, alarms, red pulses, the shake grows), the build
  // (riser + roll), then the caller slams the board in.
  async function bossEntrance(c, n) {
    st.wipe = null;
    st.bossIntro = { t0: performance.now(), name: c.def.name, line: (c.def.bossDesc || '').replace(/^boss: /, ''), n, skip: false };
    Music.muffle(true);
    const bi = st.bossIntro;
    const hold = async ms => { const end = performance.now() + ms; while (performance.now() < end && !bi.skip) await wait(30); };
    await hold(450);                                                     // the calm
    for (let i = 0; i < 3 && !bi.skip; i++) {                            // the warning
      Sound.alarm(); shake(2 + i * 2, 0.35); flash(C.red, 0.1 + i * 0.04, 0.3);
      await hold(480);
    }
    if (!bi.skip) { bi.buildAt = performance.now(); Sound.bossBuild(); shake(7, 0.6); await hold(560); }   // the build
    st.bossIntro = null;
    Music.muffle(false);
  }

  function buildBossIntro(ctx, now) {
    const bi = st.bossIntro, e = now - bi.t0;
    const typed = (text, at, speed = 28) => text.slice(0, clamp(Math.floor((e - at) / speed), 0, text.length)).padEnd(text.length);
    const lines = [];
    if (e > 450) lines.push({ text: typed('!! WARNING !!', 450), col: Math.floor(now / 200) % 2 ? C.red : C.bright, bold: true });
    if (e > 450) lines.push({ text: '' });
    if (e > 900) lines.push({ text: typed(`${bi.name} // BOSS`, 900), col: C.red, bold: true });
    if (e > 1300) lines.push({ text: typed(bi.line, 1300, 18), col: C.text });
    if (e > 1300) lines.push({ text: '' });
    if (e > 1750) lines.push({ text: typed(`${bi.n} nodes. one is real.`, 1750, 18), col: C.mid });
    // red pulses behind it, growing through the build
    const pulse = e < 450 ? 0 : bi.buildAt ? 0.12 + 0.3 * Math.min(1, (now - bi.buildAt) / 560) : 0.1 * (0.5 + 0.5 * Math.sin(e / 90));
    if (pulse > 0) for (let r = 0; r < L.hc; r++) ctx.bg(0, r, L.wc, C.red, pulse * (r % 2 ? 0.8 : 1));
    if (lines.length) buildTextBoard(ctx, lines, { top: 0, h: L.hc });
  }

  // Corp intro: art, name, quote, a few boot lines. Tap or any key skips.
  async function corpIntro() {
    const c = st.corp, def = c.def;
    const art = CORP_ART[def.key] || [];
    const artW = Math.max(0, ...art.map(l => l.length));
    const rules = corpRules(def, c.tier);
    const boot = [
      [`> connecting to ${def.name.toLowerCase().replace(/[^a-z/]+/g, '.')}`, C.mid],
      ['> handshake ............... ok', C.mid],
      [`> mapping ${c.counts.length - 1} layers + boss .... ok`, C.mid],
      ['> ICE detected ............ yes', C.red],
    ];
    const spoil = has('spoiler') && st.run && c.hasBoss && !(st.run.spoiled || {})[def.key] && CORP_TELL[def.key];
    if (spoil) st.run.spoiled = Object.assign({}, st.run.spoiled, { [def.key]: true });
    const spoilLines = spoil ? wrapText('spoiler: ' + CORP_TELL[def.key], 31) : [];
    st.intro = { skip: false };
    openPanel(def.name, (T, B, X) => {
      for (const l of art) T(l.padEnd(artW), C.cyan);
      T('');
      X({ text: def.name, col: C.bright, bold: true });
      if (c.stageBoss) T('// SECTOR BOSS //', C.red);
      T(c.tier ? `TIER ${c.tier}${def.level ? '   LV ' + def.level : ''}` : '', C.mid);
      T(def.intel, C.text);
      T(rules, C.mid);
      if (c.mod) T(`+ ${CORP_MODS[c.mod].name}: ${CORP_MODS[c.mod].desc}`, C.gold);
      spoilLines.slice(0, 3).forEach((l, j) => T(j === 2 && spoilLines.length > 3 ? l.slice(0, 28) + '...' : l, C.gold));
      T('');
      boot.forEach(([text, col], i) => X({ text: text.padEnd(31), col, reveal: i, revealId: 'boot' + i }));
      T('');
      T(Math.floor(performance.now() / 500) % 2 ? 'tap to skip' : '', C.dim);
    }, `> breaching ${def.name.toLowerCase()}...`);
    st.busy = true;
    const t0 = performance.now();
    const hold = CONFIG.introHold + (st.wipe ? st.wipe.dur : 0);
    while (performance.now() - t0 < hold && !st.intro.skip) await wait(40);
    st.intro = null;
    await wipeOut(0);
  }

  async function enterLayer() {
    const c = st.corp, run = st.run;
    const n = c.counts[c.idx];
    const boss = c.hasBoss && c.idx === c.counts.length - 1;
    let tell = c.tell;
    if (boss && c.def.bossTell) tell = c.def.bossTell;
    const lv = genLayer({ seed: run.seed, nodeId: c.node.id, idx: c.idx, n, tell, prevSafe: c.prevSafe, loot: !boss && c.hasBoss, mark: c.mark,
      tellStr: c.tellStr, salt: run.resumes || 0, dress: c.hasBoss ? c.def.dress : null, tier: c.tier, boss,
      alwaysFollow: !!c.def.alwaysFollow, carry: c.carry || null, lootMore: c.mod === 'loaded' });
    lv.after = c.prevSafe;       // last layer's real node, for AFTERIMAGE
    if (c.mod === 'branded' && n > 2) {   // BRANDED: about a third of the ICE wear the sigil
      const ice = shuffle(lv.tiles.filter(t => !t.safe && !t.loaded), rngFor(run.seed, 'brand', c.node.id, c.idx));
      for (const t of ice.slice(0, Math.max(1, Math.round(ice.length / 3)))) { t.marked = true; t.brand = true; }
    }
    if (has('dejavu') && c.hasBoss && c.idx === 0 && n > 1 && run.lastReal && run.lastReal.col < lv.cols && run.lastReal.row < lv.rows) {
      const real = lv.tiles[lv.safe], cell = run.lastReal.row * lv.cols + run.lastReal.col, other = lv.tiles.find(t => t.cell === cell);
      if (other !== real) {
        if (other) setCellOf(lv, other, real.cell);
        setCellOf(lv, real, cell);
        lv.tiles.sort((a, b) => a.cell - b.cell);
        lv.safe = lv.tiles.indexOf(real); lv.safeCell = { col: real.col, row: real.row };
      }
      lv.dejavu = true;
    }
    c.prevSafe = lv.safeCell;
    lv.payCut = 0; lv.ocCount = 0;
    lv.boss = boss;
    lv.misses = 0;
    lv.split = false;
    lv.dmg = boss && (c.def.bossDmg || c.stageBoss) ? (c.def.bossDmg || 2) : 1;   // sector bosses hit for 2
    st.lv = lv;
    st.hover = -1; st.sel = -1;
    c.depthAt = run.depth;
    run.depth++;
    // Codex: every glyph that shows up on a board counts as found.
    for (const t of lv.tiles) {
      const gi = MOTIFS.indexOf(t.glyph);
      if (gi >= 0) markSeen('g' + gi);
      if (t.loaded) markSeen('gloot');
      if (t.marked) markSeen('gsig');
    }
    if (n === 1) markSeen('gjack');
    if (boss && c.def.bossFlash) markSeen('gmask');
    st.timer = makeTimer();
    st.busy = true;
    if (boss) {
      await bossEntrance(c, n);
      for (const t of lv.tiles) t.hidden = true;     // nodes power on one by one
      showBoard('play');
      st.busy = true;
      Sound.bossDrop(); shake(10, 0.6); flash(C.red, 0.22, 0.45);
      setMsg(`> BOSS LAYER. ${n} nodes.`, C.red);
      for (const t of has('precog') ? [lv.tiles[lv.safe], ...lv.tiles.filter(o => !o.safe)] : lv.tiles) { await wait(70); t.hidden = false; Sound.nodeOn(); }
      if (c.def.bossFlash) lv.maskAt = performance.now() + 450 + CONFIG.maskDelayMs;   // SIGIL: the clock starts once you can see them
      await wait(200);
    } else if (c.idx === 0 && n > 1 && modsAt('start').includes('runway')) {
      // RUNWAY (START): the first layer walks in one node at a time; the real node last.
      const order = shuffle(lv.tiles.filter(t => !t.safe), rngFor(run.seed, 'runway', c.node.id)).concat([lv.tiles[lv.safe]]);
      for (const t of lv.tiles) t.hidden = true;
      showBoard('play');
      st.busy = true;
      Sound.layer(run.depth); setMsg('> runway: the collection walks in.', C.cyan);
      for (const t of order) { await wait(140); t.hidden = false; Sound.nodeOn(); }
      await wait(250);
    } else {
      showBoard('play');
      st.busy = true;
      Sound.layer(run.depth); setMsg(n === 1 ? '> one node. it is real. jack in.' : `> ${n} nodes. one is real.`);
      if (has('precog') && c.hasBoss && n > 1) {   // PRECOG: the real node shows up a beat early
        for (const t of lv.tiles) if (!t.safe) t.hidden = true;
        Sound.ping(1568); await wait(260);
        for (const t of lv.tiles) t.hidden = false;
        await wait(220);
      } else await wait(480);
    }
    // START stage: layer-start mods, left to right on the bar. Each locks at most one ICE.
    const iceWhere = f => lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed' && f(t));
    const starts = {
      sniffer: () => true,
      corners: t => (t.col === 0 || t.col === lv.cols - 1) && (t.row === 0 || t.row === lv.rows - 1),
      sigscan: t => t.marked,
      basictraining: c.idx === 0 ? () => true : null,
      snipe: run.credits >= 100 ? () => true : null,
    };
    for (const key of modsAt('start')) {
      const f = starts[key];
      if (!f || n < 2) continue;   // AFTERIMAGE is START too, but it only draws a mark
      const opts = iceWhere(f);
      if (!opts.length) continue;
      lockTile(pickR(opts, rngFor(run.seed, key, c.node.id, c.idx)), C.mid, key);
      setMsg(`> ${MODS[key].name.toLowerCase()}: 1 ICE locked.`, C.mid);
      await wait(250);
    }
    // FOUR IN A ROW: an armed boss starts with 2 ICE locked
    if (lv.boss && st.run.p4Ready && has('fourinarow')) {
      st.run.p4Ready = false;
      for (const t of shuffle(iceWhere(() => true), rngFor(run.seed, 'p4', c.node.id)).slice(0, 2)) lockTile(t, C.gold, 'fourinarow');
      setMsg('> four in a row: 2 ICE down.', C.gold);
      await wait(250);
    }
    // START stage notes: hint mods put a short note on row 7 (left to right on the bar).
    lv.notes = [];
    if (n > 1 && c.hasBoss) {
      for (const key of modsAt('start')) if (START_NOTE[key]) { const note = START_NOTE[key](lv, c, run); if (note) lv.notes.push(note); }
      if (has('horoscope') && c.luckyIdx === c.idx) lv.notes.push({ text: 'lucky layer!' });
      if (has('handshake')) { const row = lv.tiles[lv.safe].row; lv.notes.push({ text: `hs: ${'o'.repeat(row + 1)}` }); Sound.beeps(row + 1); }
      if (has('chancecard') && c.idx === 0) lv.notes.push({ text: chanceCard(lv, c, run) });
      if (c.stolen && c.stolen.length) lv.notes.push({ text: `stolen: ${c.stolen.map(k => MODS[k].short).join(' ')}` });
      if (lv.dejavu) lv.notes.push({ text: 'deja vu' });
      if (has('scoop') && c.idx === 0) lv.notes.push({ text: `scoop: ${ROW_NAMES(lv.rows, lv.tiles[lv.safe].row)}` });
      if (has('cctv')) {
        const ice = lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed');
        if (ice.length) lv.cctv = { t: pickR(ice, rngFor(run.seed, 'cctv', c.node.id, c.idx)), at: 1000 };
      }
      if (c.express && !lv.lift) lv.lift = makeLift(lv.tiles[lv.safe].row, rngFor(run.seed, 'express', c.node.id, c.idx), 1150);
      if (has('pickset') && (c.pins || 0) >= 3) { c.pins = 0; lv.litRow = lv.tiles[lv.safe].row; lv.notes.push({ text: `pins set: ${ROW_NAMES(lv.rows, lv.litRow)}` }); }
    }
    if (c.hasBoss && c.def.intro && n > 1) { await c.def.intro(lv, c); if (st.lv !== lv) return; }   // corp kit: MONTE's shuffle
    if (lv.maskMs) lv.maskAt = performance.now() + lv.maskMs;   // corp kit: FORGET-ME-NOT
    // JACK-IN-THE-BOX: in one layer per corp, an ICE pops out 1-3s in (layerTick does it)
    if (has('companion') && c.hasBoss && n > 2 && c.petIdx === c.idx) lv.petAt = performance.now() + 1500 + rngFor(run.seed, 'pett', c.node.id)() * 3000;
    if (has('jackbox') && c.hasBoss && n > 2 && c.jackIdx === c.idx) lv.jackAt = performance.now() + 1000 + rngFor(run.seed, 'jackt', c.node.id)() * 2000;
    st.busy = false;
    lv.readyAt = performance.now();
    lv.shownAt = lv.readyAt;   // unlike readyAt, this one doesn't reset after a miss
    c.express = false;
  }

  // Clock for this layer: the corp's own, or one added by OVERCLOCK.
  function makeTimer() {
    const c = st.corp, lv = st.lv;
    let max = c.timer || (has('overclock') && c.hasBoss ? CONFIG.overclockClock : 0) || (c.mod === 'rush' ? 10 : 0);
    if (!max) return null;
    if (lv && lv.boss && c.def.bossShrink) max = Math.max(3, max - 3 * lv.misses);
    if (c.def.shot) max = Math.max(5, max - c.idx);   // COLDBREW: another shot
    if (has('coolant')) max += tv('coolant', [3, 5, 8]);
    if (has('overtime') && lv && lv.boss) max += 5;   // OVERTIME
    return { max, left: max, lastSec: max, ocNext: CONFIG.overclockStart };
  }

  // Lock a trap tile without damage (sniffer, purge).
  // source: what locked it (purge, burner, sniffer, corners, sigscan, echo, overclock).
  function lockTile(t, col, source = 'purge') {
    const i = st.lv.tiles.indexOf(t);
    const { x, y } = tileCenter(t);
    explode(snapshot(c => c.own === 't' + i), x, y, { col, power: 0.6 });
    t.state = 'locked';
    t.lockedBy = source;
    Sound.shield();
  }

  function updateTimer(dt) {
    const tm = st.timer;
    if (!tm || st.mode !== 'play' || st.busy || st.transitioning || st.dev || st.pause) return;
    if (st.lv && st.lv.holdUntil && performance.now() < st.lv.holdUntil) return;   // ESPRESSO, FREEZE FRAME
    tm.left -= dt * ((st.lv && st.lv.clockRate) || 1);   // TIMEWARP
    const sec = Math.ceil(tm.left);
    if (sec < tm.lastSec) { tm.lastSec = sec; if (sec <= 3 && sec > 0) Sound.clock(); }
    // OVERCLOCK: near the end, purge ICE one by one; each purge cuts the payout.
    const lv = st.lv;
    if (has('overclock') && tm.left <= tm.ocNext && tm.left > 0.5 && lv.ocCount < 3) {
      tm.ocNext -= 2;
      const opts = lv.tiles.filter(t => !t.safe && t.state === 'closed');
      if (opts.length > 0 && candidates().length > 1) {
        lockTile(opts[Math.floor(Math.random() * opts.length)], C.mid, 'overclock');
        lv.ocCount++;
        lv.payCut = Math.min(0.9, lv.payCut + CONFIG.overclockCut);
        setMsg(`> overclock: purged 1. pay -${Math.round(lv.payCut * 100)}%`, C.mid);
      }
    }
    if (tm.left <= 0 && has('overtime') && st.lv && !st.lv.otUsed) {   // OVERTIME: once a layer, 5 more seconds
      st.lv.otUsed = true; tm.left = 5; tm.lastSec = 5;
      Sound.shield(); setMsg('> overtime! +5s.', C.cyan);
      return;
    }
    if (tm.left <= 0) {
      tm.left = 0;
      const opts = candidates().length ? candidates() : st.lv.tiles.filter(t => t.state === 'closed');
      const t = opts[Math.floor(Math.random() * opts.length)];
      setMsg('> clock ran out.', C.red);
      if (t) pick(st.lv.tiles.indexOf(t));
    }
  }

  // Things that happen on their own during a layer.
  function layerTick(now) {
    const lv = st.lv;
    if (!lv) return;
    const dt = lv.lastNow ? Math.min(100, now - lv.lastNow) : 0;
    lv.lastNow = now;
    if (st.mode !== 'play' || st.busy || st.transitioning || st.dev || st.pause || st.mp || st.wipe || lv.shownAt == null) return;
    // JACK-IN-THE-BOX: pop!
    if (lv.jackAt && now > lv.jackAt) {
      lv.jackAt = null;
      const opts = lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed');
      if (opts.length && candidates().length > 1) {
        lockTile(pickR(opts, rngFor(st.run.seed, 'jackbox', st.corp.node.id, st.corp.idx)), C.gold, 'jackbox');
        Sound.jingle();
        setMsg('> jack-in-the-box: pop! 1 ICE out.', C.gold);
      }
    }
    // COMPANION: sniff sniff (for a 1cr treat)
    if (lv.petAt && now > lv.petAt) {
      lv.petAt = null;
      const opts = lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed');
      if (st.run.credits < 1) setMsg('> no treats, no sniffing. (0cr)', C.mid);
      else if (opts.length && candidates().length > 1) {
        st.run.credits -= 1;
        lockTile(pickR(opts, rngFor(st.run.seed, 'pet', st.corp.node.id, st.corp.idx)), C.cyan, 'companion');
        Sound.jingle();
        setMsg('> sniff sniff. 1 ICE found. -1cr', C.cyan);
      }
    }
    if (lv.holdUntil && now < lv.holdUntil) return;   // ESPRESSO / FREEZE FRAME stop the layer's clock too
    lv.lt = (lv.lt || 0) + dt;
    const def = st.corp && st.corp.hasBoss ? st.corp.def : null;
    if (def && has('stethoscope') && !def.drag) { const c = nearness(lv, lv.tiles[lv.safe], 2); lv.focus = c == null ? null : 0.5 + 0.5 * c; }   // STETHOSCOPE
    if (def && has('influencer')) {   // INFLUENCER: pointless numbers and emoji
      const run = st.run;
      run.fol = Math.max(10, (run.fol || 120) + (Math.random() - 0.48) * 6);
      if (!lv.inflNext || now > lv.inflNext) {
        lv.inflNext = now + 1200 + Math.random() * 1800;
        floatText(pickR([...SQ_GOOD, ...SQ_BAD], Math.random), pxX(rand(4, L.wc - 4)), pxY(BOARD_Y + rand(2, L.gh - 2)), Math.random() < 0.5 ? C.cyan : C.red, 1.4);
      }
      const nt = (lv.notes = lv.notes || []).find(n2 => n2.tag === 'infl');
      if (nt) nt.text = `@you ${kfmt(run.fol)}`; else lv.notes.push({ text: `@you ${kfmt(run.fol)}`, tag: 'infl' });
    }
    if (def && st.corp.mod === 'rival') { rivalTick(lv, now); if (st.busy) return; }   // RIVAL
    if (def && def.tick) def.tick(lv, lv.lt, dt, now);
  }

  // CHANCE CARD: the card for this corp (applied right away). Returns the note.
  function chanceCard(lv, c, run) {
    const u = rngFor(run.seed, 'chance', c.node.id)();
    if (u < 0.3) {
      const ice = lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed');
      if (ice.length > 1) { lockTile(pickR(ice, rngFor(run.seed, 'chancelock', c.node.id)), C.gold, 'chancecard'); return 'chance: 1 ICE locked'; }
    }
    if (u < 0.55 || (u < 0.7 && !st.timer)) { run.credits += 10; run.earned += 10; return 'chance: +10cr'; }
    if (u < 0.7) { st.timer.max += 3; st.timer.left += 3; return 'chance: +3s'; }
    if (u < 0.92) return 'chance: nothing';
    run.integrity = Math.max(1, run.integrity - 1);
    return 'chance: -1 int!';
  }

  // GLACIER: the frost reached the real node. A hit, but the layer counts (no perfect).
  async function frostbite(t) {
    const run = st.run, lv = st.lv;
    st.busy = true;
    lv.scanned = true;
    run.integrity -= 1;
    Sound.trap(); shake(9); flash(C.cyan, 0.2, 0.4);
    setMsg('> frostbite. integrity -1.', C.red);
    await wait(500);
    if (run.integrity <= 0) return die();
    await onSafe(t);
  }

  function resetTimer() {
    if (!st.timer) return;
    st.timer = makeTimer();
  }

  async function pick(i) {
    if (st.mp) return mpTap(i);
    { const byp = st.lagBypass; st.lagBypass = false;   // corp kit: LAGRANGE holds taps back
      if (!byp && st.mode === 'play' && !st.busy && st.corp && st.corp.hasBoss && st.corp.def.intercept && st.lv && st.lv.tiles[i] && st.corp.def.intercept(i)) return; }
    if (st.mode !== 'play' || st.busy) return;
    const t = st.lv.tiles[i];
    if (!t || t.state !== 'closed') return;
    st.busy = true;
    st.sel = -1;
    st.selItem = -1; st.selMod = -1;
    st.lv.fast = st.lv.readyAt != null && performance.now() - st.lv.readyAt < CONFIG.fastpayMs;
    st.lv.late = !!(st.timer && st.timer.left <= 3);   // SURGE
    st.lv.surgeF = st.timer ? 1 - st.timer.left / st.timer.max : 0;
    st.lv.pickAt = performance.now();   // AMBUSH
    { const ph = beatClock(performance.now()).phase; st.lv.onBeat = ph < 0.15 || ph > 0.9; }   // ON BEAT
    if (st.corp && st.corp.hasBoss && st.corp.def.onPick) st.corp.def.onPick(t);   // corp kit (TOLLGATE)
    t.probing = true;
    Sound.probe();
    setMsg('> probing...', C.mid);
    await wait(300);
    t.probing = false;
    // SYNAPSE learns where you pick (every pick, every corp)
    if (st.run && st.corp && st.corp.hasBoss) {
      const hb = st.run.habits = st.run.habits || { total: 0, corner: 0, edge: 0, middle: 0 };
      hb.total++; hb[cellZone(t, st.lv)]++; hb['c' + t.col] = (hb['c' + t.col] || 0) + 1;
      const sh = save.habits = save.habits || { total: 0, corner: 0, edge: 0, middle: 0 };   // FOURTH WALL: all your picks, ever
      sh.total++; sh[cellZone(t, st.lv)]++; sh['c' + t.col] = (sh['c' + t.col] || 0) + 1;
      if (sh.total % 5 === 0) persist();
    }
    // A corp's own pick rule (FORM 27B, DEMOLITION) can take the tap.
    if (st.corp && st.corp.hasBoss && st.corp.def.tap && st.corp.def.tap(t, i)) return;
    if (t.safe) return onSafe(t);
    // PICK stage. X-AXIS / Y-AXIS: the tap scans its row / column. If the real node is on
    // it, the scan catches it: no damage, the layer is passed (but it's not a perfect).
    // The first one on the bar that catches it wins.
    const real = st.lv.tiles[st.lv.safe];
    const scans = { xaxis: () => real.row === t.row, yaxis: () => real.col === t.col };
    const axis = real.state === 'closed' ? modsAt('pick').find(k => scans[k] && scans[k]()) || null : null;
    if (axis) return onScan(t, real, axis);
    await onTrap(t, i);
  }

  async function onScan(t, real, axis) {
    st.lv.scanned = true;
    lockTile(t, C.cyan, axis);
    flash(C.cyan, 0.12, 0.3);
    setMsg(`> ${MODS[axis].name.toLowerCase()} scan: it's in this ${axis === 'xaxis' ? 'row' : 'column'}.`, C.cyan);
    await wait(420);
    await onSafe(real);
  }

  function payFor(lv) {
    const c = st.corp;
    let base = 4 + 2 * lv.n;
    if (lv.boss) base *= 3;
    let mult = c.pay || 1;
    if (c.stageBoss) mult *= 1.5;   // a corp as the sector boss pays more
    if (lv.misses === 0 && lv.n > 1 && !lv.scanned) mult *= 1 + 0.5 * (lv.n - 1);
    if (has('skimmer')) mult *= 1.5;
    if (has('fastpay') && lv.fast) mult *= 1.5;
    if (has('surge') && lv.late) mult *= 1.5;
    if (has('supersize') && lv.boss) mult *= 1.5;
    if (c.def.surge) mult *= 1 + 0.8 * (lv.surgeF || 0);   // RYDR: pays more the later you pick
    if (has('onbeat') && lv.onBeat) mult *= 1.5;
    if (c.mod === 'loaded') mult *= 1.2;
    if (c.hasBoss && c.def.faith && !lv.tithed) mult *= 2;   // THE CHOIR: on faith
    if (lv.dd) mult *= 2;                                    // LUCKEEZ: double down
    mult *= 1 - (lv.payCut || 0);
    return lv.n === 1 ? 0 : Math.round(base * mult);
  }

  async function onSafe(t) {
    const run = st.run, lv = st.lv, c = st.corp;
    t.state = 'safe';
    const perfect = lv.misses === 0 && lv.n > 1 && !lv.scanned;
    if (c.hasBoss && lv.n > 1) run.lastReal = { col: t.col, row: t.row };   // DEJA VU
    if (lv.n > 1) { c.scored = (c.scored || 0) + 1; if (perfect) { c.perfects = (c.perfects || 0) + 1; run.perfects = (run.perfects || 0) + 1; } }
    const pay = payFor(lv);
    const tix = c.hasBoss && c.def.tickets;   // CHUCK E. CACHE'S pays in tickets
    if (tix) c.tickets = (c.tickets || 0) + pay;
    else { run.credits += pay; run.earned += pay; }
    lv.paid = tix ? 0 : pay;
    let healed = false;
    if (perfect && run.integrity < run.maxInt && c.mod !== 'cursed') { run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.perfectHeal); healed = true; }
    if (!lv.boss) Sound.safe();
    if (c.hasBoss && c.def.onSafe) c.def.onSafe(t, lv);   // corp kit: SQUALOR's likes
    flash(C.cyan, 0.12, 0.3);
    let msg = perfect ? '> perfect.' : '> access granted.';
    if (pay) msg += tix ? ` +${pay} tix` : ` +${pay}cr`;
    if (healed) msg += ' +1 int';
    setMsg(msg, C.cyan);
    const land = lv.boss ? Sound.bossWin() : 0;   // boss: the fanfare replaces the safe sound (s until it lands)
    await wait(380);
    const i = lv.tiles.indexOf(t);
    const lit = buildScene(performance.now(), false, true).filter(cl => cl.own === 't' + i);
    if (lv.boss) {
      // The layer floats away and the screen goes empty as the fanfare lands;
      // then CORP BREACHED types in and the reward screen builds up under it.
      flash(C.cyan, 0.2, 0.5); shake(5, 0.4);
      // time it so the screen is empty right as the fanfare lands (CORP BREACHED types on the hit)
      const full = (RISE.wave + RISE.jitter + RISE.rise) * 1000;
      const ms = riseOut(new Set(lit.map(cl => cl.cx + ',' + cl.cy)), clamp((land * 1000 - 380 - 100) / full, 0.5, 1.3));
      st.hideAll = true; st.wipe = null;
      await wait(ms);
      st.breachReveal = true;
    } else {
      // Success wipe: the real node stays lit while the fill rises. Bigger for perfect.
      await wipeOut(perfect ? 2 : 1, lit);
    }
    c.idx++;
    if (lv.carryNext) c.carry = lv.carryNext;   // corp kit: what this layer leaves the next one
    c.depthAt = run.depth;   // this layer is done: a save from here keeps it
    // LAYER END stage, left to right on the bar.
    for (const k of modsAt('end')) if (END_FX[k]) await END_FX[k](perfect);
    if (c.idx < c.counts.length) { saveRun(); return enterLayer(); }
    // Corp finished
    if (c.mod === 'rival' && c.rival) {   // RIVAL: beat it
      const bonus = c.rival.hp <= 0 ? 30 : c.rival.stole === 0 ? 15 : 0;
      if (bonus) { run.credits += bonus; run.earned += bonus; setMsg(c.rival.hp <= 0 ? `> rival flatlined. +${bonus}cr` : `> you beat ${c.rival.name.toLowerCase()}. +${bonus}cr`, C.gold); }
    }
    if (c.hasBoss && c.def.onClear) {
      const m = c.def.onClear(c);
      if (m) { const o = typeof m === 'string' ? { text: m, col: C.red, bad: true } : m; setMsg(o.text, o.col); if (o.bad) Sound.trap(); else Sound.loot(); }
    }
    if (c.node.type === 'start') { run.pending = { kind: 'start', id: c.node.id }; saveRun(); return openStartReward(c.node); }
    run.corps++;
    if (c.node.type === 'corp') { run.beat = run.beat || {}; (run.beat[c.sector] = run.beat[c.sector] || []).push(c.def.key); }
    corpStat(c.def.key).breached++; persist();   // codex record
    if (c.stolen && c.stolen.length && !c.bossSkipped) { run.mods.push(...c.stolen.reverse()); c.stolen = []; }   // THIEF: you got them back
    if (c.node.type === 'final') return sectorClear(!!c.bossSkipped);
    run.pending = { kind: 'reward', id: c.node.id, skipped: !!c.bossSkipped };
    saveRun();
    openReward(c.node, !!c.bossSkipped);
  }

  // START stage notes: short hints shown on row 7. ms: shown only that long after the layer opens.
  const START_NOTE = {
    forecast(lv, c, run) {
      const r = rngFor(run.seed, 'fcst', c.node.id, c.idx, run.resumes || 0), real = lv.tiles[lv.safe];
      const byRow = r() < 0.5, n = byRow ? lv.rows : lv.cols, at = byRow ? real.row : real.col;
      const pick = r() < 0.6 ? at : pickR(Array.from({ length: n }, (_, i) => i).filter(i => i !== at), r);
      return { text: `fcst: ${byRow ? ROW_NAMES(lv.rows, pick) : COL_NAMES(lv.cols, pick)}?` };
    },
    spellbound(lv) {
      if (!lv.boss) return null;
      const t = lv.tiles[lv.safe], edgeV = t.row === 0 ? 'T' : t.row === lv.rows - 1 ? 'B' : '', edgeH = t.col === 0 ? 'L' : t.col === lv.cols - 1 ? 'R' : '';
      return { text: `spell: ${edgeV || edgeH || 'C'}` };
    },
    seedreader(lv) { return lv.boss ? { text: `seed: col ${lv.tiles[lv.safe].col + 1}` } : null; },
    photographic(lv) { return { text: 'photo>' + glyphLine(lv.tiles[lv.safe].glyph), ms: 450 }; },
  };

  // LAYER END stage: what each mod does once a layer is passed.
  const END_FX = {
    ezpass() { st.run.credits += 2; st.run.earned += 2; },
    // LET IT RIDE: a perfect bets its pay on the next layer: another perfect pays it back
    // double, anything else loses it.
    letitride(perfect) {
      const run = st.run, c = st.corp, lv = st.lv;
      if (!c.hasBoss) return;
      if (c.ride) {
        if (perfect) { run.credits += 2 * c.ride; run.earned += c.ride; Sound.loot(); setMsg(`> let it ride: +${2 * c.ride}cr!`, C.gold); }
        else setMsg(`> let it ride: lost ${c.ride}cr.`, C.red);
        c.ride = 0;
      } else if (perfect && c.idx < c.counts.length && lv.paid > 0) {
        c.ride = Math.min(lv.paid, run.credits);
        run.credits -= c.ride;
        setMsg(`> let it ride: ${c.ride}cr riding.`, C.gold);
      }
    },
    // FOUR IN A ROW: 4 perfects in a row arm the next boss (2 ICE locked)
    fourinarow(perfect) {
      const run = st.run;
      run.p4 = perfect ? (run.p4 || 0) + 1 : 0;
      if (run.p4 >= 4) { run.p4 = 0; run.p4Ready = true; setMsg('> 4 in a row! next boss -2 ICE.', C.gold); }
    },
    // EXPRESS: a perfect gives the next layer a lift
    express(perfect) { const c = st.corp; if (perfect && c.hasBoss && c.idx < c.counts.length) c.express = true; },
    // TRIAGE: a corp you beat heals 1; at full, +1 max integrity
    triage() {
      const run = st.run, c = st.corp;
      if (!c.hasBoss || c.idx < c.counts.length) return;
      if (run.integrity < run.maxInt) run.integrity++;
      else { run.maxInt++; run.integrity++; }
      Sound.shield();
    },
    // HONEYCOMB: perfects store honey; 3 drops heal 1. At full, a drop is +10cr.
    honeycomb(perfect) {
      const run = st.run;
      if (!perfect) return;
      if (run.integrity >= run.maxInt) { run.credits += 10; run.earned += 10; return; }
      run.honey = (run.honey || 0) + 1;
      if (run.honey >= 3) { run.honey = 0; run.integrity = Math.min(run.maxInt, run.integrity + 1); Sound.shield(); }
    },
    // INTEREST: a corp you finish pays 5% of your credits (up to 20).
    async interest() {
      const run = st.run, c = st.corp;
      if (!c.hasBoss || c.idx < c.counts.length) return;
      const cr = Math.min(20, Math.floor(run.credits * 0.05));
      if (cr > 0) { run.credits += cr; run.earned += cr; Sound.loot(); }
    },
    // SKIPJACK: a perfect can open a skip past the next layer. The player chooses.
    async skipjack(perfect) {
      const run = st.run, c = st.corp;
      if (!(perfect && c.hasBoss && c.idx < c.counts.length &&
        rngFor(run.seed, 'skip', c.node.id, c.idx, run.resumes || 0)() < tv('skipjack', [0.15, 0.25, 0.4]))) return;
      const boss = c.idx === c.counts.length - 1;
      if (boss && !SKIP_BOSS) return;
      const go = await askSkip(boss);
      await wipeOut(0);
      if (!go) return;
      run.depth++; c.idx++;
      if (boss) c.bossSkipped = true;
      setMsg(boss ? '> skipjack: boss skipped. no reward.' : '> skipjack: layer skipped.', C.cyan);
    },
  };

  // CONTINUE?: a 10 second countdown.
  function askContinue() {
    return new Promise(res => {
      let done = false;
      const t0 = performance.now();
      const choose = v => { if (done) return; done = true; Sound.ui(); res(v); };
      const tick = () => { if (done) return; if (performance.now() - t0 > 10000) return choose(false); setTimeout(tick, 200); };
      tick();
      openPanel('CONTINUE?', (T, B, X) => {
        const left = Math.max(0, Math.ceil(10 - (performance.now() - t0) / 1000));
        X({ text: 'CONTINUE?', col: Math.floor(performance.now() / 300) % 2 ? C.red : C.bright, bold: true });
        T('');
        X({ text: String(left), col: C.bright, bold: true });
        T('');
        T('insert 100cr to keep going.', C.text);
        T('you come back at 1 integrity.', C.mid);
        T('');
        X({ box: true, text: 'PAY 100cr', id: 'cont', onTap: () => choose(true), minW: 18 });
        T('');
        B('[ GAME OVER ]', 'giveup', () => choose(false));
      }, { text: '> integrity gone. or is it?', col: C.red });
    });
  }

  // SKIPJACK's question: skip the next layer (or the boss), or play it.
  const SKIP_BOSS = true;   // switch: false = bosses can never be skipped
  function askSkip(boss) {
    return new Promise(res => {
      let done = false;
      const choose = v => { if (done || st.transitioning) return; done = true; Sound.ui(); res(v); };
      const final = st.corp.node.type === 'final';
      openPanel('SKIPJACK', (T, B, X) => {
        T('SKIPJACK', C.cyan);
        T('');
        T('perfect pick. a way past opens.', C.text);
        if (boss) {
          T('');
          X({ text: '!! SKIP THE BOSS? !!', col: Math.floor(performance.now() / 300) % 2 ? C.red : C.bright, bold: true });
          T(final ? 'no reward. the sector still clears.' : 'no reward: no mod, no credits.', C.redDim);
        }
        T('');
        T('skip: +1 layer of depth, no pay.', C.mid);
        T('play: keep its pay and perfect.', C.mid);
        T('');
        X({ box: true, text: boss ? 'SKIP BOSS: NO REWARD' : 'S K I P', id: 'skip', onTap: () => choose(true), minW: boss ? 24 : 18 });
        T('');
        B('[ PLAY IT ]', 'play', () => choose(false));
      }, boss ? { text: '> skipjack: the boss is in reach.', col: C.red } : { text: '> skipjack: skip ready.', col: C.cyan });
    });
  }

  async function onTrap(t, i) {
    const run = st.run, lv = st.lv;
    lv.misses++;
    run.iceHits = (run.iceHits || 0) + 1;
    if (st.corp) st.corp.ice = (st.corp.ice || 0) + 1;
    t.state = 'locked';
    t.lockedBy = 'hit';
    t.hitAt = performance.now();
    // BLOCK, then HIT (the node's own loot first, then mods left to right), then a death
    // check, then BOARD. Corp twists would go after the mods in HIT and BOARD.
    let msg = blockHit(t, i);
    if (t.loaded) {
      const lr = rngFor(run.seed, 'loot', st.corp.node.id, st.corp.idx);
      msg += ' ' + grantLoot(lr, st.corp.tier);
      if (has('priority')) msg += ' ' + grantLoot(lr, st.corp.tier);   // PRIORITY: delivered twice
    }
    for (const k of modsAt('hit')) if (HIT_FX[k]) HIT_FX[k](t);
    if (t.rejected) msg = msg.replace('> ICE.', '> REJECTED.');   // FORM 27B
    setMsg(msg, t.loaded ? C.gold : C.red);
    if (st.corp.hasBoss && st.corp.def.onHit) st.corp.def.onHit(t);   // corp twist, after your mods
    // corp modifiers: ARMORED points at the real node, THIEF takes your last mod
    if (st.corp.mod === 'armored' && !t.dir) { const q = lv.tiles[lv.safe]; t.dir = Math.abs(q.col - t.col) >= Math.abs(q.row - t.row) ? { h: Math.sign(q.col - t.col), v: 0 } : { h: 0, v: Math.sign(q.row - t.row) }; }
    if (st.corp.mod === 'thief' && run.mods.length) {
      const key = run.mods.pop();
      (st.corp.stolen = st.corp.stolen || []).push(key);
      setMsg(`${st.msg} thief took ${MODS[key].name}!`, C.red);
    }
    await wait(450);
    if (run.integrity <= 0) return die();
    for (const k of modsAt('board')) if (BOARD_FX[k]) await BOARD_FX[k](t);
    if (st.corp.hasBoss && st.corp.def.afterHit && st.lv === lv) await st.corp.def.afterHit(t, lv);   // corp kit: MONTE, GRAVITAS move on a miss
    resetTimer();
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // BLOCK stage. Not by the bar: one fixed order, so nothing is spent when something free
  // would have blocked it. Free blocks first (FORGERY, BULWARK, a corp-long firewall,
  // SHATTER's chance), then FWALL charges, then the hit, and FAILSAFE last since it only
  // catches a killing hit. The first block that applies stops the hit. Returns the message.
  function blockHit(t, i) {
    const run = st.run, lv = st.lv;
    let msg;
    if (st.god) {
      Sound.shield();
      msg = '> ICE. god mode: no damage.';
    } else if (has('forgery') && (t.loaded || (t.forged && !lv.forgeUsed))) {
      Sound.shield();
      if (!t.loaded) lv.forgeUsed = true;   // a counterfeit (HAUTE//COUTURE): one free per layer
      msg = t.loaded ? '> $ node. forgery: no damage.' : '> knockoff. forgery: no damage.';
    } else if (has('bulwark') && !st.corp.bulwarkUsed) {
      st.corp.bulwarkUsed = true;
      Sound.shield();
