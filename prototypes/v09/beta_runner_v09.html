      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. bulwark blocked it.';
    } else if (has('horoscope') && st.corp.luckyIdx === st.corp.idx && !lv.luckUsed) {
      lv.luckUsed = true;
      Sound.shield(); flash(C.cyan, 0.12, 0.3);
      msg = '> ICE. lucky layer: no damage.';
    } else if (has('ambush') && st.corp.hasBoss && !lv.ambushUsed && lv.shownAt != null && (lv.pickAt || 0) - lv.shownAt < 2000) {
      lv.ambushUsed = true;
      Sound.shield(); flash(C.cyan, 0.12, 0.3);
      msg = '> ICE. ambush: too fast to hit.';
    } else if (st.corp && st.corp.wallAll) {
      Sound.shield(); flash(C.cyan, 0.12, 0.3); shake(4);
      msg = '> ICE. the firewall holds.';
    } else if (has('shatter') && rngFor(run.seed, 'shatter', st.corp.node.id, st.corp.idx, lv.misses)() < 1 / 3) {
      const { x, y } = tileCenter(t);
      explode(snapshot(cl => cl.own === 't' + i), x, y, { col: C.bright, power: 0.9 });
      Sound.shatter(); flash(C.bright, 0.14, 0.3); shake(5);
      msg = '> ICE shattered. no damage.';
    } else if (lv.rolled && !lv.rollUsed) {
      lv.rollUsed = true; lv.payCut = 1;
      Sound.shield(); flash(C.cyan, 0.14, 0.3); shake(4);
      msg = '> ICE. rolled up: no damage, no pay.';
    } else if (has('icebox') && st.corp.hasBoss && st.corp.idx === 0 && !lv.iceboxUsed) {
      lv.iceboxUsed = true;
      Sound.shield(); flash(C.cyan, 0.12, 0.3);
      msg = '> ICE. icebox: no damage.';
    } else if (has('leadlining') && lv.boss && !lv.leadUsed) {
      lv.leadUsed = true;
      Sound.shield(); flash(C.cyan, 0.12, 0.3);
      msg = '> ICE. lead lining: no damage.';
    } else if (has('greenwave') && st.timer && Math.ceil(st.timer.left) % 2 === 0) {
      Sound.shield(); flash(C.cyan, 0.12, 0.3);
      msg = '> ICE. green wave: no damage.';
    } else if (has('omerta') && run.credits >= Math.max(15, Math.floor(run.credits * 0.1))) {
      const cost = Math.max(15, Math.floor(run.credits * 0.1));
      run.credits -= cost;
      Sound.shield(); flash(C.gold, 0.1, 0.3);
      msg = `> ICE. omerta: -${cost}cr. say nothing.`;
    } else if (st.corp.hasBoss && st.corp.def.block && (msg = st.corp.def.block(t, lv))) {
      // a corp's own rule took the hit (the message is set)
    } else if (has('friendship') && !st.corp.friendUsed && run.credits >= 10) {
      st.corp.friendUsed = true; run.credits -= 10;
      Sound.shield(); flash(C.cyan, 0.1, 0.3);
      msg = '> ICE. friendship: -10cr instead.';
    } else if (has('inversion') && st.corp.hasBoss && !st.corp.invUsed) {
      st.corp.invUsed = true;
      run.integrity = Math.min(run.maxInt, run.integrity + 1);
      Sound.shield(); flash(C.cyan, 0.16, 0.35);
      msg = '> ICE. inversion: +1 int.';
    } else if (run.shield > 0) {
      run.shield--;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. firewall absorbed it.';
    } else {
      const raw = st.corp.hasBoss && st.corp.def.hitDmg ? Math.max(lv.dmg, st.corp.def.hitDmg(t, lv)) : lv.dmg;   // GRIDLOCK: red hits for 2
      const dmg = has('grounded') && raw >= 2 ? raw - 1 : raw;   // GROUNDED
      run.integrity -= dmg;
      Sound.trap();
      shake(9);
      flash(C.red, 0.18, 0.35);
      msg = run.integrity > 0 ? `> ICE. integrity -${dmg}.` : '> ICE. integrity gone.';
      // FAILSAFE: once per run, a killing hit leaves you at 1
      if (run.integrity <= 0 && has('failsafe') && !run.failsafeUsed) {
        run.failsafeUsed = true; run.integrity = 1;
        Sound.shield(); flash(C.cyan, 0.2, 0.4);
        msg = '> FAILSAFE: held at 1 integrity.';
      }
    }
    return msg;
  }

  // HIT stage: what each mod does after an ICE hit (t = the node you hit).
  const HIT_FX = {
    // LAST BYTE: down to 1 integrity, the HUD glitches and spells out the real column
    lastbyte() {
      const lv = st.lv;
      if (st.run.integrity !== 1 || lv.lastByte) return;
      lv.lastByte = true;
      flash(C.red, 0.15, 0.3); shake(4);
      lv.notes = (lv.notes || []).concat([{ text: `c0l_${lv.tiles[lv.safe].col + 1}`, tag: 'lastbyte' }]);
    },
    // INDEX: >>> the real node comes later in reading order, <<< earlier
    index(t) { const s = st.lv.tiles[st.lv.safe]; t.glyph = normMotif(['', s.cell > t.cell ? '>>>' : '<<<', '']); },
    policy() { st.run.credits += 8; st.run.earned += 8; },
    pixelpeep() { st.lv.peepAt = performance.now(); },
    prism() { st.lv.prismRow = st.lv.tiles[st.lv.safe].row; },
    queuenumber(t) {
      if (t.loaded) return;
      const lv = st.lv, order = lv.tiles.slice().sort((a, b) => a.cell - b.cell), d = order.indexOf(lv.tiles[lv.safe]) - order.indexOf(t);
      t.glyph = normMotif(['', `${d > 0 ? '+' : ''}${d}`, '']);
    },
    turing(t) {
      const lv = st.lv, r = rngFor(st.run.seed, 'turing', st.corp.node.id, st.corp.idx, lv.misses);
      const ice = lv.tiles.filter(o => o !== t && !o.safe && o.state === 'closed' && !o.say), real = lv.tiles[lv.safe];
      const who = r() < 0.75 || real.state !== 'closed' ? pickR(ice, r) : real;
      if (who) who.say = ['NOT', 'ME'];
    },
    callerid() {
      const lv = st.lv, row = lv.tiles[lv.safe].row;
      Sound.beeps(row + 1);
      lv.notes = (lv.notes || []).filter(nt => nt.tag !== 'cid').concat([{ text: `cid: ${ROW_NAMES(lv.rows, row)}`, tag: 'cid' }]);
    },
    compost() {
      const run = st.run;
      run.compost = (run.compost || 0) + 1;
      if (run.compost % 3 === 0 && run.integrity < run.maxInt) { run.integrity++; Sound.shield(); }
    },
    // FOGHORN: louder the closer the real node is (bars on row 7)
    foghorn(t) {
      const lv = st.lv, s2 = lv.tiles[lv.safe], d = Math.max(Math.abs(s2.col - t.col), Math.abs(s2.row - t.row));
      const bars = clamp(5 - d, 1, 4);
      Sound.horn([0, 0.2, 0.35, 0.6, 1][bars]);
      lv.notes = (lv.notes || []).filter(nt => nt.tag !== 'horn').concat([{ text: `horn ${'|'.repeat(bars).padEnd(4, '.')}`, tag: 'horn' }]);
    },
    pickset() { st.corp.pins = (st.corp.pins || 0) + 1; },
    // PENCIL MARKS: rule out one other ICE in the same row
    pencil(t) {
      const lv = st.lv, opts = lv.tiles.filter(o => o !== t && o.row === t.row && o.state === 'closed' && !o.safe && !o.ruledOut);
      if (opts.length) pickR(opts, rngFor(st.run.seed, 'pencil', st.corp.node.id, st.corp.idx, lv.misses)).ruledOut = true;
    },
    tracer(t) {
      // which way the real node is: level 1 the bigger direction (coin flip when even), level 2 both
      const lv = st.lv, s = lv.tiles[lv.safe], dx = Math.sign(s.col - t.col), dy = Math.sign(s.row - t.row);
      const gx = Math.abs(s.col - t.col), gy = Math.abs(s.row - t.row);
      if (modTier('tracer') >= 1) t.dir = { h: dx, v: dy };
      else if (gx > gy || (gx === gy && rngFor(st.run.seed, 'tracer', st.corp.node.id, st.corp.idx, lv.misses)() < 0.5)) t.dir = { h: dx, v: 0 };
      else t.dir = { h: 0, v: dy };
    },
    keylogger(t) {
      if (t.loaded) return;
      // the real node's glyph, line by line: level 1 one line per miss, 2 two lines, 3 all of it
      const lv = st.lv, g = lv.tiles[lv.safe].glyph, per = [1, 2, 3][modTier('keylogger')], k = lv.klog || 0;
      lv.klog = k + 1;
      const from = k * per;
      t.glyph = g.map((line, r) => from >= 3 || (r >= from && r < from + per) ? line : ' '.repeat(line.length));
      t.klog = true;
    },
  };

  // BOARD stage: mods that change the grid after a hit.
  const BOARD_FX = {
    // LINKUP: the hit node's partner (TWINLINK's link, or the node mirrored across the center)
    async linkup(t) {
      const lv = st.lv, p = t.partner || lv.tiles.find(o => o.col === lv.cols - 1 - t.col && o.row === lv.rows - 1 - t.row);
      if (!p || p === t || p.safe || p.state !== 'closed') return;
      lockTile(p, C.cyan, 'linkup');
      setMsg('> linkup: its partner went too.', C.cyan);
      await wait(200);
    },
    // ANTIGRAV: the closest ICE above the hit node (same column) drops on it and locks
    async antigrav(t) {
      const lv = st.lv, above = lv.tiles.filter(o => o.col === t.col && o.row < t.row && o.state === 'closed' && !o.safe).sort((a, b) => b.row - a.row);
      if (!above.length) return;
      lockTile(above[0], C.cyan, 'antigrav');
      setMsg('> antigrav: the ICE above came down.', C.cyan);
      await wait(200);
    },
    // UNRAVEL: one more ICE in the hit node's row locks
    async unravel(t) {
      const lv = st.lv, opts = lv.tiles.filter(o => o !== t && o.row === t.row && o.state === 'closed' && !o.safe);
      if (!opts.length) return;
      lockTile(pickR(opts, rngFor(st.run.seed, 'unravel', st.corp.node.id, st.corp.idx, lv.misses)), C.mid, 'unravel');
      setMsg('> unravel: the row comes apart.', C.mid);
      await wait(200);
    },
    // AUTOCOMPLETE: your first miss in a layer strikes out one more ICE.
    async autocomplete(t) {
      const lv = st.lv;
      if (lv.misses !== 1) return;
      const opts = lv.tiles.filter(o => o.state === 'closed' && !o.safe);
      if (!opts.length) return;
      lockTile(pickR(opts, rngFor(st.run.seed, 'acp', st.corp.node.id, st.corp.idx)), C.mid, 'autocomplete');
      setMsg('> autocomplete: struck 1 ICE.', C.mid);
      await wait(200);
    },
    // TWIN LOCK: the hit ICE takes the ICE that looks most like it with it.
    async twinlock(t) {
      const lv = st.lv;
      const opts = lv.tiles.filter(o => o !== t && o.state === 'closed' && !o.safe && !o.loaded);
      if (!opts.length) return;
      const best = Math.max(...opts.map(o => glyphLikeness(o.glyph, t.glyph)));
      const top = opts.filter(o => glyphLikeness(o.glyph, t.glyph) === best);
      lockTile(pickR(top, rngFor(st.run.seed, 'twin', st.corp.node.id, st.corp.idx, lv.misses)), C.mid, 'twinlock');
      setMsg('> twin lock: its twin went too.', C.mid);
      await wait(200);
    },
    // VIRUS: the infection spreads to one ICE node right next to the one you hit.
    async virus(t) {
      const lv = st.lv;
      const nb = lv.tiles.filter(o => o.state === 'closed' && !o.safe && Math.abs(o.col - t.col) + Math.abs(o.row - t.row) === 1);
      if (!nb.length) return;
      lockTile(pickR(nb, rngFor(st.run.seed, 'virus', st.corp.node.id, st.corp.idx, lv.misses)), C.mid, 'virus');
      setMsg('> virus: 1 more ICE infected.', C.mid);
      await wait(200);
    },
  };

  // Credits or an item. Returns a short text for the message line.
  function grantLoot(r, tier) {
    const run = st.run;
    Sound.loot();
    // an item (more often with a higher STASH), at a rolled tier, if there's room
    if (r() < (has('stash') ? tv('stash', [0.4, 0.6, 1]) : 0.4)) {
      const key = pickR(Object.keys(ITEMS), r), tier = rollTier(r, ITEMS[key]);
      if (addItem(key, tier)) return `got ${ITEMS[key].name}${tier ? ' ' + RARITY[itemView(key, tier).rarity].label.toLowerCase() : ''}.`;
    }
    const cr = Math.round(12 + tier * 8 + r() * 12);
    run.credits += cr; run.earned += cr;
    return `+${cr}cr`;
  }

  async function die() {
    // CONTINUE?: once per run, 10 seconds to pay 100cr and keep going
    const run0 = st.run;
    if (run0 && has('continue') && !run0.continueUsed && run0.credits >= 100 && st.lv && !st.mp) {
      run0.continueUsed = true;
      const go = await askContinue();
      if (go) {
        run0.credits -= 100; run0.integrity = 1;
        await wipeOut(0);
        showBoard('play');
        resetTimer();
        st.busy = false; st.lv.readyAt = performance.now();
        setMsg('> CONTINUE! 1 integrity left.', C.cyan);
        return;
      }
      await wipeOut(0);
      showBoard('play');
    }
    if (st.corp && st.corp.hasBoss) { corpStat(st.corp.def.key).lost++; persist(); }   // codex record
    st.busy = true;
    st.timer = null;
    const safeTile = st.lv.tiles[st.lv.safe];
    if (safeTile.state === 'closed') safeTile.state = 'reveal';
    setMsg('> traced. real node revealed.', C.red);
    st.dying = true;      // the music powers down instead of cutting out
    Sound.death();
    await wait(1100);
    await endRun(false);
  }

  // win = cashed out after a sector clear.
  async function endRun(win) {
    const run = st.run;
    st.busy = true;
    st.timer = null;
    run.ended = true;
    clearRun();
    if (!win) {
      // Losing: the whole screen glitches out.
      const cells = snapshot(() => true);
      st.hideAll = true;
      st.wipe = null;
      const ms = fallOut(cells); flash(C.red, 0.2, 0.4);
      Sound.collapse(ms / 1000);
      await wait(ms + 150);
    }
    // Winning: the final boss's success wipe carries straight into the results screen.

    const newBest = !run.practice && run.depth > save.best;
    if (!run.practice) {
      save.runs++;
      if (win) save.wins++;
      if (newBest) save.best = run.depth;
    }
    // REP: cashing out banks it all; dying banks nothing (DEADMAN keeps a part).
    const repWorth = repFor(run);
    const rep = run.practice ? 0 : win ? repWorth : Math.floor(repWorth * [0, 0.25, 0.5][legacyLv('dms')]);
    if (rep) { save.rep = (save.rep || 0) + rep; save.repTotal = (save.repTotal || 0) + rep; }
    if (win && !run.practice) save.cashouts = (save.cashouts || 0) + 1;
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, sector: (run.sector || 0) + 1, win, rep, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();

    // Where you were traced, and the corps you breached (visited corp nodes you finished).
    const c = st.corp;
    const diedAt = !win && c ? `${c.def.name}${c.hasBoss ? (st.lv && st.lv.boss ? ' BOSS' : ` ${c.idx + 1}/${c.counts.length - 1}`) : ''}${run.sector ? `, sector ${run.sector + 1}` : ''}` : '';
    const breached = run.visited.map(id => run.map[id])
      .filter(n => (n.type === 'corp' || n.type === 'final') && (win || n.id !== run.at)).map(n => n.corp);
    st.result = { win, depth: run.depth, corps: run.corps, earned: run.earned, newBest, practice: run.practice, seed: run.seed,
      rep, repWorth, sectors: run.sectorsCleared || 0,
      diedAt, breached, mods: run.mods.slice(), modTier: Object.assign({}, run.modTier), items: run.items.map(x => Object.assign({}, x)),
      map: run.map, visited: run.visited.slice(), at: run.at };
    st.corp = null; st.lv = null;
    st.dying = false;
    scenePalette(null);
    showBoard('over');
    // Losing builds the results up out of the empty screen (no decode-in).
    st.overReveal = win ? null : { t0: performance.now() + 200, shown: 0, typed: 0, y: null, lt: 0 };
    st.overMap = null;
    if (!win) st.boardStart = -1e9;
    {
      const scrollMap = d => {
        const om = st.overMap; if (!om || om.view == null) return;
        const t = clamp(om.top + d, 0, mapRows(st.result.map) - om.view);
        if (t !== om.top) { om.top = t; Sound.tick(); }
      };
      st.scroll = scrollMap;
      st.keyHandler = k => { if (k === 'arrowup' || k === 'arrowdown') { scrollMap(k === 'arrowup' ? -1 : 1); return true; } return false; };
    }
    st.busy = false;
    setMsg(win ? '> root access_' : '> link severed_', win ? C.cyan : C.red);
    if (win) { flash(C.cyan, 0.25, 0.8); Sound.ui(); }
  }

  // ---------------- Sector clear ----------------
  // OMNI beaten: fireworks, then cash out (bank REP, the run ends) or push on into the
  // next sector, which starts at the OMNI you just beat.
  async function sectorClear(skipped) {
    const run = st.run;
    run.sectorsCleared = (run.sectorsCleared || 0) + 1;
    run.pending = { kind: 'sector', skipped };
    if (!run.practice && run.sectorsCleared > (save.bestSector || 0)) { save.bestSector = run.sectorsCleared; persist(); }
    st.corp = null; st.lv = null; st.timer = null; st.dying = false;
    saveRun();
    showSectorClear(skipped, true);
  }
  function showSectorClear(skipped, fanfare) {
    const run = st.run;
    st.result = { sector: true, skipped, depth: run.depth, corps: run.corps, earned: run.earned, n: run.sectorsCleared,
      rep: repFor(run), practice: run.practice, seed: run.seed };
    st.corp = null; st.lv = null; st.timer = null;
    scenePalette(null);
    showBoard('over');
    st.overReveal = null; st.overMap = null;
    st.busy = false;
    setMsg('> root access_', C.cyan);
    if (fanfare) {
      if (skipped) Sound.bossWin();   // a skipped boss never played its fanfare
      flash(C.cyan, 0.25, 0.8); shake(6, 0.5); fireworkShow();
    }
  }
  async function pushOn() {
    const run = st.run;
    if (st.transitioning || !run) return;
    const old = run.sector, skipped = !!(run.pending && run.pending.skipped);
    run.sector++;
    addSector(run.map, run.seed, run.sector);
    st.result = null;
    // Beat OMNI (not skipped): its boss reward first, then the map climbs from the old
    // sector to the new one. Cashing out skips it (the run ends anyway).
    if (skipped) { run.pending = null; return swapTo(() => toMap(old)); }
    run.pending = { kind: 'omni', from: old };
    saveRun();
    await swapTo(() => openOmniReward(old));
  }
  // OMNI is every corp at once: a boss mod from any corp, a general mod, and one more.
  function openOmniReward(from) {
    const run = st.run;
    const r = rngFor(run.seed, 'omni', from);
    const corpPick = pickMods(r, modsOfKind('corp'), 1);
    const gen = pickMods(r, modsOfKind('gen'), 1, corpPick);
    const third = pickMods(r, modsOfKind('gen', 'minor'), 1, corpPick.concat(gen));
    openChoice({
      title: 'OMNI//CORE BREACHED', col: C.cyan,
      head: [[`sector ${from + 1} spoils. take one.`, C.text]],
      options: shuffle(corpPick.concat(gen, third), r),
      skipLabel: '[ SKIP  +40cr ]',
      onSkip: () => { run.credits += 40; run.earned += 40; Sound.loot(); },
      msg: '> the core is open.',
      next: () => toMap(from),
    });
  }
  async function cashOut() {
    if (st.transitioning || !st.run) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(0);
    st.transitioning = false;
    endRun(true);
  }

  const jackIn = () => startRun(st.seed, st.practice);
  const retry = () => startRun(st.result ? st.result.seed : st.seed, true);
  const newRun = () => startRun(newSeed(), false);

  // ---------------- Panels ----------------
  // The title and the menu screens use the whole screen: no header, HUD or tray.
  const fullScreen = () => st.mode === 'title' || st.mode === 'over' || (st.mode === 'panel' && st.panelFull);

  function openPanel(title, fn, msg, opts = {}) {
    st.panelFull = !!opts.full;
    st.swap = null;
    st.bigPops = 0; st.glow = {};
    st.breachReveal = false;
    // Line-by-line reveal out of an empty screen (after a boss): the title types in,
    // then the lines come in under it. Header, HUD and tray come back when it's done.
    st.panelReveal = opts.reveal ? { t0: performance.now() + 100, shown: 0, typed: 0, y: null, lt: 0, done: false, center: 'board', sound: 'climb' } : null;
    st.panelTitle = title;
    st.panelFn = fn;
    st.revealed = new Set();
    showBoard('panel');
    st.panelT0 = performance.now() + (st.wipe ? st.wipe.dur : 0) + CONFIG.revealDelay;
    if (st.panelReveal) { st.panelT0 = Infinity; st.boardStart = -1e9; }   // offers pop as their lines come in
    st.busy = false;
    const m = msg && typeof msg === 'object' ? msg : msg ? { text: msg } : null;
    if (st.panelReveal) { st.panelReveal.msg = m; st.msg = ''; }
    else if (m) setMsg(m.text, m.col);
  }

  async function leavePanel() {
    if (st.transitioning) return;
    await swapTo(toMap);
  }

  // Take a mod at a tier. Owning it already upgrades it instead (upgradeTo); that never
  // needs a slot. Returns 'new' or 'up'. (Check modRoom first for a new one.)
  function addMod(key, tier = 0) {
    const run = st.run;
    if (!MODS[key]) return null;          // a mod that no longer exists (old saves / tests)
    markSeen(key);
    if (run.mods.includes(key)) { run.modTier[key] = upgradeTo(key, tier); return 'up'; }
    run.mods.push(key);
    run.modTier[key] = clamp(tier, 0, tierCount(MODS[key]) - 1);
    if (key === 'buffer') { run.maxInt++; run.integrity++; }
    if (key === 'stash') run.beltSlots++;
    return 'new';
  }
  function removeMod(key) {
    const run = st.run;
    if (!run.mods.includes(key)) return;
    run.mods = run.mods.filter(k => k !== key);
    delete run.modTier[key];
    if (key === 'buffer') { run.maxInt--; run.integrity = Math.min(run.integrity, run.maxInt); }
    if (key === 'stash') { run.beltSlots--; run.items = run.items.slice(0, run.beltSlots); }
  }
  const modRoom = key => has(key) || st.run.mods.length < MOD_SLOTS;

  // Add an item to the belt: onto a matching stack (same item + tier, up to F), else a free
  // slot. Returns false when there's no room.
  function addItem(key, tier = 0) {
    const run = st.run;
    markSeen(key);
    const stack = run.items.find(s => s.key === key && s.tier === tier && s.n < STACK_MAX);
    if (stack) { stack.n++; return true; }
    if (run.items.length >= run.beltSlots) return false;
    run.items.push({ key, tier, n: 1 });
    return true;
  }
  const itemRoom = (key, tier) => st.run.items.some(s => s.key === key && s.tier === tier && s.n < STACK_MAX) || st.run.items.length < st.run.beltSlots;
  // An item's belt label: [PURGE], or PURGEx3 when stacked (hex count, up to F).
  const itemLabel = s => s.n > 1 ? `${ITEMS[s.key].name}x${s.n.toString(16).toUpperCase()}` : `[${ITEMS[s.key].name}]`;
  const itemCol = v => v.rarity === 'common' ? C.bright : rarityCol(v.rarity);

  // Up to k mod offers ({ key, tier }) from a pool. Mods you have come back as upgrades
  // (tiered ones only, until they're maxed). Each offer rolls its tier.
  function pickMods(r, pool, k, exclude = []) {
    const ex = exclude.map(o => o.key || o);
    const ok = key => !ex.includes(key) && (!has(key) || (MODS[key].tiers && !modMaxed(key)));
    return shuffle(pool.filter(ok), r).slice(0, k).map(key => ({ key, tier: rollTier(r, MODS[key]) }));
  }

  const priceOf = o => o.kind === 'repair' ? o.price : Math.round(o.price * TIER_PRICE[o.tier || 0] * (has('haggle') ? 1 - tv('haggle', [0.25, 0.35, 0.5]) : 1));
  const SEP = '+ - - - - - - - - - - - - - - - +';

  function openShop(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'shop', node.id);
    const itemKeys = shuffle(Object.keys(ITEMS), r).slice(0, 3);
    let offers = itemKeys.map(k => ({ kind: 'item', key: k, tier: rollTier(r, ITEMS[k]), price: ITEMS[k].price, sold: false }));
    for (const o of pickMods(r, modsOfKind('gen', 'minor'), has('coupon') ? 3 : 2)) offers.push({ kind: 'mod', key: o.key, tier: o.tier, price: MODS[o.key].price, sold: false });
    offers = shuffle(offers, r);   // random order: any slot could be the good one
    offers.push({ kind: 'repair', key: 'repair', price: 20, sold: false });

    // What an offer is: items at their tier; mods as what you'd end up with (upgrades).
    const defOf = o => o.kind === 'item' ? itemView(o.key, o.tier) : o.kind === 'mod' ? modView(o.key, upgradeTo(o.key, o.tier)) : { name: 'REPAIR', desc: 'restore 1 integrity.', rarity: 'common', tier: 0 };
    const buy = o => {
      const price = priceOf(o);
      if (o.sold || run.credits < price) return Sound.deny();
      if (o.kind === 'repair' && run.integrity >= run.maxInt) return Sound.deny();
      const name = defOf(o).name.toLowerCase();
      const finish = () => { run.credits -= price; if (o.kind !== 'repair') o.sold = true; Sound.buy(); setMsg(`> bought ${name}.`, C.gold); };
      // No room: pick one of yours to replace (the purchase goes through after the swap).
      if (o.kind === 'item') { if (!itemRoom(o.key, o.tier)) return openSwap('item', o.key, o.tier, finish); addItem(o.key, o.tier); }
      if (o.kind === 'mod') { if (!modRoom(o.key)) return openSwap('mod', o.key, o.tier, finish); addMod(o.key, o.tier); }
      if (o.kind === 'repair') run.integrity++;
      finish();
    };

    let sel = 0;
    const whyNot = o => {
      if (o.sold) return 'sold out.';
      if (o.kind === 'repair' && run.integrity >= run.maxInt) return 'integrity is full.';
      if (run.credits < priceOf(o)) return 'not enough credits.';
      return null;
    };

    openPanel('BLACK MARKET', (T, B, X) => {
      const now = performance.now();
      T('BLACK MARKET', C.gold);
      T(`credits ${run.credits}${has('haggle') ? `  (haggle -${Math.round(tv('haggle', [0.25, 0.35, 0.5]) * 100)}%)` : ''}`, C.gold);
      T('');
      offers.forEach((o, k) => {
        const def = defOf(o);
        const isMod = o.kind === 'mod', up = isMod && has(o.key);
        const price = o.sold ? 'SOLD' : `${priceOf(o)}cr`;
        const tag = isMod ? (up ? 'up' : 'mod') : o.kind === 'item' ? (def.tier ? RARITY[def.rarity].label.toLowerCase() : 'item') : 'svc';
        const col = isMod ? modColor(def) : o.kind === 'item' ? itemCol(def) : C.bright;
        X({
          list: true, id: 'offer' + k, onTap: () => { sel = k; Sound.tick(); },
          sel: k === sel, faded: !!whyNot(o),
          badge: isMod ? o.key : null, badgeTier: def.tier, name: def.name + (up ? ' +' : ''), col,
          right: `${tag} ${price.padStart(5)}`, rightCol: C.gold,
          tint: isMod ? modColor(def) : o.kind === 'item' ? (def.tier ? itemCol(def) : C.mid) : C.cyan,
          reveal: k, revealId: 'offer' + k,
          rarity: o.kind === 'repair' ? null : def.rarity, seenKey: o.kind === 'repair' ? null : o.key,
        });
      });
      T('');
      // Details box for the selected offer (once it has popped in).
      const o = offers[sel], def = defOf(o), why = whyNot(o);
      const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
      // Fixed height (7 rows) so the layout never jumps while offers pop in.
      T(SEP, C.dim);
      if (!shown) { T('...', C.dim); for (let i = 0; i < 6; i++) T(''); }
      else {
        if (o.kind === 'mod') {
          X({ badge: o.key, badgeTier: def.tier });
          T(has(o.key) ? `upgrade: ${tierLabel(modView(o.key))} > ${tierLabel(def)}` : `${tierLabel(def)} mod`, modColor(def));
        } else { T(def.name, o.kind === 'item' ? itemCol(def) : C.bright); T(o.kind === 'item' ? `${def.tier ? RARITY[def.rarity].label + ' ' : ''}item // single use` : 'service', C.mid); }
        T(def.tip || def.desc, C.text);   // the short text: long item descs ran off the screen
        if (why) { T(''); T(why, C.redDim); T(''); T(''); }
        else X({ box: true, text: 'B U Y', sub: `${priceOf(o)}cr`, id: 'buy', onTap: () => buy(o), minW: 18 });
      }
      T(SEP, C.dim);
      B('[ LEAVE ]', 'leave', leavePanel);
    }, '> the market is open.');
  }

  // A reward screen: header lines, then a list of mods to pick one from (or skip).
  // next: where to go after (default: the map).
  function openChoice({ title, col, head = [], options, skipLabel, onSkip, msg, reveal = false, locked = false, next = null }) {
    let sel = 0;
    const leave = () => next ? (st.transitioning ? null : swapTo(next)) : leavePanel();
    const take = o => {
      if (st.transitioning) return;
      if (o && locked) return Sound.deny();
      if (o) {
        if (!modRoom(o.key)) return openSwap('mod', o.key, o.tier, () => leave());   // full: pick one to replace
        const how = addMod(o.key, o.tier), v = modView(o.key);
        Sound.buy();
        setMsg(how === 'up' ? `> ${v.name.toLowerCase()} upgraded: ${tierLabel(v).toLowerCase()}.` : `> installed ${v.name.toLowerCase()}.`, C.cyan);
      } else if (onSkip) onSkip();
      leave();
    };
    openPanel(title, (T, B, X) => {
      const now = performance.now();
      T(title, col);
      for (const h of head) T(h[0], h[1]);
      T('');
      if (options.length) T(locked ? 'what you could have had:' : options.length > 1 ? 'choose one mod:' : 'mod found:', C.mid);
      // each offer shows what you'd end up with (a mod you have = an upgrade, "+")
      const viewOf = o => modView(o.key, upgradeTo(o.key, o.tier));
      options.forEach((o, i) => {
        const v = viewOf(o), up = has(o.key), mc = locked ? C.dim : modColor(v);
        X({
          list: true, id: 'opt' + i, onTap: () => { sel = i; Sound.tick(); },
          sel: i === sel, badge: o.key, badgeTier: v.tier, name: v.name + (up ? ' +' : ''), col: mc,
          right: up ? `> ${tierLabel(v)}` : tierLabel(v), rightCol: mc, tint: mc,
          reveal: i, revealId: 'opt' + i, rarity: v.rarity, seenKey: o.key,
        });
      });
      if (options.length) {
        T('');
        const o = options[sel], v = viewOf(o);
        const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
        T(SEP, C.dim);
        if (shown) {
          X({ badge: o.key, badgeTier: v.tier });
          T(v.tip, C.text);
          T(has(o.key) ? `upgrade: ${tierLabel(modView(o.key))} > ${tierLabel(v)}` : !modRoom(o.key) ? `mod slots full (${MOD_SLOTS}): you'll swap one` : '', has(o.key) ? modColor(v) : C.redDim);
          if (locked) { T(''); T('skipped: you cannot take it.', C.redDim); T(''); }
          else X({ box: true, text: 'T A K E', id: 'take', onTap: () => take(o), minW: 18 });
        } else { T('...', C.dim); T(''); T(''); T(''); T(''); T(''); }
        T(SEP, C.dim);
      }
      T('');
      B(options.length && skipLabel ? skipLabel : '[ CONTINUE ]', 'skip', () => take(null));
    }, msg, { reveal });
  }

  // PUBLIC NET done: a small starting perk.
  function openStartReward(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'choice', node.id);
    openChoice({
      title: 'LINK ESTABLISHED', col: C.cyan,
      head: [['you are in. pick a starter perk.', C.text]],
      options: pickMods(r, modsOfKind('minor'), 3),
      skipLabel: '[ SKIP  +15cr ]',
      onSkip: () => { run.credits += 15; run.earned += 15; },
      msg: '> link established.',
    });
  }

  function openCache(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'cache', node.id);
    const got = [grantLoot(r, 2)];
    for (let i = 0; i < (has('cachekey') ? tv('cachekey', [1, 2, 3]) : 0); i++) got.push(grantLoot(r, 2));
    openChoice({
      title: 'DATA CACHE', col: C.gold,
      head: got.map(g => [g, C.bright]),
      options: pickMods(r, modsOfKind('gen', 'minor'), 2),
      skipLabel: '[ SKIP ]',
      msg: '> cache cracked.',
    });
  }

  function openRepair(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'rest', node.id);
    const before = run.integrity;
    run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.repairAmount);
    Sound.buy();
    openChoice({
      title: 'SAFEHOUSE', col: C.cyan,
      head: [[`integrity +${run.integrity - before}`, C.bright]],
      options: pickMods(r, modsOfKind('minor'), 2),
      skipLabel: '[ SKIP ]',
      msg: '> patched up.',
    });
  }

  // Corp boss beaten: one corp-specific mod, one general mod, and a random third.
  // How the corp you just breached went, for the header line: perfects and ICE hits.
  function breachSummary() {
    const c = st.corp || {}, p = c.perfects || 0, n = c.scored || 0, ice = c.ice || 0;
    return { text: `> perfect ${p}/${n}   ice hit ${ice}${ice === 0 ? '  FLAWLESS' : ''}`, col: ice === 0 ? C.cyan : C.text };
  }

  function openReward(node, skipped = false) {
    const run = st.run;
    const r = rngFor(run.seed, 'reward', node.id);
    const def = corpDef(node.corp);
    const corpPick = pickMods(r, def.mods || [], 1);
    const gen = pickMods(r, modsOfKind('gen'), 1, corpPick);
    const third = pickMods(r, modsOfKind('gen', 'minor'), 1, corpPick.concat(gen));
    const options = shuffle(corpPick.concat(gen, third), r);
    openChoice({
      reveal: st.breachReveal,
      title: 'CORP BREACHED', col: C.cyan,
      head: skipped ? [[def.name, C.text], ['boss skipped: no rewards.', C.redDim]] : [[def.name, C.text]],
      options, locked: skipped,
      skipLabel: skipped ? '[ CONTINUE ]' : '[ SKIP  +20cr ]',
      onSkip: skipped ? null : () => { run.credits += 20; run.earned += 20; Sound.loot(); },
      msg: skipped ? { text: '> skipjack: boss skipped.', col: C.redDim } : breachSummary(),
    });
  }

  // ---------------- How to play ----------------
  const HELP_PAGES = [
    { title: 'THE BASICS', tab: 'BASIC',
      paragraph: 'each layer is a grid of nodes. one is the real node, the rest are ICE. ' +
        'guess which node is real and tap it. hit ICE and you lose 1 integrity, then guess again. ' +
        "at 0 integrity you're out. find it on the first try for a PERFECT: +1 integrity and more credits.",
      nodeTile: true, lootTile: true },
    { title: 'THE NET', tab: 'NET', build: buildNetPage },
    { title: 'THE TRAY', tab: 'TRAY', build: buildTrayPage },
  ];

  // ---- How to play page builders. One style everywhere: section headers in the
  // accent color, plain text under them, game things drawn the way they look in game.
  const HELP_W = 32;
  function helpKit(T, X) {
    const H = text => X({ text: text.padEnd(HELP_W), col: C.cyan, bold: true });
    const P = (str, indent = 0) => wrapText(str, HELP_W - indent).forEach(l => T((' '.repeat(indent) + l).padEnd(HELP_W), C.text));
    return { H, P };
  }

  // A small overworld sample, drawn like the real map.
  function netSample() {
    // 4 node rows (start, two layers, the final), 4 rows apart so the links read.
    const W = HELP_W, H = 13, rows = Array.from({ length: H }, () => Array(W).fill(' '));
    const cols = Array.from({ length: H }, () => Array(W).fill(null));
    const lanes = [5, 16, 27], R = [12, 8, 4, 0];
    const node = (lane, r, ch, col) => { const x = lanes[lane] - 1; [...`[${ch}]`].forEach((c, i) => { rows[R[r]][x + i] = c; cols[R[r]][x + i] = col; }); };
    // dotted link, like the real map; links you can take right now are brighter
    const link = (la, ra, lb, rb, col = C.dim) => {
      const dy = R[ra] - R[rb];
      for (let k = 1; k < dy; k++) {
        const f = k / dy, y = R[ra] - k;
        const x = Math.round(lanes[la] + (lanes[lb] - lanes[la]) * f);
        rows[y][x] = '·'; cols[y][x] = col;
      }
    };
    [0, 1, 2].forEach(l => link(1, 0, l, 1, C.mid));            // start -> layer 1 (all open)
    link(0, 1, 0, 2); link(0, 1, 1, 2); link(1, 1, 1, 2);        // layer 1 -> layer 2 (branching)
    link(2, 1, 1, 2); link(2, 1, 2, 2);
    [0, 1, 2].forEach(l => link(l, 2, 1, 3));                    // layer 2 -> final
    node(1, 0, '>', C.cyan);
    rows[R[0]][lanes[1] - 3] = '@'; cols[R[0]][lanes[1] - 3] = C.bright;
    node(0, 1, 'P', C.bright); node(1, 1, '$', C.bright); node(2, 1, 'S', C.bright);
    node(0, 2, '+', C.bright); node(1, 2, 'C', C.bright); node(2, 2, '?', C.bright);
    node(1, 3, '!', C.red);
    return rows.map((r, y) => ({ text: r.join(''), colorAt: i => cols[y][i] || C.dim }));
  }

  function buildNetPage(T, X) {
    const { H, P } = helpKit(T, X);
    T('THE NET'.padEnd(HELP_W), C.bright);
    T('');
    P('the net is a map you climb from the bottom to OMNI//CORE at the top. ' +
      'each step, pick a node linked to the one you are on (some link sideways too). every stop pays out a mod or loot.');
    T('');
    for (const ln of netSample()) X(ln);
    T('');
    X({ text: '@ you are here   [!] the final'.padEnd(HELP_W), colorAt: i => i === 0 ? C.bright : i >= 17 && i <= 19 ? C.red : C.mid });
    T('');
    H('STOPS');
    const stop = (ch, name, desc) => {
      X({ text: `[${ch}]  ${name}`.padEnd(HELP_W), colorAt: i => i < 3 ? C.bright : C.gold, bold: true });
      P(desc, 5);
    };
    stop('$', 'BLACK MARKET', 'buy items, mods and repairs with your credits.');
    stop('?', 'DATA CACHE', 'free loot, then pick a mod.');
    stop('+', 'SAFEHOUSE', 'heal 2 integrity, then pick a mod.');
    T('');
    H('CORPS');
    P('4 layers and a boss. each corp hides the real node its own way: its tell. the quote on the map is a hint.');
    for (const d of [CORPS.perimeter, CORPS.sigil, CORPS.chronos, CORPS.mirror, FINAL]) {
      X({ text: `[${d.letter}]  ${d.name}`.padEnd(HELP_W), colorAt: i => i < 3 ? (d === FINAL ? C.red : C.bright) : C.text });
    }
    P('beat a corp to log its tell in the CODEX.');
    T('');
    H('SECTORS');
    P('beating OMNI//CORE clears the sector. CASH OUT to end the run and bank REP, or PUSH ON: the net goes on from there, a little harder each sector. die and you bank nothing.');
    P('spend REP on THE BOARD, from the title screen.');
  }

  function buildTrayPage(T, X) {
    const { H, P } = helpKit(T, X);
    T('THE TRAY'.padEnd(HELP_W), C.bright);
    T('');
    P('the bar at the bottom of the screen. it looks like this:');
    T('');
    X({ trayDemo: 'rule' }); X({ trayDemo: 'mods' }); X({ trayDemo: 'modinfo' }); X({ trayDemo: 'items' }); X({ trayDemo: 'iteminfo' });
    T('');
    H('MODS');
    P('upgrades that last the whole run. you get them at every stop. you can hold 6; find one you have and it upgrades instead. tap-to-use ones show as [buttons].');
    T('');
    H('TRIGGER ORDER');
    P('every mod fires at one stage of a pick. the stages go in this order:');
    for (const k of Object.keys(STAGES).filter(k => STAGES[k].order)) {
      const s = STAGES[k], head = `${s.order}.${s.label}`;
      X({ text: `${head.padEnd(14)}${s.desc}`.slice(0, HELP_W).padEnd(HELP_W), colorAt: i => i < 14 ? C.cyan : C.text });
    }
    P('inside a stage, mods fire left to right on the bar. a corp\'s own tricks go after your mods. BLOCK is the one exception: free blocks first, then FWALL, and FAILSAFE last.');
    P('the codex shows each mod\'s stage.');
    T('');
    H('ITEMS');
    P('single use, in the slots below the mods. you start with one PURGE. the same item stacks in one slot (PURGEx3).');
    T('');
    H('USING THEM');
    P('tap a mod or item to see what it does, tap again to use it. on desktop, hover for info; number keys use items.');
    T('');
    H('MOD RARITY');
    const ex = { common: 'small perks', rare: 'solid upgrades', epic: 'build-defining', exotic: 'rare and strange', boss: 'only from corp bosses' };
    for (const r of Object.keys(RARITY)) X({ text: `${RARITY[r].label.padEnd(8)}${ex[r]}`.padEnd(HELP_W), colorAt: i => i < 8 ? C[r] : C.text });
  }

  function openHelp() {
    let page = 0, top = 0;   // top: first content line shown (pages scroll when they're too tall)
    const show = i => { page = (i + HELP_PAGES.length) % HELP_PAGES.length; top = 0; st.boardStart = performance.now(); Sound.tick(); };
    const go = d => show(page + d);
    const CONTENT_ROWS = 30;   // the content window; every tab uses the same height (screen is full height)
    const rowsOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.tileInfo ? TILE_H : 1;

    // A page's content as lines (built fresh each frame).
    function pageContent(p) {
      const out = [];
      const T = (text, col = C.text) => out.push({ text, col });
      const X = ln => out.push(ln);
      if (p.build) { p.build(T, X); return out; }
      // Sectioned pages skip the title (the tab names the page) and space their own sections.
      if (!p.sections) { T(p.title.padEnd(HELP_W), C.bright); T(''); }
      if (p.lines) for (const [text, col] of p.lines) T(text, col ? C[col] : C.text);
      // A paragraph, wrapped into a left-aligned block.
      if (p.paragraph) for (const l of wrapText(p.paragraph, 32)) T(l.padEnd(32), C.text);
      // A node, cycling through the glyph designs nodes can have.
      if (p.nodeTile) {
        T('');
        const glyph = MOTIFS[Math.floor(performance.now() / 1100) % MOTIFS.length];
        X({ tileInfo: glyph, lines: [
          { text: 'NODE', col: C.cyan }, { text: 'one per layer is real,', col: C.text },
          { text: 'the rest are ICE.', col: C.text }, { text: 'the glyph can be a clue:', col: C.text },
          { text: "a corp's tell.", col: C.mid },
        ] });
      }
      // Labeled sections: label column in the accent color, plain text beside it.
      if (p.sections) for (const [label, ...body] of p.sections) {
        T('');   // a gap before each section
        body.forEach((b, i) => X({ text: ((i === 0 ? label : '').padEnd(9) + b).padEnd(34), colorAt: c => c < 9 ? C.cyan : C.text }));
      }
      // The loot node, drawn the way it looks on the board.
      if (p.lootTile) {
        T('');
        X({ tileInfo: LOOT_GLYPH, frameCol: C.redDim, glyphCol: C.gold, lines: [
          { text: 'LOOT NODE', col: C.cyan }, { text: 'always ICE: costs 1', col: C.text },
          { text: 'integrity, but drops', col: C.text }, { text: 'credits or an item.', col: C.text },
          { text: 'a trade, not a trap.', col: C.mid },
        ] });
      }
      if (p.rarity) {
        T('mods come in five tiers:');
        T('');
        const ex = { common: 'small perks.', rare: 'solid upgrades.', epic: 'build-defining.', exotic: 'rare and strange.', boss: 'only from corp bosses.' };
        for (const r of Object.keys(RARITY)) T(`${RARITY[r].label.padEnd(7)} ${ex[r]}`.padEnd(30), C[r]);
      }
      return out;
    }

    // Content as single rows: tiles are split into their 5 rows, so scrolling moves
    // one row at a time.
    const flatRows = p => pageContent(p).flatMap(ln => ln.tileInfo ? Array.from({ length: TILE_H }, (_, k) => ({ tileRow: k, tile: ln })) : [ln]);
    const maxTopOf = rowsArr => maxTop(rowsArr.length, CONTENT_ROWS);
    const scrollBy = d => {
      const rowsArr = flatRows(HELP_PAGES[page]);
      const nt = nextTop(top, d, maxTopOf(rowsArr));
      if (nt !== top) { top = nt; Sound.tick(); }
    };

    openPanel('HOW TO PLAY', (T, B, X, lines) => {
      const p = HELP_PAGES[page];
      T('HOW TO PLAY', C.cyan);
      X({ gap: 1, row: HELP_PAGES.map((hp, i) => ({ text: `[${hp.tab}]`, id: 'htab' + i, sel: i === page, onTap: () => show(i) })) });
      T(SEP, C.dim);
      const rowsArr = flatRows(p);
      top = clamp(top, 0, maxTopOf(rowsArr));
      const w = listWindow(top, rowsArr.length, CONTENT_ROWS);
      // The up row is always the window's first row, the down row always its last.
      let used = 0;
      if (w.hasUp) { X({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', invert: true, id: 'hup', onTap: () => scrollBy(-1) }); used++; }
      for (let i = top; i < top + w.shown; i++) { X(rowsArr[i]); used++; }
      for (; used < CONTENT_ROWS - (w.hasDown ? 1 : 0); used++) T('');
      if (w.hasDown) X({ text: '[ v v v  more  v v v ]', invert: true, id: 'hdn', onTap: () => scrollBy(1) });
      T(SEP, C.dim);
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> manual loaded.', { full: true });
    st.scroll = scrollBy;   // mouse wheel and swipe
    // Keys: left/right or 1-4 = tabs, up/down = scroll (when the page scrolls), esc = back.
    st.keyHandler = k => {
      const focusTab = () => { st.kbFocus = st.hoverBtn = 'htab' + page; };   // cursor follows the active tab
      if (k === 'arrowleft') { go(-1); focusTab(); return true; }
      if (k === 'arrowright') { go(1); focusTab(); return true; }
      if (/^[1-9]$/.test(k) && Number(k) <= HELP_PAGES.length) { show(Number(k) - 1); focusTab(); return true; }
      // Scrolling pages: up/down scroll; past the bottom the cursor moves to BACK, and up
      // from BACK resumes scrolling. At the very top, up puts the cursor on the tab.
      if ((k === 'arrowup' || k === 'arrowdown') && maxTopOf(flatRows(HELP_PAGES[page])) > 0) {
        const max = maxTopOf(flatRows(HELP_PAGES[page]));
        const focus = (id) => { st.kbFocus = st.hoverBtn = id; Sound.tick(); };
        const unfocus = () => { st.kbFocus = st.hoverBtn = null; };
        if (k === 'arrowdown') {
          if (st.kbFocus === 'back') return true;
          if (st.kbFocus && st.kbFocus.startsWith('htab')) unfocus();
          if (top < max) scrollBy(1); else focus('back');
        } else {
          if (st.kbFocus === 'back') { unfocus(); Sound.tick(); return true; }
          if (top > 0) scrollBy(-1); else focus('htab' + page);
        }
        return true;
      }
      if (k === 'escape') { swapTo(showTitle); return true; }
      return false;
    };
  }

  // ---------------- Codex ----------------
  const RARITY_ORDER = Object.keys(RARITY);
  const codexMods = () => Object.keys(MODS).sort((a, b) => RARITY_ORDER.indexOf(MODS[a].rarity) - RARITY_ORDER.indexOf(MODS[b].rarity) || MODS[a].name.localeCompare(MODS[b].name));
  const CODEX_ROWS = 24;   // height of the list window, including "more" rows

  function wrapText(str, w) {
    const lines = [];
    let cur = '';
    for (const word of str.split(' ')) {
      if (cur && (cur + ' ' + word).length > w) { lines.push(cur); cur = word; }
      else cur = cur ? cur + ' ' + word : word;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Which entries fit in the list window when it starts at `top`.
  // A "more" row takes a slot at the top/bottom when there are entries that way.
  function listWindow(top, n, rows = CODEX_ROWS) {
    const hasUp = top > 0;
    let shown = rows - (hasUp ? 1 : 0);
    const hasDown = top + shown < n;
    if (hasDown) shown -= 1;
    return { hasUp, hasDown, shown: Math.min(shown, n - top) };
  }
  const maxTop = (n, rows = CODEX_ROWS) => n <= rows ? 0 : n - (rows - 1);
  // Scrolling off the very top makes a "more" row appear in the freed space, which would
  // look like nothing moved. So the first step down skips one extra line, and stepping
  // back to line 1 snaps to the top.
  function nextTop(top, d, max) {
    let t = top + d;
    if (top === 0 && d > 0) t += 1;
    if (t === 1 && d < 0) t = 0;
    return clamp(t, 0, max);
  }

  function openCodex() {
    const TABS = [['mods', 'MODS', 'tabm'], ['items', 'ITEMS', 'tabi'], ['glyphs', 'GLYPHS', 'tabg'], ['corps', 'CORPS', 'tabc']];
    let tab = 'mods', sel = 0, top = 0, shownPal = null;
    const entries = () => tab === 'mods' ? codexMods() : tab === 'items' ? Object.keys(ITEMS)
      : tab === 'glyphs' ? GLYPHS.map(gl => gl.key) : CODEX_CORPS.map(k => 'corp_' + k);
    // Corps: a short list and a taller details box.
    const rowsFor = () => tab === 'corps' ? CODEX_ROWS - 5 : tab === 'glyphs' ? CODEX_ROWS : CODEX_ROWS - 7;   // details: corps 10 rows, mods / items 12, glyphs 5
    const setTab = name => { tab = name; sel = 0; top = 0; Sound.tick(); };
    const scrollBy = d => { const n = entries().length; const t = nextTop(top, d, maxTop(n, rowsFor())); if (t !== top) { top = t; Sound.tick(); } };
    // Keep the selected entry inside the list window.
    const follow = () => {
      const n = entries().length, rows = rowsFor();
      for (let i = 0; i < 4; i++) {
        const w = listWindow(top, n, rows);
        if (sel < top) top = sel;
        else if (sel >= top + w.shown) top = sel - w.shown + 1;
        else break;
        top = clamp(top, 0, maxTop(n, rows));
      }
    };

    openPanel('CODEX', (T, B, X) => {
      const list = entries(), n = list.length, rows = rowsFor();
      sel = clamp(sel, 0, n - 1);
      top = clamp(top, 0, maxTop(n, rows));
      const found = list.filter(k => save.seen[k]).length;
      T(`CODEX  ${tab} ${found}/${n} found`, C.cyan);
      X({ gap: 1, row: TABS.map(([name, label, id]) => ({ text: `[${label}]`, id, sel: tab === name, onTap: () => setTab(name) })) });

      // Details of the selected entry (5 rows; 10 for corps).
      T(SEP, C.dim);
      const k = list[sel], seen = !!save.seen[k];
      // A found corp is shown in its own palette (if corp colors are on).
      const palKey = tab === 'corps' && seen ? k.slice(5) : null;
      if (palKey !== shownPal) { shownPal = palKey; scenePalette(palKey); }
      if (tab === 'corps') {
        const key = k.slice(5), d = corpDef(key), rec = corpStat(key);
        const pad = (arr, nRows) => { while (arr.length < nRows) arr.push(''); return arr.slice(0, nRows); };
        if (!seen) {
          T('???', C.dim); T('not found yet.', C.mid); T('enter it on the map to log it.', C.dim);
          for (let i = 0; i < 7; i++) T('');
        } else {
          X({ text: `${d.letter}  ${d.name}${d.level ? '  LV' + d.level : ''}`, col: key === 'omni' ? C.red : C.cyan, bold: true });
          T(d.intel, C.text);
          T(corpRules(d, 1), C.mid);
          T(d.bossDesc || '', C.redDim);
          T('');
          // The tell only appears once you've beaten this corp.
          const tell = rec.breached ? pad(wrapText('tell: ' + CORP_TELL[key], 34), 3)
            : ['tell: ???', 'beat this corp to log its tell.', ''];
          tell.forEach((t, i) => T(t, rec.breached ? C.cyan : i === 0 ? C.mid : C.dim));
          T(d.mods ? `mods: ${d.mods.map(m => MODS[m].name).join(', ')}` : 'mods: none', C.mid);
          T(`breached ${rec.breached}   lost ${rec.lost}`, C.text);
        }
      } else if (tab === 'glyphs') {
        const gl = GLYPH_BY_KEY[k];
        X({ tileInfo: seen ? gl.glyphOf() : MASK_GLYPH, lines: seen
          ? [{ text: gl.name, col: C.cyan }, ...gl.lore.map(t => ({ text: t, col: C.text }))]
          : [{ text: '???', col: C.dim }, { text: 'not found yet.', col: C.mid }, { text: 'it shows up on a board.', col: C.dim }] });
      } else if (!seen) {
        T('???', C.dim); T('not found yet.', C.mid);
        T(tab === 'mods' ? 'find it in a run to unlock it.' : 'pick one up to unlock it.', C.dim);
        for (let i = 0; i < 9; i++) T('');
      } else if (tab === 'mods') {
        // 12 rows: badge, kind, the full text, its tiers, where it comes from
        const m = MODS[k];
        const kind = m.kind === 'corp' ? 'corp mod' : m.kind === 'minor' ? 'minor mod' : 'mod';
        X({ badge: k });
        const sg = STAGES[m.stage];   // when it fires (the trigger order)
        X({ text: `${RARITY[m.rarity].label} // ${kind} // ${sg.order ? sg.order + '.' : ''}${sg.label}`,
          colorAt: i => i >= RARITY[m.rarity].label.length + kind.length + 8 ? C.mid : modColor(m) });
        const tiers = m.tiers ? m.tiers.map((_, i) => tierView(m, i)) : [];
        const d = wrapText(m.codex || m.desc, 34).slice(0, 12 - 3 - tiers.length - (tiers.length ? 1 : 0));
        d.forEach(l => T(l.padEnd(34), C.text));
        if (tiers.length) { T(''); tiers.forEach(v => X({ text: `${tierLabel(v).padEnd(7)}${v.tip}`.padEnd(34), colorAt: i => i < 7 ? modColor(v) : C.text })); }
        T(modWhere(m), C.mid);
        for (let i = 3 + d.length + tiers.length + (tiers.length ? 1 : 0); i < 12; i++) T('');
      } else {
        const it = ITEMS[k], tiers = it.tiers ? it.tiers.map((_, i) => tierView(it, i)) : [];
        T(it.name, itemCol(it)); T(`${it.rarity !== 'common' ? RARITY[it.rarity].label + ' ' : ''}item // single use`, C.mid);
        const dl = wrapText(it.codex || it.desc, 34).slice(0, 12 - 3 - tiers.length - (tiers.length ? 1 : 0));
        dl.forEach(l => T(l.padEnd(34), C.text));
        if (tiers.length) { T(''); tiers.forEach(v => X({ text: `${RARITY[v.rarity].label.padEnd(7)}${v.tip}`.padEnd(34), colorAt: i => i < 7 ? itemCol(v) : C.text })); }
        T(`from: ${ITEM_WHERE}`, C.mid);
        for (let i = 3 + dl.length + tiers.length + (tiers.length ? 1 : 0); i < 12; i++) T('');
      }
      T(SEP, C.dim);

      // The list window, with "more" rows when there are entries above/below.
      const w = listWindow(top, n, rows);
      let used = 0;
      if (w.hasUp) { X({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', invert: true, id: 'moreup', onTap: () => scrollBy(-1) }); used++; }
      for (let idx = top; idx < top + w.shown; idx++) {
        const key = list[idx], seenK = !!save.seen[key];
        const base = { list: true, id: 'cx' + idx, onTap: () => { sel = idx; Sound.tick(); }, sel: idx === sel };
        if (tab === 'glyphs') {
          X(Object.assign(base, { name: seenK ? GLYPH_BY_KEY[key].name : '???', col: seenK ? C.bright : C.dim, right: `#${pad2(idx + 1)}`, rightCol: C.mid }));
        } else if (tab === 'corps') {
          const ck = key.slice(5), d = corpDef(ck), rec = corpStat(ck);
          X(Object.assign(base, {
            name: seenK ? `${d.letter}  ${d.name}` : '???', col: seenK ? C.bright : C.dim,
            right: rec.breached ? 'BREACHED' : seenK ? 'SEEN' : '', rightCol: rec.breached ? C.cyan : C.mid,
          }));
        } else {
          const isMod = tab === 'mods';
          const def = isMod ? MODS[key] : ITEMS[key];
          X(Object.assign(base, {
            badge: isMod && seenK ? key : null,
            name: seenK ? def.name : '???', col: seenK ? (isMod ? modColor(def) : C.bright) : C.dim,
            right: isMod ? (seenK ? RARITY[def.rarity].label : '') : 'item', rightCol: seenK && isMod ? modColor(def) : C.mid,
            tint: seenK && isMod ? modColor(def) : null,
          }));
        }
        used++;
      }
      if (w.hasDown) { X({ text: '[ v v v  more  v v v ]', invert: true, id: 'moredn', onTap: () => scrollBy(1) }); used++; }
      for (; used < rows; used++) T('');
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> codex open.', { full: true });

    // Keys: left/right = tabs, up/down = move through the list, esc = back.
    st.keyHandler = k => {
      if (k === 'arrowleft' || k === 'arrowright') {
        const i = TABS.findIndex(t => t[0] === tab);
        const next = TABS[(i + (k === 'arrowright' ? 1 : TABS.length - 1)) % TABS.length];
        setTab(next[0]);
        st.kbFocus = st.hoverBtn = next[2];   // cursor follows the active tab
        return true;
      }
      if (k === 'arrowup' || k === 'arrowdown') {
        // Past the last entry the cursor moves to BACK; up from BACK returns to the list.
        const n = entries().length;
        if (k === 'arrowdown' && st.kbFocus === 'back') return true;
        if (k === 'arrowup' && st.kbFocus === 'back') { st.kbFocus = st.hoverBtn = null; Sound.tick(); return true; }
        if (k === 'arrowdown' && sel >= n - 1) { st.kbFocus = st.hoverBtn = 'back'; Sound.tick(); return true; }
        sel = clamp(sel + (k === 'arrowdown' ? 1 : -1), 0, n - 1);
        follow();
        Sound.tick();
        return true;
      }
      if (k === 'escape') { swapTo(showTitle); return true; }
      return false;
    };
    st.scroll = scrollBy;   // mouse wheel and swipe
  }

  // ---------------- Settings ----------------
  function openSettings() {
    st.resetArmed = false;
    openPanel('SETTINGS', (T, B, X) => {
      T('SETTINGS', C.cyan);
      T('');
      B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
      B(`[ corp colors: ${save.corpColors ? 'ON ' : 'OFF'} ]`, 'ccol', toggleCorpColors);
      B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'fx', toggleEffects);
      B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'tap', toggleTapMode);
      T('');
      audioLines(X, 's_');
      T('');
      T(`next run seed${st.practice ? ' (practice)' : ''}`, C.text);
      X({ row: [
        { field: 'seed', width: 16, value: () => st.seed, clean: cleanSeed, onCommit: setSeed },
        { text: '[ NEW SEED ]', id: 'rseed', onTap: rerollSeed },
      ] });
      T(Field.editing('seed') ? 'enter to set, esc to cancel' : 'tap the seed to type your own', C.dim);
      T('');
      B(st.resetArmed ? '[ TAP AGAIN TO ERASE ]' : '[ reset save data ]', 'reset', resetSave);
      if (st.resetArmed) T('erases best, runs, codex.', C.red);
      T('');
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> settings.', { full: true });
    st.keyHandler = k => { if (k === 'escape') { swapTo(showTitle); return true; } return false; };
  }

  // A typed seed (from the settings field).
  function setSeed(s) {
    const clean = cleanSeed(s);
    if (!clean) return Sound.deny();      // empty: keep the old seed
    if (clean === st.seed) return;
    st.seed = clean;
    st.practice = true;     // a chosen seed is a practice run
    Sound.ui();
    setMsg(`> seed set: ${clean}`);
  }

  function resetSave() {
    if (!st.resetArmed) { st.resetArmed = true; Sound.deny(); return; }
    const keep = { palette: save.palette, muted: save.muted, effects: save.effects, tapMode: save.tapMode };
    for (const k of Object.keys(save)) delete save[k];
    Object.assign(save, freshSave(), keep);
    persist();
    clearRun();
    st.resetArmed = false;
    Sound.buy();
    setMsg('> save data erased.', C.red);
  }

  // ---------------- THE BOARD (legacy shop) ----------------
  // An old hacker bulletin board: spend REP on unlocks that last between runs.
  function openBoard() {
    let sel = 0;
    const buy = u => {
      const lv = legacyLv(u.key), cost = u.costs[lv];
      if (cost == null) return Sound.deny();
      if ((save.rep || 0) < cost) { Sound.deny(); setMsg('> not enough REP.', C.red); return; }
      save.rep -= cost;
      save.legacy = save.legacy || {};
      save.legacy[u.key] = lv + 1;
      persist();
      Sound.buy();
      setMsg(`> ${u.name.toLowerCase()} unlocked${u.costs.length > 1 ? `: level ${lv + 1}` : ''}.`, C.gold);
    };
    openPanel('THE BOARD', (T, B, X) => {
      T('+------------------------------+', C.dim);
      X({ text: '|  T H E   B O A R D   //  BBS |', colorAt: i => i === 0 || i === 31 ? C.dim : C.gold, bold: true });
      T('+------------------------------+', C.dim);
      T(`sysop: ${profile().name.toLowerCase()}`, C.mid);
      X({ text: `REP ${save.rep || 0}`, col: C.gold, bold: true });
      T('cash out after a sector for REP.', C.dim);
      T('');
      LEGACY.forEach((u, i) => {
        const lv = legacyLv(u.key), max = lv >= u.costs.length, cost = u.costs[lv];
        const lvTxt = u.costs.length > 1 ? ` ${'#'.repeat(lv)}${'-'.repeat(u.costs.length - lv)}` : '';
        X({
          list: true, id: 'lg' + i, onTap: () => { sel = i; Sound.tick(); }, sel: i === sel,
          name: u.name + lvTxt, col: max ? C.cyan : lv ? C.text : C.mid,
          right: max ? 'OWNED' : `${cost} REP`, rightCol: max ? C.cyan : (save.rep || 0) >= cost ? C.gold : C.dim,
          tint: max ? C.cyan : null,
        });
      });
      T('');
      const u = LEGACY[sel], lv = legacyLv(u.key), max = lv >= u.costs.length, cost = u.costs[lv];
      T(SEP, C.dim);
      X({ text: u.name, col: C.bright, bold: true });
      const dl = wrapText(u.levels ? u.levels[Math.min(lv, u.levels.length - 1)] : u.desc, 32);
      for (let k = 0; k < 2; k++) T(dl[k] || '', C.text);
      T(u.costs.length > 1 ? `level ${lv} of ${u.costs.length}` : '', C.mid);
      if (max) { T('owned.', C.cyan); T(''); T(''); }
      else X({ box: true, text: `B U Y  ${cost} REP`, id: 'buy', onTap: () => buy(u), minW: 20, disabled: (save.rep || 0) < cost });
      T(SEP, C.dim);
      T('');
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> connected to the board.', { full: true });
    st.keyHandler = k => { if (k === 'escape') { swapTo(showTitle); return true; } return false; };
  }

  // ---------------- Resume a saved run ----------------
  async function resumeRun() {
    const d = savedRun();
    if (!d || st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(0);
    st.transitioning = false;
    const run = d.run;
    run.resumes = (run.resumes || 0) + 1;   // layers come back different
    st.run = run; st.seed = run.seed; st.practice = run.practice;
    st.result = null;
    const p = d.pending;
    if (p && p.kind === 'sector') return showSectorClear(p.skipped, false);
    if (p && p.kind === 'omni') return openOmniReward(p.from);
    if (p && p.kind === 'reward' && run.map[p.id]) { st.breachReveal = false; return openReward(run.map[p.id], p.skipped); }
    if (p && p.kind === 'start') return openStartReward(run.map['0:1']);
    if (d.corp && run.map[d.corp.node]) {
      // Back into the corp you were in, at the layer you were on (a fresh layer).
      await startCorp(run.map[d.corp.node], d.corp.idx, d.corp);
      return;
    }
    toMap();
  }
  function newOverSave() {
    if (!st.newArmed) { st.newArmed = true; Sound.deny(); return; }
    st.newArmed = false;
    clearRun(); st.savedRun = null;
    jackIn();
  }

  // ---------------- Active mods ----------------
  function nodesAhead() {
    const run = st.run, cur = run.map[run.at];
    const top = SECTOR_STEPS * (run.sector + 1);   // this sector's OMNI
    return Object.values(run.map).filter(n => n.step > cur.step && n.step < top && !run.visited.includes(n.id));
  }

  function modUsable(key) {
    const m = MODS[key], run = st.run;
    if (!m || !m.active || !run || st.transitioning || st.dev || st.wipe) return false;
    if (m.active === 'layer') {
      if (st.mode !== 'play' || st.busy || !st.lv || !st.corp || !st.corp.hasBoss) return false;
      if (key === 'burner') return !st.corp.burnerUsed && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
      if (TAP_FX[key]) return !(st.corp.tapUsed && st.corp.tapUsed[key]) && TAP_FX[key].ok(st.lv);
    }
    return false;
  }
  // Used up for now: BURNER after its use in this corp, FAILSAFE after it saved you.
  function modSpent(key) {
    if (key === 'burner') return !!(st.mode === 'play' && st.corp && st.corp.hasBoss && st.corp.burnerUsed);
    if (TAP_FX[key]) return !!(st.mode === 'play' && st.corp && st.corp.hasBoss && st.corp.tapUsed && st.corp.tapUsed[key]);
    if (key === 'failsafe') return !!(st.run && st.run.failsafeUsed);
    return false;
  }

  function activateMod(key) {
    const run = st.run;
    if (!modUsable(key)) { Sound.deny(); return; }
    st.selMod = -1;
    if (key === 'burner') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      lockTile(pickR(opts, rngFor(run.seed, 'burner', st.corp.node.id, st.corp.idx)), C.cyan, 'burner');
      st.corp.burnerUsed = true;
      setMsg('> burner: 1 ICE locked.', C.cyan);
    }
    if (TAP_FX[key]) {
      const c = st.corp;
      c.tapUsed = Object.assign({}, c.tapUsed, { [key]: true });
      TAP_FX[key].use(st.lv, performance.now());
    }
  }
  // Tap-to-use corp mods: once per corp each. ok: can it be used right now.
  const iceOpen = lv => lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed');
  const TAP_FX = {
    timewarp: {
      ok: lv => !!st.timer && !lv.clockRate,
      use(lv) { lv.clockRate = 0.5; Sound.shield(); setMsg('> timewarp: half-speed clock.', C.cyan); },
    },
    anchor: {
      ok: lv => !lv.anchor && (!!st.corp.def.moves || !!st.timer),
      use(lv, now) {
        lv.anchor = true;
        if (!st.corp.def.moves) lv.holdUntil = now + 3000;
        Sound.shield(); setMsg(st.corp.def.moves ? '> anchor: nothing moves this layer.' : '> anchor: clock stopped 3s.', C.cyan);
      },
    },
    espresso: {
      ok: lv => !!st.timer && !(lv.holdUntil > performance.now()),
      use(lv, now) { lv.holdUntil = now + 5000; Sound.shield(); setMsg('> espresso: clock stopped 5s.', C.cyan); },
    },
    freezeframe: {
      ok: lv => !(lv.holdUntil > performance.now()),
      use(lv, now) { lv.holdUntil = now + 1000; lv.freeze = { from: now, until: now + 1000 }; Sound.shield(); setMsg('> freeze frame.', C.cyan); },
    },
    sacrifice: {
      ok: lv => st.run.integrity > 1 && iceOpen(lv).length >= 2,
      use(lv) {
        const ice = shuffle(iceOpen(lv), rngFor(st.run.seed, 'sac', st.corp.node.id, st.corp.idx));
        st.run.integrity -= 1;
        ice.slice(0, Math.floor(ice.length / 2)).forEach(t => lockTile(t, C.gold, 'sacrifice'));
        flash(C.gold, 0.2, 0.5); shake(5);
        setMsg('> sacrifice: -1 int. the ICE parts.', C.gold);
      },
    },
    rollup: {
      ok: lv => !lv.rolled,
      use(lv) { lv.rolled = true; Sound.shield(); setMsg('> curled up: 1 hit blocked, no pay.', C.cyan); },
    },
    interrogate: {
      ok: lv => iceOpen(lv).filter(t => !t.say).length > 0,
      use(lv) {
        const t = pickR(iceOpen(lv).filter(o => !o.say), rngFor(st.run.seed, 'interrogate', st.corp.node.id, st.corp.idx));
        t.say = ['NOT', 'ME']; t.ruledOut = true;
        Sound.ui(); setMsg('> interrogate: one of them talked.', C.cyan);
      },
    },
    blast: {
      ok: lv => lv.cols > 1 && lv.rows > 1 && lv.tiles.some(t => t.state === 'closed' && !t.safe),
      use(lv) {
        let best = null, bn = -1;
        const r = rngFor(st.run.seed, 'blast', st.corp.node.id, st.corp.idx);
        for (let c0 = 0; c0 < lv.cols - 1; c0++) for (let r0 = 0; r0 < lv.rows - 1; r0++) {
          const n = lv.tiles.filter(t => t.state === 'closed' && t.col >= c0 && t.col <= c0 + 1 && t.row >= r0 && t.row <= r0 + 1).length + r() * 0.5;
          if (n > bn) { bn = n; best = [c0, r0]; }
        }
        const inB = lv.tiles.filter(t => t.state === 'closed' && t.col >= best[0] && t.col <= best[0] + 1 && t.row >= best[1] && t.row <= best[1] + 1);
        shake(8); flash(C.gold, 0.2, 0.4);
        for (const t of inB) if (!t.safe) lockTile(t, C.gold, 'blast');
        const real = inB.find(t => t.safe);
        if (real) { lv.payCut = 1; lv.scanned = true; setMsg('> BLAST! got the real one. no pay.', C.gold); st.busy = true; onSafe(real); }
        else setMsg(`> BLAST! ${inB.length} ICE gone.`, C.gold);
      },
    },
    remote: {
      ok: lv => iceOpen(lv).length > 0,
      use(lv) {
        const r = rngFor(st.run.seed, 'remote', st.corp.node.id, st.corp.idx), used = new Set(lv.tiles.map(t => t.glyph));
        const deck = shuffle(MOTIFS.filter(m => !used.has(m)), r);
        iceOpen(lv).forEach((t, i) => { if (deck.length) t.glyph = deck[i % deck.length]; });
        Sound.ui(); flash(C.cyan, 0.1, 0.25);
        setMsg('> remote: new channel. new decoys.', C.cyan);
      },
    },
  };

  // Re-roll the type and corp of every node ahead (links stay the same).
  function rerouteMap() {
    const run = st.run;
    const r = rngFor(run.seed, 'reroute', run.reroutes++);
    const corps = Object.keys(CORPS);
    for (const n of nodesAhead()) {
      const roll = r();
      n.type = roll < 0.6 ? 'corp' : roll < 0.75 ? 'cache' : roll < 0.88 ? 'repair' : 'shop';
      delete n.mod;
      if (n.type === 'corp') { n.corp = pickR(corps, r); n.tier = tierAt(n.sector || 0, localStep(n)); }
      else { delete n.corp; delete n.tier; }
    }
  }

  // ---------------- Items ----------------
  function canUse(stack) {
    const run = st.run;
    if (!run || st.wipe || !stack) return false;
    const key = stack.key, tier = stack.tier || 0;
    if (key === 'patch') return run.integrity < run.maxInt;
    if (key === 'wall') return tier < 2 ? true : st.mode === 'play' && !!st.corp && st.corp.hasBoss && !st.corp.wallAll;
    if (key === 'route' || key === 'warp') return st.mode === 'map' && !st.busy && !st.transitioning && nodesAhead().length > 0;
    const inLayer = st.mode === 'play' && !st.busy && st.lv;
    if (key === 'purge') return !!inLayer && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    if (key === 'split') return !!inLayer && !st.lv.split && candidates().length > 1;
    return false;
  }

  function useItem(slot) {
    const run = st.run;
    if (!run || st.transitioning) return;
    const stack = run.items[slot];
    if (!stack) return;
    if (!canUse(stack)) { Sound.deny(); return; }
    const key = stack.key, tier = stack.tier || 0;
    stack.n--;
    if (stack.n <= 0) run.items.splice(slot, 1);
    st.hoverItem = -1; st.selItem = -1;
    const lv = st.lv;
    if (key === 'patch') {
      const before = run.integrity;
      run.integrity = Math.min(run.maxInt, run.integrity + tier + 1);
      Sound.buy(); setMsg(`> patched. +${run.integrity - before} int`, C.cyan);
    }
    if (key === 'wall') {
      if (tier >= 2) { st.corp.wallAll = true; setMsg('> firewall: no hits for this corp.', C.cyan); }
      else { run.shield += tier + 1; setMsg(`> firewall up. FW${run.shield}`, C.cyan); }
      Sound.shield();
    }
    if (key === 'purge') {
      let locked = 0;
      for (let k = 0; k <= tier; k++) {
        let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
        if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
        if (!opts.length) break;
        const r = rngFor(run.seed, 'purge', st.corp.node.id, st.corp.idx, lv.tiles.filter(t => t.state === 'locked').length);
        lockTile(pickR(opts, r), C.cyan, 'purge');
        locked++;
      }
      setMsg(`> purged ${locked} ICE node${locked === 1 ? '' : 's'}.`, C.cyan);
    }
    if (key === 'split') {
      const s = lv.tiles[lv.safe];
      if (tier === 0) {
        const vertical = rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx)() < 0.5;
        for (const t of lv.tiles) {
          const sameHalf = vertical ? (t.col < lv.cols / 2) === (s.col < lv.cols / 2) : (t.row < lv.rows / 2) === (s.row < lv.rows / 2);
          if (!sameHalf) t.ruledOut = true;
        }
        setMsg(`> split: it is in the ${vertical ? (s.col < lv.cols / 2 ? 'left' : 'right') : (s.row < lv.rows / 2 ? 'top' : 'bottom')} half.`, C.cyan);
      } else {
        // rare: rule out 2/3 of the ICE still in play; epic: all but one
        const ice = shuffle(lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.ruledOut), rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx));
        const k = tier >= 2 ? Math.max(0, ice.length - 1) : Math.floor(ice.length * 2 / 3);
        ice.slice(0, k).forEach(t => { t.ruledOut = true; });
        setMsg(`> split: ${k} ICE ruled out.`, C.cyan);
      }
      lv.split = true;
      Sound.shield();
    }
    if (key === 'route') {
      rerouteMap();
      st.mapSel = null;
      st.boardStart = performance.now();
      Sound.whoosh();
      setMsg('> rerouted. the net shifts.', C.cyan);
    }
    if (key === 'warp') {
      const target = pickR(nodesAhead(), rngFor(run.seed, 'warp', run.at, run.depth));
      setMsg('> warp open...', C.cyan);
      enterNode(target, true);
    }
  }

  function toggleMute() {
    save.muted = !save.muted;
    persist();
    Sound.levels();
    Sound.ui();
  }

  function cyclePalette() {
    const keys = playerPalettes();
    save.palette = keys[(keys.indexOf(save.palette) + 1) % keys.length];
    refreshPalette();
    persist();
    Sound.ui();
  }

  // The palette for what's on screen: inside a corp, that corp's own (if corp colors
  // are on); everywhere else, the player's palette from settings.
  function scenePalette(corpKey) {
    const ck = corpKey && save.corpColors ? 'c_' + corpKey : null;
    applyPalette(ck && PALETTES[ck] ? ck : save.palette);
  }
  const refreshPalette = () => scenePalette(st.corp && st.corp.hasBoss ? st.corp.def.key : null);
  const toggleCorpColors = () => { save.corpColors = !save.corpColors; persist(); refreshPalette(); Sound.ui(); };

  // ---------------- Pause menu ----------------
  // [MENU] in the header or Esc during a run. Stops clocks. Abandon goes to the title.
  function togglePause() {
    if (st.dev) return;
    if (!st.pause && (!st.run || st.busy || st.transitioning || st.wipe)) { Sound.deny(); return; }
    st.pause = !st.pause;
    st.abandonArmed = false;
    st.kbFocus = null;
    st.boardStart = performance.now();
    Sound.ui();
  }

  const toggleEffects = () => { save.effects = save.effects === 'full' ? 'reduced' : 'full'; persist(); Sound.ui(); };
  const toggleTapMode = () => { save.tapMode = save.tapMode === 'two' ? 'one' : 'two'; persist(); Sound.ui(); };

  // Audio controls (settings + pause menu): on/off and an 8-step volume bar each.
  const toggleMusic = () => { save.musicOn = !save.musicOn; persist(); Sound.levels(); Sound.ui(); };
  const nudgeVol = (k, d) => { save[k] = clamp(Math.round((save[k] + d) * 8) / 8, 0, 1); persist(); Sound.levels(); Sound.ui(); };
  const volBar = v => '#'.repeat(Math.round(v * 8)) + '-'.repeat(8 - Math.round(v * 8));
  function audioLines(X, prefix) {
    X({ text: `[ music: ${save.musicOn ? 'ON ' : 'OFF'} ]`, id: prefix + 'mus', onTap: toggleMusic });
    X({ gap: 1, row: [
      { text: 'vol' }, { text: '[-]', id: prefix + 'mvd', onTap: () => nudgeVol('musicVol', -1 / 8) },
      { text: volBar(save.musicVol), col: save.musicOn ? C.cyan : C.dim },
      { text: '[+]', id: prefix + 'mvu', onTap: () => nudgeVol('musicVol', 1 / 8) },
    ] });
    X({ text: `[ effects sound: ${save.muted ? 'OFF' : 'ON '} ]`, id: prefix + 'sfx', onTap: toggleMute });
    X({ gap: 1, row: [
      { text: 'vol' }, { text: '[-]', id: prefix + 'svd', onTap: () => nudgeVol('sfxVol', -1 / 8) },
      { text: volBar(save.sfxVol), col: save.muted ? C.dim : C.cyan },
      { text: '[+]', id: prefix + 'svu', onTap: () => nudgeVol('sfxVol', 1 / 8) },
    ] });
  }

  function pauseLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap) => lines.push({ text, id, onTap });
    const run = st.run;
    T('PAUSED', C.cyan);
    T(`layer ${pad2(run.depth)}   corps ${run.corps}   cr ${run.credits}`, C.text);
    T(`seed ${run.seed}${run.practice ? '  (practice)' : ''}`, C.mid);
    T('');
    lines.push({ box: true, text: 'R E S U M E', id: 'resume', onTap: togglePause, minW: 22 });
    T('');
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'ppal', cyclePalette);
    B(`[ corp colors: ${save.corpColors ? 'ON ' : 'OFF'} ]`, 'pccol', toggleCorpColors);
    B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'pfx', toggleEffects);
    B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'ptap', toggleTapMode);
    audioLines(ln => lines.push(ln), 'p_');
    T('');
    B(st.abandonArmed ? '[ TAP AGAIN TO ABANDON ]' : '[ ABANDON RUN ]', 'abandon', abandonRun);
    T(st.abandonArmed ? 'the run ends here.' : 'abandoned runs are not scored.', st.abandonArmed ? C.red : C.dim);
    return lines;
  }

  function abandonRun() {
    if (!st.abandonArmed) { st.abandonArmed = true; Sound.deny(); return; }
    const run = st.run;
    run.ended = true; clearRun();
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win: false, abandoned: true, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();
    st.pause = false; st.abandonArmed = false; st.timer = null;
    swapTo(showTitle);
  }

  // ---------------- Keyboard cursor ----------------
  // Buttons and list rows: move through them in reading order.
  function moveFocus(d) {
    const list = st.focusables;
    if (!list.length) return;
    let i = list.findIndex(f => f.id === st.kbFocus);
    const edge = i >= 0 && ((d > 0 && i === list.length - 1) || (d < 0 && i === 0)) || (i >= 0 && list[i + d] && /^dev(up|dn)$/.test(list[i + d].id));
    if (st.dev && st.devScroll && edge && st.devScroll(d)) return;
    i = i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length;
    st.kbFocus = list[i].id;
    st.hoverBtn = st.kbFocus;
    Sound.tick();
  }

  // Grid: jump to the nearest open tile in the arrow's direction.
  function moveTileCursor(k) {
    const lv = st.lv;
    if (st.busy) return;
    const open = lv.tiles.map((t, i) => [t, i]).filter(([t]) => t.state === 'closed');
    if (!open.length) return;
    st.kbGrid = true;
    const cur = lv.tiles[st.hover];
    if (!cur || cur.state !== 'closed') {
      // Start at the tile nearest the middle of the grid.
      const mx = (lv.cols - 1) / 2, my = (lv.rows - 1) / 2;
      open.sort((a, b) => Math.hypot(a[0].col - mx, a[0].row - my) - Math.hypot(b[0].col - mx, b[0].row - my));
      st.hover = open[0][1];
      Sound.tick();
      return;
    }
    const [dx, dy] = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[k];
    let best = -1, bestScore = Infinity;
    for (const [t, i] of open) {
      if (t === cur) continue;
      const vx = t.col - cur.col, vy = t.row - cur.row;
      const along = vx * dx + vy * dy;
      if (along <= 0) continue;
      const score = along + Math.abs(vx * dy - vy * dx) * 2;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) { st.hover = best; Sound.tick(); }
    if (st.mp && lv.tiles[st.hover]) { const { tx, ty } = tileOrigin(lv.tiles[st.hover]); mpSendCursor(tx + 3, ty + 2); }
  }

  // Map: step through the nodes you can pick next.
  function moveMapCursor(k) {
    const run = st.run;
    const avail = availableNodes().slice().sort((a, b) => run.map[a].lane - run.map[b].lane);
    if (!avail.length) return;
    const mv = st.mapView;
    if (mv && mv.sector !== run.sector) { mv.sector = run.sector; mv.target = sectorViewRow(run.sector); }   // back to where you are
    const d = k === 'arrowleft' || k === 'arrowup' ? -1 : 1;
    const i = avail.indexOf(st.mapSel);
    st.mapSel = avail[i < 0 ? 0 : (i + d + avail.length) % avail.length];
    Sound.ui();
  }

  // ---------------- Dev menu ----------------
  // Open with ` (backtick), or the [DEV] button in the footer when the URL has ?dev=1.
  // Using cheats on a run marks it as practice, so it doesn't count.
  function toggleDev() {
    if (st.transitioning || st.wipe) return;
    st.dev = !st.dev;
    st.devPage = null;     // always open on the main page; closing ends any music preview
    st.preview = null;
    st.devTop = 0; st.devScroll = null;
    st.devAccess = true;
    st.boardStart = performance.now();
    Sound.ui();
  }

  function cheat(fn) {
    return () => {
      if (st.run) st.run.practice = true;
      fn();
      Sound.buy();
    };
  }

  // Jump straight to a corp's boss layer.
  function jumpToBoss(node) {
    const run = st.run;
    st.dev = false;
    if (st.mode === 'play' && st.corp && st.corp.hasBoss && !st.lv.boss) {
      st.corp.idx = st.corp.counts.length - 1;
      enterLayer();
      return;
    }
    if (!node) return;
    run.practice = true;
    if (run.at !== node.id) { run.at = node.id; run.visited.push(node.id); }
    startCorp(node, 99);
  }

  // Dev music player: preview every track and push it through its intensity levels,
  // the way the game does as you go deeper.
  const LEVEL_LABELS = ['pad + bass', '+ drums', '+ arp', '+ lead', 'final boss'];
  function trackLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap) => lines.push({ text, id, onTap });
    const p = st.preview;
    const keys = Object.keys(SONGS);
    const usedBy = k => Object.keys(MUSIC_FOR).filter(place => MUSIC_FOR[place] === k).join(', ') || 'unused';
    const set = patch => { Object.assign(p, patch); Sound.tick(); };
    T('MUSIC PLAYER', C.cyan);
    T('tap a track to play it.', C.dim);
    T('');
    const rows = 8, n = keys.length;
    p.top = clamp(p.top || 0, 0, maxTop(n, rows));
    const w = listWindow(p.top, n, rows);
    let used = 0;
    if (w.hasUp) { lines.push({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', invert: true, id: 'trup', onTap: () => { p.top = nextTop(p.top, -1, maxTop(n, rows)); Sound.tick(); } }); used++; }
    for (let i = p.top; i < p.top + w.shown; i++) {
      const k = keys[i];
      lines.push({ list: true, id: 'tr_' + k, sel: k === p.key, name: SONGS[k].name, col: k === p.key && p.playing ? C.cyan : C.bright,
        right: usedBy(k), rightCol: C.mid, onTap: () => set({ key: k, playing: true }) });
      used++;
    }
    if (w.hasDown) { lines.push({ text: '[ v v v  more  v v v ]', invert: true, id: 'trdn', onTap: () => { p.top = nextTop(p.top, 1, maxTop(n, rows)); Sound.tick(); } }); used++; }
    for (; used < rows; used++) T('');
    T(SEP, C.dim);
    const tr = SONGS[p.key];
    T(`${tr.name}  ${tr.bpm} bpm  ${NOTE_NAMES[tr.root % 12]} ${tr.scale}`, p.playing ? C.cyan : C.text);
    if (tr.style === 'ambient') T('ambient: no levels or drums', C.dim);
    else lines.push({ gap: 1, row: [
      { text: 'level' }, { text: '[-]', id: 'trlvd', onTap: () => set({ level: Math.max(0, p.level - 1) }) },
      { text: `${p.level} ${LEVEL_LABELS[p.level]}`.padEnd(12), col: C.bright },
      { text: '[+]', id: 'trlvu', onTap: () => set({ level: Math.min(4, p.level + 1) }) },
    ] });
    const ub = Math.round(p.urgency * 8);
    lines.push({ gap: 1, row: [
