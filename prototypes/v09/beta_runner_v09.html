  // Center each logo by its visible art: drop the blank columns every row shares.
  for (const k of Object.keys(CORP_ART)) {
    const rows = CORP_ART[k];
    const lead = Math.min(...rows.filter(l => l.trim()).map(l => l.length - l.trimStart().length));
    CORP_ART[k] = rows.map(l => l.slice(lead).trimEnd());
  }

  // Corp numbers by tier: deeper corps get harder versions.
  function corpTimer(def, tier) { return def.timer ? def.timer - (def.key === 'chronos' && tier >= 2 ? 2 : 0) : 0; }
  function corpPay(def, tier) { return (def.pay || 1) + (def.key === 'chronos' && tier >= 2 ? 0.2 : 0); }
  function corpRules(def, tier) {
    if (def.rules) return def.rules(tier);
    if (def.key === 'chronos') return `${corpTimer(def, tier)}s clock per pick. pays x${corpPay(def, tier).toFixed(1)}`;
    if (def.key === 'omni') return '12s clock. tell unknown. pays x2';   // (a copying OMNI has its own rules)
    return '';
  }

  for (const k of Object.keys(MODS)) MODS[k].key = k;

  // ---- Trigger order. Every mod fires in one stage, and a pick runs the stages in this
  // order, each one to the end before the next:
  //   START  a layer opens           PICK  you tap, before the reveal
  //   BLOCK  ICE: does it hurt?      HIT   after the hit (info, loot)
  //   BOARD  changes to the grid     END   the layer is done
  // Inside a stage, mods fire left to right on the mod bar, and corp twists go after your
  // mods (the corp moves last, so your info is about the board you'll actually see).
  // BLOCK is the exception: a fixed order (see blockHit) so nothing gets wasted.
  // TAP, CLOCK and ALWAYS aren't part of a pick: you fire them, the clock does, or they
  // just change numbers and rules.
  const STAGES = {
    start:  { label: 'LAYER START', order: 1, desc: 'a layer opens' },
    pick:   { label: 'ON PICK',     order: 2, desc: 'tap, before reveal' },
    block:  { label: 'BLOCK',       order: 3, desc: 'does the ICE hurt?' },
    hit:    { label: 'ON HIT',      order: 4, desc: 'info and loot' },
    board:  { label: 'BOARD',       order: 5, desc: 'the grid changes' },
    end:    { label: 'LAYER END',   order: 6, desc: 'the layer is done' },
    tap:    { label: 'TAP TO USE' },
    clock:  { label: 'ON THE CLOCK' },
    always: { label: 'ALWAYS ON' },
  };
  const MOD_STAGE = {
    sniffer: 'start', corners: 'start', sigscan: 'start', afterimage: 'start', basictraining: 'start', runway: 'start',
    forecast: 'start', spellbound: 'start', seedreader: 'start', photographic: 'start',
    prism: 'hit', fourinarow: 'end',
    queuenumber: 'hit', rollup: 'tap', blast: 'tap', interrogate: 'tap', turing: 'hit',
    handshake: 'start', callerid: 'hit', snipe: 'start', omerta: 'block', sacrifice: 'tap', letitride: 'end', remote: 'tap', chancecard: 'start',
    icebox: 'block', greenwave: 'block', leadlining: 'block', express: 'end', scoop: 'start', cctv: 'start', compost: 'hit', foghorn: 'hit',
    grounded: 'block', friendship: 'block', jackbox: 'start', triage: 'end', honeycomb: 'end', pixelpeep: 'hit', espresso: 'tap', freezeframe: 'tap',
    horoscope: 'block', index: 'hit', policy: 'hit', pickset: 'hit', pencil: 'hit', unravel: 'board', ezpass: 'end',
    xaxis: 'pick', yaxis: 'pick',
    bulwark: 'block', forgery: 'block', shatter: 'block', failsafe: 'block',
    tracer: 'hit', keylogger: 'hit',
    virus: 'board', autocomplete: 'board', twinlock: 'board',
    skipjack: 'end', interest: 'end',
    burner: 'tap', overclock: 'clock',
    anchor: 'tap', infrared: 'start', ambush: 'block', antigrav: 'board',
    timewarp: 'tap', inversion: 'block', lastbyte: 'hit', precog: 'start',
    dejavu: 'start', spoiler: 'start', linkup: 'board',
  };
  for (const k of Object.keys(MODS)) MODS[k].stage = MOD_STAGE[k] || 'always';
  // Your mods that fire in a stage, left to right on the bar.
  const modsAt = stage => st.run ? st.run.mods.map(k => k === 'mutate' ? st.run.mutateAs : k).filter(k => k && MODS[k] && MODS[k].stage === stage) : [];
  const modsOfKind = (...kinds) => Object.keys(MODS).filter(k => kinds.includes(MODS[k].kind));
  function modWhere(m) {
    if (m.kind === 'corp') return `from: ${corpDef(m.corp).name} boss.`;
    if (m.kind === 'minor') return 'from: start, safehouse, cache, shop.';
    return 'from: bosses, caches, market.';
  }

  // ---- Tiers. Mods and items with `tiers` come in up to 3 steps (COMMON, RARE, EPIC, or
  // levels). Finds roll a tier; finding a mod you have upgrades it (see addMod).
  const MOD_SLOTS = 6;                   // mods you can hold; more means swapping one out
  const TIER_ODDS = [0.70, 0.95];        // a find is COMMON under 0.70, RARE under 0.95, else EPIC
  const TIER_PRICE = [1, 1.6, 2.5];      // market price by tier
  const STACK_MAX = 15;                  // items stack up to F (counts are hex)
  const tierCount = def => def.tiers ? def.tiers.length : 1;
  // A mod / item as it is at a tier (its rarity, tip and text for that step).
  const tierView = (def, tier = 0) => def.tiers ? Object.assign({}, def, def.tiers[clamp(tier, 0, def.tiers.length - 1)], { tier: clamp(tier, 0, def.tiers.length - 1) }) : Object.assign({}, def, { tier: 0 });
  const modView = (key, tier) => tierView(MODS[key], tier == null ? modTier(key) : tier);
  const itemView = (key, tier = 0) => tierView(ITEMS[key], tier);
  const modTier = key => (st.run && st.run.modTier && st.run.modTier[key]) || 0;
  const tv = (key, values) => values[clamp(modTier(key), 0, values.length - 1)];   // a value by your tier
  const tierLabel = v => v.lvlTag ? `LV${v.tier + 1}` : RARITY[v.rarity].label;
  function rollTier(r, def) {
    if (!def.tiers) return 0;
    const u = r();
    return Math.min(def.tiers.length - 1, u < TIER_ODDS[0] ? 0 : u < TIER_ODDS[1] ? 1 : 2);
  }
  // What owning `key` becomes if you take it at `tier`: at or below yours = up one step,
  // above yours = jump to it. Never past the top.
  function upgradeTo(key, tier) {
    if (!has(key)) return tier;
    const cur = modTier(key), max = tierCount(MODS[key]) - 1;
    return tier <= cur ? Math.min(cur + 1, max) : tier;
  }
  const modMaxed = key => has(key) && modTier(key) >= tierCount(MODS[key]) - 1;

  // ---------------- Layers ----------------
  function gridFor(n) {
    let cols = 4, rows = 4;
    while (n > Math.floor(cols * rows * 0.75)) {
      if (rows <= cols) rows++; else cols++;
    }
    return { cols, rows };
  }

  function tellCells(tell, cols, rows, prevSafe) {
    const all = [];
    for (let i = 0; i < cols * rows; i++) all.push(i);
    const colOf = i => i % cols, rowOf = i => Math.floor(i / cols);
    if (tell === 'corner') return [0, cols - 1, (rows - 1) * cols, rows * cols - 1];
    if (tell === 'edge') return all.filter(i => colOf(i) === 0 || colOf(i) === cols - 1 || rowOf(i) === 0 || rowOf(i) === rows - 1);
    if (tell === 'center') return all.filter(i => colOf(i) > 0 && colOf(i) < cols - 1 && rowOf(i) > 0 && rowOf(i) < rows - 1);
    if ((tell === 'mirror' || tell === 'vmirror' || tell === 'point') && prevSafe) {
      const col = tell === 'vmirror' ? prevSafe.col : cols - 1 - prevSafe.col;
      const row = tell === 'mirror' ? prevSafe.row : rows - 1 - prevSafe.row;
      if (col >= 0 && col < cols && row >= 0 && row < rows) return [row * cols + col];
    }
    return null;
  }

  // Sigil signature for one tile. level 1: one glyph for the whole visit.
  // level 2: always an X shape, one random character per tile (e.g. all #, all %).
  // level 3: always 'x' characters, random arrangement per tile.
  function signedGlyph(mark, r) {
    if (mark.level === 1) return mark.glyph;
    if (mark.level === 2) { const ch = pickR(MARK_CHARS, r); return X_SHAPE.map(l => l.replace(/[^ ]/g, ch)); }
    const cells = [];
    for (let i = 0; i < 15; i++) cells.push(i);
    const on = new Set(shuffle(cells, r).slice(0, 3 + Math.floor(r() * 3)));
    const out = [];
    for (let row = 0; row < 3; row++) {
      let s = '';
      for (let col = 0; col < 5; col++) s += on.has(row * 5 + col) ? (r() < 0.5 ? 'x' : 'X') : ' ';
      out.push(s);
    }
    return out;
  }

  // ctx: { seed, nodeId, idx, n, tell, prevSafe, loot, mark }
  function genLayer(ctx) {
    const { seed, nodeId, idx, n, tell, prevSafe, loot, mark, salt } = ctx;
    // salt: after a resumed save, layers come out different (no replaying a layer you saw)
    const r = salt ? rngFor(seed, 'layer', nodeId, idx, 'r' + salt) : rngFor(seed, 'layer', nodeId, idx);
    const { cols, rows } = gridFor(n);
    const cells = [];
    for (let i = 0; i < cols * rows; i++) cells.push(i);
    shuffle(cells, r);
    const tiles = cells.slice(0, n).map(cell => ({
      cell, col: cell % cols, row: Math.floor(cell / cols),
      glyph: null, safe: false, loaded: false, marked: false, ruledOut: false,
      state: 'closed', hidden: false, probing: false, dist: null,
    }));
    const setCell = (t, cell) => { t.cell = cell; t.col = cell % cols; t.row = Math.floor(cell / cols); };

    // Pick the safe tile, following the position tell most of the time.
    let safe = tiles[Math.floor(r() * n)];
    const follow = r() < (ctx.tellStr != null ? ctx.tellStr : CONFIG.tellStrength);
    const targets = n > 1 ? tellCells(tell, cols, rows, prevSafe) : null;
    if (targets && follow) {
      let cand = tiles.filter(t => targets.includes(t.cell));
      if (!cand.length) {
        const used = new Set(tiles.map(t => t.cell));
        const free = targets.filter(c => !used.has(c));
        if (free.length) { const t = pickR(tiles, r); setCell(t, pickR(free, r)); cand = [t]; }
      }
      if (cand.length) safe = pickR(cand, r);
    }
    safe.safe = true;

    // Glyphs. A mark tell puts the signature on the safe tile and some decoys.
    const isMark = tell === 'mark' && mark;
    const pool = MOTIFS.filter(m => {
      if (!isMark) return true;
      if (mark.level === 1) return m.join('|') !== mark.glyph.join('|');
      if (mark.level === 2) return shapeOf(m) !== X_MASK;
      return !/[xX]/.test(m.join(''));
    });
    const deck = shuffle(pool.slice(), r);                         // no two nodes share a glyph
    tiles.forEach((t, i) => { t.glyph = deck[i % deck.length]; });
    if (isMark && n > 1) {
      const others = shuffle(tiles.filter(t => !t.safe), r);
      const k = Math.min(others.length, Math.max(1, Math.round((n - 1) * CONFIG.markDecoyFrac)));
      for (const t of [safe, ...others.slice(0, k)]) { t.marked = true; t.glyph = signedGlyph(mark, r); }
    }
    if (n === 1) tiles[0].glyph = JACK_GLYPH;

    // Loaded ICE: a known trap that drops loot when hit.
    if (loot && n >= (ctx.lootMore ? 3 : 4) && r() < (ctx.lootMore ? 0.85 : CONFIG.lootChance)) {
      const opts = tiles.filter(t => !t.safe && !t.marked);
      if (opts.length) { const t = pickR(opts, r); t.loaded = true; t.glyph = LOOT_GLYPH; }
    }

    // Corp kit: the corp dresses the nodes ($ nodes stay as they are). The tell goes on the
    // real node, or on a random node when this layer doesn't follow the tell.
    const lv = { n, cols, rows, tiles };
    if (ctx.dress && n > 1) {
      const dressable = tiles.filter(t => !t.loaded);
      const tellTile = follow || ctx.alwaysFollow ? safe : pickR(dressable, r);
      ctx.dress(lv, { r, follow, real: safe, tellTile, tiles: dressable, tier: ctx.tier || 1, boss: !!ctx.boss, idx,
        carry: ctx.carry || null, corpR: rngFor(seed, 'corp', nodeId), seed });
    }

    tiles.sort((a, b) => a.cell - b.cell);
    return Object.assign(lv, { safe: tiles.findIndex(t => t.safe), safeCell: { col: safe.col, row: safe.row } });
  }

  // ---------------- Overworld map ----------------
  // The map is made of sectors stacked upward. Each sector has 6 steps: its start (the
  // public net, or the last sector's beaten OMNI), 4 steps of 3 lanes, and its own OMNI
  // at the top. Steps are counted across the whole run, so node ids (`step:lane`) stay
  // unique: sector s runs from step 5s to 5s + 5.
  const MAP_STEPS = 6;
  const SECTOR_STEPS = MAP_STEPS - 1;
  const SIDE_LINK = 0.25;      // chance of a sideways link between two neighbors in a step
  const sectorOf = step => Math.max(0, Math.ceil(step / SECTOR_STEPS) - 1);   // a sector's top (its OMNI) belongs to it
  const localStep = n => n.step - SECTOR_STEPS * (n.sector || 0);
  // Corp tier by sector and step: +1 tier each sector.
  const tierAt = (sector, ls) => (ls <= 2 ? 1 : 2) + sector;
  // Corp modifiers: a tag rolled onto a corp node on the map (none in sector 1, then 10% and
  // +5% a sector). They change how any corp plays. tag: the mark next to the node on the map.
  const CORP_MODS = {
    cursed:  { name: 'CURSED',  tag: '!', desc: 'no perfect heals here.' },
    rush:    { name: 'RUSH',    tag: '>', desc: 'every layer has a 10s clock.' },
    loaded:  { name: 'LOADED',  tag: '$', desc: 'more $ nodes. pays x1.2' },
    branded: { name: 'BRANDED', tag: 's', desc: 'some ICE wear a sigil.' },
    thief:   { name: 'THIEF',   tag: '&', desc: 'hits steal mods. beat boss.' },
    armored: { name: 'ARMORED', tag: '#', desc: 'hits point at the real.' },
    rival:   { name: 'RIVAL',   tag: 'V', desc: 'a rival races you for it.' },
  };
  const corpModChance = s => s === 0 ? 0 : Math.min(0.4, 0.1 + 0.05 * (s - 1));
  // Corp levels: each step has a target level (sector + 1 early in a sector, + 2 late,
  // up to 5). Corps at the target come up most, easier ones now and then (breathers),
  // one level above rarely, higher never.
  const targetLevel = (sector, ls) => Math.min(5, sector + (ls <= 2 ? 1 : 2));
  function levelWeight(level, target) {
    const d = (level || 1) - target;
    return d === 0 ? 3 : d === -1 ? 2 : d < -1 ? 1 : d === 1 ? 0.25 : 0;
  }
  // Test seeds (for trying corps): a corp's name (SEEKR, HAUTECOUTURE, LEDGERTRUST2...) makes
  // every node on the map that corp; DEV1 lays out every corp in level order, 3 per step.
  const corpsByLevel = () => Object.keys(CORPS).sort((a, b) => (CORPS[a].level || 1) - (CORPS[b].level || 1) || a.localeCompare(b));
  function testSeed(seed) {
    const s = cleanSeed(seed);
    if (/^DEV1/.test(s)) return 'all';
    const base = s.replace(/\d+$/, '');
    return Object.keys(CORPS).find(k => k.toUpperCase() === base || cleanSeed(CORPS[k].name) === base) || null;
  }
  // k different corps for one step, weighted by level.
  function pickCorps(r, target, k) {
    let pool = Object.keys(CORPS).map(key => ({ key, w: levelWeight(CORPS[key].level, target) })).filter(o => o.w > 0);
    const out = [];
    while (out.length < k) {
      if (!pool.length) pool = Object.keys(CORPS).filter(key => !out.includes(key)).map(key => ({ key, w: 1 }));   // too few: widen
      if (!pool.length) { out.push(pickR(Object.keys(CORPS), r)); continue; }
      let u = r() * pool.reduce((t, o) => t + o.w, 0), i = 0;
      while (u >= pool[i].w && i < pool.length - 1) { u -= pool[i].w; i++; }
      out.push(pool[i].key); pool.splice(i, 1);
    }
    return out;
  }

  function genMap(seed) {
    const nodes = {};
    nodes['0:1'] = { id: '0:1', step: 0, lane: 1, sector: 0, type: 'start', corp: 'public', tier: 0, next: [] };
    addSector(nodes, seed, 0);
    return nodes;
  }

  // Add sector s on top of the map (its start node must already be there).
  function addSector(nodes, seed, s) {
    const r = s === 0 ? rngFor(seed, 'map') : rngFor(seed, 'map', s);
    const side = rngFor(seed, 'side', s);
    const base = SECTOR_STEPS * s;
    const add = (step, lane, type, extra = {}) => {
      const id = `${step}:${lane}`;
      nodes[id] = Object.assign({ id, step, lane, sector: s, type, next: [] }, extra);
    };
    const specs = [
      null,
      // a new sector opens with something good
      s === 0 ? ['corp', 'corp', 'corp'] : ['corp', 'corp', r() < 0.5 ? 'shop' : 'repair'],
      ['corp', 'corp', r() < 0.5 ? 'cache' : 'repair'],
      ['corp', 'corp', 'shop'],
      ['corp', 'corp', r() < 0.5 ? 'cache' : 'repair'],
    ];
    const test = testSeed(seed), order = corpsByLevel();
    for (let ls = 1; ls <= 4; ls++) {
      const types = test ? ['corp', 'corp', 'corp'] : shuffle(specs[ls].slice(), r);
      const corps = test === 'all' ? [0, 1, 2].map(j => order[(s * 12 + (ls - 1) * 3 + j) % order.length])
        : test ? [test, test, test] : pickCorps(r, targetLevel(s, ls), 3);
      const mr = rngFor(seed, 'cmod', s, ls);
      types.forEach((type, lane) => {
        const mod = type === 'corp' && !test && mr() < corpModChance(s) ? pickR(Object.keys(CORP_MODS), mr) : null;
        add(base + ls, lane, type, type === 'corp' ? Object.assign({ corp: corps[lane], tier: tierAt(s, ls) }, mod ? { mod } : {}) : {});
      });
    }
    // The sector boss: OMNI in sector 1. After that, a third of the time OMNI, and otherwise a
    // LV4-5 corp with a modifier stacked on top.
    const fr = rngFor(seed, 'stageboss', s);
    if (s === 0 || test || fr() < 1 / 3) add(base + 5, 1, 'final', { corp: 'omni', tier: 3 + s });
    else {
      const hard = Object.keys(CORPS).filter(k => (CORPS[k].level || 1) >= 4).sort();
      add(base + 5, 1, 'final', { corp: pickR(hard, fr), tier: 3 + s, mod: pickR(Object.keys(CORP_MODS).sort(), fr) });
    }
    const start = nodes[`${base}:1`];
    for (let lane = 0; lane < 3; lane++) start.next.push(`${base + 1}:${lane}`);
    for (let ls = 1; ls <= 3; ls++) {
      for (let lane = 0; lane < 3; lane++) {
        const n = nodes[`${base + ls}:${lane}`];
        n.next.push(`${base + ls + 1}:${lane}`);
        for (const d of [-1, 1]) if (lane + d >= 0 && lane + d < 3 && r() < 0.45) n.next.push(`${base + ls + 1}:${lane + d}`);
      }
    }
    for (let lane = 0; lane < 3; lane++) nodes[`${base + 4}:${lane}`].next.push(`${base + 5}:1`);
    // Sideways links (both ways) between neighbors in a step. Visited nodes can't be
    // entered again, so a sideways link just lets you take one more stop in that step.
    for (let ls = 1; ls <= 4; ls++) {
      for (const lane of [0, 1]) {
        if (side() >= SIDE_LINK) continue;
        const a = nodes[`${base + ls}:${lane}`], b = nodes[`${base + ls}:${lane + 1}`];
        a.next.push(b.id); b.next.push(a.id);
      }
    }
    return nodes;
  }
  const mapTop = map => Math.max(...Object.values(map).map(n => n.step));
  const nodeLetter = n => n.type === 'shop' ? '$' : n.type === 'cache' ? '?' : n.type === 'repair' ? '+' : corpDef(n.corp).letter;

  // ---------------- Save data ----------------
  const freshSave = () => ({
    format: SAVE_FORMAT, best: 0, runs: 0, wins: 0, history: [], seen: {},
    muted: false, palette: 'default', effects: 'full', tapMode: 'two', corpColors: true,
    musicOn: true, musicVol: 0.6, sfxVol: 0.8,
    corpStats: {},          // per corp: { breached, lost }
    rep: 0, repTotal: 0, legacy: {}, cashouts: 0, bestSector: 0,   // legacy (THE BOARD)
  });
  const save = (() => {
    const d = freshSave();
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (raw && raw.format === SAVE_FORMAT) Object.assign(d, raw);
    } catch (e) { /* storage unavailable */ }
    return d;
  })();
  const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } };
  // Per-corp record for the codex.
  function corpStat(key) {
    if (!save.corpStats[key]) save.corpStats[key] = { breached: 0, lost: 0 };
    return save.corpStats[key];
  }
  function markSeen(key) {
    if (!key || save.seen[key]) return;
    save.seen[key] = true;
    persist();
  }

  // ---------------- Legacy (REP) ----------------
  // REP is banked by cashing out after a sector clear. Dying gives none (unless DEAD
  // MAN'S SWITCH). It's spent on THE BOARD (from the title) on unlocks that last.
  const LEGACY = [
    { key: 'hard',  name: 'HARDENED',   desc: '+1 starting integrity.',          costs: [40, 100] },
    { key: 'cash',  name: 'SEED MONEY', desc: 'start with +25cr.',               costs: [20, 40, 80] },
    { key: 'kit',   name: 'FIELD KIT',  desc: 'start with a PATCH.',             costs: [50] },
    { key: 'belt',  name: 'WIDE BELT',  desc: '+1 item slot.',                   costs: [120] },
    { key: 'picky', name: 'SHORTLIST',  desc: 'the starter perk offers 4 mods.', costs: [60] },
    { key: 'dms',   name: 'DEADMAN',    desc: 'dying keeps 25% of the REP you would have banked.', costs: [80, 200],
      levels: ['dying keeps 25% of the REP you would have banked.', 'dying keeps 50% of the REP you would have banked.'] },
  ];
  const legacyLv = key => (save.legacy && save.legacy[key]) || 0;
  // What a run is worth in REP right now.
  function repFor(run) {
    return run.depth + 3 * run.corps + (run.perfects || 0) + Math.floor(run.earned / 40) + 10 * (run.sectorsCleared || 0);
  }

  // ---------------- Run save (resume) ----------------
  // The run is saved as you go (map, every layer, every hit), so a reload or a closed
  // tab picks it up again. A layer you were in comes back as a fresh layer.
  const RUN_KEY = STORE_KEY + '.run';
  function runSnapshot() {
    const run = st.run;
    if (!run || run.ended || st.mp || st.dying || run.integrity <= 0) return null;
    const c = st.corp;
    const corp = c && c.node ? {
      node: c.node.id, idx: c.idx, prevSafe: c.prevSafe, bulwarkUsed: !!c.bulwarkUsed, burnerUsed: !!c.burnerUsed,
      wallAll: !!c.wallAll, ice: c.ice || 0, perfects: c.perfects || 0, scored: c.scored || 0,
      carry: c.carry || null, pins: c.pins || 0, friendUsed: !!c.friendUsed, tapUsed: c.tapUsed || null, rad: c.rad || 0, ride: c.ride || 0, petIdx: c.petIdx, tickets: c.tickets || 0, stolen: c.stolen || null, rival: c.rival || null,
    } : null;
    // inside a layer, depth is saved as it was when the layer started (it comes back fresh)
    const r = c && st.lv && c.depthAt != null ? Object.assign({}, run, { depth: c.depthAt }) : run;
    return { v: VERSION, run: r, corp: corp && corp.idx < (c.counts ? c.counts.length : 99) ? corp : null, pending: run.pending || null };
  }
  function saveRun() {
    const snap = runSnapshot();
    if (!snap) return;
    try { localStorage.setItem(RUN_KEY, JSON.stringify(snap)); } catch (e) { /* storage unavailable */ }
  }
  function clearRun() { try { localStorage.removeItem(RUN_KEY); } catch (e) { /* ignore */ } }
  function savedRun() {
    try {
      const d = JSON.parse(localStorage.getItem(RUN_KEY) || 'null');
      return d && d.run && d.run.map && d.run.integrity > 0 ? d : null;
    } catch (e) { return null; }
  }

  // ---------------- Sound ----------------
  // Everything is synthesized with Web Audio. Two buses: effects and music,
  // each with its own on/off and volume.
  const Sound = (() => {
    let ac = null, sfxBus = null, noiseBuf = null;
    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        sfxBus = ac.createGain(); sfxBus.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        Music.init(ac, ac.destination, noiseBuf);
        levels();
      } catch (e) { ac = null; }
    }
    // Apply the volume settings to both buses.
    function levels() {
      if (!ac) return;
      sfxBus.gain.setTargetAtTime(save.muted ? 0 : 0.16 * save.sfxVol, ac.currentTime, 0.02);
      Music.volume();
    }
    function tone(freq, dur, { type = 'square', vol = 1, slide = 0, delay = 0 } = {}) {
      if (!ac || save.muted) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(sfxBus);
      o.start(t); o.stop(t + dur + 0.02);
    }
    // Filtered noise; `to` sweeps the filter (for risers).
    function noise(dur, { vol = 0.5, freq = 1000, to = 0, delay = 0, type = 'bandpass' } = {}) {
      if (!ac || save.muted) return;

      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(300, t);

      f.frequency.exponentialRampToValueAtTime(1500, t + Math.max(0.1, dur * 0.6));
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
      g.gain.setValueAtTime(vol, t + Math.max(0.04, dur - 0.08));

      deny: () => tone(160, 0.12, { type: 'square', vol: 0.3 }),

      probe: () => { tone(520, 0.05, { vol: 0.3 }); tone(780, 0.05, { vol: 0.25, delay: 0.09 }); tone(640, 0.05, { vol: 0.25, delay: 0.18 }); },

      safe: () => arp([523, 784, 1046], 0.07, { vol: 0.55 }),

      // Offer pops, scaled by rarity level (0 common .. 4 boss). All bright; no low buzz.
      pop: (lvl, step = 0) => {
        if (lvl >= 3) return Sound.bigPop(lvl, step);
        if (lvl <= 0) return tone(900, 0.03, { vol: 0.2 });
        if (lvl === 1) return arp([700, 1050], 0.05, { vol: 0.3 });
        if (lvl === 2) { arp([600, 900, 1200], 0.05, { vol: 0.35 }); noise(0.12, { vol: 0.2, freq: 4000 }); return; }
        if (lvl === 3) { arp([784, 988, 1175, 1568, 1976], 0.04, { vol: 0.35 }); noise(0.4, { vol: 0.22, freq: 7000 }); return; }
        // BOSS: major chord stab, a quick fanfare up, a held high note and some sparkle.
        chord([523, 659, 784], 0.35, { type: 'triangle', vol: 0.3 });
        chord([523, 784], 0.2, { type: 'square', vol: 0.1 });
        arp([523, 659, 784, 1046], 0.07, { vol: 0.35, delay: 0.08 });

      victory: () => {

  })();

      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function kick(t, vol = 0.7) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(songG);   // the kick skips the pump so it stays punchy
      o.start(t); o.stop(t + 0.32);
    }
    // Duck the music right after the kick: the classic synthwave pumping.
    function duck(t, spb) {
      pump.gain.cancelScheduledValues(t);
      pump.gain.setValueAtTime(0.45, t);
      pump.gain.linearRampToValueAtTime(1, t + spb * 3);
    }

    // Ambient songs (the menu track): pads, a brass swell, bells. No drums or pumping.
    function ambientStep(i, t, spb) {
      const sc = SCALES[song.scale];
      const bar = Math.floor(i / 16) % song.prog.length, k = i % 16;
      const deg = song.prog[bar];
      const note = (d, oct = 0) => song.root + sc[((d % 7) + 7) % 7] + 12 * (Math.floor(d / 7) + oct);
      const chordN = [note(deg), note(deg + 2), note(deg + 4)];
      const barLen = spb * 16;
      if (k === 0) {
        // Wide, slow pad: three detuned saws per note, fading in and out across the bar.
        for (const n of chordN) for (const det of [-14, 0, 14]) voice('sawtooth', mtof(n + 12), t, barLen + 1.2, { vol: 0.018, cut: 900, attack: 1.4, release: 1.4, detune: det });
        voice('sine', mtof(note(deg) - 12), t, barLen + 1, { vol: 0.07, cut: 300, attack: 0.8, release: 1 });
        // Every other bar: a low, brassy swell (root + fifth).
        if (bar % 2 === 0) for (const n of [note(deg) + 12, note(deg + 4) + 12]) voice('sawtooth', mtof(n - 12), t, barLen * 1.6, { vol: 0.03, cut: 1300, q: 2, attack: 1.8, release: 1.6, detune: 6 });
      }
      // Sparse bell notes that ring out into the echo.
      const bells = { 0: 2, 6: 1, 10: 0, 13: 2 };
      if (k in bells && (k !== 13 || bar % 2 === 1)) {
        const n = chordN[bells[k]] + 24;
        voice('triangle', mtof(n), t, 2.4, { vol: 0.045, cut: 5000, attack: 0.005, release: 2.2, send: 0.85, pan: (k % 4 === 2) ? 0.4 : -0.3 });
        voice('sine', mtof(n + 12), t, 1.2, { vol: 0.015, cut: 6000, attack: 0.005, release: 1.1 });
      }
    }

    function playStep(i, t, spb, s) {
      if (song.style === 'ambient') return ambientStep(i, t, spb);
      const sc = SCALES[song.scale];
      const bar = Math.floor(i / 16) % song.prog.length, k = i % 16;
      const deg = song.prog[bar];
      const note = (d, oct = 0) => song.root + sc[((d % 7) + 7) % 7] + 12 * (Math.floor(d / 7) + oct);
      const chordN = [note(deg), note(deg + 2), note(deg + 4)];
      const lvl = s.level, u = s.urgency;
      const cut = 500 + lvl * 450 + u * 2400;

      // Pad: a held, detuned chord each bar.
      if (k === 0) for (const n of chordN) for (const det of [-9, 9]) voice('sawtooth', mtof(n + 12), t, spb * 16, { vol: 0.03, cut: cut * 0.8, attack: 0.25, release: 0.3, detune: det });
      // Bass
      if (BASS_STEPS[song.bass].includes(k)) {
        voice('sawtooth', mtof(note(deg)), t, spb * 1.7, { vol: 0.15, cut: 260 + cut * 0.25, q: 6, sweep: true });
        voice('sine', mtof(note(deg)), t, spb * 1.7, { vol: 0.1, cut: 400 });
      }
      // Drums
      if (lvl >= 1) {
        const d = DRUMS[song.drums];
        if (d.kick.includes(k)) { kick(t); duck(t, spb); }
        if (d.snare.includes(k) || (d.roll && bar === song.prog.length - 1 && d.roll.includes(k))) {
          hit(0.22, { vol: 0.28, freq: 1800, t });
          hit(0.35, { vol: 0.08, freq: 4000, type: 'lowpass', t });   // a little gated-reverb tail
        }
        const fast = song.tick ? u > 0.45 : lvl >= 3;
        if (d.hat.includes(k) || (fast && k % 2 === 1)) hit(0.04, { vol: song.tick ? 0.12 : 0.07, freq: 7000, type: 'highpass', t });
      } else if (k % 4 === 0) duck(t, spb);
      // Arp
      if (lvl >= 2) {
        const tones = [...chordN, ...chordN.map(n => n + 12)].map(n => n + 12);
        const order = song.arp === 'down' ? [5, 4, 3, 2, 1, 0]
          : song.arp === 'updown' ? [0, 1, 2, 3, 4, 5, 4, 3, 2, 1]
          : song.arp === 'mirror' ? (k < 8 ? [0, 1, 2, 3, 4, 5] : [5, 4, 3, 2, 1, 0]) : [0, 1, 2, 3, 4, 5];
        const n = tones[order[k % order.length]];
        voice('square', mtof(n), t, spb * 0.9, { vol: 0.04, cut: 1800 + u * 2000, release: 0.04, send: 0.6, pan: song.pingpong ? (k % 2 ? 0.6 : -0.6) : 0 });
      }
      // Lead (bosses)
      if (lvl >= 3 && LEAD_STEPS.includes(k)) {
        const dg = deg + LEAD_DEGREES[(bar * LEAD_STEPS.length + LEAD_STEPS.indexOf(k)) % LEAD_DEGREES.length];
        voice('square', mtof(note(dg, 2)), t, spb * 2.6, { vol: lvl >= 4 ? 0.06 : 0.05, cut: 3200, attack: 0.02, release: 0.1, send: 0.5 });
      }
      // Heartbeat when integrity is low.
      if (s.low && (k === 0 || k === 3)) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        g.gain.setValueAtTime(k === 0 ? 0.5 : 0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.22);
      }
    }

    let lastBeat = null;
    return { init, volume, setSource: fn => { getState = fn; }, current: () => key, beat: () => (ac && ac.state === 'running' && song ? lastBeat : null), keyInfo: () => Object.assign(keyInfo(), { bend: () => 1 }), powerDown, powerUp,
      restart: () => { if (ac && key) switchTo(key); },
      muffle: on => { focused = false; if (ac && muff) muff.frequency.setTargetAtTime(on ? 380 : 20000, ac.currentTime, on ? 0.08 : 0.12); },
      // DECIBEL / STETHOSCOPE: 0 = muffled .. 1 = clear. null hands it back.
      focus: v => {
        if (!ac || !muff) return;
        if (v == null) { if (focused) { focused = false; lastF = 20000; muff.frequency.setTargetAtTime(20000, ac.currentTime, 0.15); } return; }
        const f = v >= 0.97 ? 20000 : 280 + v * v * 9000;
        if (focused && Math.abs(f - lastF) < 40) return;
        focused = true; lastF = f;
        muff.frequency.setTargetAtTime(f, ac.currentTime, 0.08);
      } };
  })();

  // ---------------- Canvas & layout ----------------
  const cv = document.getElementById('screen');
  const g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let L = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    computeLayout();
  }

  function computeLayout() {
    const gd = (st.mode === 'play' && st.lv) ? { cols: st.lv.cols, rows: st.lv.rows } : { cols: 4, rows: 4 };
    const gw = gd.cols * TILE_W + (gd.cols - 1) * GAP_X;
    const gh = gd.rows * TILE_H + (gd.rows - 1) * GAP_Y;
    const wc = Math.max(gw, MIN_CONTENT_W);
    const hc = BOARD_Y + gh + TRAY_ROWS + 2;
    g.font = `400 100px ${FONT}`;
    const ratio = (g.measureText('M').width / 100) || 0.6;
    const gutter = 12;
    let fs = Math.min((W - 2 * gutter) / (wc * ratio), (H - 2 * gutter) / (hc * LINE_H));
    fs = Math.max(7, Math.min(26, fs));
    const cw = fs * ratio, chh = fs * LINE_H;
    L = {
      fs, cw, chh, wc, hc, gw, gh,
      gx: Math.floor((wc - gw) / 2),
      cols: gd.cols, rows: gd.rows,
      ox: Math.round((W - wc * cw) / 2),
      oy: Math.round((H - hc * chh) / 2),
    };
  }
  const pxX = cx => L.ox + cx * L.cw + L.cw / 2;
  const pxY = cy => L.oy + cy * L.chh + L.chh / 2;
  const tileOrigin = t => { const p = t.slide ? tilePos(t, performance.now()) : t; return { tx: L.gx + p.col * (TILE_W + GAP_X), ty: BOARD_Y + p.row * (TILE_H + GAP_Y) }; };
  const tileCenter = t => { const { tx, ty } = tileOrigin(t); return { x: pxX(tx + (TILE_W - 1) / 2), y: pxY(ty + (TILE_H - 1) / 2) }; };

  // ---------------- State ----------------
  const params = new URLSearchParams(location.search);
  const urlSeed = cleanSeed(params.get('seed'));

  const st = {
    mode: 'title',          // title | map | play | panel | over
    seed: urlSeed || newSeed(),
    practice: !!urlSeed,
    run: null,              // the current run (map, integrity, credits, items, mods)
    corp: null,             // the corp being hacked
    lv: null,               // the current layer
    panelFn: null,          // builds the lines for panel screens
    panelTitle: '',
    panelT0: 0,             // when offers start popping in
    revealed: new Set(),    // offers that already popped
    busy: true,
    hover: -1, hoverBtn: null, hoverNode: null, hoverItem: -1, hoverMod: -1,
    selItem: -1, selMod: -1,  // tray selection: first tap shows info, second tap uses
    mapSel: null,
    timer: null,
    msg: '', msgCol: '', msgT: 0,
    boardStart: 0,
    wipe: null,             // board transition in progress
    hideBoard: false, hideAll: false,
    debug: false,           // show the real node (dev menu)
    dev: false,             // dev menu open
    devAccess: params.get('dev') === '1',
    result: null,
    transitioning: false,
    resetArmed: false,
    pause: false,           // pause menu open (during a run)
    intro: null,            // corp intro screen showing ({ skip })
    mp: null,               // online multiplayer game, when playing one
    freeTravel: false,      // dev: travel to any node on the map
    god: false,             // dev: ICE does no damage
    abandonArmed: false,
    kbFocus: null,          // id of the button the keyboard cursor is on
    kbGrid: false,          // last grid move came from the keyboard (shows a blinking cursor)
    focusables: [],         // tappable buttons on screen, in reading order, for the keyboard
    keyHandler: null,       // screen-specific keys (codex, help, settings)
    scroll: null,           // screen-specific scrolling (wheel, swipe)
    drag: null,
  };
  // MUTATE counts as the mod it is right now (run.mutateAs, new each corp).
  const has = key => !!(st.run && (st.run.mods.includes(key) || (key === st.run.mutateAs && st.run.mods.includes('mutate'))));
  const reduced = () => save.effects === 'reduced';

  // ---------------- Effects ----------------
  const parts = [];
  const shakeFx = { amp: 0, t0: 0, dur: 1 };
  const flashFx = { col: '#fff', a: 0, t0: 0, dur: 1 };
  const rand = (a, b) => a + Math.random() * (b - a);

  function shake(amp, dur = 0.35) { if (reduced()) return; Object.assign(shakeFx, { amp: amp * L.fs / 16, t0: performance.now(), dur }); }
  function flash(col, a, dur = 0.3) { if (reduced()) return; Object.assign(flashFx, { col, a, t0: performance.now(), dur }); }

  // Current on-screen characters (without transitions), as pixel positions.
  function snapshot(filter) {
    return buildScene(performance.now(), false, true)
      .filter(filter)
      .map(c => ({ ch: c.ch, x: pxX(c.cx), y: pxY(c.cy), col: c.col }));
  }

  function explode(cells, ox, oy, { col = null, power = 1, grav = 1, life = [0.7, 1.3] } = {}) {
    const k = L.fs / 16;
    for (const c of cells) {
      const dx = c.x - ox, dy = c.y - oy, d = Math.hypot(dx, dy) || 1;
      const sp = rand(220, 600) * power * k;
      parts.push({
        mode: 'explode', ch: c.ch, x: c.x, y: c.y, col: col || c.col,
        vx: dx / d * sp + rand(-60, 60) * k,
        vy: dy / d * sp - rand(80, 320) * power * k,
        rot: 0, vr: rand(-9, 9), g: grav,
        t: 0, life: rand(life[0], life[1]), alpha: 1, scr: 5,
      });
    }
  }

  // Fireworks made of type: a word and some noise characters blasting out from a point.
  const FIREWORK_WORDS = ['ROOT', 'ACCESS', 'GRANTED', 'OWNED', '0xFF', '1337', 'WIN', 'R00T'];
  function typeFirework(x, y, col) {
    const word = FIREWORK_WORDS[Math.floor(Math.random() * FIREWORK_WORDS.length)];
    const cells = [];
    for (let i = 0; i < 22; i++) cells.push({ ch: i < word.length * 2 ? word[i % word.length] : noiseCh(), x, y, col });
    // Spread the start points a little so the burst has a shape.
    for (const c of cells) { const a = Math.random() * Math.PI * 2; c.x += Math.cos(a) * L.cw; c.y += Math.sin(a) * L.chh; }
    explode(cells, x, y, { power: 0.75, grav: 0.45, life: [0.8, 1.5] });
    Sound.burst();
  }
  function fireworkShow(n = 9, every = 280, mode = 'over') {
    const cols = () => [C.cyan, C.gold, C.exotic, C.epic, C.rare, C.bright];
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        if (st.mode !== mode) return;
        const x = pxX(rand(L.wc * 0.15, L.wc * 0.85)), y = pxY(rand(BOARD_Y + 1, BOARD_Y + L.gh * 0.6));
        typeFirework(x, y, pickR(cols(), Math.random));
      }, 350 + i * every + Math.random() * 120);
    }
  }

  // Losing: the screen collapses from the top down, like falling back down the net.
  // Characters glitch in place, then let go row by row from the top, dropping
  // (accelerating), scrambling, going red and fading. Returns the total time (ms).
  const FALL = { wave: 1.7, jitter: 0.3, fall: 0.95 };
  function fallOut(cells) {
    const top = L.oy, h = L.hc * L.chh;
    for (const c of cells) {
      const f = clamp((c.y - top) / h, 0, 1);
      parts.push({
        mode: 'fall', ch: c.ch, x: c.x, y: c.y, x0: c.x, y0: c.y, col: c.col, base: c.col,
        drop: f * FALL.wave + Math.random() * FALL.jitter,   // when it lets go
        vy: 0, t: 0, life: 0, rot: 0, alpha: 1, scr: 0,
      });
    }
    return (FALL.wave + FALL.jitter + FALL.fall) * 1000;
  }

  // Boss beaten: the screen breaks up from the bottom and floats away upward, the real
  // node last. Ends empty (the reveal comes next). Returns the total time (ms).
  const RISE = { wave: 0.9, jitter: 0.25, rise: 0.8 };
  function riseOut(litKeys, speed = 1) {   // speed > 1 = slower (fits it to the fanfare)
    const R = { wave: RISE.wave * speed, jitter: RISE.jitter * speed, rise: RISE.rise * speed };
    const top = L.oy, h = L.hc * L.chh;
    const cells = buildScene(performance.now(), false, true);
    for (const c of cells) {
      const x = pxX(c.cx), y = pxY(c.cy);
      const lit = litKeys.has(c.cx + ',' + c.cy);
      const f = 1 - clamp((y - top) / h, 0, 1);   // bottom rows go first
      parts.push({
        mode: 'rise', ch: c.ch, x, y, x0: x, y0: y, col: lit ? C.cyan : c.col, base: lit ? C.cyan : c.col, bold: lit,
        drop: lit ? R.wave + R.jitter : f * R.wave + Math.random() * R.jitter, riseT: R.rise,
        vy: 0, t: 0, life: 0, rot: 0, alpha: 1, scr: 0,
      });
    }
    return (R.wave + R.jitter + R.rise) * 1000;
  }

  function updateParts(dt) {
    const grav = 1500 * L.fs / 16;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t < 0) continue;
      const k = Math.min(1, p.t / p.life);
      if (p.mode === 'float') {   // emotes: drift up and fade
        p.y -= 26 * (L.fs / 16) * dt;
        p.alpha = k > 0.6 ? Math.max(0, (1 - k) / 0.4) : 1;
        if (p.t >= p.life) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'rise') {
        const r = Math.random();
        if (p.t < p.drop) {
          const near = 1 - Math.min(1, (p.drop - p.t) / 0.5);
          if (r < 0.1 * near) p.ch = noiseCh();
          p.col = Math.random() < 0.3 * near ? C.bright : p.base;
          continue;
        }
        const k2 = (p.t - p.drop) / p.riseT;
        p.vy -= grav * 0.45 * dt;
        p.y += p.vy * dt;
        if (r < 0.2) p.ch = noiseCh();
        p.col = k2 < 0.25 ? C.bright : k2 < 0.6 ? C.cyan : C.gold;
        p.alpha = Math.max(0, 1 - k2);
        if (k2 >= 1) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'fall') {
        const r = Math.random();
        if (p.t < p.drop) {
          // waiting: glitch in place, more as its turn gets close
          const near = 1 - Math.min(1, (p.drop - p.t) / 0.6);
          if (r < 0.02 + 0.12 * near) p.ch = noiseCh();
          p.x = r < 0.03 + 0.08 * near ? p.x0 + rand(-1, 1) * L.cw : p.x0;
          p.col = Math.random() < 0.05 + 0.25 * near ? C.red : p.base;
          continue;
        }
        const k2 = (p.t - p.drop) / FALL.fall;
        p.vy += grav * 0.55 * dt;
        p.y += p.vy * dt;
        p.x = p.x0 + (r < 0.05 ? rand(-1, 1) * L.cw : 0);
        if (r < 0.25) p.ch = noiseCh();
        p.col = k2 > 0.3 ? C.redDim : C.red;
        p.alpha = Math.max(0, 1 - k2);
        if (k2 >= 1) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'glitch') {
        const r = Math.random();
        if (r < 0.12) p.ch = noiseCh();
        p.x = r < 0.06 ? p.x0 + rand(-2, 2) * L.cw : p.x0;
        p.col = Math.random() < 0.1 ? C.red : p.base;
        if (p.t >= p.life) parts.splice(i, 1);
        continue;
      }
      p.vy += grav * p.g * dt;
      p.vx *= 1 - 0.8 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.alpha = k > 0.6 ? Math.max(0, (1 - k) / 0.4) : 1;
      if (Math.random() < p.scr * dt) p.ch = noiseCh();
      if (p.t >= p.life) parts.splice(i, 1);
    }
  }

  // ---------------- Scroll-fill wipe ----------------
  // The board fills from the bottom with a scrolling pattern; a scramble band
  // rides the front. Then the next screen comes up out of the fill the same way.
  // level 0 = quiet page change, 1 = success, 2 = perfect / boss clear.
  // Fills scroll upward. Two kinds:
  //   - patterns: 4-row repeats (strings), so you can see them move
  //   - noise fields: random characters fixed in place, so the whole field scrolls
  //     up together (fresh random noise every frame would just flicker)
  // Each wipe picks one at random (quiet set for page changes, success set for wins).
  const hash2 = (a, b) => {
    let x = (Math.imul(a + 11, 374761393) + Math.imul(b + 7, 668265263)) | 0;
    x = Math.imul(x ^ (x >>> 15), 0x2c1b3c6d);
    x = Math.imul(x ^ (x >>> 12), 0x297a2d39);
    return (x ^ (x >>> 15)) >>> 0;
  };
  const noiseField = (chars, density) => (cx, r) => {
    const h = hash2(cx, r);
    return (h % 1000) < density * 1000 ? chars[(h >>> 10) % chars.length] : null;
  };
  // Each column cycles through `chain` with its own offset, so columns ripple.
  const streams = chain => (cx, r) => {
    const ch = chain[(r + hash2(cx, 3) % chain.length) % chain.length];
    return ch === ' ' ? null : ch;
  };
  const FILLS = {
    quiet: [
      streams(' .:|'),
      noiseField('...::;+=', 0.5),
      [' ^  ^  ^', '/ \\/ \\/ ', ': :: :: ', '. .. .. '],    // chevrons
      ['-=-=-=-=', ' . . . .', '=-=-=-=-', '. . . . '],      // dashes
      ['.:  .:  ', ':|  :|  ', '  .:  .:', '  :|  :|'],      // checker streams
    ],
    success: [
      streams(' .:|#'),
      noiseField('::;+=*#%', 0.65),
      ['^^  ^^  ', '||  ||  ', '::^^::^^', '  ||  ||'],      // double chevrons
      [' /\\  /\\ ', '/::\\/::\\', ':||::||:', '.::..::.'],  // arrows
    ],
  };
  // Timing per strength: how long the front takes to cross the board, and how
  // long each character takes to break down (or build up) when the front hits it.
  const WIPE_TIME = [
    { travel: 280, decay: 240 },   // quiet page change
    { travel: 340, decay: 320 },   // success
    { travel: 360, decay: 360 },   // perfect / boss clear
  ];
  const DECAY_CHARS = '.:,\'`';

  function fillChar(cx, cy, now, level, pat) {
    const s = Math.floor(now * CONFIG.wipeSpeed / (level ? 45 : 75));   // one row up per tick
    if (typeof pat === 'function') return pat(cx, cy + s);
    const row = pat[(((cy + s) % pat.length) + pat.length) % pat.length];
    const ch = row[((cx % row.length) + row.length) % row.length];
    return ch === ' ' ? null : ch;
  }

  // How it works: fronts rise row by row; each board row gets an arrival time.
  // The old screen's front starts first. Partway up, the new screen's front starts
  // behind it, so the two overlap like a cross-fade:
  //   top: old screen still breaking down / middle: scrolling fill / bottom: new screen.
  // Old characters break down when hit (flicker -> noise -> decay dots).
  // New characters build up the reverse way. Empty cells just fill or clear.
  const LIT_HOLD = 220;   // wipe-time the real node stays lit after the front passes the top
  // Each character gets its own random delay and change speed, so swaps don't happen in a neat line.
  const charJitter = (cx, cy, salt) => (hash2(Math.round(cx * 2) + salt, Math.round(cy)) % 1000) / 1000;

  function applyWipe(cells, now) {
    const w = st.wipe;
    const top = w.full ? 0 : BOARD_Y, bot = w.full ? L.hc : BOARD_Y + L.gh;
    const inB = c => c.cy >= top && c.cy < bot;
    const out = cells.filter(c => !inB(c));
    const outT = WIPE_TIME[w.level];
    const inLvl = w.levelIn != null ? w.levelIn : Math.min(w.level, 1);
    const inT = WIPE_TIME[inLvl];
    const eOut = (now - w.t0) * CONFIG.wipeSpeed;                                   // wipe-time, scaled by speed
    const eIn = w.tIn != null ? (now - w.tIn) * CONFIG.wipeSpeed : -Infinity;
    const frac = cy => (bot - 1 - cy) / Math.max(1, bot - top - 1);                   // bottom row first
    const hitOut = w.level ? C.cyan : C.text, hitIn = inLvl ? C.cyan : C.text;
    const fillCol = age => age < 70 ? (w.level ? C.cyan : C.mid) : age < 200 && w.level ? C.mid : C.dim;
    const busy = new Set();   // cells with a character mid-change; no fill drawn there
    const key = (cx, cy) => Math.round(cx) + ',' + Math.round(cy);
    const decayCh = () => DECAY_CHARS[Math.floor(Math.random() * DECAY_CHARS.length)];

    // Old screen: breaks down as its front passes.
    for (const c of w.cells) {
      if (!inB(c)) continue;
      const hit = eOut - frac(Math.round(c.cy)) * outT.travel;          // time since the front got here
      const t = hit - charJitter(c.cx, c.cy, 1) * CONFIG.wipeStagger;      // this character starts a bit later
      const dec = outT.decay * (0.7 + 0.6 * charJitter(c.cx, c.cy, 2));
      if (t < 0) { out.push(c); if (hit >= 0) busy.add(key(c.cx, c.cy)); continue; }   // holding on in the fill
      if (t >= dec) continue;
      const q = t / dec;
      let ch, col;
      if (q < 0.3) { ch = Math.random() < 0.5 ? c.ch : noiseCh(); col = Math.random() < 0.5 ? c.col : hitOut; }
      else if (q < 0.7) { ch = noiseCh(); col = hitOut; }
      else { ch = decayCh(); col = C.mid; }
      const dy = -Math.sin(Math.min(1, q * 2) * Math.PI) * (w.level ? 0.35 : 0.2);   // bumped by the front
      out.push({ ch, cx: c.cx, cy: c.cy + dy, col, own: 'wipe', bold: c.bold });
      busy.add(key(c.cx, c.cy));
    }

    // New screen: builds up as its front passes (once it has started).
    if (w.tIn != null) {
      for (const c of cells) {
        if (!inB(c) || busy.has(key(c.cx, c.cy))) continue;
        const hit = eIn - frac(Math.round(c.cy)) * inT.travel;
        if (hit < 0) continue;                                              // still under the fill
        const t = hit - charJitter(c.cx, c.cy, 3) * CONFIG.wipeStagger;
        const dec = inT.decay * (0.7 + 0.6 * charJitter(c.cx, c.cy, 4));
        if (t < 0) {                                                        // waiting its turn: cycling noise
          out.push({ ch: Math.random() < 0.5 ? decayCh() : noiseCh(), cx: c.cx, cy: c.cy, col: C.mid, own: 'wipe' });
          busy.add(key(c.cx, c.cy));
          continue;
        }
        if (t >= dec) { out.push(c); continue; }
        const q = t / dec;
        let ch, col;
        if (q < 0.25) { ch = decayCh(); col = C.mid; }
        else if (q < 0.65) { ch = noiseCh(); col = hitIn; }
        else { ch = Math.random() < 0.6 ? c.ch : noiseCh(); col = Math.random() < 0.6 ? c.col : hitIn; }
        out.push({ ch, cx: c.cx, cy: c.cy, col, own: 'wipe', bold: c.bold });
        busy.add(key(c.cx, c.cy));
      }
    }

    // Fill between the two fronts, with bright leading lines.
    for (let cy = top; cy < bot; cy++) {
      const tO = eOut - frac(cy) * outT.travel;
      const tI = eIn - frac(cy) * inT.travel;
      for (let cx = 0; cx < L.wc; cx++) {
        if (busy.has(cx + ',' + cy)) continue;
        if (tO < 0) {
          // Old screen region. Sparks just ahead of the front on a success.
          if (w.level && tO > -90 && Math.random() < (w.level >= 2 ? 0.08 : 0.04)) out.push({ ch: noiseCh(), cx, cy, col: C.cyan, own: 'wipe' });
          continue;
        }
        if (tI >= 0) {
          // New screen region; a bright line marks its front.
          if (tI < 60) { const ch = fillChar(cx, cy, now, inLvl, w.pattern); if (ch) out.push({ ch, cx, cy, col: hitIn, own: 'wipe' }); }
          continue;
        }
        const ch = fillChar(cx, cy, now, w.level, w.pattern);
        if (ch) out.push({ ch, cx, cy, col: fillCol(tO), own: 'wipe' });
      }
    }

    // The real node stays lit and is the last thing swallowed.
    if (w.lit && eOut < outT.travel + LIT_HOLD) {
      const ending = eOut > outT.travel + LIT_HOLD - 160;
      for (const c of w.lit) out.push(Object.assign({}, c, { ch: ending && Math.random() < 0.6 ? noiseCh() : c.ch, col: C.cyan, bold: true }));
    }
    return out;
  }

  // Start wiping the board out. Resolves at the hand-off point, partway through,
  // so the caller can open the next screen while the old one is still going.
  async function wipeOut(level = 0, lit = null, quiet = false) {
    const now = performance.now();
    const cells = buildScene(now, false, true);   // whole screen; applyWipe uses the part in its region
    const pattern = pickR(level ? FILLS.success : FILLS.quiet, Math.random);   // new fill each wipe
    st.wipe = { t0: now, level, cells, lit, pattern, tIn: null, full: fullScreen() };
    if (level) { if (quiet) Sound.whoosh(); else Sound.sweep(level); shake(level >= 2 ? 7 : 3, 0.3); if (level >= 2) flash(C.cyan, 0.15, 0.4); }
    else Sound.whoosh();
    // Success wipes hand off later, so the lit node gets its moment.
    const handoff = WIPE_TIME[level].travel * (level ? CONFIG.wipeOverlapWin : CONFIG.wipeOverlap) / CONFIG.wipeSpeed;
    await wait(handoff);
  }

  // Start the new screen's front. Without a wipe in progress, just decode in.
  function wipeIn() {
    const w = st.wipe;
    if (w && w.tIn == null) {
      const now = performance.now();
      w.tIn = now;
      if (fullScreen()) w.full = true;   // full-screen screens wipe the whole screen
      w.levelIn = Math.min(w.level, 1);   // the new screen always builds in calmly
      const outT = WIPE_TIME[w.level], inT = WIPE_TIME[w.levelIn];
      const slack = CONFIG.wipeStagger;   // the last characters can start this much later, and change 1.3x slower
      const outEnd = w.t0 + (outT.travel + Math.max(outT.decay * 1.3 + slack, w.lit ? LIT_HOLD : 0)) / CONFIG.wipeSpeed;
      const inEnd = now + (inT.travel + inT.decay * 1.3 + slack) / CONFIG.wipeSpeed;
      w.dur = inEnd - now;                 // how long until the new screen is fully in
      w.endsAt = Math.max(outEnd, inEnd);
    } else {
      st.wipe = null;
      st.boardStart = performance.now();
    }
  }

  // ---------------- Scene ----------------
  let hits = [];
  let bgs = [];             // background-tinted cells for the current frame
  const pad2 = n => String(n).padStart(2, '0');
  const rule = w => '- '.repeat(Math.ceil(w / 2)).slice(0, w);
  const decodeDelay = (cx, cy) => 40 + ((((Math.round(cx * 2) + 1) * 374761393) ^ ((Math.round(cy * 2) + 1) * 668265263)) >>> 0) % 380;

  // raw = skip transitions (used for snapshots).
  function buildScene(now, collectHits, raw = false) {
    const cells = [];
    const frameBgs = [];
    const put = (cx, cy, str, col, own = 'hud', bold = false) => {
      for (let k = 0; k < str.length; k++) {
        if (str[k] !== ' ') cells.push({ ch: str[k], cx: cx + k, cy, col, own, bold });
      }
    };
    const putC = (cy, str, col, own) => put(Math.floor((L.wc - str.length) / 2), cy, str, col, own);
    const putR = (cy, str, col, own) => put(L.wc - str.length, cy, str, col, own);
    const bg = (cx, cy, w, col, alpha) => frameBgs.push({ cx, cy, w, col, alpha });
    const addHit = (cx, cy, w, h, hit) => {
      if (!collectHits) return;
      let x = L.ox + cx * L.cw, y = L.oy + cy * L.chh, pw = w * L.cw, ph = h * L.chh;
      if (ph < 40) { y -= (40 - ph) / 2; ph = 40; }   // finger-sized tap targets
      if (pw < 40) { x -= (40 - pw) / 2; pw = 40; }
      hits.push(Object.assign({ x, y, w: pw, h: ph }, hit));
    };
    const ctx = { now, put, putC, putR, addHit, bg, cells, collectHits };

    if (st.hideAll) { if (collectHits) bgs = []; return cells; }
    const run = st.run;

    const boardEnd = BOARD_Y + L.gh;
    // Hover / keyboard cursor look, the same everywhere: a background highlight
    // (plus a > marker for the keyboard cursor). Buttons keep their own colors.
    // marker = false where the > would land on neighboring text (tightly packed rows).
    const hl = (x, y, w, h, id, marker = true) => {
      if (st.hoverBtn !== id) return;
      for (let r = 0; r < h; r++) bg(x, y + r, w, C.cyan, st.kbFocus === id ? 0.3 : 0.2);
      if (marker && st.kbFocus === id && x >= 2) put(x - 2, y + Math.floor((h - 1) / 2), '>', C.cyan, 'ui', true);
    };
    ctx.hl = hl;

    // The title gets the whole screen: no header, HUD or tray.
    const versionTag = `beta_runner ${VERSION}`;
    // Footer, bottom row on every screen: [DEV] (when dev access is on) + build version.
    const footerRight = () => {
      const y = L.hc - 1;
      putR(y, versionTag, C.dim);
      if (st.devAccess || st.dev) {   // ?dev=1 in the URL, or the backtick key (until a refresh)
        const label = '[DEV]', x = L.wc - versionTag.length - label.length - 2;
        put(x, y, label, st.dev ? C.cyan : C.mid, 'ui');
        if (st.hoverBtn === 'dev') bg(x, y, label.length, C.cyan, 0.2);
        addHit(x, y, label.length, 1, { kind: 'btn', id: 'dev', onTap: toggleDev, noFocus: true });
      }
    };
    if (!st.dev && st.bossIntro) {
      buildBossIntro(ctx, now);
    } else if (!st.dev && st.mode === 'over' && st.overReveal) {
      buildOverReveal(ctx, now);
      footerRight();
    } else if (!st.dev && !st.pause && st.mode === 'panel' && st.panelReveal && !st.panelReveal.done) {
      buildReveal(ctx, now, st.panelReveal, panelLines());
    } else if (fullScreen() || st.dev) {
      buildTextBoard(ctx, st.dev ? devLines() : st.mode === 'title' ? titleLines(now) : panelLines(), { top: 0, h: L.hc });
      footerRight();
    } else {

    // Header
    put(0, 0, 'BETA_RUNNER', C.cyan);
    const headerBtn = (x, label, id, onTap, active) => {
      put(x, 0, label, active ? C.cyan : C.mid, 'ui');
      if (st.hoverBtn === id) bg(x, 0, label.length, C.cyan, 0.2);
      addHit(x, 0, label.length, 1, { kind: 'btn', id, onTap, noFocus: true });
    };
    if (st.mp) headerBtn(12, '[LEAVE]', 'leave', mpLeave, false);
    else if (run && (st.mode === 'map' || st.mode === 'play' || st.mode === 'panel')) headerBtn(12, '[MENU]', 'menu', togglePause, st.pause);
    else put(12, 0, `// ${VERSION}`, C.dim);
    put(0, 1, rule(L.wc), C.dim);

    // HUD
    if (st.mp && st.mp.state && st.mode === 'play') {
      // Up to 6 players, 3 per row: logo + name + integrity. Current turn highlighted.
      const m = st.mp, S = m.state;
      S.order.forEach((id, i) => {
        const mem = mpMember(id), x = (i % 3) * 12, y = 2 + Math.floor(i / 3);
        const out = !S.alive[id], turn = S.turn === id && !S.winner;
        const hp = out ? 'xxxx'.slice(0, S.max) : '#'.repeat(Math.max(0, S.hp[id])) + '-'.repeat(Math.max(0, S.max - S.hp[id]));
        const col = out ? C.dim : mpColor(id), back = mpBg(id);
        if (back && !out) bg(x, y, 12, back, turn ? 1 : 0.6);   // their style's background
        else if (turn) bg(x, y, 12, col, 0.25);
        if (turn && back && Math.floor(now / 400) % 2) bg(x, y, 12, col, 0.18);   // current turn pulses
        put(x, y, logoChar(mem.logo), col, 'hud', true);
        put(x + 1, y, mpShort(id), col, 'hud', id === m.me);
        put(x + 8, y, hp, out ? C.dim : S.hp[id] <= 1 ? C.red : col, 'hud');
      });
    } else if (run && st.mode !== 'title' && st.mode !== 'over') {
      put(0, 2, 'LAYER ', C.mid); put(6, 2, pad2(run.depth), C.bright);
      if (run.sector) { put(9, 2, 'S', C.mid); put(10, 2, String(run.sector + 1), C.bright); }
      const cur = Math.max(0, run.integrity);
      const bar = run.maxInt <= 10 ? '#'.repeat(cur) + '-'.repeat(Math.max(0, run.maxInt - cur)) : `${cur}/${run.maxInt}`;
      putR(2, bar, cur <= 1 ? C.red : C.cyan);
      put(L.wc - bar.length - 10, 2, 'INTEGRITY', C.mid);
      const fw = st.corp && st.corp.wallAll ? 'FW*' : run.shield ? `FW${run.shield}` : '';
      if (fw) put(L.wc - bar.length - 10 - 1 - fw.length, 2, fw, C.cyan);

      let where = run.sector ? `OVERWORLD // SECTOR ${run.sector + 1}` : 'OVERWORLD';
      if (st.mode === 'play' && st.corp) {
        const c = st.corp;
        const prog = c.hasBoss ? (st.lv && st.lv.boss ? 'BOSS' : `${c.idx + 1}/${c.counts.length - 1}`) : '';
        where = `${c.def.name} ${prog}`;
      } else if (st.mode === 'panel') where = st.panelTitle || '';
      put(0, 3, where, st.lv && st.lv.boss && st.mode === 'play' ? C.red : C.text);
      putR(3, `CR ${run.credits}`, C.gold);
    } else {
      put(0, 2, `BEST ${pad2(save.best)}   RUNS ${save.runs}   WINS ${save.wins}`, C.mid);
    }
    const ruleCol = st.mp && mpMine() ? (Math.floor(now / 350) % 2 ? C.cyan : C.mid) : C.dim;   // glows on your turn
    put(0, 4, rule(L.wc), ruleCol);

    // Row 5: odds in a layer, seed elsewhere
    if (st.mode === 'play' && st.lv) {
      const cand = candidates().length;
      const open = st.lv.tiles.filter(t => t.state === 'closed').length;
      put(0, 5, 'OPEN ', C.mid); put(5, 5, `${pad2(open)}/${pad2(st.lv.n)}`, C.text);
      if (cand > 0) {
        const pct = Math.round(100 / cand);
        const col = cand === 1 ? C.cyan : pct < 25 ? C.red : C.text;
        const val = `1 IN ${cand}  ${String(pct).padStart(3)}%`;
        putR(5, val, col);
        put(L.wc - val.length - 5, 5, 'ODDS', C.mid);
      }
    }

    if (st.msg) put(0, 6, st.msg.slice(0, Math.min(L.wc, Math.floor((now - st.msgT) / 16))), st.msgCol || C.text);

    // Row 7: clock or boss warning
    if (st.mode === 'play' && st.lv) {
      // Mod notes (FORECAST, SPELLBOUND...): right side of the row. `ms` notes show briefly.
      const lvn = st.lv;
      const live = (lvn.notes || []).filter(nt => !nt.ms || (lvn.readyAt != null && now - lvn.readyAt < nt.ms));
      const brief = live.filter(nt => nt.ms);   // a brief note (PHOTOGRAPHIC) gets the row to itself
      // A corp's button (CALL, BID, TITHE...) sits on the right; notes give it the room.
      const act = st.corp && st.corp.hasBoss && st.corp.def.action && !st.mp ? st.corp.def.action(st.lv) : null;
      const actLabel = act ? `[${act.label}]` : '';
      const notes = act ? '' : (brief.length ? brief : live).map(nt => nt.text).join('  ');
      if (act) {
        const ax = L.wc - actLabel.length, canAct = act.ok && !st.busy;
        put(ax, 7, actLabel, act.hot ? C.red : canAct ? C.cyan : C.dim, 'ui', true);
        if (st.hoverBtn === 'corpact' && canAct) bg(ax, 7, actLabel.length, C.cyan, 0.2);
        addHit(ax, 7, actLabel.length, 1, { kind: 'btn', id: 'corpact', noFocus: true, onTap: () => { const a2 = st.corp && st.corp.def.action && st.corp.def.action(st.lv); if (a2 && a2.ok && !st.busy && st.mode === 'play') a2.use(); else Sound.deny(); } });
      }
      if (st.timer) {
        const w = notes || act ? 10 : 20, f = Math.max(0, st.timer.left / st.timer.max);
        const fill = Math.ceil(f * w);
        const low = st.timer.left <= 3;
        put(0, 7, 'CLOCK ', C.mid);
        put(6, 7, '=' .repeat(fill), low ? C.red : C.text);
        put(6 + w, 7, '|', C.dim);
        put(6 + w + 2, 7, `${Math.ceil(st.timer.left)}s`, low ? C.red : C.text);
        if (notes) putR(7, notes.slice(0, L.wc - w - 12), C.cyan);
      } else if (st.mp && st.mp.state) {
        // The turn bar: the whole row in the current player's colors; the brighter part is
        // what's left of the turn clock. Flashes red on your last 5 seconds.
        const S = st.mp.state, mine = mpMine(), id = S.turn;
        let textCol = C.mid;
        if (!S.winner) {
          const sty = mpStyle(id), barCol = sty ? sty.bg : mpColor(id);
          const left = mpClockLeft(now), sec = mpClock();
          const hurry = mine && left != null && left <= 5 && Math.floor(now / 250) % 2;
          bg(0, 7, L.wc, hurry ? C.red : barCol, 0.4);
          bg(0, 7, left == null ? L.wc : Math.ceil(L.wc * left / sec), hurry ? C.red : barCol, 1);
          textCol = sty ? sty.fg : C.bg;
          put(0, 7, mine ? '>> YOUR TURN' : `.. ${mpName(id).slice(0, 12)}`, textCol, 'hud', true);
        }
        const sp = st.lv.spec;
        if (sp) { const tag = `L${pad2(S.layer)} ${CORPS[sp.corp] ? CORPS[sp.corp].name.split(' ')[0] : corpDef(sp.corp).name}${sp.boss ? ' BOSS' : ''}`; putR(7, tag, textCol); }
      } else {
        // The corp's hint (corp kit), or the boss warning. Mod notes go on the right; if they
        // don't fit next to the hint, the two take turns.
        const h = st.corp && st.corp.hasBoss && st.corp.def.hint ? st.corp.def.hint(st.lv, now) : null;
        const left = h ? h.text : st.lv.boss && st.corp ? '!! ' + st.corp.def.bossDesc : '';
        const fits = !notes || (h && h.x != null) || left.length + notes.length + 2 <= L.wc;
        const showNotes = notes && (fits || Math.floor(now / 2500) % 2);
        const room = act ? L.wc - actLabel.length - 1 : L.wc;
        if (left && (fits || !showNotes)) {
          if (h) put(h.x != null ? h.x : 0, 7, h.text.slice(0, room - (h.x || 0)), h.col || C.text);
          else put(0, 7, left.slice(0, room), C.redDim);
        }
        if (showNotes) putR(7, notes.slice(0, L.wc), C.cyan);
      }
    }

    // Board
    if (st.pause) buildTextBoard(ctx, pauseLines());
    else if (!st.hideBoard) {
      if (st.mode === 'play' && st.lv) { if (st.mp) mpTurnFrame(ctx); buildBoard(ctx); if (st.mp) { mpDrawCursors(ctx); mpTurnBanner(ctx); } }
      else if (st.mode === 'map') buildMap(ctx);
      else buildTextBoard(ctx, panelLines());
    }

    // Tray: mods, items, info
    put(0, boardEnd + 1, rule(L.wc), ruleCol);
    buildTray(ctx, boardEnd + 2);

    // Footer: the run's seed, small and out of the way.
    // Left side of the footer, clipped so it never runs into [DEV] / the version.
    const footRoom = L.wc - versionTag.length - (st.devAccess || st.dev ? 8 : 1) - 1;
    if (run && st.mode !== 'over') put(0, boardEnd + 6, `seed ${run.seed}${run.practice ? ' practice' : ''}`.slice(0, footRoom), C.dim);
    else if (st.mp) put(0, boardEnd + 6, `room ${st.mp.code}`, C.dim);
    footerRight();
    }

    let result = cells;
    if (!raw) {
      if (st.wipe && !st.dev) result = applyWipe(cells, now);
      else {
        // Board characters "decode" in when a screen appears without a wipe.
        const age = now - st.boardStart;
        if (age < 500) {
          for (const c of cells) {
            if (c.cy >= BOARD_Y && c.cy < boardEnd && age < decodeDelay(c.cx, c.cy)) { c.ch = noiseCh(); c.col = C.dim; }
          }
        }
      }
    }
    if (collectHits) bgs = st.wipe && !st.dev ? (st.wipe.full ? [] : frameBgs.filter(b => b.cy < BOARD_Y || b.cy >= boardEnd)) : frameBgs;
    if (collectHits) st.focusables = hits.filter(h => h.kind === 'btn' && !h.noFocus).sort((a, b) => a.y - b.y || a.x - b.x).map(h => ({ id: h.id, onTap: h.onTap }));
    return result;
  }

  // Badge color by rarity.
  const modColor = m => rarityCol(m.rarity);

  // Draws one mod badge: an animated icon character plus its short name.
  // Animation gets fancier with rarity: common = icon only, exotic = full show.
  function drawBadge(put, now, x, y, key, i, { selected = false, dim = false, own = 'tray', noCharges = false, tier = 0 } = {}) {
    const m = tierView(MODS[key], tier || 0);
    const lvl = RARITY[m.rarity].lvl;
    const base = dim ? C.mid : modColor(m);
    const phase = i * 0.77;
    const icon = m.icon[Math.floor(now / 180 + i * 3) % m.icon.length];
    put(x, y, icon === ' ' ? '.' : icon, selected ? C.bright : base, own, true);
    const label = m.short + (m.lvlTag && m.tier > 0 ? String(m.tier + 1) : '');   // TRC2 = level 2
    const anim = lvl === 0 ? 'none' : lvl === 3 ? 'exotic' : m.anim;
    const cyc = [base, C.bright, base, C.mid];
    const rainbow = [C.exotic, C.bright, C.epic, C.rare, C.boss];
    for (let k = 0; k < label.length; k++) {
      let ch = label[k], dy = 0, col = selected ? C.bright : base;
      const t = (now / 1000 + phase) % 4;
      if (anim === 'wave' || anim === 'exotic') { const w = t - k * 0.09; if (w > 0 && w < 0.3) dy = -Math.sin(w / 0.3 * Math.PI) * 0.35; }
      if (anim === 'exotic' && !dim) col = rainbow[Math.floor(now / 160 + k) % rainbow.length];
      if (anim === 'cycle' && !selected && !dim) col = cyc[Math.floor(now / 300 + k) % cyc.length];
      if (anim === 'scramble' && t < 0.2 && Math.random() < 0.5) ch = noiseCh();
      if (anim === 'blink' && t % 2 < 0.12) col = C.bright;
      if (anim === 'spin' && t < 0.4) col = C.bright;
      put(x + 1 + k, y + dy, ch, col, own, lvl >= 4);
    }
    return 1 + label.length;
  }

  // Tray layout (fixed rows, nothing moves so hover stays stable):
  //   mods row, mod info line, item belt, item info line.
  function buildTray(ctx, y) {
    if (st.mp) return mpTray(ctx, y);
    const { now, put, addHit, bg } = ctx;
    const run = st.run;
    const inRun = run && st.mode !== 'title' && st.mode !== 'over';
    if (!inRun) {

    }

    // Mods row. Tap-to-use mods (BURNER) are drawn as buttons: [^BRN] bright when you can
    // use it now, red brackets when it's spent, dim when it's not the place for it.
    // Spent passives (FAILSAFE) go dim.
    if (!run.mods.length) put(0, y, 'no mods yet', C.dim);
    const widths = run.mods.map(k => { const v = modView(k); return 1 + v.short.length + (v.lvlTag && v.tier > 0 ? 1 : 0) + (v.active ? 2 : 0); });
    const gap = widths.reduce((a, w) => a + w, 0) + 2 * (widths.length - 1) <= L.wc ? 2 : 1;
    let x = 0;
    run.mods.forEach((key, i) => {
      if (x + widths[i] > L.wc) return;          // more than fits (dev / bots): clip

      } else w = drawBadge(put, now, x, y, key, i, { dim: spent, tier: modTier(key) });

  function buildBoard({ now, put, addHit, bg, cells }) {
    const lv = st.lv;
    if (lv.litRow != null && bg) for (const t of lv.tiles) if (t.row === lv.litRow && t.state === 'closed') {
      const { tx, ty } = tileOrigin(t);

    }
    const used = new Set();
    const masked = lv.maskAt && now > lv.maskAt;
    const boardDef = st.corp && st.corp.hasBoss ? st.corp.def : null;
    // A node's own clock for its animation: it stops while the node is frozen. FREEZE FRAME
    // freezes all but the real node; STREAMFLIX's buffering freezes all but the live one.
    const fzOn = lv.freeze && now < lv.freeze.until;
    const bufAt = boardDef && boardDef.bufferAt ? boardDef.bufferAt(lv, now) : null;
    const liveTime = t => fzOn && !t.safe ? lv.freeze.from : bufAt != null && !t.tell ? bufAt : now;
    // A lit row: LIFTCO's lift (or EXPRESS), WATCHPOINT's camera. Marker on the left edge.
    const bands = [];
    if (lv.lift) { const row = liftRow(lv, now); if (row != null) bands.push({ row, col: C.cyan, ch: '>' }); }
    if (boardDef && boardDef.band) { const b = boardDef.band(lv, now); if (b) bands.push(b); }
    if (bg) for (const b of bands) {
      for (let col = 0; col < lv.cols; col++) {
        const { tx, ty } = tileOrigin({ col, row: b.row });
        for (let k = 0; k < TILE_H; k++) bg(tx, ty + k, TILE_W, b.col, 0.1);
      }
      const { tx, ty } = tileOrigin({ col: 0, row: b.row });
      if (tx >= 1) put(tx - 1, ty + 2, b.ch, b.col, 'fx', true);
    }
    lv.tiles.forEach((t, i) => {
      used.add(t.cell);
      if (t.slide) used.add(Math.round(t.slide.fr) * lv.cols + Math.round(t.slide.fc));   // no dot under a moving node
      const { tx, ty } = tileOrigin(t);
      if (t.wide) used.add(t.cell + 1);
      if (t.state === 'closed') addHit(tx, ty, t.wide ? TILE_W * 2 + GAP_X : TILE_W, TILE_H, { kind: 'tile', i });
      else if (boardDef && boardDef.cellTap) addHit(tx, ty, TILE_W, TILE_H, { kind: 'cell', cell: t.cell });
      if (t.hidden) return;
      if (t.wide) {   // TWINLINK's boss: a node two cells wide (always ICE)
        const ww = TILE_W * 2 + GAP_X, gone = t.state === 'locked', hov = (i === st.hover && !st.busy) || t.probing;
        const fc2 = gone ? C.red : hov ? C.bright : C.mid, gc2 = gone ? C.red : hov ? C.bright : C.text, solid2 = gone || hov;
        const e2 = '+' + (solid2 ? '-'.repeat(ww - 2) : '- '.repeat((ww - 2) / 2)) + '+', s2 = solid2 ? '|' : ':';
        put(tx, ty, e2, fc2, 't' + i); put(tx, ty + TILE_H - 1, e2, fc2, 't' + i);
        t.glyph.forEach((l, k) => { put(tx, ty + 1 + k, s2, fc2, 't' + i); put(tx + ww - 1, ty + 1 + k, s2, fc2, 't' + i); put(tx + Math.floor((ww - 5) / 2), ty + 1 + k, l, gc2, 't' + i, gone); });
        return;
      }
      const own = 't' + i;
      // A node you hit stays on the board, bold and red.
      if (t.state === 'locked' && t.lockedBy === 'hit') {
        const fresh = now - t.hitAt < 220;   // brief glitch right after the hit
        const glyphCol = t.klog ? C.cyan : t.loaded ? C.gold : C.red;   // keylogger lines stand out
        // TRACER: the sides facing the real node turn into arrows (< > sides, ^ v top / bottom)
        const d = t.dir || { h: 0, v: 0 };
        const sl = d.h < 0 ? '<' : '|', sr = d.h > 0 ? '>' : '|';
        let rows = [d.v < 0 ? '+^^^^^+' : '+-----+', ...t.glyph.map(l => sl + l + sr), d.v > 0 ? '+vvvvv+' : '+-----+'];
        if (fresh) rows = rows.map(r => r.replace(/[^ ]/g, ch => Math.random() < 0.6 ? noiseCh() : ch));
        const edgeCol = ch => !fresh && '<>^v'.includes(ch) ? C.bright : C.red;
        rows.forEach((r, k) => {
          const isEdge = k === 0 || k === rows.length - 1;
          put(tx, ty + k, r[0], edgeCol(r[0]), own, true);

          put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], edgeCol(r[TILE_W - 1]), own, true);
        });
        return;
      }
      if (t.state === 'locked') {
        // Switched off by an item or mod: the whole tile in dim red, with a label
        // saying what did it (and the mod's code, for mods).
        let [word, code] = LOCK_LABEL[t.lockedBy] || ['INERT', ''];
        if (t.lockedBy === 'demo') { word = lv.boss && now - t.hitAt > 1200 ? '?' : String(t.demoN); code = ''; }   // DEMOLITION
        const mid5 = str => { const l = Math.floor((5 - str.length) / 2); return (' '.repeat(l) + str).padEnd(5); };
        const rows = ['+-----+', '|' + t.glyph[0] + '|', '|' + mid5(word) + '|', '|' + (code ? mid5(code) : t.glyph[2]) + '|', '+-----+'];
        rows.forEach((r, k) => {
          put(tx, ty + k, r[0], C.redDim, own);
          put(tx + 1, ty + k, r.slice(1, TILE_W - 1), k === 2 ? C.text : k === 3 && code ? C.mid : C.redDim, own, k === 2);
          put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], C.redDim, own);

        return;
      }
      let solid = false, fc = C.mid, gc = C.text, bold = false;
      if (st.sel === i && t.state === 'closed') {   // drag-to-select: the picked-out node, tap again to confirm

      }
      if (t.loaded) { fc = C.redDim; gc = C.gold; }
      if (t.ruledOut) { fc = C.dim; gc = C.dim; }
      if (t.state === 'safe' || t.state === 'reveal') { solid = true; fc = C.cyan; gc = C.cyan; }
      else if (t.probing || st.sel === i || (i === st.hover && !st.busy && !(st.press && st.press.moved))) { solid = true; fc = C.bright; if (!t.loaded) gc = C.bright; }
      const edge = solid ? '+-----+' : '+- - -+';
      const side = solid ? '|' : ':';
      let glyph = masked && t.state === 'closed' && !t.loaded ? MASK_GLYPH : t.glyph;
      // Node animation (corp fx), plus PIXEL PEEP and FREEZE FRAME's twitch on the real node.

      if (t.brand && t.state === 'closed') corner = { corner: 's', cornerCol: C.gold };   // BRANDED
      if (st.corp && st.corp.mod === 'armored' && t.state === 'closed') frame = { frame: ['#=====#', '#=====#'], side: '#' };   // ARMORED
      // CCTV: one ICE flashes ### a second into the layer
      if (lv.cctv && lv.cctv.t === t && t.state === 'closed' && lv.shownAt != null && now - lv.shownAt > lv.cctv.at && now - lv.shownAt < lv.cctv.at + 300) { glyph = ICE_FLASH; gc = C.red; }
      if (t.state === 'closed' && !masked && !t.loaded) {
        const live = liveTime(t, now);
        const fx = boardDef && boardDef.fx ? boardDef.fx(t, live, lv, i) : null;
        if (fx) {
          dx = fx.dx || 0; dy = fx.dy || 0; kern = fx.kern || null; over = fx.over || null;
          if (fx.glyph) glyph = fx.glyph;
          if (fx.gc && !solid) gc = fx.gc;
          if (fx.fc && !solid) fc = fx.fc;
          if (fx.corner) corner = fx;
          if (fx.frame) frame = fx;
          if (fx.clip) clip = true;
          if (fx.line) glyph = glyph.map((l, k) => k === fx.line[0] ? fx.line[1] : l);
          if (!solid && fx.dim) { fc = C.dim; gc = C.dim; }
          if (!solid && fx.bright) { fc = C.text; gc = C.bright; bold = true; }
        }
        if (lv.prismRow === t.row && !solid) fc = C.cyan;   // PRISM
        if (has('infrared') && st.corp && st.corp.hasBoss && !lv.pred && lv.n > 1 && lv.shownAt != null && now - lv.shownAt < 1000 && !solid) {
          const v = t.safe ? 0.85 + 0.15 * h01(i, 3) : 0.78 * h01(i, 7 + lv.n);

        }

      if (kern) glyph = glyph.map((l, k) => k === kern.ln ? l.slice(0, kern.x) + ' ' + l.slice(kern.x + 1) : l);

        put(ox, oy + k, r[0], fc, own);
        put(ox + 1, oy + k, r.slice(1, TILE_W - 1), isEdge ? fc : gc, own, bold && !isEdge);

      if (boardDef && boardDef.cellTap) addHit(tx, ty, TILE_W, TILE_H, { kind: 'cell', cell });

  }

  // Big boxed primary button. 3 rows, or 4 with a subtitle.
  function drawBox(ctx, y, ln) {
    const { now, put, addHit } = ctx;
    const label = ln.text, sub = ln.sub || '';
    const w = Math.max(ln.minW || 20, Math.max(label.length, sub.length) + 8);
    const x = Math.floor((L.wc - w) / 2);
    const h = sub ? 4 : 3;
    const pulse = (Math.sin(now / 420) + 1) / 2;
    const fcol = ln.disabled ? C.dim : C.cyan;
    const lcol = ln.disabled ? C.dim : pulse > 0.85 ? C.bright : C.cyan;   // a slow, gentle pulse
    if (!ln.disabled && ctx.hl) ctx.hl(x, y, w, h, ln.id);
    let edge = '+' + '='.repeat(w - 2) + '+';
    // Occasional glitch on the frame.
    if (!ln.disabled && ((now / 1000 + y * 0.37) % 3.2) < 0.07) {
      const i = 1 + Math.floor(Math.random() * (w - 2));
      edge = edge.slice(0, i) + noiseCh() + edge.slice(i + 1);
    }
    put(x, y, edge, fcol, 'ui', true);
    for (let r = 1; r < h - 1; r++) { put(x, y + r, '|', fcol, 'ui', true); put(x + w - 1, y + r, '|', fcol, 'ui', true); }
    put(x + Math.floor((w - label.length) / 2), y + 1, label, lcol, 'ui', true);
    if (sub) put(x + Math.floor((w - sub.length) / 2), y + 2, sub, C.mid, 'ui');
    put(x, y + h - 1, '+' + '='.repeat(w - 2) + '+', fcol, 'ui', true);
    if (!ln.disabled) addHit(x, y, w, h, { kind: 'btn', id: ln.id, onTap: ln.onTap });
    return h;
  }

  // Map: final node at the top, start at the bottom. Edges are dotted lines.
  // x for a node; start / final nodes sit in the middle lane.
  const mapX = n => {
    const mid = Math.floor(L.wc / 2);
    return n.type === 'start' || n.type === 'final' ? mid : mid + (n.lane - 1) * 11;
  };

  // Rows of the whole map (top = the newest OMNI), and a node's row in it.
  const mapRows = (map = st.run.map) => mapTop(map) * 3 + 1;
  const mapRowOf = (n, map = st.run.map) => (mapTop(map) - n.step) * 3;
  const SECTOR_ROWS = SECTOR_STEPS * 3 + 1;   // one sector on screen: 16 rows

  // Dotted link between two nodes. Sideways links (same row) run between the brackets.
  function linkDots(a, b, f) {
    if (a.row === b.row) {
      const lo = Math.min(a.x, b.x) + 2, hi = Math.max(a.x, b.x) - 2, out = [];
      for (let x = lo + 1; x < hi; x += 2) out.push({ x, row: a.row, ch: '-' });
      return out;
    }
    const out = [];
    for (let k = 1; k < 6; k++) { const t = k / 6; out.push({ x: a.x + (b.x - a.x) * t, row: a.row + (b.row - a.row) * t }); }
    return out;
  }

  // Corp node colors on the map: the corp's own palette behind its letter. If that
  // background is too close to the map's, use the corp's dim color instead so it reads.
  const hexLum = h => { const v = parseInt(String(h).slice(1), 16); return ((v >> 16) * 0.299 + ((v >> 8) & 255) * 0.587 + (v & 255) * 0.114) / 255; };
  function corpIconCols(n) {
    if (n.type !== 'corp' && n.type !== 'final') return null;
    const p = PALETTES['c_' + n.corp];
    if (!p) return null;
    const bgc = Math.abs(hexLum(p.bg) - hexLum(C.bg)) < 0.08 ? p.dim : p.bg;
    return { bg: bgc, fg: p.cyan };
  }

  // The run's map on the results screen: the path you took lit, the rest dim, an X
  // where you were traced. Shows rows top..top+h of the map, at screen row y.
  function drawMapView(ctx, y, ln) {
    const { put } = ctx;
    // A line can be one row (k) of a view viewH tall, so the view can come in row by row.
    const r = ln.r, map = r.map, top = ln.top, k0 = ln.k || 0, h = ln.k != null ? ln.viewH : ln.h;
    y -= k0;   // y is now where the view's first row is
    const pos = n => ({ x: mapX(n), row: mapRowOf(n, map) });
    const lo = ln.k != null ? Math.max(top - 0.01, top + k0 - 0.5) : top - 0.01;
    const hi = ln.k != null ? Math.min(top + h - 0.99, top + k0 + 0.49) : top + h - 0.99;
    const inView = row => row >= lo && row <= hi;
    const onPath = (a, b) => { const i = r.visited.indexOf(a); return i >= 0 && r.visited[i + 1] === b; };
    for (const n of Object.values(map)) {
      for (const id of n.next) {
        const m = map[id], path = onPath(n.id, m.id) || onPath(m.id, n.id);
