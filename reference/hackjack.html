    const r = M.ui.resolve;
    M.ui = { phase: 'wait', picks: [] };
    Sound.ui();
    if (r) r(v);
  }

  function comboItems(D, extra = null) {
    const items = D.uploads.map(c => ({ v: c.v, w: 0.2, up: c }));
    if (extra) items.push({ v: extra.v, w: 0.2, up: extra, isNew: true });
    D.en.forEach((cell, i) => { if (cell && cell.up && exposed(D, 'en', i)) items.push({ v: cell.c.v, w: 4 + enGain(D, i), en: i }); });
    return items;
  }
  // Best subset of items that adds to exactly 21 (by total weight w), or null.
  function best21(items) {
    const n = Math.min(items.length, 13);
    let best = null, bestW = -Infinity;
    for (let m = 1; m < (1 << n); m++) {
      let s = 0, w = 0;
      for (let k = 0; k < n && s <= 21; k++) if (m & (1 << k)) { s += items[k].v; w += items[k].w; }
      if (s === 21 && w > bestW) { bestW = w; best = m; }
    }
    return best == null ? null : { pick: items.filter((_, k) => best & (1 << k)), w: bestW };
  }

  async function playerAction(A, D) {
    const ch = await ask('pick');
    if (ch.type === 'fw') return doFirewall(A, D, ch.card, ch.i);
    if (ch.type === 'st') return doStorage(A, D, ch.card, ch.i);
    if (ch.type === 'prog') return doProgram(A, D, ch.card, ch.t);
    await doUpload(A, D, ch.card);
    if (D.en.some((cell, i) => cell && !cell.up && exposed(D, 'en', i))) {
      const i = await ask('encReveal');
      if (i != null) await revealCell(D, 'en', i);
    }
    if (!best21(comboItems(D))) {
      log('no combination makes 21. turn over', C.mid);
      await pace(900);
      return false;
    }
    const combo = await ask('encCombo');
    return doEncRemove(A, D, combo);
  }

  async function playerDefense(D, A, prog) {
    if (prog.r === 'J') {
      const ch = await ask('defJ');
      if (ch) { swapCells(D, ch.layer, ch.a, ch.b); log(`YOU: hot swap ${LAYER_TAG[ch.layer]} ${ch.a + 1} <-> ${ch.b + 1}`); await pace(350); }
    } else if (prog.r === 'Q') {
      const ch = await ask('defQ');
      if (ch) { log(`YOU: query ${LAYER_NAME[ch.layer]} ${ch.idx.map(i => i + 1).join('+')}`); for (const i of ch.idx) await revealCell(A, ch.layer, i); }
    } else {
      const pos = await ask('defK1');
      if (!pos) return;
      if (D[pos.layer][pos.i]) {
        const where = await ask('defK2', { pos });
        takeOut(D, pos.layer, pos.i, where);
      }
      const pick = await ask('defK3', { pos });
      if (pick) placeCard(D, pos.layer, pos.i, pick);
      log(`YOU: patched ${LAYER_NAME[pos.layer]} ${pos.i + 1}`);
    }
  }

  // ---------------- End ----------------
  async function endMatch(winner) {
    const m = M;
    m.over = true; m.winner = winner;
    m.ui = { phase: 'wait', picks: [] };
    if (m.sim) return;
    const opp = m.opp, idx = OPPS.indexOf(opp);
    const rec = recordOf(opp.key);
    let unlockedNew = null;
    if (winner === YOU) {
      rec.w++;
      if (idx + 2 > save.unlocked) { save.unlocked = idx + 2; unlockedNew = OPPS[idx + 1] || null; }
    } else rec.l++;
    save.matches.push({ opp: opp.key, win: winner === YOU, draw: winner === -1, first: m.stats.first, turns: m.stats.turns, moves: m.stats.moves, pickup: m.stats.pickup, when: Date.now() });
    if (save.matches.length > 100) save.matches.shift();
    persist();
    st.result = { win: winner === YOU, draw: winner === -1, opp, stats: m.stats, mine: m.s[YOU].stolen.slice(), theirs: m.s[AI].stolen.slice(), unlockedNew, final: winner === YOU && opp.boss };
    log(winner === YOU ? 'DOWNLOAD COMPLETE' : winner === AI ? 'CONNECTION TERMINATED' : 'DEADLOCK', winner === YOU ? C.cyan : C.red);
    await wait(900);
    if (M !== m) return;
    if (winner === YOU) {
      const lead = Sound.bossWin();
      const dur = riseOut(new Set(), 1.4);
      st.hideAll = true;
      await wait(Math.max(dur, lead * 1000));
    } else {
      Sound.death(); Sound.collapse();
      const dur = fallOut(snapshot(() => true));
      st.hideAll = true;
      await wait(dur);
    }
    if (M !== m) return;
    st.hideAll = false;
    st.mode = 'over';
    st.boardStart = performance.now();
    scenePalette();
    if (winner === YOU) fireworkShow(st.result.final ? 16 : 8, st.result.final ? 220 : 300, 'over');
  }


  // ---------------- AI ----------------
  // Scores every move it can see and takes the best (plus noise), with no peeking:
  // face-down values are guessed from the cards it hasn't seen yet.
  const util = c => isData(c) ? c.v * 0.6 : c.r === 'K' ? 7 : c.r === 'J' ? 3 : 2.5;
  const CONT = 3;   // value of keeping the turn going

  function publicIds() {
    const set = new Set();
    for (const S of M.s) {
      for (const c of S.disc) set.add(c.id);
      for (const c of S.stolen) set.add(c.id);
      for (const c of S.uploads) set.add(c.id);
      for (const layer of LAYERS) for (const cell of S[layer]) {
        if (!cell) continue;
        if (cell.up) set.add(cell.c.id);
        for (const h of cell.held) set.add(h.id);
      }
    }
    return set;
  }
  const FLAT_POOL = [2, 3, 4, 5, 6, 7, 8, 9, 10, 2, 3, 4, 5, 6, 7, 8, 9, 10];
  function aiPool(D, ai) {
    if (!ai.memory) return FLAT_POOL;
    const pub = publicIds();
    const vals = D.all.filter(c => isData(c) && !pub.has(c.id)).map(c => c.v);
    return vals.length ? vals : FLAT_POOL;
  }

  // What removing firewall i opens up: encryption cards that become exposed.
  function fwGain(D, i) {
    let g = 0;
    if (i - 1 >= 0 && D.en[i - 1] && D.fw[i - 1]) g += 2.5;
    if (i <= 4 && D.en[i] && D.fw[i + 1]) g += 2.5;
    return g;
  }
  // What removing encryption i opens up: the storage card behind it.
  function enGain(D, i) {
    const s = D.st[i];
    if (!s) return 0.5;
    if (s.up && isAce(s.c)) return 30;
    if (s.up && isProg(s.c)) return 0.5;
    return 5;
  }
  function aceOdds(A, D) {
    const hidden = D.st.filter(cell => cell && !cell.up).length;
    const left = 2 - A.stolen.length - D.st.filter(cell => cell && cell.up && isAce(cell.c)).length;
    return hidden ? Math.max(0, left) / hidden : 0;
  }

  function aiCandidates(A, D, ai) {
    const out = [];
    const pool = aiPool(D, ai);
    const pLess = t => pool.filter(v => v < t).length / pool.length;
    const datas = uniqBy(sortHand(A.deck.filter(isData)), c => c.v);
    const pAce = aceOdds(A, D);

    // Firewall
    D.fw.forEach((cell, i) => {
      if (!cell) return;
      const held = sum(cell.held);
      for (const c of datas) {
        const tot = c.v + held;
        const p = cell.up ? (tot > cell.c.v ? 1 : 0) : pLess(tot);
        const win = 7 + fwGain(D, i) + CONT - util(c) * 0.3;
        const lose = 0.6 - util(c) * 0.5 + (cell.up ? Math.max(0, 3 - (cell.c.v - tot)) * 0.3 : 0);
        out.push({ type: 'fw', card: c, i, score: p * win + (1 - p) * lose });
      }
    });

    // Encryption
    if (hasExposedEn(D)) {
      const hidden = [];
      D.en.forEach((cell, i) => { if (cell && !cell.up && exposed(D, 'en', i)) hidden.push(i); });
      for (const c of datas) {
        const known = best21(comboItems(D, c));
        let score;
        if (known) score = 9 + known.w + CONT - util(c) * 0.2;
        else {
          let bestP = 0;
          const base = comboItems(D, c);
          for (const h of hidden) {
            let hits = 0;
            for (const v of pool) {
              const r = best21([...base, { v, w: 4, en: h }]);
              if (r && r.pick.some(x => x.en === h)) hits++;
            }
            bestP = Math.max(bestP, hits / pool.length);
          }
          score = bestP * (12 + CONT) + 0.3 - util(c) * 0.6;
        }
        out.push({ type: 'en', card: c, score });
      }
    }

    // Storage
    const sts = storageTargets(D);
    if (sts.length) {
      const burn = A.deck.slice().sort((a, b) => util(a) - util(b))[0];
      for (const i of sts) {
        const cell = D.st[i];
        let score;
        if (cell.up) score = isAce(cell.c) ? 100 : 6;
        else score = pAce * (40 + CONT) - (1 - pAce) * (3 + 9 * ai.caution) - util(burn) * 0.3;
        out.push({ type: 'st', card: burn, i, score });
      }
    }

    // Programs
    for (const c of uniqBy(A.deck.filter(isProg), c => c.r)) {
      if (c.r === 'K') {
        for (const { layer, i } of kingCells(D)) {
          const cell = D[layer][i];
          const s = layer === 'fw'
            ? 6 + fwGain(D, i) + (cell.up ? Math.max(0, cell.c.v - 6) * 0.5 : 1.5) + sum(cell.held) * 0.1
            : 6 + enGain(D, i);
          out.push({ type: 'prog', card: c, t: { layer, i }, score: s + CONT - util(c) * 0.5 });
        }
      }
      if (c.r === 'Q') {
        for (const layer of LAYERS) {
          const n = LAYER_N[layer];
          for (let i = 0; i < n; i++) {
            const a = D[layer][i];
            if (!a || !exposed(D, layer, i)) continue;
            if (layer === 'st') { if (!a.up) out.push({ type: 'prog', card: c, t: { layer, idx: [i] }, score: 1 + 6 * pAce - 1.2 }); continue; }
            const b = i + 1 < n ? D[layer][i + 1] : null;
            const pair = b && exposed(D, layer, i + 1);
            const hid = (a.up ? 0 : 1) + (pair && !b.up ? 1 : 0);
            if (!hid) continue;
            out.push({ type: 'prog', card: c, t: { layer, idx: pair ? [i, i + 1] : [i] }, score: hid * (layer === 'en' ? 1.6 : 1) - 1.2 });
          }
        }
      }
      if (c.r === 'J') {
        // Pull a hidden storage card (or a known ace) into an exposed slot.
        const open = [], covered = [];
        D.st.forEach((cell, i) => {
          if (exposed(D, 'st', i)) { if (!cell || (cell.up && !isAce(cell.c))) open.push(i); }
          else if (cell && (!cell.up || isAce(cell.c))) covered.push(i);
        });
        for (const a of open) for (const b of covered) {
          const s = D.st[b].up ? 30 : 1 + 8 * pAce;
          out.push({ type: 'prog', card: c, t: { layer: 'st', a, b }, score: s - 1 });
        }
      }
    }

    // Nothing useful but something legal: a harmless hot swap, so the turn still has an action.
    if (!out.length) {
      const j = A.deck.find(c => c.r === 'J');
      if (j) out.push({ type: 'prog', card: j, t: { layer: 'fw', a: 0, b: 5 }, score: -5 });
      const q = A.deck.find(c => c.r === 'Q');
      const qc = queenCells(D)[0];
      if (q && qc) out.push({ type: 'prog', card: q, t: { layer: qc.layer, idx: [qc.i] }, score: -5 });
    }
    return out;
  }

  function aiChoose(A, D, ai) {
    const c = aiCandidates(A, D, ai);
    if (!c.length) return null;
    if (Math.random() < ai.rand) return pickR(c);
    let best = null, bs = -Infinity;
    for (const x of c) {
      const s = x.score + (Math.random() - 0.5) * ai.noise * 8;
      if (s > bs) { bs = s; best = x; }
    }
    return best;
  }

  // What the AI is about to do, shown in the center line, and the cells it targets.
  function teleFor(A, D, ch) {
    const t = ch.t || {};
    const cells = ch.type === 'fw' ? [['fw', ch.i]] : ch.type === 'st' ? [['st', ch.i]]
      : ch.type === 'en' ? [] : ch.card.r === 'J' ? [[t.layer, t.a], [t.layer, t.b]]
      : ch.card.r === 'Q' ? t.idx.map(i => [t.layer, i]) : [[t.layer, t.i]];
    const what = ch.type === 'fw' ? `${cardStr(ch.card)} -> FIREWALL ${ch.i + 1}`
      : ch.type === 'en' ? `${cardStr(ch.card)} -> UPLOAD`
      : ch.type === 'st' ? `burn ${cardStr(ch.card)} -> STORAGE ${ch.i + 1}`
      : `run ${cardStr(ch.card)} ${PROG[ch.card.r].name}`;
    return { side: D.idx, cells, upload: ch.type === 'en', text: `${A.name} > ${what}` };
  }

  async function aiAction(A, D) {
    const ai = A.idx === YOU ? AUTO_AI : M.opp.ai;
    const ch = aiChoose(A, D, ai);
    if (!ch) return null;
    M.tele = teleFor(A, D, ch);
    Sound.tick();
    await pace(CONFIG.aiStep);
    M.tele = null;
    if (ch.type === 'fw') return doFirewall(A, D, ch.card, ch.i);
    if (ch.type === 'st') return doStorage(A, D, ch.card, ch.i);
    if (ch.type === 'prog') return doProgram(A, D, ch.card, ch.t);
    await doUpload(A, D, ch.card);
    // Flip the hidden exposed encryption card most likely to complete a 21.
    const pool = aiPool(D, ai);
    let bestI = -1, bestP = -1;
    D.en.forEach((cell, i) => {
      if (!cell || cell.up || !exposed(D, 'en', i)) return;
      const base = comboItems(D);
      const p = pool.filter(v => { const r = best21([...base, { v, w: 4, en: i }]); return r && r.pick.some(x => x.en === i); }).length / pool.length;
      if (p > bestP) { bestP = p; bestI = i; }
    });
    if (bestI >= 0) await revealCell(D, 'en', bestI);
    const r = best21(comboItems(D));
    if (r) return doEncRemove(A, D, r.pick.map(x => x.en != null ? { en: x.en } : { up: x.up }));
    log(`${A.name}: no 21`, C.mid);
    await pace(300);
    return false;
  }

  // How exposed a side's aces are (higher = worse for that side).
  function danger(S) {
    let d = 0;
    S.st.forEach((cell, i) => {
      if (!cell || !isAce(cell.c)) return;
      let x = cell.up ? 6 : 0;
      if (exposed(S, 'st', i)) x += 10;
      else if (exposed(S, 'en', i)) x += 4 + (S.en[i].up ? 1 : 0);
      else for (const f of [S.fw[i], S.fw[i + 1]]) x += f ? (f.up ? (10 - f.c.v) * 0.12 : 0.3) : 1;
      d += x;
    });
    return d;
  }

  async function aiDefense(D, A, prog) {
    await pace(CONFIG.aiStep * 0.7);
    if (prog.r === 'J') {
      let best = null, bd = danger(D) - 0.01;
      for (const layer of LAYERS) {
        const row = D[layer], n = row.length;
        for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) {
          [row[a], row[b]] = [row[b], row[a]];
          const d = danger(D);
          [row[a], row[b]] = [row[b], row[a]];
          if (d < bd) { bd = d; best = { layer, a, b }; }
        }
      }
      if (best) { swapCells(D, best.layer, best.a, best.b); log(`${D.name}: hot swap ${LAYER_TAG[best.layer]} ${best.a + 1} <-> ${best.b + 1}`); await pace(400); }
      else log(`${D.name}: lets it ride`, C.mid);
      return;
    }
    if (prog.r === 'Q') {
      // Look for your aces: the storage card closest to being exposed; else encryption pairs.
      let target = null;
      const st = A.st.map((cell, i) => ({ cell, i })).filter(x => x.cell && !x.cell.up);
      st.sort((x, y) => (exposed(A, 'st', y.i) - exposed(A, 'st', x.i)) || (exposed(A, 'en', y.i) - exposed(A, 'en', x.i)));
      if (st.length) target = { layer: 'st', idx: [st[0].i] };
      else for (const layer of ['en', 'fw']) {
        const row = A[layer];
        for (let i = 0; i < row.length - 1 && !target; i++) if (row[i] && row[i + 1] && (!row[i].up || !row[i + 1].up)) target = { layer, idx: [i, i + 1] };
        if (target) break;
      }
      if (!target) { log(`${D.name}: nothing left to query`, C.mid); return; }
      log(`${D.name}: query ${LAYER_NAME[target.layer]} ${target.idx.map(i => i + 1).join('+')}`);
      for (const i of target.idx) await revealCell(A, target.layer, i);
      return;
    }
    // K: patch the spot that best protects the aces.
    const cards = [...D.disc, ...D.deck];
    let best = null;
    for (const layer of LAYERS) for (let i = 0; i < D[layer].length; i++) {
      const saved = D[layer][i];
      if (saved && isAce(saved.c)) continue;
      const legal = cards.filter(c => canPatch(c, layer));
      const rep = layer === 'st' ? (legal.find(c => c.r === 'J') || legal.find(isProg) || null)
        : legal.filter(isData).sort((a, b) => b.v - a.v)[0] || null;
      D[layer][i] = rep ? { c: rep, up: false, held: [] } : null;
      let score = -danger(D);
      D[layer][i] = saved;
      if (saved && saved.c === prog) score += 1.5;
      if (saved && saved.up && isProg(saved.c) && rep) score += 0.5;
      if (rep && D.deck.includes(rep)) score -= util(rep) * 0.08;
      if (!saved && !rep) score -= 1;
      if (saved && rep === null) score -= 0.3;
      score += Math.random() * 0.1;
      if (!best || score > best.score) best = { score, layer, i, rep };
    }
    if (!best) return;
    const cell = D[best.layer][best.i];
    if (cell) takeOut(D, best.layer, best.i, isProg(cell.c) || cell.c.v >= 6 ? 'deck' : 'disc');
    if (best.rep) placeCard(D, best.layer, best.i, best.rep);
    log(`${D.name}: patched ${LAYER_NAME[best.layer]} ${best.i + 1}`);
    await pace(400);
  }


  // ---------------- Drawing cards ----------------
  // A card is 5 x 3 characters:  +---+   back: +---+   empty slot: .   .
  //                              | 7♥|         |///|
  //                              +---+         +---+               '   '
  // look: up (face up) | back (their hidden card) | own (your hidden card: you know it) | dim
  function drawCard(put, x, y, card, look, now = 0, t0 = 0, frameCol = null) {
    if (look === 'back') {
      const fc = frameCol || C.mid;
      put(x, y, '+---+', fc); put(x, y + 2, '+---+', fc);
      put(x, y + 1, '|', fc); put(x + 4, y + 1, '|', fc);
      put(x + 1, y + 1, '///', C.dim, false, true);
      return;
    }
    const flipping = now && now - t0 < CONFIG.flipMs;
    const fc = frameCol || (flipping ? C.cyan : look === 'up' ? C.text : C.mid);
    put(x, y, '+---+', fc); put(x, y + 2, '+---+', fc);
    put(x, y + 1, '|', fc); put(x + 4, y + 1, '|', fc);
    if (flipping) { put(x + 1, y + 1, noiseCh() + noiseCh() + noiseCh(), C.cyan, false, true); return; }
    const lab = label3(card);
    const bright = look === 'up';
    put(x + 1, y + 1, lab.slice(0, 2), bright ? C.bright : look === 'dim' ? C.mid : C.text, bright, true);
    put(x + 3, y + 1, lab[2], bright ? suitCol(card) : C.mid, bright, true);
  }
  function drawSlot(put, x, y) {
    put(x, y, '.   .', C.dim);
    put(x, y + 2, "'   '", C.dim);
  }

  function cardInfo(c) {
    if (isAce(c)) return `${cardStr(c)} TARGET: keep it hidden. lose both and you lose`;
    if (isProg(c)) return `${cardStr(c)} ${PROG[c.r].name}: ${PROG[c.r].atk}`;
    return `${cardStr(c)} DATA ${c.v}`;
  }
  function cellInfo(side, layer, i) {
    const S = M.s[side], cell = S[layer][i];
    const where = `${side === YOU ? 'YOUR' : 'THEIR'} ${LAYER_TAG[layer]}${i + 1}`;
    if (!cell) return `${where}: empty`;
    const ex = exposed(S, layer, i) ? 'exposed' : 'covered';
    const known = side === YOU || cell.up;
    let s = `${where}: ${known ? cardStr(cell.c) : 'face down'} ${ex}${side === YOU ? (cell.up ? ', revealed' : ', hidden') : ''}`;
    if (known && isProg(cell.c)) s += ` // ${PROG[cell.c.r].name}`;
    if (cell.held.length) s += ` // held ${cell.held.map(cardStr).join('+')} = ${sum(cell.held)}`;
    return s;
  }

  // ---------------- What you can tap right now ----------------
  // Built every frame from the UI phase: tappable cells, uploads, deck cards, buttons.
  const cellId = (side, layer, i) => `c:${side}:${layer}:${i}`;
  function uiTargets() {
    const T = { cells: new Map(), ups: new Map(), upBox: null, hand: new Map(), btns: [], hint: '', sel: new Set(), handList: null, center: null };
    if (!M) return T;
    if (st.mode === 'setup') return setupTargets(T);
    const ui = M.ui;
    if (!ui || M.over) return T;
    const me = M.s[YOU], op = M.s[AI];
    const done = v => finish(v);
    ui.picks.forEach(p => T.sel.add(p.id));
    const pickCell = (side, layer, i) => ({ id: cellId(side, layer, i), layer, i });
    // Two positions in one layer (hot swap). empty = empty positions count.
    const pairTargets = (side, onDone) => {
      const S = M.s[side], first = ui.picks[0];
      for (const layer of LAYERS) for (let i = 0; i < LAYER_N[layer]; i++) {
        if (first && (first.layer !== layer || first.i === i)) continue;
        T.cells.set(cellId(side, layer, i), () => {
          if (!first) { ui.picks.push(pickCell(side, layer, i)); Sound.tick(); }
          else onDone({ layer, a: first.i, b: i });
        });
      }
      return S;
    };
    // One card, or two side by side in one layer (query). ok(layer, i) says which count.
    const queryTargets = (side, ok, singleLayers, onDone) => {
      const S = M.s[side], first = ui.picks[0];
      for (const layer of LAYERS) for (let i = 0; i < LAYER_N[layer]; i++) {
        if (!S[layer][i] || !ok(layer, i)) continue;
        if (first && (first.layer !== layer || Math.abs(first.i - i) !== 1)) continue;
        T.cells.set(cellId(side, layer, i), () => {
          if (first) return onDone({ layer, idx: [first.i, i].sort((a, b) => a - b) });
          if (singleLayers.includes(layer)) return onDone({ layer, idx: [i] });
          ui.picks.push(pickCell(side, layer, i)); Sound.tick();
        });
      }
      if (first) T.btns.push({ text: '[REVEAL 1]', fn: () => onDone({ layer: first.layer, idx: [first.i] }) });
    };

    switch (ui.phase) {
      case 'pick': {
        for (const c of me.deck) if (usable(me, op, c)) T.hand.set(c.id, () => { ui.sel = ui.sel === c ? null : c; ui.mode = null; ui.picks = []; Sound.tick(); });
        const c = ui.sel;
        T.center = M.again ? '>> BREACH! ACT AGAIN <<' : '>> YOUR MOVE <<';
        if (!c) { T.hint = 'pick an attack card from your deck'; break; }
        T.sel.add('h:' + c.id);
        const back = () => { ui.mode = null; ui.picks = []; Sound.tick(); };
        if (!ui.mode) {
          const u = cardUses(me, op, c);
          if (u.fw) op.fw.forEach((cell, i) => { if (cell) T.cells.set(cellId(AI, 'fw', i), () => done({ type: 'fw', card: c, i })); });
          if (u.en) T.upBox = () => done({ type: 'en', card: c });
          if (u.st) storageTargets(op).forEach(i => T.cells.set(cellId(AI, 'st', i), () => done({ type: 'st', card: c, i })));
          if (u.run) T.btns.push({ text: `[RUN ${PROG[c.r].name}]`, fn: () => { ui.mode = c.r; ui.picks = []; Sound.tick(); } });
          T.btns.push({ text: '[CANCEL]', fn: () => { ui.sel = null; Sound.tick(); } });
          const opts = [u.fw && 'hit a firewall card', u.en && 'upload it', u.st && 'burn it on exposed storage'].filter(Boolean);
          T.hint = isProg(c) ? `${PROG[c.r].name}: ${PROG[c.r].atk}` : opts.join(', ');
        } else if (ui.mode === 'J') {
          pairTargets(AI, t => done({ type: 'prog', card: c, t }));
          T.hint = ui.picks.length ? 'pick a second position in the same layer' : 'HOT SWAP: pick a position on their server';
          T.btns.push({ text: '[BACK]', fn: back });
        } else if (ui.mode === 'Q') {
          queryTargets(AI, (layer, i) => exposed(op, layer, i), ['st'], t => done({ type: 'prog', card: c, t }));
          T.hint = ui.picks.length ? 'pick an adjacent exposed card, or reveal just one' : 'QUERY: pick an exposed card to reveal';
          T.btns.push({ text: '[BACK]', fn: back });
        } else if (ui.mode === 'K') {
          kingCells(op).forEach(({ layer, i }) => T.cells.set(cellId(AI, layer, i), () => done({ type: 'prog', card: c, t: { layer, i } })));
          T.hint = 'PATCH: remove a firewall card or an exposed encryption card';
          T.btns.push({ text: '[BACK]', fn: back });
        }
        break;
      }
      case 'encReveal':
        op.en.forEach((cell, i) => { if (cell && !cell.up && exposed(op, 'en', i)) T.cells.set(cellId(AI, 'en', i), () => done(i)); });
        T.btns.push({ text: '[SKIP]', fn: () => done(null) });
        T.center = '>> FLIP AN ENCRYPTION CARD <<';
        T.hint = 'you may flip one exposed encryption card';
        break;
      case 'encCombo': {
        const total = ui.picks.reduce((s, p) => s + p.v, 0);
        const toggle = p => () => {
          const k = ui.picks.findIndex(x => x.id === p.id);
          if (k >= 0) ui.picks.splice(k, 1); else ui.picks.push(p);
          Sound.tick();
        };
        op.uploads.forEach(c => T.ups.set(c.id, toggle({ id: 'u:' + c.id, v: c.v, up: c })));
        op.en.forEach((cell, i) => { if (cell && cell.up && exposed(op, 'en', i)) T.cells.set(cellId(AI, 'en', i), toggle({ id: cellId(AI, 'en', i), v: cell.c.v, en: i })); });
        T.btns.push({ text: `[CRACK ${total}/21]`, disabled: total !== 21, fn: () => done(ui.picks.map(p => p.up ? { up: p.up } : { en: p.en })) });
        T.btns.push({ text: '[END TURN]', fn: () => done([]) });
        T.center = '>> MAKE 21 <<';
        T.hint = 'pick uploads + face-up exposed encryption cards that total 21';
        break;
      }
      case 'defJ':
        pairTargets(YOU, t => done(t));
        T.btns.push({ text: '[SKIP]', fn: () => done(null) });
        T.center = '!! HONEYPOT: HOT SWAP !!';
        T.hint = ui.picks.length ? 'pick a second position in the same layer' : 'swap two positions in one layer of your server';
        break;
      case 'defQ':
        queryTargets(AI, () => true, ['st'], t => done(t));
        T.btns.push({ text: '[SKIP]', fn: () => done(null) });
        T.center = '!! HONEYPOT: QUERY !!';
        T.hint = ui.picks.length ? 'pick an adjacent card, or reveal just one' : 'reveal a card on their server';
        break;
      case 'defK1':
        for (const layer of LAYERS) me[layer].forEach((cell, i) => { if (!(cell && isAce(cell.c))) T.cells.set(cellId(YOU, layer, i), () => done({ layer, i })); });
        T.btns.push({ text: '[SKIP]', fn: () => done(null) });
        T.center = '!! HONEYPOT: PATCH !!';
        T.hint = 'pick a position on your server (not an ace)';
        break;
      case 'defK2': {
        const c = me[ui.pos.layer][ui.pos.i].c;
        T.sel.add(cellId(YOU, ui.pos.layer, ui.pos.i));
        T.btns.push({ text: '[TO DECK]', fn: () => done('deck') });
        T.btns.push({ text: '[DISCARD]', fn: () => done('disc') });
        T.center = '!! HONEYPOT: PATCH !!';
        T.hint = `send ${cardStr(c)} to your attack deck or your discard pile`;
        break;
      }
      case 'defK3': {
        const { layer, i } = ui.pos;
        T.sel.add(cellId(YOU, layer, i));
        const deck = sortHand(me.deck.filter(c => canPatch(c, layer)));
        const disc = sortHand(me.disc.filter(c => canPatch(c, layer)));
        T.handList = [...deck, ...disc];
        T.discFrom = deck.length;
        T.handList.forEach(c => T.hand.set(c.id, () => done(c)));
        T.btns.push({ text: '[LEAVE EMPTY]', fn: () => done(null) });
        T.center = '!! HONEYPOT: PATCH !!';
        T.hint = T.handList.length ? 'fill the slot from your deck or discard (dim)' : 'no card fits there';
        break;
      }
    }
    return T;
  }

  // ---------------- Match board ----------------
  function buildMatch(ctx) {
    const { now, put, putC, putR, bg, addHit } = ctx;
    const T = uiTargets();
    const pulse = (Math.sin(now / 260) + 1) / 2;
    const setup = st.mode === 'setup';

    // Header
    put(0, 0, 'HACKJACK', C.cyan, true);
    put(10, 0, '[MENU]', st.overlay ? C.cyan : C.mid);
    addHit(10, 0, 6, 1, { kind: 'btn', id: 'menu', onTap: openPause, noFocus: true });
    const idx = OPPS.indexOf(M.opp);
    putR(0, `${pad2(idx + 1)}/${pad2(OPPS.length)} ${M.opp.name}`, M.opp.boss ? C.red : C.mid);
    put(0, 1, rule(WC), C.dim);

    for (const side of [AI, YOU]) drawSideInfo(ctx, side);
    if (st.msg) put(0, 3, st.msg.slice(0, Math.floor((now - st.msgT) / 14)).slice(0, WC), st.msgCol || C.text);

    for (const side of [AI, YOU]) drawServer(ctx, side, T, pulse, setup);

    // Center line
    const cy = CENTER_Y;
    const bn = M.banner, bAge = bn ? now - bn.t0 : 1e9;
    if (setup) {
      const txt = '[ L O C K   I N ]';
      const x = Math.floor((WC - txt.length) / 2);
      bg(x, cy, txt.length, C.cyan, 0.15 + 0.15 * pulse);
      put(x, cy, txt, C.bright, true);
      addHit(x, cy, txt.length, 1, { kind: 'btn', id: 'lock', onTap: lockIn, info: 'start the match with this server' });
    } else {
      put(0, cy, 'T' + pad2(M.turnNo), C.dim);
      let text = '', col = C.mid;
      if (M.ping) {
        const p = M.ping, rolling = !p.done;
        const a = rolling ? noiseCh() + noiseCh() : cardStr(p.mine), b = rolling ? noiseCh() + noiseCh() : cardStr(p.theirs);
        text = `PING  you drew ${a}  //  they drew ${b}`;
        col = C.cyan;
      } else if (M.tele) { text = M.tele.text; col = C.bright; }
      else if (bAge < CONFIG.bannerMs) {
        text = bn.side === YOU ? '>>  YOUR TURN  <<' : `<<  ${M.opp.name}'S TURN  >>`;
        col = bn.side === YOU ? C.cyan : C.red;
        bg(0, cy, WC, col, 0.25 * (1 - bAge / CONFIG.bannerMs));
      } else if (T.center) { text = T.center; col = Math.floor(now / 450) % 2 ? C.cyan : C.bright; }
      else if (M.turn === AI && !M.over) { text = `.. ${M.opp.name} ..`; col = C.mid; }
      if (text) putC(cy, text.slice(0, WC - 8), col, true);
      if (M.turn === AI && !M.over && !M.ping && M.ui.phase === 'wait') putR(cy, st.ff ? '>>>' : 'tap >>', C.dim);
    }

    drawHand(ctx, T, setup);

    // Buttons
    if (setup) T.btns = setupButtons();
    if (T.btns.length) {
      const w = T.btns.reduce((s, b) => s + b.text.length, 0) + (T.btns.length - 1) * 2;
      let x = Math.floor((WC - w) / 2);
      for (const b of T.btns) {
        if (b.sel) bg(x, BTN_Y, b.text.length, C.cyan, 0.25);
        put(x, BTN_Y, b.text, b.disabled ? C.dim : b.sel ? C.cyan : C.bright);
        if (!b.disabled) addHit(x, BTN_Y, b.text.length, 1, { kind: 'btn', id: 'b:' + b.text, onTap: b.fn, info: b.info });
        x += b.text.length + 2;
      }
    }

    // Info line: what's under the pointer, else the hint.
    const info = ctx.hoverInfo || T.hint;
    if (info) putC(HINT_Y, info.slice(0, WC), ctx.hoverInfo ? C.text : C.mid);
    put(0, HC - 1, setup ? 'setup' : `you ${M.s[YOU].stolen.length}/2  them ${M.s[AI].stolen.length}/2`, C.dim);
    putR(HC - 1, `hackjack ${VERSION}`, C.dim);
  }

  function drawSideInfo(ctx, side) {
    const { put, putR, addHit } = ctx;
    const S = M.s[side], y = INFO_ROW[side];
    const name = side === YOU ? 'YOU' : M.opp.name;
    put(0, y, name, side === YOU ? C.red : C.cyan, true);
    let x = name.length + 1;
    S.suits.forEach((s, k) => put(x + k, y, s, isRedSuit(s) ? C.red : C.bright));
    x += 4;
    const deck = `deck ${pad2(S.deck.length)}`, disc = `disc ${pad2(S.disc.length)}`;
    put(x, y, deck, C.mid);
    addHit(x, y, deck.length, 1, { kind: 'info', id: 'deck' + side, info: side === YOU ? `your attack deck: ${S.deck.length} cards` : `their attack deck: ${S.deck.length} cards, face down` });
    x += deck.length + 2;
    put(x, y, disc, C.mid);
    addHit(x, y, disc.length, 1, { kind: 'info', id: 'disc' + side, info: S.disc.length ? `discard: ${sortHand(S.disc).map(cardStr).join(' ')}` : 'discard: empty' });
    // Loot: the aces this side has downloaded.
    const slots = [0, 1].map(k => S.stolen[k]);
    let rx = WC - 10;
    put(rx - 5, y, 'LOOT', C.dim);
    slots.forEach((c, k) => {
      const sx = rx + k * 5;
      if (c) { put(sx, y, '[', C.gold); put(sx + 1, y, cardStr(c), suitCol(c), true); put(sx + 3, y, ']', C.gold); }
      else put(sx, y, '[  ]', C.dim);
    });
  }

  function drawServer(ctx, side, T, pulse, setup) {
    const { now, put, bg, addHit } = ctx;
    const S = M.s[side], R = ROWS[side];
    const tele = M.tele && M.tele.side === side ? M.tele : null;
    const sw = M.swapFx && M.swapFx.side === side && now - M.swapFx.t0 < 350 ? M.swapFx : null;
    for (const layer of LAYERS) {
      const y = R[layer];
      put(0, y + 1, LAYER_TAG[layer], C.dim);
      for (let i = 0; i < LAYER_N[layer]; i++) {
        const x = posX(layer, i), cell = S[layer][i];
        const id = cellId(side, layer, i);
        const fn = T.cells.get(id);
        const picked = T.sel.has(id);
        if (picked) bg(x, y, 5, C.cyan, 0.4, 3);
        else if (fn && !T.quiet) bg(x, y, 5, C.cyan, 0.1 + 0.12 * pulse, 3);
        if (tele && tele.cells.some(([l, k]) => l === layer && k === i)) bg(x, y, 5, C.red, 0.18 + 0.2 * pulse, 3);
        if (sw && sw.layer === layer && (sw.a === i || sw.b === i)) {
          for (let r = 0; r < 3; r++) put(x, y + r, noiseCh() + noiseCh() + noiseCh() + noiseCh() + noiseCh(), C.cyan);
        } else if (cell) {
          const look = cell.up ? 'up' : side === AI ? 'back' : 'own';
          drawCard(put, x, y, cell.c, look, now, cell.t, picked ? C.cyan : null);
          if (cell.incoming) put(x + 1, side === AI ? y + 3 : y - 1, cardStr(cell.incoming), suitCol(cell.incoming), true);
        } else drawSlot(put, x, y);
        addHit(x, y, 5, 3, { kind: fn ? 'btn' : 'info', id, onTap: fn, info: setup ? (cell ? `${cardInfo(cell.c)} // tap to swap` : '') : cellInfo(side, layer, i), noMark: true });
      }
    }
    // Held attack cards on the firewall, shown as their total.
    S.fw.forEach((cell, i) => {
      if (!cell || !cell.held.length) return;
      const s = '+' + sum(cell.held);
      put(posX('fw', i) + Math.floor((5 - s.length) / 2), R.held, s, side === AI ? C.red : C.bright, true);
    });
    if (!setup) drawUploads(ctx, side, T, pulse);
  }

  function drawUploads(ctx, side, T, pulse) {
    const { put, bg, addHit } = ctx;
    const S = M.s[side], y = ROWS[side].en, x = UPX;
    const fn = side === AI ? T.upBox : null;
    const tele = M.tele && M.tele.side === side && M.tele.upload;
    if (fn) bg(x - 1, y, 13, C.cyan, 0.1 + 0.12 * pulse, 3);
    if (tele) bg(x - 1, y, 13, C.red, 0.18 + 0.2 * pulse, 3);
    put(x, y, 'UPLOAD', fn ? C.cyan : C.dim);
    if (S.uploads.length) { const t = 'Σ' + sum(S.uploads); put(x + 12 - t.length, y, t, C.mid); }
    addHit(x - 1, y, 13, 3, { kind: fn ? 'btn' : 'info', id: 'ub:' + side, onTap: fn, info: `upload area: ${S.uploads.length ? S.uploads.map(cardStr).join(' ') : 'empty'}`, noMark: true });
    if (!S.uploads.length) put(x, y + 1, '. . .', C.dim);
    S.uploads.slice(0, 6).forEach((c, k) => {
      const { cx, cy } = uploadXY(side, k);
      const id = 'u:' + c.id, tf = T.ups.get(c.id);
      if (T.sel.has(id)) bg(cx, cy, 3, C.cyan, 0.45);
      else if (tf) bg(cx, cy, 3, C.cyan, 0.12 + 0.12 * pulse);
      put(cx, cy, cardStr(c), suitCol(c), true);
      addHit(cx, cy, 3, 1, { kind: tf ? 'btn' : 'info', id, onTap: tf, info: `uploaded ${cardStr(c)} (${c.owner === YOU ? 'yours' : 'theirs'})`, noMark: true });
    });
    if (S.uploads.length > 6) put(x + 9, y + 2, '+' + (S.uploads.length - 6), C.mid);
  }

  function drawHand(ctx, T, setup) {
    const { now, put, putC, addHit } = ctx;
    const me = M.s[YOU];
    const list = T.handList || sortHand(me.deck);
    const n = list.length;
    if (!n) { putC(HAND_Y + 1, T.handList ? '-- nothing fits --' : '-- attack deck empty --', C.dim); return; }
    const step = n <= 13 ? 4 : Math.max(2, Math.floor((WC - 6) / (n - 1)));
    const w = step * (n - 1) + 5;
    const x0 = Math.floor((WC - w) / 2);
    const picking = M.ui && M.ui.phase === 'pick';
    const order = list.map((c, k) => k);
    const selK = list.findIndex(c => T.sel.has('h:' + c.id));
    if (selK >= 0) { order.splice(selK, 1); order.push(selK); }   // the lifted card draws on top
    for (const k of order) {
      const c = list[k];
      const id = 'h:' + c.id;
      const fn = T.hand.get(c.id);
      const sel = T.sel.has(id);
      const fromDisc = T.discFrom != null && k >= T.discFrom;
      const y = HAND_Y - (sel ? 1 : 0);
      const x = x0 + k * step;
      const live = setup || fn || !picking;
      drawCard(put, x, y, c, live && !fromDisc ? 'up' : 'dim', 0, 0, sel ? C.cyan : null);
      addHit(x, y, k === n - 1 || sel ? 5 : step, sel ? 4 : 3, { kind: fn ? 'btn' : 'info', id, onTap: fn, info: setup ? `${cardInfo(c)} // tap to swap` : cardInfo(c) + (fromDisc ? ' (from discard)' : ''), noMark: true });
    }
  }


  // ---------------- Setup ----------------
  // Your server starts from a build; tap two cards to swap them (if both fit their new spots).
  const setupFits = (c, where) => where === 'fw' || where === 'en' ? isData(c) : where === 'st' ? (isAce(c) || isProg(c)) : !isAce(c);
  function setupCard(loc) {
    const me = M.s[YOU];
    return loc.layer === 'deck' ? loc.card : me[loc.layer][loc.i].c;
  }
  function setupTap(loc) {
    const me = M.s[YOU], a = st.setupSel;
    if (!a) { st.setupSel = loc; Sound.tick(); return; }
    st.setupSel = null;
    if (a.id === loc.id) { Sound.tick(); return; }
    const ca = setupCard(a), cb = setupCard(loc);
    if (!setupFits(ca, loc.layer) || !setupFits(cb, a.layer)) {
      Sound.deny();
      setMsg(`${cardStr(isAce(ca) || isAce(cb) ? (isAce(ca) ? ca : cb) : ca)} can't go there`, C.red);
      return;
    }
    const put = (l, c) => { if (l.layer === 'deck') me.deck[me.deck.indexOf(l.card)] = c; else me[l.layer][l.i].c = c; };
    put(a, cb); put(loc, ca);
    Sound.swap();
    setMsg(`swapped ${cardStr(ca)} and ${cardStr(cb)}`, C.cyan);
  }
  function setupTargets(T) {
    const me = M.s[YOU];
    if (st.setupSel) T.sel.add(st.setupSel.id);
    for (const layer of LAYERS) me[layer].forEach((cell, i) => {
      const id = cellId(YOU, layer, i);
      T.cells.set(id, () => setupTap({ id, layer, i }));
    });
    me.deck.forEach(c => T.hand.set(c.id, () => setupTap({ id: 'h:' + c.id, layer: 'deck', card: c })));
    T.quiet = true;
    T.hint = 'FW/EN take data 2-10 // ST takes aces + programs';
    return T;
  }
  function setupButtons() {
    const b = (text, style) => ({ text, sel: st.setupStyle === style, fn: () => { layoutServer(M.s[YOU], style); st.setupStyle = style; st.setupSel = null; Sound.deal(); setMsg(`${style} build`, C.cyan); },
      info: { balanced: 'strength spread across firewall, encryption and deck', fortress: 'best cards in the firewall, weak attack deck', aggro: 'best cards in your attack deck', random: 'shuffle everything' }[style] });
    return [b('[BALANCED]', 'balanced'), b('[FORTRESS]', 'fortress'), b('[AGGRO]', 'aggro'), b('[RANDOM]', 'random')];
  }
  function startSetup(opp) {
    st.opp = opp;
    M = newMatch(opp);
    layoutServer(M.s[YOU], 'balanced');
    layoutServer(M.s[AI], opp.ai.setup);
    st.setupStyle = 'balanced'; st.setupSel = null;
    st.mode = 'setup';
    scenePalette();
    setMsg('build your server: tap two cards to swap them', C.text);
  }
  function lockIn() {
    swapTo(() => {
      st.mode = 'match';
      setMsg(`connecting to ${M.opp.name}...`, C.mid);
      runMatch();
    }, 1);
  }

  // ---------------- Text screens ----------------
  // Lines: { text, col, bold, colorAt, left } | { box, text, sub, id, onTap } | { row: [buttons], gap }
  //        | { text, id, onTap } (button) | { list, name, right, id, onTap } | { cards: [card|null], look }
  const HX = 2, HELP_W = 50;
  function buildTextBoard(ctx, lines) {
    const { now, put, bg, addHit } = ctx;
    const hOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.cards ? 3 : 1;
    const total = lines.reduce((s, ln) => s + hOf(ln), 0);
    let y = Math.max(0, Math.floor((HC - 1 - total) / 2));
    const btnCol = b => b.disabled ? C.dim : b.sel ? C.cyan : b.col || C.bright;
    for (const ln of lines) {
      if (ln.box) drawBox(ctx, y, ln);
      else if (ln.cards) {
        let x = Math.floor((WC - (ln.cards.length * 6 - 1)) / 2);
        for (const c of ln.cards) { if (c) drawCard(put, x, y, c, ln.look || 'up'); else drawSlot(put, x, y); x += 6; }
      } else if (ln.list) {
        const LW = 34, x = Math.floor((WC - LW) / 2);
        if (ln.sel) put(x - 2, y, '>', C.cyan, true);
        put(x + 1, y, ln.name, ln.faded ? C.mid : (ln.col || C.bright));
        if (ln.right) put(x + LW - 1 - ln.right.length, y, ln.right, ln.faded ? C.dim : (ln.rightCol || C.mid));
        if (ln.id) addHit(x, y, LW, 1, { kind: ln.onTap ? 'btn' : 'info', id: ln.id, onTap: ln.onTap, info: ln.info });
      } else if (ln.row) {
        const gap = ln.gap != null ? ln.gap : 2;
        const w = ln.row.reduce((s, b) => s + b.text.length, 0) + (ln.row.length - 1) * gap;
        let x = Math.floor((WC - w) / 2);
        for (const b of ln.row) {
          if (!b.id) put(x, y, b.text, b.col || C.dim);
          else {
            if (b.sel) bg(x, y, b.text.length, C.cyan, 0.22);
            put(x, y, b.text, btnCol(b), !!b.sel);
            if (!b.disabled) addHit(x, y, b.text.length, 1, { kind: 'btn', id: b.id, onTap: b.onTap });
          }
          x += b.text.length + gap;
        }
      } else if (ln.id) {
        const x = Math.floor((WC - ln.text.length) / 2);
        put(x, y, ln.text, btnCol(ln));
        if (!ln.disabled) addHit(x, y, ln.text.length, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.text) {
        const x = ln.left ? HX : Math.floor((WC - ln.text.length) / 2);
        if (ln.colorAt) { for (let i = 0; i < ln.text.length; i++) if (ln.text[i] !== ' ') put(x + i, y, ln.text[i], ln.colorAt(i), !!ln.bold); }
        else put(x, y, ln.text, ln.col || C.text, !!ln.bold);
      }
      y += hOf(ln);
    }
  }

  function drawBox(ctx, y, ln) {
    const { now, put, addHit } = ctx;
    const label = ln.text, sub = ln.sub || '';
    const w = Math.max(ln.minW || 24, Math.max(label.length, sub.length) + 8);
    const x = Math.floor((WC - w) / 2);
    const h = sub ? 4 : 3;
    const pulse = (Math.sin(now / 420) + 1) / 2;
    const fcol = C.cyan, lcol = pulse > 0.85 ? C.bright : C.cyan;
    let edge = '+' + '='.repeat(w - 2) + '+';
    if (((now / 1000 + y * 0.37) % 3.2) < 0.07) {
      const i = 1 + Math.floor(Math.random() * (w - 2));
      edge = edge.slice(0, i) + noiseCh() + edge.slice(i + 1);
    }
    put(x, y, edge, fcol, true);
    for (let r = 1; r < h - 1; r++) { put(x, y + r, '|', fcol, true); put(x + w - 1, y + r, '|', fcol, true); }
    put(x + Math.floor((w - label.length) / 2), y + 1, label, lcol, true);
    if (sub) put(x + Math.floor((w - sub.length) / 2), y + 2, sub, C.mid);
    put(x, y + h - 1, '+' + '='.repeat(w - 2) + '+', fcol, true);
    addHit(x, y, w, h, { kind: 'btn', id: ln.id, onTap: ln.onTap });
  }

  // Title art: two aces, red over black, with live bits.
  const CARD_ART = [
    '+-----------+',
    '|A          |',
    '|S  .---.   |',
    '|  / b b \\  |',
    '|  | b b |  |',
    '|  \\ b b /  |',
    "|   '---'  S|",
    '|          A|',
    '+-----------+',
  ];
  function coverLines(now) {
    const W2 = 13 + 8, H2 = CARD_ART.length + 1;
    const grid = Array.from({ length: H2 }, () => Array(W2).fill(null));
    const stamp = (ox, oy, suit, col) => CARD_ART.forEach((row, r) => [...row].forEach((ch, c) => {
      let out = ch === 'S' ? suit : ch === 'b' ? (Math.random() < 0.02 || ((now / 300 + r * 3 + c) | 0) % 7 === 0 ? '1' : '0') : ch;

    stamp(0, 1, '♥', C.red);
    const glitch = (now / 1000 % 3.3) < 0.1 ? Math.floor(now / 50) % H2 : -1;
    return grid.map((row, r) => {
      const text = row.map(x => x ? (r === glitch && Math.random() < 0.3 ? noiseCh() : x.ch) : ' ').join('');
      return { text, colorAt: i => row[i] ? row[i].col : C.dim };
    });
  }

    const Cc = ['  ___ ', ' / __|', '| (__ ', ' \\___|'];
    const K = [' _  __', '| |/ /', "| ' < ", '|_|\\_\\'];
    const J = ['    _ ', ' _ | |', '| || |', ' \\__/ '];

  // ---------------- Scene ----------------
  let hits = [];
  let bgs = [];
  const decodeDelay = (cx, cy) => 40 + ((((Math.round(cx * 2) + 1) * 374761393) ^ ((Math.round(cy * 2) + 1) * 668265263)) >>> 0) % 380;

  function buildScene(now, collectHits, raw = false) {
    let cells = [];
    const frameBgs = [];
    const localHits = [];
    const put = (cx, cy, str, col, bold = false, opaque = false) => {
      for (let k = 0; k < str.length; k++) if (str[k] !== ' ' || opaque) cells.push({ ch: str[k], cx: cx + k, cy, col, bold });
    };
    const putC = (cy, str, col, bold) => put(Math.floor((WC - str.length) / 2), cy, str, col, bold);
    const putR = (cy, str, col, bold) => put(WC - str.length, cy, str, col, bold);
    const bg = (cx, cy, w, col, alpha, h = 1) => { for (let r = 0; r < h; r++) frameBgs.push({ cx, cy: cy + r, w, col, alpha }); };
    const ctx = { now, put, putC, putR, bg, hoverInfo: null };
    ctx.addHit = (cx, cy, w, h, hit) => {
      localHits.push(Object.assign({ cx, cy, cw: w, ch: h }, hit));
      if (hit.id === st.hoverId && hit.info) ctx.hoverInfo = hit.info;
    };

    if (!st.hideAll) {
      if (st.overlay && M) buildTextBoard(ctx, overlayLines());
      else if ((st.mode === 'match' || st.mode === 'setup') && M) buildMatch(ctx);
      else {
        buildTextBoard(ctx, screenLines(now));
        putR(HC - 1, `hackjack ${VERSION}`, C.dim);
      }
    }

    // Hover / keyboard cursor: a background highlight (and > for the keyboard).
    const hov = localHits.find(h => h.id === st.hoverId && h.kind === 'btn');
    if (hov) {
      bg(hov.cx, hov.cy, hov.cw, C.cyan, st.kbFocus === hov.id ? 0.32 : 0.2, hov.ch);
      if (st.kbFocus === hov.id && !hov.noMark && hov.cx >= 2) put(hov.cx - 2, hov.cy + Math.floor((hov.ch - 1) / 2), '>', C.cyan, true);
    }
    // Last write wins where characters overlap (fanned cards); blanks erase.
    const map = new Map();
    for (const c of cells) map.set(c.cx + ',' + c.cy, c);
    cells = [...map.values()].filter(c => c.ch !== ' ');

    let result = cells;
    if (!raw) {
      if (st.wipe) result = applyWipe(cells, now);
      else {
        const age = now - st.boardStart;
        if (age < 500) for (const c of cells) if (age < decodeDelay(c.cx, c.cy)) { c.ch = noiseCh(); c.col = C.dim; }
      }
    }
    if (collectHits) {
      bgs = st.wipe ? [] : frameBgs;
      hits = localHits.map(h => {
        let x = L.ox + h.cx * L.cw, y = L.oy + h.cy * L.chh, pw = h.cw * L.cw, ph = h.ch * L.chh;
        if (ph < 34) { y -= (34 - ph) / 2; ph = 34; }
        if (pw < 34) { x -= (34 - pw) / 2; pw = 34; }
        return Object.assign({}, h, { x, y, w: pw, h: ph });
      });
      st.focusables = localHits.filter(h => h.kind === 'btn' && h.onTap && !h.noFocus).sort((a, b) => a.cy - b.cy || a.cx - b.cx).map(h => ({ id: h.id, onTap: h.onTap }));
    }
    return result;
  }

  // ---------------- Render loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateParts(dt);
    stepPaletteFade(now);
    if (st.wipe && st.wipe.endsAt && now > st.wipe.endsAt) st.wipe = null;
    render(now);
    requestAnimationFrame(frame);
  }
  function render(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.bg;
    g.fillRect(0, 0, W, H);
    const sk = (now - shakeFx.t0) / 1000;
    if (sk < shakeFx.dur) {
      const a = shakeFx.amp * (1 - sk / shakeFx.dur);
      g.translate(rand(-a, a), rand(-a, a));
    }
    const cells = buildScene(now, true);
    for (const b of bgs) {
      g.globalAlpha = b.alpha;
      g.fillStyle = b.col;
      g.fillRect(L.ox + b.cx * L.cw, L.oy + b.cy * L.chh, b.w * L.cw, L.chh);
    }
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const bold of [false, true]) {
      g.font = `${bold ? DRAW_FONT.bold : DRAW_FONT.weight} ${L.fs}px ${DRAW_FONT.family}`;
      for (const c of cells) {
        if (!!c.bold !== bold) continue;
        g.fillStyle = c.col;
        g.fillText(c.ch, pxX(c.cx), pxY(c.cy));
      }
    }
    g.font = `${DRAW_FONT.weight} ${L.fs}px ${DRAW_FONT.family}`;
    for (const p of parts) {
      if (p.t < 0) continue;
      g.globalAlpha = Math.max(0, p.alpha);
      g.fillStyle = p.col;
      if (p.rot) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillText(p.ch, 0, 0); g.restore(); }
      else g.fillText(p.ch, p.x, p.y);
    }
    g.globalAlpha = 1;
    const fk = (now - flashFx.t0) / 1000;
    if (fk < flashFx.dur) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalAlpha = flashFx.a * (1 - fk / flashFx.dur);
      g.fillStyle = flashFx.col;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }
  }


  // ---------------- Screen changes ----------------
  async function swapTo(fn, level = 0) {
    if (st.transitioning) return;
    st.transitioning = true;
    st.kbFocus = null; st.hoverId = null;
    await wipeOut(level);
    fn();
    scenePalette();
    wipeIn();
    st.transitioning = false;
  }

  // ---------------- Input ----------------
  function hitAt(x, y) {
    for (let k = hits.length - 1; k >= 0; k--) {
      const h = hits[k];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
    }
    return null;
  }
  const theirTurn = () => st.mode === 'match' && M && !M.over && M.turn === AI && M.ui.phase === 'wait' && !st.overlay;

  cv.addEventListener('pointerdown', e => {
    Sound.init();
    if (st.wipe || st.transitioning) return;
    const h = hitAt(e.clientX, e.clientY);
    if (h && h.kind === 'btn' && h.onTap) { st.kbFocus = null; h.onTap(); return; }
    if (theirTurn()) { st.ff = true; return; }
    if (st.mode === 'setup' && !h) st.setupSel = null;
  });
  cv.addEventListener('pointermove', e => {
    const h = hitAt(e.clientX, e.clientY);
    const id = h ? h.id : null;
    if (id !== st.hoverId && h && h.kind === 'btn') Sound.tick();
    st.hoverId = id;
    st.kbFocus = null;
    cv.style.cursor = h && h.kind === 'btn' ? 'pointer' : 'default';
  });

  function moveFocus(d) {
    const f = st.focusables;
    if (!f.length) return;
    let k = f.findIndex(x => x.id === st.kbFocus);
    k = k < 0 ? (d > 0 ? 0 : f.length - 1) : (k + d + f.length) % f.length;
    st.kbFocus = st.hoverId = f[k].id;
    Sound.tick();
  }
  // Escape: back out one step.
  function escape() {
    if (st.overlay) { st.overlay = st.overlay === 'pause' ? null : 'pause'; Sound.ui(); return; }
    if (st.mode === 'match' && M && M.ui.phase === 'pick' && M.ui.sel) {
      if (M.ui.mode) { M.ui.mode = null; M.ui.picks = []; } else M.ui.sel = null;
      Sound.tick(); return;
    }
    if (st.mode === 'setup' && st.setupSel) { st.setupSel = null; Sound.tick(); return; }
    if (st.mode === 'match' || st.mode === 'setup') { openPause(); return; }
    if (st.mode === 'intro') return swapTo(showLadder);
    if (st.mode !== 'title') swapTo(() => { st.mode = 'title'; st.opp = null; });
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Sound.init();
    const k = e.key.toLowerCase();
    if (k.startsWith('arrow') || k === ' ' || k === 'enter' || k === 'tab') e.preventDefault();
    if (k === 'm') return toggleMute();
    if (k === 'n') return toggleMusic();
    if (st.transitioning || st.wipe) return;
    if (k === 'escape') return escape();
    if (k === ' ' && theirTurn()) { st.ff = true; return; }
    if (k === 'arrowup' || k === 'arrowleft' || (k === 'tab' && e.shiftKey)) return moveFocus(-1);
    if (k === 'arrowdown' || k === 'arrowright' || k === 'tab') return moveFocus(1);
    if (k === 'enter' || k === ' ') {
      const f = st.kbFocus && st.focusables.find(x => x.id === st.kbFocus);
      if (f) return f.onTap();
      if (st.mode === 'title') return swapTo(showLadder);
    }
  });

  // ---------------- Music ----------------
  // Menus: NIGHT RAIN. A match: the opponent's track, layers building as aces fall.
  function musicState() {
    let song = 'night_rain', level = 0, low = false;
    const o = st.opp;
    if (o && (st.mode === 'intro' || st.mode === 'setup' || st.mode === 'match')) {
      song = o.song;
      if (st.mode === 'match' && M) {
        const a = M.s[YOU].stolen.length, b = M.s[AI].stolen.length;
        level = 1 + (a + b > 0 ? 1 : 0) + ((a && b) || o.boss ? 1 : 0);
        if (o.boss && a + b > 0) level = 4;
        low = b === 1 && !M.over;
      }
    }
    return { song, level, urgency: 0, low, tempo: 1 };
  }
  Music.setSource(musicState);

  // ---------------- Boot ----------------
  window.addEventListener('resize', resize);
  applyPalette(save.palette, true);
  st.msgCol = C.text;
  resize();
  st.boardStart = performance.now();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.load) {
    document.fonts.load('16px "JetBrains Mono"').then(() => computeLayout()).catch(() => {});
    document.fonts.load('800 16px "JetBrains Mono"').catch(() => {});
  }

  // Debug hook for the console and automated tests.
  // __hj.simulate(n, oppIndex): plays n AI-vs-AI matches as fast as possible.
  async function simulate(n = 10, oppIdx = 5) {
    const res = { you: 0, ai: 0, draw: 0, turns: [], errors: 0 };
    CONFIG.instant = true; st.autoplay = true;
    for (let k = 0; k < n; k++) {
      const o = OPPS[oppIdx];
      st.opp = o;
      M = newMatch(o);
      M.sim = true;
      layoutServer(M.s[YOU], 'balanced');
      layoutServer(M.s[AI], o.ai.setup);
      try { await runMatch(); } catch (e) { res.errors++; console.error(e); }
      const total = M.s.reduce((s, S) => s + S.deck.length + S.disc.length + S.stolen.length + S.uploads.length
        + LAYERS.reduce((t, l) => t + S[l].reduce((u, c) => u + (c ? 1 + c.held.length : 0), 0), 0), 0);
      if (total !== 52) { res.errors++; console.error('card count', total); }
      res[M.winner === YOU ? 'you' : M.winner === AI ? 'ai' : 'draw']++;
      res.turns.push(M.turnNo);
    }
    CONFIG.instant = false; st.autoplay = false; M = null; st.mode = 'title'; st.opp = null;
    return res;
  }
  window.__hj = { st, save, C, OPPS, CONFIG, get M() { return M; }, simulate, doStorage, endMatch, startSetup, lockIn, swapTo, showLadder, openIntro, buildScene, uiTargets };
})();
</script>
</body>
</html>
