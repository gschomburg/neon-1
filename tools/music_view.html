     form, levels). The game's own music files, so what plays here is what plays in the game.
     A few stand-ins first, for the bits of the game these files expect to exist. -->
<script>
  window.NEON_FILES = [];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const save = { musicOn: true, musicVol: 0.8, muted: false, sfxVol: 0.8 };
  const CORPS = {}, CORP_TELL = {}, CORP_ART = {};
  const normMotif = m => m;   // (some corps shape their glyphs at the top of the file)
  window.addEventListener('error', e => { (window.LOAD_ERRORS = window.LOAD_ERRORS || []).push(e.filename + ': ' + e.message); });

<style>
  :root {
    --bg: #15171a; --panel: #1d2024; --line: #2c3036; --text: #d6dade; --mid: #8b929a; --dim: #5d636b; --hi: #ffffff;
    --acc: #5cc8ff; --warn: #ffb347; --bad: #ff5c6c; --ok: #5fd47a;
    --secA: #5cc8ff; --secB: #ff8ad8; --secC: #ffd23f; --secD: #5fd47a;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  button, select, input { font: inherit; color: var(--text); background: #262a2f; border: 1px solid var(--line); border-radius: 4px; }
  button { padding: 4px 9px; cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--acc); }
  button.on { background: #12384a; border-color: var(--acc); color: var(--hi); }
  button.primary { background: #1d5a7a; border-color: #2c7ea8; color: var(--hi); }
  select { padding: 3px 6px; }
  .mono { font-family: "JetBrains Mono", Consolas, monospace; }
  .dim { color: var(--dim); }
  .mid { color: var(--mid); }
  kbd { font: 11px "JetBrains Mono", Consolas, monospace; color: var(--mid); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

  /* top: the track and the transport */
  #top { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--panel); }
  #top h1 { font-size: 15px; margin: 0 6px 0 0; color: var(--hi); }
  #track { max-width: 280px; }
  #info { color: var(--mid); }
  .grp { display: flex; gap: 4px; align-items: center; }
  .grp > label { color: var(--mid); margin-right: 2px; }
  #levels button { min-width: 26px; padding: 4px 6px; }
  #urgency { width: 80px; }
  .sp { flex: 1; }

  /* the form strip and the section tabs */
  #form { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  #form > label { color: var(--mid); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  #passes { display: flex; gap: 3px; flex-wrap: wrap; }
  .pass { position: relative; width: 38px; height: 34px; border-radius: 4px; border: 1px solid var(--line); background: #1f2226; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; user-select: none; }
  .pass b { font-size: 14px; }
  .pass small { font-size: 9px; color: var(--mid); }
  .pass.shown { outline: 2px solid var(--hi); outline-offset: 1px; }
  .pass.playing { background: #12384a; }
  .pass.looped::after { content: '⟲'; position: absolute; top: -3px; right: 1px; font-size: 11px; color: var(--warn); }
  #tabs { display: flex; gap: 3px; }
  #tabs button { min-width: 30px; font-weight: 700; }

  /* the roll */
  #main { flex: 1; display: flex; min-height: 0; }
  #rollwrap { flex: 1; overflow: auto; position: relative; min-width: 0; }
  #roll { display: grid; grid-template-columns: 200px auto; position: relative; }
  .head { position: sticky; left: 0; z-index: 2; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
          padding: 6px 8px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; }
  .head.sel { box-shadow: inset 3px 0 0 var(--acc); }
  .head .t { display: flex; align-items: center; gap: 6px; }
  .head .name { font-weight: 700; color: var(--hi); text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; flex: 1; }
  .head .sub { color: var(--mid); font-size: 11px; }
  .head .lvl { font-size: 10px; color: var(--mid); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .head .lvl.off { color: var(--warn); border-color: #5a4422; }
  .ms { padding: 0 5px; font-size: 10px; font-weight: 700; line-height: 16px; min-width: 18px; }
  .ms.m.on { background: #4a1f25; border-color: var(--bad); color: var(--hi); }
  .ms.s.on { background: #4a4119; border-color: var(--secC); color: var(--hi); }
  .rows { display: flex; flex-direction: column; gap: 0; margin-top: 2px; }
  .rows .r { display: flex; align-items: center; gap: 3px; font-size: 10px; color: var(--mid); }
  .rows .r span { flex: 1; }
  .lane { border-bottom: 1px solid var(--line); position: relative; }
  .lane canvas { display: block; }
  .chordhead { cursor: default; }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hi); opacity: 0.85; pointer-events: none; z-index: 1; display: none; }

  /* right: the inspector */
  #insp { flex: 0 0 300px; border-left: 1px solid var(--line); background: var(--panel); padding: 10px 14px; overflow: auto; }
  #insp h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mid); margin: 14px 0 6px; font-weight: 600; }
  #insp h2:first-child { margin-top: 2px; }
  #insp .kv { display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; }
  #insp .kv div:nth-child(odd) { color: var(--mid); }
  #insp pre { background: #15171a; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; margin: 4px 0; font: 11px/1.5 "JetBrains Mono", Consolas, monospace;
              white-space: pre; overflow: auto; color: var(--text); }
  #insp .from { color: var(--secB); }
  #insp p { margin: 6px 0; color: var(--mid); }
  .legend { display: grid; grid-template-columns: 26px 1fr; gap: 4px 8px; align-items: center; color: var(--mid); font-size: 12px; }
  .legend i { display: block; height: 10px; border-radius: 2px; }
  #msg { padding: 30px; color: var(--mid); }
</style>
</head>
<body>
<div id="top">
  <h1>Music View</h1>
  <select id="track" title="The track (grouped by where it plays)"></select>
  <span id="info"></span>
  <span class="sp"></span>
  <button id="play" class="primary" title="Play / stop (Space)">play</button>
  <div class="grp" title="The game's level: parts come in as you go deeper (0-4)"><label>level</label><span id="levels"></span></div>
  <div class="grp" title="Clock pressure (Chronos): opens the filter; on ticking tracks, faster and busier hats"><label>urgency</label><input type="range" id="urgency" min="0" max="1" step="0.05" value="0"></div>
  <div class="grp"><label>view</label><button id="vSection" class="on" title="One pass at a time">section</button><button id="vSong" title="Every pass of the form, left to right">song</button></div>
  <button id="follow" class="on" title="The view follows the playing pass">follow</button>
  <button id="names" title="Show note names next to the numbers">names</button>
  <div class="grp"><label>vol</label><input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" style="width:70px"></div>
  <a href="music.html" class="mid" style="margin-left:6px">music tool</a>
</div>
<div id="form">
  <label>form</label>
  <div id="passes"></div>
  <button id="loop" title="Keep playing the shown pass (L)">loop pass</button>
  <label style="margin-left:8px">sections</label>
  <div id="tabs"></div>
  <span id="formnote" class="mid"></span>
</div>
<div id="main">
  <div id="rollwrap"><div id="roll"></div><div id="playhead"></div></div>
  <div id="insp"></div>
</div>
<script>
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

  // ---- tracks changed in the music tool play here as changed, so both tools sound the same
  const EDITS_KEY = 'neon.music.edits', changed = new Set();
  try {
    const e = JSON.parse(localStorage.getItem(EDITS_KEY) || '{}');
    for (const [k, s] of Object.entries(e)) if (SONGS[k]) { for (const f of Object.keys(SONGS[k])) delete SONGS[k][f]; Object.assign(SONGS[k], s); changed.add(k); }
  } catch (err) { /* nothing saved */ }

  // ---- the lanes, and the engine's mute names for each (engine/music.js: Music.mute)
  const LANES = [
    { id: 'melody', name: 'melody', parts: ['melody', 'lead'] },
    { id: 'arp', name: 'arp', parts: ['arp'] },
    { id: 'stab', name: 'stabs', parts: ['stab'] },
    { id: 'pad', name: 'pad', parts: ['pad'] },
    { id: 'bass', name: 'bass', parts: ['bass'] },
    { id: 'drums', name: 'drums', parts: ['kick', 'snare', 'hat', 'open', 'clap', 'ghost', 'fill'] },
    { id: 'sfx', name: 'sound fx', parts: ['sfx'] },
  ];
  const DRUM_ROWS = ['crash', 'kick', 'snare', 'clap', 'ghost', 'tom', 'hat', 'open'];
  const DRUM_PART = { crash: 'fill', tom: 'fill' };   // rows that only fills play
  const ARP_NAMES = ['root', '3rd', '5th', 'root ↑', '3rd ↑', '5th ↑'];
  const LANE_COLOR = { melody: '#ff8ad8', arp: '#5cc8ff', stab: '#ffb347', pad: '#8f7dff', bass: '#5fd47a', drums: '#d6dade', sfx: '#a0a8b0' };
  const SEC_COLOR = { A: '#5cc8ff', B: '#ff8ad8', C: '#ffd23f', D: '#5fd47a' };
  const DEFAULTS = { bassVoice: 'saw', padVoice: 'saw', arpVoice: 'square', leadVoice: 'square', stabVoice: 'saw', kit: 'synth' };
  const LEVELS = ['pad + bass', '+ drums', '+ arp', '+ lead (boss)', 'final boss'];

  // ---- state
  const st = {
    key: null, playing: false, level: 2, urgency: 0, view: 'section', follow: true, names: false,
    shown: 0,          // the pass on screen (section view), an index into the strip
    loop: false, lane: 'melody',
    muted: new Set(), solo: new Set(),   // engine part names
  };
  try { Object.assign(st, JSON.parse(localStorage.getItem('neon.musicview') || '{}'), { playing: false, loop: false, muted: new Set(), solo: new Set() }); } catch (e) { /* first visit */ }
  const remember = () => { try { localStorage.setItem('neon.musicview', JSON.stringify({ key: st.key, level: st.level, view: st.view, follow: st.follow, names: st.names, lane: st.lane })); } catch (e) { /* private mode */ } };
  const q = new URLSearchParams(location.search).get('track');
  if (q && SONGS[q]) st.key = q;
  if (!SONGS[st.key]) st.key = MUSIC_FOR.map;

  // ---- the player state the engine reads (the same shape as the game's)
  Music.setSource(() => {
    const s = SONGS[st.key];
    return { song: st.playing ? st.key : 'none', level: st.level, urgency: st.urgency, low: false,
      tempo: 1 + (s && s.tick ? st.urgency * 0.25 : 0) + (st.level >= 3 ? 0.05 : 0) };
  });
  const start = () => Sound.init();   // audio starts on the first click / key (browsers' rule)

  // ---- the strip: the passes worth showing. The form repeats, but breakdowns (every n-th pass) and fills (every
  // second pass, styles in turn every 2) don't line up with it, so show passes until the whole lot repeats.
  const gcd = (a, b) => b ? gcd(b, a % b) : a, lcm = (a, b) => a / gcd(a, b) * b;
  function stripLen(sg) {
    let n = lcm(formOf(sg).length, 2);
    if (sg.breakdown) n = lcm(n, sg.breakdown);
    return Math.min(n, 16);
  }
  const resolved = new Map();   // pass -> resolvePass(...), for the current track / level / urgency
  function pass(p) {
    if (!resolved.has(p)) resolved.set(p, resolvePass(SONGS[st.key], p, { level: st.level, urgency: st.urgency }));
    return resolved.get(p);
  }

  // ---- the track list: where each one plays, then the rest
  function placeName(p) { return { menu: 'menus', map: 'map', omni: 'OMNI//CORE' }[p] || (CORPS[p] && CORPS[p].name) || p.toUpperCase(); }
  function renderTrackList() {
    const used = {};
    for (const [p, k] of Object.entries(MUSIC_FOR)) if (SONGS[k]) (used[k] = used[k] || []).push(placeName(p));
    if (typeof GRAVE_TRACK !== 'undefined' && SONGS[GRAVE_TRACK]) (used[GRAVE_TRACK] = used[GRAVE_TRACK] || []).push('GRAVE ROBBER mod');
    const keys = Object.keys(SONGS).sort((a, b) => SONGS[a].name.localeCompare(SONGS[b].name));
    const opt = k => `<option value="${k}"${k === st.key ? ' selected' : ''}>${esc(SONGS[k].name)}${used[k] ? ' · ' + esc(used[k].join(', ')) : ''}${changed.has(k) ? ' (changed)' : ''}</option>`;
    $('#track').innerHTML = `<optgroup label="in the game">${keys.filter(k => used[k]).map(opt).join('')}</optgroup>` +
      `<optgroup label="not playing anywhere">${keys.filter(k => !used[k]).map(opt).join('')}</optgroup>`;
  }

  // ---- mute / solo -> the engine
  const allParts = LANES.flatMap(l => l.parts);
  function applyMutes() {
    const out = st.solo.size ? allParts.filter(p => !st.solo.has(p)) : [...st.muted];
    Music.mute(out);
  }
  function toggle(set, parts) {
    const all = parts.every(p => set.has(p));
    for (const p of parts) all ? set.delete(p) : set.add(p);
    applyMutes(); render();
  }
  const isOn = (set, parts) => parts.every(p => set.has(p));
  const silenced = parts => st.solo.size ? !parts.some(p => st.solo.has(p)) : parts.every(p => st.muted.has(p));

  // ---- layout numbers
  const ROW = { melody: 11, bass: 11, arp: 12, drums: 13, sfx: 14, stab: 16, pad: 26 };
  let sw = 14;   // px per 16th

  // which lanes this track has
  function lanesFor(sg, passes) {
    const has = id => passes.some(p => pass(p).notes.some(n => n.lane === id));
    return LANES.filter(l => l.id === 'melody' || l.id === 'pad' || l.id === 'bass' || l.id === 'drums' || l.id === 'arp' || has(l.id));
  }
  // the rows a lane shows (top to bottom), from the notes it has across the passes on screen
  function rowsFor(lane, passes) {
    const notes = passes.flatMap(p => pass(p).notes.filter(n => n.lane === lane && (!n.dbl || st.level >= 3)));
    if (lane === 'arp') return [5, 4, 3, 2, 1, 0];
    if (lane === 'drums') { const used = new Set(notes.map(n => n.row)); return DRUM_ROWS.filter(r => used.has(r) || ['kick', 'snare', 'hat'].includes(r)); }
    if (lane === 'sfx') return ['creak', 'owl'].filter(r => notes.some(n => n.row === r));
    if (lane === 'stab' || lane === 'pad') return [lane];
    if (!notes.length) return lane === 'bass' ? [7, 4, 2, 0] : [7, 4, 2, 0];
    let lo = Math.min(...notes.map(n => n.v)), hi = Math.max(...notes.map(n => n.v));
    lo = Math.min(lo, 0); hi = Math.max(hi, lo + 4);
    const out = []; for (let v = hi; v >= lo; v--) out.push(v);
    return out;
  }
  // a note's name, spelled the way the track's scale spells it (Ab in F minor, not G#), with its octave
  function noteName(sg, m) {
    const sc = SCALES[sg.scale], i = sc.findIndex(iv => (sg.root + iv) % 12 === m % 12);
    return (i >= 0 ? scaleNames(sg)[i] : NOTE_NAMES[m % 12]) + (Math.floor(m / 12) - 1);
  }
  // a melody degree's note (from the track's root, two octaves up)
  const degName = (sg, v) => noteName(sg, sg.root + 24 + SCALES[sg.scale][((v % 7) + 7) % 7] + 12 * Math.floor(v / 7));

  // ---- render
  function passesOnScreen() {
    const sg = SONGS[st.key], n = stripLen(sg);
    return st.view === 'song' ? [...Array(n).keys()] : [st.shown % n];
  }
  function render() {
    const sg = SONGS[st.key];
    renderInfo(sg); renderForm(sg); renderLevels();
    $('#vSection').classList.toggle('on', st.view === 'section'); $('#vSong').classList.toggle('on', st.view === 'song');
    $('#follow').classList.toggle('on', st.follow); $('#names').classList.toggle('on', st.names);
    $('#play').textContent = st.playing ? 'stop' : 'play';
    $('#loop').classList.toggle('on', st.loop);
    if (sg.style === 'ambient') return renderAmbient(sg);
    renderRoll(sg); renderInspector(sg);
  }
  function renderInfo(sg) {
    const meter = { 3: '3/4', 6: '6/8', 5: '5/4' }[sg.meter] || '4/4';
    $('#info').innerHTML = `${scaleNames(sg)[0]} ${sg.scale} · ${sg.bpm} bpm · ${meter}${sg.swing ? ' · swing ' + sg.swing : ''}` +
      (sg.style === 'ambient' ? ' · ambient' : ` · ${sg.prog.length} bars a pass · form ${formOf(sg)}`);
  }
  function renderLevels() {
    $('#levels').innerHTML = LEVELS.map((t, i) => `<button data-l="${i}" class="${i === st.level ? 'on' : ''}" title="${i}: ${t}">${i}</button>`).join('');
  }
  function renderForm(sg) {
    const n = stripLen(sg), playing = playingPass();
    if (sg.style === 'ambient') { $('#passes').innerHTML = ''; $('#tabs').innerHTML = ''; $('#formnote').textContent = 'ambient tracks have no sections'; return; }
    $('#passes').innerHTML = [...Array(n).keys()].map(p => {
      const r = pass(p), c = SEC_COLOR[r.section] || '#888';
      const marks = [r.breakdown ? 'brk' : '', r.fill ? 'fill' : ''].filter(Boolean).join(' ');
      const cls = ['pass', st.view === 'section' && p === st.shown % n ? 'shown' : '', playing === p ? 'playing' : '', st.loop && p === st.shown % n ? 'looped' : ''].join(' ');
      return `<div class="${cls}" data-p="${p}" title="pass ${p + 1}: section ${r.section}${r.breakdown ? ', breakdown (no drums or bass)' : ''}${r.fill ? ', ends on a fill (' + (r.fill.custom ? 'the track\'s own' : r.fill.style) + ')' : ''}${r.crash ? ', starts on a crash' : ''}"><b style="color:${c}">${r.section}</b><small>${marks || (p + 1)}</small></div>`;
    }).join('');
    const secs = ['A', ...['B', 'C', 'D'].filter(x => sg[x])];
    $('#tabs').innerHTML = secs.map(x => `<button data-s="${x}" style="color:${SEC_COLOR[x]}" class="${pass(st.shown % n).section === x && st.view === 'section' ? 'on' : ''}" title="Show the first pass of section ${x}">${x}</button>`).join('');
    const cyc = n < 16 && n > formOf(sg).length ? ` · the strip is ${n} passes: where the form, fills${sg.breakdown ? ' and breakdowns' : ''} line up again` : '';
    $('#formnote').textContent = (secs.length === 1 ? 'one section (A)' : '') + cyc;
  }

  function renderRoll(sg) {
    const passes = passesOnScreen(), r0 = pass(passes[0]), bs = r0.bs, nb = sg.prog.length;
    const steps = passes.length * nb * bs;
    const avail = $('#rollwrap').clientWidth - 200 - 2;
    sw = st.view === 'song' ? Math.max(5, Math.min(14, Math.floor(avail / steps))) : Math.max(10, Math.floor(avail / steps));
    const W = steps * sw;
    const lanes = lanesFor(sg, passes);
    let html = `<div class="head chordhead"><div class="t"><span class="name">chords</span></div><div class="sub">${esc(sg.scale)} · root ${scaleNames(sg)[0]}${sg.sevenths ? ' · sevenths' : ''}</div></div><div class="lane"><canvas id="cv-chords"></canvas></div>`;
    for (const l of lanes) {
      const at = laneAt(l.id, passes), off = st.level < at, sil = silenced(l.parts);
      const rows = l.id === 'drums' ? rowsFor('drums', passes) : [];
      html += `<div class="head${st.lane === l.id ? ' sel' : ''}" data-lane="${l.id}">
        <div class="t"><span class="name" style="color:${sil ? 'var(--dim)' : LANE_COLOR[l.id]}">${l.name}</span>
          <span class="lvl${off ? ' off' : ''}" title="${off ? 'Silent: comes in at level ' + at : 'Plays from level ' + at}">lvl ${at}+</span>
          <button class="ms m${isOn(st.muted, l.parts) ? ' on' : ''}" data-m="${l.parts.join(',')}" title="Mute">M</button><button class="ms s${isOn(st.solo, l.parts) ? ' on' : ''}" data-s="${l.parts.join(',')}" title="Solo">S</button></div>
        <div class="sub">${esc(laneSub(l.id, sg, passes))}</div>
        ${rows.length ? `<div class="rows">${rows.map(row => { const p = DRUM_PART[row] || row; return `<div class="r" style="height:${ROW.drums}px"><span>${row}</span>${DRUM_PART[row] ? '' : `<button class="ms m${st.muted.has(p) ? ' on' : ''}" data-m="${p}">M</button><button class="ms s${st.solo.has(p) ? ' on' : ''}" data-s="${p}">S</button>`}</div>`; }).join('')}</div>` : ''}
      </div><div class="lane"><canvas id="cv-${l.id}"></canvas></div>`;
    }
    $('#roll').innerHTML = html;
    drawChords(sg, passes, W);
    for (const l of lanes) drawLane(l.id, sg, passes, W);
    placePlayhead();
  }
  // the level a lane comes in at (its earliest note)
  function laneAt(id, passes) {
    const ns = passes.flatMap(p => pass(p).notes.filter(n => n.lane === id && !n.dbl && !n.boss));
    if (ns.length) return Math.min(...ns.map(n => n.at));
    return { melody: 3, arp: 2, drums: 1 }[id] || 0;
  }
  // what a lane is made from, in a few words
  function laneSub(id, sg, passes) {
    const r = pass(passes[0]), s = r.song;
    const v = k => s[k] || DEFAULTS[k];
    if (id === 'melody') return s.melody ? `${v('leadVoice')} · written${s.melodyOct ? ' · octave ' + s.melodyOct : ''}` : `${v('leadVoice')} · stock boss lead`;
    if (id === 'arp') return `${v('arpVoice')} · ${s.arpLine ? 'written (chord tones)' : 'pattern: ' + (s.arp || 'up')}`;
    if (id === 'stab') return `${v('stabVoice')} · written`;
    if (id === 'pad') return s.padVoice === 'none' ? 'none' : `${v('padVoice')} · ${s.gate ? 'gated' : 'a chord a bar'}`;
    if (id === 'bass') return `${v('bassVoice')} · ${s.bassLine ? 'written (steps from the chord root)' : 'pattern: ' + (s.bass || 'eighths') + (s.bassOct ? ', octaves' : '')}`;
    if (id === 'drums') return `${v('kit')} kit · ${s.beat ? 'written' : 'pattern: ' + (s.drums || 'four')}${s.pump != null ? ' · pump ' + s.pump : ''}`;
    if (id === 'sfx') return 'creak / owl';
    return '';
  }

  // ---- canvas drawing
  function canvas(id, W, H) {
    const c = document.getElementById(id), dpr = window.devicePixelRatio || 1;
    c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
    const g = c.getContext('2d'); g.scale(dpr, dpr);
    return g;
  }
  // the grid: bar lines, beat lines, pass boundaries (song view), section tint
  function grid(g, sg, passes, W, H) {
    const r0 = pass(passes[0]), bs = r0.bs, beat = r0.beat, nb = sg.prog.length;
    g.fillStyle = '#17191c'; g.fillRect(0, 0, W, H);
    passes.forEach((p, pi) => {
      const r = pass(p), x0 = pi * nb * bs * sw;
      if (passes.length > 1) { g.fillStyle = (SEC_COLOR[r.section] || '#888') + '0d'; g.fillRect(x0, 0, nb * bs * sw, H); }
      for (let b = 0; b < nb; b++) for (let k = 0; k < bs; k++) {
        const x = x0 + (b * bs + k) * sw;
        if (k % beat === 0) { g.fillStyle = k === 0 ? (b === 0 ? '#5d636b' : '#3a3f46') : '#25292e'; g.fillRect(x, 0, 1, H); }
      }
    });
  }
  function drawChords(sg, passes, W) {
    const H = 34, g = canvas('cv-chords', W, H), nb = sg.prog.length;
    grid(g, sg, passes, W, H);
    passes.forEach((p, pi) => {
      const r = pass(p), bw = r.bs * sw;
      r.bars.forEach((b, i) => {
        const x = (pi * nb + i) * bw;
        g.fillStyle = SEC_COLOR[r.section] + (passes.length > 1 ? '' : ''); g.globalAlpha = 0.18; g.fillRect(x + 1, 3, bw - 2, H - 6); g.globalAlpha = 1;
        g.fillStyle = '#fff'; g.font = `bold ${bw > 60 ? 13 : 10}px system-ui`; g.textBaseline = 'middle';
        g.fillText(b.roman, x + 5, H / 2 - (bw > 60 ? 6 : 0));
        if (bw > 60) { g.fillStyle = '#8b929a'; g.font = '11px system-ui'; g.fillText(b.name, x + 5, H / 2 + 8); }
        if (i === 0 && passes.length > 1) { g.fillStyle = SEC_COLOR[r.section]; g.font = 'bold 10px system-ui'; g.fillText(r.section, x + bw - 12, 9); }
      });
    });
  }
  function drawLane(id, sg, passes, W) {
    const rows = rowsFor(id, passes), rh = ROW[id], H = Math.max(rows.length * rh, id === 'pad' || id === 'stab' ? rh : 30) + 4;
    const g = canvas('cv-' + id, W, H), nb = sg.prog.length, col = LANE_COLOR[id];
    const parts = LANES.find(l => l.id === id).parts;
    grid(g, sg, passes, W, H);
    const rowY = row => 2 + rows.indexOf(row) * rh;
    // row shading: roots (melody, bass), chord tones in an octave pair (arp)
    if (id === 'melody' || id === 'bass') rows.forEach(v => { if (((v % 7) + 7) % 7 === 0) { g.fillStyle = '#ffffff0a'; g.fillRect(0, rowY(v), W, rh); } });
    if (id === 'drums' || id === 'arp') rows.forEach((v, i) => { if (i % 2) { g.fillStyle = '#ffffff06'; g.fillRect(0, rowY(v), W, rh); } });
    // row labels along the left edge of the lane (drums label in the head instead)
    if (id !== 'drums' && id !== 'pad' && id !== 'stab') {
      g.font = '9px "JetBrains Mono", Consolas, monospace'; g.textBaseline = 'middle';
      for (const v of rows) {
        let t = id === 'arp' ? `${v} ${ARP_NAMES[v]}` : id === 'sfx' ? v : String(v);
        if (st.names && id === 'melody') t += ' ' + degName(sg, v);
        if (id === 'bass' && v === 0) t += ' root';
        g.fillStyle = '#5d636b'; g.fillText(t, 3, rowY(v) + rh / 2);
      }
    }
    passes.forEach((p, pi) => {
      const r = pass(p), x0 = pi * nb * r.bs * sw;
      if (r.breakdown && (id === 'drums' || id === 'bass')) {
        g.fillStyle = '#ffb34714'; g.fillRect(x0, 0, nb * r.bs * sw, H);
        g.fillStyle = '#ffb347'; g.font = '11px system-ui'; g.textBaseline = 'middle'; g.fillText('breakdown: drops out this pass', x0 + 60, H / 2);
      }
      for (const n of r.notes) {
        if (n.lane !== id) continue;
        const row = id === 'melody' || id === 'bass' || id === 'arp' ? n.v : n.row;
        if (!rows.includes(row)) continue;
        const live = st.level >= n.at, muted = silenced(id === 'drums' ? [DRUM_PART[n.row] || n.row] : parts);
        if (n.dbl && st.level < 3) continue;
        const x = x0 + (n.bar * r.bs + n.k) * sw, w = Math.max(3, n.len * sw - 2), y = rowY(row) + 1, h = rh - 2;
        let c = n.fill ? '#ffb347' : n.boss ? '#8b929a' : col;
        g.globalAlpha = (live ? 1 : 0.22) * (muted ? 0.35 : 1) * (n.dbl ? 0.45 : 1);
        if (id === 'pad') {
          g.fillStyle = c; g.globalAlpha *= 0.35; g.fillRect(x + 1, y, w, h); g.globalAlpha /= 0.35;
          const ch = r.bars[n.bar]; g.fillStyle = '#fff'; g.font = '10px system-ui'; g.textBaseline = 'middle';
          if (w > 26) g.fillText(st.names ? ch.chord.map(m => noteName(sg, m).replace(/-?\d+$/, '')).join(' ') : ch.name, x + 4, y + h / 2);
        } else if (n.gen || n.dbl) {
          g.strokeStyle = c; g.lineWidth = 1.2; g.strokeRect(x + 1.5, y + 0.5, w - 1, h - 1);
        } else { g.fillStyle = c; g.fillRect(x + 1, y, w, h); }
        if (st.names && (id === 'bass' || id === 'arp') && n.midi != null && sw * n.len >= 22) {
          g.fillStyle = n.gen ? c : '#111'; g.font = '8px system-ui'; g.textBaseline = 'middle'; g.fillText(noteName(sg, n.midi), x + 3, y + h / 2);
        }
        g.globalAlpha = 1;
      }
    });
    if (st.level < laneAt(id, passes)) {
      g.fillStyle = '#ffb347'; g.font = '11px system-ui'; g.textBaseline = 'top';
      g.fillText(`silent at level ${st.level}: comes in at level ${laneAt(id, passes)}`, 60, 4);
    }
  }

  // ---- ambient tracks: nothing to roll, just what the player does
  function renderAmbient(sg) {
    $('#roll').innerHTML = `<div id="msg" style="grid-column: 1 / 3"><b style="color:var(--hi)">${esc(sg.name)}</b> is an ambient track. It has its own player (engine/music.js, ambientStep): no parts,
      no levels and no drums. Each bar: a wide three-saw pad on the chord, a sine under it, a low brass swell every other bar, and sparse bells
      into a long echo.<br><br>Chords: ${sg.prog.map(d => chordInfo(sg, d)).map(c => `<b>${c.roman}</b> ${c.name}`).join(' · ')}<br>Echo ${sg.echo || 0.32}, feedback ${sg.feedback || 0.3}.</div>`;
    $('#insp').innerHTML = '';
    $('#playhead').style.display = 'none';
  }

  // ---- the inspector: the selected lane, as the track writes it
  const LANE_FIELDS = { melody: ['melody', 'melodyAt', 'melodyOct', 'leadVoice'], arp: ['arpLine', 'arp', 'arpVoice', 'pingpong'], stab: ['stab', 'stabVoice', 'stabAt'],
    pad: ['padVoice', 'gate', 'sevenths'], bass: ['bassLine', 'bass', 'bassVoice', 'bassOct'], drums: ['beat', 'drums', 'kit', 'pump', 'fill', 'fills', 'breakdown', 'tick'], sfx: ['creak', 'owl', 'sfxAt'] };
  function renderInspector(sg) {
    const passes = passesOnScreen(), r = pass(passes[0]), sec = r.section, id = st.lane;
    const fields = LANE_FIELDS[id] || [];
    const fmt = v => Array.isArray(v) ? v.map(x => typeof x === 'string' ? `'${x}'` : JSON.stringify(x)).join(',\n') : typeof v === 'object' && v ? Object.entries(v).map(([k, x]) => `${k.padEnd(5)} '${x}'`).join('\n') : typeof v === 'string' ? `'${v}'` : JSON.stringify(v);
    const shown = fields.filter(f => r.song[f] != null);
    let h = `<h2>${esc(LANES.find(l => l.id === id).name)} · section ${sec}</h2>`;
    h += shown.length ? shown.map(f => {
      const fromSec = sec !== 'A' && sg[sec] && f in sg[sec];
      return `<div class="mid">${f}${fromSec ? ` <span class="from">(from ${sec})</span>` : sec !== 'A' ? ' <span class="dim">(from A)</span>' : ''}</div><pre>${esc(fmt(r.song[f]))}</pre>`;
    }).join('') : '<p>Nothing written: the engine\'s defaults.</p>';
    if (id === 'melody') h += `<p>Degrees from the root: 0 = ${scaleNames(sg)[0]}, 7 = an octave up. Two octaves above the bass. At level 3+ bosses double it an octave up (the faint copy).</p>`;
    if (id === 'bass') h += '<p>Scale steps from each bar\'s chord root: 0 = the root, 4 = the fifth, 7 = an octave up.</p>';
    if (id === 'arp') h += '<p>Chord tones: 0-2 the chord (root, 3rd, 5th), 3-5 the same an octave up. The same line follows every chord.</p>';
    if (id === 'drums') h += `<p>Fills: ${sg.fills === false ? 'off.' : 'every second pass, and the pass before a new section; the last beat (or the track\'s own fill bar), then a crash.'}${sg.breakdown ? ` Breakdown: every ${sg.breakdown}th pass, no drums or bass.` : ''}</p>`;
    h += `<h2>this pass</h2><div class="kv"><div>pass</div><div>${passes.length > 1 ? 'all ' + passes.length : passes[0] + 1} · section ${sec}</div>` +
      `<div>chords</div><div>${r.bars.map(b => b.roman).join(' ')}</div>` +
      `<div>fill</div><div>${r.fill ? (r.fill.custom ? 'the track\'s own' : r.fill.style) : '—'}</div><div>crash</div><div>${r.crash ? 'on beat 1' : '—'}</div>` +
      `<div>breakdown</div><div>${r.breakdown ? 'yes' : '—'}</div></div>`;
    h += `<h2>key</h2><div class="legend">
      <i style="background:${LANE_COLOR[id]}"></i><span>written in the track</span>
      <i style="border:1.5px solid ${LANE_COLOR[id]}"></i><span>made by the engine (a pattern, the stock lead)</span>
      <i style="background:#ffb347"></i><span>a drum fill / crash</span>
      <i style="background:#8b929a"></i><span>extra boss hats (level 3+)</span>
      <i style="background:${LANE_COLOR[id]};opacity:.25"></i><span>above the current level (silent)</span></div>`;
    h += `<h2>keys</h2><p><kbd>Space</kbd> play / stop · <kbd>0</kbd>-<kbd>4</kbd> level · <kbd>←</kbd> <kbd>→</kbd> pass · <kbd>L</kbd> loop · <kbd>M</kbd> <kbd>S</kbd> mute / solo the selected lane · <kbd>Tab</kbd> section / song</p>`;
    $('#insp').innerHTML = h;
  }

  // ---- the playhead
  function playingPass() {
    if (!st.playing) return null;
    const pos = Music.position(); if (!pos || Music.current() !== st.key) return null;
    return pos.pass % stripLen(SONGS[st.key]);
  }
  let lastPlaying = null;
  function placePlayhead() {
    const ph = $('#playhead'), sg = SONGS[st.key];
    const pos = st.playing && Music.current() === st.key ? Music.position() : null;
    if (!pos || sg.style === 'ambient') { ph.style.display = 'none'; return; }
    const n = stripLen(sg), p = pos.pass % n, passes = passesOnScreen(), pi = passes.indexOf(p);
    if (pi < 0) { ph.style.display = 'none'; return; }
    const bs = barSteps(sg), x = 200 + (pi * sg.prog.length * bs + pos.bar * bs + pos.step) * sw;
    ph.style.display = 'block'; ph.style.left = x + 'px'; ph.style.height = $('#roll').offsetHeight + 'px';
    if (st.view === 'song') {   // keep it in view
      const wrap = $('#rollwrap');
      if (x < wrap.scrollLeft + 200 || x > wrap.scrollLeft + wrap.clientWidth - 40) wrap.scrollLeft = x - 240;
    }
  }
  function tick() {
    const p = playingPass();
    if (p !== lastPlaying) {
      lastPlaying = p;
      if (p != null && st.follow && st.view === 'section' && !st.loop && p !== st.shown) { st.shown = p; render(); }
      else renderForm(SONGS[st.key]);
    }
    placePlayhead();
    requestAnimationFrame(tick);
  }

  // ---- actions
  function pickTrack(k) {
    st.key = k; st.shown = 0; st.loop = false; resolved.clear(); Music.loop(null);
    $('#track').value = k;
    remember(); render();
  }
  function setLevel(l) { st.level = l; resolved.clear(); remember(); render(); }
  function showPass(p, seek = true) {
    const n = stripLen(SONGS[st.key]);
    st.shown = ((p % n) + n) % n;
    if (st.view === 'song') st.view = 'section';
    if (st.loop) Music.loop(st.shown);
    if (seek && st.playing) Music.seek(st.shown);
    render();
  }
  function togglePlay() {
    start();
    st.playing = !st.playing;
    if (st.playing) { applyMutes(); Music.loop(st.loop ? st.shown : null); if (Music.current() === st.key) Music.restart(); if (st.shown) Music.seek(st.shown); }
    render();
  }
  function toggleLoop() {
    st.loop = !st.loop;
    Music.loop(st.loop ? st.shown % stripLen(SONGS[st.key]) : null);
    render();
  }

  $('#track').addEventListener('change', e => pickTrack(e.target.value));
  $('#play').addEventListener('click', togglePlay);
  $('#levels').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setLevel(+b.dataset.l); });
  $('#urgency').addEventListener('input', e => { st.urgency = +e.target.value; resolved.clear(); render(); });
  $('#vol').addEventListener('input', e => { save.musicVol = +e.target.value; start(); Music.volume(); });
  $('#vSection').addEventListener('click', () => { st.view = 'section'; remember(); render(); });
  $('#vSong').addEventListener('click', () => { st.view = 'song'; remember(); render(); });
  $('#follow').addEventListener('click', () => { st.follow = !st.follow; remember(); render(); });
  $('#names').addEventListener('click', () => { st.names = !st.names; remember(); render(); });
  $('#loop').addEventListener('click', toggleLoop);
  $('#passes').addEventListener('click', e => { const d = e.target.closest('.pass'); if (d) showPass(+d.dataset.p); });
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const sg = SONGS[st.key], n = stripLen(sg);
    for (let p = 0; p < n; p++) if (pass(p).section === b.dataset.s) return showPass(p);
  });
  $('#roll').addEventListener('click', e => {
    const m = e.target.closest('[data-m]'), s = e.target.closest('[data-s]');
    if (m) return toggle(st.muted, m.dataset.m.split(','));
    if (s) return toggle(st.solo, s.dataset.s.split(','));
    const h = e.target.closest('.head[data-lane]');
    if (h) { st.lane = h.dataset.lane; remember(); render(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea') && e.key !== ' ') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const lane = LANES.find(l => l.id === st.lane);
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (/^[0-4]$/.test(e.key)) setLevel(+e.key);
    else if (e.key === 'ArrowRight') { e.preventDefault(); showPass(st.shown + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); showPass(st.shown - 1); }
    else if (e.key === 'l' || e.key === 'L') toggleLoop();
    else if ((e.key === 'm' || e.key === 'M') && lane) toggle(st.muted, lane.parts);
    else if ((e.key === 's' || e.key === 'S') && lane) toggle(st.solo, lane.parts);
    else if (e.key === 'Tab') { e.preventDefault(); st.view = st.view === 'song' ? 'section' : 'song'; remember(); render(); }
  });
  window.addEventListener('resize', () => render());

  renderTrackList();
  render();
  requestAnimationFrame(tick);
  if (window.LOAD_ERRORS) console.warn('load errors', window.LOAD_ERRORS);
</script>
</body>
</html>
