<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stick Mockups</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* INFILTR8's STICK, 8 looks (Greg, 2026-11-24): the stick works as it does (touch anywhere, drag past the dead zone:
   a step that way, 4 ways only; hold: keep walking), but a circle says "any way", and it only goes 4. So: d-pad
   shapes, strokes only. Each tile demos itself; touch one and drag to try it. Loads only the game's palettes
   (../data/palettes.js), for the colors. Not the game. */
:root { color-scheme: dark; --bg: #06090a; --dim: #2c3a38; --mid: #5f7470; --text: #a9bdb7; --bright: #e6f4ef; --accent: #3cf0ff; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "JetBrains Mono", Consolas, monospace; }
header { padding: 14px 16px 6px; }
h1 { margin: 0 0 4px; font-size: 16px; color: var(--bright); }
header p { margin: 0 0 8px; color: var(--mid); max-width: 760px; }
header label { color: var(--mid); }
select { font: 16px "JetBrains Mono", Consolas, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--dim); padding: 4px; }
main { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 8px 16px 24px; }
.tile { border: 1px solid var(--dim); padding: 8px; }
.tile canvas { display: block; width: 100%; aspect-ratio: 1; touch-action: none; cursor: crosshair; background: var(--bg); }
.tile b { display: block; color: var(--accent); font-weight: 700; margin-top: 6px; }
.tile span { color: var(--mid); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>THE STICK: 8 LOOKS</h1>
  <p>it works as now: touch anywhere, drag past the middle and you step that way (4 ways), hold to keep walking. only the look changes. each tile shows itself; touch one and drag to try it.</p>
  <label for="pal">palette</label> <select id="pal"></select>
</header>
<main id="tiles"></main>
<script src="../data/palettes.js?v=16.02"></script>
<script>
(() => {
  'use strict';
  // ---------- colors: the game's palettes ----------
  const PALS = (window.NEON_PALETTES && window.NEON_PALETTES.palettes) || {};
  let C = { bg: '#06090a', dim: '#2c3a38', mid: '#5f7470', text: '#a9bdb7', bright: '#e6f4ef', accent: '#3cf0ff' };
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  function setPal(k) {
    const p = PALS[k]; if (!p) return;
    C = Object.assign({}, C, p);
    for (const s of ['bg', 'dim', 'mid', 'text', 'bright', 'accent']) document.documentElement.style.setProperty('--' + s, C[s]);
    try { localStorage.setItem('neon.stickmock.pal', k); } catch (e) { /* private mode */ }
  }
  { const sel = document.getElementById('pal'), keys = Object.keys(PALS).filter(k => !PALS[k].hidden);
    sel.innerHTML = keys.map(k => '<option value="' + k + '">' + PALS[k].name + '</option>').join('');
    let k0 = keys[0]; try { const s = localStorage.getItem('neon.stickmock.pal'); if (keys.includes(s)) k0 = s; } catch (e) { /* private mode */ }
    sel.value = k0; setPal(k0); sel.addEventListener('change', () => setPal(sel.value)); }

  // ---------- the stick's numbers (as the demo: stickDead, about 19px on a phone) ----------
  const DEAD = 19, R = DEAD * 2;   // past DEAD: a direction; R: how big each look is drawn
  const dirOf = (dx, dy) => Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)];
  const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
  const same = (a, b) => a && b && a[0] === b[0] && a[1] === b[1];

  // ---------- the 8 looks: draw(g, cx, cy, dir, fx, fy, pulse) ----------
  // dir: [dx, dy] or null; (fx, fy): the finger; pulse: 0-1, a step just happened (walking)
  const line = (g, pts, col, w = 2) => { g.strokeStyle = col; g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); };
  // a point in a direction's frame: forward f, sideways s
  const at = (cx, cy, [dx, dy], f, s) => [cx + dx * f - dy * s, cy + dy * f + dx * s];
  const armCol = (d, dir, pulse) => same(d, dir) ? rgba(C.accent, 0.75 + 0.25 * pulse) : rgba(C.accent, 0.3);
  const knob = (g, fx, fy, col = rgba(C.accent, 0.45)) => { g.fillStyle = col; g.beginPath(); g.arc(fx, fy, 6, 0, Math.PI * 2); g.fill(); };

  const LOOKS = [
    { name: '1. PLUS OUTLINE', note: 'the d-pad as one cross outline. the way you go lights up.',
      draw(g, cx, cy, dir, fx, fy, p) {
        const a = DEAD * 0.55, L = R;
        const pts = [];
        for (const d of DIRS) { pts.push(at(cx, cy, d, a, -a), at(cx, cy, d, L, -a), at(cx, cy, d, L, a)); }
        pts.push(pts[0]); line(g, pts, rgba(C.accent, 0.35));
        if (dir) { line(g, [at(cx, cy, dir, a, -a), at(cx, cy, dir, L, -a), at(cx, cy, dir, L, a), at(cx, cy, dir, a, a)], rgba(C.accent, 0.8 + 0.2 * p), 2.5); }
        knob(g, fx, fy);
      } },
    { name: '2. FOUR CHEVRONS', note: 'no outline: just the 4 ways, as chevrons. the live one is bold.',
      draw(g, cx, cy, dir, fx, fy, p) {
        for (const d of DIRS) { const on = same(d, dir), f = DEAD * 1.3 + (on ? 3 * p : 0), w = DEAD * 0.45;
          line(g, [at(cx, cy, d, f - w * 0.7, -w), at(cx, cy, d, f, 0), at(cx, cy, d, f - w * 0.7, w)], armCol(d, dir, p), on ? 3 : 2); }
        line(g, [[cx - 2, cy], [cx + 2, cy]], rgba(C.accent, 0.3));
        knob(g, fx, fy);
      } },
    { name: '3. PLUS + ARROWS', note: 'the cross outline, a small arrow in each arm.',
      draw(g, cx, cy, dir, fx, fy, p) {
        const a = DEAD * 0.6, L = R;
        const pts = []; for (const d of DIRS) pts.push(at(cx, cy, d, a, -a), at(cx, cy, d, L, -a), at(cx, cy, d, L, a)); pts.push(pts[0]);
        line(g, pts, rgba(C.accent, 0.3));
        for (const d of DIRS) { const on = same(d, dir), f = L - 7;
          line(g, [at(cx, cy, d, f - 5, -5), at(cx, cy, d, f, 0), at(cx, cy, d, f - 5, 5)], armCol(d, dir, p), on ? 2.5 : 1.5); }
        knob(g, fx, fy);
      } },
    { name: '4. ZONES', note: 'a square cut by its diagonals: the 4 zones as they really are. the live one fills.',
      draw(g, cx, cy, dir, fx, fy, p) {
        const L = R;
        if (dir) { const [dx, dy] = dir; g.fillStyle = rgba(C.accent, 0.12 + 0.08 * p); g.beginPath(); g.moveTo(cx, cy);
          g.lineTo(...at(cx, cy, dir, L, -L)); g.lineTo(...at(cx, cy, dir, L, L)); g.closePath(); g.fill(); }
        line(g, [[cx - L, cy - L], [cx + L, cy - L], [cx + L, cy + L], [cx - L, cy + L], [cx - L, cy - L]], rgba(C.accent, 0.3));
        line(g, [[cx - L, cy - L], [cx + L, cy + L]], rgba(C.accent, 0.18), 1); line(g, [[cx + L, cy - L], [cx - L, cy + L]], rgba(C.accent, 0.18), 1);
        g.strokeStyle = rgba(C.accent, 0.18); g.lineWidth = 1; g.strokeRect(cx - DEAD * 0.7, cy - DEAD * 0.7, DEAD * 1.4, DEAD * 1.4);
        knob(g, fx, fy);
      } },
    { name: '5. BRACKETS', note: 'four corner brackets frame it; tick arrows on the edges.',
      draw(g, cx, cy, dir, fx, fy, p) {
        const L = R, k = 9;
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) line(g, [[cx + sx * L, cy + sy * (L - k)], [cx + sx * L, cy + sy * L], [cx + sx * (L - k), cy + sy * L]], rgba(C.accent, 0.35));
        for (const d of DIRS) { const on = same(d, dir);
          line(g, [at(cx, cy, d, L - 9, -6), at(cx, cy, d, L - 2 + (on ? 2 * p : 0), 0), at(cx, cy, d, L - 9, 6)], armCol(d, dir, p), on ? 2.5 : 1.5); }
        knob(g, fx, fy);
      } },
    { name: '6. TYPED PAD', note: 'the classic pad\'s glyphs, floating: ▲ ◄ · ► ▼ in the game\'s font.',
      draw(g, cx, cy, dir, fx, fy, p) {
        g.font = '700 18px "JetBrains Mono", Consolas, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
        const G = { '0,-1': '▲', '1,0': '►', '0,1': '▼', '-1,0': '◄' };
        for (const d of DIRS) { const on = same(d, dir), [x, y] = at(cx, cy, d, DEAD * 1.5 + (on ? 2 * p : 0), 0); g.fillStyle = on ? rgba(C.accent, 0.95) : rgba(C.accent, 0.3); g.fillText(G[d + ''], x, y); }
        g.fillStyle = rgba(C.accent, 0.3); g.fillText('·', cx, cy);
        knob(g, fx, fy, rgba(C.accent, 0.3));
      } },
    { name: '7. TICKS', note: 'the least: four short marks at the edge of the dead zone; the live one grows into an arrow.',
      draw(g, cx, cy, dir, fx, fy, p) {
        for (const d of DIRS) { const on = same(d, dir);
          if (on) line(g, [at(cx, cy, d, DEAD, 0), at(cx, cy, d, R + 2 * p, 0), at(cx, cy, d, R - 7, -6), at(cx, cy, d, R + 2 * p, 0), at(cx, cy, d, R - 7, 6)], rgba(C.accent, 0.9), 2.5);
          else line(g, [at(cx, cy, d, DEAD, 0), at(cx, cy, d, DEAD + 8, 0)], rgba(C.accent, 0.35)); }
        g.fillStyle = rgba(C.accent, 0.35); g.beginPath(); g.arc(cx, cy, 2, 0, Math.PI * 2); g.fill();
        knob(g, fx, fy);
      } },
    { name: '8. SNAP PLUS', note: 'a rounded cross; the knob doesn\'t follow your finger, it snaps to the arm you\'re in.',
      draw(g, cx, cy, dir, fx, fy, p) {
        const a = DEAD * 0.5, L = R;
        for (const d of DIRS) { const on = same(d, dir); g.strokeStyle = armCol(d, dir, p); g.lineWidth = on ? 2.5 : 1.5;
          const [x1, y1] = at(cx, cy, d, a, 0), [x2, y2] = at(cx, cy, d, L - a, 0); g.beginPath();
          // a pill along the arm
          const ang = Math.atan2(d[1], d[0]);
          g.arc(x2, y2, a, ang - Math.PI / 2, ang + Math.PI / 2); g.lineTo(...at(cx, cy, d, a, a)); g.moveTo(...at(cx, cy, d, a, -a)); g.lineTo(...at(cx, cy, d, L - a, -a)); g.stroke(); }
        const [kx, ky] = dir ? at(cx, cy, dir, L - a - 2 + 2 * p, 0) : [cx, cy];
        g.strokeStyle = rgba(C.accent, 0.9); g.lineWidth = 2; g.strokeRect(kx - 5, ky - 5, 10, 10);
      } },
  ];

  // ---------- the tiles: a demo of each, or your finger ----------
  const tiles = LOOKS.map(look => {
    const el = document.createElement('div'); el.className = 'tile';
    el.innerHTML = '<canvas></canvas><b>' + look.name + '</b><span>' + look.note + '</span>';
    document.getElementById('tiles').appendChild(el);
    const cv = el.querySelector('canvas'), t = { look, cv, touch: null, lastStep: 0 };
    cv.addEventListener('pointerdown', e => { const r = cv.getBoundingClientRect(); cv.setPointerCapture(e.pointerId); t.touch = { x0: e.clientX - r.left, y0: e.clientY - r.top, x: e.clientX - r.left, y: e.clientY - r.top }; });
    cv.addEventListener('pointermove', e => { if (!t.touch) return; const r = cv.getBoundingClientRect(); t.touch.x = e.clientX - r.left; t.touch.y = e.clientY - r.top; });
    const up = () => { t.touch = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
    return t;
  });
  function frame(now) {
    for (const t of tiles) {
      const cv = t.cv, w = cv.clientWidth, dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(w * dpr); }
      const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.fillStyle = C.bg; g.fillRect(0, 0, w, w);
      let cx, cy, fx, fy, dir = null;
      if (t.touch) { cx = t.touch.x0; cy = t.touch.y0; fx = t.touch.x; fy = t.touch.y; const dx = fx - cx, dy = fy - cy; if (Math.hypot(dx, dy) >= DEAD) dir = dirOf(dx, dy); }
      else {   // the demo: rest, then up, right, down, left, a finger sliding out and back
        cx = w / 2; cy = w / 2; const ph = (now / 900) % 5, k = Math.floor(ph), s = ph - k;
        const reach = k === 0 ? 0 : Math.sin(Math.min(1, s * 1.4) * Math.PI) * DEAD * 1.8;
        const d = k ? DIRS[k - 1] : [0, 0]; fx = cx + d[0] * reach; fy = cy + d[1] * reach; if (reach >= DEAD) dir = d;
      }
      // walking: a step every 180ms while there's a direction (the pulse)
      if (dir && now - t.lastStep > 180) t.lastStep = now;
      const pulse = dir ? Math.max(0, 1 - (now - t.lastStep) / 180) : 0;
      t.look.draw(g, cx, cy, dir, fx, fy, pulse);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
