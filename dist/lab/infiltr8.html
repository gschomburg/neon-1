/* INFILTR8, a playable demo (Greg, 2026-11-23): not the game. Lives in dist/lab/ (uploaded with the game, not linked
   from it) so it can load the game's palettes (data/palettes.js, engine/core.js) and effects (engine/fx.js); nothing else. The real screen: the
   game's 36 x 38 grid (docs/LAYOUT.md), the 23 board rows are the floor, the tray rows hold the d-pad. Floors: F1 is
   THE RING (by hand), F2 and F3 come from the seed (rooms, halls, ducts). Turn based: you step, they step. Notes:
   docs/INFILTR8.md; the mockups: infiltr8.html, infiltr8_v2.html. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #06090a; overflow: hidden; }
canvas { display: block; touch-action: none; }
/* the dev panel (Greg, 2026-11-23): plain form controls, folded away by its button. Two layouts, picked by devPlace():
   - beside the game (body.dev-side: a wide window, room on the left): both on the window's left edge.
   - a phone (no room beside): the button on the footer's right end, the panel across the map, big enough to tap.
   (16px in the dropdowns: smaller, and an iPhone zooms the page when you tap one.) */
#dev-btn, #dev { position: fixed; font: 16px "JetBrains Mono", Consolas, monospace; color: var(--text); z-index: 2; touch-action: manipulation; }
#dev-btn { background: var(--bg); border: 1px solid var(--dim); color: var(--money); padding: 0 12px; cursor: pointer; }

<script>
// The bridge: the demo below has its own C, hashStr, newSeed... (they shadow the game's inside its function), so the
// game's come through here. (FX colors a hacker's ink with hkInk: not loaded here, so plain text.)
const GAME = { get C() { return C; }, PALETTES, CHIPS, applyPalette, mixHex, FX };

</script>
<script>
(() => {
'use strict';
// ---------- the screen: the game's grid (docs/LAYOUT.md) ----------
const SW = 36, SH = 38, MAP_Y = 8, MW = 36, MH = 23;   // the board: rows 8-30, 36 x 23
const LINE_H = 1.22, CHAR_W = 0.6;
// The colors: the game's palette (GAME.C, set by applyPalette), plus a few of the demo's own made from it.
const C = {};
const PALS = Object.keys(GAME.PALETTES);
let pal = 0;
try { pal = Math.max(0, PALS.indexOf(localStorage.getItem('neon.infiltr8.pal'))); } catch (e) { /* private mode */ }
{ const q = new URLSearchParams(location.search).get('pal'); if (q && PALS.includes(q)) pal = PALS.indexOf(q); }
function setPal(i) {
  pal = (i + PALS.length) % PALS.length; GAME.applyPalette(PALS[pal], true);
  const P = GAME.C, was = Object.assign({}, C);
  Object.assign(C, { bg: P.bg, dim: P.dim, mid: P.mid, text: P.text, bright: P.bright, accent: P.accent, danger: P.danger, money: P.money, rep: P.rep,
    rare: P.rare, green: P.common, leg: GAME.CHIPS.legendary.bg, seen: GAME.mixHex(P.bg, P.dim, 0.45) });
  // (the message keeps a color, not a slot: move it to the same slot in the new palette)
  try { if (S && S.msgCol) { const k = Object.keys(was).find(k => was[k] === S.msgCol); if (k) S.msgCol = C[k]; } } catch (e) { /* (the first call: S isn't there yet) */ }
  try { localStorage.setItem('neon.infiltr8.pal', PALS[pal]); } catch (e) { /* private mode */ }
}
setPal(pal);
const rgba = (hex, a) => 'rgba(' + [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',') + ',' + a + ')';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let L = {};
function layout() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  const fs = Math.min(w / (SW * CHAR_W), h / (SH * LINE_H));
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = { fs, cw: fs * CHAR_W, ch: fs * LINE_H, ox: (w - SW * fs * CHAR_W) / 2, oy: (h - SH * fs * LINE_H) / 2 };
}
addEventListener('resize', () => { layout(); draw(); });

// ---------- the seed ----------
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rngFrom = n => () => { n |= 0; n = n + 0x6D2B79F5 | 0; let t = Math.imul(n ^ n >>> 15, 1 | n); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const newSeed = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');

// ---------- tiles ----------
// ' ' void (outside everything)  '#' wall  '.' floor  '+' door  '<' stairs up  '>' stairs down  'E' the way in
// 'F' fire exit  'K' trash chute  'p' pillar  'v' vent (a hatch in a room's floor: the ducts are a layer under the floor,
// f.ducts / f.under, not tiles)
const T = {
  ' ': { walk: 0, see: 0 }, '#': { walk: 0, see: 0 }, '.': { walk: 1, see: 1 }, '+': { walk: 1, see: 1 }, '<': { walk: 1, see: 1 },
  '>': { walk: 1, see: 1 }, 'E': { walk: 1, see: 1 }, 'F': { walk: 1, see: 1 }, 'K': { walk: 1, see: 1 }, 'p': { walk: 0, see: 0 },
  'v': { walk: 1, see: 1 },
};
const WALLISH = '#+EFK';   // what joins up into box-drawn walls
const INFO = {
  '#': ['WALL', 'it blocks you, and what sees.'], '.': ['FLOOR', ''], '+': ['DOOR', 'open. it doesn\'t block sight.'],
  '<': ['STAIRS UP', 'USE: up a floor.'], '>': ['STAIRS DOWN', 'USE: down a floor.'], 'E': ['THE WAY IN', 'your door. leave by it: a clean job.'],
  'F': ['FIRE EXIT', 'USE: out now. loud: less pay.'], 'K': ['TRASH CHUTE', 'USE: out, but you land in the trash.'],
  'p': ['PILLAR', 'hide behind it. nothing sees through.'], 'v': ['VENT', 'a hatch to the ducts. USE: in, or out.'], ' ': ['', ''],
};

// ---------- a floor ----------
function newFloor(name) {
  const t = Array.from({ length: MH }, () => Array(MW).fill(' '));
  return { halls: new Set(), ducts: [], under: new Map(), name, t, seen: Array.from({ length: MH }, () => Array(MW).fill(false)), cams: [], pats: [], arm: null, payload: null, up: null, down: null, trail: [] };
}
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const at = (f, x, y) => inb(x, y) ? f.t[y][x] : ' ';
const set = (f, x, y, c) => { if (inb(x, y)) f.t[y][x] = c; };
function room(f, x, y, w, h) {   // walls round it, floor in it (an existing floor cell stays floor: rooms can overlap)
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
    const edge = i === x || j === y || i === x + w - 1 || j === y + h - 1;
    if (edge) { if (at(f, i, j) === ' ') set(f, i, j, '#'); } else set(f, i, j, '.');
  }
}
// a box that always draws its walls (THE RING's rings sit inside each other)
function box(f, x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(f, i, j, i === x || j === y || i === x + w - 1 || j === y + h - 1 ? '#' : '.'); }
const passable = (f, x, y) => !!T[at(f, x, y)].walk;
const opaque = (f, x, y) => !T[at(f, x, y)].see;

// ---------- F1: THE RING (by hand: round 2's map 1) ----------
// A core in a ring in a ring. The way in is at the bottom of the outer ring; every ring's door is on another side.
// The core's SCANNER (f.arm) turns, an eighth a turn; walls stop its beam. The stairs down are in the core.
function floorRing() {
  const f = newFloor('THE RING');
  box(f, 1, 0, 34, 23); box(f, 5, 3, 26, 17); box(f, 10, 6, 16, 11);   // the outer ring, the middle ring, the core
  set(f, 17, 22, 'E');            // the way in, bottom
  set(f, 5, 11, '+');             // middle ring: its door on the left
  set(f, 30, 6, '+');             // ...and one on the right, high
  set(f, 17, 6, '+');             // core: its door on top
  set(f, 34, 3, 'F');             // the fire exit, the outer ring's top right
  set(f, 12, 10, '>');            // the stairs down, in the core
  f.down = { x: 12, y: 10 };
  f.start = { x: 17, y: 21 };
  set(f, 9, 2, 'p'); set(f, 26, 2, 'p'); set(f, 9, 20, 'p'); set(f, 26, 20, 'p');   // pillars in the outer ring
  f.arm = { x: 18, y: 11, dir: 0 };
  f.cams.push(cam(f, 2, 1, 0.35));   // the outer ring's top left corner, looking along the top
  // the patrol walks the middle ring, the other way round
  const loop = [];
  for (let x = 7; x <= 28; x++) loop.push([x, 5]);
  for (let y = 6; y <= 17; y++) loop.push([28, y]);
  for (let x = 27; x >= 7; x--) loop.push([x, 17]);
  for (let y = 16; y >= 6; y--) loop.push([7, y]);
  f.pats.push(pat(loop, true));
  return f;
}

// ---------- F2, F3: from the seed ----------
// Rooms by BSP (bspRooms: the floor cut in pieces, a room in each), some with pillars, joined by halls: the pairs the cuts
// made (each cut joins its two sides, so it all joins up), plus a loop or two. A door where a hall meets a wall.
// F2: stairs up and down, ducts between two vents, the trash chute. F3: stairs up, the payload in the far room, the fire
// exit on an outside wall.
// BSP (binary space partitioning): cut the floor in two, and each half in two again, till the pieces are about room
// size; a room in each piece, filling most of it. So rooms spread over the whole floor (no big empty patches), and
// their sizes vary with their pieces. Each cut also says which rooms are neighbours: links joins the nearest pair across
// it (the halls follow those, so it all joins up; a piece left empty just has no link).
const BSP = {
  minW: 10, minH: 7,     // the smallest piece: a 7 x 5 room, and a gap round it for halls (a cell of gap on each side)
  stopArea: 190,         // a piece this small (in cells) may stop being cut: bigger rooms, fewer of them
  stopChance: 0.45,
  emptyChance: 0,        // a piece left empty now and then (0.08 left big holes: empty 9x6 patches went 0.2 -> 1.8 a floor)
};
function bspRooms(r) {
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1)), rooms = [], links = [];
  const near = (A, B) => { let best = null, bd = 1e9; for (const a of A) for (const b of B) { const d = Math.hypot(a.cx - b.cx, (a.cy - b.cy) * 2); if (d < bd) { bd = d; best = [a, b]; } } return best; };
  function cut(x, y, w, h, depth) {
    const canV = w >= BSP.minW * 2, canH = h >= BSP.minH * 2;
    if ((!canV && !canH) || (depth >= 2 && w * h <= BSP.stopArea && r() < BSP.stopChance)) {
      if (depth >= 2 && r() < BSP.emptyChance) return [];
      // the room: most of the piece, a cell of gap inside its edges
      const rw = ri(Math.max(7, Math.floor((w - 2) * 0.6)), w - 2), rh = ri(Math.max(5, Math.floor((h - 2) * 0.6)), h - 2);
      const rx = x + 1 + ri(0, w - 2 - rw), ry = y + 1 + ri(0, h - 2 - rh);
      const o = { x: rx, y: ry, w: rw, h: rh, cx: rx + Math.floor(rw / 2), cy: ry + Math.floor(rh / 2), piece: { x, y, w, h } };
      rooms.push(o); return [o];
    }
    // cut across the longer side as it looks (a cell is about twice as tall as wide)
    const vert = canV && (!canH || (w * CHAR_W > h * LINE_H ? r() < 0.8 : r() < 0.2));
    let A, B;
    if (vert) { const k = ri(BSP.minW, w - BSP.minW); A = cut(x, y, k, h, depth + 1); B = cut(x + k, y, w - k, h, depth + 1); }
    else { const k = ri(BSP.minH, h - BSP.minH); A = cut(x, y, w, k, depth + 1); B = cut(x, y + k, w, h - k, depth + 1); }
    if (A.length && B.length) links.push(near(A, B));
    return A.concat(B);
  }
  cut(0, 0, MW, MH, 0);
  return { rooms, links };
}
function floorGen(seed, n, last) {
  const r = rngFrom(hashStr(seed + ':' + n)), ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  for (let tries = 0; tries < 40; tries++) {
    const f = newFloor(last ? 'THE VAULT' : 'THE STACKS'), { rooms, links } = bspRooms(r);
    if (rooms.length < 5) continue;
    rooms.forEach(o => room(f, o.x, o.y, o.w, o.h));
    rooms.sort((a, b) => a.cx - b.cx || a.cy - b.cy);   // (rooms[0], the leftmost, gets the stairs up)
    // a loop or two: a pair of near rooms the cuts didn't join
    const joined = new Set(links.map(([a, b]) => rooms.indexOf(a) + '-' + rooms.indexOf(b)).concat(links.map(([a, b]) => rooms.indexOf(b) + '-' + rooms.indexOf(a))));
    const near = [];
    rooms.forEach((a, i) => rooms.forEach((b, j) => { if (i < j && !joined.has(i + '-' + j)) near.push([a, b, Math.hypot(a.cx - b.cx, (a.cy - b.cy) * 2)]); }));
    near.sort((p, q) => p[2] - q[2]);
    for (const [a, b] of near.slice(0, 4).sort(() => r() - 0.5).slice(0, ri(1, 2))) links.push([a, b]);
    const halls = new Set();
    if (!links.slice(0, rooms.length - 1).every(([a, b]) => hall(f, a, b, r, halls))) continue;   // (the chain has to join up)
    for (const [a, b] of links.slice(rooms.length - 1)) hall(f, a, b, r, halls);
    { const d0 = bfs(f, rooms[0].x + 1, rooms[0].y + 1, c => T[c].walk && !T[c].duct || c === 'p'); if (!rooms.every(o => d0[o.y + 1][o.x + 1])) continue; }
    f.halls = halls; f.junc = junctions(f, halls);
    // pillars in the big rooms
    for (const o of rooms) if (o.w >= 10 && o.h >= 6 && r() < 0.6) for (let i = o.x + 2; i < o.x + o.w - 2; i += 3) { set(f, i, o.y + 2, 'p'); if (o.h >= 7) set(f, i, o.y + o.h - 3, 'p'); }
    // stairs: up in the first room, down (or the payload) in the room farthest from it by walking
    const first = rooms[0], dist = bfs(f, first.cx, first.cy);
    const far = rooms.slice(1).sort((a, b) => (dist[b.cy][b.cx] || 0) - (dist[a.cy][a.cx] || 0))[0];
    if (!dist[far.cy][far.cx]) continue;   // (not joined up: try again)
    const spot = o => { for (let k = 0; k < 30; k++) { const x = ri(o.x + 1, o.x + o.w - 2), y = ri(o.y + 1, o.y + o.h - 2); if (at(f, x, y) === '.') return { x, y }; } return { x: o.cx, y: o.cy }; };
    f.up = spot(first); set(f, f.up.x, f.up.y, '<');
    if (last) {
      f.payload = spot(far);
      const wall = outerWall(f, rooms.filter(o => o !== first), r); if (wall) set(f, wall.x, wall.y, 'F');
    } else {
      f.down = spot(far); set(f, f.down.x, f.down.y, '>');
      const mid = rooms.filter(o => o !== first && o !== far);
      if (mid.length) { const o = mid[ri(0, mid.length - 1)], s = spot(o); set(f, s.x, s.y, 'K'); }
    }
    ducts(f, rooms, r, last ? 1 : 2);
    // cameras in room corners, looking in; patrols between two rooms
    const camRooms = rooms.filter(o => o !== first).sort(() => r() - 0.5).slice(0, last ? 3 : 2);
    for (const o of camRooms) {
      const corners = [[o.x + 1, o.y + 1], [o.x + o.w - 2, o.y + 1], [o.x + 1, o.y + o.h - 2], [o.x + o.w - 2, o.y + o.h - 2]].filter(([x, y]) => at(f, x, y) === '.');
      if (!corners.length) continue;
      const [x, y] = corners[ri(0, corners.length - 1)];
      f.cams.push(cam(f, x, y, Math.atan2(o.cy - y, o.cx - x)));
    }
    for (let p = 0, tries = 0; p < (last ? 2 : 1) && tries < 20; tries++) {   // two different rooms, a walk between them
      const a = rooms[ri(1, rooms.length - 1)], b = rooms[ri(0, rooms.length - 1)];
      if (a === b) continue;
      const sa = spot(a), sb = spot(b), path = route(f, sa.x, sa.y, sb.x, sb.y);
      if (path && path.length > 6) { f.pats.push(pat(path, false)); p++; }
    }
    f.rooms = rooms;
    return f;
  }
  return floorGen(seed + 'x', n, last);
}
// A hall from a to b: a door on the side of each room that faces the other (not by a corner), and between them a path
// through the empty space (and halls already there): it goes round rooms, likes straight runs, and keeps off walls.
function hall(f, a, b, r, halls) {
  const da = doorOn(f, a, b, r, halls), db = doorOn(f, b, a, r, halls);
  if (!da || !db) return false;
  const path = routeHall(f, da, db, halls);
  if (!path) return false;
  set(f, da.x, da.y, '+'); set(f, db.x, db.y, '+');
  for (const [x, y] of path) { set(f, x, y, '.'); halls.add(x + ',' + y); }
  return true;
}
function doorOn(f, o, to, r, halls) {
  const dx = to.cx - o.cx, dy = to.cy - o.cy, horiz = Math.abs(dx) > Math.abs(dy) * 1.5;
  const sides = horiz ? [dx > 0 ? 'e' : 'w', dy > 0 ? 's' : 'n'] : [dy > 0 ? 's' : 'n', dx > 0 ? 'e' : 'w'];
  const free = (x, y) => at(f, x, y) === ' ' || halls.has(x + ',' + y);
  for (const sd of sides) {

    const c = f.cams.find(c => c.x === x && c.y === y && !c.dead); if (c) return { x, y, glyph: CAM_GLYPH, name: 'CAM', text: 'sweeps a cone. 2 turns in it: an alert.' };

addEventListener('keydown', ev => {
  if (ev.target && ev.target.closest && ev.target.closest('#dev, #v-floor')) return;   // (in the viewer, its buttons keep the arrow keys)

// ---------- the dev panel ----------
const $ = id => document.getElementById(id);

  S.fi = i; S.inDuct = false; S.floorT = performance.now();

// ---------- the floor viewer (Greg, 2026-11-23) ----------
// One generated floor at a time, as big as the window lets it be: the whole floor as the generator made it (patrols at

// slide to the floor before or after; past the last one there's always a new one. To find what the generator gets
