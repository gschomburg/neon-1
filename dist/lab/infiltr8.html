<head>

<style>
/* INFILTR8, a playable demo (Greg, 2026-11-23): not the game. Lives in dist/lab/ (uploaded with the game, not linked
   from it) so it can load the game's palettes (data/palettes.js, engine/core.js) and effects (engine/fx.js); nothing else. The real screen: the
   game's 36 x 38 grid (docs/LAYOUT.md), the 23 board rows are the floor, the tray rows hold the d-pad. Floors: F1 is
   THE RING (by hand), F2 and F3 come from the seed (rooms, halls, ducts). Turn based: you step, they step. Notes:
   docs/INFILTR8.md; the mockups: infiltr8.html, infiltr8_v2.html. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #06090a; overflow: hidden; }
canvas { display: block; touch-action: none; }
/* the dev panel (Greg, 2026-11-23): plain form controls, folded away by its button. Two layouts, picked by devPlace():
   - beside the game (body.dev-side: a wide window, room on the left): both on the window's left edge.
   - a phone (no room beside): the button on the footer's right end, the panel across the map, big enough to tap.
   (16px in the dropdowns: smaller, and an iPhone zooms the page when you tap one.) */
#dev-btn, #dev { position: fixed; font: 16px "JetBrains Mono", Consolas, monospace; color: var(--text); z-index: 2; touch-action: manipulation; }
#dev-btn { background: var(--bg); border: 1px solid var(--dim); color: var(--money); padding: 0 12px; cursor: pointer; }
#dev { box-sizing: border-box; background: var(--bg); border: 1px solid var(--dim); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; opacity: 0.96; }
#dev label { color: var(--mid); }
#dev .dev-row { display: flex; gap: 8px; }
#dev .dev-row button { flex: 1; font: inherit; background: var(--bg); color: var(--accent); border: 1px solid var(--dim); min-height: 40px; cursor: pointer; }
#dev .dev-row button:disabled { color: var(--dim); cursor: default; }
body.dev-side #dev .dev-row button { min-height: 0; padding: 3px 6px; }
#dev select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--dim); padding: 4px; min-height: 40px; width: 100%; min-width: 0; }
#dev input[type=checkbox] { accent-color: var(--accent); justify-self: start; width: 26px; height: 26px; margin: 0; }
body.dev-side #dev-btn, body.dev-side #dev { left: 8px; font-size: 14.4px; }
body.dev-side #dev-btn { top: 8px; padding: 3px 8px; }
body.dev-side #dev { top: 40px; max-width: calc(100vw - 16px); padding: 10px; gap: 7px 10px; }
body.dev-side #dev select { min-height: 0; padding: 3px; width: auto; }
body.dev-side #dev input[type=checkbox] { width: 17px; height: 17px; }
/* the floor viewer: a dozen generated floors at once (to see what the generator gets wrong). Over everything. */
#viewer { position: fixed; inset: 0; z-index: 3; background: var(--bg); color: var(--text); overflow: auto; font: 14px "JetBrains Mono", Consolas, monospace; }
#viewer .v-bar { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--dim); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
#viewer .v-bar b { color: var(--accent); font-weight: 700; }
#viewer .v-note { color: var(--mid); }
#viewer select, #viewer button { font: 16px "JetBrains Mono", Consolas, monospace; background: var(--bg); color: var(--accent); border: 1px solid var(--dim); min-height: 36px; padding: 2px 10px; cursor: pointer; }
#viewer { display: flex; flex-direction: column; overflow: hidden; }
#viewer .v-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; }
#viewer .v-arrow { min-height: 64px; min-width: 40px; font-size: 22px; padding: 0; flex: none; }
#v-cvs { display: block; touch-action: none; }
#v-cap { text-align: center; color: var(--mid); padding: 0 12px 12px; }
#v-cap b { color: var(--money); font-weight: 400; }
[hidden] { display: none !important; }
</style>

<!-- the game's palettes and effects: these four files and nothing else (tools/bump.js keeps the ?v= in step) -->

<script>
// The bridge: the demo below has its own C, hashStr, newSeed... (they shadow the game's inside its function), so the
// game's come through here. (FX colors a hacker's ink with hkInk: not loaded here, so plain text.)
const GAME = { get C() { return C; }, PALETTES, CHIPS, applyPalette, mixHex, FX };
if (typeof hkInk === 'undefined') window.hkInk = () => C.text;
</script>
<script>
(() => {
'use strict';
// ---------- the screen: the game's grid (docs/LAYOUT.md) ----------
const SW = 36, SH = 38, MAP_Y = 8, MW = 36, MH = 23;   // the board: rows 8-30, 36 x 23
const LINE_H = 1.22, CHAR_W = 0.6;
// The colors: the game's palette (GAME.C, set by applyPalette), plus a few of the demo's own made from it.
const C = {};
const PALS = Object.keys(GAME.PALETTES);
let pal = 0;
try { pal = Math.max(0, PALS.indexOf(localStorage.getItem('neon.infiltr8.pal'))); } catch (e) { /* private mode */ }
{ const q = new URLSearchParams(location.search).get('pal'); if (q && PALS.includes(q)) pal = PALS.indexOf(q); }
function setPal(i) {
  pal = (i + PALS.length) % PALS.length; GAME.applyPalette(PALS[pal], true);
  const P = GAME.C, was = Object.assign({}, C);
  Object.assign(C, { bg: P.bg, dim: P.dim, mid: P.mid, text: P.text, bright: P.bright, accent: P.accent, danger: P.danger, money: P.money, rep: P.rep,
    rare: P.rare, green: P.common, leg: GAME.CHIPS.legendary.bg, seen: GAME.mixHex(P.bg, P.dim, 0.45) });
  // (the message keeps a color, not a slot: move it to the same slot in the new palette)
  try { if (S && S.msgCol) { const k = Object.keys(was).find(k => was[k] === S.msgCol); if (k) S.msgCol = C[k]; } } catch (e) { /* (the first call: S isn't there yet) */ }
  try { localStorage.setItem('neon.infiltr8.pal', PALS[pal]); } catch (e) { /* private mode */ }
}
setPal(pal);
const rgba = (hex, a) => 'rgba(' + [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',') + ',' + a + ')';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let L = {};
function layout() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  const fs = Math.min(w / (SW * CHAR_W), h / (SH * LINE_H));
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = { fs, cw: fs * CHAR_W, ch: fs * LINE_H, ox: (w - SW * fs * CHAR_W) / 2, oy: (h - SH * fs * LINE_H) / 2 };
}
addEventListener('resize', () => { layout(); draw(); });

// ---------- the seed ----------
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rngFrom = n => () => { n |= 0; n = n + 0x6D2B79F5 | 0; let t = Math.imul(n ^ n >>> 15, 1 | n); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const newSeed = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');

// ---------- tiles ----------
// ' ' void (outside everything)  '#' wall  '.' floor  '+' door  '<' stairs up  '>' stairs down  'E' the way in
// 'F' fire exit  'K' trash chute  'p' pillar  'v' vent (a hatch in a room's floor: the ducts are a layer under the floor,
// f.ducts / f.under, not tiles)
const T = {
  ' ': { walk: 0, see: 0 }, '#': { walk: 0, see: 0 }, '.': { walk: 1, see: 1 }, '+': { walk: 1, see: 1 }, '<': { walk: 1, see: 1 },
  '>': { walk: 1, see: 1 }, 'E': { walk: 1, see: 1 }, 'F': { walk: 1, see: 1 }, 'K': { walk: 1, see: 1 }, 'p': { walk: 0, see: 0 },
  'v': { walk: 1, see: 1 }, 'r': { walk: 0, see: 0 }, 'd': { walk: 0, see: 1, low: 1 }, 'g': { walk: 0, see: 1, low: 1 }, '=': { walk: 0, see: 1, low: 1 }, '"': { walk: 1, see: 1, hide: 1 }, 'b': { walk: 1, see: 1 }, 'x': { walk: 0, see: 0 }, 'u': { walk: 0, see: 0 }, 'm': { walk: 0, see: 0 },
};
const WALLISH = '#+EF';   // what joins up into box-drawn walls (the chute, K, sits on a room's floor now: not a wall. Greg, H3SDQ4)
const INFO = {
  '#': ['WALL', 'it blocks you, and what sees.'], '.': ['FLOOR', ''], '+': ['DOOR', 'open. it doesn\'t block sight.'],
  '<': ['STAIRS UP', 'USE: up a floor.'], '>': ['STAIRS DOWN', 'USE: down a floor.'], 'E': ['THE WAY IN', 'your door. leave by it: a clean job.'],
  'F': ['FIRE EXIT', 'USE: out now. loud: less pay.'], 'K': ['TRASH CHUTE', 'USE: out, but you land in the trash.'],
  'p': ['PILLAR', 'hide behind it. nothing sees through.'], 'v': ['VENT', 'a hatch to the ducts. USE: in, or out.'], 'r': ['RACKS', 'servers. nothing sees through: hide in the rows.'], 'd': ['DESKS', 'low cover: crouch right behind one.'], 'g': ['A PLANT', 'low cover: crouch right behind it.'],
  'u': ['A STATUE', 'nothing sees through it.'], '=': ['A BENCH', 'low cover: crouch right behind it.'],
  '"': ['PLANT BEDS', 'step in: hidden unless right by you.'],
  'b': ['THE BELT', 'it carries you. off before the press.'], 'x': ['A CRATE', 'on the belt. nothing sees through.'], 'm': ['A TANK', 'machinery. nothing sees through it.'], ' ': ['', ''],
};

// ---------- a floor ----------
function newFloor(name) {
  const t = Array.from({ length: MH }, () => Array(MW).fill(' '));
  return { halls: new Set(), ducts: [], under: new Map(), name, t, seen: Array.from({ length: MH }, () => Array(MW).fill(false)), cams: [], pats: [], arm: null, payload: null, up: null, down: null, trail: [] };
}
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const at = (f, x, y) => inb(x, y) ? f.t[y][x] : ' ';
const set = (f, x, y, c) => { if (inb(x, y)) f.t[y][x] = c; };
function room(f, x, y, w, h) {   // walls round it, floor in it (an existing floor cell stays floor: rooms can overlap)
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
    const edge = i === x || j === y || i === x + w - 1 || j === y + h - 1;
    if (edge) { if (at(f, i, j) === ' ') set(f, i, j, '#'); } else set(f, i, j, '.');
  }
}
// a box that always draws its walls (THE RING's rings sit inside each other)
function box(f, x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(f, i, j, i === x || j === y || i === x + w - 1 || j === y + h - 1 ? '#' : '.'); }
const passable = (f, x, y) => !!T[at(f, x, y)].walk;
const opaque = (f, x, y) => !T[at(f, x, y)].see;

// ---------- F1: THE RING (by hand: round 2's map 1) ----------
// A core in a ring in a ring. The way in is at the bottom of the outer ring; every ring's door is on another side.
// The core's SCANNER (f.arm) turns, an eighth a turn; walls stop its beam. The stairs down are in the core.
function floorRing() {
  const f = newFloor('THE RING');
  box(f, 1, 0, 34, 23); box(f, 5, 3, 26, 17); box(f, 10, 6, 16, 11);   // the outer ring, the middle ring, the core
  set(f, 17, 22, 'E');            // the way in, bottom
  set(f, 5, 11, '+');             // middle ring: its door on the left
  set(f, 30, 6, '+');             // ...and one on the right, high
  set(f, 17, 6, '+');             // core: its door on top
  set(f, 34, 3, 'F');             // the fire exit, the outer ring's top right
  set(f, 12, 10, '>');            // the stairs down, in the core
  f.down = { x: 12, y: 10 };
  f.start = { x: 17, y: 21 };
  set(f, 9, 2, 'p'); set(f, 26, 2, 'p'); set(f, 9, 20, 'p'); set(f, 26, 20, 'p');   // pillars in the outer ring
  f.arm = { x: 18, y: 11, dir: 0 };
  f.cams.push(cam(f, 2, 1, 0.35));   // the outer ring's top left corner, looking along the top
  // the patrol walks the middle ring, the other way round
  const loop = [];
  for (let x = 7; x <= 28; x++) loop.push([x, 5]);
  for (let y = 6; y <= 17; y++) loop.push([28, y]);
  for (let x = 27; x >= 7; x--) loop.push([x, 17]);
  for (let y = 16; y >= 6; y--) loop.push([7, y]);
  f.pats.push(pat(loop, true));
  return f;
}

// ---------- F2, F3: from the seed ----------
// Rooms by BSP (bspRooms: the floor cut in pieces, a room in each), some with pillars, joined by halls: the pairs the cuts
// made (each cut joins its two sides, so it all joins up), plus a loop or two. A door where a hall meets a wall.
// F2: stairs up and down, ducts between two vents, the trash chute. F3: stairs up, the payload in the far room, the fire
// exit on an outside wall.
// ROOM SHAPES (Greg, 2026-11-23): a room is a set of floor cells (o.cells, o.set), inside its box (o.x, o.y, o.w, o.h:
// the walls' outer edge). Its walls are drawn round whatever the cells make (drawRoom), so doors, CAMs and spots work
// from the cells, not the box. o.mid: the cell nearest its middle (where walking distances are measured from).
//   box   the whole box
//   cut   its four inside corners cut off (it reads rounder)
//   L     a corner of it cut away (the inside corner is a blind spot)
//   split a wall across it with a gap: two chambers (peek round the gap)
//   cross its four corners cut away: a plus, arms to hide in
//   ring  a room in a room: a corridor round a core, one way into the core (THE RING's idea)
//   gallery  long and thin: the box cut down to 3 across (a hall-like room, good for a sweeping CAM)
//   (big: a big hall, from BSP: two pieces' room as one; a box or cut, with pillars more often)
const SHAPES = { box: 0.24, cut: 0.12, L: 0.24, split: 0.18, cross: 0.1, ring: 0.06, gallery: 0.06 };   // (the odds, among the shapes that fit the room)
// what a shape needs (iw, ih: the room's inside). A room rolls only among the shapes it fits (rolling among all of them
// and falling back to a box made boxes 55%, and cross, ring and gallery all but never: most rooms are small).
const SHAPE_FITS = {
  box: () => true, cut: (iw, ih) => iw >= 3 && ih >= 3, L: (iw, ih) => iw >= 5 && ih >= 3, split: (iw, ih) => iw >= 9 || ih >= 5,
  cross: (iw, ih) => iw >= 7 && ih >= 4, ring: (iw, ih) => iw >= 9 && ih >= 6, gallery: (iw, ih) => (iw >= 12 && ih >= 5) || (ih >= 9 && iw >= 5 && iw < 12),
};
function shapeRoom(o, r) {
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1)), x0 = o.x + 1, y0 = o.y + 1, iw = o.w - 2, ih = o.h - 2;
  // (a big hall: a box, or rounder: cut, cross, ring)
  const fits = Object.entries(SHAPES).filter(([k]) => SHAPE_FITS[k](iw, ih) && (!o.big || ['box', 'cut', 'cross', 'ring'].includes(k)));
  let roll = r() * fits.reduce((t, [, p]) => t + p, 0), shape = 'box';
  for (const [k, p] of fits) { if (roll < p) { shape = k; break; } roll -= p; }
  const out = new Set();   // inside the box, but not the room's floor
  if (shape === 'cut') for (const [x, y] of [[x0, y0], [x0 + iw - 1, y0], [x0, y0 + ih - 1], [x0 + iw - 1, y0 + ih - 1]]) out.add(x + ',' + y);
  else if (shape === 'L' && iw >= 5 && ih >= 3) {   // (the arms left: 2 cells wide at least)
    const cw = ri(Math.ceil(iw * 0.35), iw - 2), chh = ri(Math.max(1, Math.ceil(ih * 0.35)), ih - 2), cx = r() < 0.5 ? x0 : x0 + iw - cw, cy = r() < 0.5 ? y0 : y0 + ih - chh;
    for (let y = cy; y < cy + chh; y++) for (let x = cx; x < cx + cw; x++) out.add(x + ',' + y);
  } else if (shape === 'split' && (iw >= 9 || ih >= 5)) {
    const gap = r() < 0.5 ? 1 : 2;
    if (iw >= 9 && (ih < 5 || r() < 0.5)) { const px = x0 + ri(3, iw - 4), gy = ri(y0 + 1, y0 + ih - 1 - gap); for (let y = y0; y < y0 + ih; y++) if (y < gy || y >= gy + gap) out.add(px + ',' + y); }
    else { const py = y0 + ri(2, ih - 3), gx = ri(x0 + 1, x0 + iw - 1 - gap); for (let x = x0; x < x0 + iw; x++) if (x < gx || x >= gx + gap) out.add(x + ',' + py); }
  } else if (shape === 'cross' && SHAPE_FITS.cross(iw, ih)) {
    const cw = Math.max(1, Math.floor(iw * 0.3)), ch = Math.max(1, Math.floor(ih * 0.3));
    for (const [cx, cy] of [[x0, y0], [x0 + iw - cw, y0], [x0, y0 + ih - ch], [x0 + iw - cw, y0 + ih - ch]]) for (let y = cy; y < cy + ch; y++) for (let x = cx; x < cx + cw; x++) out.add(x + ',' + y);
  } else if (shape === 'ring' && SHAPE_FITS.ring(iw, ih)) {
    // the core's wall, a corridor 1 wide inside the room's, with one gap (not at a corner) into the core
    const ax = x0 + 1, ay = y0 + 1, bx = x0 + iw - 2, by = y0 + ih - 2, ring = [];
    for (let x = ax; x <= bx; x++) ring.push([x, ay], [x, by]);
    for (let y = ay + 1; y < by; y++) ring.push([ax, y], [bx, y]);
    const sides = ring.filter(([x, y]) => !((x === ax || x === bx) && (y === ay || y === by))), gap = sides[ri(0, sides.length - 1)];
    for (const [x, y] of ring) if (x !== gap[0] || y !== gap[1]) out.add(x + ',' + y);
  } else if (shape === 'gallery' && ((iw >= 12 && ih >= 5) || (ih >= 9 && iw >= 5 && iw < 12))) {
    // cut down to 3 across, in the middle of the box (the box shrinks to fit, so its walls and doors follow)
    if (iw >= 12 && ih >= 5) { const ny = y0 + Math.floor((ih - 3) / 2); o.y = ny - 1; o.h = 5; o.cy = ny + 1; }
    else { const nx = x0 + Math.floor((iw - 3) / 2); o.x = nx - 1; o.w = 5; o.cx = nx + 1; }
  } else if (shape !== 'cut') shape = 'box';
  if (shape === 'gallery') { o.shape = shape; o.cells = []; o.set = new Set();
    for (let y = o.y + 1; y < o.y + o.h - 1; y++) for (let x = o.x + 1; x < o.x + o.w - 1; x++) { o.cells.push([x, y]); o.set.add(x + ',' + y); }
    let best = 1e9; for (const [x, y] of o.cells) { const d = Math.hypot(x - o.cx, (y - o.cy) * 2); if (d < best) { best = d; o.mid = { x, y }; } }
    return; }
  o.shape = shape; o.cells = []; o.set = new Set();
  for (let y = y0; y < y0 + ih; y++) for (let x = x0; x < x0 + iw; x++) if (!out.has(x + ',' + y)) { o.cells.push([x, y]); o.set.add(x + ',' + y); }
  let best = 1e9; for (const [x, y] of o.cells) { const d = Math.hypot(x - o.cx, (y - o.cy) * 2); if (d < best) { best = d; o.mid = { x, y }; } }
}
// floor in the room's cells, a wall on every empty cell round them (a split's wall is one of those)
function drawRoom(f, o) {
  for (const [x, y] of o.cells) set(f, x, y, '.');
  for (const [x, y] of o.cells) for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (!o.set.has((x + i) + ',' + (y + j)) && at(f, x + i, y + j) === ' ') set(f, x + i, y + j, '#');
}
// ---------- ROLES, TYPES, PLACEMENT (Greg, 2026-11-23) ----------
// A room's ROLE comes from where it sits: start (the stairs up), goal (the stairs down; the payload on F3), hub (3 doors or
// more: routes pass through), side (1 door: a dead end), way (the rest). Room TYPES pick roles that fit them (THE VAULT is
// F3's goal; THE SERVER FARM a big room on the way). CAMs and patrols are placed by role (placeCams, placePats).
const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
// A shuffle from the seed (Fisher-Yates: one draw an item). Never sort(() => r() - 0.5): how often a sort calls its

    cell(xx, yy, g0, onWay ? C.accent : g0 === '▀' || (walk.has(k) && '.+'.includes(c)) ? C.danger : C[TCOL[c]] || C.text, '<>EF'.includes(c) || onWay);
  }
  if (f.payload) cell(f.payload.x, f.payload.y, '$', C.money, true);
  for (const c of f.cams) cell(c.x, c.y, CAM_GLYPH, C.danger, true);
  for (const p of f.pats) cell(p.x, p.y, 'P', C.danger, true);
  // each room's type (gold) or role (dim), on its top wall
  for (const o of f.rooms || []) {
    let label = o.role === 'closet' ? '' : o.type ? ROOM_TYPES[o.type][0].replace(/^THE /, '') : o.role === 'way' ? '' : o.role;
    if (!label) continue;

    for (const wy of [o.y, o.y + o.h - 1]) for (let lx = o.x + 1, run = 0; lx <= o.x + o.w - 1; lx++) {

  }
}
