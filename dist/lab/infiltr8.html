<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INFILTR8 Demo</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap">
<style>
/* INFILTR8, a playable demo (Greg, 2026-11-23): not the game. Lives in dist/lab/ (uploaded with the game, not linked
   from it) so it can load the game's palettes (data/palettes.js, engine/core.js) and effects (engine/fx.js); nothing else. The real screen: the
   game's 36 x 38 grid (docs/LAYOUT.md), the 23 board rows are the floor, the tray rows hold the d-pad. Floors: F1 is
   THE RING (by hand), F2 and F3 come from the seed (rooms, halls, ducts). Turn based: you step, they step. Notes:
   docs/INFILTR8.md; the mockups: infiltr8.html, infiltr8_v2.html. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #06090a; overflow: hidden; }
canvas { display: block; touch-action: none; }
/* a phone (Greg, 2026-11-24): a long press shouldn't select text (it caught the DEV button's), pop Safari's callout or
   flash a tap highlight. A light pass: the game will have its own. The dev panel's dropdowns still work. */
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; }
/* the dev panel (Greg, 2026-11-23): plain form controls, folded away by its button. Two layouts, picked by devPlace():
   - beside the game (body.dev-side: a wide window, room on the left): both on the window's left edge.
   - a phone (no room beside): the button on the footer's right end, the panel across the map, big enough to tap.
   (16px in the dropdowns: smaller, and an iPhone zooms the page when you tap one.) */
#dev-btn, #dev { position: fixed; font: 16px "JetBrains Mono", Consolas, monospace; color: var(--text); z-index: 2; touch-action: manipulation; }
#dev-btn { background: var(--bg); border: 1px solid var(--dim); color: var(--money); padding: 0 12px; cursor: pointer; }
#dev { box-sizing: border-box; background: var(--bg); border: 1px solid var(--dim); padding: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 12px; align-items: center; opacity: 0.96; }
#dev label { color: var(--mid); }
#dev .dev-row { display: flex; gap: 8px; }
#dev .dev-row button { flex: 1; font: inherit; background: var(--bg); color: var(--accent); border: 1px solid var(--dim); min-height: 40px; cursor: pointer; }
#dev .dev-row button:disabled { color: var(--dim); cursor: default; }
body.dev-side #dev .dev-row button { min-height: 0; padding: 3px 6px; }
#dev select { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--dim); padding: 4px; min-height: 40px; width: 100%; min-width: 0; }
#dev input[type=checkbox] { accent-color: var(--accent); justify-self: start; width: 26px; height: 26px; margin: 0; }
body.dev-side #dev-btn, body.dev-side #dev { left: 8px; font-size: 14.4px; }
body.dev-side #dev-btn { top: 8px; padding: 3px 8px; }
body.dev-side #dev { top: 40px; max-width: calc(100vw - 16px); padding: 10px; gap: 7px 10px; }
body.dev-side #dev select { min-height: 0; padding: 3px; width: auto; }
body.dev-side #dev input[type=checkbox] { width: 17px; height: 17px; }
/* the floor viewer: a dozen generated floors at once (to see what the generator gets wrong). Over everything. */
#viewer { position: fixed; inset: 0; z-index: 3; background: var(--bg); color: var(--text); overflow: auto; font: 14px "JetBrains Mono", Consolas, monospace; }
#viewer .v-bar { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--dim); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
#viewer .v-bar b { color: var(--accent); font-weight: 700; }
#viewer .v-note { color: var(--mid); }
#viewer select, #viewer button { font: 16px "JetBrains Mono", Consolas, monospace; background: var(--bg); color: var(--accent); border: 1px solid var(--dim); min-height: 36px; padding: 2px 10px; cursor: pointer; }
#viewer { display: flex; flex-direction: column; overflow: hidden; }
#viewer .v-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px; }
#viewer .v-arrow { min-height: 64px; min-width: 40px; font-size: 22px; padding: 0; flex: none; }
#v-cvs { display: block; touch-action: none; }
#v-cap { text-align: center; color: var(--mid); padding: 0 12px 12px; }
#v-cap b { color: var(--money); font-weight: 400; }
/* the LOADOUT form (Greg, 2026-11-24): a dev form, not the game's grid. The game gets its own screen for this later,
   so it's plain HTML: any length of text, and it scrolls. Over everything but the viewer. */
#kit-form { position: fixed; inset: 0; z-index: 2; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; padding: 12px; font: 15px/1.4 "JetBrains Mono", Consolas, monospace; color: var(--text); }
#kit-form .kit-box { background: var(--bg); border: 1px solid var(--dim); max-width: 560px; width: 100%; max-height: 100%; overflow: auto; padding: 14px; }
#kit-form h2 { margin: 0 0 2px; font-size: 16px; color: var(--bright); }
#kit-form .kit-note { color: var(--mid); margin: 0 0 12px; }
#kit-form .kit { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--dim); padding: 10px 12px; margin: 0 0 10px; cursor: pointer; touch-action: manipulation; }
#kit-form .kit.on { border-color: var(--accent); }
#kit-form .kit:hover, #kit-form .kit:focus-visible { border-color: var(--money); outline: none; }
#kit-form .kit-name { display: block; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
#kit-form .kit-pass b, #kit-form li b { color: var(--money); font-weight: 400; }
#kit-form ul { margin: 6px 0 0; padding-left: 18px; color: var(--mid); }
#kit-form li { margin-top: 4px; }
#kit-form i { color: var(--dim); font-style: normal; }
#kit-form .kit-tabs { display: flex; gap: 8px; margin: 0 0 12px; }
#kit-form .kit-tabs button { flex: 1; font: inherit; background: var(--bg); color: var(--mid); border: 1px solid var(--dim); min-height: 40px; cursor: pointer; }
#kit-form .kit-tabs button.on { color: var(--accent); border-color: var(--accent); }
#kit-custom label { display: block; color: var(--mid); margin-top: 10px; }
#kit-custom select { font: 16px "JetBrains Mono", Consolas, monospace; background: var(--bg); color: var(--text); border: 1px solid var(--dim); padding: 4px; min-height: 40px; width: 100%; margin-top: 4px; }
#kit-custom .kc-d { margin: 6px 0 0; color: var(--mid); }
#kit-custom .kc-d b { color: var(--money); font-weight: 400; }
#kit-custom .kc-sum { color: var(--text); margin: 14px 0 10px; }
#kit-form .kit-use { font: inherit; background: var(--bg); color: var(--accent); border: 1px solid var(--accent); padding: 6px 14px; min-height: 44px; width: 100%; margin-bottom: 10px; cursor: pointer; }
#kit-form .kit-close { font: inherit; background: var(--bg); color: var(--mid); border: 1px solid var(--dim); padding: 6px 14px; min-height: 40px; cursor: pointer; }
/* every other popup too (Greg, 2026-11-24): stations, ACTIONS, the help. Dev forms, not the grid, while what's in
   them settles; the game's own UI later. Same look as the LOADOUT form. */
.devpop { position: fixed; inset: 0; z-index: 2; background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; padding: 12px; font: 15px/1.4 "JetBrains Mono", Consolas, monospace; color: var(--text); }
.devpop .kit-box { background: var(--bg); border: 1px solid var(--dim); max-width: 560px; width: 100%; max-height: 100%; overflow: auto; padding: 14px; }
.devpop h2 { margin: 0 0 2px; font-size: 16px; color: var(--bright); }
.devpop .kit-note { color: var(--mid); margin: 0 0 12px; }
.devpop .pop-opt { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--dim); padding: 10px 12px; margin: 0 0 10px; cursor: pointer; touch-action: manipulation; }
.devpop .pop-opt:hover, .devpop .pop-opt:focus-visible { border-color: var(--money); outline: none; }
.devpop .pop-opt b { display: block; color: var(--accent); font-weight: 700; }
.devpop .pop-opt span { color: var(--mid); }
.devpop .kit-close { font: inherit; background: var(--bg); color: var(--mid); border: 1px solid var(--dim); padding: 6px 14px; min-height: 40px; cursor: pointer; }
.devpop .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px; margin: 0 0 12px; }
.devpop .legend i { font-style: normal; display: inline-block; min-width: 1.4em; text-align: center; margin-right: 6px; }
.devpop h3 { margin: 12px 0 4px; font-size: 15px; color: var(--bright); }
.devpop p { margin: 0 0 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="dev-btn" type="button" title="the dev panel">DEV</button>
<div id="pop" class="devpop" hidden>

</div>
<div id="viewer" hidden>
  <div class="v-bar">
    <b>FLOOR VIEWER</b>
    <select id="v-floor"><option value="2">F2 THE STACKS</option><option value="3">F3 THE VAULT</option><option value="4">THE ROOF</option></select>
    <select id="v-bld" title="the building type (AUTO: the seed picks)"></select>
    <button id="v-reroll" type="button" title="a new seed for this floor (R)">REROLL</button>
    <button id="v-labels" type="button" title="the rooms' labels, on or off (L)">LABELS ON</button>
    <button id="v-play" type="button">PLAY IT</button>
    <button id="v-close" type="button">CLOSE</button>
  </div>
  <div class="v-stage">
    <button id="v-prev" class="v-arrow" type="button" title="the floor before (left arrow, or swipe right)">◄</button>

    <button id="v-next" class="v-arrow" type="button" title="the next floor (right arrow, or swipe left)">►</button>
  </div>
  <div id="v-cap"></div>
</div>
<div id="dev" hidden>
  <label for="dev-pal">palette</label><select id="dev-pal"></select>
  <label for="dev-ui">controls</label><select id="dev-ui"></select>
  <label for="dev-bld">building</label><select id="dev-bld"></select>
  <label for="dev-floor">floor</label><select id="dev-floor"></select>
  <span></span><span class="dev-row"><button id="dev-up" type="button">▲ UP</button><button id="dev-down" type="button">▼ DOWN</button></span>
  <label for="dev-timed">timed</label><input id="dev-timed" type="checkbox">
  <label for="dev-clock">clock off</label><input id="dev-clock" type="checkbox">
  <label for="dev-reveal">show all</label><input id="dev-reveal" type="checkbox">
  <span></span><span class="dev-row"><button id="dev-viewer" type="button">FLOOR VIEWER</button></span>
</div>
<!-- the game's palettes and effects: these four files and nothing else (tools/bump.js keeps the ?v= in step) -->
<script>window.NEON_FILES = [];</script>
<script src="../data/palettes.js?v=16.02"></script>
<script src="../engine/core.js?v=16.02"></script>
<script src="../data/fx.js?v=16.02"></script>
<script src="../engine/fx.js?v=16.02"></script>
<script>
// The bridge: the demo below has its own C, hashStr, newSeed... (they shadow the game's inside its function), so the
// game's come through here. (FX colors a hacker's ink with hkInk: not loaded here, so plain text.)
const GAME = { get C() { return C; }, PALETTES, CHIPS, applyPalette, mixHex, FX };
if (typeof hkInk === 'undefined') window.hkInk = () => C.text;
</script>
<script>
(() => {
'use strict';
// ---------- the screen: the game's grid (docs/LAYOUT.md) ----------
const SW = 36, SH = 38, MAP_Y = 8, MW = 36, MH = 23;   // the board: rows 8-30, 36 x 23
const LINE_H = 1.22, CHAR_W = 0.6;
// The colors: the game's palette (GAME.C, set by applyPalette), plus a few of the demo's own made from it.
const C = {};
const PALS = Object.keys(GAME.PALETTES);
let pal = 0;
try { pal = Math.max(0, PALS.indexOf(localStorage.getItem('neon.infiltr8.pal'))); } catch (e) { /* private mode */ }
{ const q = new URLSearchParams(location.search).get('pal'); if (q && PALS.includes(q)) pal = PALS.indexOf(q); }
function setPal(i) {
  pal = (i + PALS.length) % PALS.length; GAME.applyPalette(PALS[pal], true);
  const P = GAME.C, was = Object.assign({}, C);
  Object.assign(C, { bg: P.bg, dim: P.dim, mid: P.mid, text: P.text, bright: P.bright, accent: P.accent, danger: P.danger, money: P.money, rep: P.rep,
    rare: P.rare, green: P.common, leg: GAME.CHIPS.legendary.bg, seen: GAME.mixHex(P.bg, P.dim, 0.45) });
  // (the message keeps a color, not a slot: move it to the same slot in the new palette)
  try { if (S && S.msgCol) { const k = Object.keys(was).find(k => was[k] === S.msgCol); if (k) S.msgCol = C[k]; } } catch (e) { /* (the first call: S isn't there yet) */ }
  try { localStorage.setItem('neon.infiltr8.pal', PALS[pal]); } catch (e) { /* private mode */ }
}
setPal(pal);
const rgba = (hex, a) => 'rgba(' + [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)).join(',') + ',' + a + ')';
const cv = document.getElementById('cv'), g = cv.getContext('2d');
let L = {};
function layout() {
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  const fs = Math.min(w / (SW * CHAR_W), h / (SH * LINE_H));
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  L = { fs, cw: fs * CHAR_W, ch: fs * LINE_H, ox: (w - SW * fs * CHAR_W) / 2, oy: (h - SH * fs * LINE_H) / 2 };
}
addEventListener('resize', () => { layout(); draw(); });

// ---------- the seed ----------
const hashStr = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rngFrom = n => () => { n |= 0; n = n + 0x6D2B79F5 | 0; let t = Math.imul(n ^ n >>> 15, 1 | n); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const newSeed = () => Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');

// ---------- tiles ----------
// ' ' void (outside everything)  '#' wall  '.' floor  '+' door  '<' stairs up  '>' stairs down  'E' the way in
// 'F' fire exit  'K' trash chute  'p' pillar  'v' vent (a hatch in a room's floor: the ducts are a layer under the floor,
// f.ducts / f.under, not tiles)
const T = {
  ' ': { walk: 0, see: 0 }, '#': { walk: 0, see: 0 }, '.': { walk: 1, see: 1 }, '+': { walk: 1, see: 1 }, '<': { walk: 1, see: 1 },
  '>': { walk: 1, see: 1 }, 'E': { walk: 1, see: 1 }, 'F': { walk: 1, see: 1 }, 'K': { walk: 1, see: 1 }, 'p': { walk: 0, see: 0 },
  'v': { walk: 1, see: 1 }, 'r': { walk: 0, see: 0 }, 'd': { walk: 0, see: 1, low: 1 }, 'g': { walk: 1, see: 1, hide: 1 }, '=': { walk: 0, see: 1, low: 1 }, '"': { walk: 1, see: 1, hide: 1 }, 'b': { walk: 1, see: 1 }, 'x': { walk: 0, see: 0 },
  'T': { walk: 0, see: 0, station: 1 },   // (a terminal's set in a wall: blocks sight as one)
  'L': { walk: 0, see: 1, station: 1 }, 'R': { walk: 0, see: 1, station: 1 }, 'B': { walk: 0, see: 1, station: 1 },
  'Q': { walk: 0, see: 1, station: 1 },   // (a CHIP RACK: a passive to add, Greg 2026-11-24)
  // (the set pieces' things, 2026-11-24: a vending machine and a coffee machine (THE BREAK ROOM), a sticky note (the
  // CAPTCHA DOOR's answer), junk (THE TRASH: low cover), the hoverpad (THE ROOF: stand on it))
  'V': { walk: 0, see: 0, station: 1 }, 'C': { walk: 0, see: 1, station: 1 }, 'N': { walk: 0, see: 1, station: 1 }, 'j': { walk: 0, see: 1, low: 1 }, 'H': { walk: 1, see: 1 }, 'w': { walk: 0, see: 1 }, 'o': { walk: 0, see: 1 }, 's': { walk: 0, see: 1, low: 1 }, 'u': { walk: 0, see: 0 }, 'm': { walk: 0, see: 0 },
};
const WALLISH = '#+EFT';   // what joins up into box-drawn walls (a terminal's in a wall now; the chute, K, sits on a room's floor: not a wall. Greg, H3SDQ4)
const INFO = {
  '#': ['WALL', 'it blocks you, and what sees.'], '.': ['FLOOR', ''], '+': ['A DOOR', 'closed: blocks sight. step in to open.'],
  '<': ['STAIRS UP', 'USE: up a floor.'], '>': ['STAIRS DOWN', 'USE: down a floor.'], 'E': ['THE WAY IN', 'your door. leave by it: a clean job.'],
  'F': ['FIRE EXIT', 'USE: out now. loud: less pay.'], 'K': ['TRASH CHUTE', 'USE: down into THE TRASH, a floor below. no way back up it.'],
  'p': ['PILLAR', 'hide behind it. nothing sees through.'], 'v': ['VENT', 'a hatch to the ducts. USE: in, or out.'], 'r': ['RACKS', 'servers. nothing sees through: hide in the rows.'], 'd': ['DESKS', 'low cover: hide right behind one.'], 'g': ['A PLANT', 'step in: hidden unless right by you.'],
  'u': ['A STATUE', 'nothing sees through it.'], '=': ['A BENCH', 'low cover: hide right behind it.'],
  '"': ['PLANT BEDS', 'step in: hidden unless right by you.'],
  'T': ['A TERMINAL', 'USE beside it: one thing it can do.'], 'L': ['A LOOT CACHE', 'USE beside it: something to carry out.'],
  'R': ['A RE-UP', 'USE beside it: INT, or a piece of gear.'], 'Q': ['A CHIP RACK', 'USE beside it: a new passive, for the rest of the run.'],'B': ['A BAG SWAP', 'USE beside it: trade your gear for a bag.'],
  'V': ['A VENDING MACHINE', 'USE beside it: trade loot CR for gear.'], 'C': ['A COFFEE MACHINE', 'USE beside it: +1 INT. loud: +1 ALERT.'],
  'N': ['A STICKY NOTE', 'someone wrote a password on it.'], 'w': ['THE PARAPET', 'the roof\'s edge. a long way down.'], 'o': ['THE EDGE', 'no parapet here. step off it: you fall.'], 's': ['SOLAR PANELS', 'low cover: hide right behind a row.'], 'j': ['JUNK', 'deleted files, piled up. low cover.'], 'H': ['THE HOVERPAD', 'stand on it, USE: call the hover. then hold out.'],
  'b': ['THE BELT', 'it carries you. off before the X.'], 'x': ['A CRATE', 'on the belt. nothing sees through.'], 'm': ['A TANK', 'machinery. nothing sees through it.'], ' ': ['', ''],
};

// ---------- a floor ----------
function newFloor(name) {
  const t = Array.from({ length: MH }, () => Array(MW).fill(' '));
  return { halls: new Set(), ducts: [], under: new Map(), name, t, seen: Array.from({ length: MH }, () => Array(MW).fill(false)), cams: [], pats: [], arm: null, payload: null, up: null, down: null, trail: [] };
}
const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
const at = (f, x, y) => inb(x, y) ? f.t[y][x] : ' ';
const set = (f, x, y, c) => { if (inb(x, y)) f.t[y][x] = c; };
function room(f, x, y, w, h) {   // walls round it, floor in it (an existing floor cell stays floor: rooms can overlap)
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
    const edge = i === x || j === y || i === x + w - 1 || j === y + h - 1;
    if (edge) { if (at(f, i, j) === ' ') set(f, i, j, '#'); } else set(f, i, j, '.');
  }
}
// a box that always draws its walls (THE RING's rings sit inside each other)
function box(f, x, y, w, h) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(f, i, j, i === x || j === y || i === x + w - 1 || j === y + h - 1 ? '#' : '.'); }
const passable = (f, x, y) => !!T[at(f, x, y)].walk;
// a closed door blocks sight (REAL DOORS, below); an open one doesn't
const opaque = (f, x, y) => !T[at(f, x, y)].see || (at(f, x, y) === '+' && !(f.open && f.open.has(x + ',' + y))) || !!(f.smoke && f.smoke.get(x + ',' + y) > 0);   // (SMOKE: useGear)
// LIGHT (Greg, 2026-11-23/24): a cell is lit if its room's lights are on (f.lit: a lit room's floor and the walls
// round it; THE RING, F1, is lit all over) and the power's on. In the dark everyone (you, CAMs, patrols) sees only
