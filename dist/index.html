<!-- The game, in load order. Each file adds itself to NEON_FILES with its build number; the title
     warns if one is missing or from another build. tools/bump.js changes the build everywhere. -->
<script>window.NEON_FILES = [];   // every game file adds itself: ['engine/core.js', 'v12.00']</script>
<script>
// Older Safari lacks these (Object.fromEntries / flat / flatMap before iOS 12.2); the game uses them.
if (!Object.fromEntries) Object.fromEntries = it => { const o = {}; for (const [k, v] of it) o[k] = v; return o; };
if (!Array.prototype.flat) Array.prototype.flat = function (d) { d = d === undefined ? 1 : d; return d > 0 ? this.reduce((a, x) => a.concat(Array.isArray(x) ? x.flat(d - 1) : x), []) : this.slice(); };
if (!Array.prototype.flatMap) Array.prototype.flatMap = function (f, t) { return this.map(f, t).flat(); };
// ...and these are missing before iOS 12 / 13 (Safari 11 / 12).
if (!String.prototype.trimStart) String.prototype.trimStart = function () { return this.replace(/^s+/, ''); };
if (!String.prototype.trimEnd) String.prototype.trimEnd = function () { return this.replace(/s+$/, ''); };
if (!String.prototype.matchAll) String.prototype.matchAll = function (re) {
  const r = new RegExp(re.source, re.flags.indexOf('g') < 0 ? re.flags + 'g' : re.flags), out = [];
  let m;
  while ((m = r.exec(this))) { out.push(m); if (m[0] === '') r.lastIndex++; }
  return out;
};
</script>
