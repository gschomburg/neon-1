<script>
// Beta Runner v07: work in progress, built on v06 (online multiplayer).
// The whole screen is a grid of text characters drawn on one canvas,
// so any character can turn into a particle for effects.
(() => {
  'use strict';

  // ---------------- Tuning ----------------
  const CONFIG = {
    startIntegrity: 4,
    perfectHeal: 1,        // integrity restored by a first-try pick
    tellStrength: 0.75,    // how often a position tell is followed
    markDecoyFrac: 0.4,    // share of other tiles that also carry the Sigil signature
    lootChance: 0.3,       // chance a layer has a loaded ($) ICE tile
    beltSlots: 4,
    startItems: ['purge'], // everyone starts with one, like 1TD's torch
    repairAmount: 2,
    maskDelayMs: 1800,     // how long a fading glyph tell stays visible
    overclockClock: 15,    // clock added to every layer by OVERCLOCK
    overclockStart: 6,     // seconds left when OVERCLOCK starts purging
    overclockCut: 0.2,     // payout lost per OVERCLOCK purge
    fastpayMs: 3000,
    revealDelay: 380,      // ms before the first offer pops in
    revealGap: 300,        // ms between offer pops
    introHold: 1600,       // ms a corp's intro screen stays up (tap / any key skips)
    wipeSpeed: 1,      // screen transition speed: 1 = normal, 0.5 = half speed
    wipeOverlap: 0.45,     // page changes: new screen starts when the old front is this far up (lower = more overlap)
    wipeOverlapWin: 0.8,   // same, for success wipes (later, so the lit node gets its moment)
    wipeStagger: 300,      // max random delay (wipe-time ms) before each character starts changing
  };

  const VERSION = 'v07';
  const STORE_KEY = 'beta_runner.v07.save';
  const SAVE_FORMAT = 1;

  const TILE_W = 7, TILE_H = 5;
  const GAP_X = 2, GAP_Y = 1;
  const BOARD_Y = 8;
  const TRAY_ROWS = 5;            // rule, mods, mod info, items, item info (+1 footer row below)
  const MIN_CONTENT_W = 36;
  const LINE_H = 1.22;
  const FONT = '"JetBrains Mono", Consolas, "Courier New", monospace';

  // Current colors. Filled from a palette at boot.
  const C = {
    bg: '', dim: '', mid: '', text: '', bright: '', cyan: '', red: '', redDim: '', gold: '',
    common: '', rare: '', epic: '', exotic: '', boss: '',
  };

  // Console palettes. Each one also defines its own rarity colors.
  const PALETTES = {
    default:  { name: 'DEFAULT',   bg: '#06090a', dim: '#2c3a38', mid: '#5f7470', text: '#a9bdb7', bright: '#e6f4ef', cyan: '#3cf0ff', red: '#ff3b4e', redDim: '#7a2630', gold: '#e8c66a',
                common: '#a9bdb7', rare: '#4da3ff', epic: '#c07bff', exotic: '#ffd84a', boss: '#ff7a3d' },
    amber:    { name: 'AMBER CRT', bg: '#0c0800', dim: '#3a2a10', mid: '#7a5a24', text: '#d9a441', bright: '#ffd27a', cyan: '#ffb000', red: '#ff5a3c', redDim: '#6e2a18', gold: '#ffe08a',
                common: '#d9a441', rare: '#ffcf70', epic: '#ff8a3c', exotic: '#fff1b0', boss: '#ff5a3c' },
    phosphor: { name: 'GREEN CRT', bg: '#020a04', dim: '#12331a', mid: '#2f6e3c', text: '#5fd47a', bright: '#b8ffc8', cyan: '#39ff6a', red: '#ff5c5c', redDim: '#5a1f1f', gold: '#d8ff6a',
                common: '#5fd47a', rare: '#7affd4', epic: '#c8ff6a', exotic: '#f0fff0', boss: '#ff7a5c' },
    dusk:     { name: 'DUSK',      bg: '#14111f', dim: '#332c4a', mid: '#6b5f8f', text: '#c8bfe8', bright: '#f4f0ff', cyan: '#ff79c6', red: '#ff5555', redDim: '#6a2a3a', gold: '#f1fa8c',
                common: '#c8bfe8', rare: '#8be9fd', epic: '#bd93f9', exotic: '#f1fa8c', boss: '#ffb86c' },
    paper:    { name: 'PAPER',     bg: '#f2efe6', dim: '#cfc9ba', mid: '#8a8376', text: '#3b3a36', bright: '#111111', cyan: '#0077a8', red: '#c4122c', redDim: '#d99aa2', gold: '#9a6a00',
                common: '#3b3a36', rare: '#1d5fbf', epic: '#7a2fbf', exotic: '#a86b00', boss: '#c4122c' },
  };
  // Corp palettes: used inside each corp. Not offered in the palette picker.
  const CORP_RARITY = { common: '#a9bdb7', rare: '#4da3ff', epic: '#c07bff', exotic: '#ffd84a', boss: '#ff7a3d' };
  Object.assign(PALETTES, {
    c_perimeter: Object.assign({ name: 'PERIMETER', hidden: true, bg: '#0f1214', dim: '#2c3439', mid: '#6b7780', text: '#c9d1d6', bright: '#ffffff', cyan: '#ff8a00', red: '#ff3b30', redDim: '#6b2016', gold: '#ffd166' }, CORP_RARITY, { common: '#c9d1d6' }),   // concrete grey + hazard orange
    c_sigil:     Object.assign({ name: 'SIGIL',     hidden: true, bg: '#1b0a26', dim: '#45204f', mid: '#9a5fb5', text: '#f0d6ff', bright: '#ffffff', cyan: '#f5c542', red: '#ff3f7f', redDim: '#6b1f45', gold: '#f5c542' }, CORP_RARITY, { common: '#f0d6ff', exotic: '#ff9de2' }),   // deep violet + gold
    c_chronos:   Object.assign({ name: 'CHRONOS',   hidden: true, bg: '#010a03', dim: '#103019', mid: '#2e7a43', text: '#6fe08c', bright: '#d2ffd9', cyan: '#3dff8a', red: '#ff5c4d', redDim: '#5a1f1a', gold: '#e4ff7a' }, CORP_RARITY, { common: '#6fe08c' }),   // green terminal
    c_mirror:    Object.assign({ name: 'MIRRORLINE', hidden: true, bg: '#e9f2f8', dim: '#c3d2de', mid: '#6f8597', text: '#1d2b3a', bright: '#000000', cyan: '#006fd6', red: '#d11a3a', redDim: '#e9a8b6', gold: '#8a6a00' }, { common: '#1d2b3a', rare: '#1d5fbf', epic: '#7a2fbf', exotic: '#a86b00', boss: '#c4122c' }),   // light: icy white + deep blue
    c_omni:      Object.assign({ name: 'OMNI',      hidden: true, bg: '#080203', dim: '#3a0f14', mid: '#7a2a33', text: '#d79a9f', bright: '#ffe1e3', cyan: '#ffb3c0', red: '#ff1f3a', redDim: '#5e1018', gold: '#ffc36e', font: { weight: 700, bold: 800 } }, CORP_RARITY, { common: '#d79a9f' }),   // red on black, heavy
  });
  const playerPalettes = () => Object.keys(PALETTES).filter(k => !PALETTES[k].hidden);

  // Font used for drawing. Layout always uses the default font's measurements, and
  // every character is centered in its own cell, so a corp's font changes the look
  // but never moves anything.
  const DRAW_FONT = { family: FONT, weight: 400, bold: 700, scale: 1 };
  // Palette changes fade every color from the old palette to the new one.
  let paletteFade = null;
  const PALETTE_FADE_MS = 700;
  const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mixHex = (a, b, t) => '#' + hexRgb(a).map((v, i) => Math.round(v + (hexRgb(b)[i] - v) * t).toString(16).padStart(2, '0')).join('');
  function stepPaletteFade(now) {
    const f = paletteFade;
    if (!f) return;
    const k = clamp((now - f.t0) / PALETTE_FADE_MS, 0, 1), e = k * (2 - k);   // ease out
    for (const key of Object.keys(f.to)) C[key] = mixHex(f.from[key], f.to[key], e);
    document.documentElement.style.background = C.bg;
    document.body.style.background = C.bg;
    if (k >= 1) paletteFade = null;
  }

  function applyPalette(key, instant = false) {
    const p = PALETTES[key] || PALETTES.default;
    const to = {};
    for (const k of Object.keys(C)) if (p[k]) to[k] = p[k];
    if (instant || !C.bg || save.effects === 'reduced') { Object.assign(C, to); paletteFade = null; }
    else paletteFade = { from: Object.assign({}, C), to, t0: performance.now() };
    const f = p.font || {};
    DRAW_FONT.family = f.family ? `${f.family}, ${FONT}` : FONT;
    DRAW_FONT.weight = f.weight || 400;
    DRAW_FONT.bold = f.bold || 700;
    DRAW_FONT.scale = f.scale || 1;
    document.documentElement.style.background = C.bg;
    document.body.style.background = C.bg;
  }

  const NOISE = '#%&@$*+=<>/\\|:;~^01';

  // ---------------- Seeded RNG ----------------
  function hashStr(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Separate stream per purpose, so player actions never shift the answers.
  const rngFor = (...parts) => mulberry32(hashStr(parts.join('|')));

  const SEED_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function newSeed() {
    let s = '';
    for (let i = 0; i < 6; i++) s += SEED_ALPHABET[Math.floor(Math.random() * SEED_ALPHABET.length)];
    return s;
  }
  const cleanSeed = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
  const pickR = (arr, r) => arr[Math.floor(r() * arr.length)];
  const noiseCh = () => NOISE[Math.floor(Math.random() * NOISE.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function shuffle(arr, r) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------------- Glyphs ----------------
  const MOTIFS_RAW = [
    [' /\\ ', '<  >', ' \\/ '],
    ['\\ /', ' X ', '/ \\'],
    ['[==]', '[  ]', '[==]'],
    [' .-. ', '( o )', " '-' "],
    ['~ ~ ~', ' ~ ~ ', '~ ~ ~'],
    ['# #', ' # ', '# #'],
    ['  ^  ', ' /|\\ ', '  |  '],
    ['o-+  ', '  |  ', '  +-o'],
    ['0110', '1001', '0110'],
    ['(o.o)', ' |=| '],
    ['+-+-+', '| | |', '+-+-+'],
    ['  |  ', '--+--', '  |  '],
    ['. : .', ': . :', '. : .'],
    ['>>>', '>>>'],
    [' .-. ', ' | | ', '[###]'],
    ['%#@', '@ %', '#%@'],
    ['{ }', '{*}', '{ }'],
    ['=====', ' === ', '  =  '],
  ];
  function normMotif(m) {
    let lines = m.slice(0, 3);
    if (lines.length === 1) lines = ['', lines[0], ''];
    else if (lines.length === 2) lines = [lines[0], lines[1], ''];
    return lines.map(l => {
      l = l.slice(0, 5);
      const pad = 5 - l.length, left = Math.floor(pad / 2);
      return ' '.repeat(left) + l + ' '.repeat(pad - left);
    });
  }
  const MOTIFS = MOTIFS_RAW.map(normMotif);
  const JACK_GLYPH = normMotif(['', '>_', '']);
  const LOOT_GLYPH = normMotif(['$ $', '[$]', '$ $']);
  const MASK_GLYPH = normMotif(['', '???', '']);
  const X_SHAPE = normMotif(['\\ /', ' X ', '/ \\']);
  const shapeOf = gl => gl.map(l => l.replace(/[^ ]/g, '#')).join('|');
  const X_MASK = shapeOf(X_SHAPE);
  const MARK_CHARS = '#%@*+=o0&';

  // Codex entries for every tile glyph: a name and some (unreliable) lore.
  // Lore lines stay under 26 characters so they fit next to the tile art.
  const GLYPH_LORE = [
    ['DIAMOND',      ['a rhombus with ambition.', 'every corp logo is this', 'plus a gradient.']],
    ['THE CROSS',    ['marks the spot.', 'the spot is usually', 'a trap.']],
    ['STORAGE UNIT', ['contents: nothing.', 'a firewall\'s lunchbox.']],
    ['THE WATCHER',  ['it saw you jack in.', 'it says nothing.', 'it judges.']],
    ['SIGNAL NOISE', ['the sound of 4,000', 'routers screaming', 'in harmony.']],
    ['HASHTAG X',    ['deprecated social rune.', 'still trending', 'somewhere awful.']],
    ['UPLINK',       ['points up.', 'management loves it.']],
    ['TRACE PATH',   ['a wire that took the', 'long way round to', 'avoid the tolls.']],
    ['BINARY',       ['spells "i" if you squint.', 'the rest is a typo.']],
    ['SYSADMIN',     ['on call since 2071.', 'please be gentle.']],
    ['LATTICE',      ['a very small fence', 'for very small data.']],
    ['JUNCTION',     ['four roads.', 'no lights.', 'all cops.']],
    ['STATIC',       ['what is left when a', 'hard drive dreams.']],
    ['FAST FORWARD', ['skips the ads.', 'there are always', 'more ads.']],
    ['PADLOCK',      ['the oldest security', 'tech in the net.', 'still mostly works.']],
    ['CORRUPTION',   ['a file that got too', 'close to a magnet once.', 'it does not talk about it.']],
    ['BRACKET STAR', ['a JSON object that', 'reached enlightenment.']],
    ['FUNNEL',       ['data goes in.', 'invoices come out.']],
  ];
  const SPECIAL_GLYPHS = [
    { key: 'gjack', name: 'PROMPT',          glyphOf: () => JACK_GLYPH, lore: ['where every bad', 'decision starts.'] },
    { key: 'gloot', name: 'LOADED NODE',     glyphOf: () => LOOT_GLYPH, lore: ['always ICE.', 'always worth it?', 'never sure.'] },
    { key: 'gsig',  name: 'SIGIL SIGNATURE', glyphOf: () => X_SHAPE,    lore: ['sigil signs its work.', 'the signature changes.', 'the habit does not.'] },
    { key: 'gmask', name: 'REDACTED',        glyphOf: () => MASK_GLYPH, lore: ['the sigil boss forgot', 'what it signed.', 'you should not.'] },
  ];
  const GLYPHS = [
    ...GLYPH_LORE.map(([name, lore], i) => ({ key: 'g' + i, name, lore, glyphOf: () => MOTIFS[i] })),
    ...SPECIAL_GLYPHS,
  ];
  const GLYPH_BY_KEY = Object.fromEntries(GLYPHS.map(gl => [gl.key, gl]));

  // Labels on locked-out nodes: [word, mod code]. 5 characters max.
  const LOCK_LABEL = {
    purge: ['PURGE', ''], burner: ['BURNT', ''],
    sniffer: ['INERT', 'SNF'], corners: ['INERT', 'CNR'], sigscan: ['INERT', 'SIG'],
    echo: ['INERT', 'ECH'], overclock: ['INERT', 'OVC'],
  };

  // ---------------- Content ----------------
  // tell: how the corp picks its safe tile. bossTell: the boss layer's twist.
  // rules: shown on the map only when the corp has something special.
  const CORPS = {
    perimeter: {
      key: 'perimeter', name: 'PERIMETER SYS', letter: 'P',
      intel: '"our corners never fall."',
      tell: 'corner', bossTell: 'center',
      bossDesc: 'boss: the core hides inward.',
      mods: ['corners', 'bulwark'],
    },
    sigil: {
      key: 'sigil', name: 'SIGIL DYNAMICS', letter: 'S',
      intel: '"we sign everything we make."',
      tell: 'mark', bossTell: 'mark', bossFlash: true,
      bossDesc: 'boss: the signature fades fast.',
      mods: ['sigscan', 'forgery'],
    },
    chronos: {
      key: 'chronos', name: 'CHRONOS', letter: 'C',
      intel: '"time is money. yours is short."',
      tell: null, timer: 10, pay: 1.6, bossShrink: true,
      bossDesc: 'boss: clock shrinks every miss.',
      mods: ['overclock', 'fastpay'],
    },
    mirror: {

      intel: '"every step echoes the last."',

  const FINAL = {
    key: 'omni', name: 'OMNI//CORE', letter: '!',
    intel: '"you shouldn\'t be here."',
    timer: 12, pay: 2, bossDmg: 2,
    bossDesc: 'boss: ICE hits for 2.',

  const PUBLIC = { key: 'public', name: 'PUBLIC NET', letter: '>', intel: 'one node. it is real.', tell: null };
  const corpDef = key => CORPS[key] || (key === 'omni' ? FINAL : PUBLIC);

  // Each corp's tell, as written in the codex after you beat it.
  const CORP_TELL = {
    perimeter: 'the real node is usually in a corner. the boss hides it in the center.',
    sigil: 'the real node always wears the signature, and so do some decoys. the boss signature fades.',
    chronos: 'no tell. just the clock. it pays more for the pressure.',
    mirror: 'the real node mirrors the last one. deeper: top-bottom. the boss: through the center.',
    omni: 'borrows one tell from the other corps. which one changes every run.',
  };
  const CODEX_CORPS = ['perimeter', 'sigil', 'chronos', 'mirror', 'omni'];

  // Corp intro ("boot up") art. Rows get padded to the same width so they line up.
  const CORP_ART = {
    perimeter: [
      ' +==+==============+==+',
      ' |##|              |##|',
      ' +==+  PERIMETER   +==+',
      '    |    [ SYS ]   |',
      ' +==+              +==+',
      ' |##|              |##|',
      ' +==+==============+==+',
    ],
    sigil: [
      "        .-'''-.",
      "     .-'   X   '-.",
      '    /  \\       /  \\',
      '   |    >-(*)-<    |',
      '    \\  /       \\  /',
      "     '-.   X   .-'",
      "        '-...-'",
    ],
    chronos: [
      '      .-----------.',
      '     /   . 12 .    \\',
      '    | .     |     . |',
      '    | 9     o---  3 |',
      '    | .           . |',
      "     \\   '  6  '   /",
      "      '-----------'",
    ],
    mirror: [
      '   /\\    /\\  ||  /\\    /\\',
      '  /  \\  /  \\ || /  \\  /  \\',
      '  \\  /  \\  / || \\  /  \\  /',
      '   \\/    \\/  ||  \\/    \\/',
    ],
    omni: [
      '          _______',
      "      .-''       ''-.",
      '     /    .-----.    \\',
      '    |    (   @   )    |',
      "     \\    '-----'    /",
      "      '-._       _.-'",
      "          '''''''",
    ],
  };

  // Corp numbers by tier: deeper corps get harder versions.
  function corpTimer(def, tier) { return def.timer ? def.timer - (def.key === 'chronos' && tier >= 2 ? 2 : 0) : 0; }
  function corpPay(def, tier) { return (def.pay || 1) + (def.key === 'chronos' && tier >= 2 ? 0.2 : 0); }
  function corpRules(def, tier) {
    if (def.key === 'chronos') return `${corpTimer(def, tier)}s clock per pick. pays x${corpPay(def, tier).toFixed(1)}`;
    if (def.key === 'omni') return '12s clock. tell unknown. pays x2';
    return '';
  }

  const RARITY = {
    common: { label: 'COMMON', lvl: 0 },
    rare:   { label: 'RARE',   lvl: 1 },
    epic:   { label: 'EPIC',   lvl: 2 },
    exotic: { label: 'EXOTIC', lvl: 3 },
    boss:   { label: 'BOSS',   lvl: 4 },
  };
  const rarityCol = r => C[r] || C.text;

  const ITEMS = {
    patch: { key: 'patch', name: 'PATCH', price: 25, desc: 'restore 1 integrity.', tip: '+1 integrity.' },
    purge: { key: 'purge', name: 'PURGE', price: 22, desc: 'lock out one ICE node.', tip: 'lock out 1 ICE.' },
    wall:  { key: 'wall',  name: 'FWALL', price: 30, desc: 'block the next ICE hit.', tip: 'block next ICE hit.' },
    split: { key: 'split', name: 'SPLIT', price: 34, desc: 'rule out half the grid.', tip: 'rule out half the grid.' },
  };
  const ITEM_WHERE = 'market, $ nodes, caches.';

  // Mods last the whole run (some are tap-to-use when `active` is set).
  // kind: gen = general pool, minor = small perks, corp = only from that corp's boss.
  // icon: animation frames for the badge's first character. anim: how the letters move.
  // tip: short text for the tray info line. desc: full text.
  const MODS = {
    // General
    tracer:   { name: 'TRACER',   short: 'TRC', kind: 'gen', rarity: 'epic',   icon: '.oOo', anim: 'wave',     price: 70, tip: 'hit ICE shows dist.',   desc: 'ICE you hit shows its distance to the real node.' },
    skimmer:  { name: 'SKIMMER',  short: 'SKM', kind: 'gen', rarity: 'rare',   icon: '$$s$', anim: 'cycle',    price: 60, tip: '+50% credits.',         desc: '+50% credits from every payout.' },
    buffer:   { name: 'BUFFER',   short: 'BUF', kind: 'gen', rarity: 'rare',   icon: '[]][', anim: 'blink',    price: 65, tip: '+1 max integrity.',     desc: '+1 max integrity, and heal 1.' },
    sniffer:  { name: 'SNIFFER',  short: 'SNF', kind: 'gen', rarity: 'epic',   icon: '~-_-', anim: 'scramble', price: 90, tip: 'lock 1 ICE each layer.', desc: 'every layer starts with 1 ICE locked.' },
    burner:   { name: 'BURNER',   short: 'BRN', kind: 'gen', rarity: 'rare',   icon: '.*^*', anim: 'cycle',    price: 55, active: 'layer', tip: 'lock 1 ICE, 1x/corp', desc: 'tap in a layer: lock 1 ICE. once per corp.' },
    reroute:  { name: 'REROUTE',  short: 'RRT', kind: 'gen', rarity: 'rare',   icon: '|/-\\', anim: 'spin',    price: 45, active: 'map', charges: 2, tip: 'reshuffle map ahead', desc: 'tap on the map: reshuffle every node ahead. 2 uses.' },
    wormhole: { name: 'WORMHOLE', short: 'WRM', kind: 'gen', rarity: 'exotic', icon: 'oO0O', anim: 'wave',     price: 50, active: 'map', charges: 1, tip: 'warp to random node', desc: 'tap on the map: warp to a random node ahead. 1 use.' },
    // Minor
    stash:    { name: 'STASH',    short: 'STS', kind: 'minor', rarity: 'common', icon: '=#=#', anim: 'blink',    price: 35, tip: '+1 item slot.',       desc: '+1 slot on your item belt.' },
    haggle:   { name: 'HAGGLE',   short: 'HGL', kind: 'minor', rarity: 'common', icon: '%%/%', anim: 'scramble', price: 30, tip: 'market prices -25%.', desc: 'black market prices are 25% lower.' },
    cachekey: { name: 'CACHEKEY', short: 'KEY', kind: 'minor', rarity: 'common', icon: 'o-o=', anim: 'wave',     price: 30, tip: 'caches drop double.', desc: 'data caches drop their loot twice.' },
    coolant:  { name: 'COOLANT',  short: 'CLT', kind: 'minor', rarity: 'common', icon: '*+x+', anim: 'cycle',    price: 30, tip: '+3s on every clock.', desc: '+3 seconds on every clock.' },
    // Corp-specific (boss rewards)
    corners:    { name: 'CORNERS',    short: 'CNR', kind: 'corp', corp: 'perimeter', rarity: 'boss', icon: '+  +', anim: 'blink',    tip: 'lock 1 corner ICE.',     desc: 'layer start: lock 1 ICE node in a corner.' },
    bulwark:    { name: 'BULWARK',    short: 'BLW', kind: 'corp', corp: 'perimeter', rarity: 'boss', icon: '#|#|', anim: 'wave',     tip: 'block 1st hit/corp.',    desc: 'the first ICE hit in each corp is blocked.' },
    sigscan:    { name: 'SIGSCAN',    short: 'SIG', kind: 'corp', corp: 'sigil',     rarity: 'boss', icon: 'xX+X', anim: 'scramble', tip: 'lock 1 signed ICE.',     desc: 'layer start: lock 1 ICE node wearing the Sigil signature.' },
    forgery:    { name: 'FORGERY',    short: 'FRG', kind: 'corp', corp: 'sigil',     rarity: 'boss', icon: '$x$X', anim: 'cycle',    tip: '$ nodes do no damage.',  desc: '$ nodes no longer cost integrity.' },
    overclock:  { name: 'OVERCLOCK',  short: 'OVC', kind: 'corp', corp: 'chronos',   rarity: 'boss', icon: '|/-\\', anim: 'spin',    tip: 'clock purges ICE.',      desc: 'every layer gets a clock. near the end it purges ICE, but each purge cuts the pay 20%.' },
    fastpay:    { name: 'FASTPAY',    short: 'FST', kind: 'corp', corp: 'chronos',   rarity: 'boss', icon: '>>->', anim: 'wave',     tip: 'fast picks pay x1.5',    desc: 'picks made within 3 seconds pay x1.5.' },
    echo:       { name: 'ECHO',       short: 'ECH', kind: 'corp', corp: 'mirror',    rarity: 'boss', icon: '()|)', anim: 'blink',    tip: 'hit ICE: mirror locks.', desc: 'hit ICE: its mirror-image ICE node locks too.' },
    afterimage: { name: 'AFTERIMAGE', short: 'AFT', kind: 'corp', corp: 'mirror',    rarity: 'boss', icon: ':.:.', anim: 'scramble', tip: 'marks last real spot.',  desc: 'marks where the last layer\'s real node was.' },
  };
  for (const k of Object.keys(MODS)) MODS[k].key = k;
  const modsOfKind = (...kinds) => Object.keys(MODS).filter(k => kinds.includes(MODS[k].kind));
  function modWhere(m) {
    if (m.kind === 'corp') return `from: ${corpDef(m.corp).name} boss.`;
    if (m.kind === 'minor') return 'from: start, safehouse, cache, shop.';
    return 'from: bosses, caches, market.';
  }

  // ---------------- Layers ----------------
  function gridFor(n) {
    let cols = 4, rows = 4;
    while (n > Math.floor(cols * rows * 0.75)) {
      if (rows <= cols) rows++; else cols++;
    }
    return { cols, rows };
  }

  function tellCells(tell, cols, rows, prevSafe) {
    const all = [];
    for (let i = 0; i < cols * rows; i++) all.push(i);
    const colOf = i => i % cols, rowOf = i => Math.floor(i / cols);
    if (tell === 'corner') return [0, cols - 1, (rows - 1) * cols, rows * cols - 1];
    if (tell === 'center') return all.filter(i => colOf(i) > 0 && colOf(i) < cols - 1 && rowOf(i) > 0 && rowOf(i) < rows - 1);
    if ((tell === 'mirror' || tell === 'vmirror' || tell === 'point') && prevSafe) {
      const col = tell === 'vmirror' ? prevSafe.col : cols - 1 - prevSafe.col;
      const row = tell === 'mirror' ? prevSafe.row : rows - 1 - prevSafe.row;
      if (col >= 0 && col < cols && row >= 0 && row < rows) return [row * cols + col];
    }
    return null;
  }

  // Sigil signature for one tile. level 1: one glyph for the whole visit.
  // level 2: always an X shape, random characters per tile.
  // level 3: always 'x' characters, random arrangement per tile.
  function signedGlyph(mark, r) {
    if (mark.level === 1) return mark.glyph;
    if (mark.level === 2) return X_SHAPE.map(l => l.replace(/[^ ]/g, () => pickR(MARK_CHARS, r)));
    const cells = [];
    for (let i = 0; i < 15; i++) cells.push(i);
    const on = new Set(shuffle(cells, r).slice(0, 3 + Math.floor(r() * 3)));
    const out = [];
    for (let row = 0; row < 3; row++) {
      let s = '';
      for (let col = 0; col < 5; col++) s += on.has(row * 5 + col) ? (r() < 0.5 ? 'x' : 'X') : ' ';
      out.push(s);
    }
    return out;
  }

  // ctx: { seed, nodeId, idx, n, tell, prevSafe, loot, mark }
  function genLayer(ctx) {
    const { seed, nodeId, idx, n, tell, prevSafe, loot, mark } = ctx;
    const r = rngFor(seed, 'layer', nodeId, idx);
    const { cols, rows } = gridFor(n);
    const cells = [];
    for (let i = 0; i < cols * rows; i++) cells.push(i);
    shuffle(cells, r);
    const tiles = cells.slice(0, n).map(cell => ({
      cell, col: cell % cols, row: Math.floor(cell / cols),
      glyph: null, safe: false, loaded: false, marked: false, ruledOut: false,
      state: 'closed', hidden: false, probing: false, dist: null,
    }));
    const setCell = (t, cell) => { t.cell = cell; t.col = cell % cols; t.row = Math.floor(cell / cols); };

    // Pick the safe tile, following the position tell most of the time.
    let safe = tiles[Math.floor(r() * n)];
    const follow = r() < CONFIG.tellStrength;
    const targets = n > 1 ? tellCells(tell, cols, rows, prevSafe) : null;
    if (targets && follow) {
      let cand = tiles.filter(t => targets.includes(t.cell));
      if (!cand.length) {
        const used = new Set(tiles.map(t => t.cell));
        const free = targets.filter(c => !used.has(c));
        if (free.length) { const t = pickR(tiles, r); setCell(t, pickR(free, r)); cand = [t]; }
      }
      if (cand.length) safe = pickR(cand, r);
    }
    safe.safe = true;

    // Glyphs. A mark tell puts the signature on the safe tile and some decoys.
    const isMark = tell === 'mark' && mark;
    const pool = MOTIFS.filter(m => {
      if (!isMark) return true;
      if (mark.level === 1) return m.join('|') !== mark.glyph.join('|');
      if (mark.level === 2) return shapeOf(m) !== X_MASK;
      return !/[xX]/.test(m.join(''));
    });
    for (const t of tiles) t.glyph = pickR(pool, r);
    if (isMark && n > 1) {
      const others = shuffle(tiles.filter(t => !t.safe), r);
      const k = Math.min(others.length, Math.max(1, Math.round((n - 1) * CONFIG.markDecoyFrac)));
      for (const t of [safe, ...others.slice(0, k)]) { t.marked = true; t.glyph = signedGlyph(mark, r); }
    }
    if (n === 1) tiles[0].glyph = JACK_GLYPH;

    // Loaded ICE: a known trap that drops loot when hit.
    if (loot && n >= 4 && r() < CONFIG.lootChance) {
      const opts = tiles.filter(t => !t.safe && !t.marked);
      if (opts.length) { const t = pickR(opts, r); t.loaded = true; t.glyph = LOOT_GLYPH; }
    }

    tiles.sort((a, b) => a.cell - b.cell);
    return { n, cols, rows, tiles, safe: tiles.findIndex(t => t.safe), safeCell: { col: safe.col, row: safe.row } };
  }

  // ---------------- Overworld map ----------------
  // Steps run bottom (0, start) to top (5, final). Steps 1-4 have 3 lanes.
  const MAP_STEPS = 6;
  function genMap(seed) {
    const r = rngFor(seed, 'map');
    const nodes = {};
    const add = (step, lane, type, extra = {}) => {
      const id = `${step}:${lane}`;
      nodes[id] = Object.assign({ id, step, lane, type, next: [] }, extra);
    };
    add(0, 1, 'start', { corp: 'public', tier: 0 });
    const specs = [
      null,
      ['corp', 'corp', 'corp'],
      ['corp', 'corp', r() < 0.5 ? 'cache' : 'repair'],
      ['corp', 'corp', 'shop'],
      ['corp', 'corp', r() < 0.5 ? 'cache' : 'repair'],
    ];
    for (let s = 1; s <= 4; s++) {
      const types = shuffle(specs[s].slice(), r);
      const corps = shuffle(Object.keys(CORPS), r);
      types.forEach((type, lane) => add(s, lane, type, type === 'corp' ? { corp: corps[lane], tier: s <= 2 ? 1 : 2 } : {}));
    }
    add(5, 1, 'final', { corp: 'omni', tier: 3 });
    for (let lane = 0; lane < 3; lane++) nodes['0:1'].next.push(`1:${lane}`);
    for (let s = 1; s <= 3; s++) {
      for (let lane = 0; lane < 3; lane++) {
        const n = nodes[`${s}:${lane}`];
        n.next.push(`${s + 1}:${lane}`);
        for (const d of [-1, 1]) if (lane + d >= 0 && lane + d < 3 && r() < 0.45) n.next.push(`${s + 1}:${lane + d}`);
      }
    }
    for (let lane = 0; lane < 3; lane++) nodes[`4:${lane}`].next.push('5:1');
    return nodes;
  }
  const nodeLetter = n => n.type === 'shop' ? '$' : n.type === 'cache' ? '?' : n.type === 'repair' ? '+' : corpDef(n.corp).letter;

  // ---------------- Save data ----------------
  const freshSave = () => ({
    format: SAVE_FORMAT, best: 0, runs: 0, wins: 0, history: [], seen: {},
    muted: false, palette: 'default', effects: 'full', tapMode: 'two', corpColors: true,
    musicOn: true, musicVol: 0.6, sfxVol: 0.8,
    corpStats: {},          // per corp: { breached, lost }
  });
  const save = (() => {
    const d = freshSave();
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (raw && raw.format === SAVE_FORMAT) Object.assign(d, raw);
    } catch (e) { /* storage unavailable */ }
    return d;
  })();
  const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } };
  // Per-corp record for the codex.
  function corpStat(key) {
    if (!save.corpStats[key]) save.corpStats[key] = { breached: 0, lost: 0 };
    return save.corpStats[key];
  }
  function markSeen(key) {
    if (!key || save.seen[key]) return;
    save.seen[key] = true;
    persist();
  }

  // ---------------- Sound ----------------
  // Everything is synthesized with Web Audio. Two buses: effects and music,
  // each with its own on/off and volume.
  const Sound = (() => {
    let ac = null, sfxBus = null, noiseBuf = null;
    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        sfxBus = ac.createGain(); sfxBus.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        Music.init(ac, ac.destination, noiseBuf);
        levels();
      } catch (e) { ac = null; }
    }
    // Apply the volume settings to both buses.
    function levels() {
      if (!ac) return;
      sfxBus.gain.setTargetAtTime(save.muted ? 0 : 0.16 * save.sfxVol, ac.currentTime, 0.02);
      Music.volume();
    }
    function tone(freq, dur, { type = 'square', vol = 1, slide = 0, delay = 0 } = {}) {
      if (!ac || save.muted) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(sfxBus);
      o.start(t); o.stop(t + dur + 0.02);
    }
    // Filtered noise; `to` sweeps the filter (for risers).
    function noise(dur, { vol = 0.5, freq = 1000, to = 0, delay = 0, type = 'bandpass' } = {}) {
      if (!ac || save.muted) return;
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = 0.8;
      if (to) f.frequency.exponentialRampToValueAtTime(to, t + dur);
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(sfxBus);
      s.start(t); s.stop(t + dur + 0.02);
    }
    // A brass-ish voice: detuned saws + a square through a filter that opens on the attack,
    // with vibrato coming in on long notes.
    function brass(freq, dur, { vol = 0.12, delay = 0 } = {}) {
      if (!ac || save.muted) return;
      const t = ac.currentTime + delay;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
      f.frequency.setValueAtTime(300, t);
      f.frequency.exponentialRampToValueAtTime(3400, t + 0.05);
      f.frequency.exponentialRampToValueAtTime(1500, t + Math.max(0.1, dur * 0.6));
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
      g.gain.setValueAtTime(vol, t + Math.max(0.04, dur - 0.08));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      const lfo = ac.createOscillator(), lg = ac.createGain();
      lfo.frequency.value = 5.5;
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(dur > 0.4 ? 14 : 0, t + dur * 0.7);
      lfo.connect(lg);
      for (const [type, det] of [['sawtooth', -7], ['sawtooth', 7], ['square', 0]]) {
        const o = ac.createOscillator(); o.type = type;
        o.frequency.setValueAtTime(freq, t); o.detune.value = det;
        lg.connect(o.detune);
        o.connect(f); o.start(t); o.stop(t + dur + 0.02);
      }
      lfo.start(t); lfo.stop(t + dur + 0.02);
      f.connect(g); g.connect(sfxBus);
    }
    const arp = (notes, step, opts) => notes.forEach((f, i) => tone(f, 0.12, Object.assign({ type: 'triangle', vol: 0.4, delay: i * step }, opts)));
    const chord = (notes, dur, opts) => notes.forEach(f => tone(f, dur, opts));
    return {
      init, levels,
      tick: () => tone(1800, 0.018, { vol: 0.12 }),
      clock: () => tone(1400, 0.03, { vol: 0.25 }),
      ui: () => tone(990, 0.04, { vol: 0.3 }),
      deny: () => tone(160, 0.12, { type: 'square', vol: 0.3 }),
      buy: () => { tone(880, 0.05, { vol: 0.3 }); tone(1320, 0.08, { vol: 0.3, delay: 0.06 }); },
      probe: () => { tone(520, 0.05, { vol: 0.3 }); tone(780, 0.05, { vol: 0.25, delay: 0.09 }); tone(640, 0.05, { vol: 0.25, delay: 0.18 }); },
      layer: n => tone(260 + Math.min(n, 30) * 22, 0.07, { vol: 0.25 }),
      // Boss incoming: a riser, then a deep boom with a bright power chord and rising fifths.
      boss: () => {
        noise(0.5, { vol: 0.35, freq: 300, to: 4000 });
        tone(1320, 0.06, { type: 'square', vol: 0.18 }); tone(1320, 0.06, { type: 'square', vol: 0.18, delay: 0.16 });
        tone(110, 0.7, { type: 'sine', vol: 0.9, slide: 0.4, delay: 0.48 });
        chord([220, 330, 440], 0.5, { type: 'square', vol: 0.12, delay: 0.48 });
        arp([440, 659, 880], 0.1, { vol: 0.35, delay: 0.6 });
        tone(1318, 0.5, { type: 'triangle', vol: 0.3, delay: 0.9 });
      },
      safe: () => arp([523, 784, 1046], 0.07, { vol: 0.55 }),
      // Page transition: a soft sweep. Success: a rising sweep, bigger at level 2.
      whoosh: () => noise(0.3, { vol: 0.18, freq: 500 }),
      sweep: lvl => {
        tone(220, 0.45, { type: 'sine', vol: 0.4, slide: 5 });
        noise(0.35, { vol: 0.3, freq: 1800 });
        if (lvl >= 2) arp([659, 880, 1175, 1568], 0.06, { vol: 0.35, delay: 0.1 });
      },
      // Offer pops, scaled by rarity level (0 common .. 4 boss). All bright; no low buzz.
      pop: (lvl, step = 0) => {
        if (lvl >= 3) return Sound.bigPop(lvl, step);
        if (lvl <= 0) return tone(900, 0.03, { vol: 0.2 });
        if (lvl === 1) return arp([700, 1050], 0.05, { vol: 0.3 });
        if (lvl === 2) { arp([600, 900, 1200], 0.05, { vol: 0.35 }); noise(0.12, { vol: 0.2, freq: 4000 }); return; }
        if (lvl === 3) { arp([784, 988, 1175, 1568, 1976], 0.04, { vol: 0.35 }); noise(0.4, { vol: 0.22, freq: 7000 }); return; }
        // BOSS: major chord stab, a quick fanfare up, a held high note and some sparkle.
        chord([523, 659, 784], 0.35, { type: 'triangle', vol: 0.3 });
        chord([523, 784], 0.2, { type: 'square', vol: 0.1 });
        arp([523, 659, 784, 1046], 0.07, { vol: 0.35, delay: 0.08 });
        tone(1568, 0.6, { type: 'triangle', vol: 0.32, delay: 0.38 });
        noise(0.35, { vol: 0.2, freq: 9000, delay: 0.38 });
      },
      // Exotic / boss offers: a short fanfare of their own. `step` is the offer's place
      // in the row, so a row of boss mods climbs (each one a whole step higher).
      bigPop: (lvl, step = 0) => {
        const k = Math.pow(2, (step * 2) / 12);
        const n = m => 440 * Math.pow(2, (m - 69) / 12) * k;
        if (lvl === 3) {
          // EXOTIC: a shimmering run up through a strange (lydian) chord, a bell, sparkle
          arp([72, 76, 78, 83, 86, 90].map(n), 0.035, { vol: 0.3 });
          chord([72, 78, 83].map(n), 0.6, { type: 'triangle', vol: 0.12, delay: 0.21 });
          tone(n(95), 0.9, { type: 'sine', vol: 0.2, delay: 0.21 });
          tone(n(95) * 1.01, 0.9, { type: 'sine', vol: 0.12, delay: 0.21 });   // beating, for shimmer
          noise(0.6, { vol: 0.2, freq: 8000, delay: 0.21 });
          return;
        }
        // BOSS: a brass-like stab, a fast run up, a held top note with a shake, a boom, a crash
        chord([60, 64, 67].map(n), 0.3, { type: 'sawtooth', vol: 0.1 });
        chord([60, 67].map(n), 0.3, { type: 'square', vol: 0.08 });
        tone(n(36), 0.5, { type: 'sine', vol: 0.55, slide: 0.6 });
        arp([60, 64, 67, 72, 76].map(n), 0.045, { vol: 0.32, delay: 0.1 });
        tone(n(79), 0.7, { type: 'triangle', vol: 0.32, delay: 0.33 });
        for (let i = 0; i < 5; i++) tone(n(84) * (i % 2 ? 1.01 : 0.99), 0.07, { type: 'square', vol: 0.05, delay: 0.4 + i * 0.07 });
        noise(0.8, { vol: 0.2, freq: 7000, type: 'highpass', delay: 0.33 });
      },
      // Bad things keep the low buzz, so it always means "bad".
      trap: () => { tone(110, 0.35, { type: 'sawtooth', vol: 0.7, slide: 0.5 }); noise(0.25, { vol: 0.6, freq: 900 }); },
      yourTurn: () => { tone(880, 0.08, { type: 'triangle', vol: 0.45 }); tone(1320, 0.16, { type: 'triangle', vol: 0.45, delay: 0.09 }); },
      shield: () => { tone(1200, 0.15, { type: 'triangle', vol: 0.5, slide: 0.5 }); noise(0.15, { vol: 0.3, freq: 3000 }); },
      loot: () => { for (let i = 0; i < 4; i++) tone(1200 + i * 200, 0.05, { vol: 0.25, delay: i * 0.05 }); },
      // Game over: the music powers down. Over three beats the track slows and sags in
      // pitch, and on each beat a ding plays from the current chord, stepping down
      // (5th, 3rd, root), each one lower, longer and droopier. A low tone powers off
      // under the last one. keepMusic: just the dings (multiplayer, where play goes on).
      death: (keepMusic = false) => {
        if (!ac) return;
        const pd = keepMusic ? Music.keyInfo() : Music.powerDown();
        const now = ac.currentTime;
        const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
        const deg = d => pd.root + 24 + pd.scale[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
        [pd.deg + 4, pd.deg + 2, pd.deg].forEach((d, k) => {
          const t = pd.beats[k], f = mtof(deg(d)) * pd.bend(t), delay = Math.max(0, t - now);
          const len = [0.6, 0.85, 1.5][k], slide = [0.985, 0.95, 0.78][k];
          tone(f, len, { type: 'triangle', vol: 0.55, slide, delay });              // the ding
          tone(f * 2, len * 0.5, { type: 'sine', vol: 0.16, slide, delay });         // its shine
          tone(f * 3.01, 0.05, { type: 'sine', vol: 0.06, delay });                  // a little strike
        });
        const t3 = pd.beats[2];
        tone(mtof(pd.root + 12) * pd.bend(t3), 1.6, { type: 'sine', vol: 0.5, slide: 0.4, delay: Math.max(0, t3 - now) });   // power off
        noise(0.5, { vol: 0.06, freq: 2500, to: 200, delay: Math.max(0, t3 - now) + 0.2 });
      },
      // Boss beaten: the music powers up. Over three beats the track pushes faster and a
      // little higher, and a ding climbs the current chord on each beat (root, 3rd, 5th).
      // Then a bright major chord with a high bell and sparkle, and the music cuts to silence.
      bossWin: () => {
        if (!ac) return 1.5;
        const pd = Music.powerUp();
        const now = ac.currentTime;
        const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
        const deg = d => pd.root + 24 + pd.scale[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);
        const at = t => Math.max(0, t - now);
        [pd.deg, pd.deg + 2, pd.deg + 4].forEach((d, k) => {
          const t = pd.beats[k], f = mtof(deg(d)) * pd.bend(t);
          tone(f, 0.35 + k * 0.08, { type: 'triangle', vol: 0.45 + k * 0.08, delay: at(t) });   // the ding
          tone(f * 2, 0.25, { type: 'sine', vol: 0.18, delay: at(t) });                            // its shine
          tone(f * 3.01, 0.04, { type: 'sine', vol: 0.07, delay: at(t) });                         // a little strike
        });
        // the landing: a major chord on the chord's root, an octave up (always major: it's a win)
        const t = pd.end, b = pd.bend(t), r0 = deg(pd.deg) + 12;
        chord([r0, r0 + 4, r0 + 7].map(m => mtof(m) * b), 1.4, { type: 'triangle', vol: 0.2, delay: at(t) });
        chord([r0 - 12, r0 - 5].map(m => mtof(m) * b), 0.9, { type: 'square', vol: 0.06, delay: at(t) });
        tone(mtof(r0 + 12) * b, 1.6, { type: 'triangle', vol: 0.28, delay: at(t) });              // high bell
        tone(mtof(pd.root) * b, 0.6, { type: 'sine', vol: 0.6, slide: 0.6, delay: at(t) });        // boom
        noise(0.7, { vol: 0.16, freq: 9000, delay: at(t) });                                       // sparkle
        arp([r0 + 7, r0 + 12, r0 + 16, r0 + 19].map(m => mtof(m) * b), 0.05, { vol: 0.16, delay: at(t) + 0.08 });

        // On top: a classic "stage clear" layer, separate from the track.
        // A riser and a snare roll build into the landing...
        const build = Math.max(0.3, t - now);
        noise(build, { vol: 0.13, freq: 700, to: 7000 });
        for (let i = 0, d = 0; d < build - 0.04; i++) {
          const u = d / build;
          noise(0.05, { vol: 0.08 + 0.2 * u, freq: 2200, delay: d });
          d += 0.16 - 0.11 * u;                                         // the roll speeds up
        }
        // ...then a brass fanfare: "ta-ta-ta TAAA, ta-da DAAAA" over a held major chord,
        // with timpani under it...
        const br = r0 - 12, B_ = (m, d, len, v) => brass(mtof(m) * b, len, { vol: v, delay: at(t) + d });
        [-0.27, -0.18, -0.09].forEach(d => B_(br - 5, d, 0.08, 0.1));     // pickup triplet
        B_(br, 0, 0.42, 0.13);                                            // TAAA
        B_(br - 12, 0, 1.5, 0.07); B_(br - 5, 0, 1.5, 0.06); B_(br + 4, 0, 1.5, 0.05);   // the chord, held
        B_(br + 4, 0.45, 0.12, 0.11); B_(br + 7, 0.58, 0.12, 0.11);      // ta-da
        B_(br + 12, 0.72, 1.1, 0.14);                                     // DAAAA
        B_(br + 16, 0.74, 1.05, 0.06);                                    // harmony a 3rd up
        const timp = (d, v) => tone(mtof(pd.root + 12) * b, 0.6, { type: 'sine', vol: v, slide: 0.85, delay: Math.max(0, at(t) + d) });
        [-0.36, -0.24, -0.12].forEach((d, i) => timp(d, 0.18 + i * 0.08)); timp(0, 0.55); timp(0.72, 0.5);
        // ...a crash on each big hit, and a twinkle falling away into the silence.
        noise(1.4, { vol: 0.22, freq: 6000, type: 'highpass', delay: at(t) });
        noise(1.6, { vol: 0.2, freq: 6000, type: 'highpass', delay: at(t) + 0.72 });
        [24, 19, 16, 12, 7, 4].forEach((iv, i) => tone(mtof(r0 + iv) * b, 0.18, { type: 'triangle', vol: 0.08 * (1 - i / 7), delay: at(t) + 1.5 + i * 0.09 }));
        return t - now;   // seconds until the fanfare lands (screens time their reveal to it)
      },
      // A line coming in on a success screen: blips that climb a pentatonic scale.
      climb: i => {
        const P = [0, 2, 4, 7, 9], m = 76 + P[i % 5] + 12 * Math.floor(i / 5) % 24;
        tone(440 * Math.pow(2, (m - 69) / 12), 0.06, { type: 'triangle', vol: 0.3 });
      },
      // The losing collapse, under the dings: a crackle, a long falling whistle, data
      // blips breaking up lower and lower as the line sweeps down, and a thud at the bottom.
      collapse: (dur = 2.9) => {
        noise(0.25, { vol: 0.35, freq: 6000, to: 1500 });                       // the crack
        tone(1400, 0.06, { type: 'square', vol: 0.15 }); tone(1100, 0.06, { type: 'square', vol: 0.15, delay: 0.07 });
        tone(900, dur * 0.85, { type: 'sawtooth', vol: 0.06, slide: 0.06, delay: 0.1 });   // falling whistle
        tone(450, dur * 0.85, { type: 'sine', vol: 0.12, slide: 0.08, delay: 0.1 });
        noise(dur * 0.8, { vol: 0.12, freq: 3000, to: 150, delay: 0.1 });       // rushing air, darkening
        const n = 22;
        for (let i = 0; i < n; i++) {
          const u = i / n, f = (2400 - 2000 * u) * rand(0.8, 1.25);              // blips get lower as it falls
          tone(f, 0.025 + Math.random() * 0.03, { type: 'square', vol: 0.12 * (1 - u * 0.5), slide: Math.random() < 0.3 ? 0.5 : 0, delay: 0.15 + u * dur * 0.75 + Math.random() * 0.06 });
        }
        tone(70, 0.6, { type: 'sine', vol: 0.7, slide: 0.5, delay: dur * 0.88 });   // landing thud
        noise(0.3, { vol: 0.25, freq: 400, type: 'lowpass', delay: dur * 0.88 });
      },
      win: () => arp([523, 659, 784, 1046, 1318], 0.1, { vol: 0.5 }),
      // Run won: a boom, a big major chord, a fast run up, and a held top note with sparkle.
      victory: () => {
        tone(98, 0.8, { type: 'sine', vol: 0.8, slide: 0.5 });
        chord([523, 659, 784], 0.6, { type: 'triangle', vol: 0.28 });
        arp([523, 659, 784, 1046, 1318, 1568, 2093], 0.06, { vol: 0.32, delay: 0.15 });
        chord([784, 1046, 1318], 0.9, { type: 'triangle', vol: 0.22, delay: 0.62 });
        tone(2093, 1.0, { type: 'triangle', vol: 0.25, delay: 0.62 });
        noise(0.6, { vol: 0.18, freq: 9000, delay: 0.62 });
      },
      burst: () => { noise(0.25, { vol: 0.22, freq: 6000 + Math.random() * 3000 }); tone(1200 + Math.random() * 1200, 0.08, { type: 'triangle', vol: 0.18 }); },
    };
  })();

  // ---------------- Music ----------------
  // Generated 80s-style synthwave: pad, bass, drums, arp and lead, scheduled a little
  // ahead in 16th-note steps. Each corp has its own song; layers come in as you go deeper.
  //   level 0: pad + bass   1: + drums   2: + arp   3: + lead (boss)   4: final boss
  // urgency (0..1): Chronos clock pressure; speeds up, opens the filter, doubles the hats.
  const SCALES = {
    minor: [0, 2, 3, 5, 7, 8, 10], phrygian: [0, 1, 3, 5, 7, 8, 10],
    dorian: [0, 2, 3, 5, 7, 9, 10], harmonic: [0, 2, 3, 5, 7, 8, 11],
  };
  // Tracks, by their own names. Where each one plays is set in MUSIC_FOR below,
  // so tracks can be moved between corps/screens by changing one line.
  const SONGS = {
    // Slow and mellow, Blade Runner-ish: long pad swells, a low brass-like swell, sparse
    // bell notes into a long echo, no drums. (echo/feedback: per-track delay.)
    night_rain: { name: 'NIGHT RAIN',     bpm: 64,  root: 40, scale: 'minor',    prog: [0, 5, 3, 6], style: 'ambient', echo: 0.62, feedback: 0.55 },
    gridlock:   { name: 'GRIDLOCK',       bpm: 96,  root: 45, scale: 'minor',    prog: [0, 5, 3, 4], bass: 'eighths', drums: 'four',  arp: 'up' },
    concrete:   { name: 'CONCRETE MARCH', bpm: 104, root: 43, scale: 'minor',    prog: [0, 0, 5, 6], bass: 'march',   drums: 'march', arp: 'up' },
    velvet:     { name: 'VELVET HEX',     bpm: 92,  root: 46, scale: 'phrygian', prog: [0, 1, 0, 6], bass: 'pulse',   drums: 'half',  arp: 'updown' },
    overdrive:  { name: 'OVERDRIVE',      bpm: 124, root: 50, scale: 'minor',    prog: [0, 6, 5, 6], bass: 'eighths', drums: 'four',  arp: 'up', tick: true },
    glass:      { name: 'GLASS ECHO',     bpm: 100, root: 52, scale: 'dorian',   prog: [0, 3, 0, 4], bass: 'offbeat', drums: 'four',  arp: 'mirror', pingpong: true },
    meltdown:   { name: 'MELTDOWN',       bpm: 112, root: 38, scale: 'harmonic', prog: [0, 5, 1, 4], bass: 'gallop',  drums: 'heavy', arp: 'down' },
  };
  // Where each track plays: menus, the map (+ market, caches, safehouses), and each corp.
  const MUSIC_FOR = {
    menu: 'night_rain', map: 'gridlock',
    perimeter: 'concrete', sigil: 'velvet', chronos: 'overdrive', mirror: 'glass', omni: 'meltdown',
  };
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const BASS_STEPS = {
    eighths: [0, 2, 4, 6, 8, 10, 12, 14], march: [0, 3, 6, 8, 11, 14], pulse: [0, 4, 8, 12],
    offbeat: [2, 6, 10, 14], gallop: [0, 2, 3, 4, 6, 7, 8, 10, 11, 12, 14, 15],
  };
  const DRUMS = {
    four:  { kick: [0, 4, 8, 12], snare: [4, 12], hat: [2, 6, 10, 14] },
    march: { kick: [0, 8], snare: [4, 12], hat: [0, 2, 4, 6, 8, 10, 12, 14], roll: [13, 14, 15] },
    half:  { kick: [0, 10], snare: [8], hat: [4, 12] },
    heavy: { kick: [0, 3, 8, 11], snare: [4, 12], hat: [0, 2, 4, 6, 8, 10, 12, 14] },
  };
  const LEAD_STEPS = [0, 3, 6, 10, 12];
  const LEAD_DEGREES = [4, 2, 0, 2, 4, 5, 4, 2];

  const Music = (() => {
    let ac = null, out = null, songG = null, pump = null, echo = null, noiseBuf = null;
    let key = null, song = null, step = 0, nextTime = 0, getState = null, echoDelay = null, echoFb = null;
    // A power-down (lose) or power-up (boss beaten) in progress:
    //   { dir: -1 | 1, t0, beats: [3 beat times], end, hold }
    // Down: the tempo drops each beat and the pitch sags (to -8 semitones).
    // Up: the tempo pushes each beat and the pitch lifts a little (+2 semitones).
    // After `end` the track is silent; the next track waits until `hold`, then fades in slowly.
    let fx = null;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const bend = t => {
      if (!fx) return 1;
      const u = clamp((t - fx.t0) / (fx.end - fx.t0), 0, 1);
      return Math.pow(2, (fx.dir < 0 ? -8 : 2) * u * u / 12);
    };
    const slowAt = t => {
      if (!fx) return 1;
      const k = t < fx.beats[1] ? 0 : t < fx.beats[2] ? 1 : 2;
      return (fx.dir < 0 ? [0.8, 0.55, 0.4] : [1.05, 1.1, 1.15])[k];
    };

    // The current track's key, chord and beat, for jingles that play along with it.
    function keyInfo(slowing = false) {
      const sg = song || SONGS[key] || SONGS.gridlock;
      const s = getState ? getState() : null;
      const beat = clamp(60 / (sg.bpm * (s && s.tempo || 1)), 0.45, 0.7);
      const t0 = (ac ? ac.currentTime : 0) + 0.03;
      const beats = slowing === 'up' ? [t0, t0 + beat / 1.05, t0 + beat / 1.05 + beat / 1.1]
        : slowing ? [t0, t0 + beat / 0.8, t0 + beat / 0.8 + beat / 0.55] : [t0, t0 + beat * 1.1, t0 + beat * 2.4];
      const end = beats[2] + (slowing === 'up' ? beat / 1.15 : beat / 0.4);
      return { root: sg.root, scale: SCALES[sg.scale], deg: sg.prog[Math.floor(step / 16) % sg.prog.length], beat, beats, end, t0 };
    }
    // Slow the playing track down to a stop over three beats (game over).
    function powerDown() {
      const info = keyInfo(true);
      if (!ac || !song) return Object.assign(info, { bend: () => 1 });
      fx = { dir: -1, t0: info.t0, beats: info.beats, end: info.end, hold: 0 };
      songG.gain.cancelScheduledValues(info.beats[2]);
      songG.gain.setTargetAtTime(0, info.beats[2], info.beat / 2.5);   // fade over the last beat
      return Object.assign(info, { bend });
    }
    // Push the playing track up over three beats, then cut to silence (boss beaten).
    // The next track waits a moment, then fades in slowly.
    function powerUp() {
      const info = keyInfo('up');
      if (!ac || !song) return Object.assign(info, { bend: () => 1 });
      fx = { dir: 1, t0: info.t0, beats: info.beats, end: info.end, hold: info.end + 2.6 };   // room for the brass fanfare
      songG.gain.cancelScheduledValues(info.beats[2]);
      songG.gain.setTargetAtTime(0, info.end, 0.08);                 // stop on the fanfare's last hit
      return Object.assign(info, { bend });
    }

    function init(ctx, dest, nb) {
      ac = ctx; noiseBuf = nb;
      out = ac.createGain(); out.gain.value = 0; out.connect(dest);       // music volume
      songG = ac.createGain(); songG.gain.value = 0; songG.connect(out);   // fades between songs
      pump = ac.createGain(); pump.connect(songG);                         // "sidechain" pumping
      // Echo for the arp and lead.
      const d = ac.createDelay(1.5), fb = ac.createGain(), lp = ac.createBiquadFilter();
      d.delayTime.value = 0.32; fb.gain.value = 0.3; lp.type = 'lowpass'; lp.frequency.value = 2400;
      echoDelay = d; echoFb = fb;
      echo = ac.createGain(); echo.gain.value = 0.5;
      echo.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(pump);
      setInterval(schedule, 25);
    }
    function volume() {
      if (!ac) return;
      out.gain.setTargetAtTime(save.musicOn ? 0.5 * save.musicVol : 0, ac.currentTime, 0.1);
    }

    // Fade out the current song, then start the new one from the top.
    function switchTo(next) {
      const first = key == null;
      key = next;
      const slowIn = fx && fx.dir > 0;   // after a boss fanfare: ease the next track in
      fx = null;
      const now = ac.currentTime;
      songG.gain.cancelScheduledValues(now);
      songG.gain.setValueAtTime(songG.gain.value, now);
      songG.gain.linearRampToValueAtTime(0, now + (first ? 0.01 : 0.35));
      song = null;
      setTimeout(() => {
        song = SONGS[key] || null;
        if (!song) return;
        step = 0; nextTime = ac.currentTime + 0.05;
        echoDelay.delayTime.setTargetAtTime(song.echo || 0.32, ac.currentTime, 0.05);
        echoFb.gain.setTargetAtTime(song.feedback || 0.3, ac.currentTime, 0.05);
        pump.gain.cancelScheduledValues(ac.currentTime);
        pump.gain.setValueAtTime(1, ac.currentTime);
        const t = ac.currentTime;
        songG.gain.cancelScheduledValues(t);
        songG.gain.setValueAtTime(0, t);
        songG.gain.linearRampToValueAtTime(1, t + (slowIn ? 4 : 0.8));
      }, first ? 0 : 380);
    }

    function schedule() {
      if (!ac || ac.state !== 'running' || !getState) return;
      const s = getState();
      // A new track waits for a boss fanfare (and its silence) to finish.
      if (s.song !== key && !(fx && fx.dir > 0 && ac.currentTime < fx.hold)) switchTo(s.song);
      if (!song) return;
      // After a stall (background tab), skip ahead instead of playing a burst of missed notes.
      if (nextTime < ac.currentTime - 0.2) nextTime = ac.currentTime + 0.02;
      while (nextTime < ac.currentTime + 0.12) {
        if (fx && nextTime > fx.end) return;        // powered down / fanfare over: silence until the next track
        const spb = 60 / (song.bpm * s.tempo * slowAt(nextTime)) / 4;   // seconds per 16th note
        playStep(step, nextTime, spb, s);
        nextTime += spb;
        step = (step + 1) % (16 * song.prog.length);
      }
    }

    function voice(type, freq, t, dur, { vol = 0.2, cut = 2000, q = 1, attack = 0.005, release = 0.08, detune = 0, sweep = false, send = 0, pan = 0 } = {}) {
      const o = ac.createOscillator(); o.type = type; o.frequency.value = freq * bend(t); o.detune.value = detune;
      const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = q;
      f.frequency.setValueAtTime(sweep ? cut * 2.5 : cut, t);
      if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(80, cut * 0.6), t + dur * 0.8);
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.setValueAtTime(vol, t + Math.max(attack, dur - release));
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(g);
      let node = g;
      if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = pan; g.connect(p); node = p; }
      node.connect(pump);
      if (send) { const sg = ac.createGain(); sg.gain.value = send; node.connect(sg); sg.connect(echo); }
      o.start(t); o.stop(t + dur + 0.05);
    }
    function hit(dur, { vol = 0.3, freq = 1000, type = 'bandpass', t }) {
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(pump);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function kick(t, vol = 0.7) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      o.connect(g); g.connect(songG);   // the kick skips the pump so it stays punchy
      o.start(t); o.stop(t + 0.32);
    }
    // Duck the music right after the kick: the classic synthwave pumping.
    function duck(t, spb) {
      pump.gain.cancelScheduledValues(t);
      pump.gain.setValueAtTime(0.45, t);
      pump.gain.linearRampToValueAtTime(1, t + spb * 3);
    }

    // Ambient songs (the menu track): pads, a brass swell, bells. No drums or pumping.
    function ambientStep(i, t, spb) {
      const sc = SCALES[song.scale];
      const bar = Math.floor(i / 16) % song.prog.length, k = i % 16;
      const deg = song.prog[bar];
      const note = (d, oct = 0) => song.root + sc[((d % 7) + 7) % 7] + 12 * (Math.floor(d / 7) + oct);
      const chordN = [note(deg), note(deg + 2), note(deg + 4)];
      const barLen = spb * 16;
      if (k === 0) {
        // Wide, slow pad: three detuned saws per note, fading in and out across the bar.
        for (const n of chordN) for (const det of [-14, 0, 14]) voice('sawtooth', mtof(n + 12), t, barLen + 1.2, { vol: 0.018, cut: 900, attack: 1.4, release: 1.4, detune: det });
        voice('sine', mtof(note(deg) - 12), t, barLen + 1, { vol: 0.07, cut: 300, attack: 0.8, release: 1 });
        // Every other bar: a low, brassy swell (root + fifth).
        if (bar % 2 === 0) for (const n of [note(deg) + 12, note(deg + 4) + 12]) voice('sawtooth', mtof(n - 12), t, barLen * 1.6, { vol: 0.03, cut: 1300, q: 2, attack: 1.8, release: 1.6, detune: 6 });
      }
      // Sparse bell notes that ring out into the echo.
      const bells = { 0: 2, 6: 1, 10: 0, 13: 2 };
      if (k in bells && (k !== 13 || bar % 2 === 1)) {
        const n = chordN[bells[k]] + 24;
        voice('triangle', mtof(n), t, 2.4, { vol: 0.045, cut: 5000, attack: 0.005, release: 2.2, send: 0.85, pan: (k % 4 === 2) ? 0.4 : -0.3 });
        voice('sine', mtof(n + 12), t, 1.2, { vol: 0.015, cut: 6000, attack: 0.005, release: 1.1 });
      }
    }

    function playStep(i, t, spb, s) {
      if (song.style === 'ambient') return ambientStep(i, t, spb);
      const sc = SCALES[song.scale];
      const bar = Math.floor(i / 16) % song.prog.length, k = i % 16;
      const deg = song.prog[bar];
      const note = (d, oct = 0) => song.root + sc[((d % 7) + 7) % 7] + 12 * (Math.floor(d / 7) + oct);
      const chordN = [note(deg), note(deg + 2), note(deg + 4)];
      const lvl = s.level, u = s.urgency;
      const cut = 500 + lvl * 450 + u * 2400;

      // Pad: a held, detuned chord each bar.
      if (k === 0) for (const n of chordN) for (const det of [-9, 9]) voice('sawtooth', mtof(n + 12), t, spb * 16, { vol: 0.03, cut: cut * 0.8, attack: 0.25, release: 0.3, detune: det });
      // Bass
      if (BASS_STEPS[song.bass].includes(k)) {
        voice('sawtooth', mtof(note(deg)), t, spb * 1.7, { vol: 0.15, cut: 260 + cut * 0.25, q: 6, sweep: true });
        voice('sine', mtof(note(deg)), t, spb * 1.7, { vol: 0.1, cut: 400 });
      }
      // Drums
      if (lvl >= 1) {
        const d = DRUMS[song.drums];
        if (d.kick.includes(k)) { kick(t); duck(t, spb); }
        if (d.snare.includes(k) || (d.roll && bar === song.prog.length - 1 && d.roll.includes(k))) {
          hit(0.22, { vol: 0.28, freq: 1800, t });
          hit(0.35, { vol: 0.08, freq: 4000, type: 'lowpass', t });   // a little gated-reverb tail
        }
        const fast = song.tick ? u > 0.45 : lvl >= 3;
        if (d.hat.includes(k) || (fast && k % 2 === 1)) hit(0.04, { vol: song.tick ? 0.12 : 0.07, freq: 7000, type: 'highpass', t });
      } else if (k % 4 === 0) duck(t, spb);
      // Arp
      if (lvl >= 2) {
        const tones = [...chordN, ...chordN.map(n => n + 12)].map(n => n + 12);
        const order = song.arp === 'down' ? [5, 4, 3, 2, 1, 0]
          : song.arp === 'updown' ? [0, 1, 2, 3, 4, 5, 4, 3, 2, 1]
          : song.arp === 'mirror' ? (k < 8 ? [0, 1, 2, 3, 4, 5] : [5, 4, 3, 2, 1, 0]) : [0, 1, 2, 3, 4, 5];
        const n = tones[order[k % order.length]];
        voice('square', mtof(n), t, spb * 0.9, { vol: 0.04, cut: 1800 + u * 2000, release: 0.04, send: 0.6, pan: song.pingpong ? (k % 2 ? 0.6 : -0.6) : 0 });
      }
      // Lead (bosses)
      if (lvl >= 3 && LEAD_STEPS.includes(k)) {
        const dg = deg + LEAD_DEGREES[(bar * LEAD_STEPS.length + LEAD_STEPS.indexOf(k)) % LEAD_DEGREES.length];
        voice('square', mtof(note(dg, 2)), t, spb * 2.6, { vol: lvl >= 4 ? 0.06 : 0.05, cut: 3200, attack: 0.02, release: 0.1, send: 0.5 });
      }
      // Heartbeat when integrity is low.
      if (s.low && (k === 0 || k === 3)) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
        g.gain.setValueAtTime(k === 0 ? 0.5 : 0.35, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.22);
      }
    }

    return { init, volume, setSource: fn => { getState = fn; }, current: () => key, keyInfo: () => Object.assign(keyInfo(), { bend: () => 1 }), powerDown, powerUp,
      restart: () => { if (ac && key) switchTo(key); } };
  })();

  // ---------------- Canvas & layout ----------------
  const cv = document.getElementById('screen');
  const g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let L = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    computeLayout();
  }

  function computeLayout() {
    const gd = (st.mode === 'play' && st.lv) ? { cols: st.lv.cols, rows: st.lv.rows } : { cols: 4, rows: 4 };
    const gw = gd.cols * TILE_W + (gd.cols - 1) * GAP_X;
    const gh = gd.rows * TILE_H + (gd.rows - 1) * GAP_Y;
    const wc = Math.max(gw, MIN_CONTENT_W);
    const hc = BOARD_Y + gh + TRAY_ROWS + 2;
    g.font = `400 100px ${FONT}`;
    const ratio = (g.measureText('M').width / 100) || 0.6;
    const gutter = 12;
    let fs = Math.min((W - 2 * gutter) / (wc * ratio), (H - 2 * gutter) / (hc * LINE_H));
    fs = Math.max(7, Math.min(26, fs));
    const cw = fs * ratio, chh = fs * LINE_H;
    L = {
      fs, cw, chh, wc, hc, gw, gh,
      gx: Math.floor((wc - gw) / 2),
      cols: gd.cols, rows: gd.rows,
      ox: Math.round((W - wc * cw) / 2),
      oy: Math.round((H - hc * chh) / 2),
    };
  }
  const pxX = cx => L.ox + cx * L.cw + L.cw / 2;
  const pxY = cy => L.oy + cy * L.chh + L.chh / 2;
  const tileOrigin = t => ({ tx: L.gx + t.col * (TILE_W + GAP_X), ty: BOARD_Y + t.row * (TILE_H + GAP_Y) });
  const tileCenter = t => { const { tx, ty } = tileOrigin(t); return { x: pxX(tx + (TILE_W - 1) / 2), y: pxY(ty + (TILE_H - 1) / 2) }; };

  // ---------------- State ----------------
  const params = new URLSearchParams(location.search);
  const urlSeed = cleanSeed(params.get('seed'));

  const st = {
    mode: 'title',          // title | map | play | panel | over
    seed: urlSeed || newSeed(),
    practice: !!urlSeed,
    run: null,              // the current run (map, integrity, credits, items, mods)
    corp: null,             // the corp being hacked
    lv: null,               // the current layer
    panelFn: null,          // builds the lines for panel screens
    panelTitle: '',
    panelT0: 0,             // when offers start popping in
    revealed: new Set(),    // offers that already popped
    busy: true,
    hover: -1, hoverBtn: null, hoverNode: null, hoverItem: -1, hoverMod: -1,
    selItem: -1, selMod: -1,  // tray selection: first tap shows info, second tap uses
    mapSel: null,
    timer: null,
    msg: '', msgCol: '', msgT: 0,
    boardStart: 0,
    wipe: null,             // board transition in progress
    hideBoard: false, hideAll: false,
    debug: false,           // show the real node (dev menu)
    dev: false,             // dev menu open
    devAccess: params.get('dev') === '1',
    result: null,
    transitioning: false,
    resetArmed: false,
    pause: false,           // pause menu open (during a run)
    intro: null,            // corp intro screen showing ({ skip })
    mp: null,               // online multiplayer game, when playing one
    freeTravel: false,      // dev: travel to any node on the map
    god: false,             // dev: ICE does no damage
    abandonArmed: false,
    kbFocus: null,          // id of the button the keyboard cursor is on
    kbGrid: false,          // last grid move came from the keyboard (shows a blinking cursor)
    focusables: [],         // tappable buttons on screen, in reading order, for the keyboard
    keyHandler: null,       // screen-specific keys (codex, help, settings)
    scroll: null,           // screen-specific scrolling (wheel, swipe)
    drag: null,
  };
  const has = key => !!(st.run && st.run.mods.includes(key));
  const reduced = () => save.effects === 'reduced';

  // ---------------- Effects ----------------
  const parts = [];
  const shakeFx = { amp: 0, t0: 0, dur: 1 };
  const flashFx = { col: '#fff', a: 0, t0: 0, dur: 1 };
  const rand = (a, b) => a + Math.random() * (b - a);

  function shake(amp, dur = 0.35) { if (reduced()) return; Object.assign(shakeFx, { amp: amp * L.fs / 16, t0: performance.now(), dur }); }
  function flash(col, a, dur = 0.3) { if (reduced()) return; Object.assign(flashFx, { col, a, t0: performance.now(), dur }); }

  // Current on-screen characters (without transitions), as pixel positions.
  function snapshot(filter) {
    return buildScene(performance.now(), false, true)
      .filter(filter)
      .map(c => ({ ch: c.ch, x: pxX(c.cx), y: pxY(c.cy), col: c.col }));
  }

  function explode(cells, ox, oy, { col = null, power = 1, grav = 1, life = [0.7, 1.3] } = {}) {
    const k = L.fs / 16;
    for (const c of cells) {
      const dx = c.x - ox, dy = c.y - oy, d = Math.hypot(dx, dy) || 1;
      const sp = rand(220, 600) * power * k;
      parts.push({
        mode: 'explode', ch: c.ch, x: c.x, y: c.y, col: col || c.col,
        vx: dx / d * sp + rand(-60, 60) * k,
        vy: dy / d * sp - rand(80, 320) * power * k,
        rot: 0, vr: rand(-9, 9), g: grav,
        t: 0, life: rand(life[0], life[1]), alpha: 1, scr: 5,
      });
    }
  }

  // Fireworks made of type: a word and some noise characters blasting out from a point.
  const FIREWORK_WORDS = ['ROOT', 'ACCESS', 'GRANTED', 'OWNED', '0xFF', '1337', 'WIN', 'R00T'];
  function typeFirework(x, y, col) {
    const word = FIREWORK_WORDS[Math.floor(Math.random() * FIREWORK_WORDS.length)];
    const cells = [];
    for (let i = 0; i < 22; i++) cells.push({ ch: i < word.length * 2 ? word[i % word.length] : noiseCh(), x, y, col });
    // Spread the start points a little so the burst has a shape.
    for (const c of cells) { const a = Math.random() * Math.PI * 2; c.x += Math.cos(a) * L.cw; c.y += Math.sin(a) * L.chh; }
    explode(cells, x, y, { power: 0.75, grav: 0.45, life: [0.8, 1.5] });
    Sound.burst();
  }
  function fireworkShow(n = 9, every = 280, mode = 'over') {
    const cols = () => [C.cyan, C.gold, C.exotic, C.epic, C.rare, C.bright];
    for (let i = 0; i < n; i++) {
      setTimeout(() => {
        if (st.mode !== mode) return;
        const x = pxX(rand(L.wc * 0.15, L.wc * 0.85)), y = pxY(rand(BOARD_Y + 1, BOARD_Y + L.gh * 0.6));
        typeFirework(x, y, pickR(cols(), Math.random));
      }, 350 + i * every + Math.random() * 120);
    }
  }

  // Losing: the screen collapses from the top down, like falling back down the net.
  // Characters glitch in place, then let go row by row from the top, dropping
  // (accelerating), scrambling, going red and fading. Returns the total time (ms).
  const FALL = { wave: 1.7, jitter: 0.3, fall: 0.95 };
  function fallOut(cells) {
    const top = L.oy, h = L.hc * L.chh;
    for (const c of cells) {
      const f = clamp((c.y - top) / h, 0, 1);
      parts.push({
        mode: 'fall', ch: c.ch, x: c.x, y: c.y, x0: c.x, y0: c.y, col: c.col, base: c.col,
        drop: f * FALL.wave + Math.random() * FALL.jitter,   // when it lets go
        vy: 0, t: 0, life: 0, rot: 0, alpha: 1, scr: 0,
      });
    }
    return (FALL.wave + FALL.jitter + FALL.fall) * 1000;
  }

  // Boss beaten: the screen breaks up from the bottom and floats away upward, the real
  // node last. Ends empty (the reveal comes next). Returns the total time (ms).
  const RISE = { wave: 0.9, jitter: 0.25, rise: 0.8 };
  function riseOut(litKeys, speed = 1) {   // speed > 1 = slower (fits it to the fanfare)
    const R = { wave: RISE.wave * speed, jitter: RISE.jitter * speed, rise: RISE.rise * speed };
    const top = L.oy, h = L.hc * L.chh;
    const cells = buildScene(performance.now(), false, true);
    for (const c of cells) {
      const x = pxX(c.cx), y = pxY(c.cy);
      const lit = litKeys.has(c.cx + ',' + c.cy);
      const f = 1 - clamp((y - top) / h, 0, 1);   // bottom rows go first
      parts.push({
        mode: 'rise', ch: c.ch, x, y, x0: x, y0: y, col: lit ? C.cyan : c.col, base: lit ? C.cyan : c.col, bold: lit,
        drop: lit ? R.wave + R.jitter : f * R.wave + Math.random() * R.jitter, riseT: R.rise,
        vy: 0, t: 0, life: 0, rot: 0, alpha: 1, scr: 0,
      });
    }
    return (R.wave + R.jitter + R.rise) * 1000;
  }

  function updateParts(dt) {
    const grav = 1500 * L.fs / 16;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t < 0) continue;
      const k = Math.min(1, p.t / p.life);
      if (p.mode === 'float') {   // emotes: drift up and fade
        p.y -= 26 * (L.fs / 16) * dt;
        p.alpha = k > 0.6 ? Math.max(0, (1 - k) / 0.4) : 1;
        if (p.t >= p.life) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'rise') {
        const r = Math.random();
        if (p.t < p.drop) {
          const near = 1 - Math.min(1, (p.drop - p.t) / 0.5);
          if (r < 0.1 * near) p.ch = noiseCh();
          p.col = Math.random() < 0.3 * near ? C.bright : p.base;
          continue;
        }
        const k2 = (p.t - p.drop) / p.riseT;
        p.vy -= grav * 0.45 * dt;
        p.y += p.vy * dt;
        if (r < 0.2) p.ch = noiseCh();
        p.col = k2 < 0.25 ? C.bright : k2 < 0.6 ? C.cyan : C.gold;
        p.alpha = Math.max(0, 1 - k2);
        if (k2 >= 1) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'fall') {
        const r = Math.random();
        if (p.t < p.drop) {
          // waiting: glitch in place, more as its turn gets close
          const near = 1 - Math.min(1, (p.drop - p.t) / 0.6);
          if (r < 0.02 + 0.12 * near) p.ch = noiseCh();
          p.x = r < 0.03 + 0.08 * near ? p.x0 + rand(-1, 1) * L.cw : p.x0;
          p.col = Math.random() < 0.05 + 0.25 * near ? C.red : p.base;
          continue;
        }
        const k2 = (p.t - p.drop) / FALL.fall;
        p.vy += grav * 0.55 * dt;
        p.y += p.vy * dt;
        p.x = p.x0 + (r < 0.05 ? rand(-1, 1) * L.cw : 0);
        if (r < 0.25) p.ch = noiseCh();
        p.col = k2 > 0.3 ? C.redDim : C.red;
        p.alpha = Math.max(0, 1 - k2);
        if (k2 >= 1) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'glitch') {
        const r = Math.random();
        if (r < 0.12) p.ch = noiseCh();
        p.x = r < 0.06 ? p.x0 + rand(-2, 2) * L.cw : p.x0;
        p.col = Math.random() < 0.1 ? C.red : p.base;
        if (p.t >= p.life) parts.splice(i, 1);
        continue;
      }
      p.vy += grav * p.g * dt;
      p.vx *= 1 - 0.8 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.alpha = k > 0.6 ? Math.max(0, (1 - k) / 0.4) : 1;
      if (Math.random() < p.scr * dt) p.ch = noiseCh();
      if (p.t >= p.life) parts.splice(i, 1);
    }
  }

  // ---------------- Scroll-fill wipe ----------------
  // The board fills from the bottom with a scrolling pattern; a scramble band
  // rides the front. Then the next screen comes up out of the fill the same way.
  // level 0 = quiet page change, 1 = success, 2 = perfect / boss clear.
  // Fills scroll upward. Two kinds:
  //   - patterns: 4-row repeats (strings), so you can see them move
  //   - noise fields: random characters fixed in place, so the whole field scrolls
  //     up together (fresh random noise every frame would just flicker)
  // Each wipe picks one at random (quiet set for page changes, success set for wins).
  const hash2 = (a, b) => {
    let x = (Math.imul(a + 11, 374761393) + Math.imul(b + 7, 668265263)) | 0;
    x = Math.imul(x ^ (x >>> 15), 0x2c1b3c6d);
    x = Math.imul(x ^ (x >>> 12), 0x297a2d39);
    return (x ^ (x >>> 15)) >>> 0;
  };
  const noiseField = (chars, density) => (cx, r) => {
    const h = hash2(cx, r);
    return (h % 1000) < density * 1000 ? chars[(h >>> 10) % chars.length] : null;
  };
  // Each column cycles through `chain` with its own offset, so columns ripple.
  const streams = chain => (cx, r) => {
    const ch = chain[(r + hash2(cx, 3) % chain.length) % chain.length];
    return ch === ' ' ? null : ch;
  };
  const FILLS = {
    quiet: [
      streams(' .:|'),
      noiseField('...::;+=', 0.5),
      [' ^  ^  ^', '/ \\/ \\/ ', ': :: :: ', '. .. .. '],    // chevrons
      ['-=-=-=-=', ' . . . .', '=-=-=-=-', '. . . . '],      // dashes
      ['.:  .:  ', ':|  :|  ', '  .:  .:', '  :|  :|'],      // checker streams
    ],
    success: [
      streams(' .:|#'),
      noiseField('::;+=*#%', 0.65),
      ['^^  ^^  ', '||  ||  ', '::^^::^^', '  ||  ||'],      // double chevrons
      [' /\\  /\\ ', '/::\\/::\\', ':||::||:', '.::..::.'],  // arrows
    ],
  };
  // Timing per strength: how long the front takes to cross the board, and how
  // long each character takes to break down (or build up) when the front hits it.
  const WIPE_TIME = [
    { travel: 280, decay: 240 },   // quiet page change
    { travel: 340, decay: 320 },   // success
    { travel: 360, decay: 360 },   // perfect / boss clear
  ];
  const DECAY_CHARS = '.:,\'`';

  function fillChar(cx, cy, now, level, pat) {
    const s = Math.floor(now * CONFIG.wipeSpeed / (level ? 45 : 75));   // one row up per tick
    if (typeof pat === 'function') return pat(cx, cy + s);
    const row = pat[(((cy + s) % pat.length) + pat.length) % pat.length];
    const ch = row[((cx % row.length) + row.length) % row.length];
    return ch === ' ' ? null : ch;
  }

  // How it works: fronts rise row by row; each board row gets an arrival time.
  // The old screen's front starts first. Partway up, the new screen's front starts
  // behind it, so the two overlap like a cross-fade:
  //   top: old screen still breaking down / middle: scrolling fill / bottom: new screen.
  // Old characters break down when hit (flicker -> noise -> decay dots).
  // New characters build up the reverse way. Empty cells just fill or clear.
  const LIT_HOLD = 220;   // wipe-time the real node stays lit after the front passes the top
  // Each character gets its own random delay and change speed, so swaps don't happen in a neat line.
  const charJitter = (cx, cy, salt) => (hash2(Math.round(cx * 2) + salt, Math.round(cy)) % 1000) / 1000;

  function applyWipe(cells, now) {
    const w = st.wipe;
    const top = w.full ? 0 : BOARD_Y, bot = w.full ? L.hc : BOARD_Y + L.gh;
    const inB = c => c.cy >= top && c.cy < bot;
    const out = cells.filter(c => !inB(c));
    const outT = WIPE_TIME[w.level];
    const inLvl = w.levelIn != null ? w.levelIn : Math.min(w.level, 1);
    const inT = WIPE_TIME[inLvl];
    const eOut = (now - w.t0) * CONFIG.wipeSpeed;                                   // wipe-time, scaled by speed
    const eIn = w.tIn != null ? (now - w.tIn) * CONFIG.wipeSpeed : -Infinity;
    const frac = cy => (bot - 1 - cy) / Math.max(1, bot - top - 1);                   // bottom row first
    const hitOut = w.level ? C.cyan : C.text, hitIn = inLvl ? C.cyan : C.text;
    const fillCol = age => age < 70 ? (w.level ? C.cyan : C.mid) : age < 200 && w.level ? C.mid : C.dim;
    const busy = new Set();   // cells with a character mid-change; no fill drawn there
    const key = (cx, cy) => Math.round(cx) + ',' + Math.round(cy);
    const decayCh = () => DECAY_CHARS[Math.floor(Math.random() * DECAY_CHARS.length)];

    // Old screen: breaks down as its front passes.
    for (const c of w.cells) {
      if (!inB(c)) continue;
      const hit = eOut - frac(Math.round(c.cy)) * outT.travel;          // time since the front got here
      const t = hit - charJitter(c.cx, c.cy, 1) * CONFIG.wipeStagger;      // this character starts a bit later
      const dec = outT.decay * (0.7 + 0.6 * charJitter(c.cx, c.cy, 2));
      if (t < 0) { out.push(c); if (hit >= 0) busy.add(key(c.cx, c.cy)); continue; }   // holding on in the fill
      if (t >= dec) continue;
      const q = t / dec;
      let ch, col;
      if (q < 0.3) { ch = Math.random() < 0.5 ? c.ch : noiseCh(); col = Math.random() < 0.5 ? c.col : hitOut; }
      else if (q < 0.7) { ch = noiseCh(); col = hitOut; }
      else { ch = decayCh(); col = C.mid; }
      const dy = -Math.sin(Math.min(1, q * 2) * Math.PI) * (w.level ? 0.35 : 0.2);   // bumped by the front
      out.push({ ch, cx: c.cx, cy: c.cy + dy, col, own: 'wipe', bold: c.bold });
      busy.add(key(c.cx, c.cy));
    }

    // New screen: builds up as its front passes (once it has started).
    if (w.tIn != null) {
      for (const c of cells) {
        if (!inB(c) || busy.has(key(c.cx, c.cy))) continue;
        const hit = eIn - frac(Math.round(c.cy)) * inT.travel;
        if (hit < 0) continue;                                              // still under the fill
        const t = hit - charJitter(c.cx, c.cy, 3) * CONFIG.wipeStagger;
        const dec = inT.decay * (0.7 + 0.6 * charJitter(c.cx, c.cy, 4));
        if (t < 0) {                                                        // waiting its turn: cycling noise
          out.push({ ch: Math.random() < 0.5 ? decayCh() : noiseCh(), cx: c.cx, cy: c.cy, col: C.mid, own: 'wipe' });
          busy.add(key(c.cx, c.cy));
          continue;
        }
        if (t >= dec) { out.push(c); continue; }
        const q = t / dec;
        let ch, col;
        if (q < 0.25) { ch = decayCh(); col = C.mid; }
        else if (q < 0.65) { ch = noiseCh(); col = hitIn; }
        else { ch = Math.random() < 0.6 ? c.ch : noiseCh(); col = Math.random() < 0.6 ? c.col : hitIn; }
        out.push({ ch, cx: c.cx, cy: c.cy, col, own: 'wipe', bold: c.bold });
        busy.add(key(c.cx, c.cy));
      }
    }

    // Fill between the two fronts, with bright leading lines.
    for (let cy = top; cy < bot; cy++) {
      const tO = eOut - frac(cy) * outT.travel;
      const tI = eIn - frac(cy) * inT.travel;
      for (let cx = 0; cx < L.wc; cx++) {
        if (busy.has(cx + ',' + cy)) continue;
        if (tO < 0) {
          // Old screen region. Sparks just ahead of the front on a success.
          if (w.level && tO > -90 && Math.random() < (w.level >= 2 ? 0.08 : 0.04)) out.push({ ch: noiseCh(), cx, cy, col: C.cyan, own: 'wipe' });
          continue;
        }
        if (tI >= 0) {
          // New screen region; a bright line marks its front.
          if (tI < 60) { const ch = fillChar(cx, cy, now, inLvl, w.pattern); if (ch) out.push({ ch, cx, cy, col: hitIn, own: 'wipe' }); }
          continue;
        }
        const ch = fillChar(cx, cy, now, w.level, w.pattern);
        if (ch) out.push({ ch, cx, cy, col: fillCol(tO), own: 'wipe' });
      }
    }
