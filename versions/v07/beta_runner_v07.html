    // The real node stays lit and is the last thing swallowed.
    if (w.lit && eOut < outT.travel + LIT_HOLD) {
      const ending = eOut > outT.travel + LIT_HOLD - 160;
      for (const c of w.lit) out.push(Object.assign({}, c, { ch: ending && Math.random() < 0.6 ? noiseCh() : c.ch, col: C.cyan, bold: true }));
    }
    return out;
  }

  // Start wiping the board out. Resolves at the hand-off point, partway through,
  // so the caller can open the next screen while the old one is still going.
  async function wipeOut(level = 0, lit = null, quiet = false) {
    const now = performance.now();
    const cells = buildScene(now, false, true);   // whole screen; applyWipe uses the part in its region
    const pattern = pickR(level ? FILLS.success : FILLS.quiet, Math.random);   // new fill each wipe
    st.wipe = { t0: now, level, cells, lit, pattern, tIn: null, full: fullScreen() };
    if (level) { if (quiet) Sound.whoosh(); else Sound.sweep(level); shake(level >= 2 ? 7 : 3, 0.3); if (level >= 2) flash(C.cyan, 0.15, 0.4); }
    else Sound.whoosh();
    // Success wipes hand off later, so the lit node gets its moment.
    const handoff = WIPE_TIME[level].travel * (level ? CONFIG.wipeOverlapWin : CONFIG.wipeOverlap) / CONFIG.wipeSpeed;
    await wait(handoff);
  }

  // Start the new screen's front. Without a wipe in progress, just decode in.
  function wipeIn() {
    const w = st.wipe;
    if (w && w.tIn == null) {
      const now = performance.now();
      w.tIn = now;
      if (fullScreen()) w.full = true;   // full-screen screens wipe the whole screen
      w.levelIn = Math.min(w.level, 1);   // the new screen always builds in calmly
      const outT = WIPE_TIME[w.level], inT = WIPE_TIME[w.levelIn];
      const slack = CONFIG.wipeStagger;   // the last characters can start this much later, and change 1.3x slower
      const outEnd = w.t0 + (outT.travel + Math.max(outT.decay * 1.3 + slack, w.lit ? LIT_HOLD : 0)) / CONFIG.wipeSpeed;
      const inEnd = now + (inT.travel + inT.decay * 1.3 + slack) / CONFIG.wipeSpeed;
      w.dur = inEnd - now;                 // how long until the new screen is fully in
      w.endsAt = Math.max(outEnd, inEnd);
    } else {
      st.wipe = null;
      st.boardStart = performance.now();
    }
  }

  // ---------------- Scene ----------------
  let hits = [];
  let bgs = [];             // background-tinted cells for the current frame
  const pad2 = n => String(n).padStart(2, '0');
  const rule = w => '- '.repeat(Math.ceil(w / 2)).slice(0, w);
  const decodeDelay = (cx, cy) => 40 + ((((Math.round(cx * 2) + 1) * 374761393) ^ ((Math.round(cy * 2) + 1) * 668265263)) >>> 0) % 380;

  // raw = skip transitions (used for snapshots).
  function buildScene(now, collectHits, raw = false) {
    const cells = [];
    const frameBgs = [];
    const put = (cx, cy, str, col, own = 'hud', bold = false) => {
      for (let k = 0; k < str.length; k++) {
        if (str[k] !== ' ') cells.push({ ch: str[k], cx: cx + k, cy, col, own, bold });
      }
    };
    const putC = (cy, str, col, own) => put(Math.floor((L.wc - str.length) / 2), cy, str, col, own);
    const putR = (cy, str, col, own) => put(L.wc - str.length, cy, str, col, own);
    const bg = (cx, cy, w, col, alpha) => frameBgs.push({ cx, cy, w, col, alpha });
    const addHit = (cx, cy, w, h, hit) => {
      if (!collectHits) return;
      let x = L.ox + cx * L.cw, y = L.oy + cy * L.chh, pw = w * L.cw, ph = h * L.chh;
      if (ph < 40) { y -= (40 - ph) / 2; ph = 40; }   // finger-sized tap targets
      if (pw < 40) { x -= (40 - pw) / 2; pw = 40; }
      hits.push(Object.assign({ x, y, w: pw, h: ph }, hit));
    };
    const ctx = { now, put, putC, putR, addHit, bg, cells, collectHits };

    if (st.hideAll) { if (collectHits) bgs = []; return cells; }
    const run = st.run;

    const boardEnd = BOARD_Y + L.gh;
    // Hover / keyboard cursor look, the same everywhere: a background highlight
    // (plus a > marker for the keyboard cursor). Buttons keep their own colors.
    // marker = false where the > would land on neighboring text (tightly packed rows).
    const hl = (x, y, w, h, id, marker = true) => {
      if (st.hoverBtn !== id) return;
      for (let r = 0; r < h; r++) bg(x, y + r, w, C.cyan, st.kbFocus === id ? 0.3 : 0.2);
      if (marker && st.kbFocus === id && x >= 2) put(x - 2, y + Math.floor((h - 1) / 2), '>', C.cyan, 'ui', true);
    };
    ctx.hl = hl;

    // The title gets the whole screen: no header, HUD or tray.
    const versionTag = `beta_runner ${VERSION}`;
    // Footer, bottom row on every screen: [DEV] (when dev access is on) + build version.
    const footerRight = () => {
      const y = L.hc - 1;
      putR(y, versionTag, C.dim);
      if (st.devAccess || st.dev) {
        const label = '[DEV]', x = L.wc - versionTag.length - label.length - 2;
        put(x, y, label, st.dev ? C.cyan : C.mid, 'ui');
        if (st.hoverBtn === 'dev') bg(x, y, label.length, C.cyan, 0.2);
        addHit(x, y, label.length, 1, { kind: 'btn', id: 'dev', onTap: toggleDev, noFocus: true });
      }
    };
    if (!st.dev && st.mode === 'over' && st.overReveal) {
      buildOverReveal(ctx, now);
      footerRight();
    } else if (!st.dev && !st.pause && st.mode === 'panel' && st.panelReveal && !st.panelReveal.done) {
      buildReveal(ctx, now, st.panelReveal, panelLines());
    } else if (fullScreen() || st.dev) {
      buildTextBoard(ctx, st.dev ? devLines() : st.mode === 'title' ? titleLines(now) : panelLines(), { top: 0, h: L.hc });
      footerRight();
    } else {

    // Header
    put(0, 0, 'BETA_RUNNER', C.cyan);
    const headerBtn = (x, label, id, onTap, active) => {
      put(x, 0, label, active ? C.cyan : C.mid, 'ui');
      if (st.hoverBtn === id) bg(x, 0, label.length, C.cyan, 0.2);
      addHit(x, 0, label.length, 1, { kind: 'btn', id, onTap, noFocus: true });
    };
    if (st.mp) headerBtn(12, '[LEAVE]', 'leave', mpLeave, false);
    else if (run && (st.mode === 'map' || st.mode === 'play' || st.mode === 'panel')) headerBtn(12, '[MENU]', 'menu', togglePause, st.pause);
    else put(12, 0, `// ${VERSION}`, C.dim);
    put(0, 1, rule(L.wc), C.dim);

    // HUD
    if (st.mp && st.mp.state && st.mode === 'play') {
      // Up to 6 players, 3 per row: logo + name + integrity. Current turn highlighted.
      const m = st.mp, S = m.state;
      S.order.forEach((id, i) => {
        const mem = mpMember(id), x = (i % 3) * 12, y = 2 + Math.floor(i / 3);
        const out = !S.alive[id], turn = S.turn === id && !S.winner;
        const hp = out ? 'xxxx'.slice(0, S.max) : '#'.repeat(Math.max(0, S.hp[id])) + '-'.repeat(Math.max(0, S.max - S.hp[id]));
        const col = out ? C.dim : mpColor(id), back = mpBg(id);
        if (back && !out) bg(x, y, 12, back, turn ? 1 : 0.6);   // their style's background
        else if (turn) bg(x, y, 12, col, 0.25);
        if (turn && back && Math.floor(now / 400) % 2) bg(x, y, 12, col, 0.18);   // current turn pulses
        put(x, y, logoChar(mem.logo), col, 'hud', true);
        put(x + 1, y, mpShort(id), col, 'hud', id === m.me);
        put(x + 8, y, hp, out ? C.dim : S.hp[id] <= 1 ? C.red : col, 'hud');
      });
    } else if (run && st.mode !== 'title' && st.mode !== 'over') {
      put(0, 2, 'LAYER ', C.mid); put(6, 2, pad2(run.depth), C.bright);
      const cur = Math.max(0, run.integrity);
      const bar = run.maxInt <= 10 ? '#'.repeat(cur) + '-'.repeat(Math.max(0, run.maxInt - cur)) : `${cur}/${run.maxInt}`;
      putR(2, bar, cur <= 1 ? C.red : C.cyan);
      put(L.wc - bar.length - 10, 2, 'INTEGRITY', C.mid);
      if (run.shield) put(L.wc - bar.length - 10 - 3 - String(run.shield).length, 2, `FW${run.shield}`, C.cyan);

      let where = 'OVERWORLD';
      if (st.mode === 'play' && st.corp) {
        const c = st.corp;
        const prog = c.hasBoss ? (st.lv && st.lv.boss ? 'BOSS' : `${c.idx + 1}/${c.counts.length - 1}`) : '';
        where = `${c.def.name} ${prog}`;
      } else if (st.mode === 'panel') where = st.panelTitle || '';
      put(0, 3, where, st.lv && st.lv.boss && st.mode === 'play' ? C.red : C.text);
      putR(3, `CR ${run.credits}`, C.gold);
    } else {
      put(0, 2, `BEST ${pad2(save.best)}   RUNS ${save.runs}   WINS ${save.wins}`, C.mid);
    }
    const ruleCol = st.mp && mpMine() ? (Math.floor(now / 350) % 2 ? C.cyan : C.mid) : C.dim;   // glows on your turn
    put(0, 4, rule(L.wc), ruleCol);

    // Row 5: odds in a layer, seed elsewhere
    if (st.mode === 'play' && st.lv) {
      const cand = candidates().length;
      const open = st.lv.tiles.filter(t => t.state === 'closed').length;
      put(0, 5, 'OPEN ', C.mid); put(5, 5, `${pad2(open)}/${pad2(st.lv.n)}`, C.text);
      if (cand > 0) {
        const pct = Math.round(100 / cand);
        const col = cand === 1 ? C.cyan : pct < 25 ? C.red : C.text;
        const val = `1 IN ${cand}  ${String(pct).padStart(3)}%`;
        putR(5, val, col);
        put(L.wc - val.length - 5, 5, 'ODDS', C.mid);
      }
    }

    if (st.msg) put(0, 6, st.msg.slice(0, Math.floor((now - st.msgT) / 16)), st.msgCol || C.text);

    // Row 7: clock or boss warning
    if (st.mode === 'play' && st.lv) {
      if (st.timer) {
        const w = 20, f = Math.max(0, st.timer.left / st.timer.max);
        const fill = Math.ceil(f * w);
        const low = st.timer.left <= 3;
        put(0, 7, 'CLOCK ', C.mid);
        put(6, 7, '=' .repeat(fill), low ? C.red : C.text);
        put(6 + w, 7, '|', C.dim);
        put(6 + w + 2, 7, `${Math.ceil(st.timer.left)}s`, low ? C.red : C.text);
      } else if (st.mp && st.mp.state) {
        const mine = mpMine(), blink = Math.floor(now / 450) % 2;
        const who = st.mp.state.winner ? '' : mine ? '>> YOUR TURN' : `${blink ? '..' : '  '} ${mpName(st.mp.state.turn).slice(0, 12)}`;
        put(0, 7, who, mine ? C.cyan : mpColor(st.mp.state.turn), 'hud', mine);
        const sp = st.lv.spec;
        if (sp) { const tag = `L${pad2(st.mp.state.layer)} ${CORPS[sp.corp].name.split(' ')[0]}${sp.boss ? ' BOSS' : ''}`; putR(7, tag, sp.boss ? C.red : C.mid); }
      } else if (st.lv.boss && st.corp) {
        put(0, 7, '!! ' + st.corp.def.bossDesc, C.redDim);
      }
    }

    // Board
    if (st.pause) buildTextBoard(ctx, pauseLines());
    else if (!st.hideBoard) {
      if (st.mode === 'play' && st.lv) { buildBoard(ctx); if (st.mp) { mpDrawCursors(ctx); mpTurnBanner(ctx); } }
      else if (st.mode === 'map') buildMap(ctx);
      else buildTextBoard(ctx, panelLines());
    }

    // Tray: mods, items, info
    put(0, boardEnd + 1, rule(L.wc), ruleCol);
    buildTray(ctx, boardEnd + 2);

    // Footer: the run's seed, small and out of the way.
    // Left side of the footer, clipped so it never runs into [DEV] / the version.
    const footRoom = L.wc - versionTag.length - (st.devAccess || st.dev ? 8 : 1) - 1;
    if (run && st.mode !== 'over') put(0, boardEnd + 6, `seed ${run.seed}${run.practice ? ' practice' : ''}`.slice(0, footRoom), C.dim);
    else if (st.mp) put(0, boardEnd + 6, `room ${st.mp.code}`, C.dim);
    footerRight();
    }

    let result = cells;
    if (!raw) {
      if (st.wipe && !st.dev) result = applyWipe(cells, now);
      else {
        // Board characters "decode" in when a screen appears without a wipe.
        const age = now - st.boardStart;
        if (age < 500) {
          for (const c of cells) {
            if (c.cy >= BOARD_Y && c.cy < boardEnd && age < decodeDelay(c.cx, c.cy)) { c.ch = noiseCh(); c.col = C.dim; }
          }
        }
      }
    }
    if (collectHits) bgs = st.wipe && !st.dev ? (st.wipe.full ? [] : frameBgs.filter(b => b.cy < BOARD_Y || b.cy >= boardEnd)) : frameBgs;
    if (collectHits) st.focusables = hits.filter(h => h.kind === 'btn' && !h.noFocus).sort((a, b) => a.y - b.y || a.x - b.x).map(h => ({ id: h.id, onTap: h.onTap }));
    return result;
  }

  // Badge color by rarity.
  const modColor = m => rarityCol(m.rarity);

  // Draws one mod badge: an animated icon character plus its short name.
  // Animation gets fancier with rarity: common = icon only, exotic = full show.
  function drawBadge(put, now, x, y, key, i, { selected = false, dim = false, own = 'tray', noCharges = false } = {}) {
    const m = MODS[key];
    const lvl = RARITY[m.rarity].lvl;
    const base = dim ? C.mid : modColor(m);
    const phase = i * 0.77;
    const icon = m.icon[Math.floor(now / 180 + i * 3) % m.icon.length];
    put(x, y, icon === ' ' ? '.' : icon, selected ? C.bright : base, own, true);
    const charges = noCharges ? null : modCharges(key);
    const label = m.short + (charges != null ? String(charges) : '');
    const anim = lvl === 0 ? 'none' : lvl === 3 ? 'exotic' : m.anim;
    const cyc = [base, C.bright, base, C.mid];
    const rainbow = [C.exotic, C.bright, C.epic, C.rare, C.boss];
    for (let k = 0; k < label.length; k++) {
      let ch = label[k], dy = 0, col = selected ? C.bright : base;
      const t = (now / 1000 + phase) % 4;
      if (anim === 'wave' || anim === 'exotic') { const w = t - k * 0.09; if (w > 0 && w < 0.3) dy = -Math.sin(w / 0.3 * Math.PI) * 0.35; }
      if (anim === 'exotic' && !dim) col = rainbow[Math.floor(now / 160 + k) % rainbow.length];
      if (anim === 'cycle' && !selected && !dim) col = cyc[Math.floor(now / 300 + k) % cyc.length];
      if (anim === 'scramble' && t < 0.2 && Math.random() < 0.5) ch = noiseCh();
      if (anim === 'blink' && t % 2 < 0.12) col = C.bright;
      if (anim === 'spin' && t < 0.4) col = C.bright;
      put(x + 1 + k, y + dy, ch, col, own, lvl >= 4);
    }
    return 1 + label.length;
  }

  // Tray layout (fixed rows, nothing moves so hover stays stable):
  //   mods row, mod info line, item belt, item info line.
  function buildTray(ctx, y) {
    if (st.mp) return mpTray(ctx, y);
    const { now, put, addHit, bg } = ctx;
    const run = st.run;
    const inRun = run && st.mode !== 'title' && st.mode !== 'over';
    if (!inRun) {
      const hint = st.mode === 'over' ? 'R = retry seed   ENTER = new run' : '';
      put(0, y + 1, hint, C.dim);
      return;
    }

    // Mods row
    if (!run.mods.length) put(0, y, 'no mods yet', C.dim);
    let x = 0;
    run.mods.forEach((key, i) => {
      if (x > L.wc - 4) return;
      const active = MODS[key].active;
      const sel = st.selMod === i, hov = st.hoverMod === i;
      const w = drawBadge(put, now, x, y, key, i, { dim: active && !modUsable(key) });
      if (sel || hov) bg(x, y, w, C.cyan, sel ? 0.25 : 0.12);
      addHit(x, y, w, 1, { kind: 'mod', i });
      x += w + 2;
    });

    // Mod info line, right under the mods
    const mi = st.selMod >= 0 ? st.selMod : st.hoverMod;
    if (mi >= 0 && run.mods[mi]) {
      const key = run.mods[mi], m = MODS[key];
      put(0, y + 1, '\\_', C.mid);
      put(2, y + 1, m.short, modColor(m), 'tray', true);
      put(6, y + 1, m.tip, C.text);
      if (m.active) put(7 + m.tip.length + 1, y + 1, modUsable(key) ? '>tap' : '(not now)', modUsable(key) ? C.cyan : C.dim);
    }

    // Item belt: every slot is always shown, empty ones too (no brackets: not tappable).
    const slots = run.beltSlots;
    const step = Math.min(8, Math.floor((L.wc + 1) / slots));
    for (let i = 0; i < slots; i++) {
      const key = run.items[i];
      const ix = i * step;
      if (!key) { put(ix, y + 2, ':  .  :', C.dim, 'tray'); continue; }
      const ok = canUse(key);
      const sel = st.selItem === i, hov = st.hoverItem === i;
      put(ix, y + 2, `[${ITEMS[key].name}]`, ok ? C.bright : C.mid, 'tray');
      if (sel || hov) bg(ix, y + 2, 7, C.cyan, sel ? 0.25 : 0.12);
      addHit(ix, y + 2, 7, 1, { kind: 'item', i });
    }

    // Item info line, right under the belt
    const ii = st.selItem >= 0 ? st.selItem : st.hoverItem;
    if (ii >= 0 && run.items[ii]) {
      const it = ITEMS[run.items[ii]];
      put(0, y + 3, '\\_', C.mid);
      put(2, y + 3, it.name, C.bright, 'tray', true);
      put(3 + it.name.length, y + 3, it.tip, C.text);
      const usable = canUse(it.key);
      put(4 + it.name.length + it.tip.length, y + 3, usable ? '>tap' : '(not now)', usable ? C.cyan : C.dim);
    }
  }

  function buildBoard({ now, put, addHit }) {
    const lv = st.lv;
    const used = new Set();
    const masked = lv.maskAt && now > lv.maskAt;
    lv.tiles.forEach((t, i) => {
      used.add(t.cell);
      const { tx, ty } = tileOrigin(t);
      if (t.state === 'closed') addHit(tx, ty, TILE_W, TILE_H, { kind: 'tile', i });
      if (t.hidden) return;
      const own = 't' + i;
      // A node you hit stays on the board, bold and red.
      if (t.state === 'locked' && t.lockedBy === 'hit') {
        const fresh = now - t.hitAt < 220;   // brief glitch right after the hit
        const glyphCol = t.loaded ? C.gold : C.red;
        let bottom = '+-----+';
        if (t.dist != null) {   // tracer distance, centered in the bottom edge
          const tag = `<${t.dist}>`, left = Math.floor((5 - tag.length) / 2);
          bottom = '+' + ('-'.repeat(left) + tag).padEnd(5, '-') + '+';
        }
        let rows = ['+-----+', ...t.glyph.map(l => '|' + l + '|'), bottom];
        if (fresh) rows = rows.map(r => r.replace(/[^ ]/g, ch => Math.random() < 0.6 ? noiseCh() : ch));
        rows.forEach((r, k) => {
          const isEdge = k === 0 || k === rows.length - 1;
          put(tx, ty + k, r[0], C.red, own, true);
          put(tx + 1, ty + k, r.slice(1, TILE_W - 1), isEdge ? (t.dist != null && !fresh ? C.bright : C.red) : glyphCol, own, true);
          put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], C.red, own, true);
        });
        return;
      }
      if (t.state === 'locked') {
        // Switched off by an item or mod: the whole tile in dim red, with a label
        // saying what did it (and the mod's code, for mods).
        const [word, code] = LOCK_LABEL[t.lockedBy] || ['INERT', ''];
        const mid5 = str => { const l = Math.floor((5 - str.length) / 2); return (' '.repeat(l) + str).padEnd(5); };
        const rows = ['+-----+', '|' + t.glyph[0] + '|', '|' + mid5(word) + '|', '|' + (code ? mid5(code) : t.glyph[2]) + '|', '+-----+'];
        rows.forEach((r, k) => {
          put(tx, ty + k, r[0], C.redDim, own);
          put(tx + 1, ty + k, r.slice(1, TILE_W - 1), k === 2 ? C.text : k === 3 && code ? C.mid : C.redDim, own, k === 2);
          put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], C.redDim, own);
        });
        return;
      }
      let solid = false, fc = C.mid, gc = C.text;
      if (t.loaded) { fc = C.redDim; gc = C.gold; }
      if (t.ruledOut) { fc = C.dim; gc = C.dim; }
      if (t.state === 'safe' || t.state === 'reveal') { solid = true; fc = C.cyan; gc = C.cyan; }
      else if (t.probing || (i === st.hover && !st.busy)) { solid = true; fc = C.bright; if (!t.loaded) gc = C.bright; }
      const edge = solid ? '+-----+' : '+- - -+';
      const side = solid ? '|' : ':';
      const glyph = masked && t.state === 'closed' && !t.loaded ? MASK_GLYPH : t.glyph;
      let rows = [edge, ...glyph.map(l => side + l + side), edge];
      if (t.probing) rows = rows.map(r => r.replace(/[^ ]/g, ch => Math.random() < 0.5 ? noiseCh() : ch));
      rows.forEach((r, k) => {
        const isEdge = k === 0 || k === rows.length - 1;
        put(tx, ty + k, r[0], fc, own);
        put(tx + 1, ty + k, r.slice(1, TILE_W - 1), isEdge ? fc : gc, own);
        put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], fc, own);
      });
      if (st.debug && t.safe && t.state === 'closed') put(tx + TILE_W - 1, ty, '*', C.cyan, own);
      if (st.kbGrid && i === st.hover && !st.busy && Math.floor(now / 280) % 2) {
        for (const [cx, cy] of [[tx, ty], [tx + TILE_W - 1, ty], [tx, ty + TILE_H - 1], [tx + TILE_W - 1, ty + TILE_H - 1]]) put(cx, cy, '#', C.cyan, own, true);
      }
    });
    for (let cell = 0; cell < lv.cols * lv.rows; cell++) {
      if (used.has(cell)) continue;
      const { tx, ty } = tileOrigin({ col: cell % lv.cols, row: Math.floor(cell / lv.cols) });
      put(tx + 3, ty + 2, '.', C.dim, 'dot');
    }
    // AFTERIMAGE: cyan corners where the last layer's real node was.
    if (has('afterimage') && lv.after && lv.after.col < lv.cols && lv.after.row < lv.rows) {
      const { tx, ty } = tileOrigin(lv.after);
      const t = lv.tiles.find(o => o.col === lv.after.col && o.row === lv.after.row);
      if (t && t.state === 'closed' && !t.hidden) {
        put(tx, ty, '+', C.cyan, 'fx', true);
        put(tx + TILE_W - 1, ty + TILE_H - 1, '+', C.cyan, 'fx', true);
      } else if (!t) put(tx + 3, ty + 2, 'o', C.cyan, 'fx');
    }
  }

  // Big boxed primary button. 3 rows, or 4 with a subtitle.
  function drawBox(ctx, y, ln) {
    const { now, put, addHit } = ctx;
    const label = ln.text, sub = ln.sub || '';
    const w = Math.max(ln.minW || 20, Math.max(label.length, sub.length) + 8);
    const x = Math.floor((L.wc - w) / 2);
    const h = sub ? 4 : 3;
    const pulse = (Math.sin(now / 420) + 1) / 2;
    const fcol = ln.disabled ? C.dim : C.cyan;
    const lcol = ln.disabled ? C.dim : pulse > 0.85 ? C.bright : C.cyan;   // a slow, gentle pulse
    if (!ln.disabled && ctx.hl) ctx.hl(x, y, w, h, ln.id);
    let edge = '+' + '='.repeat(w - 2) + '+';
    // Occasional glitch on the frame.
    if (!ln.disabled && ((now / 1000 + y * 0.37) % 3.2) < 0.07) {
      const i = 1 + Math.floor(Math.random() * (w - 2));
      edge = edge.slice(0, i) + noiseCh() + edge.slice(i + 1);
    }
    put(x, y, edge, fcol, 'ui', true);
    for (let r = 1; r < h - 1; r++) { put(x, y + r, '|', fcol, 'ui', true); put(x + w - 1, y + r, '|', fcol, 'ui', true); }
    put(x + Math.floor((w - label.length) / 2), y + 1, label, lcol, 'ui', true);
    if (sub) put(x + Math.floor((w - sub.length) / 2), y + 2, sub, C.mid, 'ui');
    put(x, y + h - 1, '+' + '='.repeat(w - 2) + '+', fcol, 'ui', true);
    if (!ln.disabled) addHit(x, y, w, h, { kind: 'btn', id: ln.id, onTap: ln.onTap });
    return h;
  }

  // Map: final node at the top, start at the bottom. Edges are dotted lines.
  const mapPos = n => {
    const mid = Math.floor(L.wc / 2);
    return { x: n.lane === 1 || n.step === 0 || n.step === MAP_STEPS - 1 ? mid : mid + (n.lane - 1) * 11, y: BOARD_Y + (MAP_STEPS - 1 - n.step) * 3 };
  };

  // Rows of the whole map (top = the final), and a node's row in it.
  const mapRows = () => (MAP_STEPS - 1) * 3 + 1;
  const mapRowOf = n => (MAP_STEPS - 1 - n.step) * 3;

  // The run's map on the results screen: the path you took lit, the rest dim, an X
  // where you were traced. Shows rows top..top+h of the map, at screen row y.
  function drawMapView(ctx, y, ln) {
    const { put } = ctx;
    // A line can be one row (k) of a view viewH tall, so the view can come in row by row.
    const r = ln.r, map = r.map, top = ln.top, k0 = ln.k || 0, h = ln.k != null ? ln.viewH : ln.h;
    y -= k0;   // y is now where the view's first row is
    const mid = Math.floor(L.wc / 2);
    const pos = n => ({ x: n.lane === 1 || n.step === 0 || n.step === MAP_STEPS - 1 ? mid : mid + (n.lane - 1) * 11, row: mapRowOf(n) });
    const lo = ln.k != null ? Math.max(top - 0.01, top + k0 - 0.5) : top - 0.01;
    const hi = ln.k != null ? Math.min(top + h - 0.99, top + k0 + 0.49) : top + h - 0.99;
    const inView = row => row >= lo && row <= hi;
    const onPath = (a, b) => { const i = r.visited.indexOf(a); return i >= 0 && r.visited[i + 1] === b; };
    for (const n of Object.values(map)) {
      for (const id of n.next) {
        const m = map[id], a = pos(n), b = pos(m), path = onPath(n.id, m.id);
        for (let k = 1; k < 6; k++) {
          const f = k / 6, row = a.row + (b.row - a.row) * f;
          if (inView(row)) put(a.x + (b.x - a.x) * f, y + row - top, '·', path ? C.cyan : C.dim, 'board');
        }
      }
    }
    for (const n of Object.values(map)) {
      const p = pos(n);
      if (!inView(p.row)) continue;
      const visited = r.visited.includes(n.id), dead = n.id === r.at;
      const col = dead ? C.red : visited ? C.cyan : n.type === 'final' ? C.redDim : C.dim;
      put(p.x - 1, y + p.row - top, `[${nodeLetter(n)}]`, col, 'board', dead || visited);
      if (dead) put(p.x - 3, y + p.row - top, 'X', C.red, 'board', true);
    }
    // more above / below: arrows in both margins (clear of the nodes)
    const blink = Math.floor(performance.now() / 600) % 2 ? C.mid : C.dim;
    const first = ln.k == null || ln.k === 0, last = ln.k == null || ln.k === h - 1;
    if (top > 0 && first) { put(0, y, '^', blink, 'board'); put(L.wc - 1, y, '^', blink, 'board'); }
    if (top + h < mapRows() && last) { put(0, y + h - 1, 'v', blink, 'board'); put(L.wc - 1, y + h - 1, 'v', blink, 'board'); }
  }

  function buildMap(ctx) {
    const { now, put, addHit, putC } = ctx;
    const run = st.run, map = run.map;
    const avail = new Set(availableNodes());
    const nodes = Object.values(map);

    for (const n of nodes) {
      for (const id of n.next) {
        const m = map[id], a = mapPos(n), b = mapPos(m);
        const vi = run.visited.indexOf(n.id);
        const onPath = vi >= 0 && run.visited[vi + 1] === m.id;
        const live = run.at === n.id && avail.has(m.id);
        const col = onPath ? C.cyan : live ? C.mid : C.dim;
        const steps = 6;
        for (let k = 1; k < steps; k++) {
          const f = k / steps;
          put(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, '·', col, 'map');
        }
      }
    }
    for (const n of nodes) {
      const p = mapPos(n);
      const visited = run.visited.includes(n.id), available = avail.has(n.id);
      const sel = st.mapSel === n.id, hov = st.hoverNode === n.id;
      let col = visited ? C.cyan : C.dim;
      if (available) col = sel ? C.cyan : (Math.floor(now / 500) % 2 ? C.bright : C.text);
      put(p.x - 1, p.y, `[${nodeLetter(n)}]`, col, 'map');
      if (hov) ctx.bg(p.x - 1, p.y, 3, C.cyan, 0.25);
      if (sel) { put(p.x - 3, p.y, '>', C.cyan, 'map'); put(p.x + 3, p.y, '<', C.cyan, 'map'); }
      else if (run.at === n.id) put(p.x - 3, p.y, '@', C.bright, 'map');
      if (available) addHit(p.x - 1, p.y, 3, 1, { kind: 'node', id: n.id });
    }

    // Info panel under the map
    const y0 = BOARD_Y + (MAP_STEPS - 1) * 3 + 1;
    const id = st.mapSel || (avail.has(st.hoverNode) ? st.hoverNode : null);
    if (!id) {
      putC(y0 + 1, 'choose a target.', C.text, 'map');
      putC(y0 + 3, 'P S C M = corps   ! = final', C.dim, 'map');
      putC(y0 + 4, '$ = market  ? = cache  + = repair', C.dim, 'map');
      return;
    }
    const info = nodeInfo(map[id]);
    info.lines.forEach((ln, k) => putC(y0 + k, ln.text, ln.col, 'map'));
    if (st.mapSel) drawBox(ctx, y0 + info.lines.length, { text: info.action, id: 'enter', onTap: () => enterNode(map[st.mapSel]), minW: 18 });
  }

  function nodeInfo(n) {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    if (n.type === 'corp' || n.type === 'final' || n.type === 'start') {
      const d = corpDef(n.corp);
      T(n.tier ? `${d.name} // TIER ${n.tier}` : d.name, n.type === 'final' ? C.red : C.cyan);
      T(d.intel, C.text);
      const rules = corpRules(d, n.tier);
      if (rules) T(rules, C.mid);
      if (d.bossDesc) T(d.bossDesc, C.redDim);
      return { lines, action: 'B R E A C H' };
    }
    if (n.type === 'shop') { T('BLACK MARKET', C.gold); T('items and mods for credits.'); }
    if (n.type === 'cache') { T('DATA CACHE', C.gold); T('loot, then pick a mod.'); }
    if (n.type === 'repair') { T('SAFEHOUSE', C.cyan); T(`heal ${CONFIG.repairAmount}, then pick a mod.`); }
    return { lines, action: 'E N T E R' };
  }

  // Centered text screens: title, panels, help, codex, settings, game over.
  // Line types:
  //   text {text,col}           button {text,id,onTap,disabled,sel,faded}
  //   box {box,text,sub,id}     row of small buttons {row:[...]}
  //   badge {badge}             list row {list,id,onTap,sel,name,right,badge,col,tint}
  //   gap {gap:n} (empty rows)
  // Any line can have `reveal` (index) and `rarity` to pop in one at a time.
  // area: where to center the lines (default: the board area).
  // ---- Text fields. The canvas can't take typing, so a real (invisible) input sits
  // exactly over the field. Tapping it is a real tap on an input, so phones open
  // their keyboard as usual. What you type is drawn by the game.
  //   { field: 'seed', width, value: () => str, clean: str => str, onCommit: str => {} }
  const Field = (() => {
    let el = null, spec = null, cancel = false;
    const editing = id => !!(el && spec && spec.field === id && document.activeElement === el);
    function make() {
      if (el || !document.createElement) return;
      el = document.createElement('input');
      el.type = 'text';
      for (const [k, v] of Object.entries({ autocomplete: 'off', autocorrect: 'off', autocapitalize: 'characters', spellcheck: 'false', enterkeyhint: 'done', 'aria-label': 'text field' })) el.setAttribute(k, v);
      // font-size 16px stops iOS zooming in on focus
      el.style.cssText = 'position:fixed;display:none;opacity:0;border:0;padding:0;margin:0;outline:none;font-size:16px;background:transparent;color:transparent;caret-color:transparent;cursor:text;z-index:2;';
      document.body.appendChild(el);
      el.addEventListener('focus', () => { if (!spec) return; el.value = spec.value(); cancel = false; Sound.init(); Sound.tick(); });
      el.addEventListener('input', () => { if (spec) el.value = spec.clean(el.value); });
      el.addEventListener('keydown', e => {
        e.stopPropagation();   // typing doesn't reach the game's keys
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); cancel = true; el.blur(); }
      });
      el.addEventListener('blur', () => { if (spec && !cancel) spec.onCommit(el.value); cancel = false; });
    }
    // Called every frame: keep the input over the field shown this frame (or hide it).
    function sync() {
      make();
      if (!el) return;
      const r = st.fieldRect;
      if (r && !st.wipe && !st.dev && !st.pause) {
        spec = r.spec;
        Object.assign(el.style, { display: 'block', left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      } else {
        if (document.activeElement === el) { cancel = true; el.blur(); }
        el.style.display = 'none';
      }
    }
    const focus = () => { if (el && el.style.display !== 'none') el.focus(); };
    const text = () => el ? el.value : '';
    const blur = () => { if (el && document.activeElement === el) el.blur(); };   // commits
    return { sync, focus, blur, editing, text };
  })();

  function drawField(ctx, x, y, b) {
    const { now, put, bg, addHit, collectHits } = ctx;
    const editing = Field.editing(b.field), id = 'f_' + b.field;
    let val = editing ? Field.text() : b.value();
    const room = editing ? b.width - 1 : b.width;   // leave a spot for the cursor
    if (val.length > room) val = val.slice(-room);
    put(x, y, '[', editing ? C.cyan : C.mid, 'ui');
    put(x + b.width + 3, y, ']', editing ? C.cyan : C.mid, 'ui');
    put(x + 2, y, val, editing ? C.cyan : C.bright, 'ui', true);
    if (editing) {
      bg(x, y, b.width + 4, C.cyan, 0.18);
      if (Math.floor(now / 500) % 2 === 0) put(x + 2 + val.length, y, '_', C.cyan, 'ui', true);
    } else {
      put(x + 2 + val.length, y, '.'.repeat(Math.max(0, b.width - val.length)), C.dim, 'ui');   // empty spots
      ctx.hl(x, y, b.width + 4, 1, id);
    }
    if (collectHits) {
      st.fieldRect = { spec: b, x: L.ox + x * L.cw, y: L.oy + y * L.chh, w: (b.width + 4) * L.cw, h: L.chh };
      addHit(x, y, b.width + 4, 1, { kind: 'btn', id, onTap: Field.focus });   // keyboard: enter to edit
    }
  }

  function buildTextBoard(ctx, lines, area = null) {
    const { now, put, putC, addHit, bg, cells, collectHits } = ctx;
    const hl = ctx.hl || (() => {});
    const heightOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.tileInfo ? TILE_H : ln.mapView ? ln.h : 1;
    const total = lines.reduce((s, ln) => s + heightOf(ln), 0);
    const top = area ? area.top : BOARD_Y, areaH = area ? area.h : L.gh;
    let y = top + Math.max(0, Math.floor((areaH - total) / 2));
    // Buttons keep their colors; hover/cursor shows as a background (see hl).
    const btnCol = b => b.disabled ? C.dim : b.sel ? C.cyan : b.faded ? C.mid : C.bright;

    for (const ln of lines) {
      const h = heightOf(ln);
      // Escalating reveal: hidden until its turn, then pops with fx scaled by rarity.
      if (ln.reveal != null) {
        const at = st.panelT0 + ln.reveal * CONFIG.revealGap;
        if (now < at) { y += h; continue; }
        const rid = ln.revealId || ('r' + ln.reveal);
        if (collectHits && !st.revealed.has(rid)) { st.revealed.add(rid); popFx(ln, y); }
      }
      const startIdx = cells.length;

      if (ln.box) drawBox(ctx, y, ln);
      else if (ln.tileInfo) {
        // A tile drawn like on the board, with text lines beside it.
        for (let k = 0; k < TILE_H; k++) drawTileRow(put, y + k, ln, k);
      }
      else if (ln.tileRow != null) drawTileRow(put, y, ln.tile, ln.tileRow);   // one row of a tile (for scrolling)
      else if (ln.mapView) drawMapView(ctx, y, ln);
      else if (ln.trayDemo) {
        // One row of a sample tray, drawn like the real one.
        const x0 = Math.floor((L.wc - HELP_W) / 2);
        if (ln.trayDemo === 'rule') put(x0, y, rule(HELP_W), C.dim, 'board');
        if (ln.trayDemo === 'mods') {
          let x = x0;
          ['tracer', 'skimmer', 'burner', 'stash'].forEach((key, i) => { x += drawBadge(put, now, x, y, key, i, { own: 'board', noCharges: true, dim: key === 'burner' }) + 2; });
        }
        if (ln.trayDemo === 'modinfo') {
          put(x0, y, '\\_', C.mid, 'board');
          put(x0 + 2, y, 'TRC', modColor(MODS.tracer), 'board', true);
          put(x0 + 6, y, MODS.tracer.tip, C.text, 'board');
        }
        if (ln.trayDemo === 'items') {
          put(x0, y, '[PURGE]', C.bright, 'board'); put(x0 + 8, y, '[PATCH]', C.bright, 'board');
          put(x0 + 16, y, ':  .  :', C.dim, 'board'); put(x0 + 24, y, ':  .  :', C.dim, 'board');
        }
        if (ln.trayDemo === 'iteminfo') {
          put(x0, y, '\\_', C.mid, 'board');
          put(x0 + 2, y, 'PURGE', C.bright, 'board', true);
          put(x0 + 8, y, ITEMS.purge.tip, C.text, 'board');
          put(x0 + 9 + ITEMS.purge.tip.length, y, '>tap', C.cyan, 'board');
        }
      }
      else if (ln.badge && !ln.list) {
        const m = MODS[ln.badge];
        const w = 1 + m.short.length + 2 + m.name.length;
        const x = Math.floor((L.wc - w) / 2);
        drawBadge(put, now, x, y, ln.badge, 0, { own: 'board', noCharges: true });
        put(x + 1 + m.short.length + 2, y, m.name, modColor(m), 'board', true);
      } else if (ln.list) {
        const LW = 32, x = Math.floor((L.wc - LW) / 2);
        const hov = st.hoverBtn === ln.id;
        if (ln.tint) bg(x, y, LW, ln.tint, ln.sel ? 0.3 : 0.1);
        if (hov) bg(x, y, LW, C.cyan, 0.2);
        // The selection cursor sits outside the row, clear of its background color.
        if (ln.sel) put(x - 2, y, '>', C.cyan, 'ui', true);
        let cx = x + 1;
        if (ln.badge) { drawBadge(put, now, cx, y, ln.badge, 1, { own: 'board', noCharges: true }); cx += 5; }
        put(cx, y, ln.name, ln.faded ? C.mid : (ln.col || C.bright), 'ui', !!ln.sel);
        if (ln.right) put(x + LW - ln.right.length, y, ln.right, ln.faded ? C.dim : (ln.rightCol || C.mid), 'ui');
        if (!ln.disabled) addHit(x, y, LW, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.row) {
        const gap = ln.gap != null ? ln.gap : 2;
        const itemW = b => b.field ? b.width + 4 : b.badge ? (b.plain ? 4 : 6) : b.text.length;
        const w = ln.row.reduce((s, b) => s + itemW(b), 0) + (ln.row.length - 1) * gap;
        let x = Math.floor((L.wc - w) / 2);
        ln.row.forEach((b, bi) => {
          if (b.field) { drawField(ctx, x, y, b); x += itemW(b) + gap; return; }
          if (b.badge && b.plain) { drawBadge(put, now, x, y, b.badge, bi, { own: 'board', noCharges: true }); x += 4 + gap; return; }
          if (b.badge) {
            // A mod as it looks in the tray. On = tinted in its rarity color with bright brackets.
            const mc = modColor(MODS[b.badge]);
            if (b.on) bg(x, y, 6, mc, 0.3);
            if (!b.disabled) hl(x, y, 6, 1, b.id, bi === 0 || gap >= 3);
            put(x, y, '[', b.on ? C.bright : C.dim, 'ui'); put(x + 5, y, ']', b.on ? C.bright : C.dim, 'ui');
            drawBadge(put, now, x + 1, y, b.badge, bi, { own: 'ui', noCharges: true });
            if (!b.disabled) addHit(x, y, 6, 1, { kind: 'btn', id: b.id, onTap: b.onTap });
            x += 6 + gap; return;
          }
          if (!b.id) { put(x, y, b.text, b.col || C.dim, 'board'); x += b.text.length + gap; return; }   // plain text
          if (b.sel) bg(x, y, b.text.length, C.cyan, 0.22);
          // The > marker only where there's room for it: the first item, or wide gaps.
          if (!b.disabled) hl(x, y, b.text.length, 1, b.id, bi === 0 || gap >= 3);
          put(x, y, b.text, btnCol(b), 'ui', !!b.sel);
          if (!b.disabled) addHit(x, y, b.text.length, 1, { kind: 'btn', id: b.id, onTap: b.onTap });
          x += b.text.length + gap;
        });
      } else if (ln.id && ln.invert) {
        // Inverted bar (the "more" rows): text color as the background, background color as the text.
        const x = Math.floor((L.wc - ln.text.length) / 2), hov = st.hoverBtn === ln.id;
        bg(x, y, ln.text.length, hov ? C.cyan : C.text, 1);
        put(x, y, ln.text, C.bg, 'ui', true);
        if (hov && st.kbFocus === ln.id && x >= 2) put(x - 2, y, '>', C.cyan, 'ui', true);
        addHit(x, y, ln.text.length, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.id) {
        const x = Math.floor((L.wc - ln.text.length) / 2);
        if (ln.style) bg(x, y, ln.text.length, ln.style.bg, 1);   // a player's color style
        if (!ln.disabled) hl(x, y, ln.text.length, 1, ln.id);
        put(x, y, ln.text, ln.style ? ln.style.fg : btnCol(ln), 'ui', !!ln.style);
        if (!ln.disabled) addHit(x, y, ln.text.length, 1, { kind: 'btn', id: ln.id, onTap: ln.onTap });
      } else if (ln.text) {
        const x = Math.floor((L.wc - ln.text.length) / 2);
        if (ln.colorAt) {
          // Per-character colors (used by the title art).
          for (let i = 0; i < ln.text.length; i++) if (ln.text[i] !== ' ') put(x + i, y, ln.text[i], ln.colorAt(i), 'board', !!ln.bold);
        } else put(x, y, ln.text, ln.col, 'board', !!ln.bold);
        if (ln.bgCol) bg(x, y, ln.text.length, ln.bgCol, ln.bgA != null ? ln.bgA : 1);
      }

      // Glitch-in right after a reveal.
      if (ln.reveal != null) {
        const age = now - (st.panelT0 + ln.reveal * CONFIG.revealGap);
        if (age < 180) for (let i = startIdx; i < cells.length; i++) if (Math.random() < 0.55) cells[i].ch = noiseCh();
        const gl = st.glow && st.glow[ln.revealId || ('r' + ln.reveal)];
        if (gl) {
          const ga = now - gl.t0;
          if (ga < 1200) for (let r = 0; r < h; r++) bg(0, y + r, L.wc, gl.col, 0.28 * (1 - ga / 1200) * (0.75 + 0.25 * Math.sin(ga / 60)));
        }
      }
      y += h;
    }
  }

  // Row k (0-4) of an info tile: the tile's frame/glyph row, and text line k beside it.
  function drawTileRow(put, y, ln, k) {
    const x = Math.floor((L.wc - 34) / 2);
    const r = k === 0 || k === TILE_H - 1 ? '+- - -+' : ':' + ln.tileInfo[k - 1] + ':';
    const fc = ln.frameCol || C.mid, gc = ln.glyphCol || C.bright;
    put(x, y, r[0], fc, 'board');
    put(x + 1, y, r.slice(1, TILE_W - 1), k === 0 || k === TILE_H - 1 ? fc : gc, 'board');
    put(x + TILE_W - 1, y, r[TILE_W - 1], fc, 'board');
    const t = ln.lines[k];
    if (t) put(x + TILE_W + 2, y, t.text, t.col, 'board', k === 0);
  }

  // Pop effect for an offer appearing: sound + burst scaled by rarity.
  function popFx(ln, y) {
    const lvl = ln.rarity ? RARITY[ln.rarity].lvl : 0;
    // its place among the rare pops on this screen (a row of boss mods climbs)
    const bigStep = lvl >= 3 ? (st.bigPops = (st.bigPops || 0) + 1) - 1 : 0;
    Sound.pop(lvl, bigStep);
    if (ln.seenKey) markSeen(ln.seenKey);
    if (lvl < 2) return;
    const col = rarityCol(ln.rarity);
    const n = [0, 0, 8, 22, 34][lvl];
    const fake = [];
    const cols = lvl === 3 ? [C.exotic, C.epic, C.rare, C.bright] : [col];   // exotic: rainbow
    for (let i = 0; i < n; i++) fake.push({ ch: lvl >= 3 && i % 3 === 0 ? '*' : noiseCh(), x: pxX(rand(L.wc * 0.15, L.wc * 0.85)), y: pxY(y), col: cols[i % cols.length] });
    explode(fake, pxX(L.wc / 2), pxY(y + 0.5), { power: lvl >= 4 ? 0.75 : lvl >= 3 ? 0.6 : 0.35, grav: 0.4, life: lvl >= 3 ? [0.5, 1.1] : [0.3, 0.7] });
    if (lvl >= 3) {
      flash(col, lvl >= 4 ? 0.2 : 0.14, 0.35); shake(lvl >= 4 ? 5 : 3, 0.3);
      st.glow = st.glow || {};
      st.glow[ln.revealId || ('r' + ln.reveal)] = { t0: performance.now(), col };   // the row glows a moment
      // its rarity floats up off the row
      const tag = lvl >= 4 ? '** BOSS **' : '!! EXOTIC !!';
      [...tag].forEach((ch, i) => parts.push({
        mode: 'float', ch, x: pxX(L.wc / 2 + i - tag.length / 2 + 0.5), y: pxY(y - 0.6),
        col: lvl === 3 ? cols[i % cols.length] : col, t: 0, life: 1.4, alpha: 1, rot: 0, scr: 0,
      }));
    }
  }

  // ---------------- Screens built from lines ----------------
  const LOGO = [
    ' ___  ___  _____  _   ',
    '| _ )| __||_   _|/_\\  ',
    '| _ \\| _|   | | / _ \\ ',
    '|___/|___|  |_|/_/ \\_\\',
  ];

  // Title cover art: a face, half human (left) and half circuitry (right).
  // Each row: [left half, divider, right half].
  const COVER = [
    ['            _.-~', '~', '~~~~-._'],
    ["         .-'   .", '|', " [#]  '-."],
    ["       .'    .' ", '|', "  |  +--o'."],
    ['      /     /   ', '|', '  +--+    \\'],
    ['     |   .-""-. ', '|', ' [@@]=+    |'],
    ['     |  ( (o)  )', '|', '  ||  |    |'],
    ["     |   '-..-' ", '|', ' o++o |    |'],
    ['     |     )    ', '|', '  ||  +=   |'],
    ['     |    (_    ', '|', ' ++==++    |'],
    ['      \\    __   ', '|', ' [====]   /'],
    ["       \\  '--'  ", '|', '   ||    /'],
    ["        '.      ", '|', "  o--  .'"],
    ["          '-._  ", '|', "   _.-'"],
    ["              '-", '~', "-'"],
  ];
  const COVER_W = 16 + 1 + 14;

  // Cover art lines with a little life: the eye blinks, the circuit eye scans,
  // a scanline drifts down, and now and then a row glitches sideways.
  function coverLines(now) {
    const t = now / 1000;
    const blink = (t % 4.3) < 0.14;
    const scanEye = ['@@', '@ ', ' @', '@@'][Math.floor(t * 3) % 4];
    const scanRow = Math.floor(now / 140) % (COVER.length + 6);
    const glitchRow = (t % 3.1) < 0.12 ? Math.floor(t * 7) % COVER.length : -1;
    return COVER.map(([l, mid, r], row) => {
      let left = l.padEnd(16), right = r.padEnd(14);
      if (blink) left = left.replace('(o)', '(-)');
      right = right.replace('@@', scanEye);
      let text = left + mid + right;
      if (row === glitchRow) text = (' ' + text.slice(0, -1)).replace(/[^ ]/g, ch => Math.random() < 0.25 ? noiseCh() : ch);
      const lit = row === scanRow;
      return {
        text, bold: lit,
        colorAt: i => lit ? C.bright : i < 16 ? C.text : i === 16 ? C.dim : C.cyan,
      };
    });
  }

  function titleLines(now) {
    const lines = [];
    const T = (text, col = C.text, extra = {}) => lines.push(Object.assign({ text, col }, extra));
    lines.push(...coverLines(now));
    T('');
    // Logo with an occasional glitch.
    LOGO.forEach((l, i) => {
      let s = l;
      if (((now / 1000 + i * 0.9) % 4.5) < 0.09) s = s.replace(/[^ ]/g, ch => Math.random() < 0.3 ? noiseCh() : ch);
      T(s, C.cyan, { bold: true });
    });
    T('R   U   N   N   E   R', C.bright, { bold: true });
    T('network intrusion // prototype', C.dim);
    T('');
    lines.push({ box: true, text: 'J A C K   I N', sub: '- start a run -', id: 'start', onTap: jackIn, minW: 26 });
    T('');
    lines.push({ row: [
      { text: '[ HOW TO PLAY ]', id: 'help', onTap: () => swapTo(openHelp) },
      { text: '[ CODEX ]', id: 'codex', onTap: () => swapTo(openCodex) },
    ] });
    lines.push({ row: [
      { text: '[ SETTINGS ]', id: 'settings', onTap: () => swapTo(openSettings) },
      { text: '[ MULTIPLAYER ]', id: 'mp', onTap: () => swapTo(openMultiplayer) },
    ] });
    T('');
    { const prof = profile(); lines.push({ text: `[ ${logoMark(prof.logo)} ${prof.name} ]`, id: 'profile', style: styleOf(prof.style), onTap: () => swapTo(openProfile) }); }
    T(`best ${pad2(save.best)}   runs ${save.runs}   wins ${save.wins}`, C.mid);
    // Seed: tap to roll a new one.
    lines.push({ gap: 1, row: [
      { text: 'seed' },
      { text: `[${st.seed.slice(0, 10)}]`, id: 'seed', onTap: rerollSeed },
      ...(st.practice ? [{ text: 'practice', col: C.redDim }] : []),
    ] });
    return lines;
  }

  // After the collapse, the screen is empty. CONNECTION TERMINATED types in at the
  // middle and sits a second; then the results come in one line at a time below it,
  // pushing the block up until it's the full, centered results screen.
  const REVEAL = { type: 35, hold: 1000, gap: 170, mapGap: 45 };   // ms; map rows come in faster
  function buildOverReveal(ctx, now) {
    const all = overLines().flatMap(ln => ln.mapView ? Array.from({ length: ln.h }, (_, k) => Object.assign({}, ln, { h: 1, k, viewH: ln.h })) : [ln]);
    buildReveal(ctx, now, st.overReveal, all);
  }
  // Show `all` building up: line 0 types in at the middle and holds, then the rest come
  // in one at a time below it, the block gliding up to stay centered. Lines with an
  // offer `reveal` index wait for their pop (st.panelT0 is set from the first one).
  function buildReveal(ctx, now, rv, all) {
    const title = all[0].text;
    const typed = clamp(Math.floor((now - rv.t0) / REVEAL.type), 0, title.length);
    // when each line shows up (blank lines come with the next one)
    let k = 1, t = rv.t0 + title.length * REVEAL.type + REVEAL.hold, firstPop = null;
    for (let i = 1; i < all.length; i++) {
      if (all[i].reveal != null) {
        if (firstPop == null) firstPop = rv.firstPop || (rv.firstPop = t);
        t = Math.max(t, firstPop + all[i].reveal * CONFIG.revealGap);
      }
      if (now < t) break;
      k = i + 1;
      if (all[i].mapView) t += REVEAL.mapGap;
      else if (all[i].text || all[i].box || all[i].row || all[i].list) t += REVEAL.gap;
    }
    if (rv.firstPop && st.panelT0 === Infinity) st.panelT0 = rv.firstPop;
    if (now < rv.t0) k = 0;
    const vis = all.slice(0, k);
    if (vis.length && typed < title.length) {
      const cursor = Math.floor(now / 250) % 2 ? '_' : ' ';
      vis[0] = Object.assign({}, vis[0], { text: (title.slice(0, typed) + cursor).padEnd(title.length) });
    }
    const hOf = ln => ln.box ? (ln.sub ? 4 : 3) : ln.tileInfo ? TILE_H : ln.mapView ? ln.h : 1;
    const H = vis.reduce((a, ln) => a + hOf(ln), 0);
    // glide toward the centered spot (so new lines push the block up smoothly);
    // 'board' centers like a normal panel, so the finished screen lines up exactly
    const target = rv.center === 'board' ? BOARD_Y + Math.max(0, Math.floor((L.gh - H) / 2)) : (L.hc - Math.max(1, H)) / 2;
    if (rv.y == null) rv.y = target;
    else rv.y += (target - rv.y) * Math.min(1, (now - rv.lt) / 1000 * 9);
    rv.lt = now;
    if (vis.length) buildTextBoard(ctx, vis, { top: rv.y, h: H });
    if (ctx.collectHits) {
      if (typed > rv.typed) { rv.typed = typed; Sound.tick(); }
      if (k > rv.shown) {
        rv.shown = k;
        const ln = all[k - 1];
        if (k > 1 && ln.mapView) Sound.tick();
        else if (k > 1 && ln.reveal != null) { /* its offer pop plays */ }
        else if (k > 1 && (ln.text || ln.box || ln.row || ln.list)) rv.sound === 'climb' ? Sound.climb(rv.climbs = (rv.climbs || 0) + 1) : Sound.ui();
      }
      // all in and settled: hand back to the normal screen (header, HUD, tray return)
      if (k === all.length && now > t + 350 && Math.abs(rv.y - target) < 0.05 && rv.center === 'board' && !rv.done) {
        rv.done = true; Sound.ui();
        if (rv.msg) setMsg(rv.msg.text, rv.msg.col);   // the header's line types in as it comes back
      }
    }
  }

  function overLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const r = st.result;
    if (r.win) {
      // An unlocked padlock.
      for (const l of ['     .---.     ', '    /  _  \\    ', '    | | | |    ', '    | |        ', ' +===========+ ', ' |  R O O T  | ', ' +===========+ ']) {
        lines.push({ text: l, col: C.gold, bold: true });
      }
      T('');
      lines.push({ text: 'ROOT ACCESS GRANTED', col: C.cyan, bold: true });
      { const prof = profile(); T(`runner ${logoMark(prof.logo)} ${prof.name}`, C.mid); }
      T('OMNI//CORE is yours.', C.text);
      T('');
      T(`layers ${pad2(r.depth)}  corps ${r.corps}  cr ${r.earned}`, C.bright);
      if (r.newBest) T('** new best **', C.cyan);
      else T(`best ${pad2(save.best)}   seed ${r.seed}`, C.mid);
      if (r.practice) T('practice run: not scored', C.redDim);
      T('');
      lines.push({ box: true, text: 'N E W   R U N', id: 'new', onTap: newRun, minW: 24 });
      lines.push({ text: '[ RETRY SEED ]', id: 'retry', onTap: retry });
      lines.push({ text: '[ BACK ]', id: 'title', onTap: () => swapTo(showTitle) });
      return lines;
    }
    T('CONNECTION TERMINATED', C.red);
    { const prof = profile(), sty = styleOf(prof.style);   // your persona, in your colors
      lines.push({ text: ` ${logoMark(prof.logo)} ${prof.name} `, col: sty.fg, bgCol: sty.bg, bold: true }); }
    if (r.diedAt) T(`traced in ${r.diedAt}`, C.redDim);
    T('');
    { const st1 = `layers ${pad2(r.depth)}   corps ${r.corps}   cr ${r.earned}`;
      lines.push({ text: st1, colorAt: i => /\d/.test(st1[i]) ? C.bright : C.mid }); }
    if (r.newBest) T('** new best **', C.cyan);
    else T(`best ${pad2(save.best)}   seed ${r.seed}`, C.mid);
    if (r.practice) T('practice run: not scored', C.redDim);
    // corps breached, by letter
    { const marks = r.breached.map(k => `[${corpDef(k).letter}]`).join(' ');
      const txt = `breached ${marks || 'none'}`;
      lines.push({ text: txt, colorAt: i => i < 9 ? C.mid : marks ? C.cyan : C.dim }); }
    T('');
    // mods, drawn like the tray
    if (r.mods.length) {
      for (let i = 0; i < r.mods.length; i += 6) lines.push({ gap: 2, row: r.mods.slice(i, i + 6).map(k => ({ badge: k, plain: true })) });
    } else T('no mods: a naked run', C.dim);
    lines.push(r.items.length ? { gap: 1, row: r.items.map(k => ({ text: `[${ITEMS[k].name}]`, col: C.bright })) } : { text: 'no items', col: C.dim });
    T('');
    // the map, with the path you took (scrolls when it's taller than the space left)
    const rest = 1 + 3 + 1 + 1;   // gap, NEW RUN box, retry, back
    const used = lines.reduce((a, ln) => a + (ln.box ? 3 : 1), 0);
    const view = clamp(L.hc - 2 - used - rest, 5, mapRows());
    const om = st.overMap || (st.overMap = { top: null });
    const atRow = mapRowOf(r.map[r.at]);
    if (om.top == null) om.top = atRow - Math.floor(view / 2);
    om.top = clamp(om.top, 0, mapRows() - view);
    om.view = view;
    lines.push({ mapView: true, h: view, top: om.top, r });
    T('');
    lines.push({ box: true, text: 'N E W   R U N', id: 'new', onTap: newRun, minW: 24 });
    lines.push({ text: '[ RETRY SEED ]', id: 'retry', onTap: retry });
    lines.push({ text: '[ BACK ]', id: 'title', onTap: () => swapTo(showTitle) });
    return lines;
  }

  function panelLines() {
    const now = performance.now();
    if (st.mode === 'title') return titleLines(now);
    if (st.mode === 'over' && st.result) return overLines();
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    if (st.mode === 'panel' && st.panelFn) st.panelFn(T, B, ln => lines.push(ln), lines);
    return lines;
  }

  // ---------------- Render loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateParts(dt);
    updateTimer(dt);
    stepPaletteFade(now);
    if (st.mp) { mpWatchdog(now); mpClockTick(now); }
    if (st.wipe && st.wipe.endsAt && now > st.wipe.endsAt) st.wipe = null;
    st.fieldRect = null;
    render(now);
    Field.sync();
    requestAnimationFrame(frame);
  }

  function render(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.bg;
    g.fillRect(0, 0, W, H);
    const sk = (now - shakeFx.t0) / 1000;
    if (sk < shakeFx.dur) {
      const a = shakeFx.amp * (1 - sk / shakeFx.dur);
      g.translate(rand(-a, a), rand(-a, a));
    }
    hits = [];
    const cells = buildScene(now, true);
    for (const b of bgs) {
      g.globalAlpha = b.alpha;
      g.fillStyle = b.col;
      g.fillRect(L.ox + b.cx * L.cw, L.oy + b.cy * L.chh, b.w * L.cw, L.chh);
    }
    g.globalAlpha = 1;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const bold of [false, true]) {
      g.font = `${bold ? DRAW_FONT.bold : DRAW_FONT.weight} ${L.fs * DRAW_FONT.scale}px ${DRAW_FONT.family}`;
      for (const c of cells) {
        if (!!c.bold !== bold) continue;
        g.fillStyle = c.col;
        g.fillText(c.ch, pxX(c.cx), pxY(c.cy));
      }
    }
    g.font = `${DRAW_FONT.weight} ${L.fs * DRAW_FONT.scale}px ${DRAW_FONT.family}`;
    for (const p of parts) {
      if (p.t < 0) continue;
      g.globalAlpha = Math.max(0, p.alpha);
      g.fillStyle = p.col;
      if (p.rot) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillText(p.ch, 0, 0); g.restore(); }
      else g.fillText(p.ch, p.x, p.y);
    }
    g.globalAlpha = 1;
    const fk = (now - flashFx.t0) / 1000;
    if (fk < flashFx.dur) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalAlpha = flashFx.a * (1 - fk / flashFx.dur);
      g.fillStyle = flashFx.col;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }
  }

  // ---------------- Helpers ----------------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function setMsg(msg, col = C.text) { st.msg = msg; st.msgCol = col; st.msgT = performance.now(); }
  const candidates = () => st.lv ? st.lv.tiles.filter(t => t.state === 'closed' && !t.loaded && !t.ruledOut) : [];

  function availableNodes() {
    const run = st.run;
    if (!run) return [];
    // Dev "free travel": every node except the one you're on.
    if (st.freeTravel) return Object.keys(run.map).filter(id => id !== run.at && id !== '0:1');
    return run.at ? run.map[run.at].next : ['0:1'];
  }

  function showBoard(mode) {
    st.mode = mode;
    st.selItem = -1; st.selMod = -1;
    st.kbFocus = null; st.keyHandler = null; st.scroll = null;
    st.hideBoard = false; st.hideAll = false;
    computeLayout();
    wipeIn();
  }

  // Wipe the board out, then open the next screen (which wipes in).
  async function swapTo(openFn, level = 0) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(level);
    st.transitioning = false;
    openFn();
  }

  // ---------------- Run flow ----------------
  function showTitle() {
    st.run = null; st.corp = null; st.lv = null; st.timer = null; st.dying = false;
    st.panelFn = null;
    scenePalette(null);
    showBoard('title');
    st.busy = false;
    setMsg('> link ready_');
  }

  function rerollSeed() {
    st.seed = newSeed();
    st.practice = false;
    Sound.ui();
    setMsg('> new seed rolled.');
  }

  async function startRun(seed, practice) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(0);
    st.seed = seed; st.practice = practice;
    st.run = {
      seed, practice,
      map: genMap(seed),
      finalTell: pickR(['corner', 'mark', 'mirror'], rngFor(seed, 'final')),
      at: '0:1', visited: ['0:1'],
      integrity: CONFIG.startIntegrity, maxInt: CONFIG.startIntegrity, shield: 0,
      credits: 0, earned: 0, items: CONFIG.startItems.slice(), mods: [],
      beltSlots: CONFIG.beltSlots, charges: {}, reroutes: 0,
      depth: 0, corps: 0,
    };
    for (const k of CONFIG.startItems) markSeen(k);
    st.result = null;
    st.transitioning = false;
    // Straight into the public net; the map comes after.
    startCorp(st.run.map['0:1']);
  }

  function toMap() {
    st.corp = null; st.lv = null; st.timer = null;
    scenePalette(null);
    st.mapSel = null; st.hoverNode = null;
    showBoard('map');
    st.busy = false;
    setMsg('> choose your next target.');
  }

  function selectNode(id) {
    if (st.transitioning || !availableNodes().includes(id)) return;
    if (st.mapSel === id) return enterNode(st.run.map[id]);
    st.mapSel = id;
    Sound.ui();
  }

  async function enterNode(node, warp = false) {
    if (st.transitioning || !node || (!warp && !availableNodes().includes(node.id))) return;
    st.transitioning = true;
    const run = st.run;
    await wipeOut(0);
    run.at = node.id;
    run.visited.push(node.id);
    st.transitioning = false;
    if (node.type === 'shop') return openShop(node);
    if (node.type === 'cache') return openCache(node);
    if (node.type === 'repair') return openRepair(node);
    startCorp(node);
  }

  async function startCorp(node, startIdx = 0) {
    const def = corpDef(node.corp);
    const t = node.tier;
    const counts = node.type === 'start' ? [1] : [t + 1, t + 2, t + 3, t + 4];
    let tell = node.type === 'final' ? st.run.finalTell : def.tell;
    if (tell === 'mirror' && t >= 2) tell = 'vmirror';   // deeper Mirrorlines mirror top-bottom
    let mark = null;
    if (tell === 'mark') {
      const level = clamp(t, 1, 3);
      mark = { level, glyph: level === 1 ? pickR(MOTIFS, rngFor(st.run.seed, 'sigil', node.id)) : null };
    }
    st.corp = {
      def, node, tier: t, idx: Math.min(startIdx, counts.length - 1), counts,
      hasBoss: node.type !== 'start',
      tell, mark,
      timer: corpTimer(def, t), pay: corpPay(def, t),
      prevSafe: null,
    };
    // Corps use their own colors; the public net uses the player's.
    scenePalette(node.type === 'start' ? null : def.key);
    // A short boot-up screen first (skipped for dev boss jumps).
    if (st.corp.hasBoss) markSeen('corp_' + def.key);   // codex: corp found
    if (st.corp.hasBoss && startIdx === 0) await corpIntro();
    enterLayer();
  }

  // Corp intro: art, name, quote, a few boot lines. Tap or any key skips.
  async function corpIntro() {
    const c = st.corp, def = c.def;
    const art = CORP_ART[def.key] || [];
    const artW = Math.max(0, ...art.map(l => l.length));
    const rules = corpRules(def, c.tier);
    const boot = [
      [`> connecting to ${def.name.toLowerCase().replace(/[^a-z/]+/g, '.')}`, C.mid],
      ['> handshake ............... ok', C.mid],
      [`> mapping ${c.counts.length - 1} layers + boss .... ok`, C.mid],
      ['> ICE detected ............ yes', C.red],
    ];
    st.intro = { skip: false };
    openPanel(def.name, (T, B, X) => {
      for (const l of art) T(l.padEnd(artW), C.cyan);
      T('');
      X({ text: def.name, col: C.bright, bold: true });
      T(c.tier ? `TIER ${c.tier}` : '', C.mid);
      T(def.intel, C.text);
      T(rules, C.mid);
      T('');
      boot.forEach(([text, col], i) => X({ text: text.padEnd(31), col, reveal: i, revealId: 'boot' + i }));
      T('');
      T(Math.floor(performance.now() / 500) % 2 ? 'tap to skip' : '', C.dim);
    }, `> breaching ${def.name.toLowerCase()}...`);
    st.busy = true;
    const t0 = performance.now();
    const hold = CONFIG.introHold + (st.wipe ? st.wipe.dur : 0);
    while (performance.now() - t0 < hold && !st.intro.skip) await wait(40);
    st.intro = null;
    await wipeOut(0);
  }

  async function enterLayer() {
    const c = st.corp, run = st.run;
    const n = c.counts[c.idx];
    const boss = c.hasBoss && c.idx === c.counts.length - 1;
    let tell = c.tell;
    if (boss && c.def.bossTell) tell = c.def.bossTell;
    const lv = genLayer({ seed: run.seed, nodeId: c.node.id, idx: c.idx, n, tell, prevSafe: c.prevSafe, loot: !boss && c.hasBoss, mark: c.mark });
    lv.after = c.prevSafe;       // last layer's real node, for AFTERIMAGE
    c.prevSafe = lv.safeCell;
    lv.payCut = 0; lv.ocCount = 0;
    lv.boss = boss;
    lv.misses = 0;
    lv.split = false;
    lv.dmg = boss && c.def.bossDmg ? c.def.bossDmg : 1;
    if (boss && c.def.bossFlash) lv.maskAt = performance.now() + 450 + CONFIG.maskDelayMs;
    st.lv = lv;
    st.hover = -1;
    run.depth++;
    // Codex: every glyph that shows up on a board counts as found.
    for (const t of lv.tiles) {
      const gi = MOTIFS.indexOf(t.glyph);
      if (gi >= 0) markSeen('g' + gi);
      if (t.loaded) markSeen('gloot');
      if (t.marked) markSeen('gsig');
    }
    if (n === 1) markSeen('gjack');
    if (lv.maskAt) markSeen('gmask');
    st.timer = makeTimer();
    showBoard('play');
    st.busy = true;
    if (boss) { Sound.boss(); shake(5, 0.5); setMsg(`> BOSS LAYER. ${n} nodes.`, C.red); }
    else { Sound.layer(run.depth); setMsg(n === 1 ? '> one node. it is real. jack in.' : `> ${n} nodes. one is real.`); }
    await wait(480);
    // Layer-start mods, each locks at most one ICE node.
    const iceWhere = f => lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed' && f(t));
    const starts = [
      ['sniffer', () => true],
      ['corners', t => (t.col === 0 || t.col === lv.cols - 1) && (t.row === 0 || t.row === lv.rows - 1)],
      ['sigscan', t => t.marked],
    ];
    for (const [key, f] of starts) {
      if (!has(key) || n < 2) continue;
      const opts = iceWhere(f);
      if (!opts.length) continue;
      lockTile(pickR(opts, rngFor(run.seed, key, c.node.id, c.idx)), C.mid, key);
      setMsg(`> ${MODS[key].name.toLowerCase()}: 1 ICE locked.`, C.mid);
      await wait(250);
    }
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // Clock for this layer: the corp's own, or one added by OVERCLOCK.
  function makeTimer() {
    const c = st.corp, lv = st.lv;
    let max = c.timer || (has('overclock') && c.hasBoss ? CONFIG.overclockClock : 0);
    if (!max) return null;
    if (lv && lv.boss && c.def.bossShrink) max = Math.max(3, max - 3 * lv.misses);
    if (has('coolant')) max += 3;
    return { max, left: max, lastSec: max, ocNext: CONFIG.overclockStart };
  }

  // Lock a trap tile without damage (sniffer, purge).
  // source: what locked it (purge, burner, sniffer, corners, sigscan, echo, overclock).
  function lockTile(t, col, source = 'purge') {
    const i = st.lv.tiles.indexOf(t);
    const { x, y } = tileCenter(t);
    explode(snapshot(c => c.own === 't' + i), x, y, { col, power: 0.6 });
    t.state = 'locked';
    t.lockedBy = source;
    Sound.shield();
  }

  function updateTimer(dt) {
    const tm = st.timer;
    if (!tm || st.mode !== 'play' || st.busy || st.transitioning || st.dev || st.pause) return;
    tm.left -= dt;
    const sec = Math.ceil(tm.left);
    if (sec < tm.lastSec) { tm.lastSec = sec; if (sec <= 3 && sec > 0) Sound.clock(); }
    // OVERCLOCK: near the end, purge ICE one by one; each purge cuts the payout.
    const lv = st.lv;
    if (has('overclock') && tm.left <= tm.ocNext && tm.left > 0.5 && lv.ocCount < 3) {
      tm.ocNext -= 2;
      const opts = lv.tiles.filter(t => !t.safe && t.state === 'closed');
      if (opts.length > 0 && candidates().length > 1) {
        lockTile(opts[Math.floor(Math.random() * opts.length)], C.mid, 'overclock');
        lv.ocCount++;
        lv.payCut = Math.min(0.9, lv.payCut + CONFIG.overclockCut);
        setMsg(`> overclock: purged 1. pay -${Math.round(lv.payCut * 100)}%`, C.mid);
      }
    }
    if (tm.left <= 0) {
      tm.left = 0;
      const opts = candidates().length ? candidates() : st.lv.tiles.filter(t => t.state === 'closed');
      const t = opts[Math.floor(Math.random() * opts.length)];
      setMsg('> clock ran out.', C.red);
      if (t) pick(st.lv.tiles.indexOf(t));
    }
  }

  function resetTimer() {
    if (!st.timer) return;
    st.timer = makeTimer();
  }

  async function pick(i) {
    if (st.mp) return mpTap(i);
    if (st.mode !== 'play' || st.busy) return;
    const t = st.lv.tiles[i];
    if (!t || t.state !== 'closed') return;
    st.busy = true;
    st.selItem = -1; st.selMod = -1;
    st.lv.fast = st.lv.readyAt != null && performance.now() - st.lv.readyAt < CONFIG.fastpayMs;
    t.probing = true;
    Sound.probe();
    setMsg('> probing...', C.mid);
    await wait(300);
    t.probing = false;
    if (t.safe) await onSafe(t);
    else await onTrap(t, i);
  }

  function payFor(lv) {
    const c = st.corp;
    let base = 4 + 2 * lv.n;
    if (lv.boss) base *= 3;
    let mult = c.pay || 1;
    if (lv.misses === 0 && lv.n > 1) mult *= 1 + 0.5 * (lv.n - 1);
    if (has('skimmer')) mult *= 1.5;
    if (has('fastpay') && lv.fast) mult *= 1.5;
    mult *= 1 - (lv.payCut || 0);
    return lv.n === 1 ? 0 : Math.round(base * mult);
  }

  async function onSafe(t) {
    const run = st.run, lv = st.lv, c = st.corp;
    t.state = 'safe';
    const perfect = lv.misses === 0 && lv.n > 1;
    if (lv.n > 1) { c.scored = (c.scored || 0) + 1; if (perfect) { c.perfects = (c.perfects || 0) + 1; run.perfects = (run.perfects || 0) + 1; } }
    const pay = payFor(lv);
    run.credits += pay; run.earned += pay;
    let healed = false;
    if (perfect && run.integrity < run.maxInt) { run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.perfectHeal); healed = true; }
    if (!lv.boss) Sound.safe();
    flash(C.cyan, 0.12, 0.3);
    let msg = perfect ? '> perfect.' : '> access granted.';
    if (pay) msg += ` +${pay}cr`;
    if (healed) msg += ' +1 int';
    setMsg(msg, C.cyan);
    const land = lv.boss ? Sound.bossWin() : 0;   // boss: the fanfare replaces the safe sound (s until it lands)
    await wait(380);
    const i = lv.tiles.indexOf(t);
    const lit = buildScene(performance.now(), false, true).filter(cl => cl.own === 't' + i);
    if (lv.boss) {
      // The layer floats away and the screen goes empty as the fanfare lands;
      // then CORP BREACHED types in and the reward screen builds up under it.
      flash(C.cyan, 0.2, 0.5); shake(5, 0.4);
      // time it so the screen is empty right as the fanfare lands (CORP BREACHED types on the hit)
      const full = (RISE.wave + RISE.jitter + RISE.rise) * 1000;
      const ms = riseOut(new Set(lit.map(cl => cl.cx + ',' + cl.cy)), clamp((land * 1000 - 380 - 100) / full, 0.5, 1.3));
      st.hideAll = true; st.wipe = null;
      await wait(ms);
      st.breachReveal = true;
    } else {
      // Success wipe: the real node stays lit while the fill rises. Bigger for perfect.
      await wipeOut(perfect ? 2 : 1, lit);
    }
    c.idx++;
    if (c.idx < c.counts.length) return enterLayer();
    // Corp finished
    if (c.node.type === 'start') return openStartReward(c.node);
    run.corps++;
    corpStat(c.def.key).breached++; persist();   // codex record
    if (c.node.type === 'final') return endRun(true);
    openReward(c.node);
  }

  async function onTrap(t, i) {
    const run = st.run, lv = st.lv;
    lv.misses++;
    run.iceHits = (run.iceHits || 0) + 1;
    if (st.corp) st.corp.ice = (st.corp.ice || 0) + 1;
    t.state = 'locked';
    t.lockedBy = 'hit';
    t.hitAt = performance.now();
    let msg;
    if (st.god) {
      Sound.shield();
      msg = '> ICE. god mode: no damage.';
    } else if (t.loaded && has('forgery')) {
      Sound.shield();
      msg = '> $ node. forgery: no damage.';
    } else if (has('bulwark') && !st.corp.bulwarkUsed) {
      st.corp.bulwarkUsed = true;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. bulwark blocked it.';
    } else if (run.shield > 0) {
      run.shield--;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. firewall absorbed it.';
    } else {
      run.integrity -= lv.dmg;
      Sound.trap();
      shake(9);
      flash(C.red, 0.18, 0.35);
      msg = run.integrity > 0 ? `> ICE. integrity -${lv.dmg}.` : '> ICE. integrity gone.';
    }
    if (t.loaded) msg += ' ' + grantLoot(rngFor(run.seed, 'loot', st.corp.node.id, st.corp.idx), st.corp.tier);
    if (has('tracer')) {
      const s = lv.tiles[lv.safe];
      t.dist = Math.abs(s.col - t.col) + Math.abs(s.row - t.row);
    }
    setMsg(msg, t.loaded ? C.gold : C.red);
    await wait(450);
    if (run.integrity <= 0) return die();
    // ECHO: the mirror-image node locks too, if it's ICE.
    if (has('echo')) {
      const mc = lv.cols - 1 - t.col;
      const m = lv.tiles.find(o => o.col === mc && o.row === t.row && o !== t && o.state === 'closed' && !o.safe);
      if (m) { lockTile(m, C.mid, 'echo'); await wait(200); }
    }
    resetTimer();
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // Credits or an item. Returns a short text for the message line.
  function grantLoot(r, tier) {
    const run = st.run;
    Sound.loot();
    if (r() < 0.4 && run.items.length < run.beltSlots) {
      const key = pickR(Object.keys(ITEMS), r);
      run.items.push(key);
      markSeen(key);
      return `got ${ITEMS[key].name}.`;
    }
    const cr = Math.round(12 + tier * 8 + r() * 12);
    run.credits += cr; run.earned += cr;
    return `+${cr}cr`;
  }

  async function die() {
    if (st.corp && st.corp.hasBoss) { corpStat(st.corp.def.key).lost++; persist(); }   // codex record
    st.busy = true;
    st.timer = null;
    const safeTile = st.lv.tiles[st.lv.safe];
    if (safeTile.state === 'closed') safeTile.state = 'reveal';
    setMsg('> traced. real node revealed.', C.red);
    st.dying = true;      // the music powers down instead of cutting out
    Sound.death();
    await wait(1100);
    await endRun(false);
  }

  async function endRun(win) {
    const run = st.run;
    st.busy = true;
    st.timer = null;
    if (!win) {
      // Losing: the whole screen glitches out.
      const cells = snapshot(() => true);
      st.hideAll = true;
      st.wipe = null;
      const ms = fallOut(cells); flash(C.red, 0.2, 0.4);
      Sound.collapse(ms / 1000);
      await wait(ms + 150);
    }
    // Winning: the final boss's success wipe carries straight into the results screen.

    const newBest = !run.practice && run.depth > save.best;
    if (!run.practice) {
      save.runs++;
      if (win) save.wins++;
      if (newBest) save.best = run.depth;
    }
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();

    // Where you were traced, and the corps you breached (visited corp nodes you finished).
    const c = st.corp;
    const diedAt = !win && c ? `${c.def.name}${c.hasBoss ? (st.lv && st.lv.boss ? ' BOSS' : ` ${c.idx + 1}/${c.counts.length - 1}`) : ''}` : '';
    const breached = run.visited.map(id => run.map[id])
      .filter(n => (n.type === 'corp' || n.type === 'final') && (win || n.id !== run.at)).map(n => n.corp);
    st.result = { win, depth: run.depth, corps: run.corps, earned: run.earned, newBest, practice: run.practice, seed: run.seed,
      diedAt, breached, mods: run.mods.slice(), items: run.items.slice(), map: run.map, visited: run.visited.slice(), at: run.at };
    st.corp = null; st.lv = null;
    st.dying = false;
    scenePalette(null);
    showBoard('over');
    // Losing builds the results up out of the empty screen (no decode-in).
    st.overReveal = win ? null : { t0: performance.now() + 200, shown: 0, typed: 0, y: null, lt: 0 };
    st.overMap = null;
    if (!win) {
      st.boardStart = -1e9;
      const scrollMap = d => {
        const om = st.overMap; if (!om || om.view == null) return;
        const t = clamp(om.top + d, 0, mapRows() - om.view);
        if (t !== om.top) { om.top = t; Sound.tick(); }
      };
      st.scroll = scrollMap;
      st.keyHandler = k => { if (k === 'arrowup' || k === 'arrowdown') { scrollMap(k === 'arrowup' ? -1 : 1); return true; } return false; };
    }
    st.busy = false;
    setMsg(win ? '> root access_' : '> link severed_', win ? C.cyan : C.red);
    if (win) { flash(C.cyan, 0.25, 0.8); shake(6, 0.5); fireworkShow(); }   // the boss fanfare already played
  }

  const jackIn = () => startRun(st.seed, st.practice);
  const retry = () => startRun(st.result ? st.result.seed : st.seed, true);
  const newRun = () => startRun(newSeed(), false);

  // ---------------- Panels ----------------
  // The title and the menu screens use the whole screen: no header, HUD or tray.
  const fullScreen = () => st.mode === 'title' || st.mode === 'over' || (st.mode === 'panel' && st.panelFull);

  function openPanel(title, fn, msg, opts = {}) {
    st.panelFull = !!opts.full;
    st.bigPops = 0; st.glow = {};
    st.breachReveal = false;
    // Line-by-line reveal out of an empty screen (after a boss): the title types in,
    // then the lines come in under it. Header, HUD and tray come back when it's done.
    st.panelReveal = opts.reveal ? { t0: performance.now() + 100, shown: 0, typed: 0, y: null, lt: 0, done: false, center: 'board', sound: 'climb' } : null;
    st.panelTitle = title;
    st.panelFn = fn;
    st.revealed = new Set();
    showBoard('panel');
    st.panelT0 = performance.now() + (st.wipe ? st.wipe.dur : 0) + CONFIG.revealDelay;
    if (st.panelReveal) { st.panelT0 = Infinity; st.boardStart = -1e9; }   // offers pop as their lines come in
    st.busy = false;
    const m = msg && typeof msg === 'object' ? msg : msg ? { text: msg } : null;
    if (st.panelReveal) { st.panelReveal.msg = m; st.msg = ''; }
    else if (m) setMsg(m.text, m.col);
  }

  async function leavePanel() {
    if (st.transitioning) return;
    await swapTo(toMap);
  }

  function addMod(key) {
    const run = st.run;
    if (run.mods.includes(key)) return;
    run.mods.push(key);
    markSeen(key);
    const m = MODS[key];
    if (key === 'buffer') { run.maxInt++; run.integrity++; }
    if (key === 'stash') run.beltSlots++;
    if (m.charges) run.charges[key] = m.charges;
  }

  // Up to k mods from a pool that the player doesn't have yet.
  function pickMods(r, pool, k, exclude = []) {
    return shuffle(pool.filter(key => !st.run.mods.includes(key) && !exclude.includes(key)), r).slice(0, k);
  }

  const priceOf = o => o.kind === 'repair' ? o.price : Math.round(o.price * (has('haggle') ? 0.75 : 1));
  const SEP = '+ - - - - - - - - - - - - - - - +';

  function openShop(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'shop', node.id);
    const itemKeys = shuffle(Object.keys(ITEMS), r).slice(0, 3);
    let offers = itemKeys.map(k => ({ kind: 'item', key: k, price: ITEMS[k].price, sold: false }));
    for (const k of pickMods(r, modsOfKind('gen', 'minor'), 2)) offers.push({ kind: 'mod', key: k, price: MODS[k].price, sold: false });
    offers = shuffle(offers, r);   // random order: any slot could be the good one
    offers.push({ kind: 'repair', key: 'repair', price: 20, sold: false });

    const buy = o => {
      const price = priceOf(o);
      if (o.sold || run.credits < price) return Sound.deny();
      if (o.kind === 'item') { if (run.items.length >= run.beltSlots) return Sound.deny(); run.items.push(o.key); o.sold = true; markSeen(o.key); }
      if (o.kind === 'mod') { addMod(o.key); o.sold = true; }
      if (o.kind === 'repair') { if (run.integrity >= run.maxInt) return Sound.deny(); run.integrity++; }
      run.credits -= price;
      Sound.buy();
      setMsg(`> bought ${o.kind === 'repair' ? 'repair' : (o.kind === 'item' ? ITEMS[o.key] : MODS[o.key]).name.toLowerCase()}.`, C.gold);
    };

    let sel = 0;
    const defOf = o => o.kind === 'item' ? ITEMS[o.key] : o.kind === 'mod' ? MODS[o.key] : { name: 'REPAIR', desc: 'restore 1 integrity.' };
    const whyNot = o => {
      if (o.sold) return 'sold out.';
      if (o.kind === 'item' && run.items.length >= run.beltSlots) return 'item belt is full.';
      if (o.kind === 'repair' && run.integrity >= run.maxInt) return 'integrity is full.';
      if (run.credits < priceOf(o)) return 'not enough credits.';
      return null;
    };

    openPanel('BLACK MARKET', (T, B, X) => {
      const now = performance.now();
      T('BLACK MARKET', C.gold);
      T(`credits ${run.credits}${has('haggle') ? '  (haggle -25%)' : ''}`, C.gold);
      T('');
      offers.forEach((o, k) => {
        const def = defOf(o);
        const isMod = o.kind === 'mod';
        const price = o.sold ? 'SOLD' : `${priceOf(o)}cr`;
        const tag = isMod ? 'mod' : o.kind === 'item' ? 'item' : 'svc';
        X({
          list: true, id: 'offer' + k, onTap: () => { sel = k; Sound.tick(); },
          sel: k === sel, faded: !!whyNot(o),
          badge: isMod ? o.key : null, name: def.name,
          col: isMod ? modColor(def) : C.bright,
          right: `${tag} ${price.padStart(5)}`, rightCol: C.gold,
          tint: isMod ? modColor(def) : o.kind === 'item' ? C.mid : C.cyan,
          reveal: k, revealId: 'offer' + k,
          rarity: isMod ? def.rarity : null, seenKey: o.kind === 'repair' ? null : o.key,
        });
      });
      T('');
      // Details box for the selected offer (once it has popped in).
      const o = offers[sel], def = defOf(o), why = whyNot(o);
      const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
      // Fixed height (7 rows) so the layout never jumps while offers pop in.
      T(SEP, C.dim);
      if (!shown) { T('...', C.dim); for (let i = 0; i < 6; i++) T(''); }
      else {
        if (o.kind === 'mod') { X({ badge: o.key }); T(`${RARITY[def.rarity].label} mod`, modColor(def)); }
        else { T(def.name, C.bright); T(o.kind === 'item' ? 'item // single use' : 'service', C.mid); }
        T(o.kind === 'mod' ? def.tip : def.desc, C.text);
        if (why) { T(''); T(why, C.redDim); T(''); T(''); }
        else X({ box: true, text: 'B U Y', sub: `${priceOf(o)}cr`, id: 'buy', onTap: () => buy(o), minW: 18 });
      }
      T(SEP, C.dim);
      B('[ LEAVE ]', 'leave', leavePanel);
    }, '> the market is open.');
  }

  // A reward screen: header lines, then a list of mods to pick one from (or skip).
  function openChoice({ title, col, head = [], options, skipLabel, onSkip, msg, reveal = false }) {
    let sel = 0;
    const take = key => {
      if (st.transitioning) return;
      if (key) { addMod(key); Sound.buy(); setMsg(`> installed ${MODS[key].name.toLowerCase()}.`, C.cyan); }
      else if (onSkip) onSkip();
      leavePanel();
    };
    openPanel(title, (T, B, X) => {
      const now = performance.now();
      T(title, col);
      for (const h of head) T(h[0], h[1]);
      T('');
      if (options.length) T(options.length > 1 ? 'choose one mod:' : 'mod found:', C.mid);
      options.forEach((k, i) => {
        const m = MODS[k];
        X({
          list: true, id: 'opt' + i, onTap: () => { sel = i; Sound.tick(); },
          sel: i === sel, badge: k, name: m.name, col: modColor(m),
          right: RARITY[m.rarity].label, rightCol: modColor(m), tint: modColor(m),
          reveal: i, revealId: 'opt' + i, rarity: m.rarity, seenKey: k,
        });
      });
      if (options.length) {
        T('');
        const k = options[sel], m = MODS[k];
        const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
        T(SEP, C.dim);
        if (shown) {
          X({ badge: k });
          T(m.tip, C.text);
          X({ box: true, text: 'T A K E', id: 'take', onTap: () => take(k), minW: 18 });
        } else { T('...', C.dim); T(''); T(''); T(''); T(''); }
        T(SEP, C.dim);
      }
      T('');
