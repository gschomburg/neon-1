  // A typed seed (from the settings field).
  function setSeed(s) {
    const clean = cleanSeed(s);
    if (!clean) return Sound.deny();      // empty: keep the old seed
    if (clean === st.seed) return;
    st.seed = clean;
    st.practice = true;     // a chosen seed is a practice run
    Sound.ui();
    setMsg(`> seed set: ${clean}`);
  }

  function resetSave() {
    if (!st.resetArmed) { st.resetArmed = true; Sound.deny(); return; }
    const keep = { palette: save.palette, muted: save.muted, effects: save.effects, tapMode: save.tapMode };
    for (const k of Object.keys(save)) delete save[k];
    Object.assign(save, freshSave(), keep);
    persist();
    clearRun();
    st.resetArmed = false;
    Sound.buy();
    setMsg('> save data erased.', C.red);
  }

  // ---------------- THE BOARD (legacy shop) ----------------
  // An old hacker bulletin board: spend REP on unlocks that last between runs.
  function openBoard() {
    let sel = 0;
    const buy = u => {
      const lv = legacyLv(u.key), cost = u.costs[lv];
      if (cost == null) return Sound.deny();
      if ((save.rep || 0) < cost) { Sound.deny(); setMsg('> not enough REP.', C.red); return; }
      save.rep -= cost;
      save.legacy = save.legacy || {};
      save.legacy[u.key] = lv + 1;
      persist();
      Sound.buy();
      setMsg(`> ${u.name.toLowerCase()} unlocked${u.costs.length > 1 ? `: level ${lv + 1}` : ''}.`, C.gold);
    };
    openPanel('THE BOARD', (T, B, X) => {
      T('+------------------------------+', C.dim);
      X({ text: '|  T H E   B O A R D   //  BBS |', colorAt: i => i === 0 || i === 31 ? C.dim : C.gold, bold: true });
      T('+------------------------------+', C.dim);
      T(`sysop: ${profile().name.toLowerCase()}`, C.mid);
      X({ text: `REP ${save.rep || 0}`, col: C.gold, bold: true });
      T('cash out after a sector for REP.', C.dim);
      T('');
      LEGACY.forEach((u, i) => {
        const lv = legacyLv(u.key), max = lv >= u.costs.length, cost = u.costs[lv];
        const lvTxt = u.costs.length > 1 ? ` ${'#'.repeat(lv)}${'-'.repeat(u.costs.length - lv)}` : '';
        X({
          list: true, id: 'lg' + i, onTap: () => { sel = i; Sound.tick(); }, sel: i === sel,
          name: u.name + lvTxt, col: max ? C.cyan : lv ? C.text : C.mid,
          right: max ? 'OWNED' : `${cost} REP`, rightCol: max ? C.cyan : (save.rep || 0) >= cost ? C.gold : C.dim,
          tint: max ? C.cyan : null,
        });
      });
      T('');
      const u = LEGACY[sel], lv = legacyLv(u.key), max = lv >= u.costs.length, cost = u.costs[lv];
      T(SEP, C.dim);
      X({ text: u.name, col: C.bright, bold: true });
      const dl = wrapText(u.levels ? u.levels[Math.min(lv, u.levels.length - 1)] : u.desc, 32);
      for (let k = 0; k < 2; k++) T(dl[k] || '', C.text);
      T(u.costs.length > 1 ? `level ${lv} of ${u.costs.length}` : '', C.mid);
      if (max) { T('owned.', C.cyan); T(''); T(''); }
      else X({ box: true, text: `B U Y  ${cost} REP`, id: 'buy', onTap: () => buy(u), minW: 20, disabled: (save.rep || 0) < cost });
      T(SEP, C.dim);
      T('');
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> connected to the board.', { full: true });
    st.keyHandler = k => { if (k === 'escape') { swapTo(showTitle); return true; } return false; };
  }

  // ---------------- Resume a saved run ----------------
  async function resumeRun() {
    const d = savedRun();
    if (!d || st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await wipeOut(0);
    st.transitioning = false;
    const run = d.run;
    run.resumes = (run.resumes || 0) + 1;   // layers come back different
    st.run = run; st.seed = run.seed; st.practice = run.practice;
    st.result = null;
    const p = d.pending;
    if (p && p.kind === 'sector') return showSectorClear(p.skipped, false);
    if (p && p.kind === 'reward' && run.map[p.id]) { st.breachReveal = false; return openReward(run.map[p.id], p.skipped); }
    if (p && p.kind === 'start') return openStartReward(run.map['0:1']);
    if (d.corp && run.map[d.corp.node]) {
      // Back into the corp you were in, at the layer you were on (a fresh layer).
      await startCorp(run.map[d.corp.node], d.corp.idx, d.corp);
      return;
    }
    toMap();
  }
  function newOverSave() {
    if (!st.newArmed) { st.newArmed = true; Sound.deny(); return; }
    st.newArmed = false;
    clearRun(); st.savedRun = null;
    jackIn();
  }

  // ---------------- Active mods ----------------
  function nodesAhead() {
    const run = st.run, cur = run.map[run.at];
    const top = SECTOR_STEPS * (run.sector + 1);   // this sector's OMNI
    return Object.values(run.map).filter(n => n.step > cur.step && n.step < top && !run.visited.includes(n.id));
  }

  function modUsable(key) {
    const m = MODS[key], run = st.run;
    if (!m || !m.active || !run || st.transitioning || st.dev || st.wipe) return false;
    if (m.active === 'layer') {
      if (st.mode !== 'play' || st.busy || !st.lv || !st.corp || !st.corp.hasBoss) return false;
      if (key === 'burner') return !st.corp.burnerUsed && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    }
    return false;
  }
  // Used up for now: BURNER after its use in this corp, FAILSAFE after it saved you.
  function modSpent(key) {
    if (key === 'burner') return !!(st.mode === 'play' && st.corp && st.corp.hasBoss && st.corp.burnerUsed);
    if (key === 'failsafe') return !!(st.run && st.run.failsafeUsed);
    return false;
  }

  function activateMod(key) {
    const run = st.run;
    if (!modUsable(key)) { Sound.deny(); return; }
    st.selMod = -1;
    if (key === 'burner') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      lockTile(pickR(opts, rngFor(run.seed, 'burner', st.corp.node.id, st.corp.idx)), C.cyan, 'burner');
      st.corp.burnerUsed = true;
      setMsg('> burner: 1 ICE locked.', C.cyan);
    }
  }

  // Re-roll the type and corp of every node ahead (links stay the same).
  function rerouteMap() {
    const run = st.run;
    const r = rngFor(run.seed, 'reroute', run.reroutes++);
    const corps = Object.keys(CORPS);
    for (const n of nodesAhead()) {
      const roll = r();
      n.type = roll < 0.6 ? 'corp' : roll < 0.75 ? 'cache' : roll < 0.88 ? 'repair' : 'shop';
      if (n.type === 'corp') { n.corp = pickR(corps, r); n.tier = tierAt(n.sector || 0, localStep(n)); }
      else { delete n.corp; delete n.tier; }
    }
  }

  // ---------------- Items ----------------
  function canUse(stack) {
    const run = st.run;
    if (!run || st.wipe || !stack) return false;
    const key = stack.key, tier = stack.tier || 0;
    if (key === 'patch') return run.integrity < run.maxInt;
    if (key === 'wall') return tier < 2 ? true : st.mode === 'play' && !!st.corp && st.corp.hasBoss && !st.corp.wallAll;
    if (key === 'route' || key === 'warp') return st.mode === 'map' && !st.busy && !st.transitioning && nodesAhead().length > 0;
    const inLayer = st.mode === 'play' && !st.busy && st.lv;
    if (key === 'purge') return !!inLayer && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    if (key === 'split') return !!inLayer && !st.lv.split && candidates().length > 1;
    return false;
  }

  function useItem(slot) {
    const run = st.run;
    if (!run || st.transitioning) return;
    const stack = run.items[slot];
    if (!stack) return;
    if (!canUse(stack)) { Sound.deny(); return; }
    const key = stack.key, tier = stack.tier || 0;
    stack.n--;
    if (stack.n <= 0) run.items.splice(slot, 1);
    st.hoverItem = -1; st.selItem = -1;
    const lv = st.lv;
    if (key === 'patch') {
      const before = run.integrity;
      run.integrity = Math.min(run.maxInt, run.integrity + tier + 1);
      Sound.buy(); setMsg(`> patched. +${run.integrity - before} int`, C.cyan);
    }
    if (key === 'wall') {
      if (tier >= 2) { st.corp.wallAll = true; setMsg('> firewall up: no hits for the rest of this corp.', C.cyan); }
      else { run.shield += tier + 1; setMsg(`> firewall up. FW${run.shield}`, C.cyan); }
      Sound.shield();
    }
    if (key === 'purge') {
      let locked = 0;
      for (let k = 0; k <= tier; k++) {
        let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
        if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
        if (!opts.length) break;
        const r = rngFor(run.seed, 'purge', st.corp.node.id, st.corp.idx, lv.tiles.filter(t => t.state === 'locked').length);
        lockTile(pickR(opts, r), C.cyan, 'purge');
        locked++;
      }
      setMsg(`> purged ${locked} ICE node${locked === 1 ? '' : 's'}.`, C.cyan);
    }
    if (key === 'split') {
      const s = lv.tiles[lv.safe];
      if (tier === 0) {
        const vertical = rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx)() < 0.5;
        for (const t of lv.tiles) {
          const sameHalf = vertical ? (t.col < lv.cols / 2) === (s.col < lv.cols / 2) : (t.row < lv.rows / 2) === (s.row < lv.rows / 2);
          if (!sameHalf) t.ruledOut = true;
        }
        setMsg(`> split: it is in the ${vertical ? (s.col < lv.cols / 2 ? 'left' : 'right') : (s.row < lv.rows / 2 ? 'top' : 'bottom')} half.`, C.cyan);
      } else {
        // rare: rule out 2/3 of the ICE still in play; epic: all but one
        const ice = shuffle(lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.ruledOut), rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx));
        const k = tier >= 2 ? Math.max(0, ice.length - 1) : Math.floor(ice.length * 2 / 3);
        ice.slice(0, k).forEach(t => { t.ruledOut = true; });
        setMsg(`> split: ${k} ICE ruled out.`, C.cyan);
      }
      lv.split = true;
      Sound.shield();
    }
    if (key === 'route') {
      rerouteMap();
      st.mapSel = null;
      st.boardStart = performance.now();
      Sound.whoosh();
      setMsg('> rerouted. the net shifts.', C.cyan);
    }
    if (key === 'warp') {
      const target = pickR(nodesAhead(), rngFor(run.seed, 'warp', run.at, run.depth));
      setMsg('> warp open...', C.cyan);
      enterNode(target, true);
    }
  }

  function toggleMute() {
    save.muted = !save.muted;
    persist();
    Sound.levels();
    Sound.ui();
  }

  function cyclePalette() {
    const keys = playerPalettes();
    save.palette = keys[(keys.indexOf(save.palette) + 1) % keys.length];
    refreshPalette();
    persist();
    Sound.ui();
  }

  // The palette for what's on screen: inside a corp, that corp's own (if corp colors
  // are on); everywhere else, the player's palette from settings.
  function scenePalette(corpKey) {
    const ck = corpKey && save.corpColors ? 'c_' + corpKey : null;
    applyPalette(ck && PALETTES[ck] ? ck : save.palette);
  }
  const refreshPalette = () => scenePalette(st.corp && st.corp.hasBoss ? st.corp.def.key : null);
  const toggleCorpColors = () => { save.corpColors = !save.corpColors; persist(); refreshPalette(); Sound.ui(); };

  // ---------------- Pause menu ----------------
  // [MENU] in the header or Esc during a run. Stops clocks. Abandon goes to the title.
  function togglePause() {
    if (st.dev) return;
    if (!st.pause && (!st.run || st.busy || st.transitioning || st.wipe)) { Sound.deny(); return; }
    st.pause = !st.pause;
    st.abandonArmed = false;
    st.kbFocus = null;
    st.boardStart = performance.now();
    Sound.ui();
  }

  const toggleEffects = () => { save.effects = save.effects === 'full' ? 'reduced' : 'full'; persist(); Sound.ui(); };
  const toggleTapMode = () => { save.tapMode = save.tapMode === 'two' ? 'one' : 'two'; persist(); Sound.ui(); };

  // Audio controls (settings + pause menu): on/off and an 8-step volume bar each.
  const toggleMusic = () => { save.musicOn = !save.musicOn; persist(); Sound.levels(); Sound.ui(); };
  const nudgeVol = (k, d) => { save[k] = clamp(Math.round((save[k] + d) * 8) / 8, 0, 1); persist(); Sound.levels(); Sound.ui(); };
  const volBar = v => '#'.repeat(Math.round(v * 8)) + '-'.repeat(8 - Math.round(v * 8));
  function audioLines(X, prefix) {
    X({ text: `[ music: ${save.musicOn ? 'ON ' : 'OFF'} ]`, id: prefix + 'mus', onTap: toggleMusic });
    X({ gap: 1, row: [
      { text: 'vol' }, { text: '[-]', id: prefix + 'mvd', onTap: () => nudgeVol('musicVol', -1 / 8) },
      { text: volBar(save.musicVol), col: save.musicOn ? C.cyan : C.dim },
      { text: '[+]', id: prefix + 'mvu', onTap: () => nudgeVol('musicVol', 1 / 8) },
    ] });
    X({ text: `[ effects sound: ${save.muted ? 'OFF' : 'ON '} ]`, id: prefix + 'sfx', onTap: toggleMute });
    X({ gap: 1, row: [
      { text: 'vol' }, { text: '[-]', id: prefix + 'svd', onTap: () => nudgeVol('sfxVol', -1 / 8) },
      { text: volBar(save.sfxVol), col: save.muted ? C.dim : C.cyan },
      { text: '[+]', id: prefix + 'svu', onTap: () => nudgeVol('sfxVol', 1 / 8) },
    ] });
  }

  function pauseLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap) => lines.push({ text, id, onTap });
    const run = st.run;
    T('PAUSED', C.cyan);
    T(`layer ${pad2(run.depth)}   corps ${run.corps}   cr ${run.credits}`, C.text);
    T(`seed ${run.seed}${run.practice ? '  (practice)' : ''}`, C.mid);
    T('');
    lines.push({ box: true, text: 'R E S U M E', id: 'resume', onTap: togglePause, minW: 22 });
    T('');
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'ppal', cyclePalette);
    B(`[ corp colors: ${save.corpColors ? 'ON ' : 'OFF'} ]`, 'pccol', toggleCorpColors);
    B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'pfx', toggleEffects);
    B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'ptap', toggleTapMode);
    audioLines(ln => lines.push(ln), 'p_');
    T('');
    B(st.abandonArmed ? '[ TAP AGAIN TO ABANDON ]' : '[ ABANDON RUN ]', 'abandon', abandonRun);
    T(st.abandonArmed ? 'the run ends here.' : 'abandoned runs are not scored.', st.abandonArmed ? C.red : C.dim);
    return lines;
  }

  function abandonRun() {
    if (!st.abandonArmed) { st.abandonArmed = true; Sound.deny(); return; }
    const run = st.run;
    run.ended = true; clearRun();
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win: false, abandoned: true, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();
    st.pause = false; st.abandonArmed = false; st.timer = null;
    swapTo(showTitle);
  }

  // ---------------- Keyboard cursor ----------------
  // Buttons and list rows: move through them in reading order.
  function moveFocus(d) {
    const list = st.focusables;
    if (!list.length) return;
    let i = list.findIndex(f => f.id === st.kbFocus);
    const edge = i >= 0 && ((d > 0 && i === list.length - 1) || (d < 0 && i === 0)) || (i >= 0 && list[i + d] && /^dev(up|dn)$/.test(list[i + d].id));
    if (st.dev && st.devScroll && edge && st.devScroll(d)) return;
    i = i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length;
    st.kbFocus = list[i].id;
    st.hoverBtn = st.kbFocus;
    Sound.tick();
  }

  // Grid: jump to the nearest open tile in the arrow's direction.
  function moveTileCursor(k) {
    const lv = st.lv;
    if (st.busy) return;
    const open = lv.tiles.map((t, i) => [t, i]).filter(([t]) => t.state === 'closed');
    if (!open.length) return;
    st.kbGrid = true;
    const cur = lv.tiles[st.hover];
    if (!cur || cur.state !== 'closed') {
      // Start at the tile nearest the middle of the grid.
      const mx = (lv.cols - 1) / 2, my = (lv.rows - 1) / 2;
      open.sort((a, b) => Math.hypot(a[0].col - mx, a[0].row - my) - Math.hypot(b[0].col - mx, b[0].row - my));
      st.hover = open[0][1];
      Sound.tick();
      return;
    }
    const [dx, dy] = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[k];
    let best = -1, bestScore = Infinity;
    for (const [t, i] of open) {
      if (t === cur) continue;
      const vx = t.col - cur.col, vy = t.row - cur.row;
      const along = vx * dx + vy * dy;
      if (along <= 0) continue;
      const score = along + Math.abs(vx * dy - vy * dx) * 2;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) { st.hover = best; Sound.tick(); }
    if (st.mp && lv.tiles[st.hover]) { const { tx, ty } = tileOrigin(lv.tiles[st.hover]); mpSendCursor(tx + 3, ty + 2); }
  }

  // Map: step through the nodes you can pick next.
  function moveMapCursor(k) {
    const run = st.run;
    const avail = availableNodes().slice().sort((a, b) => run.map[a].lane - run.map[b].lane);
    if (!avail.length) return;
    const mv = st.mapView;
    if (mv && mv.sector !== run.sector) { mv.sector = run.sector; mv.target = sectorViewRow(run.sector); }   // back to where you are
    const d = k === 'arrowleft' || k === 'arrowup' ? -1 : 1;
    const i = avail.indexOf(st.mapSel);
    st.mapSel = avail[i < 0 ? 0 : (i + d + avail.length) % avail.length];
    Sound.ui();
  }

  // ---------------- Dev menu ----------------
  // Open with ` (backtick), or the [DEV] button in the footer when the URL has ?dev=1.
  // Using cheats on a run marks it as practice, so it doesn't count.
  function toggleDev() {
    if (st.transitioning || st.wipe) return;
    st.dev = !st.dev;
    st.devPage = null;     // always open on the main page; closing ends any music preview
    st.preview = null;
    st.devTop = 0; st.devScroll = null;
    st.devAccess = true;
    st.boardStart = performance.now();
    Sound.ui();
  }

  function cheat(fn) {
    return () => {
      if (st.run) st.run.practice = true;
      fn();
      Sound.buy();
    };
  }

  // Jump straight to a corp's boss layer.
  function jumpToBoss(node) {
    const run = st.run;
    st.dev = false;
    if (st.mode === 'play' && st.corp && st.corp.hasBoss && !st.lv.boss) {
      st.corp.idx = st.corp.counts.length - 1;
      enterLayer();
      return;
    }
    if (!node) return;
    run.practice = true;
    if (run.at !== node.id) { run.at = node.id; run.visited.push(node.id); }
    startCorp(node, 99);
  }

  // Dev music player: preview every track and push it through its intensity levels,
  // the way the game does as you go deeper.
  const LEVEL_LABELS = ['pad + bass', '+ drums', '+ arp', '+ lead', 'final boss'];
  function trackLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap) => lines.push({ text, id, onTap });
    const p = st.preview;
    const keys = Object.keys(SONGS);
    const usedBy = k => Object.keys(MUSIC_FOR).filter(place => MUSIC_FOR[place] === k).join(', ') || 'unused';
    const set = patch => { Object.assign(p, patch); Sound.tick(); };
    T('MUSIC PLAYER', C.cyan);
    T('tap a track to play it.', C.dim);
    T('');
    const rows = 8, n = keys.length;
    p.top = clamp(p.top || 0, 0, maxTop(n, rows));
    const w = listWindow(p.top, n, rows);
    let used = 0;
    if (w.hasUp) { lines.push({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', invert: true, id: 'trup', onTap: () => { p.top = nextTop(p.top, -1, maxTop(n, rows)); Sound.tick(); } }); used++; }
    for (let i = p.top; i < p.top + w.shown; i++) {
      const k = keys[i];
      lines.push({ list: true, id: 'tr_' + k, sel: k === p.key, name: SONGS[k].name, col: k === p.key && p.playing ? C.cyan : C.bright,
        right: usedBy(k), rightCol: C.mid, onTap: () => set({ key: k, playing: true }) });
      used++;
    }
    if (w.hasDown) { lines.push({ text: '[ v v v  more  v v v ]', invert: true, id: 'trdn', onTap: () => { p.top = nextTop(p.top, 1, maxTop(n, rows)); Sound.tick(); } }); used++; }
    for (; used < rows; used++) T('');
    T(SEP, C.dim);
    const tr = SONGS[p.key];
    T(`${tr.name}  ${tr.bpm} bpm  ${NOTE_NAMES[tr.root % 12]} ${tr.scale}`, p.playing ? C.cyan : C.text);
    if (tr.style === 'ambient') T('ambient: no levels or drums', C.dim);
    else lines.push({ gap: 1, row: [
      { text: 'level' }, { text: '[-]', id: 'trlvd', onTap: () => set({ level: Math.max(0, p.level - 1) }) },
      { text: `${p.level} ${LEVEL_LABELS[p.level]}`.padEnd(12), col: C.bright },
      { text: '[+]', id: 'trlvu', onTap: () => set({ level: Math.min(4, p.level + 1) }) },
    ] });
    const ub = Math.round(p.urgency * 8);
    lines.push({ gap: 1, row: [
      { text: 'urgency' }, { text: '[-]', id: 'trurd', onTap: () => set({ urgency: Math.max(0, Math.round((p.urgency - 0.25) * 4) / 4) }) },
      { text: '#'.repeat(ub) + '-'.repeat(8 - ub), col: p.urgency ? C.red : C.dim },
      { text: '[+]', id: 'truru', onTap: () => set({ urgency: Math.min(1, Math.round((p.urgency + 0.25) * 4) / 4) }) },
    ] });
    lines.push({ row: [
      { text: `[ heartbeat: ${p.low ? 'ON ' : 'OFF'} ]`, id: 'trlow', onTap: () => set({ low: !p.low }) },
      { text: p.playing ? '[ STOP ]' : '[ PLAY ]', id: 'trplay', onTap: () => set({ playing: !p.playing }) },
    ] });
    // Hear the end jingles over this track (it powers down / up, then restarts).
    const test = (fn, ms) => () => {
      if (!p.playing) return Sound.deny();
      fn();
      clearTimeout(p.restartT);
      p.restartT = setTimeout(() => { if (st.preview === p) Music.restart(); }, ms);
    };
    lines.push({ row: [
      { text: 'test' },
      { text: '[ boss win ]', id: 'trwin', onTap: test(() => Sound.bossWin(), 3600) },
      { text: '[ game over ]', id: 'trdeath', onTap: test(() => Sound.death(), 3800) },
    ] });
    T(SEP, C.dim);
    B('[ back ]', 'trback', () => { st.devPage = null; st.preview = null; st.devTop = 0; Sound.ui(); });
    return lines;
  }

  function openTrackPlayer() {
    st.devPage = 'tracks';
    st.devTop = 0;
    st.preview = { key: MUSIC_FOR.menu, level: 2, urgency: 0, low: false, playing: true, top: 0 };
    Sound.init();
    Sound.ui();
  }

  // The dev menu scrolls like the other menus when it's taller than the screen.
  // Title and close stay put; everything between scrolls (wheel, swipe, arrows).
  function devLines() {
    const all = st.devPage === 'tracks' ? trackLines() : devMenuLines();
    const head = all.slice(0, 2), body = all.slice(2, -1), foot = all.slice(-1);
    const rows = L.hc - head.length - foot.length - 4;   // room left, with a little margin
    const max = maxTop(body.length, rows);
    st.devTop = clamp(st.devTop || 0, 0, max);
    st.devScroll = max > 0 ? d => { const t = nextTop(st.devTop, d, max); if (t !== st.devTop) { st.devTop = t; Sound.tick(); return true; } return false; } : null;
    if (!max) return all;
    const w = listWindow(st.devTop, body.length, rows), out = [...head];
    if (w.hasUp) out.push({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', invert: true, id: 'devup', onTap: () => st.devScroll(-1) });
    out.push(...body.slice(st.devTop, st.devTop + w.shown));
    if (w.hasDown) out.push({ text: '[ v v v  more  v v v ]', invert: true, id: 'devdn', onTap: () => st.devScroll(1) });
    if (!w.hasDown && body.length && !body[body.length - 1].text) out.pop();   // no double gap at the bottom
    out.push({ text: '' }, ...foot);
    return out;
  }

  function devMenuLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    const run = st.run;
    const idle = !st.busy && !st.transitioning;
    T('DEV MENU', C.cyan);
    T(run ? (run.practice ? 'run is practice (not scored)' : 'cheats mark the run as practice') : 'start a run for cheats', C.dim);
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
    B(`[ show real node: ${st.debug ? 'ON ' : 'OFF'} ]`, 'dbg', () => { st.debug = !st.debug; if (run) run.practice = true; Sound.ui(); });
    B(`[ god: ${st.god ? 'ON ' : 'OFF'} ]`, 'god', () => { st.god = !st.god; if (run) run.practice = true; Sound.ui(); });
    B(`[ free travel: ${st.freeTravel ? 'ON ' : 'OFF'} ]`, 'free', () => { st.freeTravel = !st.freeTravel; if (run) run.practice = true; st.mapSel = null; Sound.ui(); });
    T('');
    T('mods (by rarity, tap to add/remove)', C.mid);
    const toggleMod = k => cheat(() => {
      if (!run.mods.includes(k)) return addMod(k);
      removeMod(k);
    });
    const keys = codexMods();
    for (let i = 0; i < keys.length; i += 4) {
      lines.push({ gap: 3, row: keys.slice(i, i + 4).map(k => ({
        badge: k, on: !!(run && run.mods.includes(k)),
        id: 'mod_' + k, onTap: toggleMod(k), disabled: !run,
      })) });
    }
    T('');
    lines.push({ row: [
      { text: '[+100cr]', id: 'cr', onTap: cheat(() => { run.credits += 100; }), disabled: !run },
      { text: '[heal]', id: 'hp', onTap: cheat(() => { run.integrity = run.maxInt; }), disabled: !run },
      { text: '[fill belt]', id: 'belt', onTap: cheat(() => { for (const k of Object.keys(ITEMS)) addItem(k, 0); }), disabled: !run },
    ] });
    B('[unlock codex]', 'seenall', () => {
      for (const k of [...Object.keys(MODS), ...Object.keys(ITEMS), ...GLYPHS.map(gl => gl.key), ...CODEX_CORPS.map(c => 'corp_' + c)]) save.seen[k] = true;
      for (const c of CODEX_CORPS) if (!corpStat(c).breached) corpStat(c).breached = 1;
      persist(); Sound.buy();
    });
    T('');
    const inCorp = st.mode === 'play' && st.corp && st.corp.hasBoss && st.lv && !st.lv.boss;

  //   - find the real node: the layer is cleared (first try: +1 integrity), and the next,
  //     bigger layer starts with the next player
  //   - at 0 integrity you're knocked out and spectate; the last one standing wins
  // Anyone who joins once the game is full spectates. After a game the host picks who
  // plays the next one. Firebase only relays data: every game rebuilds the layers from
  // the round's seed and replays the same moves, so all screens stay in sync.

  //   meta      { host, max, round, status: lobby|playing, picks: {id: true} }
  //   members   {id: { name, logo, joined, online }}

  const Net = window.__fakeNet || (() => {
    let db = null;
    function init() {

      } catch (e) { return false; }
    }
    const get = async path => (await db.ref(path).get()).val();
    const set = (path, val) => db.ref(path).set(val);

  const mpPlaying = () => !!(st.mp && st.mp.state && st.mp.state.alive[st.mp.me]);
  function nextAlive(S, from) {
    const i = S.order.indexOf(from);
    for (let k = 1; k <= S.order.length; k++) {

  const MP_CORPS = ['perimeter', 'sigil', 'mirror'];   // Chronos skipped: its clock doesn't fit taking turns

  // Which corp and layer a given (shared) layer number is. Corps come in blocks of
  // 4 layers (3 + a boss); nodes keep climbing: layer n has n + 1 nodes.
  function mpSpec(seed, layer) {
    const seg = Math.floor((layer - 1) / 4), pos = (layer - 1) % 4;
    const order = shuffle(MP_CORPS.slice(), rngFor(seed, 'mp-corps'));
    return {
      seg, pos, corp: order[seg % order.length],
      tier: clamp(1 + Math.floor(seg / order.length), 1, 3),
      boss: pos === 3, n: layer + 1, nodeId: 'mp' + seg,
    };
  }

  function mpLayer(seed, layer) {
    const sp = mpSpec(seed, layer), def = CORPS[sp.corp];
    let tell = def.tell;
    if (tell === 'mirror' && sp.tier >= 2) tell = 'vmirror';
    if (tell === 'corner' && sp.tier >= 2 && sp.corp !== 'omni') tell = 'edge';
    const mark = tell === 'mark' ? { level: sp.tier, glyph: sp.tier === 1 ? pickR(MOTIFS, rngFor(seed, 'mp-sigil', sp.seg)) : null } : null;
    // Mirror tells need the previous layer of the same corp, so build them in order.
    let prevSafe = null, lv = null;
    for (let i = 0; i <= sp.pos; i++) {
      const spi = mpSpec(seed, layer - sp.pos + i);
      const t = spi.boss && def.bossTell ? def.bossTell : tell;
      lv = genLayer({ seed, nodeId: sp.nodeId, idx: i, n: spi.n, tell: t, prevSafe, loot: false, mark });

  async function copyRoomCode(m) {

    await Net.set(`${base}/members/${MY_ID}`, { name: prof.name, logo: prof.logo, style: prof.style, joined: Date.now(), online: true });
    Net.onDisconnectSet(`${base}/members/${MY_ID}/online`, false);
    Net.onDisconnectRemove(`${base}/cursors/${MY_ID}`);
    const m = st.mp = { code, me: MY_ID, meta: null, members: {}, cursors: {}, round: 0, state: null, unsubs: [], cursorAt: 0, emoteAt: 0, seenEmotes: new Set(), dropWatch: {}, autoSeen: new Set() };
    // Don't replay emotes sent before we arrived.
    const old = await Net.get(`${base}/emotes`);
    if (old) for (const k of Object.keys(old)) m.seenEmotes.add(k);
    m.unsubs.push(Net.watch(`${base}/members`, 'value', v => { if (st.mp === m) { m.members = v || {}; mpHostDuties(); } }));
    m.unsubs.push(Net.watch(`${base}/cursors`, 'value', v => { if (st.mp === m) m.cursors = v || {}; }));
    m.unsubs.push(Net.watch(`${base}/emotes`, 'child_added', (v, key) => { if (st.mp === m && !m.seenEmotes.has(key)) { m.seenEmotes.add(key); mpShowEmote(v); } }));
    m.unsubs.push(Net.watch(`${base}/meta`, 'value', v => { if (st.mp === m && v) { m.meta = v; mpOnMeta(); } }));
    await swapTo(mpLobby);
  }

  // Things only the host does: let newcomers into an unfilled game, and knock out a
  // player who disconnects on their turn (so the game can't stall).
  function mpHostDuties() {
    const m = st.mp;
    if (!m || !m.meta || !amHost()) return;
    if (m.meta.status === 'lobby') {
      const picks = Object.assign({}, m.meta.picks || {});
      const ids = Object.keys(m.members).filter(id => m.members[id].online && !(m.meta.kicked || {})[id]).sort((a, b) => m.members[a].joined - m.members[b].joined);
      let changed = false;
      // Seat each newcomer once, when they first arrive (if there's room); after that,
      // only the host's own choices change who plays.
      for (const id of ids) {
        if (m.autoSeen.has(id)) continue;
        m.autoSeen.add(id);
        if (!picks[id] && Object.keys(picks).filter(p => m.members[p] && m.members[p].online).length < m.meta.max) { picks[id] = true; changed = true; }
      }
      if (changed) Net.update(`rooms/${m.code}/meta`, { picks });
    }
  }

  function mpOnMeta() {
    const m = st.mp;
    if (m.meta.kicked && m.meta.kicked[m.me]) {
      mpLeave();
      // Say so once the title screen is up (it sets its own message when it opens).
      (async () => { while (st.transitioning || st.mode !== 'title') await wait(50); setMsg('> you were removed from the room.', C.red); })();
      return;
    }
    if (m.meta.status === 'playing' && m.meta.round && m.meta.round !== m.round) mpBeginRound(m.meta.round);
    else if (m.meta.status === 'lobby' && m.round && (st.panelTitle === 'RESULT' || (m.state && m.state.winner))) {
      // The host called everyone back to the lobby.
      m.state = null; st.lv = null;
      (async () => { while (st.transitioning) await wait(50); swapTo(mpLobby); })();
    }
    mpHostDuties();
  }

  // ---- lobby
  function mpLobby() {
    scenePalette(null);
    openPanel('LOBBY', (T, B, X) => {
      const m = st.mp;
      if (!m || !m.meta) { T('connecting...', C.mid); return; }
      const host = amHost(), picks = m.meta.picks || {};
      const copied = m.copiedAt && performance.now() - m.copiedAt < 1500;
      X({ gap: 2, row: [
        { text: `ROOM  ${m.code.split('').join(' ')}`, col: C.cyan },
        { text: copied ? '[ COPIED ]' : '[ COPY ]', id: 'mpcopy', sel: copied, onTap: () => copyRoomCode(m) },
      ] });
      T('share the code to invite people.', C.dim);
      T('');
      if (host) {
        X({ gap: 1, row: [
          { text: 'players' },
          { text: '[-]', id: 'mpmaxd', onTap: () => { Net.update(`rooms/${m.code}/meta`, { max: Math.max(2, m.meta.max - 1) }); Sound.tick(); } },
          { text: String(m.meta.max), col: C.bright },
          { text: '[+]', id: 'mpmaxu', onTap: () => { Net.update(`rooms/${m.code}/meta`, { max: Math.min(MP_MAX, m.meta.max + 1) }); Sound.tick(); } },
        ] });
      } else T(`players: ${m.meta.max}`, C.mid);
      const clk = mpClock();
      if (host) {
        const i = MP_CLOCKS.indexOf(clk);
        X({ gap: 1, row: [
          { text: 'turn clock' },
          { text: '[-]', id: 'mpclkd', onTap: () => { Net.update(`rooms/${m.code}/meta`, { clock: MP_CLOCKS[Math.max(0, i - 1)] }); Sound.tick(); } },
          { text: clk ? `${clk}s` : 'off', col: C.bright },
          { text: '[+]', id: 'mpclku', onTap: () => { Net.update(`rooms/${m.code}/meta`, { clock: MP_CLOCKS[Math.min(MP_CLOCKS.length - 1, i + 1)] }); Sound.tick(); } },
        ] });
        X({ text: `[ kick: ${m.kickMode ? 'ON ' : 'OFF'} ]`, id: 'mpkick', onTap: () => { m.kickMode = !m.kickMode; Sound.tick(); } });
      } else T(`turn clock: ${clk ? clk + 's' : 'off'}`, C.mid);
      T(host ? (m.kickMode ? 'tap someone to remove them.' : 'tap people to choose who plays.') : '', m.kickMode ? C.red : C.dim);
      const ids = Object.keys(m.members).filter(id => !(m.meta.kicked || {})[id]).sort((a, b) => m.members[a].joined - m.members[b].joined).slice(0, 8);
      for (const id of ids) {
        const mem = m.members[id], plays = !!picks[id];
        const tags = [id === mpHostId() ? 'HOST' : '', !mem.online ? 'GONE' : plays ? 'PLAY' : 'WATCH'].filter(Boolean).join(' ');
        X({
          list: true, id: 'mem_' + id, sel: id === m.me,
          name: `${logoMark(mem.logo)} ${mem.name}`, col: mem.online ? mpColor(id) : C.dim, tint: mem.online ? mpBg(id) : null,
          right: tags, rightCol: plays ? C.cyan : C.mid,
          onTap: () => {
            if (host && m.kickMode) { mpKick(id); return; }
            if (!host || !mem.online) return;
            const next = Object.assign({}, picks);
            if (next[id]) delete next[id];
            else if (Object.keys(next).filter(p => m.members[p] && m.members[p].online).length < m.meta.max) next[id] = true;
            else { Sound.deny(); return; }
            Net.update(`rooms/${m.code}/meta`, { picks: next });
            Sound.tick();
          },
        });
      }
      T('');
      const ready = Object.keys(picks).filter(id => m.members[id] && m.members[id].online).length;
      if (host) X({ box: true, text: 'S T A R T', sub: `${ready} playing`, id: 'mpstart', onTap: mpStartRound, minW: 22, disabled: ready < 2 });
      else T('waiting for the host to start' + '.'.repeat(1 + Math.floor(performance.now() / 400) % 3), C.mid);
      B('[ LEAVE ]', 'mpleave', mpLeave);
    }, '> lobby.');
    st.keyHandler = k => { if (k === 'escape') { mpLeave(); return true; } return false; };
  }

  async function mpStartRound() {
    const m = st.mp;
    if (!m || !amHost()) return;
    const ids = Object.keys(m.meta.picks || {}).filter(id => m.members[id] && m.members[id].online);
    if (ids.length < 2) { Sound.deny(); return; }
    const n = (m.meta.round || 0) + 1;
    await Net.set(`rooms/${m.code}/rounds/${n}`, { seed: newSeed(), order: shuffle(ids.slice(), Math.random) });
    await Net.update(`rooms/${m.code}/meta`, { round: n, status: 'playing' });
  }

  // ---- a game (round)
  async function mpBeginRound(n) {
    const m = st.mp;
    m.round = n;
    const rd = await Net.get(`rooms/${m.code}/rounds/${n}`);
    if (!rd || st.mp !== m || m.round !== n) return;
    const max = CONFIG.startIntegrity, per = v => Object.fromEntries(rd.order.map(id => [id, v]));
    m.seed = rd.seed;
    m.state = { layer: 1, order: rd.order, alive: per(true), hp: per(max), max, cleared: per(0), turn: rd.order[0], winner: null, out: [] };
    m.waiting = false;
    if (m.unmoves) m.unmoves();
    // Moves wait until the first layer is on screen, then apply one at a time, in order.
    m.queue = new Promise(res => { m.ready = res; });
    m.unmoves = Net.watch(`rooms/${m.code}/moves/${n}`, 'child_added', mv => { m.queue = m.queue.then(() => mpApply(mv, n)).catch(e => console.error('multiplayer move failed', e)); });
    while (st.transitioning) await wait(50);
    swapTo(mpEnterLayer);
  }

  function mpEnterLayer() {
    const m = st.mp;
    if (!m || !m.state) return;
    const lv = mpLayer(m.seed, m.state.layer);
    st.corp = null; st.lv = lv; st.hover = -1; st.timer = null;
    scenePalette(lv.spec.corp);
    showBoard('play');
    st.busy = false;
    if (lv.boss) { Sound.boss(); shake(5, 0.5); } else Sound.layer(m.state.layer);
    mpTurnMsg();
    if (m.ready) { m.ready(); m.ready = null; }
  }

  // Called whenever the turn may have changed: restarts the turn clock, and makes a
  // fuss when it becomes your turn.
  function mpTurnMsg() {
    const m = st.mp;
    if (!m || !m.state || m.state.winner) return;
    const key = `${m.state.layer}:${m.state.turn}:${m.applied || 0}`;
    if (key !== m.turnKey) {
      m.turnKey = key;
      m.turnStart = performance.now();
      m.clockLast = null;
      m.nudged = false;
      if (mpMine()) {
        m.yourTurnAt = performance.now(); Sound.yourTurn(); flash(C.cyan, 0.1, 0.4);
        try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) { /* not supported */ }
      }
    }
    if (mpMine()) setMsg('> your turn. pick a node.', C.cyan);
    else setMsg(`> ${mpName(m.state.turn).toLowerCase()} is picking...`, C.mid);
  }

  // Whose turn, on the board itself: your turn = the board's edges glow in your colors;
  // someone else's turn = the board is tinted with theirs (you're watching).
  function mpTurnFrame({ now, bg }) {
    const m = st.mp;
    if (!m || !m.state || m.state.winner) return;
    if (mpMine()) {
      const sty = mpStyle(m.me), col = sty ? sty.fg : C.cyan, a = 0.35 + 0.25 * Math.sin(now / 250);
      for (let r = 0; r < L.gh; r++) { bg(0, BOARD_Y + r, 1, col, a); bg(L.wc - 1, BOARD_Y + r, 1, col, a); }
    } else {
      const sty = mpStyle(m.state.turn);
      for (let r = 0; r < L.gh; r++) bg(0, BOARD_Y + r, L.wc, sty ? sty.bg : C.dim, 0.2);
    }
  }

  // "YOUR TURN" across the board for a moment.
  function mpTurnBanner({ now, put, bg }) {
    const m = st.mp;
    const age = now - (m.yourTurnAt || -1e9);
    if (!mpMine() || age > 1300) return;
    const y = BOARD_Y + Math.floor(L.gh / 2), a = 0.45 * (1 - age / 1300);
    for (let r = -1; r <= 1; r++) bg(0, y + r, L.wc, C.cyan, a);
    const text = 'Y O U R   T U R N';
    put(Math.floor((L.wc - text.length) / 2), y, text, C.bright, 'mp', true);
  }

  // Turn clock: the host sets it in the lobby (0 = off). When it runs out on your
  // turn, a random node is picked for you.
  const MP_CLOCKS = [0, 10, 15, 20, 30];
  const mpClock = () => (st.mp && st.mp.meta && st.mp.meta.clock != null) ? st.mp.meta.clock : 20;
  function mpClockLeft(now) {
    const m = st.mp, sec = mpClock();
    if (!sec || !m || !m.state || m.state.winner || m.turnStart == null) return null;
    return Math.max(0, sec - (now - m.turnStart) / 1000);
  }
  function mpClockTick(now) {
    const m = st.mp;
    if (!m || !m.state || m.state.winner || !mpMine() || st.busy || m.waiting || st.wipe || st.mode !== 'play') return;
    // nudge once if you haven't picked after 5s: the chime and banner again
    if (!m.nudged && m.turnStart != null && now - m.turnStart > 5000) { m.nudged = true; m.yourTurnAt = now; Sound.yourTurn(); }
    const left = mpClockLeft(now);
    if (left == null) return;
    const s = Math.ceil(left);
    if (s !== m.clockLast) { m.clockLast = s; if (s <= 5 && s > 0) Sound.clock(); }
    if (left <= 0) {
      const open = st.lv.tiles.map((t, i) => [t, i]).filter(([t]) => t.state === 'closed');
      if (!open.length) return;
      mpTap(open[Math.floor(Math.random() * open.length)][1]);
      setMsg('> clock ran out. random pick!', C.red);
    }
  }

  // Browser tab title: flashes "YOUR TURN" while it's your turn and the tab isn't in front.
  let baseTitle = null;
  function mpTabTitle(now) {
    if (typeof document === 'undefined' || document.title == null) return;
    if (baseTitle == null) baseTitle = document.title;
    const want = st.mp && st.mp.state && !st.mp.state.winner && st.mode === 'play' && mpMine() && document.hidden
      ? (Math.floor(now / 700) % 2 ? '▶ YOUR TURN' : baseTitle) : baseTitle;
    if (document.title !== want) document.title = want;
  }

  // Host: remove someone from the room.
  function mpKick(id) {
    const m = st.mp;
    if (!m || !amHost() || id === m.me) return;
    const picks = Object.assign({}, m.meta.picks || {});
    delete picks[id];
    Net.update(`rooms/${m.code}/meta`, { picks, ['kicked/' + id]: true });
    Sound.deny();
  }

  // Tapping a node on your turn sends the move; it resolves when it comes back.
  function mpTap(i) {
    const m = st.mp;
    if (!m || !m.state || m.state.winner || st.busy || m.waiting) return;
    if (!mpPlaying()) { setMsg('> you are spectating.', C.mid); return; }
    if (!mpMine()) { Sound.deny(); setMsg('> not your turn.', C.mid); return; }
    const t = st.lv.tiles[i];
    if (!t || t.state !== 'closed') return;
    m.waiting = true;
    t.probing = true;
    Net.push(`rooms/${m.code}/moves/${m.round}`, { by: m.me, tile: i, layer: m.state.layer });
  }

  function mpKnockOut(S, id, why) {
    S.alive[id] = false;
    S.out.push(id);
    const mine = id === st.mp.me;
    setMsg(mine ? `> you are out. ${why}` : `> ${mpName(id).toLowerCase()} is out. ${why}`, mine ? C.red : C.mid);
    const alive = S.order.filter(p => S.alive[p]);
    if (alive.length <= 1) { S.winner = alive[0] || id; return true; }
    return false;
  }

  async function mpApply(mv, n) {
    const m = st.mp;
    if (!m || !m.state || !mv || n !== m.round) return;
    const S = m.state;
    if (S.winner || mv.by !== S.turn || mv.layer !== S.layer) return;   // ignore anything out of turn
    m.applied = (m.applied || 0) + 1;
    if (mv.kind === 'drop') {
      const over = mpKnockOut(S, mv.by, 'disconnected.');
      if (over) return mpOver();
      S.turn = nextAlive(S, mv.by);
      await wait(600);
      mpTurnMsg();
      return;
    }
    const lv = st.lv, t = lv && lv.tiles[mv.tile];
    if (!t || t.state !== 'closed') return;
    const mine = mv.by === m.me, who = mpName(mv.by).toLowerCase();
    st.busy = true;
    t.probing = true;
    Sound.probe();
    setMsg(mine ? '> probing...' : `> ${who} probes a node...`, C.mid);
    await wait(mine ? 300 : 650);   // a bit longer for others, so you can see what they picked
    t.probing = false;
    m.waiting = false;
    if (t.safe) {
      const perfect = lv.misses === 0;
      if (perfect) S.hp[mv.by] = Math.min(S.max, S.hp[mv.by] + 1);
      S.cleared[mv.by]++;
      t.state = 'safe';
      Sound.safe();
      flash(C.cyan, 0.12, 0.3);
      setMsg(mine ? (perfect ? '> perfect. layer cleared. +1 int' : '> you cleared the layer.') : `> ${who} cleared the layer.`, mine ? C.cyan : C.mid);
      await wait(420);
      const idx = lv.tiles.indexOf(t);
      const lit = buildScene(performance.now(), false, true).filter(c => c.own === 't' + idx);
      await wipeOut(perfect || lv.boss ? 2 : 1, lit);
      S.layer++;
      S.turn = nextAlive(S, mv.by);
      mpEnterLayer();
    } else {
      lv.misses++;
      t.state = 'locked'; t.lockedBy = 'hit'; t.hitAt = performance.now();
      S.hp[mv.by] -= lv.dmg;
      Sound.trap();
      shake(mine ? 9 : 4);
      if (mine) flash(C.red, 0.18, 0.35);
      setMsg(mine ? '> ICE. your integrity -1.' : `> ${who} hit ICE. -1.`, mine ? C.red : C.mid);
      await wait(500);
      if (S.hp[mv.by] <= 0) {
        if (mine) Sound.death(true);   // play goes on: dings only, the music keeps going
        if (mpKnockOut(S, mv.by, 'traced.')) return mpOver();
        await wait(700);
      }
      S.turn = nextAlive(S, mv.by);
      st.busy = false;
      mpTurnMsg();
    }
  }

  async function mpOver() {
    const m = st.mp, S = m.state, won = S.winner === m.me;
    if (won) Sound.victory(); else if (S.alive[m.me] === undefined || !S.alive[m.me]) Sound.win();
    await wait(won ? 400 : 900);
    while (st.transitioning) await wait(50);
    await swapTo(() => {
      scenePalette(null);
      openPanel('RESULT', (T, B, X) => {
        const mm = st.mp;
        if (!mm || !mm.state) return;
        const SS = mm.state, w = SS.winner;
        X({ text: w === mm.me ? 'Y O U   W I N' : `${mpName(w)} WINS`, col: w === mm.me ? C.cyan : mpColor(w), bold: true });
        T(`reached layer ${pad2(SS.layer)}`, C.mid);
        T('');
        // Standings: the winner, then the last one knocked out, and so on.
        const ranking = [w, ...SS.out.slice().reverse()];
        ranking.forEach((id, i) => {
          const mem = mpMember(id);
          T(`${i + 1}. ${logoMark(mem.logo)} ${mem.name.padEnd(12)} cleared ${SS.cleared[id] || 0}`.padEnd(34), i === 0 ? C.bright : C.text);
        });
        T('');
        if (amHost()) X({ box: true, text: 'N E X T   G A M E', sub: 'back to the lobby', id: 'mpnext', onTap: mpNextGame, minW: 24 });
        else T('waiting for the host...', C.mid);
        B('[ LEAVE ]', 'mpleave', mpLeave);
      }, won ? '> you win.' : `> ${mpName(S.winner).toLowerCase()} wins.`);
      if (won) fireworkShow(9, 280, 'panel');
    });
  }

  function mpNextGame() {
    const m = st.mp;
    if (!m || !amHost()) return;
    Net.update(`rooms/${m.code}/meta`, { status: 'lobby' });
  }

  // Host: knock out a player who has been offline on their turn for 5 seconds.
  function mpWatchdog(now) {
    const m = st.mp;
    if (!m || !m.state || m.state.winner || !amHost() || st.busy) return;
    const id = m.state.turn, on = (m.members[id] || {}).online;
    if (on) { delete m.dropWatch[id]; return; }
    if (!m.dropWatch[id]) m.dropWatch[id] = now;
    else if (now - m.dropWatch[id] > 5000 && !m.dropSent) {
      m.dropSent = true;
      Net.push(`rooms/${m.code}/moves/${m.round}`, { kind: 'drop', by: id, layer: m.state.layer });
      setTimeout(() => { if (st.mp === m) m.dropSent = false; }, 2000);
    }
  }

  // ---- shared cursors
  function mpSendCursor(x, y) {
    const m = st.mp;
    if (!m || !m.state || st.mode !== 'play') return;
    const now = performance.now();
    if (now - m.cursorAt < 100) return;   // about 10 updates a second at most
    m.cursorAt = now;
    Net.set(`rooms/${m.code}/cursors/${m.me}`, { x: Math.round(x * 2) / 2, y: Math.round(y * 2) / 2, r: m.round });
  }
  function mpDrawCursors({ put, bg }) {
    const m = st.mp;
    if (!m || !m.state || st.mode !== 'play') return;
    for (const [id, c] of Object.entries(m.cursors)) {
      if (id === m.me || !c || c.r !== m.round) continue;
      const mem = mpMember(id), col = mpColor(id);
      bg(c.x - 0.5, c.y - 0.5, 1, mpBg(id) || col, mpBg(id) ? 0.9 : 0.35);
      put(c.x, c.y, logoChar(mem.logo), col, 'mp', true);
      put(c.x + 1, c.y + 0.6, mpShort(id).toLowerCase(), col, 'mp');
    }
  }

  // ---- emotes
  function mpSendEmote(e) {
    const m = st.mp;
    if (!m) return;
    const now = performance.now();
    if (now - m.emoteAt < 1200) { Sound.deny(); return; }   // no spamming
    m.emoteAt = now;
    Net.push(`rooms/${m.code}/emotes`, { by: m.me, e });
  }
  function mpShowEmote(v) {
    if (!v || !EMOTES.includes(v.e)) return;
    const mem = mpMember(v.by), col = mpColor(v.by);
    setMsg(`> ${mem.name.toLowerCase()}: ${v.e}`, col);
    Sound.tick();
    // The emote floats up from the sender's cursor (or the middle of the board).
    const c = st.mp.cursors[v.by];
    const x = c && c.r === st.mp.round && st.mode === 'play' ? pxX(c.x) : pxX(L.wc / 2 + rand(-6, 6));
    const y = c && c.r === st.mp.round && st.mode === 'play' ? pxY(c.y - 1) : pxY(BOARD_Y + L.gh / 2);
    const text = `${logoChar(mem.logo)} ${v.e}`;
    [...text].forEach((ch, i) => parts.push({
      mode: 'float', ch, x: x + (i - text.length / 2) * L.cw, y, col, t: 0, life: 2.2, alpha: 1, rot: 0, scr: 0,
    }));
  }
  // Tray during multiplayer: emote buttons and your status.
  function mpTray(ctx, y) {
    const { put, addHit, bg } = ctx;
    const rows = [EMOTES.slice(0, 5), EMOTES.slice(5)];
    rows.forEach((row, r) => {
      let x = 0;
      for (const e of row) {
        const label = `[${e}]`, id = 'emo_' + e;
        if (st.hoverBtn === id) bg(x, y + r * 2, label.length, C.cyan, 0.2);
        put(x, y + r * 2, label, C.bright, 'tray');
        addHit(x, y + r * 2, label.length, 1, { kind: 'btn', id, onTap: () => mpSendEmote(e), noFocus: true });
        x += label.length + 2;
      }
    });
    const m = st.mp;
    const status = !m.state ? '' : m.state.winner ? '' : mpPlaying() ? (mpMine() ? 'your turn' : '') : 'spectating';
    put(0, y + 1, 'emotes', C.dim);
    if (status) put(L.wc - status.length, y + 1, status, mpMine() ? C.cyan : C.mid);
    // Turn clock bar
    const left = st.mode === 'play' ? mpClockLeft(performance.now()) : null;
    if (left != null && m.state) {
      const total = mpClock(), w = 20, fill = Math.ceil(w * left / total), low = left <= 5;
      const who = mpMine() ? 'YOUR CLOCK ' : 'clock      ';
      put(0, y + 3, who, mpMine() ? C.cyan : C.mid, 'tray', mpMine());
      put(who.length, y + 3, '='.repeat(fill), low ? C.red : mpMine() ? C.cyan : C.mid, 'tray');
      put(who.length + w + 1, y + 3, `${Math.ceil(left)}s`, low ? C.red : C.text, 'tray');
    }
  }

  function mpLeave() {
    const m = st.mp;
    if (m) {
      try {
        for (const u of m.unsubs) u();
        if (m.unmoves) m.unmoves();
        Net.update(`rooms/${m.code}/members/${m.me}`, { online: false });
        Net.remove(`rooms/${m.code}/cursors/${m.me}`);
      } catch (e) { /* ignore */ }
    }
    st.mp = null; st.lv = null; st.busy = false;
    swapTo(showTitle);
  }

  // ---------------- Music state ----------------
  // Which song and how intense, from what's on screen. Read by the music scheduler.
  function musicState() {
    // The dev music player takes over while it's open.
    if (st.dev && st.devPage === 'tracks' && st.preview) {
      const p = st.preview, tr = SONGS[p.key];
      return { song: p.playing ? p.key : 'none', level: p.level, urgency: p.urgency, low: p.low,
        tempo: 1 + (tr && tr.tick ? p.urgency * 0.25 : 0) + (p.level >= 3 ? 0.05 : 0) };
    }
    const run = st.run;
    let song = 'theme', level = 1, urgency = 0;
    if (st.mp && st.mp.state && st.mode === 'play' && st.lv && st.lv.spec) {
      const sp = st.lv.spec;
      return { song: MUSIC_FOR[sp.corp], level: sp.boss ? 3 : clamp(sp.pos, 0, 2), urgency: 0, low: mpPlaying() && st.mp.state.hp[st.mp.me] <= 1, tempo: sp.boss ? 1.05 : 1 };
    }
    // Menus (title, settings, codex, how to play, profile, multiplayer menu / lobby,
    // game over) get the mellow menu track; gameplay keeps the theme and corp songs.
    const inMenu = st.mode === 'title' || st.mode === 'over' || (!st.run && !(st.mp && st.mp.state && st.mode === 'play'));
    if (st.hideAll && !st.dying) song = 'none';           // the end-of-run screen glitch: silence (a death powers down instead)
    else if (inMenu) song = 'menu';
    else if (st.corp && st.corp.hasBoss) {
      song = st.corp.def.key;
      if (st.intro) level = 0;
      else if (st.mode === 'play' && st.lv) level = st.lv.boss ? (song === 'omni' ? 4 : 3) : clamp(st.corp.idx, 0, 2);
      else if (st.mode === 'panel' && st.panelTitle === 'CORP BREACHED') { song = 'theme'; level = 1; }   // boss reward: back to the overworld track
      else level = 0;                                      // between the intro and the first layer
      if (st.timer && st.timer.max) urgency = clamp(1 - st.timer.left / st.timer.max, 0, 1);
      if (song === 'chronos' && st.lv && st.lv.boss) urgency = Math.min(1, urgency + st.lv.misses * 0.25);
      if (song !== 'chronos') urgency *= 0.3;
    } else if (st.corp) level = 0;                         // public net
    const low = !!(run && st.mode === 'play' && run.integrity <= 1 && !st.dying);
    const tempo = 1 + (song === 'chronos' ? urgency * 0.25 : 0) + (level >= 3 ? 0.05 : 0);
    const track = song === 'none' ? 'none' : MUSIC_FOR[song === 'theme' ? 'map' : song] || song;
    return { song: track, level, urgency, low, tempo };
  }
  Music.setSource(musicState);

  // ---------------- Boot ----------------
  window.addEventListener('resize', resize);
  applyPalette(save.palette, true);
  st.msgCol = C.text;
  resize();
  showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`16px "JetBrains Mono"`).then(() => computeLayout()).catch(() => {});
    document.fonts.load(`800 16px "JetBrains Mono"`).catch(() => {});   // OMNI's heavy weight
  }

  // Debug hook for the console and automated tests.
  window.__br = {
    state: st, save, C, Music, musicState, CORPS, FINAL, DRAW_FONT, SONGS, MUSIC_FOR, openTrackPlayer, trackLines, HELP_PAGES, Net, openMultiplayer, mpHost, mpLayer, mpSpec, mpStartRound, mpNextGame, mpSendEmote, mpLeave, amHost, mpKick, openProfile, genLayer, genMap, CONFIG, MODS, ITEMS,
    startRun, selectNode, enterNode, pick, useItem, activateMod, modUsable, addMod, removeMod, addItem, pickMods, swapLines,
    toggleDev, devLines, availableNodes, panelLines, swapTo, openHelp, openCodex, openSettings, showTitle, buildScene,
    addSector, sectorClear, showSectorClear, pushOn, cashOut, resumeRun, openBoard, LEGACY, legacyLv, repFor, saveRun, savedRun, clearRun,
    askSkip, scrollMapSector, sectorViewRow, SKIP_BOSS, toMap,
    togglePause, pauseLines, abandonRun, moveFocus, moveTileCursor, moveMapCursor,
  };
})();
</script>
