      if (gi >= 0) markSeen('g' + gi);
      if (t.loaded) markSeen('gloot');
      if (t.marked) markSeen('gsig');
    }
    if (n === 1) markSeen('gjack');
    if (lv.maskAt) markSeen('gmask');
    st.timer = makeTimer();
    showBoard('play');
    st.busy = true;
    if (boss) { Sound.boss(); shake(5, 0.5); setMsg(`> BOSS LAYER. ${n} nodes.`, C.red); }
    else { Sound.layer(run.depth); setMsg(n === 1 ? '> one node. it is real. jack in.' : `> ${n} nodes. one is real.`); }
    await wait(480);
    // Layer-start mods, each locks at most one ICE node.
    const iceWhere = f => lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed' && f(t));
    const starts = [
      ['sniffer', () => true],
      ['corners', t => (t.col === 0 || t.col === lv.cols - 1) && (t.row === 0 || t.row === lv.rows - 1)],
      ['sigscan', t => t.marked],
    ];
    for (const [key, f] of starts) {
      if (!has(key) || n < 2) continue;
      const opts = iceWhere(f);
      if (!opts.length) continue;
      lockTile(pickR(opts, rngFor(run.seed, key, c.node.id, c.idx)), C.mid, key);
      setMsg(`> ${MODS[key].name.toLowerCase()}: 1 ICE locked.`, C.mid);
      await wait(250);
    }
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // Clock for this layer: the corp's own, or one added by OVERCLOCK.
  function makeTimer() {
    const c = st.corp, lv = st.lv;
    let max = c.timer || (has('overclock') && c.hasBoss ? CONFIG.overclockClock : 0);
    if (!max) return null;
    if (lv && lv.boss && c.def.bossShrink) max = Math.max(3, max - 3 * lv.misses);
    if (has('coolant')) max += 3;
    return { max, left: max, lastSec: max, ocNext: CONFIG.overclockStart };
  }

  // Lock a trap tile without damage (sniffer, purge).
  // source: what locked it (purge, burner, sniffer, corners, sigscan, echo, overclock).
  function lockTile(t, col, source = 'purge') {
    const i = st.lv.tiles.indexOf(t);
    const { x, y } = tileCenter(t);
    explode(snapshot(c => c.own === 't' + i), x, y, { col, power: 0.6 });
    t.state = 'locked';
    t.lockedBy = source;
    Sound.shield();
  }

  function updateTimer(dt) {
    const tm = st.timer;
    if (!tm || st.mode !== 'play' || st.busy || st.transitioning || st.dev || st.pause) return;
    tm.left -= dt;
    const sec = Math.ceil(tm.left);
    if (sec < tm.lastSec) { tm.lastSec = sec; if (sec <= 3 && sec > 0) Sound.clock(); }
    // OVERCLOCK: near the end, purge ICE one by one; each purge cuts the payout.
    const lv = st.lv;
    if (has('overclock') && tm.left <= tm.ocNext && tm.left > 0.5 && lv.ocCount < 3) {
      tm.ocNext -= 2;
      const opts = lv.tiles.filter(t => !t.safe && t.state === 'closed');
      if (opts.length > 0 && candidates().length > 1) {
        lockTile(opts[Math.floor(Math.random() * opts.length)], C.mid, 'overclock');
        lv.ocCount++;
        lv.payCut = Math.min(0.9, lv.payCut + CONFIG.overclockCut);
        setMsg(`> overclock: purged 1. pay -${Math.round(lv.payCut * 100)}%`, C.mid);
      }
    }
    if (tm.left <= 0) {
      tm.left = 0;
      const opts = candidates().length ? candidates() : st.lv.tiles.filter(t => t.state === 'closed');
      const t = opts[Math.floor(Math.random() * opts.length)];
      setMsg('> clock ran out.', C.red);
      if (t) pick(st.lv.tiles.indexOf(t));
    }
  }

  function resetTimer() {
    if (!st.timer) return;
    st.timer = makeTimer();
  }

  async function pick(i) {
    if (st.mode !== 'play' || st.busy) return;
    const t = st.lv.tiles[i];
    if (!t || t.state !== 'closed') return;
    st.busy = true;
    st.selItem = -1; st.selMod = -1;
    st.lv.fast = st.lv.readyAt != null && performance.now() - st.lv.readyAt < CONFIG.fastpayMs;
    t.probing = true;
    Sound.probe();
    setMsg('> probing...', C.mid);
    await wait(300);
    t.probing = false;
    if (t.safe) await onSafe(t);
    else await onTrap(t, i);
  }

  function payFor(lv) {
    const c = st.corp;
    let base = 4 + 2 * lv.n;
    if (lv.boss) base *= 3;
    let mult = c.pay || 1;
    if (lv.misses === 0 && lv.n > 1) mult *= 1 + 0.5 * (lv.n - 1);
    if (has('skimmer')) mult *= 1.5;
    if (has('fastpay') && lv.fast) mult *= 1.5;
    mult *= 1 - (lv.payCut || 0);
    return lv.n === 1 ? 0 : Math.round(base * mult);
  }

  async function onSafe(t) {
    const run = st.run, lv = st.lv, c = st.corp;
    t.state = 'safe';
    const perfect = lv.misses === 0 && lv.n > 1;
    const pay = payFor(lv);
    run.credits += pay; run.earned += pay;
    let healed = false;
    if (perfect && run.integrity < run.maxInt) { run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.perfectHeal); healed = true; }
    Sound.safe();
    flash(C.cyan, 0.12, 0.3);
    let msg = perfect ? '> perfect.' : '> access granted.';
    if (pay) msg += ` +${pay}cr`;
    if (healed) msg += ' +1 int';
    setMsg(msg, C.cyan);
    await wait(380);
    // Success wipe: the real node stays lit while the fill rises. Bigger for perfect / boss.
    const i = lv.tiles.indexOf(t);
    const lit = buildScene(performance.now(), false, true).filter(cl => cl.own === 't' + i);
    await wipeOut(perfect || lv.boss ? 2 : 1, lit);
    c.idx++;
    if (c.idx < c.counts.length) return enterLayer();
    // Corp finished
    if (c.node.type === 'start') return openStartReward(c.node);
    run.corps++;
    if (c.node.type === 'final') return endRun(true);
    openReward(c.node);
  }

  async function onTrap(t, i) {
    const run = st.run, lv = st.lv;
    lv.misses++;
    t.state = 'locked';
    t.lockedBy = 'hit';
    t.hitAt = performance.now();
    let msg;
    if (t.loaded && has('forgery')) {
      Sound.shield();
      msg = '> $ node. forgery: no damage.';
    } else if (has('bulwark') && !st.corp.bulwarkUsed) {
      st.corp.bulwarkUsed = true;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. bulwark blocked it.';
    } else if (run.shield > 0) {
      run.shield--;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. firewall absorbed it.';
    } else {
      run.integrity -= lv.dmg;
      Sound.trap();
      shake(9);
      flash(C.red, 0.18, 0.35);
      msg = run.integrity > 0 ? `> ICE. integrity -${lv.dmg}.` : '> ICE. integrity gone.';
    }
    if (t.loaded) msg += ' ' + grantLoot(rngFor(run.seed, 'loot', st.corp.node.id, st.corp.idx), st.corp.tier);
    if (has('tracer')) {
      const s = lv.tiles[lv.safe];
      t.dist = Math.abs(s.col - t.col) + Math.abs(s.row - t.row);
    }
    setMsg(msg, t.loaded ? C.gold : C.red);
    await wait(450);
    if (run.integrity <= 0) return die();
    // ECHO: the mirror-image node locks too, if it's ICE.
    if (has('echo')) {
      const mc = lv.cols - 1 - t.col;
      const m = lv.tiles.find(o => o.col === mc && o.row === t.row && o !== t && o.state === 'closed' && !o.safe);
      if (m) { lockTile(m, C.mid, 'echo'); await wait(200); }
    }
    resetTimer();
    st.busy = false;
    lv.readyAt = performance.now();
  }

  // Credits or an item. Returns a short text for the message line.
  function grantLoot(r, tier) {
    const run = st.run;
    Sound.loot();
    if (r() < 0.4 && run.items.length < run.beltSlots) {
      const key = pickR(Object.keys(ITEMS), r);
      run.items.push(key);
      markSeen(key);
      return `got ${ITEMS[key].name}.`;
    }
    const cr = Math.round(12 + tier * 8 + r() * 12);
    run.credits += cr; run.earned += cr;
    return `+${cr}cr`;
  }

  async function die() {
    st.busy = true;
    st.timer = null;
    const safeTile = st.lv.tiles[st.lv.safe];
    if (safeTile.state === 'closed') safeTile.state = 'reveal';
    setMsg('> traced. real node revealed.', C.red);
    Sound.death();
    await wait(1100);
    await endRun(false);
  }

  async function endRun(win) {
    const run = st.run;
    st.busy = true;
    st.timer = null;
    const cells = snapshot(() => true);
    st.hideAll = true;
    st.wipe = null;
    if (win) { Sound.win(); implode(cells, W / 2, H / 2); flash(C.cyan, 0.3, 0.8); }
    else { glitchOut(cells); flash(C.red, 0.2, 0.4); }
    await wait(1400);

    const newBest = !run.practice && run.depth > save.best;
    if (!run.practice) {
      save.runs++;
      if (win) save.wins++;
      if (newBest) save.best = run.depth;
    }
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();

    st.result = { win, depth: run.depth, corps: run.corps, earned: run.earned, newBest, practice: run.practice, seed: run.seed };
    st.corp = null; st.lv = null;
    showBoard('over');
    st.busy = false;
    setMsg(win ? '> root access_' : '> link severed_', win ? C.cyan : C.red);
  }

  const jackIn = () => startRun(st.seed, st.practice);
  const retry = () => startRun(st.result ? st.result.seed : st.seed, true);
  const newRun = () => startRun(newSeed(), false);

  // ---------------- Panels ----------------
  function openPanel(title, fn, msg) {
    st.panelTitle = title;
    st.panelFn = fn;
    st.revealed = new Set();
    showBoard('panel');
    st.panelT0 = performance.now() + (st.wipe ? st.wipe.dur : 0) + CONFIG.revealDelay;
    st.busy = false;
    if (msg) setMsg(msg);
  }

  async function leavePanel() {
    if (st.transitioning) return;
    await swapTo(toMap);
  }

  function addMod(key) {
    const run = st.run;
    if (run.mods.includes(key)) return;
    run.mods.push(key);
    markSeen(key);
    const m = MODS[key];
    if (key === 'buffer') { run.maxInt++; run.integrity++; }
    if (key === 'stash') run.beltSlots++;
    if (m.charges) run.charges[key] = m.charges;
  }

  // Up to k mods from a pool that the player doesn't have yet.
  function pickMods(r, pool, k, exclude = []) {
    return shuffle(pool.filter(key => !st.run.mods.includes(key) && !exclude.includes(key)), r).slice(0, k);
  }

  const priceOf = o => o.kind === 'repair' ? o.price : Math.round(o.price * (has('haggle') ? 0.75 : 1));
  const SEP = '+ - - - - - - - - - - - - - - - +';

  function openShop(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'shop', node.id);
    const itemKeys = shuffle(Object.keys(ITEMS), r).slice(0, 3);
    let offers = itemKeys.map(k => ({ kind: 'item', key: k, price: ITEMS[k].price, sold: false }));
    for (const k of pickMods(r, modsOfKind('gen', 'minor'), 2)) offers.push({ kind: 'mod', key: k, price: MODS[k].price, sold: false });
    offers = shuffle(offers, r);   // random order: any slot could be the good one
    offers.push({ kind: 'repair', key: 'repair', price: 20, sold: false });

    const buy = o => {
      const price = priceOf(o);
      if (o.sold || run.credits < price) return Sound.deny();
      if (o.kind === 'item') { if (run.items.length >= run.beltSlots) return Sound.deny(); run.items.push(o.key); o.sold = true; markSeen(o.key); }
      if (o.kind === 'mod') { addMod(o.key); o.sold = true; }
      if (o.kind === 'repair') { if (run.integrity >= run.maxInt) return Sound.deny(); run.integrity++; }
      run.credits -= price;
      Sound.buy();
      setMsg(`> bought ${o.kind === 'repair' ? 'repair' : (o.kind === 'item' ? ITEMS[o.key] : MODS[o.key]).name.toLowerCase()}.`, C.gold);
    };

    let sel = 0;
    const defOf = o => o.kind === 'item' ? ITEMS[o.key] : o.kind === 'mod' ? MODS[o.key] : { name: 'REPAIR', desc: 'restore 1 integrity.' };
    const whyNot = o => {
      if (o.sold) return 'sold out.';
      if (o.kind === 'item' && run.items.length >= run.beltSlots) return 'item belt is full.';
      if (o.kind === 'repair' && run.integrity >= run.maxInt) return 'integrity is full.';
      if (run.credits < priceOf(o)) return 'not enough credits.';
      return null;
    };

    openPanel('BLACK MARKET', (T, B, X) => {
      const now = performance.now();
      T('BLACK MARKET', C.gold);
      T(`credits ${run.credits}${has('haggle') ? '  (haggle -25%)' : ''}`, C.gold);
      T('');
      offers.forEach((o, k) => {
        const def = defOf(o);
        const isMod = o.kind === 'mod';
        const price = o.sold ? 'SOLD' : `${priceOf(o)}cr`;
        const tag = isMod ? 'mod' : o.kind === 'item' ? 'item' : 'svc';
        X({
          list: true, id: 'offer' + k, onTap: () => { sel = k; Sound.tick(); },
          sel: k === sel, faded: !!whyNot(o),
          badge: isMod ? o.key : null, name: def.name,
          col: isMod ? modColor(def) : C.bright,
          right: `${tag} ${price.padStart(5)}`, rightCol: C.gold,
          tint: isMod ? modColor(def) : o.kind === 'item' ? C.mid : C.cyan,
          reveal: k, revealId: 'offer' + k,
          rarity: isMod ? def.rarity : null, seenKey: o.kind === 'repair' ? null : o.key,
        });
      });
      T('');
      // Details box for the selected offer (once it has popped in).
      const o = offers[sel], def = defOf(o), why = whyNot(o);
      const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
      // Fixed height (7 rows) so the layout never jumps while offers pop in.
      T(SEP, C.dim);
      if (!shown) { T('...', C.dim); for (let i = 0; i < 6; i++) T(''); }
      else {
        if (o.kind === 'mod') { X({ badge: o.key }); T(`${RARITY[def.rarity].label} mod`, modColor(def)); }
        else { T(def.name, C.bright); T(o.kind === 'item' ? 'item // single use' : 'service', C.mid); }
        T(o.kind === 'mod' ? def.tip : def.desc, C.text);
        if (why) { T(''); T(why, C.redDim); T(''); T(''); }
        else X({ box: true, text: 'B U Y', sub: `${priceOf(o)}cr`, id: 'buy', onTap: () => buy(o), minW: 18 });
      }
      T(SEP, C.dim);
      B('[ LEAVE ]', 'leave', leavePanel);
    }, '> the market is open.');
  }

  // A reward screen: header lines, then a list of mods to pick one from (or skip).
  function openChoice({ title, col, head = [], options, skipLabel, onSkip, msg }) {
    let sel = 0;
    const take = key => {
      if (st.transitioning) return;
      if (key) { addMod(key); Sound.buy(); setMsg(`> installed ${MODS[key].name.toLowerCase()}.`, C.cyan); }
      else if (onSkip) onSkip();
      leavePanel();
    };
    openPanel(title, (T, B, X) => {
      const now = performance.now();
      T(title, col);
      for (const h of head) T(h[0], h[1]);
      T('');
      if (options.length) T(options.length > 1 ? 'choose one mod:' : 'mod found:', C.mid);
      options.forEach((k, i) => {
        const m = MODS[k];
        X({
          list: true, id: 'opt' + i, onTap: () => { sel = i; Sound.tick(); },
          sel: i === sel, badge: k, name: m.name, col: modColor(m),
          right: RARITY[m.rarity].label, rightCol: modColor(m), tint: modColor(m),
          reveal: i, revealId: 'opt' + i, rarity: m.rarity, seenKey: k,
        });
      });
      if (options.length) {
        T('');
        const k = options[sel], m = MODS[k];
        const shown = now >= st.panelT0 + sel * CONFIG.revealGap;
        T(SEP, C.dim);
        if (shown) {
          X({ badge: k });
          T(m.tip, C.text);
          X({ box: true, text: 'T A K E', id: 'take', onTap: () => take(k), minW: 18 });
        } else { T('...', C.dim); T(''); T(''); T(''); T(''); }
        T(SEP, C.dim);
      }
      T('');
      B(options.length && skipLabel ? skipLabel : '[ CONTINUE ]', 'skip', () => take(null));
    }, msg);
  }

  // PUBLIC NET done: a small starting perk.
  function openStartReward(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'choice', node.id);
    openChoice({
      title: 'LINK ESTABLISHED', col: C.cyan,
      head: [['you are in. pick a starter perk.', C.text]],
      options: pickMods(r, modsOfKind('minor'), 3),
      skipLabel: '[ SKIP  +15cr ]',
      onSkip: () => { run.credits += 15; run.earned += 15; },
      msg: '> link established.',
    });
  }

  function openCache(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'cache', node.id);
    const got = [grantLoot(r, 2)];
    if (has('cachekey')) got.push(grantLoot(r, 2));
    openChoice({
      title: 'DATA CACHE', col: C.gold,
      head: got.map(g => [g, C.bright]),
      options: pickMods(r, modsOfKind('gen', 'minor'), 2),
      skipLabel: '[ SKIP ]',
      msg: '> cache cracked.',
    });
  }

  function openRepair(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'rest', node.id);
    const before = run.integrity;
    run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.repairAmount);
    Sound.buy();
    openChoice({
      title: 'SAFEHOUSE', col: C.cyan,
      head: [[`integrity +${run.integrity - before}`, C.bright]],
      options: pickMods(r, modsOfKind('minor'), 2),
      skipLabel: '[ SKIP ]',
      msg: '> patched up.',
    });
  }

  // Corp boss beaten: one corp-specific mod plus one general mod.
  function openReward(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'reward', node.id);
    const def = corpDef(node.corp);
    const corpPick = pickMods(r, def.mods || [], 1);
    const options = shuffle(corpPick.concat(pickMods(r, modsOfKind('gen'), 1, corpPick)), r);
    Sound.win();
    openChoice({
      title: 'CORP BREACHED', col: C.cyan,
      head: [[def.name, C.text]],
      options,
      skipLabel: '[ SKIP  +20cr ]',
      onSkip: () => { run.credits += 20; run.earned += 20; Sound.loot(); },
      msg: '> corp breached.',
    });
  }

  // ---------------- How to play ----------------
  const HELP_PAGES = [
    { title: 'THE BASICS', tab: 'BASIC', lines: [
      ['each layer hides ONE real node.'], ['every other node is ICE.'], [''],
      ['hit ICE: lose integrity.'], ['integrity at 0: you are traced.'], [''],
      ['first-try pick = PERFECT:', 'cyan'], ['+1 integrity, bigger payout.'], [''],
      ['ODDS = your chance if you guess.', 'mid'], ['beat the odds: read the tell.', 'mid'], [''],
      ['$ nodes: always ICE, drop loot.', 'gold'],
    ] },
    { title: 'THE NET', tab: 'NET', lines: [
      ['climb the map from the bottom.'], ['pick a route. reach the top.'], [''],
      ['P S C M  corps: 3 layers + boss', 'cyan'], ['!        OMNI//CORE, the final', 'red'],
      ['$        black market', 'gold'], ['?        data cache: loot', 'gold'], ['+        safehouse: heal'], [''],
      ['every stop gives you a mod.'], ['bosses offer corp-only mods.'], [''],
      ['deeper corps hide things harder.', 'mid'],
    ] },
    { title: 'THE TRAY', tab: 'TRAY', lines: [
      ['the bottom of the screen.'], [''],
      ['MODS last the whole run.', 'cyan'], ['some are tap-to-use.'], [''],
      ['ITEMS are single use.', 'bright'], ['you start with one PURGE.'], [''],
      ['tap a mod or item: info.'], ['tap it again: use it.'], [''],

  ];

  function openHelp() {
    let page = 0;
    const show = i => { page = (i + HELP_PAGES.length) % HELP_PAGES.length; st.boardStart = performance.now(); Sound.tick(); };
    const go = d => show(page + d);
    const CONTENT_ROWS = 18;   // every tab uses the same height, so the tabs never jump
    openPanel('HOW TO PLAY', (T, B, X, lines) => {
      const p = HELP_PAGES[page];
      T('HOW TO PLAY', C.cyan);
      X({ gap: 1, row: HELP_PAGES.map((hp, i) => ({ text: `[${hp.tab}]`, id: 'htab' + i, sel: i === page, onTap: () => show(i) })) });
      T(SEP, C.dim);
      const start = lines.length;
      T(p.title, C.bright);
      T('');
      if (p.lines) for (const [text, col] of p.lines) T(text, col ? C[col] : C.text);
      if (p.corps) {
        for (const d of [CORPS.perimeter, CORPS.sigil, CORPS.chronos, CORPS.mirror, FINAL]) {
          T(`${d.letter}  ${d.name}`.padEnd(34), d.key === 'omni' ? C.red : C.cyan);
          T(d.intel.padEnd(34), C.text);
          const rules = corpRules(d, 1);
          if (rules) T(rules.padEnd(34), C.mid);
          if (d !== FINAL) T('');
        }
      }
      if (p.rarity) {
        T('mods come in five tiers:');
        T('');
        const ex = { common: 'small perks.', rare: 'solid upgrades.', epic: 'build-defining.', exotic: 'rare and strange.', boss: 'only from corp bosses.' };
        for (const r of Object.keys(RARITY)) { T(`${RARITY[r].label.padEnd(7)} ${ex[r]}`.padEnd(30), C[r]); }
        T('');
        T('rarer mods pop in louder.', C.mid);
      }
      while (lines.length - start < CONTENT_ROWS) T('');
      T(SEP, C.dim);
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> manual loaded.');
    // Keys: left/right or 1-5 = tabs, esc = back.
    st.keyHandler = k => {
      const focusTab = () => { st.kbFocus = st.hoverBtn = 'htab' + page; };   // cursor follows the active tab
      if (k === 'arrowleft') { go(-1); focusTab(); return true; }
      if (k === 'arrowright') { go(1); focusTab(); return true; }
      if (/^[1-9]$/.test(k) && Number(k) <= HELP_PAGES.length) { show(Number(k) - 1); focusTab(); return true; }
      if (k === 'escape') { swapTo(showTitle); return true; }
      return false;
    };
  }

  // ---------------- Codex ----------------
  const RARITY_ORDER = Object.keys(RARITY);
  const codexMods = () => Object.keys(MODS).sort((a, b) => RARITY_ORDER.indexOf(MODS[a].rarity) - RARITY_ORDER.indexOf(MODS[b].rarity) || MODS[a].name.localeCompare(MODS[b].name));
  const CODEX_ROWS = 10;   // height of the list window, including "more" rows

  function wrapText(str, w) {
    const lines = [];
    let cur = '';
    for (const word of str.split(' ')) {
      if (cur && (cur + ' ' + word).length > w) { lines.push(cur); cur = word; }
      else cur = cur ? cur + ' ' + word : word;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  // Which entries fit in the list window when it starts at `top`.
  // A "more" row takes a slot at the top/bottom when there are entries that way.
  function listWindow(top, n) {
    const hasUp = top > 0;
    let shown = CODEX_ROWS - (hasUp ? 1 : 0);
    const hasDown = top + shown < n;
    if (hasDown) shown -= 1;
    return { hasUp, hasDown, shown: Math.min(shown, n - top) };
  }
  const maxTop = n => n <= CODEX_ROWS ? 0 : n - (CODEX_ROWS - 1);

  function openCodex() {
    const TABS = [['mods', 'MODS', 'tabm'], ['items', 'ITEMS', 'tabi'], ['glyphs', 'GLYPHS', 'tabg']];
    let tab = 'mods', sel = 0, top = 0;
    const entries = () => tab === 'mods' ? codexMods() : tab === 'items' ? Object.keys(ITEMS) : GLYPHS.map(gl => gl.key);
    const setTab = name => { tab = name; sel = 0; top = 0; Sound.tick(); };
    const scrollBy = d => { const n = entries().length; const t = clamp(top + d, 0, maxTop(n)); if (t !== top) { top = t; Sound.tick(); } };
    // Keep the selected entry inside the list window.
    const follow = () => {
      const n = entries().length;
      for (let i = 0; i < 4; i++) {
        const w = listWindow(top, n);
        if (sel < top) top = sel;
        else if (sel >= top + w.shown) top = sel - w.shown + 1;
        else break;
        top = clamp(top, 0, maxTop(n));
      }
    };

    openPanel('CODEX', (T, B, X) => {
      const list = entries(), n = list.length;
      sel = clamp(sel, 0, n - 1);
      top = clamp(top, 0, maxTop(n));
      const found = list.filter(k => save.seen[k]).length;
      T(`CODEX  ${tab} ${found}/${n} found`, C.cyan);
      X({ row: TABS.map(([name, label, id]) => ({ text: tab === name ? `[>${label} ]` : `[ ${label} ]`, id, sel: tab === name, onTap: () => setTab(name) })) });

      // Details of the selected entry (always 5 rows).
      T(SEP, C.dim);
      const k = list[sel], seen = !!save.seen[k];
      if (tab === 'glyphs') {
        const gl = GLYPH_BY_KEY[k];
        X({ tileInfo: seen ? gl.glyphOf() : MASK_GLYPH, lines: seen
          ? [{ text: gl.name, col: C.cyan }, ...gl.lore.map(t => ({ text: t, col: C.text }))]
          : [{ text: '???', col: C.dim }, { text: 'not found yet.', col: C.mid }, { text: 'it shows up on a board.', col: C.dim }] });
      } else if (!seen) {
        T('???', C.dim); T('not found yet.', C.mid);
        T(tab === 'mods' ? 'find it in a run to unlock it.' : 'pick one up to unlock it.', C.dim);
        T(''); T('');
      } else if (tab === 'mods') {
        const m = MODS[k];
        const kind = m.kind === 'corp' ? 'corp mod' : m.kind === 'minor' ? 'minor mod' : 'mod';
        X({ badge: k });
        T(`${RARITY[m.rarity].label} // ${kind}${m.active ? ' // tap-to-use' : ''}`, modColor(m));
        const d = wrapText(m.desc, 34);
        T(d[0] || '', C.text); T(d[1] || '', C.text);
        T(modWhere(m), C.mid);
      } else {
        const it = ITEMS[k];
        T(it.name, C.bright); T('item // single use', C.mid);
        const d = wrapText(it.desc, 34);
        T(d[0] || '', C.text); T(d[1] || '', C.text);
        T(`from: ${ITEM_WHERE}`, C.mid);
      }
      T(SEP, C.dim);

      // The list window, with "more" rows when there are entries above/below.
      const w = listWindow(top, n);
      let used = 0;
      if (w.hasUp) { X({ text: '[ ^ ^ ^  more  ^ ^ ^ ]', id: 'moreup', onTap: () => scrollBy(-1) }); used++; }
      for (let idx = top; idx < top + w.shown; idx++) {
        const key = list[idx], seenK = !!save.seen[key];
        const base = { list: true, id: 'cx' + idx, onTap: () => { sel = idx; Sound.tick(); }, sel: idx === sel };
        if (tab === 'glyphs') {
          X(Object.assign(base, { name: seenK ? GLYPH_BY_KEY[key].name : '???', col: seenK ? C.bright : C.dim, right: `#${pad2(idx + 1)}`, rightCol: C.mid }));
        } else {
          const isMod = tab === 'mods';
          const def = isMod ? MODS[key] : ITEMS[key];
          X(Object.assign(base, {
            badge: isMod && seenK ? key : null,
            name: seenK ? def.name : '???', col: seenK ? (isMod ? modColor(def) : C.bright) : C.dim,
            right: isMod ? (seenK ? RARITY[def.rarity].label : '') : 'item', rightCol: seenK && isMod ? modColor(def) : C.mid,
            tint: seenK && isMod ? modColor(def) : null,
          }));
        }
        used++;
      }
      if (w.hasDown) { X({ text: '[ v v v  more  v v v ]', id: 'moredn', onTap: () => scrollBy(1) }); used++; }
      for (; used < CODEX_ROWS; used++) T('');
      T(`${pad2(top + 1)}-${pad2(top + w.shown)} of ${n}`, C.dim);
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> codex open.');

    // Keys: left/right = tabs, up/down = move through the list, esc = back.
    st.keyHandler = k => {
      if (k === 'arrowleft' || k === 'arrowright') {
        const i = TABS.findIndex(t => t[0] === tab);
        const next = TABS[(i + (k === 'arrowright' ? 1 : TABS.length - 1)) % TABS.length];
        setTab(next[0]);
        st.kbFocus = st.hoverBtn = next[2];   // cursor follows the active tab
        return true;
      }
      if (k === 'arrowup' || k === 'arrowdown') {
        sel = clamp(sel + (k === 'arrowdown' ? 1 : -1), 0, entries().length - 1);
        follow();
        Sound.tick();
        return true;
      }
      if (k === 'escape') { swapTo(showTitle); return true; }
      return false;
    };
    st.scroll = scrollBy;   // mouse wheel and swipe
  }

  // ---------------- Settings ----------------
  function openSettings() {
    st.resetArmed = false;
    openPanel('SETTINGS', (T, B, X) => {
      T('SETTINGS', C.cyan);
      T('');
      B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
      B(`[ sound: ${save.muted ? 'OFF' : 'ON '} ]`, 'snd2', toggleMute);
      B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'fx', () => { save.effects = save.effects === 'full' ? 'reduced' : 'full'; persist(); Sound.ui(); });
      B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'tap', () => { save.tapMode = save.tapMode === 'two' ? 'one' : 'two'; persist(); Sound.ui(); });
      T('');
      T(`next run seed: ${st.seed}${st.practice ? ' (practice)' : ''}`, C.text);
      X({ row: [
        { text: '[ NEW SEED ]', id: 'rseed', onTap: rerollSeed },
        { text: '[ ENTER SEED ]', id: 'eseed', onTap: enterSeed },
      ] });
      T('');
      T('effects REDUCED: no shake or flash.', C.dim);
      T('tap once: items/abilities fire', C.dim);
      T('on the first tap.', C.dim);
      T('');
      B(st.resetArmed ? '[ TAP AGAIN TO ERASE ]' : '[ reset save data ]', 'reset', resetSave);
      if (st.resetArmed) T('erases best, runs, codex.', C.red);
      T('');
      B('[ BACK ]', 'back', () => swapTo(showTitle));
    }, '> settings.');
    st.keyHandler = k => { if (k === 'escape') { swapTo(showTitle); return true; } return false; };
  }

  function enterSeed() {
    let s = null;
    try { s = window.prompt('enter a seed (letters and numbers):', st.seed); } catch (e) { s = null; }
    const clean = cleanSeed(s);
    if (!clean) return Sound.deny();
    st.seed = clean;
    st.practice = true;     // a chosen seed is a practice run
    Sound.ui();
    setMsg(`> seed set: ${clean}`);
  }

  function resetSave() {
    if (!st.resetArmed) { st.resetArmed = true; Sound.deny(); return; }
    const keep = { palette: save.palette, muted: save.muted, effects: save.effects, tapMode: save.tapMode };
    for (const k of Object.keys(save)) delete save[k];
    Object.assign(save, freshSave(), keep);
    persist();
    st.resetArmed = false;
    Sound.buy();
    setMsg('> save data erased.', C.red);
  }

  // ---------------- Active mods ----------------
  function modCharges(key) {
    const m = MODS[key], run = st.run;
    if (!m || !m.active || !run) return null;
    if (m.charges) return run.charges[key] || 0;
    if (key === 'burner') return st.mode === 'play' && st.corp && st.corp.hasBoss ? (st.corp.burnerUsed ? 0 : 1) : null;
    return null;
  }

  function nodesAhead() {
    const run = st.run, cur = run.map[run.at];
    return Object.values(run.map).filter(n => n.step > cur.step && n.step < MAP_STEPS - 1);
  }

  function modUsable(key) {
    const m = MODS[key], run = st.run;
    if (!m || !m.active || !run || st.transitioning || st.dev || st.wipe) return false;
    if (m.active === 'layer') {
      if (st.mode !== 'play' || st.busy || !st.lv || !st.corp || !st.corp.hasBoss) return false;
      if (key === 'burner') return !st.corp.burnerUsed && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    }
    if (m.active === 'map') return st.mode === 'map' && (run.charges[key] || 0) > 0 && nodesAhead().length > 0;
    return false;
  }

  function activateMod(key) {
    const run = st.run;
    if (!modUsable(key)) { Sound.deny(); return; }
    st.selMod = -1;
    if (key === 'burner') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      lockTile(pickR(opts, rngFor(run.seed, 'burner', st.corp.node.id, st.corp.idx)), C.cyan, 'burner');
      st.corp.burnerUsed = true;
      setMsg('> burner: 1 ICE locked.', C.cyan);
    }
    if (key === 'reroute') {
      run.charges.reroute--;
      rerouteMap();
      st.mapSel = null;
      st.boardStart = performance.now();
      Sound.whoosh();
      setMsg('> rerouted. the net shifts.', C.cyan);
    }
    if (key === 'wormhole') {
      run.charges.wormhole--;
      const ahead = nodesAhead();
      const target = pickR(ahead, rngFor(run.seed, 'wormhole', run.at));
      setMsg('> wormhole open...', C.cyan);
      enterNode(target, true);
    }
  }

  // Re-roll the type and corp of every node ahead (links stay the same).
  function rerouteMap() {
    const run = st.run;
    const r = rngFor(run.seed, 'reroute', run.reroutes++);
    const corps = Object.keys(CORPS);
    for (const n of nodesAhead()) {
      const roll = r();
      n.type = roll < 0.6 ? 'corp' : roll < 0.75 ? 'cache' : roll < 0.88 ? 'repair' : 'shop';
      if (n.type === 'corp') { n.corp = pickR(corps, r); n.tier = n.step <= 2 ? 1 : 2; }
      else { delete n.corp; delete n.tier; }
    }
  }

  // ---------------- Items ----------------
  function canUse(key) {
    const run = st.run;
    if (!run || st.wipe) return false;
    if (key === 'patch') return run.integrity < run.maxInt;
    if (key === 'wall') return true;
    const inLayer = st.mode === 'play' && !st.busy && st.lv;
    if (key === 'purge') return !!inLayer && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    if (key === 'split') return !!inLayer && !st.lv.split && candidates().length > 1;
    return false;
  }

  function useItem(slot) {
    const run = st.run;
    if (!run || st.transitioning) return;
    const key = run.items[slot];
    if (!key) return;
    if (!canUse(key)) { Sound.deny(); return; }
    run.items.splice(slot, 1);
    st.hoverItem = -1; st.selItem = -1;
    if (key === 'patch') { run.integrity++; Sound.buy(); setMsg('> patched. +1 int', C.cyan); }
    if (key === 'wall') { run.shield++; Sound.shield(); setMsg('> firewall up.', C.cyan); }
    if (key === 'purge') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      const r = rngFor(run.seed, 'purge', st.corp.node.id, st.corp.idx, lv.tiles.filter(t => t.state === 'locked').length);
      lockTile(pickR(opts, r), C.cyan, 'purge');
      setMsg('> purged one ICE node.', C.cyan);
    }
    if (key === 'split') {
      const lv = st.lv, s = lv.tiles[lv.safe];
      const vertical = rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx)() < 0.5;
      for (const t of lv.tiles) {
        const sameHalf = vertical ? (t.col < lv.cols / 2) === (s.col < lv.cols / 2) : (t.row < lv.rows / 2) === (s.row < lv.rows / 2);
        if (!sameHalf) t.ruledOut = true;
      }
      lv.split = true;
      Sound.shield();
      setMsg(`> split: it is in the ${vertical ? (s.col < lv.cols / 2 ? 'left' : 'right') : (s.row < lv.rows / 2 ? 'top' : 'bottom')} half.`, C.cyan);
    }
  }

  function toggleMute() {
    save.muted = !save.muted;
    persist();
    Sound.ui();
  }

  function cyclePalette() {
    const keys = Object.keys(PALETTES);
    save.palette = keys[(keys.indexOf(save.palette) + 1) % keys.length];
    applyPalette(save.palette);
    persist();
    Sound.ui();
  }

  // ---------------- Pause menu ----------------
  // [MENU] in the header or Esc during a run. Stops clocks. Abandon goes to the title.
  function togglePause() {
    if (st.dev) return;
    if (!st.pause && (!st.run || st.busy || st.transitioning || st.wipe)) { Sound.deny(); return; }
    st.pause = !st.pause;
    st.abandonArmed = false;
    st.kbFocus = null;
    st.boardStart = performance.now();
    Sound.ui();
  }

  const toggleEffects = () => { save.effects = save.effects === 'full' ? 'reduced' : 'full'; persist(); Sound.ui(); };
  const toggleTapMode = () => { save.tapMode = save.tapMode === 'two' ? 'one' : 'two'; persist(); Sound.ui(); };

  function pauseLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap) => lines.push({ text, id, onTap });
    const run = st.run;
    T('PAUSED', C.cyan);
    T(`layer ${pad2(run.depth)}   corps ${run.corps}   cr ${run.credits}`, C.text);
    T(`seed ${run.seed}${run.practice ? '  (practice)' : ''}`, C.mid);
    T('');
    lines.push({ box: true, text: 'R E S U M E', id: 'resume', onTap: togglePause, minW: 22 });
    T('');
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'ppal', cyclePalette);
    B(`[ sound: ${save.muted ? 'OFF' : 'ON '} ]`, 'psnd', toggleMute);
    B(`[ effects: ${save.effects === 'full' ? 'FULL   ' : 'REDUCED'} ]`, 'pfx', toggleEffects);
    B(`[ items: ${save.tapMode === 'two' ? 'TAP TWICE' : 'TAP ONCE '} ]`, 'ptap', toggleTapMode);
    T('');
    B(st.abandonArmed ? '[ TAP AGAIN TO ABANDON ]' : '[ ABANDON RUN ]', 'abandon', abandonRun);
    T(st.abandonArmed ? 'the run ends here.' : 'abandoned runs are not scored.', st.abandonArmed ? C.red : C.dim);
    return lines;
  }

  function abandonRun() {
    if (!st.abandonArmed) { st.abandonArmed = true; Sound.deny(); return; }
    const run = st.run;
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win: false, abandoned: true, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();
    st.pause = false; st.abandonArmed = false; st.timer = null;
    swapTo(showTitle);
  }

  // ---------------- Keyboard cursor ----------------
  // Buttons and list rows: move through them in reading order.
  function moveFocus(d) {
    const list = st.focusables;
    if (!list.length) return;
    let i = list.findIndex(f => f.id === st.kbFocus);
    i = i < 0 ? (d > 0 ? 0 : list.length - 1) : (i + d + list.length) % list.length;
    st.kbFocus = list[i].id;
    st.hoverBtn = st.kbFocus;
    Sound.tick();
  }

  // Grid: jump to the nearest open tile in the arrow's direction.
  function moveTileCursor(k) {
    const lv = st.lv;
    if (st.busy) return;
    const open = lv.tiles.map((t, i) => [t, i]).filter(([t]) => t.state === 'closed');
    if (!open.length) return;
    st.kbGrid = true;
    const cur = lv.tiles[st.hover];
    if (!cur || cur.state !== 'closed') {
      // Start at the tile nearest the middle of the grid.
      const mx = (lv.cols - 1) / 2, my = (lv.rows - 1) / 2;
      open.sort((a, b) => Math.hypot(a[0].col - mx, a[0].row - my) - Math.hypot(b[0].col - mx, b[0].row - my));
      st.hover = open[0][1];
      Sound.tick();
      return;
    }
    const [dx, dy] = { arrowleft: [-1, 0], arrowright: [1, 0], arrowup: [0, -1], arrowdown: [0, 1] }[k];
    let best = -1, bestScore = Infinity;
    for (const [t, i] of open) {
      if (t === cur) continue;
      const vx = t.col - cur.col, vy = t.row - cur.row;
      const along = vx * dx + vy * dy;
      if (along <= 0) continue;
      const score = along + Math.abs(vx * dy - vy * dx) * 2;
      if (score < bestScore) { bestScore = score; best = i; }
    }
    if (best >= 0) { st.hover = best; Sound.tick(); }
  }

  // Map: step through the nodes you can pick next.
  function moveMapCursor(k) {
    const run = st.run;
    const avail = availableNodes().slice().sort((a, b) => run.map[a].lane - run.map[b].lane);
    if (!avail.length) return;
    const d = k === 'arrowleft' || k === 'arrowup' ? -1 : 1;
    const i = avail.indexOf(st.mapSel);
    st.mapSel = avail[i < 0 ? 0 : (i + d + avail.length) % avail.length];
    Sound.ui();
  }

  // ---------------- Dev menu ----------------
  // Open with ` (backtick), or the [DEV] button when the URL has ?dev=1.
  // Using cheats on a run marks it as practice, so it doesn't count.
  function toggleDev() {
    if (st.transitioning || st.wipe) return;
    st.dev = !st.dev;
    st.devAccess = true;
    st.boardStart = performance.now();
    Sound.ui();
  }

  function cheat(fn) {
    return () => {
      if (st.run) st.run.practice = true;
      fn();
      Sound.buy();
    };
  }

  // Jump straight to a corp's boss layer.
  function jumpToBoss(node) {
    const run = st.run;
    st.dev = false;
    if (st.mode === 'play' && st.corp && st.corp.hasBoss && !st.lv.boss) {
      st.corp.idx = st.corp.counts.length - 1;
      enterLayer();
      return;
    }
    if (!node) return;
    run.practice = true;
    if (run.at !== node.id) { run.at = node.id; run.visited.push(node.id); }
    startCorp(node, 99);
  }

  function devLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    const run = st.run;
    const idle = !st.busy && !st.transitioning;
    T('DEV MENU', C.cyan);
    T(run ? (run.practice ? 'run is practice (not scored)' : 'cheats mark the run as practice') : 'start a run for cheats', C.dim);
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
    B(`[ show real node: ${st.debug ? 'ON ' : 'OFF'} ]`, 'dbg', () => { st.debug = !st.debug; if (run) run.practice = true; Sound.ui(); });
    T('');
    T('mods (by rarity)', C.mid);
    const toggleMod = k => cheat(() => {
      if (!run.mods.includes(k)) return addMod(k);
      run.mods = run.mods.filter(m => m !== k);
      if (k === 'buffer') { run.maxInt--; run.integrity = Math.min(run.integrity, run.maxInt); }
      if (k === 'stash') { run.beltSlots--; run.items = run.items.slice(0, run.beltSlots); }
    });
    const keys = codexMods();
    for (let i = 0; i < keys.length; i += 4) {
      lines.push({ row: keys.slice(i, i + 4).map(k => ({
        text: `[${run && run.mods.includes(k) ? 'x' : ' '}]${MODS[k].short}`,
        id: 'mod_' + k, onTap: toggleMod(k), disabled: !run,
      })) });
    }
    T('');
    lines.push({ row: [
      { text: '[+100cr]', id: 'cr', onTap: cheat(() => { run.credits += 100; }), disabled: !run },
      { text: '[heal]', id: 'hp', onTap: cheat(() => { run.integrity = run.maxInt; }), disabled: !run },
      { text: '[fill belt]', id: 'belt', onTap: cheat(() => { const ks = Object.keys(ITEMS); let i = 0; while (run.items.length < run.beltSlots) run.items.push(ks[i++ % ks.length]); }), disabled: !run },
    ] });
    lines.push({ row: [
      { text: '[unlock codex]', id: 'seenall', onTap: () => { for (const k of [...Object.keys(MODS), ...Object.keys(ITEMS), ...GLYPHS.map(gl => gl.key)]) save.seen[k] = true; persist(); Sound.buy(); } },
    ] });
    T('');
    const inCorp = st.mode === 'play' && st.corp && st.corp.hasBoss && st.lv && !st.lv.boss;
    const sel = st.mode === 'map' && st.mapSel && run.map[st.mapSel];
    const selCorp = sel && (sel.type === 'corp' || sel.type === 'final') ? sel : null;
    const bossLabel = inCorp ? '[ jump to this boss ]' : selCorp ? `[ jump to ${corpDef(selCorp.corp).letter} boss ]` : '[ jump to boss ]';
    B(bossLabel, 'boss', cheat(() => jumpToBoss(selCorp)), !idle || !(inCorp || selCorp));
    B('[ jump to final boss ]', 'final', cheat(() => jumpToBoss(run.map['5:1'])), !idle || !run || st.mode === 'over');
    if (!inCorp && !selCorp) T('(select a corp on the map first)', C.dim);
    T('');
    B('[ close ]', 'close', toggleDev);
    return lines;
  }

  // ---------------- Input ----------------
  function hitAt(x, y) {
    for (let k = hits.length - 1; k >= 0; k--) {
      const h = hits[k];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
    }
    return null;
  }

  cv.addEventListener('pointerdown', e => {
    Sound.init();
    const h = hitAt(e.clientX, e.clientY);
    st.drag = st.scroll ? { y: e.clientY } : null;
    // Ignore taps during a wipe, except the header buttons.
    if (st.wipe && !(h && (h.id === 'snd' || h.id === 'dev'))) return;
    // While paused, only buttons respond.
    if (st.pause && h && h.kind !== 'btn') return;
    if (!h) {
      if (st.mode === 'map' && !st.dev && !st.pause) st.mapSel = null;
      st.selItem = -1; st.selMod = -1;
      return;
    }
    const oneTap = save.tapMode === 'one';
    if (h.kind === 'tile') pick(h.i);
    else if (h.kind === 'node') selectNode(h.id);
    else if (h.kind === 'item') {
      // Two-tap mode: first tap shows info, second tap uses.
      st.selMod = -1;
      if (oneTap || st.selItem === h.i) useItem(h.i);
      else { st.selItem = h.i; Sound.tick(); }
    } else if (h.kind === 'mod') {
      st.selItem = -1;
      const key = st.run.mods[h.i];
      const active = MODS[key].active;
      if (active && (oneTap || st.selMod === h.i)) activateMod(key);
      else if (st.selMod === h.i) st.selMod = -1;
      else { st.selMod = h.i; Sound.tick(); }
    }
    else if (h.kind === 'btn' && !st.transitioning) h.onTap();
  });

  cv.addEventListener('pointermove', e => {
    // Swipe to scroll lists (one entry per row of finger travel).
    if (st.drag && e.buttons && st.scroll) {
      const dy = e.clientY - st.drag.y;
      if (Math.abs(dy) > L.chh) { st.scroll(dy < 0 ? 1 : -1); st.drag.y = e.clientY; }
    }
    const h = hitAt(e.clientX, e.clientY);
    const tile = h && h.kind === 'tile' ? h.i : -1;
    if (tile !== st.hover && tile >= 0 && !st.busy) Sound.tick();
    st.hover = tile;
    st.kbGrid = false;
    st.kbFocus = null;   // the mouse takes over the cursor
    st.hoverBtn = h && h.kind === 'btn' ? h.id : null;
    st.hoverNode = h && h.kind === 'node' ? h.id : null;
    st.hoverItem = h && h.kind === 'item' ? h.i : -1;
    st.hoverMod = h && h.kind === 'mod' ? h.i : -1;
    cv.style.cursor = h ? 'pointer' : 'default';
  });
  cv.addEventListener('pointerup', () => { st.drag = null; });
  cv.addEventListener('wheel', e => {
    if (!st.scroll || st.wipe) return;
    e.preventDefault();
    st.scroll(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Sound.init();
    const k = e.key.toLowerCase();
    const arrow = k.startsWith('arrow');
    if (arrow || k === ' ' || k === 'enter') e.preventDefault();
    if (e.key === '`') return toggleDev();
    if (k === 'm' && !st.dev) return toggleMute();
    if (k === 'escape') {
      if (st.dev) return toggleDev();
      if (st.pause) return togglePause();
      if (st.keyHandler && st.keyHandler(k)) return;
      if (st.run && (st.mode === 'map' || st.mode === 'play' || st.mode === 'panel')) return togglePause();
      return;
    }
    if (st.transitioning || st.wipe) return;
    const overlay = st.dev || st.pause;
    if (!overlay) {
      if (st.keyHandler && st.keyHandler(k)) return;
      if (/^[1-9]$/.test(e.key) && st.run && (st.mode === 'play' || st.mode === 'map')) return useItem(Number(e.key) - 1);
      if (st.mode === 'play' && st.lv) {
        if (arrow) return moveTileCursor(k);
        if ((k === 'enter' || k === ' ') && st.hover >= 0) return pick(st.hover);
        return;
      }
      if (st.mode === 'map') {
        if (arrow) return moveMapCursor(k);
        if ((k === 'enter' || k === ' ') && st.mapSel) return enterNode(st.run.map[st.mapSel]);
        return;
      }
      if (st.mode === 'over' && k === 'r') return retry();
    }
    // Everything else (title, panels, menus): a cursor over the buttons.
    if (arrow) return moveFocus(k === 'arrowup' || k === 'arrowleft' ? -1 : 1);
    if (k === 'enter' || k === ' ') {
      const f = st.kbFocus && st.focusables.find(x => x.id === st.kbFocus);
      if (f) return f.onTap();
      // Nothing focused yet: the screen's main action.
      if (!overlay && st.mode === 'title') return jackIn();
      if (!overlay && st.mode === 'over') return newRun();
    }
  });

  // ---------------- Boot ----------------
  window.addEventListener('resize', resize);
  applyPalette(save.palette);
  st.msgCol = C.text;
  resize();
  showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`16px "JetBrains Mono"`).then(() => computeLayout()).catch(() => {});
  }

  // Debug hook for the console and automated tests.
  window.__br = {
    state: st, save, genLayer, genMap, CONFIG, MODS, ITEMS,
    startRun, selectNode, enterNode, pick, useItem, activateMod, modUsable, addMod,
    toggleDev, devLines, availableNodes, panelLines, swapTo, openHelp, openCodex, openSettings, showTitle, buildScene,
    togglePause, pauseLines, abandonRun, moveFocus, moveTileCursor, moveMapCursor,
  };
})();
</script>
</body>
</html>
