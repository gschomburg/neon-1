<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beta Runner v02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #06090a; overflow: hidden; }
  body {
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; cursor: default; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Beta Runner game screen"></canvas>
<script>
// Beta Runner v02: overworld map, corps with tells, bosses, merchant, items, mods.
// The whole screen is a grid of text characters drawn on one canvas,
// so any character can turn into a particle for effects.
(() => {
  'use strict';

  // ---------------- Tuning ----------------
  const CONFIG = {
    startIntegrity: 4,
    perfectHeal: 1,        // integrity restored by a first-try pick
    tellStrength: 0.75,    // how often a position tell is followed
    markDecoyFrac: 0.4,    // share of other tiles that also carry a glyph mark
    lootChance: 0.3,       // chance a layer has a loaded ($) ICE tile
    beltSlots: 4,
    repairAmount: 2,
    maskDelayMs: 1800,     // how long a fading glyph tell stays visible
  };

  const VERSION = 'v02';
  const STORE_KEY = 'beta_runner.v02.save';
  const SAVE_FORMAT = 1;

  const TILE_W = 7, TILE_H = 5;
  const GAP_X = 2, GAP_Y = 1;
  const BOARD_Y = 8;
  const MIN_CONTENT_W = 36;
  const LINE_H = 1.22;
  const FONT = '"JetBrains Mono", Consolas, "Courier New", monospace';

  const C = {
    bg: '#06090a',
    dim: '#2c3a38',
    mid: '#5f7470',
    text: '#a9bdb7',
    bright: '#e6f4ef',
    cyan: '#3cf0ff',
    red: '#ff3b4e',
    redDim: '#7a2630',
    gold: '#e8c66a',
  };

  // Console palettes. Same keys as C; switched from the dev menu for now.
  const PALETTES = {
    default:  { name: 'DEFAULT',   bg: '#06090a', dim: '#2c3a38', mid: '#5f7470', text: '#a9bdb7', bright: '#e6f4ef', cyan: '#3cf0ff', red: '#ff3b4e', redDim: '#7a2630', gold: '#e8c66a' },
    amber:    { name: 'AMBER CRT', bg: '#0c0800', dim: '#3a2a10', mid: '#7a5a24', text: '#d9a441', bright: '#ffd27a', cyan: '#ffb000', red: '#ff5a3c', redDim: '#6e2a18', gold: '#ffe08a' },
    phosphor: { name: 'GREEN CRT', bg: '#020a04', dim: '#12331a', mid: '#2f6e3c', text: '#5fd47a', bright: '#b8ffc8', cyan: '#39ff6a', red: '#ff5c5c', redDim: '#5a1f1f', gold: '#d8ff6a' },
    dusk:     { name: 'DUSK',      bg: '#14111f', dim: '#332c4a', mid: '#6b5f8f', text: '#c8bfe8', bright: '#f4f0ff', cyan: '#ff79c6', red: '#ff5555', redDim: '#6a2a3a', gold: '#f1fa8c' },
    paper:    { name: 'PAPER',     bg: '#f2efe6', dim: '#cfc9ba', mid: '#8a8376', text: '#3b3a36', bright: '#111111', cyan: '#0077a8', red: '#c4122c', redDim: '#d99aa2', gold: '#9a6a00' },
  };
  function applyPalette(key) {
    const p = PALETTES[key] || PALETTES.default;
    for (const k of Object.keys(C)) if (p[k]) C[k] = p[k];
    document.documentElement.style.background = C.bg;
    document.body.style.background = C.bg;
  }

  const NOISE = '#%&@$*+=<>/\\|:;~^01';

  // ---------------- Seeded RNG ----------------
  function hashStr(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^= h >>> 16) >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Separate stream per purpose, so player actions never shift the answers.
  const rngFor = (...parts) => mulberry32(hashStr(parts.join('|')));

  const SEED_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function newSeed() {
    let s = '';
    for (let i = 0; i < 6; i++) s += SEED_ALPHABET[Math.floor(Math.random() * SEED_ALPHABET.length)];
    return s;
  }
  const cleanSeed = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16);
  const pickR = (arr, r) => arr[Math.floor(r() * arr.length)];
  function shuffle(arr, r) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(r() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---------------- Glyphs ----------------
  const MOTIFS_RAW = [
    [' /\\ ', '<  >', ' \\/ '],
    ['\\ /', ' X ', '/ \\'],          // index 1: Sigil's signature
    ['[==]', '[  ]', '[==]'],
    [' .-. ', '( o )', " '-' "],
    ['~ ~ ~', ' ~ ~ ', '~ ~ ~'],
    ['# #', ' # ', '# #'],
    ['  ^  ', ' /|\\ ', '  |  '],
    ['o-+  ', '  |  ', '  +-o'],
    ['0110', '1001', '0110'],
    ['(o.o)', ' |=| '],
    ['+-+-+', '| | |', '+-+-+'],
    ['  |  ', '--+--', '  |  '],
    ['. : .', ': . :', '. : .'],
    ['>>>', '>>>'],
    [' .-. ', ' | | ', '[###]'],
    ['%#@', '@ %', '#%@'],
    ['{ }', '{*}', '{ }'],
    ['=====', ' === ', '  =  '],
  ];
  function normMotif(m) {
    let lines = m.slice(0, 3);
    if (lines.length === 1) lines = ['', lines[0], ''];
    else if (lines.length === 2) lines = [lines[0], lines[1], ''];
    return lines.map(l => {
      l = l.slice(0, 5);
      const pad = 5 - l.length, left = Math.floor(pad / 2);
      return ' '.repeat(left) + l + ' '.repeat(pad - left);
    });
  }
  const MOTIFS = MOTIFS_RAW.map(normMotif);
  const SIGIL_MARK = 1;
  const JACK_GLYPH = normMotif(['', '>_', '']);
  const LOOT_GLYPH = normMotif(['$ $', '[$]', '$ $']);
  const MASK_GLYPH = normMotif(['', '???', '']);

  // ---------------- Content ----------------
  // tell: how the corp picks its safe tile. bossTell: the boss layer's twist.
  const CORPS = {
    perimeter: {
      key: 'perimeter', name: 'PERIMETER SYS', letter: 'P',
      intel: '"our corners never fall."',
      rules: 'no special rules.',
      tell: 'corner', bossTell: 'center',
      bossDesc: 'boss: the core hides inward.',
    },
    sigil: {
      key: 'sigil', name: 'SIGIL DYNAMICS', letter: 'S',
      intel: '"we sign everything we make."',
      rules: 'no special rules.',
      tell: 'mark', bossTell: 'mark', bossFlash: true,
      bossDesc: 'boss: the signature fades fast.',
    },
    chronos: {
      key: 'chronos', name: 'CHRONOS', letter: 'C',
      intel: '"time is money. yours is short."',
      rules: '10s clock per pick. pays x1.6',
      tell: null, timer: 10, pay: 1.6, bossShrink: true,
      bossDesc: 'boss: clock shrinks every miss.',
    },
    mirror: {
      key: 'mirror', name: 'MIRRORLINE', letter: 'M',
      intel: '"every step echoes the last."',
      rules: 'no special rules.',
      tell: 'mirror', bossTell: 'point',
      bossDesc: 'boss: the echo turns over.',
    },
  };
  const FINAL = {
    key: 'omni', name: 'OMNI//CORE', letter: '!',
    intel: '"you were never meant to be here."',
    rules: '12s clock. tell unknown. pays x2',
    timer: 12, pay: 2, bossDmg: 2,
    bossDesc: 'boss: ICE hits for 2.',
  };
  const PUBLIC = {
    key: 'public', name: 'PUBLIC NET', letter: '>',
    intel: 'one node. it is real.', rules: 'start here.', tell: null,
  };
  const corpDef = key => CORPS[key] || (key === 'omni' ? FINAL : PUBLIC);

  const ITEMS = {
    patch: { key: 'patch', name: 'PATCH', price: 25, desc: 'restore 1 integrity.' },
    purge: { key: 'purge', name: 'PURGE', price: 22, desc: 'lock out one ICE node.' },
    wall:  { key: 'wall',  name: 'FWALL', price: 30, desc: 'block the next ICE hit.' },
    split: { key: 'split', name: 'SPLIT', price: 34, desc: 'rule out half the grid.' },
  };
  const MODS = {
    tracer:  { key: 'tracer',  name: 'TRACER',  short: 'TRC', price: 70, desc: 'ICE shows distance to real node.' },
    skimmer: { key: 'skimmer', name: 'SKIMMER', short: 'SKM', price: 60, desc: '+50% credits.' },
    buffer:  { key: 'buffer',  name: 'BUFFER',  short: 'BUF', price: 65, desc: '+1 max integrity.' },
    sniffer: { key: 'sniffer', name: 'SNIFFER', short: 'SNF', price: 90, desc: 'each layer starts 1 ICE locked.' },
  };

  // ---------------- Layers ----------------
  function gridFor(n) {
    let cols = 4, rows = 4;
    while (n > Math.floor(cols * rows * 0.75)) {
      if (rows <= cols) rows++; else cols++;
    }
    return { cols, rows };
  }

  function tellCells(tell, cols, rows, prevSafe) {
    const all = [];
    for (let i = 0; i < cols * rows; i++) all.push(i);
    const colOf = i => i % cols, rowOf = i => Math.floor(i / cols);
    if (tell === 'corner') return [0, cols - 1, (rows - 1) * cols, rows * cols - 1];
    if (tell === 'center') return all.filter(i => colOf(i) > 0 && colOf(i) < cols - 1 && rowOf(i) > 0 && rowOf(i) < rows - 1);
    if ((tell === 'mirror' || tell === 'point') && prevSafe) {
      const col = cols - 1 - prevSafe.col;
      const row = tell === 'point' ? rows - 1 - prevSafe.row : prevSafe.row;
      if (col >= 0 && row >= 0 && row < rows) return [row * cols + col];
    }
    return null;
  }

  // ctx: { seed, nodeId, idx, n, tell, prevSafe, loot }
  function genLayer(ctx) {
    const { seed, nodeId, idx, n, tell, prevSafe, loot } = ctx;
    const r = rngFor(seed, 'layer', nodeId, idx);
    const { cols, rows } = gridFor(n);
    const cells = [];
    for (let i = 0; i < cols * rows; i++) cells.push(i);
    shuffle(cells, r);
    const tiles = cells.slice(0, n).map(cell => ({
      cell, col: cell % cols, row: Math.floor(cell / cols),
      glyph: null, safe: false, loaded: false, ruledOut: false,
      state: 'closed', hidden: false, probing: false, dist: null,
    }));
    const setCell = (t, cell) => { t.cell = cell; t.col = cell % cols; t.row = Math.floor(cell / cols); };

    // Pick the safe tile, following the position tell most of the time.
    let safe = tiles[Math.floor(r() * n)];
    const follow = r() < CONFIG.tellStrength;
    const targets = n > 1 ? tellCells(tell, cols, rows, prevSafe) : null;
    if (targets && follow) {
      let cand = tiles.filter(t => targets.includes(t.cell));
      if (!cand.length) {
        const used = new Set(tiles.map(t => t.cell));
        const free = targets.filter(c => !used.has(c));
        if (free.length) { const t = pickR(tiles, r); setCell(t, pickR(free, r)); cand = [t]; }
      }
      if (cand.length) safe = pickR(cand, r);
    }
    safe.safe = true;

    // Glyphs. A mark tell puts the signature on the safe tile and some decoys.
    const pool = MOTIFS.map((m, i) => i).filter(i => tell !== 'mark' || i !== SIGIL_MARK);
    for (const t of tiles) t.glyph = MOTIFS[pickR(pool, r)];
    if (tell === 'mark') {
      safe.glyph = MOTIFS[SIGIL_MARK];
      const others = shuffle(tiles.filter(t => !t.safe), r);
      const k = Math.min(others.length, Math.max(1, Math.round((n - 1) * CONFIG.markDecoyFrac)));
      for (let i = 0; i < k; i++) others[i].glyph = MOTIFS[SIGIL_MARK];
    }
    if (n === 1) tiles[0].glyph = JACK_GLYPH;

    // Loaded ICE: a known trap that drops loot when hit.
    if (loot && n >= 4 && r() < CONFIG.lootChance) {
      const opts = tiles.filter(t => !t.safe && t.glyph !== MOTIFS[SIGIL_MARK]);
      if (opts.length) { const t = pickR(opts, r); t.loaded = true; t.glyph = LOOT_GLYPH; }
    }

    tiles.sort((a, b) => a.cell - b.cell);
    return { n, cols, rows, tiles, safe: tiles.findIndex(t => t.safe), safeCell: { col: safe.col, row: safe.row } };
  }

  // ---------------- Overworld map ----------------
  // Steps run bottom (0, start) to top (5, final). Steps 1-4 have 3 lanes.
  const MAP_STEPS = 6;
  function genMap(seed) {
    const r = rngFor(seed, 'map');
    const nodes = {};
    const add = (step, lane, type, extra = {}) => {
      const id = `${step}:${lane}`;
      nodes[id] = Object.assign({ id, step, lane, type, next: [] }, extra);
    };
    add(0, 1, 'start', { corp: 'public', tier: 0 });
    const specs = [
      null,
      ['corp', 'corp', 'corp'],
      ['corp', 'corp', r() < 0.5 ? 'cache' : 'repair'],
      ['corp', 'corp', 'shop'],
      ['corp', 'corp', r() < 0.5 ? 'cache' : 'repair'],
    ];
    for (let s = 1; s <= 4; s++) {
      const types = shuffle(specs[s].slice(), r);
      const corps = shuffle(Object.keys(CORPS), r);
      types.forEach((type, lane) => add(s, lane, type, type === 'corp' ? { corp: corps[lane], tier: s <= 2 ? 1 : 2 } : {}));
    }
    add(5, 1, 'final', { corp: 'omni', tier: 3 });
    for (let lane = 0; lane < 3; lane++) nodes['0:1'].next.push(`1:${lane}`);
    for (let s = 1; s <= 3; s++) {
      for (let lane = 0; lane < 3; lane++) {
        const n = nodes[`${s}:${lane}`];
        n.next.push(`${s + 1}:${lane}`);
        for (const d of [-1, 1]) if (lane + d >= 0 && lane + d < 3 && r() < 0.45) n.next.push(`${s + 1}:${lane + d}`);
      }
    }
    for (let lane = 0; lane < 3; lane++) nodes[`4:${lane}`].next.push('5:1');
    return nodes;
  }
  const nodeLetter = n => n.type === 'shop' ? '$' : n.type === 'cache' ? '?' : n.type === 'repair' ? '+' : corpDef(n.corp).letter;

  // ---------------- Save data ----------------
  const save = (() => {
    const d = { format: SAVE_FORMAT, best: 0, runs: 0, wins: 0, history: [], muted: false, palette: 'default' };
    try {
      const raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (raw && raw.format === SAVE_FORMAT) Object.assign(d, raw);
    } catch (e) { /* storage unavailable */ }
    return d;
  })();
  const persist = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } };

  // ---------------- Sound ----------------
  const Sound = (() => {
    let ac = null, master = null, noiseBuf = null;
    function init() {
      if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = 0.16; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    function tone(freq, dur, { type = 'square', vol = 1, slide = 0, delay = 0 } = {}) {
      if (!ac || save.muted) return;
      const t = ac.currentTime + delay;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.02);
    }
    function noise(dur, { vol = 0.5, freq = 1000, delay = 0 } = {}) {
      if (!ac || save.muted) return;
      const t = ac.currentTime + delay;
      const s = ac.createBufferSource(); s.buffer = noiseBuf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t + dur + 0.02);
    }
    return {
      init,
      tick: () => tone(1800, 0.018, { vol: 0.12 }),
      clock: () => tone(1400, 0.03, { vol: 0.25 }),
      ui: () => tone(990, 0.04, { vol: 0.3 }),
      deny: () => tone(160, 0.12, { type: 'square', vol: 0.3 }),
      buy: () => { tone(880, 0.05, { vol: 0.3 }); tone(1320, 0.08, { vol: 0.3, delay: 0.06 }); },
      probe: () => { tone(520, 0.05, { vol: 0.3 }); tone(780, 0.05, { vol: 0.25, delay: 0.09 }); tone(640, 0.05, { vol: 0.25, delay: 0.18 }); },
      layer: n => tone(260 + Math.min(n, 30) * 22, 0.07, { vol: 0.25 }),
      boss: () => { tone(90, 0.8, { type: 'sawtooth', vol: 0.5 }); tone(95, 0.8, { type: 'sawtooth', vol: 0.4 }); },
      safe: () => {
        tone(523, 0.09, { type: 'triangle', vol: 0.6 });
        tone(784, 0.12, { type: 'triangle', vol: 0.55, delay: 0.07 });
        tone(1046, 0.22, { type: 'triangle', vol: 0.5, delay: 0.14 });
      },
      implode: () => tone(180, 0.6, { type: 'sine', vol: 0.5, slide: 4 }),
      trap: () => { tone(110, 0.35, { type: 'sawtooth', vol: 0.7, slide: 0.5 }); noise(0.25, { vol: 0.6, freq: 900 }); },
      shield: () => { tone(1200, 0.15, { type: 'triangle', vol: 0.5, slide: 0.5 }); noise(0.15, { vol: 0.3, freq: 3000 }); },
      loot: () => { for (let i = 0; i < 4; i++) tone(1200 + i * 200, 0.05, { vol: 0.25, delay: i * 0.05 }); },
      death: () => { tone(220, 1.3, { type: 'sawtooth', vol: 0.6, slide: 0.2 }); noise(1.0, { vol: 0.45, freq: 350, delay: 0.1 }); },
      win: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.3, { type: 'triangle', vol: 0.5, delay: i * 0.1 })); },
    };
  })();

  // ---------------- Canvas & layout ----------------
  const cv = document.getElementById('screen');
  const g = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  let L = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    computeLayout();
  }

  function computeLayout() {
    const gd = (st.mode === 'play' && st.lv) ? { cols: st.lv.cols, rows: st.lv.rows } : { cols: 4, rows: 4 };
    const gw = gd.cols * TILE_W + (gd.cols - 1) * GAP_X;
    const gh = gd.rows * TILE_H + (gd.rows - 1) * GAP_Y;
    const wc = Math.max(gw, MIN_CONTENT_W);
    const hc = BOARD_Y + gh + 3;
    g.font = `400 100px ${FONT}`;
    const ratio = (g.measureText('M').width / 100) || 0.6;
    const gutter = 12;
    let fs = Math.min((W - 2 * gutter) / (wc * ratio), (H - 2 * gutter) / (hc * LINE_H));
    fs = Math.max(7, Math.min(26, fs));
    const cw = fs * ratio, chh = fs * LINE_H;
    L = {
      fs, cw, chh, wc, hc, gw, gh,
      gx: Math.floor((wc - gw) / 2),
      cols: gd.cols, rows: gd.rows,
      ox: Math.round((W - wc * cw) / 2),
      oy: Math.round((H - hc * chh) / 2),
    };
  }
  const pxX = cx => L.ox + cx * L.cw + L.cw / 2;
  const pxY = cy => L.oy + cy * L.chh + L.chh / 2;
  const tileOrigin = t => ({ tx: L.gx + t.col * (TILE_W + GAP_X), ty: BOARD_Y + t.row * (TILE_H + GAP_Y) });
  const tileCenter = t => { const { tx, ty } = tileOrigin(t); return { x: pxX(tx + (TILE_W - 1) / 2), y: pxY(ty + (TILE_H - 1) / 2) }; };

  // ---------------- State ----------------
  const params = new URLSearchParams(location.search);
  const urlSeed = cleanSeed(params.get('seed'));

  const st = {
    mode: 'title',          // title | map | play | panel | over
    seed: urlSeed || newSeed(),
    practice: !!urlSeed,
    run: null,              // the current run (map, integrity, credits, items, mods)
    corp: null,             // the corp being hacked
    lv: null,               // the current layer
    panelFn: null,          // builds the lines for panel screens
    busy: true,
    hover: -1, hoverBtn: null, hoverNode: null, hoverItem: -1,
    mapSel: null,
    timer: null,
    msg: '', msgCol: C.text, msgT: 0,
    boardStart: 0,
    hideBoard: false, hideAll: false,
    debug: false,           // show the real node (dev menu)
    dev: false,             // dev menu open
    devAccess: params.get('dev') === '1',
    result: null,
    transitioning: false,
  };
  const has = key => !!(st.run && st.run.mods.includes(key));

  // ---------------- Effects ----------------
  const parts = [];
  const shakeFx = { amp: 0, t0: 0, dur: 1 };
  const flashFx = { col: '#fff', a: 0, t0: 0, dur: 1 };
  const rand = (a, b) => a + Math.random() * (b - a);

  function shake(amp, dur = 0.35) { Object.assign(shakeFx, { amp: amp * L.fs / 16, t0: performance.now(), dur }); }
  function flash(col, a, dur = 0.3) { Object.assign(flashFx, { col, a, t0: performance.now(), dur }); }

  function snapshot(filter) {
    return buildScene(performance.now(), false)
      .filter(filter)
      .map(c => ({ ch: c.ch, x: pxX(c.cx), y: pxY(c.cy), col: c.col }));
  }
  const inBoard = c => c.cy >= BOARD_Y && c.cy < BOARD_Y + L.gh;

  function explode(cells, ox, oy, { col = null, power = 1, grav = 1, life = [0.7, 1.3] } = {}) {
    const k = L.fs / 16;
    for (const c of cells) {
      const dx = c.x - ox, dy = c.y - oy, d = Math.hypot(dx, dy) || 1;
      const sp = rand(220, 600) * power * k;
      parts.push({
        mode: 'explode', ch: c.ch, x: c.x, y: c.y, col: col || c.col,
        vx: dx / d * sp + rand(-60, 60) * k,
        vy: dy / d * sp - rand(80, 320) * power * k,
        rot: 0, vr: rand(-9, 9), g: grav,
        t: 0, life: rand(life[0], life[1]), alpha: 1, scr: 5,
      });
    }
  }

  // All characters get pulled straight into one point.
  function implode(cells, cx, cy) {
    let maxR = 1;
    for (const c of cells) maxR = Math.max(maxR, Math.hypot(c.x - cx, c.y - cy));
    for (const c of cells) {
      const dx = c.x - cx, dy = c.y - cy, r0 = Math.hypot(dx, dy), q = r0 / maxR;
      parts.push({
        mode: 'implode', ch: c.ch, x: c.x, y: c.y, col: c.col, cx, cy, r0,
        a0: Math.atan2(dy, dx),
        t: -Math.random() * 0.08, life: 0.45 + 0.35 * q + Math.random() * 0.1,
        rot: 0, alpha: 1, scr: 6,
      });
    }
  }

  // Characters stay in place, glitch, and blink out one by one at random.
  function glitchOut(cells, dur = 1.3) {
    for (const c of cells) {
      parts.push({
        mode: 'glitch', ch: c.ch, x: c.x, y: c.y, x0: c.x, y0: c.y, col: c.col, base: c.col,
        t: 0, life: 0.15 + Math.random() * dur, rot: 0, alpha: 1, scr: 0,
      });
    }
  }

  function updateParts(dt) {
    const grav = 1500 * L.fs / 16;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      if (p.t < 0) continue;
      const k = Math.min(1, p.t / p.life);
      if (p.mode === 'glitch') {
        const r = Math.random();
        if (r < 0.12) p.ch = NOISE[Math.floor(Math.random() * NOISE.length)];
        p.x = r < 0.06 ? p.x0 + rand(-2, 2) * L.cw : p.x0;
        p.col = Math.random() < 0.1 ? C.red : p.base;
        if (p.t >= p.life) parts.splice(i, 1);
        continue;
      }
      if (p.mode === 'implode') {
        const e = k * k, r = p.r0 * (1 - e);
        p.x = p.cx + Math.cos(p.a0) * r; p.y = p.cy + Math.sin(p.a0) * r;
        if (e > 0.35) p.col = C.cyan;
        p.alpha = k > 0.8 ? (1 - k) / 0.2 : 1;
      } else {
        p.vy += grav * p.g * dt;
        p.vx *= 1 - 0.8 * dt;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.rot += p.vr * dt;
        p.alpha = k > 0.6 ? Math.max(0, (1 - k) / 0.4) : 1;
      }
      if (Math.random() < p.scr * dt) p.ch = NOISE[Math.floor(Math.random() * NOISE.length)];
      if (p.t >= p.life) parts.splice(i, 1);
    }
  }

  // ---------------- Scene ----------------
  let hits = [];
  const pad2 = n => String(n).padStart(2, '0');
  const rule = w => '- '.repeat(Math.ceil(w / 2)).slice(0, w);
  const decodeDelay = (cx, cy) => 40 + ((((Math.round(cx * 2) + 1) * 374761393) ^ ((Math.round(cy * 2) + 1) * 668265263)) >>> 0) % 380;

  function buildScene(now, collectHits) {
    const cells = [];
    const put = (cx, cy, str, col, own = 'hud', bold = false) => {
      for (let k = 0; k < str.length; k++) {
        if (str[k] !== ' ') cells.push({ ch: str[k], cx: cx + k, cy, col, own, bold });
      }
    };
    const putC = (cy, str, col, own) => put(Math.floor((L.wc - str.length) / 2), cy, str, col, own);
    const putR = (cy, str, col, own) => put(L.wc - str.length, cy, str, col, own);
    const addHit = (cx, cy, w, h, hit) => {
      if (!collectHits) return;
      let x = L.ox + cx * L.cw, y = L.oy + cy * L.chh, pw = w * L.cw, ph = h * L.chh;
      if (ph < 40) { y -= (40 - ph) / 2; ph = 40; }   // finger-sized tap targets
      if (pw < 40) { x -= (40 - pw) / 2; pw = 40; }
      hits.push(Object.assign({ x, y, w: pw, h: ph }, hit));
    };
    const button = (cy, label, id, onTap, disabled = false) => {
      const cx = Math.floor((L.wc - label.length) / 2);
      const col = disabled ? C.dim : st.hoverBtn === id ? C.cyan : C.bright;
      put(cx, cy, label, col, 'ui');
      if (!disabled) addHit(cx, cy, label.length, 1, { kind: 'btn', id, onTap });
    };
    const ctx = { now, put, putC, putR, addHit, button };

    if (st.hideAll) return cells;
    const run = st.run;

    // Header
    put(0, 0, 'BETA_RUNNER', C.cyan);
    put(12, 0, `// ${VERSION}`, C.dim);
    const snd = save.muted ? '[SND OFF]' : '[SND ON ]';
    put(L.wc - snd.length, 0, snd, st.hoverBtn === 'snd' ? C.cyan : C.mid, 'ui');
    addHit(L.wc - snd.length, 0, snd.length, 1, { kind: 'btn', id: 'snd', onTap: toggleMute });
    if (st.devAccess || st.dev) {
      const dx = L.wc - snd.length - 6;
      put(dx, 0, '[DEV]', st.dev || st.hoverBtn === 'dev' ? C.cyan : C.mid, 'ui');
      addHit(dx, 0, 5, 1, { kind: 'btn', id: 'dev', onTap: toggleDev });
    }
    put(0, 1, rule(L.wc), C.dim);

    // HUD
    if (run && st.mode !== 'title') {
      put(0, 2, 'LAYER ', C.mid); put(6, 2, pad2(run.depth), C.bright);
      const cur = Math.max(0, run.integrity);
      const bar = '[' + '#'.repeat(cur) + '-'.repeat(Math.max(0, run.maxInt - cur)) + ']';
      putR(2, bar, cur <= 1 ? C.red : C.cyan);
      put(L.wc - bar.length - 10, 2, 'INTEGRITY', C.mid);
      if (run.shield) put(L.wc - bar.length - 10 - 3 - String(run.shield).length, 2, `FW${run.shield}`, C.cyan);

      let where = 'OVERWORLD';
      if (st.mode === 'play' && st.corp) {
        const c = st.corp;
        const prog = c.hasBoss ? (st.lv && st.lv.boss ? 'BOSS' : `${c.idx + 1}/${c.counts.length - 1}`) : '';
        where = `${c.def.name} ${prog}`;
      } else if (st.mode === 'panel') where = st.panelTitle || '';
      put(0, 3, where, st.lv && st.lv.boss && st.mode === 'play' ? C.red : C.text);
      putR(3, `CR ${run.credits}`, C.gold);
    } else {
      put(0, 2, 'LAYER ', C.mid); put(6, 2, '--', C.bright);
      putR(3, `BEST ${pad2(save.best)}`, C.mid);
      put(0, 3, 'SEED ', C.mid); put(5, 3, st.seed.slice(0, 10), C.text);
    }
    put(0, 4, rule(L.wc), C.dim);

    // Row 5: odds in a layer, seed elsewhere
    if (st.mode === 'play' && st.lv) {
      const cand = candidates().length;
      const open = st.lv.tiles.filter(t => t.state === 'closed').length;
      put(0, 5, 'OPEN ', C.mid); put(5, 5, `${pad2(open)}/${pad2(st.lv.n)}`, C.text);
      if (cand > 0) {
        const pct = Math.round(100 / cand);
        const col = cand === 1 ? C.cyan : pct < 25 ? C.red : C.text;
        const val = `1 IN ${cand}  ${String(pct).padStart(3)}%`;
        putR(5, val, col);
        put(L.wc - val.length - 5, 5, 'ODDS', C.mid);
      }
    } else if (run && st.mode !== 'title') {
      put(0, 5, 'SEED ', C.mid); put(5, 5, run.seed.slice(0, 10), C.text);
      if (run.practice) putR(5, 'PRACTICE', C.redDim);
    }

    if (st.msg) put(0, 6, st.msg.slice(0, Math.floor((now - st.msgT) / 16)), st.msgCol);

    // Row 7: clock or boss warning
    if (st.mode === 'play' && st.lv) {
      if (st.timer) {
        const w = 20, f = Math.max(0, st.timer.left / st.timer.max);
        const fill = Math.ceil(f * w);
        const low = st.timer.left <= 3;
        put(0, 7, 'CLOCK ', C.mid);
        put(6, 7, '[' + '='.repeat(fill) + ' '.repeat(w - fill) + ']', low ? C.red : C.text);
        put(6 + w + 3, 7, `${Math.ceil(st.timer.left)}s`, low ? C.red : C.text);
      } else if (st.lv.boss) {
        put(0, 7, '!! ' + st.corp.def.bossDesc, C.redDim);
      }
    }

    // Board
    const boardEnd = BOARD_Y + L.gh;
    if (st.dev) buildTextBoard(ctx, devLines());
    else if (!st.hideBoard) {
      if (st.mode === 'play' && st.lv) buildBoard(ctx);
      else if (st.mode === 'map') buildMap(ctx);
      else buildTextBoard(ctx, panelLines());
    }

    // Footer: mods on the rule line, belt below
    const fr = rule(L.wc);
    if (run && run.mods.length && st.mode !== 'title') {
      const label = ` MODS ${run.mods.map(m => MODS[m].short).join(' ')} `;
      put(0, boardEnd + 1, fr.slice(0, 2), C.dim);
      put(2, boardEnd + 1, label, C.mid);
      put(2 + label.length, boardEnd + 1, fr.slice(2 + label.length), C.dim);
    } else put(0, boardEnd + 1, fr, C.dim);
    buildFooter(ctx, boardEnd + 2);

    // Board characters "decode" in when a layer or screen appears.
    const age = now - st.boardStart;
    if (age < 500) {
      for (const c of cells) {
        if (c.cy >= BOARD_Y && c.cy < boardEnd && age < decodeDelay(c.cx, c.cy)) {
          c.ch = NOISE[Math.floor(Math.random() * NOISE.length)];
          c.col = C.dim;
        }
      }
    }
    return cells;
  }

  function buildFooter({ put, addHit }, y) {
    const run = st.run;
    if (run && (st.mode === 'play' || st.mode === 'map' || st.mode === 'panel') && run.items.length) {
      run.items.forEach((key, i) => {
        const label = `[${ITEMS[key].name}]`;
        const ok = canUse(key);
        put(i * 8, y, label, st.hoverItem === i && ok ? C.cyan : ok ? C.bright : C.mid, 'ui');
        addHit(i * 8, y, label.length, 1, { kind: 'item', i });
      });
      return;
    }
    const hint = st.mode === 'play' ? 'tap a node to probe it.'
      : st.mode === 'map' ? 'pick your next target.'
      : st.mode === 'title' ? 'tap [ JACK IN ] to start.'
      : st.mode === 'over' ? 'R = retry seed   ENTER = new run' : '';
    put(0, y, hint, C.dim);
  }

  function buildBoard({ now, put, addHit }) {
    const lv = st.lv;
    const used = new Set();
    const masked = lv.maskAt && now > lv.maskAt;
    lv.tiles.forEach((t, i) => {
      used.add(t.cell);
      const { tx, ty } = tileOrigin(t);
      if (t.state === 'closed') addHit(tx, ty, TILE_W, TILE_H, { kind: 'tile', i });
      if (t.hidden) return;
      const own = 't' + i;
      // A node you hit stays on the board, bold and red.
      if (t.state === 'locked' && t.lockedBy === 'hit') {
        const fresh = now - t.hitAt < 220;   // brief glitch right after the hit
        const glyphCol = t.loaded ? C.gold : C.red;
        let bottom = '+-----+';
        if (t.dist != null) {   // tracer distance, centered in the bottom edge
          const tag = `<${t.dist}>`, left = Math.floor((5 - tag.length) / 2);
          bottom = '+' + ('-'.repeat(left) + tag).padEnd(5, '-') + '+';
        }
        let rows = ['+-----+', ...t.glyph.map(l => '|' + l + '|'), bottom];
        if (fresh) rows = rows.map(r => r.replace(/[^ ]/g, ch => Math.random() < 0.6 ? NOISE[Math.floor(Math.random() * NOISE.length)] : ch));
        rows.forEach((r, k) => {
          const isEdge = k === 0 || k === rows.length - 1;
          put(tx, ty + k, r[0], C.red, own, true);
          put(tx + 1, ty + k, r.slice(1, TILE_W - 1), isEdge ? (t.dist != null && !fresh ? C.bright : C.red) : glyphCol, own, true);
          put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], C.red, own, true);
        });
        return;
      }
      if (t.state === 'locked') {
        put(tx, ty, '.     .', C.dim, own);
        put(tx + 2, ty + 2, 'ICE', C.redDim, own);
        if (t.dist != null) put(tx + 2, ty + 3, `<${t.dist}>`, C.text, own);
        put(tx, ty + 4, '.     .', C.dim, own);
        return;
      }
      let solid = false, fc = C.mid, gc = C.text;
      if (t.loaded) { fc = C.redDim; gc = C.gold; }
      if (t.ruledOut) { fc = C.dim; gc = C.dim; }
      if (t.state === 'safe' || t.state === 'reveal') { solid = true; fc = C.cyan; gc = C.cyan; }
      else if (t.probing || (i === st.hover && !st.busy)) { solid = true; fc = C.bright; if (!t.loaded) gc = C.bright; }
      const edge = solid ? '+-----+' : '+- - -+';
      const side = solid ? '|' : ':';
      const glyph = masked && t.state === 'closed' && !t.loaded ? MASK_GLYPH : t.glyph;
      let rows = [edge, ...glyph.map(l => side + l + side), edge];
      if (t.probing) {
        rows = rows.map(r => r.replace(/[^ ]/g, ch => Math.random() < 0.5 ? NOISE[Math.floor(Math.random() * NOISE.length)] : ch));
      }
      rows.forEach((r, k) => {
        const isEdge = k === 0 || k === rows.length - 1;
        put(tx, ty + k, r[0], fc, own);
        put(tx + 1, ty + k, r.slice(1, TILE_W - 1), isEdge ? fc : gc, own);
        put(tx + TILE_W - 1, ty + k, r[TILE_W - 1], fc, own);
      });
      if (st.debug && t.safe && t.state === 'closed') put(tx + TILE_W - 1, ty, '*', C.cyan, own);
    });
    for (let cell = 0; cell < lv.cols * lv.rows; cell++) {
      if (used.has(cell)) continue;
      const { tx, ty } = tileOrigin({ col: cell % lv.cols, row: Math.floor(cell / lv.cols) });
      put(tx + 3, ty + 2, '.', C.dim, 'dot');
    }
  }

  // Map: final node at the top, start at the bottom. Edges are dotted lines.
  const mapPos = n => {
    const mid = Math.floor(L.wc / 2);
    return { x: n.lane === 1 || n.step === 0 || n.step === MAP_STEPS - 1 ? mid : mid + (n.lane - 1) * 11, y: BOARD_Y + 1 + (MAP_STEPS - 1 - n.step) * 3 };
  };

  function buildMap({ now, put, addHit, putC, button }) {
    const run = st.run, map = run.map;
    const avail = new Set(availableNodes());
    const nodes = Object.values(map);

    for (const n of nodes) {
      for (const id of n.next) {
        const m = map[id], a = mapPos(n), b = mapPos(m);
        const vi = run.visited.indexOf(n.id);
        const onPath = vi >= 0 && run.visited[vi + 1] === m.id;
        const live = run.at === n.id && avail.has(m.id);
        const col = onPath ? C.cyan : live ? C.mid : C.dim;
        const steps = 6;
        for (let k = 1; k < steps; k++) {
          const f = k / steps;
          put(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, '·', col, 'map');
        }
      }
    }
    for (const n of nodes) {
      const p = mapPos(n);
      const visited = run.visited.includes(n.id), available = avail.has(n.id);
      const sel = st.mapSel === n.id, hov = st.hoverNode === n.id;
      let col = visited ? C.cyan : C.dim;
      if (available) col = sel || hov ? C.cyan : (Math.floor(now / 500) % 2 ? C.bright : C.text);
      put(p.x - 1, p.y, `[${nodeLetter(n)}]`, col, 'map');
      if (sel) { put(p.x - 3, p.y, '>', C.cyan, 'map'); put(p.x + 3, p.y, '<', C.cyan, 'map'); }
      else if (run.at === n.id) put(p.x - 3, p.y, '@', C.bright, 'map');
      if (available) addHit(p.x - 1, p.y, 3, 1, { kind: 'node', id: n.id });
    }

    // Info panel under the map
    const y0 = BOARD_Y + 1 + (MAP_STEPS - 1) * 3 + 2;
    const id = st.mapSel || (avail.has(st.hoverNode) ? st.hoverNode : null);
    if (!id) {
      putC(y0, 'choose a target.', C.text, 'map');
      putC(y0 + 2, 'P S C M = corps   ! = final', C.dim, 'map');
      putC(y0 + 3, '$ = market  ? = cache  + = repair', C.dim, 'map');
      return;
    }
    const info = nodeInfo(map[id]);
    info.lines.forEach((ln, k) => putC(y0 + k, ln.text, ln.col, 'map'));
    if (st.mapSel) button(y0 + 4, info.action, 'enter', () => enterNode(map[st.mapSel]));
  }

  function nodeInfo(n) {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    if (n.type === 'corp' || n.type === 'final' || n.type === 'start') {
      const d = corpDef(n.corp);
      T(n.tier ? `${d.name} // TIER ${n.tier}` : d.name, n.type === 'final' ? C.red : C.cyan);
      T(d.intel, C.text);
      T(d.rules, C.mid);
      if (d.bossDesc) T(d.bossDesc, C.redDim);
      return { lines, action: n.type === 'start' ? '[ JACK IN ]' : '[ BREACH ]' };
    }
    if (n.type === 'shop') { T('BLACK MARKET', C.gold); T('items and mods for credits.'); }
    if (n.type === 'cache') { T('DATA CACHE', C.gold); T('unguarded loot. probably.'); }
    if (n.type === 'repair') { T('SAFEHOUSE', C.cyan); T(`restore ${CONFIG.repairAmount} integrity.`); }
    return { lines, action: '[ ENTER ]' };
  }

  // Centered text screens: title, panels, game over.
  function buildTextBoard({ putC, button }, lines) {
    const y0 = BOARD_Y + Math.max(0, Math.floor((L.gh - lines.length) / 2));
    lines.forEach((ln, k) => {
      if (ln.id) button(y0 + k, ln.text, ln.id, ln.onTap, ln.disabled);
      else if (ln.text) putC(y0 + k, ln.text, ln.col, 'board');
    });
  }

  function panelLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    if (st.mode === 'title') {
      T('B E T A _ R U N N E R', C.cyan);
      T('network intrusion // prototype', C.dim);
      T('');
      T('pick a route through the net.');
      T('every corp hides its real node');
      T('in its own way. learn the tell.');
      T('');
      T('first-try picks restore integrity.');
      T('$ nodes are ICE, but carry loot.');
      T('');
      B('[ JACK IN ]', 'start', jackIn);
      T('');
      T(`best ${pad2(save.best)}   runs ${save.runs}   wins ${save.wins}`, C.mid);
      if (st.practice) T('custom seed: practice run', C.redDim);
      return lines;
    }
    if (st.mode === 'over' && st.result) {
      const r = st.result;
      if (r.win) { T('ROOT ACCESS GRANTED', C.cyan); T('OMNI//CORE is yours.', C.text); }
      else T('CONNECTION TERMINATED', C.red);
      T('');
      T(`layers ${pad2(r.depth)}   corps ${r.corps}`, C.bright);
      T(`credits earned ${r.earned}`, C.gold);
      if (r.newBest) T('** new best **', C.cyan);
      else T(`best ${pad2(save.best)}`, C.mid);
      if (r.practice) T('practice run: not scored', C.redDim);
      T('');
      T(`seed ${r.seed}`, C.mid);
      T('');
      B('[ RETRY SEED ]', 'retry', retry);
      T('');
      B('[  NEW  RUN  ]', 'new', newRun);
      T('');
      T('retry = practice, not scored', C.dim);
      return lines;
    }
    if (st.mode === 'panel' && st.panelFn) st.panelFn(T, B);
    return lines;
  }

  // ---------------- Render loop ----------------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    updateParts(dt);
    updateTimer(dt);
    render(now);
    requestAnimationFrame(frame);
  }

  function render(now) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.bg;
    g.fillRect(0, 0, W, H);
    const sk = (now - shakeFx.t0) / 1000;
    if (sk < shakeFx.dur) {
      const a = shakeFx.amp * (1 - sk / shakeFx.dur);
      g.translate(rand(-a, a), rand(-a, a));
    }
    hits = [];
    const cells = buildScene(now, true);
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (const bold of [false, true]) {
      g.font = `${bold ? 700 : 400} ${L.fs}px ${FONT}`;
      for (const c of cells) {
        if (!!c.bold !== bold) continue;
        g.fillStyle = c.col;
        g.fillText(c.ch, pxX(c.cx), pxY(c.cy));
      }
    }
    g.font = `400 ${L.fs}px ${FONT}`;
    for (const p of parts) {
      if (p.t < 0) continue;
      g.globalAlpha = Math.max(0, p.alpha);
      g.fillStyle = p.col;
      if (p.rot) { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillText(p.ch, 0, 0); g.restore(); }
      else g.fillText(p.ch, p.x, p.y);
    }
    g.globalAlpha = 1;
    const fk = (now - flashFx.t0) / 1000;
    if (fk < flashFx.dur) {
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.globalAlpha = flashFx.a * (1 - fk / flashFx.dur);
      g.fillStyle = flashFx.col;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }
  }

  // ---------------- Helpers ----------------
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function setMsg(msg, col = C.text) { st.msg = msg; st.msgCol = col; st.msgT = performance.now(); }
  const candidates = () => st.lv ? st.lv.tiles.filter(t => t.state === 'closed' && !t.loaded && !t.ruledOut) : [];

  function availableNodes() {
    const run = st.run;
    if (!run) return [];
    return run.at ? run.map[run.at].next : ['0:1'];
  }

  // Pull the board into a point, then hide it.
  async function collapseBoard(x, y) {
    const cells = snapshot(inBoard);
    st.hideBoard = true;
    implode(cells, x, y);
    Sound.implode();
    await wait(700);
  }

  function showBoard(mode) {
    st.mode = mode;
    st.hideBoard = false; st.hideAll = false;
    computeLayout();
    st.boardStart = performance.now();
  }

  // ---------------- Run flow ----------------
  function showTitle() {
    st.run = null;
    showBoard('title');
    st.busy = false;
    setMsg('> link ready_');
  }

  async function startRun(seed, practice) {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await collapseBoard(W / 2, pxY(BOARD_Y + L.gh / 2));
    st.seed = seed; st.practice = practice;
    st.run = {
      seed, practice,
      map: genMap(seed),
      finalTell: pickR(['corner', 'mark', 'mirror'], rngFor(seed, 'final')),
      at: null, visited: [],
      integrity: CONFIG.startIntegrity, maxInt: CONFIG.startIntegrity, shield: 0,
      credits: 0, earned: 0, items: [], mods: [],
      depth: 0, corps: 0,
    };
    st.result = null;
    st.transitioning = false;
    toMap();
  }

  function toMap() {
    st.corp = null; st.lv = null; st.timer = null;
    st.mapSel = null; st.hoverNode = null;
    showBoard('map');
    st.busy = false;
    setMsg(st.run.at ? '> choose your next target.' : '> enter the public net.');
  }

  function selectNode(id) {
    if (st.transitioning || !availableNodes().includes(id)) return;
    if (st.mapSel === id) return enterNode(st.run.map[id]);
    st.mapSel = id;
    Sound.ui();
  }

  async function enterNode(node) {
    if (st.transitioning || !node || !availableNodes().includes(node.id)) return;
    st.transitioning = true;
    const run = st.run;
    const p = mapPos(node);
    await collapseBoard(pxX(p.x), pxY(p.y));
    run.at = node.id;
    run.visited.push(node.id);
    st.transitioning = false;
    if (node.type === 'shop') return openShop(node);
    if (node.type === 'cache') return openCache(node);
    if (node.type === 'repair') return openRepair();
    startCorp(node);
  }

  function startCorp(node, startIdx = 0) {
    const def = corpDef(node.corp);
    const t = node.tier;
    const counts = node.type === 'start' ? [1] : [t + 1, t + 2, t + 3, t + 4];
    st.corp = {
      def, node, tier: t, idx: Math.min(startIdx, counts.length - 1), counts,
      hasBoss: node.type !== 'start',
      tell: node.type === 'final' ? st.run.finalTell : def.tell,
      prevSafe: null,
    };
    enterLayer();
  }

  async function enterLayer() {
    const c = st.corp, run = st.run;
    const n = c.counts[c.idx];
    const boss = c.hasBoss && c.idx === c.counts.length - 1;
    let tell = c.tell;
    if (boss && c.def.bossTell) tell = c.def.bossTell;
    const lv = genLayer({ seed: run.seed, nodeId: c.node.id, idx: c.idx, n, tell, prevSafe: c.prevSafe, loot: !boss && c.hasBoss });
    c.prevSafe = lv.safeCell;
    lv.boss = boss;
    lv.misses = 0;
    lv.split = false;
    lv.dmg = boss && c.def.bossDmg ? c.def.bossDmg : 1;
    if (boss && c.def.bossFlash) lv.maskAt = performance.now() + 450 + CONFIG.maskDelayMs;
    st.lv = lv;
    st.hover = -1;
    run.depth++;
    st.timer = c.def.timer ? { max: c.def.timer, left: c.def.timer, lastSec: c.def.timer } : null;
    showBoard('play');
    st.busy = true;
    if (boss) { Sound.boss(); shake(5, 0.5); setMsg(`> BOSS LAYER. ${n} nodes.`, C.red); }
    else { Sound.layer(run.depth); setMsg(n === 1 ? '> one node. it is real. jack in.' : `> ${n} nodes. one is real.`); }
    await wait(480);
    if (has('sniffer') && n > 1) {
      const opts = lv.tiles.filter(t => !t.safe && !t.loaded && t.state === 'closed');
      if (opts.length) lockTile(pickR(opts, rngFor(run.seed, 'sniff', c.node.id, c.idx)), C.mid);
      await wait(250);
    }
    st.busy = false;
  }

  // Lock a trap tile without damage (sniffer, purge).
  function lockTile(t, col) {
    const i = st.lv.tiles.indexOf(t);
    const { x, y } = tileCenter(t);
    explode(snapshot(c => c.own === 't' + i), x, y, { col, power: 0.6 });
    t.state = 'locked';
    Sound.shield();
  }

  function updateTimer(dt) {
    const tm = st.timer;
    if (!tm || st.mode !== 'play' || st.busy || st.transitioning || st.dev) return;
    tm.left -= dt;
    const sec = Math.ceil(tm.left);
    if (sec < tm.lastSec) { tm.lastSec = sec; if (sec <= 3 && sec > 0) Sound.clock(); }
    if (tm.left <= 0) {
      tm.left = 0;
      const opts = candidates().length ? candidates() : st.lv.tiles.filter(t => t.state === 'closed');
      const t = opts[Math.floor(Math.random() * opts.length)];
      setMsg('> clock ran out.', C.red);
      if (t) pick(st.lv.tiles.indexOf(t));
    }
  }

  function resetTimer() {
    if (!st.timer) return;
    let max = st.corp.def.timer;
    if (st.lv.boss && st.corp.def.bossShrink) max = Math.max(3, max - 3 * st.lv.misses);
    st.timer = { max, left: max, lastSec: max };
  }

  async function pick(i) {
    if (st.mode !== 'play' || st.busy) return;
    const t = st.lv.tiles[i];
    if (!t || t.state !== 'closed') return;
    st.busy = true;
    t.probing = true;
    Sound.probe();
    setMsg('> probing...', C.mid);
    await wait(300);
    t.probing = false;
    if (t.safe) await onSafe(t);
    else await onTrap(t, i);
  }

  function payFor(lv) {
    const c = st.corp;
    let base = 4 + 2 * lv.n;
    if (lv.boss) base *= 3;
    let mult = c.def.pay || 1;
    if (lv.misses === 0 && lv.n > 1) mult *= 1 + 0.5 * (lv.n - 1);
    if (has('skimmer')) mult *= 1.5;
    return lv.n === 1 ? 0 : Math.round(base * mult);
  }

  async function onSafe(t) {
    const run = st.run, lv = st.lv, c = st.corp;
    t.state = 'safe';
    const perfect = lv.misses === 0 && lv.n > 1;
    const pay = payFor(lv);
    run.credits += pay; run.earned += pay;
    let healed = false;
    if (perfect && run.integrity < run.maxInt) { run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.perfectHeal); healed = true; }
    Sound.safe();
    flash(C.cyan, 0.12, 0.3);
    let msg = perfect ? '> perfect.' : '> access granted.';
    if (pay) msg += ` +${pay}cr`;
    if (healed) msg += ' +1 int';
    setMsg(msg, C.cyan);
    await wait(420);
    // The board falls apart, blown outward from the real node.
    const { x, y } = tileCenter(t);
    const cells = snapshot(inBoard);
    st.hideBoard = true;
    explode(cells, x, y, { power: 1.1 });
    Sound.implode();
    await wait(800);
    c.idx++;
    if (c.idx < c.counts.length) return enterLayer();
    // Corp finished
    if (c.node.type === 'start') return toMap();
    run.corps++;
    if (c.node.type === 'final') return endRun(true);
    openReward(c.node);
  }

  async function onTrap(t, i) {
    const run = st.run, lv = st.lv;
    lv.misses++;
    t.state = 'locked';
    t.lockedBy = 'hit';
    t.hitAt = performance.now();
    let msg;
    if (run.shield > 0) {
      run.shield--;
      Sound.shield();
      flash(C.cyan, 0.12, 0.3);
      shake(4);
      msg = '> ICE. firewall absorbed it.';
    } else {
      run.integrity -= lv.dmg;
      Sound.trap();
      shake(9);
      flash(C.red, 0.18, 0.35);
      msg = run.integrity > 0 ? `> ICE. integrity -${lv.dmg}.` : '> ICE. integrity gone.';
    }
    if (t.loaded) msg += ' ' + grantLoot(rngFor(run.seed, 'loot', st.corp.node.id, st.corp.idx), st.corp.tier);
    if (has('tracer')) {
      const s = lv.tiles[lv.safe];
      t.dist = Math.abs(s.col - t.col) + Math.abs(s.row - t.row);
    }
    setMsg(msg, t.loaded ? C.gold : C.red);
    await wait(450);
    if (run.integrity <= 0) return die();
    resetTimer();
    st.busy = false;
  }

  // Credits or an item. Returns a short text for the message line.
  function grantLoot(r, tier) {
    const run = st.run;
    Sound.loot();
    if (r() < 0.4 && run.items.length < CONFIG.beltSlots) {
      const key = pickR(Object.keys(ITEMS), r);
      run.items.push(key);
      return `got ${ITEMS[key].name}.`;
    }
    const cr = Math.round(12 + tier * 8 + r() * 12);
    run.credits += cr; run.earned += cr;
    return `+${cr}cr`;
  }

  async function die() {
    st.busy = true;
    st.timer = null;
    const safeTile = st.lv.tiles[st.lv.safe];
    if (safeTile.state === 'closed') safeTile.state = 'reveal';
    setMsg('> traced. real node revealed.', C.red);
    Sound.death();
    await wait(1100);
    await endRun(false);
  }

  async function endRun(win) {
    const run = st.run;
    st.busy = true;
    st.timer = null;
    const cells = snapshot(() => true);
    st.hideAll = true;
    if (win) { Sound.win(); implode(cells, W / 2, H / 2); flash(C.cyan, 0.3, 0.8); }
    else { glitchOut(cells); flash(C.red, 0.2, 0.4); }
    await wait(1400);

    const newBest = !run.practice && run.depth > save.best;
    if (!run.practice) {
      save.runs++;
      if (win) save.wins++;
      if (newBest) save.best = run.depth;
    }
    save.history.unshift({ seed: run.seed, depth: run.depth, corps: run.corps, win, practice: run.practice, at: Date.now() });
    save.history = save.history.slice(0, 20);
    persist();

    st.result = { win, depth: run.depth, corps: run.corps, earned: run.earned, newBest, practice: run.practice, seed: run.seed };
    st.corp = null; st.lv = null;
    showBoard('over');
    st.busy = false;
    setMsg(win ? '> root access_' : '> link severed_', win ? C.cyan : C.red);
  }

  const jackIn = () => startRun(st.seed, st.practice);
  const retry = () => startRun(st.result ? st.result.seed : st.seed, true);
  const newRun = () => startRun(newSeed(), false);

  // ---------------- Panels: shop, cache, repair, boss reward ----------------
  function openPanel(title, fn, msg) {
    st.panelTitle = title;
    st.panelFn = fn;
    showBoard('panel');
    st.busy = false;
    if (msg) setMsg(msg);
  }

  async function leavePanel() {
    if (st.transitioning) return;
    st.transitioning = true;
    Sound.ui();
    await collapseBoard(W / 2, pxY(BOARD_Y + L.gh / 2));
    st.transitioning = false;
    toMap();
  }

  function addMod(key) {
    const run = st.run;
    if (run.mods.includes(key)) return;
    run.mods.push(key);
    if (key === 'buffer') { run.maxInt++; run.integrity++; }
  }

  function openShop(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'shop', node.id);
    const itemKeys = shuffle(Object.keys(ITEMS), r).slice(0, 3);
    const modOpts = Object.keys(MODS).filter(k => !run.mods.includes(k));
    const offers = itemKeys.map(k => ({ kind: 'item', key: k, price: ITEMS[k].price, sold: false }));
    if (modOpts.length) { const k = pickR(modOpts, r); offers.push({ kind: 'mod', key: k, price: MODS[k].price, sold: false }); }
    offers.push({ kind: 'repair', key: 'repair', price: 20, sold: false });

    const buy = o => {
      if (o.sold || run.credits < o.price) return Sound.deny();
      if (o.kind === 'item') { if (run.items.length >= CONFIG.beltSlots) return Sound.deny(); run.items.push(o.key); o.sold = true; }
      if (o.kind === 'mod') { addMod(o.key); o.sold = true; }
      if (o.kind === 'repair') { if (run.integrity >= run.maxInt) return Sound.deny(); run.integrity++; }
      run.credits -= o.price;
      Sound.buy();
      setMsg(`> bought ${o.kind === 'repair' ? 'repair' : (o.kind === 'item' ? ITEMS[o.key] : MODS[o.key]).name.toLowerCase()}.`, C.gold);
    };

    openPanel('BLACK MARKET', (T, B) => {
      T('BLACK MARKET', C.gold);
      T(`credits ${run.credits}`, C.text);
      T('');
      offers.forEach((o, k) => {
        const def = o.kind === 'item' ? ITEMS[o.key] : o.kind === 'mod' ? MODS[o.key] : { name: 'REPAIR', desc: 'restore 1 integrity.' };
        const tag = o.kind === 'mod' ? 'mod ' : o.kind === 'item' ? 'item' : 'svc ';
        const label = `[ ${def.name.padEnd(7)} ${tag} ${String(o.price).padStart(3)}cr ]`;
        const full = o.kind === 'item' && run.items.length >= CONFIG.beltSlots;
        const maxed = o.kind === 'repair' && run.integrity >= run.maxInt;
        const off = o.sold || run.credits < o.price || full || maxed;
        B(o.sold ? `[ ${'SOLD'.padEnd(22)} ]` : label, 'offer' + k, () => buy(o), off);
        T(def.desc, C.dim);
      });
      T('');
      B('[ LEAVE ]', 'leave', leavePanel);
      return [];
    }, '> the market is open.');
  }

  function openCache(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'cache', node.id);
    let got;
    const modOpts = Object.keys(MODS).filter(k => !run.mods.includes(k));
    if (r() < 0.2 && modOpts.length) { const k = pickR(modOpts, r); addMod(k); got = [`mod: ${MODS[k].name}`, MODS[k].desc]; Sound.loot(); }
    else got = [grantLoot(r, 2), ''];
    openPanel('DATA CACHE', (T, B) => {
      T('DATA CACHE', C.gold);
      T('');
      T(got[0], C.bright);
      if (got[1]) T(got[1], C.dim);
      T('');
      B('[ CONTINUE ]', 'leave', leavePanel);
      return [];
    }, '> cache cracked.');
  }

  function openRepair() {
    const run = st.run;
    const before = run.integrity;
    run.integrity = Math.min(run.maxInt, run.integrity + CONFIG.repairAmount);
    Sound.buy();
    openPanel('SAFEHOUSE', (T, B) => {
      T('SAFEHOUSE', C.cyan);
      T('');
      T(`integrity +${run.integrity - before}`, C.bright);
      T('');
      B('[ CONTINUE ]', 'leave', leavePanel);
      return [];
    }, '> patched up.');
  }

  function openReward(node) {
    const run = st.run;
    const r = rngFor(run.seed, 'reward', node.id);
    const opts = shuffle(Object.keys(MODS).filter(k => !run.mods.includes(k)), r).slice(0, 2);
    const take = key => {
      if (st.transitioning) return;
      if (key) { addMod(key); Sound.buy(); }
      else { run.credits += 20; run.earned += 20; Sound.loot(); }
      leavePanel();
    };
    Sound.win();
    openPanel('CORP BREACHED', (T, B) => {
      T('CORP BREACHED', C.cyan);
      T(corpDef(node.corp).name, C.text);
      T('');
      T('take one mod:', C.mid);
      T('');
      opts.forEach((k, i) => {
        B(`[ ${MODS[k].name.padEnd(8)} ]`, 'mod' + i, () => take(k));
        T(MODS[k].desc, C.dim);
        T('');
      });
      B('[ SKIP  +20cr ]', 'skip', () => take(null));
      return [];
    }, '> corp breached.');
  }

  // ---------------- Items ----------------
  function canUse(key) {
    const run = st.run;
    if (!run) return false;
    if (key === 'patch') return run.integrity < run.maxInt;
    if (key === 'wall') return true;
    const inLayer = st.mode === 'play' && !st.busy && st.lv;
    if (key === 'purge') return !!inLayer && st.lv.tiles.some(t => t.state === 'closed' && !t.safe);
    if (key === 'split') return !!inLayer && !st.lv.split && candidates().length > 1;
    return false;
  }

  function useItem(slot) {
    const run = st.run;
    if (!run || st.transitioning) return;
    const key = run.items[slot];
    if (!key) return;
    if (!canUse(key)) { Sound.deny(); return; }
    run.items.splice(slot, 1);
    st.hoverItem = -1;
    if (key === 'patch') { run.integrity++; Sound.buy(); setMsg('> patched. +1 int', C.cyan); }
    if (key === 'wall') { run.shield++; Sound.shield(); setMsg('> firewall up.', C.cyan); }
    if (key === 'purge') {
      const lv = st.lv;
      let opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe && !t.loaded);
      if (!opts.length) opts = lv.tiles.filter(t => t.state === 'closed' && !t.safe);
      const r = rngFor(run.seed, 'purge', st.corp.node.id, st.corp.idx, lv.tiles.filter(t => t.state === 'locked').length);
      lockTile(pickR(opts, r), C.cyan);
      setMsg('> purged one ICE node.', C.cyan);
    }
    if (key === 'split') {
      const lv = st.lv, s = lv.tiles[lv.safe];
      const vertical = rngFor(run.seed, 'split', st.corp.node.id, st.corp.idx)() < 0.5;
      for (const t of lv.tiles) {
        const sameHalf = vertical ? (t.col < lv.cols / 2) === (s.col < lv.cols / 2) : (t.row < lv.rows / 2) === (s.row < lv.rows / 2);
        if (!sameHalf) t.ruledOut = true;
      }
      lv.split = true;
      Sound.shield();
      setMsg(`> split: it is in the ${vertical ? (s.col < lv.cols / 2 ? 'left' : 'right') : (s.row < lv.rows / 2 ? 'top' : 'bottom')} half.`, C.cyan);
    }
  }

  function toggleMute() {
    save.muted = !save.muted;
    persist();
    Sound.ui();
  }

  // ---------------- Dev menu ----------------
  // Open with ` (backtick), or the [DEV] button when the URL has ?dev=1.
  // Using cheats on a run marks it as practice, so it doesn't count.
  function toggleDev() {
    if (st.transitioning) return;
    st.dev = !st.dev;
    st.devAccess = true;
    st.boardStart = performance.now();
    Sound.ui();
  }

  function cheat(fn) {
    return () => {
      if (st.run) st.run.practice = true;
      fn();
      Sound.buy();
    };
  }

  function cyclePalette() {
    const keys = Object.keys(PALETTES);
    save.palette = keys[(keys.indexOf(save.palette) + 1) % keys.length];
    applyPalette(save.palette);
    persist();
    Sound.ui();
  }

  // Jump straight to a corp's boss layer.
  function jumpToBoss(node) {
    const run = st.run;
    st.dev = false;
    if (st.mode === 'play' && st.corp && st.corp.hasBoss && !st.lv.boss) {
      st.corp.idx = st.corp.counts.length - 1;
      enterLayer();
      return;
    }
    if (!node) return;
    run.practice = true;
    if (run.at !== node.id) { run.at = node.id; run.visited.push(node.id); }
    startCorp(node, 99);
  }

  function devLines() {
    const lines = [];
    const T = (text, col = C.text) => lines.push({ text, col });
    const B = (text, id, onTap, disabled = false) => lines.push({ text, id, onTap, disabled });
    const run = st.run;
    const idle = !st.busy && !st.transitioning;
    T('DEV MENU', C.cyan);
    T(run ? (run.practice ? 'run is practice (not scored)' : 'cheats mark the run as practice') : 'start a run for cheats', C.dim);
    B(`[ palette: ${PALETTES[save.palette].name.padEnd(9)} ]`, 'pal', cyclePalette);
    B(`[ show real node: ${st.debug ? 'ON ' : 'OFF'} ]`, 'dbg', () => { st.debug = !st.debug; if (run) run.practice = true; Sound.ui(); });
    T('');
    T('mods', C.mid);
    for (const k of Object.keys(MODS)) {
      const on = !!run && run.mods.includes(k);
      B(`[${on ? 'x' : ' '}] ${MODS[k].name.padEnd(8)}`, 'mod_' + k, cheat(() => {
        if (on) { run.mods = run.mods.filter(m => m !== k); if (k === 'buffer') { run.maxInt--; run.integrity = Math.min(run.integrity, run.maxInt); } }
        else addMod(k);
      }), !run);
    }
    T('');
    B('[ +100 credits ]', 'cr', cheat(() => { run.credits += 100; }), !run);
    B('[ full integrity ]', 'hp', cheat(() => { run.integrity = run.maxInt; }), !run);
    B('[ fill belt ]', 'belt', cheat(() => { const keys = Object.keys(ITEMS); let i = 0; while (run.items.length < CONFIG.beltSlots) run.items.push(keys[i++ % keys.length]); }), !run);
    T('');
    const inCorp = st.mode === 'play' && st.corp && st.corp.hasBoss && st.lv && !st.lv.boss;
    const sel = st.mode === 'map' && st.mapSel && run.map[st.mapSel];
    const selCorp = sel && (sel.type === 'corp' || sel.type === 'final') ? sel : null;
    const bossLabel = inCorp ? '[ jump to this boss ]' : selCorp ? `[ jump to ${corpDef(selCorp.corp).letter} boss ]` : '[ jump to boss ]';
    B(bossLabel, 'boss', cheat(() => jumpToBoss(selCorp)), !idle || !(inCorp || selCorp));
    B('[ jump to final boss ]', 'final', cheat(() => jumpToBoss(run.map['5:1'])), !idle || !run || st.mode === 'over');
    if (!inCorp && !selCorp) T('(select a corp on the map first)', C.dim);
    T('');
    B('[ close ]', 'close', toggleDev);
    return lines;
  }

  // ---------------- Input ----------------
  function hitAt(x, y) {
    for (let k = hits.length - 1; k >= 0; k--) {
      const h = hits[k];
      if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
    }
    return null;
  }

  cv.addEventListener('pointerdown', e => {
    Sound.init();
    const h = hitAt(e.clientX, e.clientY);
    if (!h) { if (st.mode === 'map' && !st.dev) st.mapSel = null; return; }
    if (h.kind === 'tile') pick(h.i);
    else if (h.kind === 'node') selectNode(h.id);
    else if (h.kind === 'item') useItem(h.i);
    else if (h.kind === 'btn' && !st.transitioning) h.onTap();
  });

  cv.addEventListener('pointermove', e => {
    const h = hitAt(e.clientX, e.clientY);
    const tile = h && h.kind === 'tile' ? h.i : -1;
    if (tile !== st.hover && tile >= 0 && !st.busy) Sound.tick();
    st.hover = tile;
    st.hoverBtn = h && h.kind === 'btn' ? h.id : null;
    st.hoverNode = h && h.kind === 'node' ? h.id : null;
    st.hoverItem = h && h.kind === 'item' ? h.i : -1;
    cv.style.cursor = h ? 'pointer' : 'default';
  });

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    Sound.init();
    const k = e.key.toLowerCase();
    if (k === 'm') return toggleMute();
    if (e.key === '`') return toggleDev();
    if (st.transitioning || st.dev) return;
    if (/^[1-9]$/.test(e.key) && st.run && st.mode !== 'over') return useItem(Number(e.key) - 1);
    if (st.mode === 'title' && (k === 'enter' || k === ' ')) { e.preventDefault(); jackIn(); }
    else if (st.mode === 'map' && (k === 'enter' || k === ' ') && st.mapSel) { e.preventDefault(); enterNode(st.run.map[st.mapSel]); }
    else if (st.mode === 'over') {
      if (k === 'r') retry();
      else if (k === 'enter' || k === ' ') { e.preventDefault(); newRun(); }
    }
  });

  // ---------------- Boot ----------------
  window.addEventListener('resize', resize);
  applyPalette(save.palette);
  resize();
  showTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`16px "JetBrains Mono"`).then(() => computeLayout()).catch(() => {});
  }

  // Debug hook for the console and automated tests.
  window.__br = { state: st, save, genLayer, genMap, CONFIG, startRun, selectNode, enterNode, pick, useItem, toggleDev, devLines, availableNodes, panelLines };
})();
</script>
